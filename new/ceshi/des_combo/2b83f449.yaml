    description: "门根据位置偏左/偏右决定旋转方向（顺时针/逆时针），产生的垂直柱有列偏移。逐门处理意味着每开一扇门后立即模拟令牌下落，柱的偏移可能影响后续门打开后的路径。"
    existing_code:
      - "D9/0"
    reason: "偏移+逐门处理产生时序依赖：先开的门的偏移柱可能阻挡后开门的通道。边界难度较高但推理链创新度高。"

  - index: 5
