    description: "不同墙行的门用不同颜色，旋转后产生对应颜色的垂直柱。令牌也有多种颜色，不同颜色令牌只能通过匹配颜色的柱形成的通道下落。需要推断颜色匹配规则。"
    existing_code:
      - "D2/1"
      - "D5/3"
    reason: "颜色成为路径选择的关键信号，将原本纯空间的推理升级为空间+颜色双通道推理。人类可从样例中观察颜色对应关系推断规则。"

