task_id: "2b83f449"
combos:
  - index: 1
    combo_spec: "D1/0+D3/0"
    name: "门消失+令牌上升"
    description: "门不旋转而是消失（仅在墙上留下1格宽洞口），令牌不下落而是从管道底部向上穿过洞口上升。令牌从下方管道行出发，经洞口上升，在目标管段远离入口端堆积。原始推理链的'旋转产生柱'和'下落'两步同时反转。"
    existing_code:
      - "D3/0"
    reason: "两个核心机制同时反转，推理链结构性改变；门消失意味着没有颜色6的柱产物，视觉上完全不同于原题。"

  - index: 2
    combo_spec: "D1/0+D4/0"
    name: "门消失+近端堆积"
    description: "门消失留洞口（无垂直柱），令牌正常下落穿过洞口，但在管段靠近入口端（而非远端）堆积。门消失使得垂直通道仅有1格宽（洞口处），堆积方向反转改变输出的空间分布。"
    existing_code:
      - "D4/0"
    reason: "门变换方式改变通道形态，堆积方向反转。两者交互：无柱时'远端/近端'的参考系可能不同。"

  - index: 3
    combo_spec: "D1/1+D3/2"
    name: "十字阻隔+惯性移动"
    description: "门扩展为5像素十字形阻隔物（原位置+上下左右各延伸1格），令牌遵循惯性原则（保持方向直到遇到障碍物被迫改变）。十字阻隔物在管道中创建额外障碍，惯性令牌需要在十字旁改道绕行。"
    existing_code: []
    reason: "十字创造新的拓扑约束，惯性移动在该拓扑中产生非平凡路径；两者缺一不可——无十字则惯性路径简单，无惯性则十字只是静态障碍。"

  - index: 4
    combo_spec: "D1/2+D9/0"
