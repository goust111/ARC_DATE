task_id: "7666fa5d"
combos:
  - index: 1
    combo_spec: "D1/0+D12/0"
    name: "颜色编码配对与多色线段系统"
    description: "不同反对角线上的线段使用不同颜色。填充不再按几何邻近的k值顺序配对，而是按颜色编码规则配对：相同颜色或特定颜色组合的线段之间进行填充，填充色由两侧线段颜色的组合决定（如取较小颜色值）。解题者需同时发现颜色配对规则和颜色→填充色的映射关系。"
    existing_code:
      - "D1/0"
      - "D12/0"
    reason: "D1/0（颜色配对）在单色线段环境中无法真正发挥作用，必须与D12/0（多色线段）结合才有意义。组合后产生全新的"颜色解码+配对+填充色选择"三步推理链，远超任一单变体。"

  - index: 2
    combo_spec: "D2/0+D11/0"
    name: "方向完全反转（主对角线段+反对角线扫描）"
    description: "线段改为沿主对角线方向(r-c=b为常数)排列，填充方向相应变为沿反对角线方向(k=r+c固定)扫描。对每条反对角线，收集活跃的主对角线段并排序，在相邻线段之间填充红色。这是原任务的完全镜像翻转，保持算法结构但所有坐标推理方向互换。"
    existing_code: []
    reason: "D2/0和D11/0在逻辑上互为必要——改变线段方向必须同步改变扫描方向，否则算法无法正确工作。单独改变任一维度会产生不一致，只有组合才是正确的"方向反转"变体。这是一个天然耦合对。"

  - index: 3
    combo_spec: "D3/1+D15/2"
    name: "端点标记线段与异色干扰线段"
    description: "线段的两个端点使用特殊颜色标记（如端点黄色、主体绿色），同时网格中存在另一种颜色的非反对角线方向干扰线段。解题者必须：(1)识别端点标记颜色以确认线段边界；(2)过滤掉非目标颜色的干扰线段；(3)在正确识别的线段之间填充。增加了对象识别和噪声过滤的双重挑战。"
    existing_code: []
    reason: "端点标记提供了正向线索（帮助确认线段边界），而干扰线段是负向干扰（需要排除）。两者结合创造了"利用线索排除干扰"的推理模式，比单独的标记或干扰更有深度。"

  - index: 4
    combo_spec: "D4/1+D5/1"
    name: "交替颜色轮廓填充"
    description: "不填满平行四边形内部，仅绘制连接相邻线段端点的边界轮廓线。不同填充区域的轮廓使用交替颜色（如第一个区域红色轮廓、第二个区域蓝色轮廓）。解题者需理解：(1)如何从线段端点构造封闭轮廓；(2)轮廓颜色的交替模式。"
    existing_code:
      - "D4/1"
      - "D5/1"
    reason: "轮廓填充(D4/1)改变了"填什么"，交替颜色(D5/1)改变了"用什么色填"。组合后产生彩色线框图效果，视觉上与原任务截然不同。"

  - index: 5
    combo_spec: "D5/0+D12/0+D14/0"
    name: "多色线段+同色填充+图例指引"
    description: "不同反对角线使用不同颜色的线段，填充颜色与相邻线段颜色相同（取左侧线段色），网格角落有一个小型图例区域展示颜色对应关系。解题者通过图例理解哪种线段颜色产生哪种填充颜色，然后执行多色填充。三维度协同：D12/0提供多色、D5/0定义填充色规则、D14/0提供解码线索。"
    existing_code:
      - "D12/0"
      - "D14/0"
    reason: "三层协同组合。多色线段(D12/0)单独使用时填充仍为固定红色；同色填充(D5/0)在单色环境中退化为原任务；图例(D14/0)在无多色时是冗余的。三者组合创造了完整的"读图例→识别线段颜色→按规则选填充色"推理链。"

  - index: 6
    combo_spec: "D6/0+D7/0"
    name: "纯填充掩码紧凑裁剪"
    description: "填充完成后移除所有原始线段像素（恢复为背景色），然后将输出裁剪为仅包含填充像素的最小外接矩形。输出是一个小尺寸网格，只包含红色平行四边形填充形状和背景色。解题者需推断：(1)线段之间应该填充什么；(2)线段本身被移除；(3)输出被裁剪。"
    existing_code: []
    reason: "移除源(D6/0)和裁剪(D7/0)各自是简单的后处理，但组合后输出完全不包含输入中的线段信息——解题者只看到纯几何填充形状，必须从输入线段推断出这些形状然后理解裁剪规则。"

  - index: 7
    combo_spec: "D1/2+D3/2"
    name: "端点推断长度排序配对"
    description: "每条线段仅显示两个端点像素（不显示完整线段），填充配对不按k值顺序而是按推断出的线段长度排序。解题者需：(1)识别同色像素对为隐含线段的端点；(2)从端点距离推算线段长度；(3)按长度排序进行配对填充。多步推理链，每步依赖前一步的结果。"
    existing_code:
      - "D1/2"
    reason: "端点表示(D3/2)要求推断隐含线段，长度排序(D1/2)要求计算线段属性。组合后创造了"感知→计算→排序→填充"的四步推理链，远比单独任一变体复杂，但仍可从示例推断。"

  - index: 8
    combo_spec: "D5/1+D8/2"
    name: "距离优先处理+交替色填充"
    description: "从距离最近的线段对开始填充，逐渐处理距离更远的线段对。每一轮使用不同的交替颜色（第一轮红色、第二轮蓝色、第三轮红色...），距离越远的填充区域颜色交替越后。解题者需发现：(1)填充顺序由线段间距决定；(2)颜色按处理轮次交替。"
    existing_code:
      - "D5/1"
      - "D8/2"
    reason: "D8/2的按距离处理本身就暗示多色，与D5/1的交替色自然融合。但组合后的交替顺序由距离决定（而非空间位置），这是一种全新的颜色分配逻辑。"

  - index: 9
    combo_spec: "D9/2+D10/0+D13/0"
    name: "最小间距阈值+单线段+无重叠约束"
    description: "每条反对角线上严格只有一条线段（无分裂），移除b范围重叠硬性要求，但引入最小k值间距阈值——只有k值差超过某个阈值的线段对之间才填充。解题者需发现：(1)只有间距足够大的线段对才产生填充；(2)某些看起来相邻的线段之间不填充。"
    existing_code:
      - "D9/2"
      - "D13/0"
    reason: "三个维度分别放松/收紧不同约束，组合后创造了一个"选择性填充"判断任务——不是所有相邻线段都填充，解题者需同时评估距离和几何重叠条件。"

  - index: 10
    combo_spec: "D2/1+D4/2"
    name: "水平线段+扩展填充至边缘"
    description: "线段改为水平方向（行固定），填充在垂直方向上相邻水平线段之间进行（每列独立），同时在最上方和最下方线段之外也向网格边缘填充。输出呈现垂直条纹状填充图案，从顶部到底部贯穿整个网格。解题者需理解：(1)水平线段定义填充边界；(2)填充不仅在线段之间，还向网格边缘延伸。"
    existing_code:
      - "D4/2"
    reason: "水平线段(D2/1)将对角线推理简化为行列推理，但扩展填充(D4/2)增加了"边界外延伸"的额外规则。组合后的视觉效果与原任务的平行四边形填充完全不同。"

  - index: 11
    combo_spec: "D3/0+D15/0"
    name: "虚线段+孤立噪声像素"
    description: "线段以虚线形式呈现（每隔一个像素留空），同时网格中散布与线段同色的孤立噪声像素。解题者必须：(1)将交替出现的像素识别为虚线段而非多个独立像素；(2)将孤立像素识别为噪声而非线段的一部分。这需要基于空间模式（规则间隔vs随机分布）区分信号与噪声。"
    existing_code: []
    reason: "虚线段(D3/0)和孤立噪声(D15/0)各自增加对象识别难度，但组合后两者形成对抗——虚线段看起来也像"间隔的孤立像素"，解题者必须利用规则性来区分。"

  - index: 12
    combo_spec: "D1/3+D2/3"
    name: "镜像对称配对+混合方向线段"
    description: "网格中同时包含反对角线段和主对角线段，线段以网格中心为对称点成对出现。填充由对称配对的线段之间的空间决定，同方向的对称线段对之间按原规则填充，不同方向的线段交叉处形成特殊图案。解题者需发现中心对称结构和方向分类规则。"
    existing_code: []
    reason: "镜像对称(D1/3)改变配对逻辑，混合方向(D2/3)增加方向多样性。组合后的对称配对在混合方向中更有意义——解题者需在两个方向中寻找对称关系。"
