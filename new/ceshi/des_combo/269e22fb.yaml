  name: 多窗口分散裁剪联合匹配
  description: 输入包含2-3个分离的小矩形裁剪块，每个块单独可能有多个匹配，但所有块联合后唯一确定变体和偏移。解题者需识别各独立小块、理解它们在完整图案中的空间关系、并综合所有块的约束进行联合推理。
  existing_code:
  - D1/0
  - D2/2
