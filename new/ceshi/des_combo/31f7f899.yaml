task_id: "31f7f899"
combos:
  - index: 1
    combo_spec: "D1/2+D4/3"
    name: "降序排列+右起槽位"
    description: "条形按高度降序排序，槽位从右到左排列。最高条放在最右槽位，最矮条放在最左槽位。双重取反同时存在，解题者需判断两层反转的叠加效果——降序+右起的最终视觉结果与原题（升序+左起）完全不同。Input中条形随机排列，output中最高条出现在最右位置且越往左越矮。"
    existing_code:
      - "D1/3"
    reason: "两个inversion维度的叠加形成非平凡交互：解题者可能误以为双反抵消而得出原序，但实际排列不同于原题。测试对双层规则叠加的精确推理能力。"

  - index: 2
    combo_spec: "D1/4+D14/0"
    name: "按面积排序+宽度各异"
    description: "条形具有不同的宽度(1/3/5)和不同的高度，按总像素面积(宽度x高度)排序分配到槽位。面积最小的条放在最左槽位。由于宽度各不相同，面积排序结果可能与纯高度排序不同（例如宽5高3=面积15 vs 宽1高11=面积11）。槽位保持原色，条形重着色。"
    existing_code: []
    reason: "D1/4（按面积排序）要求D14/0（宽度各异）才能真正发挥作用——如果所有条形宽度相同，面积排序退化为高度排序。两者结合才产生真正的面积推理挑战，是必要交互关系。"

  - index: 3
    combo_spec: "D1/3+D14/0"
    name: "按宽度排序+宽度多样化"
    description: "条形有不同宽度(1/3/5)，按宽度而非高度排序分配到槽位。最窄条放最左槽位。条形可能高度各异，但高度是干扰信息——排序键是宽度。解题者需从样例中识别出宽度才是决定排列的关键属性，忽略更显眼的高度差异。"
    existing_code:
      - "D1/3"
    reason: "D1/3（按宽度排序）必须搭配D14/0（宽度各异）才有意义。单独D1/3在所有条形等宽时无法排序。"

  - index: 4
    combo_spec: "D3/1+D5/2"
    name: "十字形精灵+旋转放入"
    description: "源对象是十字形(+形)而非矩形条，按臂长排序后，将十字形旋转90度再放入槽位并重着色为槽位颜色。解题者需理解：(1)十字形的尺寸由臂长定义，(2)旋转后的形状如何映射到槽位空间。"
    existing_code:
      - "D5/2"
    reason: "形状变换(src)+几何变换(transform)的交互：十字形旋转90度后的几何特性与矩形条完全不同，产生新的空间推理模式。"

  - index: 5
    combo_spec: "D3/0+D13/0"
    name: "非对称条+单向柱状图"
    description: "条形只向基线上方延伸(非对称条形)且上下延伸不等。由于条形仅在基线上方，排序键自然为上方延伸高度。视觉上呈现柱状图形式，解题者需识别柱状图排序模式。"
    existing_code:
      - "D13/0"
    reason: "D3/0和D13/0在概念上高度相关——都涉及打破基线对称性。组合后形成一致的单向柱状图视觉模式，比单独任一变体更自然，也更接近现实世界的柱状图排序问题。"

  - index: 6
    combo_spec: "D5/0+D8/0"
    name: "保持源色+保留源位置"
    description: "条形移动到目标槽位后保持自身原始颜色(不重着色)，同时原始位置的条形也保留不变(keep_source)。输出中同时出现两套条形——原位和排序后位置各一套，且颜色相同。解题者需区分哪套是排序结果、哪套是原始位置（通过高度排列的有序性判断）。"
    existing_code: []
    reason: "保持源色+保留源位置的组合使得追踪哪个条去了哪里变得极具挑战——没有颜色变化可追踪，只有空间位置和高度排列的有序性作为线索。"

  - index: 7
    combo_spec: "D1/5+D6/0"
    name: "垂直基线+行对齐匹配"
    description: "基线从水平变为垂直，条形变为水平条向左右延伸。匹配条件变为行对齐——每个水平条上有特殊标记像素，目标槽位旁有同列位置的标记，条形需移动到标记列对齐的槽位。整个任务空间旋转90度的同时匹配逻辑也从排序变为空间对齐。"
    existing_code:
      - "D1/5"
      - "D6/0"
    reason: "空间方向旋转(D6/0)与匹配条件(D1/5)的深度交互：在垂直基线场景下，行对齐概念需要重新解释为列对齐，解题者需同时适应空间框架的旋转和匹配规则的语义转换。"

  - index: 8
    combo_spec: "D4/2+D7/1"
    name: "紧凑裁剪输出+输出裁剪为条形区域"
    description: "排序后的条形输出为紧凑裁剪，且网格裁剪到最小外接矩形。两者叠加意味着输出与输入的grid尺寸完全不同，且所有空白边距都被移除。解题者需同时完成排序推理和输出格式推断——输入是带大量空白的正方形，输出是紧凑的小矩形。"
    existing_code:
      - "D4/2"
    reason: "D4/2和D7/1在功能上有重叠但角度不同——D4/2关注条形不在原位而是紧凑排列，D7/1关注输出grid裁剪。组合后确保最大程度的紧凑化，对grid_shape推理要求最高。"

  - index: 9
    combo_spec: "D9/3+D11/0"
    name: "干扰色块+图例指示方向"
    description: "网格中有不参与排序的干扰色块，同时角落有小型图例指示排序方向(升序/降序箭头)。解题者需先过滤干扰色块找出真正的条形，再解读图例确定排序方向，最后执行排序。引入两层前置推理步骤。"
    existing_code:
      - "D9/3"
      - "D11/0"
    reason: "过滤(D9/3)+解码(D11/0)形成完整的预处理链：在执行核心排序前需完成两个独立的前置推理步骤。测试推理链的长度而非单步复杂度。"

  - index: 10
    combo_spec: "D1/0+D5/1"
    name: "颜色匹配+双向颜色交换"
    description: "条形通过颜色匹配找到目标槽位(条形颜色与槽位标记颜色匹配)，放入后执行双向颜色交换(条形获得槽位色，基线对应位置变为条形原色)。匹配逻辑从排序变为颜色配对，变换逻辑引入双向交换。解题者需追踪颜色在条形和基线之间的流动。"
    existing_code:
      - "D1/0"
      - "D5/1"
    reason: "当匹配条件本身基于颜色(D1/0)，而变换又涉及颜色交换(D5/1)时，产生颜色语义冲突的有趣交互——匹配用的颜色在交换后改变了，解题者需理解匹配发生在变换之前的时序逻辑。"

  - index: 11
    combo_spec: "D2/0+D9/0+D13/0"
    name: "颜色消歧+共享颜色+非对称条"
    description: "条形可以共享颜色，高度相同时按颜色调色板顺序消歧，且条形上下延伸不等(非对称)。排序键为总高度，但需通过上+下两端求总高度。当总高度相同时，用颜色顺序做消歧。共享颜色意味着可能出现同色同高的极端消歧场景。解题者需推断三层排序逻辑。"
    existing_code:
      - "D9/0"
      - "D13/0"
    reason: "三个维度形成递进交互链——D13/0使高度计算复杂化，D9/0使颜色不再唯一，D2/0提供消歧依据。三者缺一则推理挑战不完整。"

  - index: 12
    combo_spec: "D8/1+D10/0"
    name: "冒泡单步+轨迹标记"
    description: "每个样例展示冒泡排序的一步，即仅交换一对相邻条形。交换后，被交换条形的原始位置留下轨迹标记(特殊颜色标记点)。解题者可通过轨迹标记验证哪两个条形发生了交换，同时增加了输出的信息密度。"
    existing_code:
      - "D10/0"
    reason: "冒泡单步(D10/0)天然与轨迹标记(D8/1)互补——单步交换只改变两个位置，轨迹标记恰好标识这两个位置，形成变化检测+验证的双重推理。"

  - index: 13
    combo_spec: "D6/3+D11/2"
    name: "基线颜色编码目标序+基线颜色随机化"
    description: "基线不再单色，而是分段着色——每段颜色对应一个条形的目标颜色，段的顺序编码目标排列。同时基线颜色不固定——段与段之间的分隔色也不是固定的。解题者需先识别基线的分段结构，再从颜色序列推断目标映射。"
    existing_code:
      - "D6/3"
      - "D11/2"
    reason: "D11/2将基线从结构元素提升为信息编码载体，D6/3进一步取消颜色先验知识。两者组合后基线成为一个需要解码的复杂信号。"

  - index: 14
    combo_spec: "D1/0+D4/1+D5/2"
    name: "颜色匹配+框架填洞+旋转放入"
    description: "条形通过颜色匹配找到对应的框架洞，然后旋转90度放入洞中。整个推理链变为：识别条形颜色 -> 找到同色框架洞 -> 旋转条形 -> 嵌入。从排序问题彻底转变为颜色配对+空间嵌合问题。"
    existing_code:
      - "D1/0"
      - "D4/1"
      - "D5/2"
    reason: "三维交互将原始排序任务完全重构为匹配+变换+嵌入任务。每个维度负责推理链的一个环节，缺任何一个都只是局部改变。"

  - index: 15
    combo_spec: "D3/4+D6/0"
    name: "对角线条形+垂直基线"
    description: "条形以45度对角线排列而非轴对齐，基线为垂直方向。对角线条从垂直基线向左右斜伸，长度由对角像素数决定，按长度排序分配到从上到下排列的槽位。整个空间模式与原题完全不同——既没有水平基线也没有垂直条。"
    existing_code:
      - "D6/0"
    reason: "双重空间变换(对角线+垂直基线)产生高度非直觉的视觉模式，但排序逻辑本身不变(按长度排序)，保持了人类可解性。"

  - index: 16
    combo_spec: "D1/2+D10/3"
    name: "交替排序方向+降序排列"
    description: "槽位按奇偶交替排序方向填充：奇数位槽位按降序填充，偶数位槽位按升序填充（或反之）。整体排列呈锯齿式高度分布。解题者需发现交替模式并确定基准排序方向是降序而非升序。"
    existing_code:
      - "D10/3"
    reason: "D10/3(交替方向)与D1/2(降序)交互产生歧义——降序作为基准+交替 vs 升序基准+交替产生不同结果。解题者需从样例中精确判断。"

  - index: 17
    combo_spec: "D4/4+D11/1"
    name: "双向标记系统"
    description: "每个槽位旁有数字标记(像素点数编码位置)指定接收顺序，同时每个条形旁也有标记(编码该条应去第几个槽位)。形成双向标记系统——条形侧标记说我去第3个位置，槽位侧标记说我是第2个接收位置。解题者需同时解读两套标记并建立映射。"
    existing_code:
      - "D4/4"
      - "D11/1"
    reason: "双向标记系统是D4/4和D11/1的自然交互——单向标记可能有歧义，双向交叉验证消除歧义但增加解码工作量。"

  - index: 18
    combo_spec: "D7/2+D12/2"
    name: "输入输出分离区域+N:M不等基数"
    description: "输入网格水平分为两半（左半含未排序条形，右半为空白/标记），且条形与槽位数量不等(N:M)——左半的条形多于右半的槽位，需选择性放置，某些条形被丢弃。解题者需理解空间分区+选择逻辑。"
    existing_code:
      - "D7/2"
    reason: "空间分区(D7/2)使哪些条形被保留/丢弃在视觉上更清晰(左边多右边少)，与D12/2的选择逻辑形成互补。"

  - index: 19
    combo_spec: "D1/6+D3/2"
    name: "连接器匹配+T形条"
    description: "条形为T形(顶部有水平臂)，底部附加连接器图案(如L形/T形小型连接器)。目标槽位有对应的反向连接器凹口。匹配条件从排序变为连接器形状匹配——T形条的连接器与槽位凹口对齐才能放入。解题者需进行两层形状推理：条形整体形状(T形)+连接器细节。"
    existing_code:
      - "D3/2"
    reason: "复杂形状的条(D3/2)与连接器匹配(D1/6)的组合增加了空间推理的层次——从单属性排序到多层形状对齐，推理模式质变。"

  - index: 20
    combo_spec: "D5/4+D13/0"
    name: "高度归一化+非对称条形"
    description: "条形上下延伸不等(非对称)，排序后放入槽位时高度归一化(缩放到统一高度)。非对称条的总高度=上延+下延+1，排序依据此总高度。归一化后所有条高度相同，排序信息仅保留在颜色-位置映射中。解题者需同时处理：(1)从非对称结构中提取正确的高度度量，(2)理解归一化消除了高度差异后如何验证排序正确性。"
    existing_code:
      - "D13/0"
    reason: "D13/0使高度计算复杂化，D5/4使输出中高度信息消失。组合后形成信息先提取后擦除的推理模式——解题者必须在输入中正确提取高度，但无法通过输出中的高度差来验证答案。"
