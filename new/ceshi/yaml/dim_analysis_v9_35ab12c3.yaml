task_id: 35ab12c3
task_type: move_along_path
summary: "识别同色像素对，沿水平/垂直/45度对角线连接它们形成多边形或折线，同时将起始顶点的邻居像素沿平行偏移路径复制（阴影效果）"

dimensions:
  - id: D1
    name: "匹配条件——同色配对规则"
    tag: match_cond
    current: "color_match——同色像素配对（s1.color == s2.color），同一颜色的所有像素按极角排序后形成多边形/折线的顶点序列"
    alternatives:
      - name: "互补色配对"
        description: "不再要求像素完全同色，而是使用颜色映射表（如红-蓝、绿-黄配对）来决定哪些像素应该连接。解题者需要从示例中推断颜色配对关系而非简单识别相同颜色，增加了推理层次。连线颜色取两者之一或用第三种颜色。"
        source: color_pairing
        source_task: 16de56c4
        delta_lines: 25
      - name: "形状匹配配对"
        description: "像素不按颜色配对，而是按其周围的局部模式（如十字形标记 vs 单点标记）配对——相同局部模式的像素互相连接。这将匹配条件从颜色转变为空间模式识别，大幅改变推理方式。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "距离约束配对"
        description: "同色像素中只连接距离最近的一对（或距离满足特定条件的对），而非将所有同色像素全部连接成多边形。解题者需要计算距离并判断哪些对应该连接，增加了数值推理。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "颜色序列配对"
        description: "像素按颜色值大小排序后依次配对连接（如颜色1连颜色2，颜色3连颜色4），形成跨颜色的连线。这完全改变了分组逻辑，解题者需要推断颜色排序规则。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D2
    name: "路径方向类型"
    tag: path
    current: "straight_ray + diagonal_path——顶点间通过水平、垂直或严格45度对角线连接，要求dr==0或dc==0或|dr|==|dc|"
    alternatives:
      - name: "仅正交路径（禁止对角线）"
        description: "只允许水平和垂直连接，禁止对角线路径。这是当前规则的受限版本，简化了路径判断但限制了可用的形状拓扑。解题者需要识别这一限制并理解为什么某些看似可连接的像素对不会被连接。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "仅对角线路径（禁止正交）"
        description: "只允许45度对角线连接，禁止水平和垂直路径。所有形状只能由对角线段组成（如菱形、X形等），创造了视觉上非常独特的几何图案。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "骑士步路径"
        description: "顶点间不再沿直线连接，而是沿国际象棋骑士的L形路径连接（2+1步），画出弯折的路径。这完全改变了路径几何，解题者需要理解非标准的连接规则。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "曼哈顿折线路径"
        description: "对于非正交非对角对齐的两个顶点，允许通过L形折线（先水平后垂直或反之）连接。这放宽了对齐限制，使更多像素对可以连接，但引入了路径选择的歧义需要消歧规则。"
        source: pathfinding
        source_task: cb2d8a2c
        delta_lines: 30

  - id: D3
    name: "顶点排序与连接拓扑"
    tag: path
    current: "极角排序（angle_cycle）——所有同色顶点按围绕质心的极角排序，2个顶点连直线段，3+个顶点按顺序连成闭合多边形"
    alternatives:
      - name: "最近邻贪心连接"
        description: "不按极角排序，而是从某个起始顶点出发，每次连接最近的未访问顶点，形成贪心路径。这可能产生交叉的折线而非凸多边形，创造更复杂的视觉图案，解题者需要推断贪心策略。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "最小生成树连接"
        description: "同色顶点不形成环路/多边形，而是形成最小生成树——所有顶点通过最短总路径长度连接且无环。这改变了拓扑结构，产生分叉的树形图案而非封闭形状。"
        source: hub_and_branch
        source_task: 800d221b
        delta_lines: 35
      - name: "行主序/列主序连接"
        description: "同色顶点按行优先（从上到下、从左到右）排序后依次连接，形成开放折线而非闭合多边形。排序规则简单直观，但产生的路径形状与极角排序完全不同。"
        source: sorting_by_distance
        source_task: dd6b8c4b
        delta_lines: 15
      - name: "星形连接（所有顶点连到质心）"
        description: "不将顶点首尾相连，而是所有顶点都连接到它们的质心位置（或离质心最近的顶点），形成星形/辐射状图案。这产生了完全不同的视觉效果和拓扑结构。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "轨迹涂色模式"
    tag: trajectory
    current: "continuous_trail——沿路径的每个背景格子都涂上形状颜色，形成连续实线"
    alternatives:
      - name: "间歇跳跃轨迹"
        description: "沿路径每隔N格涂色一次，形成虚线效果（如涂2跳1、涂1跳1等）。间歇模式可能由顶点数量或段长决定。解题者需要识别涂色周期规律，增加了模式识别维度。"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 15
      - name: "周期性颜色交替轨迹"
        description: "路径上的涂色按颜色周期交替——例如形状颜色和阴影颜色交替涂色（ABABAB），或按多色周期循环。这创造了条纹状的连线效果，视觉上更丰富。"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 20
      - name: "渐变长度轨迹"
        description: "每条边的涂色不是完全填满，而是从起点向终点涂色长度递减（或递增），形成'渐淡'效果。例如第一条边涂满，第二条边涂3/4，第三条涂1/2。解题者需要发现长度变化规律。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "仅涂顶点不涂边"
        description: "取反当前规则：不涂连线路径，只在输出中保留（或高亮）顶点像素，并在顶点周围扩展一个小十字或方形标记。这将'连线'任务变成了'标记'任务，改变了核心操作语义。"
        source: inversion
        source_task: null
        delta_lines: 20

  - id: D5
    name: "阴影/平行偏移机制"
    tag: path
    current: "parallel_offset——起始顶点的8邻居中的非背景非同色像素作为阴影锚点，其相对偏移被应用到整条形状路径上，生成平行的阴影副本"
    alternatives:
      - name: "无阴影（纯连线）"
        description: "完全移除阴影机制，任务变为纯粹的同色顶点连线。这大幅简化了任务，但仍保留了多边形/折线构建的核心推理。作为基础变体有价值。"
        source: inversion
        source_task: null
        delta_lines: -30
      - name: "多层嵌套阴影"
        description: "强制每个形状都有2-3层阴影（当前最多1层且可选），每层阴影由不同颜色像素触发，偏移方向各不相同。这产生了同心多层轮廓效果，大幅增加了视觉复杂度和推理深度。"
        source: concentric_frames
        source_task: 13e47133
        delta_lines: 25
      - name: "阴影方向由形状朝向决定"
        description: "阴影偏移方向不由邻居像素位置决定，而是由形状的整体朝向（如最长边的垂线方向）自动计算。移除阴影锚点像素，解题者需要理解几何关系来推断阴影方向。"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 30
      - name: "阴影为缩放副本而非平移副本"
        description: "阴影不是形状的平行平移，而是以锚点为中心的缩放副本（放大或缩小）。阴影颜色像素到顶点的距离编码了缩放系数。这创造了同心缩放图案，需要理解缩放变换。"
        source: scaling
        source_task: b10624e5
        delta_lines: 40

  - id: D6
    name: "阴影优先级规则"
    tag: transform
    current: "形状颜色优先（shape color wins）——当阴影像素与形状像素重叠时，形状颜色覆盖阴影颜色"
    alternatives:
      - name: "阴影颜色优先"
        description: "取反当前规则：当重叠发生时阴影颜色覆盖形状颜色。这改变了视觉外观——形状边缘会被阴影'侵蚀'，解题者需要注意优先级的反转。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "重叠区域涂第三种颜色"
        description: "形状与阴影重叠的区域不使用任一颜色，而是涂上一种特殊颜色（如重叠指示色）。这增加了一个额外的视觉线索和推理维度，解题者需要理解'混合'规则。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "重叠区域擦除为背景"
        description: "形状与阴影重叠的位置都被擦除为背景色，形成'镂空'效果。这类似于XOR操作，创造了独特的视觉图案，解题者需要理解减法而非加法的合成逻辑。"
        source: erase
        source_task: 3dc255db
        delta_lines: 15

  - id: D7
    name: "源对象——形状顶点来源"
    tag: src
    current: "同色像素组作为多边形/折线顶点，每组2-7个同色像素，形状类型包括折线、三角形、矩形、菱形、五边形、六边形"
    alternatives:
      - name: "颜色编码的控制像素指定形状类型"
        description: "形状类型不由顶点数量和位置隐式决定，而由一个额外的控制像素（如网格边缘的标记像素）显式指定——控制像素颜色编码形状类型（折线/三角形/矩形等）。解题者需要先解读控制像素再执行连线。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 30
      - name: "色块连通分量作为源"
        description: "源不再是孤立像素点，而是小型色块（2x2或3x3的连通区域），色块的质心作为顶点位置。这改变了顶点检测方式——解题者需要先识别色块再提取质心。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 25
      - name: "边缘像素作为源"
        description: "形状顶点不是散布在网格内部，而是固定在网格边缘（边框的第一行/最后一行/第一列/最后一列）。这限制了形状的空间分布，但使顶点查找更系统化，可能产生从边缘向中心辐射的图案。"
        source: particle_movement
        source_task: 9bbf930d
        delta_lines: 20
      - name: "模板图案中的关键像素作为源"
        description: "输入包含一个小型模板区域（如3x3图案），模板中非背景像素的相对位置定义了顶点的排列模式，然后在网格中按比例放大应用。解题者需要先识别模板再推断实际顶点位置。"
        source: template_lookup
        source_task: 195c6913
        delta_lines: 35

  - id: D8
    name: "终止条件/端点规则"
    tag: dst
    current: "无独立终点——路径在同色像素对之间直接连接，终点就是配对的另一个像素"
    alternatives:
      - name: "到达网格边缘停止"
        description: "形状的射线不在配对像素处停止，而是从每个顶点沿特定方向一直延伸到网格边缘。这将'连接两点'变成了'从点发射射线'，改变了基本操作模式。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 25
      - name: "遇到障碍物停止"
        description: "路径在遇到其他颜色组的已绘制区域时停止，而非穿过整个配对距离。这引入了绘制顺序的重要性——先画的形状会阻挡后画的形状的路径。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 20
      - name: "距离编码停止"
        description: "路径不一定连接到配对像素，而是延伸到由某个数值编码的固定距离——例如网格中该颜色像素的总数决定了射线长度。解题者需要计算像素数量来推断正确的路径长度。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 25
      - name: "连接到最近的不同色像素"
        description: "路径不在同色像素间连接，而是从每个像素出发连接到最近的不同颜色像素（如阴影像素到最近的形状顶点）。这改变了配对逻辑，引入了跨颜色的距离计算。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D9
    name: "干扰项设计"
    tag: obstacle
    current: "可选的干扰项组（0-1组，1-3个像素），其像素不能H/V/对角线对齐，在输出中保持不变"
    alternatives:
      - name: "无干扰项"
        description: "完全移除干扰项，所有非背景像素都参与形状连线或阴影。这简化了颜色分组的判断，降低了排除干扰信息的需求。"
        source: inversion
        source_task: null
        delta_lines: -10
      - name: "干扰项作为障碍物"
        description: "干扰项像素不再只是静态不变的噪声，而是作为路径障碍物——连线不能穿过干扰项像素，必须绕过或在其前停止。这给干扰项赋予了功能意义，增加了路径规划的复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "干扰项在输出中被删除"
        description: "干扰项在输出中被擦除为背景色，而非保持不变。解题者需要判断哪些像素是需要保留的顶点/阴影，哪些是需要删除的干扰项，增加了分类推理。"
        source: erase
        source_task: 3dc255db
        delta_lines: 10
      - name: "多组干扰项且数量更多"
        description: "增加干扰项组数为2-3组，每组3-5个像素。大量干扰项使得区分'有意义的形状组'和'无意义的干扰组'更具挑战性，解题者需要更强的模式识别能力。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D10
    name: "形状种类与拓扑"
    tag: meta
    current: "六种形状类型（折线/三角形/矩形/菱形/五边形/六边形），通过加权随机选择，包含开放折线和闭合多边形两种拓扑"
    alternatives:
      - name: "仅开放折线（禁止闭合多边形）"
        description: "所有形状只能是开放折线（不首尾相连），禁止三角形/矩形等闭合形状。这简化了拓扑判断但限制了几何多样性。解题者不需要区分开放/闭合。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "仅闭合多边形（禁止开放折线）"
        description: "取反：所有形状必须是闭合多边形，没有开放折线。解题者可以利用闭合性质来验证连接正确性。视觉上所有形状都有封闭边界。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "分支树拓扑"
        description: "允许一个顶点连接3条或更多边（分叉点），形成树形结构而非简单的折线或多边形。这增加了拓扑复杂度，解题者需要处理分支情况。"
        source: hub_and_branch
        source_task: 800d221b
        delta_lines: 30
      - name: "嵌套形状（形状内含形状）"
        description: "一个闭合多边形的内部可以包含另一个更小的同色闭合多边形，两者之间的区域涂色而内部留空（环形效果）。这引入了空间嵌套关系的推理。"
        source: concentric_frames
        source_task: 13e47133
        delta_lines: 35

  - id: D11
    name: "颜色选择范围"
    tag: meta
    current: "从{1,2,3,4,6,7,8}中选择颜色（排除0=背景和5），每组使用唯一颜色"
    alternatives:
      - name: "允许颜色复用（多组共享同一颜色）"
        description: "不同形状组可以使用相同颜色，但通过空间分离来区分——同一颜色的不连通像素群分别属于不同形状。这大幅增加了分组推理难度，解题者需要利用空间关系而非颜色来识别组。"
