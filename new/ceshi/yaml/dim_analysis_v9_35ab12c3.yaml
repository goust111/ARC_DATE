      - name: "仅使用2种颜色"
        description: "整个网格只使用2种非背景颜色——一种用于所有形状顶点，另一种用于所有阴影。解题者不能依赖颜色区分不同形状组，必须完全依赖空间分析。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D12
    name: "网格形状/输出裁剪"
    tag: grid_shape
    current: "same——输出网格与输入尺寸完全相同（15-22行 x 15-22列）"
    alternatives:
      - name: "紧凑裁剪"
        description: "输出裁剪到所有非背景像素的最小外接矩形，去除多余的背景边框。这改变了输出尺寸，解题者需要理解裁剪规则。"
