  - id: D13
    name: "多步处理顺序"
    tag: multi_step
    current: "三步流程：Step1识别同色像素对 -> Step2画连线 -> Step3画平行阴影线。主线先画、阴影后画（避免阴影阻挡主线）"
    alternatives:
      - name: "迭代扩展——逐步增长"
        description: "不一次性画出完整连线，而是每步只延伸一个像素，迭代直到所有连线完成。中间步骤中已画的线段可能影响后续路径（如作为障碍物）。这将静态计算变为动态模拟。"
        source: BFS_activation
        source_task: 5961cc34
        delta_lines: 35
      - name: "链式反应——连线触发新连线"
        description: "初始只连接某些'种子'像素对，连线完成后检查是否有新的像素对被激活（如连线经过某个位置时激活该位置的新规则），形成链式反应。解题者需要追踪多轮传播。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 40
      - name: "先阴影后主线（反转绘制顺序）"
        description: "反转当前绘制顺序：先画阴影路径，再画主形状路径。由于优先级规则不变（形状仍然覆盖阴影），最终结果相同，但如果改变优先级则会产生不同的视觉效果。配合'阴影优先'规则使用。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "按颜色值排序处理"
        description: "形状组不是独立处理，而是按颜色值从小到大（或从大到小）依次处理，先处理的形状连线可能阻挡后处理形状的路径。处理顺序成为需要推断的关键信息。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D14
    name: "阴影锚点检测规则"
    tag: src
    current: "8邻居检测——在起始顶点（最小坐标的有阴影邻居的顶点）的8邻居中寻找不同颜色非背景像素作为阴影锚点，偏移量=锚点位置-顶点位置"
    alternatives:
      - name: "4邻居检测（仅上下左右）"
        description: "阴影锚点只能在顶点的4邻居（上下左右）中检测，不包括对角线邻居。这限制了阴影偏移方向只能是正交方向，简化了偏移计算但减少了阴影方向的多样性。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "锚点可在任意顶点附近"
        description: "当前只检查'起始顶点'的邻居作为阴影锚点。改为检查所有顶点的邻居——每个顶点都可能有自己的阴影锚点，产生不同偏移方向的多个阴影。这大幅增加了阴影的复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "阴影偏移量由距离编码"
        description: "阴影锚点不再紧邻顶点（距离1），而是可以在距离2-3处，偏移量通过锚点到最近顶点的向量计算。更大的偏移产生更宽的阴影间距，解题者需要精确测量距离。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 20

  - id: D15
    name: "段间清晰路径约束"
    tag: path
    current: "clear_in_original——两个顶点之间的连线路径上不能有非背景非同色像素阻挡（在原始输入中检查），否则该边不画"
    alternatives:
      - name: "允许路径穿过其他颜色像素"
        description: "取消路径清晰性检查，允许连线穿过其他颜色组的像素。穿过点不被覆盖，但连线会在穿过位置留下'缺口'。这产生了断续的连线效果，解题者需要理解阻挡规则。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "路径穿过时覆盖所有像素"
        description: "连线路径无条件覆盖所有经过的像素（包括其他颜色的像素），完全'碾压'。这引入了绘制顺序的重要性——后画的线会破坏先画的线。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "路径遇到障碍物时绕行"
        description: "当直线路径被阻挡时，不是放弃该边，而是自动绕行——沿L形或S形路径绕过障碍物再继续向目标前进。这将简单的直线连接升级为路径规划问题。"
        source: pathfinding
        source_task: cb2d8a2c
        delta_lines: 35

  - id: D16
    name: "平行偏移共线过滤"
    tag: path
    current: "跳过共线偏移——如果阴影偏移方向与边方向共线（叉积为零），则该边的阴影不画，避免阴影与主线重叠"
    alternatives:
      - name: "不过滤共线偏移"
        description: "取消共线过滤，允许阴影在与主线方向共线的边上也画出来（相当于在主线的延长线上画阴影）。这会产生'加粗'效果，视觉上某些边看起来比其他边更粗。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "根据偏移角度调整阴影颜色深浅"
        description: "共线方向的阴影不跳过而是用浅色（如更暗的变体），非共线方向用正常颜色。这需要扩展颜色映射，引入了基于角度的视觉差异化。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "阴影仅在垂直于边方向时绘制"
        description: "阴影只在偏移方向与边方向垂直时才绘制（当前只排除平行方向，允许任意非平行角度）。这进一步限制了阴影出现的边，产生更稀疏的阴影图案。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D17
    name: "形状数量与密度"
    tag: meta
    current: "2-4个形状组，0-3个阴影，0-1个干扰组，在15-22的网格中保持>=1像素的缓冲间距"
    alternatives:
      - name: "单一形状（极简）"
        description: "网格中只有1个形状组（可带阴影），聚焦于单一形状的连线和阴影机制。这大幅简化了任务，适合作为入门级变体，解题者可以集中注意力理解核心机制。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "5-7个形状组（高密度）"
        description: "增加形状组数到5-7个（可能需要更大网格如25-30），使网格更加拥挤。形状间的空间竞争增加了放置难度，且多个重叠的阴影区域使视觉解读更具挑战性。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "零缓冲间距（形状紧密相邻）"
        description: "取消组间>=1像素缓冲的约束，允许不同形状组的边界像素8-相邻。这使分组边界变得模糊，解题者需要更仔细地利用颜色信息区分相邻的形状组。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D18
    name: "起始顶点选择策略"
    tag: meta
    current: "有阴影锚点的顶点优先作为起始点（seed_idxs），若有多个则取坐标最小的；无阴影时取坐标最小的顶点。起始顶点决定了极角排序的起点和阴影的锚定位置。"
    alternatives:
      - name: "随机起始顶点（由输入编码）"
        description: "起始顶点不由阴影锚点决定，而是由特殊标记（如在网格边缘的同色单像素）指定。解题者需要识别哪个像素是标记而非普通顶点。这增加了源解析的复杂度。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 20
      - name: "最远点作为起始"
        description: "取反当前的'最小坐标'策略：选择距离质心最远的顶点作为起始点。这改变了极角排序的参考起点，可能产生不同的连接顺序和阴影位置。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "所有顶点都可以是阴影锚定点"
        description: "不选择单一起始顶点来锚定阴影，而是让每个顶点都独立检查并携带自己的阴影邻居。每条边的阴影由其起始顶点的邻居决定，不同边可能有不同的阴影偏移。这极大地增加了阴影模式的丰富度。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D19
    name: "线段绘制优先级"
    tag: multi_step
    current: "两阶段绘制：Phase1先画所有主形状边（只涂背景格子），Phase2再画所有阴影平行线（只涂背景格子）。同一形状内主线不互相阻挡。"
    alternatives:
      - name: "边-阴影交替绘制"
        description: "不是先画所有主线再画所有阴影，而是每画一条主线后立即画其对应的阴影线。这改变了遮挡关系——后画的边的主线可能覆盖前画边的阴影位置。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "按边长排序绘制"
        description: "所有边（主线和阴影线）按长度从短到长（或从长到短）排序后依次绘制，不区分主线和阴影。长边覆盖短边或短边覆盖长边产生不同的视觉效果。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "全覆盖绘制（非仅背景）"
        description: "取消'只涂背景格子'的限制，允许后画的线覆盖先画的线。这意味着绘制顺序直接影响最终外观，解题者需要推断正确的绘制顺序。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D20
    name: "形状-阴影颜色关系"
    tag: meta
    current: "每个阴影使用独立的唯一颜色，阴影颜色与形状颜色无系统性映射关系"
    alternatives:
      - name: "阴影颜色由形状颜色通过固定映射决定"
        description: "阴影颜色不是随机分配，而是通过某种确定性映射从形状颜色推导——例如颜色值+1（mod可用颜色）。解题者需要从示例中推断映射函数来预测新形状的阴影颜色。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "阴影使用形状颜色的淡化版（同色但降低亮度）"
        description: "在ARC的离散颜色系统中不能直接'淡化'，但可以用阴影颜色始终固定为灰色（颜色5），不论形状是什么颜色。这简化了阴影颜色推理，解题者只需识别灰色即为阴影。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "阴影颜色编码偏移方向"
        description: "不同的偏移方向使用不同的阴影颜色——例如向上偏移用红色，向右偏移用蓝色等。颜色本身携带了方向信息，解题者需要从颜色推断偏移方向。这在多层阴影时特别有趣。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D21
    name: "边界处理"
    tag: meta
    current: "阴影超出网格边界时直接截断（不画超出部分），使用bounds check确保所有坐标在[0,H)x[0,W)内"
    alternatives:
      - name: "环绕边界（toroidal）"
        description: "超出网格边界的像素按模运算环绕到另一侧（如上方超出后从下方继续）。这创造了环面拓扑的有趣视觉效果，某些形状的阴影会出现在网格的另一端。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "边界反射"
        description: "超出网格边界的部分不截断，而是沿边界'反射'回来，继续在网格内绘制。这类似于镜面反射，可能产生与主形状部分重叠的有趣图案。"
        source: reflection
        source_task: 142ca369
        delta_lines: 25
      - name: "边界触发停止"
        description: "连线在到达网格边界时立即停止，即使目标顶点尚未到达。这意味着靠近边界的形状可能画不完整，解题者需要理解'被截断'的边与'完整'的边的区别。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D22
    name: "变换操作——输出中对输入像素的处理"
    tag: transform
    current: "保持源像素（keep_source）——输入中的顶点像素和阴影锚点像素在输出中保持不变，连线和阴影仅涂在背景格子上"
    alternatives:
      - name: "移除输入顶点（仅保留连线）"
        description: "输出中删除原始输入的顶点像素（变为背景色），只保留连线路径。这反转了'像素保留'规则，解题者需要注意原始顶点消失了。视觉上连线变成了没有端点标记的纯线段。"
        source: erase
        source_task: 3dc255db
        delta_lines: 10
      - name: "顶点扩展为十字标记"
        description: "输出中每个顶点不只是单像素，而是扩展为一个3x3十字形标记（上下左右各延伸1格）。这增强了顶点的视觉辨识度，但可能与连线重叠，需要优先级规则。"
        source: surround
        source_task: 71e489b6
        delta_lines: 15
      - name: "顶点重着色为阴影颜色"
        description: "输出中形状顶点的颜色从原始形状色变为对应的阴影色（如果有），形成'颜色交换'效果。解题者需要注意这种反直觉的颜色变化。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 15
