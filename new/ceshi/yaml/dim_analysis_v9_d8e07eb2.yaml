task_id: d8e07eb2
task_type: move_to_match
summary: "30x22网格被两条水平分隔行（色6）分为三个带：顶部查询带含若干3x3彩色字形，中间参考表为4x4的5x5单元格阵列（每格内含3x3字形），底部判定带。将查询字形按颜色+形状匹配到参考表单元格，匹配的单元格用绿色(3)填充背景；若所有匹配恰好构成参考表的一整行或一整列，则查询带和判定带也填绿，否则仅判定带填红(2)。"

dimensions:
  - id: D1
    name: "字形匹配条件"
    tag: match_cond
    current: "查询字形s与参考表字形d必须同时满足颜色相同且3x3二值形状相同才算匹配"
    alternatives:
      - name: "仅颜色匹配（忽略形状）"
        description: "只要查询字形与参考表字形颜色相同即算匹配，形状无需一致。大幅降低匹配难度，但由于参考表中同色字形可能有多个，需要引入消歧规则（如选第一个出现的），改变推理重点从形状识别到颜色搜索。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "仅形状匹配（忽略颜色）"
        description: "查询字形与参考表字形只需二值形状一致即算匹配，颜色可不同。解题者需在不同颜色的字形中寻找形状相同的配对，增加视觉搜索难度，因为颜色不再提供线索。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "允许旋转/翻转的形状匹配"
        description: "查询字形与参考表字形的二值形状在旋转0/90/180/270度或水平/垂直翻转后一致即算匹配，颜色仍需相同。引入空间变换推理，解题者需心理旋转字形来判断是否匹配。"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 25
      - name: "互补形状匹配"
        description: "查询字形的二值形状与参考表字形的二值形状互为补集（即一个的前景对应另一个的背景），颜色仍需相同。解题者需要做'取反'操作来验证匹配，增加认知负荷。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "像素数量匹配"
        description: "查询字形与参考表字形匹配条件改为：颜色相同且前景像素数量相同（形状可不同）。解题者需要数像素来判断匹配，推理方式从视觉形状比较变为计数任务。"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 20

  - id: D2
    name: "查询字形来源区域"
    tag: src
    current: "查询字形位于第一条分隔行上方的顶部带中，每个字形占据一个5x5单元格（3x3字形+1像素边距），排成一行最多4个"
    alternatives:
      - name: "查询字形位于底部带"
        description: "将查询带从顶部移到底部（分隔行下方），判定带移到顶部。输入的上下空间关系颠倒，解题者需要反向扫描网格。改变视觉搜索方向但逻辑不变。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "查询字形散布在参考表外围"
        description: "查询字形不集中在一行中，而是分散在参考表的左侧列或右侧列（每行一个），解题者需要从多个位置收集查询字形再匹配。增加空间搜索复杂度。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "查询字形为两行（8个）"
        description: "查询带扩展为两行5x5单元格（共8个查询字形），需要在参考表中找到所有8个匹配。判定条件也相应变为：是否匹配恰好覆盖两整行或两整列。增加搜索量和判定复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "查询字形含干扰项"
        description: "查询带中除了真正的查询字形外，还包含1-2个'干扰字形'（在参考表中找不到匹配的颜色或形状），解题者需要识别并忽略这些干扰项。增加筛选推理步骤。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D3
    name: "参考表结构"
    tag: dst
    current: "参考表为4行4列的5x5单元格网格，每个单元格包含一个唯一颜色+形状的3x3字形，单元格之间用背景色(8)分隔"
    alternatives:
      - name: "参考表尺寸可变（如3x3或5x5）"
        description: "参考表的行列数不固定，不同示例可能是3x3、4x4或5x5。匹配逻辑不变，但判定条件中'完整行/列'的长度随表尺寸变化，解题者需要先确定表的大小再推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "参考表含空单元格"
        description: "参考表的某些单元格为空（全背景色），不包含字形。查询字形无法匹配到空单元格。判定条件中完整行/列仍需所有位置都被匹配（包括空位），因此空位的存在使得某些行/列永远无法被完成。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "参考表中存在重复字形"
        description: "参考表中允许同颜色同形状的字形出现多次，一个查询字形可能匹配多个参考表单元格。需要引入消歧规则（如同行/列优先），增加决策复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "参考表字形使用不同大小的单元格"
        description: "参考表中的单元格不再统一为5x5，有的是5x5含3x3字形，有的是7x7含5x5字形，解题者需先识别每个单元格的边界再提取字形。增加结构解析难度。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D4
    name: "匹配成功后的单元格变换"
    tag: transform
    current: "匹配的参考表单元格的5x5区域中，将背景像素(8)替换为绿色(3)，字形像素保持原色不变，形成绿色底色+彩色字形的效果"
    alternatives:
      - name: "将匹配的字形像素变为绿色"
        description: "与当前相反：匹配后将字形前景像素变为绿色(3)，背景像素保持不变。取反了'填充什么'的逻辑，视觉效果从'绿底彩字'变为'原底绿字'。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "匹配后整个单元格统一填绿"
        description: "匹配的单元格完全填充为绿色(3)，包括字形像素也变为绿色，原字形信息消失。简化了变换逻辑但丢失了字形信息，视觉上更容易看到哪些格子被匹配。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "匹配后用查询字形颜色重着色边框"
        description: "匹配的参考表单元格在5x5边界上画一圈查询字形对应的颜色边框，而非填充整个背景。形成彩色边框标记效果，视觉上更精致。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "匹配后擦除参考表字形"
        description: "匹配的参考表单元格中的字形被擦除（变为背景色），仅保留绿色填充的空白单元格。取反了'保留字形'的逻辑，强调匹配位置而非匹配内容。"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 10

  - id: D5
    name: "判定条件（行/列完整性）"
    tag: match_cond
    current: "若所有查询字形的匹配单元格恰好构成参考表的一整行或一整列，则判定为绿色（通过）；否则判定为红色（失败）"
    alternatives:
      - name: "任意匹配即判定绿色"
        description: "只要所有查询字形都找到匹配，无论是否构成完整行/列，判定均为绿色。取消了行/列完整性这一高阶推理条件，大幅降低判定复杂度。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "要求2x2子矩阵排列"
        description: "判定绿色的条件改为：匹配的单元格恰好构成参考表中一个2x2的子矩阵（连续的两行两列交叉区域）。从线性（行/列）判定变为二维区域判定，增加空间推理维度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "对角线完整性判定"
        description: "判定绿色的条件改为：匹配的单元格恰好构成参考表的主对角线或副对角线。从行/列判定变为对角线判定，解题者需要识别对角线模式。"
        source: diagonal_symmetry
        source_task: 4c416de3
        delta_lines: 20
      - name: "多数规则判定"
        description: "判定绿色的条件改为：某一行或列中被匹配的单元格数量超过未匹配数量（即多数匹配）。不要求完全完整，但仍需行/列方向的聚集度，是当前规则的宽松版本。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D6
    name: "判定结果的视觉表达"
    tag: transform
    current: "绿色判定：查询带和判定带背景填绿(3)；红色判定：仅判定带背景填红(2)，查询带不变"
    alternatives:
      - name: "绿色判定时仅判定带填绿"
        description: "取消查询带的绿色填充，无论判定结果如何查询带都保持不变，仅通过判定带颜色传达结果。简化输出变化范围，使变换更局部化。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "红色判定时查询带填红"
        description: "红色判定时不仅判定带填红，查询带也填红(2)。与绿色判定的对称处理（绿色时两带都填绿），使成功/失败的视觉反馈更对称一致。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "用不同颜色编码匹配数量"
        description: "判定带颜色不再只有绿/红二值，而是根据匹配到完整行/列的程度使用渐变：4个全匹配=绿色，3个=黄色(4)，2个=橙色(7)，1或0个=红色(2)。增加信息量和判定颗粒度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "在判定带中显示匹配的行/列索引"
        description: "判定带不再统一填色，而是在对应位置标记匹配到的行号或列号（用数字像素编码），失败位置保持背景色。将二值结果变为具体信息编码。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D7
    name: "分隔行结构"
    tag: meta
    current: "使用两条横跨整行的色6（品红）水平线作为分隔行，将网格分为查询带、参考表、判定带三个区域"
    alternatives:
      - name: "使用不同颜色的分隔行"
        description: "两条分隔行使用不同颜色（如上方用色1蓝色，下方用色2红色），分隔行颜色可作为额外线索（如指示判定时绿色/红色的含义）。增加颜色编码层。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "垂直分隔线替代水平分隔行"
        description: "网格旋转90度，使用垂直分隔线将网格分为左（查询列）、中（参考表）、右（判定列）三个区域。行列判定逻辑也相应旋转。改变整体布局方向。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "仅使用一条分隔行"
        description: "去掉一条分隔行，仅保留一条将查询/判定区域与参考表分开。查询字形和判定结果都在同一侧（如都在上方，查询在行0-2，判定在行3-4），参考表在下方。压缩了空间布局。"
        source: creative
        source_task: null
        delta_lines: 20

