task_id: 4c3d4a41
task_type: move_to_match
summary: "灰色带向上凸起的横杆移入灰色半开放框架中，凸起与框架内彩色列按列对齐，彩色像素堆叠在凸起顶部上方"

dimensions:
  - id: D1
    name: "匹配条件：凸起-列对齐方式"
    tag: match_cond
    current: "杆的凸起列与框架内彩色列按绝对列位置一一对齐(projection_slot_alignment + column_alignment)"
    alternatives:
      - name: "颜色匹配对齐"
        description: "杆的每个凸起被涂上不同颜色，框架内彩色列也各有颜色；凸起必须与同色列对齐而非按位置对齐。解题者需先识别颜色对应关系再确定水平偏移，增加推理步骤"
        source: color_match
        source_task: 2c181942
        delta_lines: 25
      - name: "凸起高度与彩色列长度匹配"
        description: "每个凸起的高度必须等于对应彩色列中有色像素的数量才算匹配；需要找到高度与像素数完全吻合的列排列。将匹配从纯空间对齐变为数值属性匹配，解题者需要同时计数和比较"
        source: size_match
        source_task: 2c181942
        delta_lines: 30
      - name: "形状轮廓匹配"
        description: "杆的凸起轮廓形状（高低起伏的轮廓线）必须与框架内彩色列的轮廓形状互补（凸起高处对应列短处），如同钥匙与锁的关系。增强几何推理难度"
        source: shape_match
        source_task: 16b78196
        delta_lines: 25
      - name: "镜像列对齐"
        description: "杆的凸起列需要左右镜像翻转后再与框架内彩色列对齐（即最左凸起对最右彩色列）。解题者需要发现镜像关系而非直接对应，增加空间推理负担"
        source: mirror_symmetry
        source_task: 4c416de3
        delta_lines: 15

