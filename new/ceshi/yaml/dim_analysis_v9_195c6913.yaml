task_id: 195c6913
task_type: move_along_path
summary: "左上角2x2色块模板定义颜色循环，col 0上的标记像素沿path区域直线前进并按循环涂色，碰撞时严格交替左转/右转（CCW/CW），若计划转向方向不是path则停止；同时擦除模板块和终止块，碰撞处涂终止色。"

dimensions:
  - id: D1
    name: "路径运动方式：直线射线"
    tag: path
    current: "粒子沿当前方向做直线运动，每步前进一格，直到碰到非path格才触发碰撞逻辑（straight_ray）。"
    alternatives:
      - name: "对角线射线运动"
        description: "粒子沿45度对角方向前进而非基本方向，碰墙时发生镜面反射；把正交路径推理变成对角几何推理，轨迹涂色模式也变为斜线条纹，视觉差异显著。"
        source: "diagonal_ray"
        source_task: "142ca369"
        delta_lines: 40
      - name: "BFS最短路径"
        description: "粒子不走直线，而是从起点通过BFS找到到达某目标（终止块位置/网格边缘）的最短路径行走；解题从模拟运动变为路径搜索推理。"
        source: "shortest_path"
        source_task: "7b0280bc"
        delta_lines: 50
      - name: "走廊跟随"
        description: "path区域变为窄走廊（宽1-2格），粒子被迫沿走廊弯曲前进而非直线到碰撞才转弯；推理从碰撞转弯变为走廊拓扑追踪。"
        source: "corridor_following"
        source_task: "332f06d7"
        delta_lines: 55
      - name: "螺旋路径"
        description: "粒子从起点沿顺时针或逆时针螺旋向内或向外运动，每圈缩短一格；从直线+碰撞转弯变为持续螺旋运动，轨迹呈螺旋形。"
        source: "spiral_path"
        source_task: "da515329"
        delta_lines: 45

  - id: D2
    name: "碰撞转弯规则：严格交替左右转"
    tag: path
    current: "碰撞时第1/3/5次左转(CCW)，第2/4/6次右转(CW)，严格交替；若计划转向方向不是path则停止（无后备方案）。"
    alternatives:
      - name: "始终同方向转弯"
        description: "每次碰撞时始终左转（或始终右转），不再交替；简化了交替逻辑，但改变了路径形态，粒子倾向走螺旋形而非锯齿形。"
        source: "inversion"
        source_task: null
        delta_lines: 10
      - name: "碰撞色决定转向"
        description: "非path格的颜色决定转弯方向——模板中某些颜色对应左转，另一些对应右转；解题者需从样例推断颜色-方向映射，增加模式发现难度。"
        source: "creative"
        source_task: null
        delta_lines: 30
      - name: "符号指令指定转向（图例编码）"
        description: "在模板区域增加方向指示符号（如条形标记在色块左侧=CCW、右侧=CW），粒子按图例顺序读取转向序列；类似e87109e9的legend编码思路。"
        source: "symbol_instructions"
        source_task: "e87109e9"
        delta_lines: 35
      - name: "碰撞时尝试双向并选较长路径"
        description: "碰撞时同时尝试左转和右转，选择能继续直行更远的那个方向；从固定交替变为贪心选择，解题者需模拟两个分支比较。"
        source: "creative"
        source_task: null
        delta_lines: 25
      - name: "碰撞时有后备方案"
        description: "若计划转向方向被阻挡，尝试另一个90度方向作为后备；取消无后备停止规则，粒子存活更久，轨迹更长。"
        source: "inversion"
        source_task: null
        delta_lines: 15

  - id: D3
    name: "轨迹涂色方式：颜色循环"
    tag: trajectory
    current: "粒子沿路径前进时用模板定义的颜色循环（2-4色）依次涂色，每步推进一个循环位；涂色连续不间断。"
    alternatives:
      - name: "间歇涂色（跳格涂）"
        description: "粒子每走两格只涂一格（或每N格涂一格），形成间断的虚线轨迹而非连续实线；视觉上形成节奏感，解题者需推断间隔规律。"
        source: "intermittent_skip"
        source_task: "4a21e3da"
        delta_lines: 15
      - name: "碰撞时变色（反射变色）"
        description: "轨迹不用循环色，而是每段直行用同一颜色，碰撞后颜色切换为碰撞位置的障碍物颜色或下一个循环色；颜色变化与碰撞事件绑定而非与步数绑定。"
        source: "color_change_on_bounce"
        source_task: "142ca369"
        delta_lines: 20
      - name: "周期图案涂色"
        description: "不是单纯的颜色循环，而是重复一个2D图案块（如2x2瓷砖）沿路径铺设；轨迹从单色条纹变为纹理填充，视觉更丰富。"
        source: "periodic_tiling"
        source_task: "53fb4810"
        delta_lines: 35
      - name: "无轨迹（仅移动粒子）"
        description: "粒子移动后不留涂色痕迹，只在终止位置放置标记；输出从丰富的彩色轨迹变为只看起点到终点，推理重心完全落在终点定位上。"
        source: "inversion"
        source_task: null
        delta_lines: 15
      - name: "轨迹颜色由到起点距离决定"
        description: "不用循环而是根据当前步数到起点的曼哈顿距离（或步数模K）选色，距离不同区段呈现不同颜色带；形成渐变或分段效果。"
        source: "creative"
        source_task: null
        delta_lines: 20

  - id: D4
    name: "源对象：标记像素定义"
    tag: src
    current: "1-2个孤立的单像素标记，颜色=循环色[0]，位于col 0（左网格边缘），嵌入在path区段中；初始方向优先级为R,D,L,U。"
    alternatives:
      - name: "标记位于网格四条边缘任意一侧"
        description: "标记不限于左列，可出现在上下左右任意边缘，初始方向由标记所在边缘决定（从该边向内）；解题者需识别边缘位置并推断初始方向。"
        source: "creative"
        source_task: null
        delta_lines: 25
      - name: "标记位于path区域内部而非边缘"
        description: "标记不在网格边缘，而在path内部某处，初始方向由相邻path邻居结构推断；起点定位从边缘扫描变为内部搜索。"
        source: "inversion"
        source_task: null
        delta_lines: 30
      - name: "标记为2x2小块而非单像素"
        description: "起始标记改为2x2彩色块（类似模板块的尺寸），嵌入path区域边缘；识别标记时需区分2x2起始块与2x2模板块和终止块，增加解析难度。"
        source: "creative"
        source_task: null
        delta_lines: 20
      - name: "标记颜色各不相同（非全部=循环色[0]）"
        description: "每个标记用不同的循环色（如标记1=循环色[0]，标记2=循环色[1]），每个标记的循环起始位不同；解题者需关联标记色与循环起始位。"
        source: "creative"
        source_task: null
        delta_lines: 15
      - name: "箭头形状标记编码初始方向"
        description: "标记不是单像素而是3像素L形/箭头形，其形状指示初始运动方向；从固定边缘方向变为形状解读方向。"
        source: "direction_from_shape"
        source_task: "3dc255db"
        delta_lines: 35

  - id: D5
    name: "终止条件"
    tag: dst
    current: "粒子在计划转向方向不是path时停止（collision_stop）；也在离开网格边界时停止。"
    alternatives:
      - name: "到达目标像素时停止"
        description: "在path中放置特定颜色的目标像素，粒子到达目标时停止而非碰撞停止；从被动碰撞停止变为主动到达终点。"
        source: "creative"
        source_task: null
        delta_lines: 20
      - name: "固定步数停止"
        description: "粒子行走固定步数后停止，步数由模板中色块数量或某种计数编码决定；终止条件从空间碰撞变为步数约束。"
        source: "distance_encoding"
        source_task: "271d71e2"
        delta_lines: 25
      - name: "完成一个完整颜色循环后停止"
        description: "粒子涂完恰好K个完整颜色循环（K由模板编码）后停止，无论是否碰撞；终止条件与涂色进度绑定。"
        source: "creative"
        source_task: null
        delta_lines: 20
      - name: "两个粒子相遇时同时停止"
        description: "两个标记发射的粒子同时模拟，当它们的轨迹相遇（试图进入对方已涂色的格子）时双双停止；引入粒子间交互。"
        source: "collision_detection"
        source_task: "e12f9a14"
        delta_lines: 35

  - id: D6
    name: "碰撞变换：终止色涂角标记"
    tag: transform
    current: "碰撞非path格时（且该格为bg），用终止色（end_color）涂该格作为角标记；同时擦除模板2x2块和终止2x2块。"
    alternatives:
      - name: "碰撞时不涂角标记"
        description: "碰撞时只转弯，不在碰撞位置留下任何颜色标记；减少输出中的线索，解题者需纯粹从轨迹推断碰撞位置。"
        source: "inversion"
        source_task: null
        delta_lines: 10
      - name: "碰撞时用碰撞次数对应的循环色涂角"
        description: "第1次碰撞涂循环色[0]，第2次涂循环色[1]…，而非统一用终止色；角标记的颜色编码了碰撞顺序信息。"
        source: "creative"
        source_task: null
        delta_lines: 15
      - name: "碰撞时扩展涂色（十字形或3x3）"
        description: "碰撞位置不涂单像素，而是涂一个十字或3x3区域（在bg区域内），形成更明显的碰撞标记；视觉上更突出。"
        source: "surround"
        source_task: "71e489b6"
        delta_lines: 20
      - name: "碰撞时擦除碰撞处的path（打洞）"
        description: "碰撞时不涂色，而是将碰撞附近的path格擦为bg，形成缺口；后续粒子（或第二轮模拟）会因这些缺口改变路径。"
        source: "creative"
        source_task: null
        delta_lines: 30

  - id: D7
    name: "模板查找机制"
    tag: symbol_instructions
    current: "左上角一排2x2单色块定义颜色循环顺序（从左到右），标记的起始循环位由其颜色在循环中的位置决定。"
    alternatives:
      - name: "模板为颜色条纹（1xN或Nx1）"
        description: "将2x2块简化为单行或单列的颜色条纹，每格一个颜色定义循环；结构更紧凑，解题者需识别线性模板而非块模板。"
        source: "creative"
        source_task: null
        delta_lines: 25
      - name: "模板为L形或T形排列"
        description: "色块不在一排，而是呈L形或T形排列在角落，循环顺序由某种读取规则（如顺时针外圈读取）决定；增加模板解析复杂度。"
        source: "creative"
        source_task: null
        delta_lines: 30
      - name: "模板位于右下角（与终止块位置互换）"
        description: "模板移到右下bg区域，终止块移到左上bg区域；空间布局反转，解题者需从不同位置读取模板信息。"
        source: "inversion"
        source_task: null
        delta_lines: 20
      - name: "无显式模板——从标记颜色和path邻域推断"
        description: "移除模板块，循环顺序由标记相邻path格的颜色编码（或由多个标记的颜色序列）隐式定义；从直接读取变为推理发现。"
        source: "inversion"
        source_task: null
        delta_lines: 40

  - id: D8
    name: "输出网格形状"
    tag: grid_shape
    current: "输出与输入同尺寸，在原网格上直接修改（擦模板/终止块+涂轨迹/角标记）。"
    alternatives:
      - name: "输出裁剪为轨迹外接矩形"
        description: "输出只保留所有轨迹和碰撞标记的最小外接矩形区域；从全网格变为裁剪视图，解题者需额外推断裁剪范围。"
        source: "tight_crop"
        source_task: "e87109e9"
        delta_lines: 15
      - name: "输出仅保留path区域（非path变为bg）"
        description: "输出中只显示path区域内的涂色结果，所有非path区域（包括模板区、终止块区）全部清为bg；聚焦于轨迹本身。"
        source: "crop"
        source_task: "a6f40cea"
        delta_lines: 20
      - name: "输出为每个标记分别生成独立子网格"
        description: "多标记情况下输出为多个拼接的子网格，每个子网格只包含一个标记的轨迹；引入分离和拼接逻辑。"
        source: "frame_separation"
        source_task: "5545f144"
        delta_lines: 35

  - id: D9
    name: "标记数量与基数关系"
    tag: meta
    current: "1或2个标记（n_markers==2出现率>=50%），各标记独立模拟，轨迹必须不相交。"
    alternatives:
      - name: "固定3-4个标记"
        description: "增加标记数量到3-4个，每个独立模拟，path区域需要更多bg分隔条来保证轨迹不交叉；网格复杂度和推理工作量显著增加。"
        source: "creative"
        source_task: null
        delta_lines: 25
      - name: "标记轨迹允许交叉"
        description: "取消轨迹不相交约束，交叉处颜色由后到的粒子覆盖或混合（如取两色的特定组合）；解题者需推断覆盖/混合规则。"
        source: "inversion"
        source_task: null
        delta_lines: 20
      - name: "标记之间有依赖顺序"
        description: "标记不同时模拟，而是按照某种顺序（如从上到下）依次模拟，前一个标记的轨迹涂色成为后一个标记的障碍物；引入多步依赖。"
        source: "multi_step"
        source_task: "271d71e2"
        delta_lines: 30
      - name: "单标记发射多轮（碰撞后重新出发）"
        description: "一个标记碰撞停止后，从停止位置重新向下一个初始方向出发（方向按R,D,L,U循环），直到所有方向都被阻挡；单源多轮模拟。"
        source: "creative"
        source_task: null
        delta_lines: 25

  - id: D10
    name: "path区域形态：厚蜿蜒反对角带"
    tag: obstacle
    current: "path为单个4连通的厚蜿蜒反对角带（宽4-12格），从右上延伸到左下，将bg分成2-4个区域；n_markers=2时有bg分隔条（峡湾或内部岛）。"
    alternatives:
      - name: "path为薄蜿蜒带（宽2-3格）"
        description: "path区域从厚带变为窄带，粒子轨迹更受约束，碰撞更频繁，转弯更密集；视觉上从宽阔河流变为狭窄溪流。"
        source: "inversion"
        source_task: null
        delta_lines: 20
      - name: "path为网格状结构（十字路口）"
        description: "path不是连续带状，而是形成横竖交叉的网格结构（类似街道网格），粒子在十字路口自然有多个方向可选；从带状区域变为网络拓扑。"
        source: "creative"
        source_task: null
        delta_lines: 50
      - name: "path包含内部障碍物（非bg非path像素）"
        description: "在path带内部放置少量彩色障碍物像素，粒子碰到它们也会触发碰撞转弯；障碍物不在边缘而在路径内部，增加路径不确定性。"
        source: "creative"
        source_task: null
        delta_lines: 25
      - name: "path为对角方向（45度带）"
        description: "path带从反对角（左下-右上）变为正对角（左上-右下）或其他方向；空间布局旋转90度，模板和终止块位置也相应调整。"
        source: "inversion"
        source_task: null
        delta_lines: 20

  - id: D11
    name: "初始方向确定规则"
    tag: path
    current: "初始方向按优先级R,D,L,U检查第一个相邻path邻居确定（对col 0标记总是向右）。"
    alternatives:
      - name: "初始方向由标记颜色编码"
        description: "不同颜色的标记对应不同初始方向（如红=右，蓝=下等），从相邻结构推断变为颜色-方向映射查找；需从样例推断映射。"
        source: "creative"
        source_task: null
        delta_lines: 20
      - name: "初始方向由模板中额外符号指定"
        description: "模板区域中增加方向指示像素（如在色块旁放一个偏移像素表示方向），初始方向从符号读取而非从邻域推断。"
        source: "symbol_instructions"
        source_task: "88e364bc"
        delta_lines: 30
      - name: "初始方向优先级反转为U,L,D,R"
        description: "将方向优先级颠倒，检查顺序变为U,L,D,R；对col 0标记会优先选上而非右，完全改变轨迹起始走向。"
        source: "inversion"
        source_task: null
        delta_lines: 5

  - id: D12
    name: "颜色循环起始位"
    tag: trajectory
    current: "每个标记的循环起始位由其颜色在模板循环中的索引决定（标记色=循环色[0]，所以从索引0开始）。"
    alternatives:
      - name: "每个标记的循环起始位各不相同"
        description: "不同标记用不同颜色（对应不同循环索引），各自从自己的索引位开始涂色；轨迹颜色模式因起点不同而产生相位差异，视觉上更丰富。"
        source: "creative"
        source_task: null
        delta_lines: 15
      - name: "循环起始位由标记到模板的距离决定"
        description: "标记距离模板越远，循环起始位偏移越大（如每10格偏移1位）；解题者需发现距离-偏移关系。"
        source: "creative"
        source_task: null
        delta_lines: 20
      - name: "碰撞后循环重置为0"
        description: "每次碰撞转弯后，颜色循环索引重置回0而非继续递增；每段直行的涂色模式相同，但整体颜色分布改变。"
        source: "creative"
        source_task: null
        delta_lines: 10

  - id: D13
    name: "模板和终止块的擦除行为"
    tag: transform
    current: "输出中擦除所有模板2x2块和终止2x2块（涂为bg），只保留轨迹涂色和角标记。"
    alternatives:
      - name: "保留模板块不擦除"
        description: "模板块在输出中保持原样，只擦除终止块；解题者需理解模板是参考信息而非被变换的对象。"
        source: "keep_source"
        source_task: "53fb4810"
        delta_lines: 5
      - name: "模板块变色为轨迹结束时的循环色"
