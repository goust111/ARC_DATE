task_id: 71e489b6
task_type: transform_in_place
summary: "在蓝色前景区域中检测黑色缺陷（小型黑色连通分量和大型黑色区域的叶子像素），用橙色Chebyshev-1光晕环绕标记，同时吸收黑色区域中的蓝色毛刺像素"

dimensions:
  - id: D1
    name: "光晕变换方式"
    tag: transform
    current: "在缺陷像素的Chebyshev-1（8邻域，3x3）范围内涂橙色，缺陷像素本身保持黑色"
    alternatives:
      - name: "十字形标记替代方形光晕"
        description: "将3x3的方形光晕改为仅在4个正交方向（上下左右）延伸的十字形标记。解题者需要区分'方形环绕'和'十字标记'两种不同的几何覆盖模式，对邻域定义的推理更精细。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "可变半径光晕"
        description: "光晕半径不固定为1，而是由缺陷的大小决定：1像素缺陷用1半径，2像素缺陷用2半径，3像素缺陷用3半径。解题者需要发现缺陷尺寸与光晕范围的对应关系，增加了计数和空间推理的结合。"
        source: size_encoded_parameter
        source_task: 6ffbe589
        delta_lines: 20
      - name: "填充缺陷而非环绕"
        description: "反转当前操作：不环绕缺陷，而是将缺陷像素本身填充为橙色，周围的蓝色保持不变。解题者需要推断'着色目标是缺陷本身而非周围'，从标记模式转为修复模式。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "缺陷区域的洪水填充"
        description: "对每个缺陷，不画固定大小的光晕，而是从缺陷位置做洪水填充，将整个包含该缺陷的封闭蓝色区域填充为橙色。解题者需理解区域连通性和边界概念，推理模式从局部变为全局。"
        source: flood_fill
        source_task: dbff022c
        delta_lines: 40
      - name: "方向性射线标记"
        description: "从每个缺陷像素向四个正交方向发射橙色射线，直到碰到黑色区域边界或网格边界停止。光晕不再是固定范围的方块，而是动态长度的十字射线。解题者需要推断射线的终止条件和方向规则。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D2
    name: "缺陷检测条件"
    tag: src
    current: "黑色连通分量大小<=3的为小缺陷（整体标记）；大型黑色连通分量中4邻域黑色邻居<=1的叶子像素也被标记"
    alternatives:
      - name: "仅检测单像素缺陷"
        description: "将缺陷阈值从<=3降为仅1像素。解题者需要在视觉上区分1像素和2-3像素的黑色点，只有最小的点被标记。增加了对精确尺寸判断的要求。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "基于形状而非大小的检测"
        description: "不按连通分量大小筛选，而按形状筛选：只标记非矩形的黑色连通分量（如L形、对角线形），矩形的小黑块不标记。解题者需要识别形状属性而非简单计数。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "异常检测：蓝色区域中的非蓝色像素"
        description: "将检测条件泛化为'蓝色区域内部的任何非蓝色像素'，不限于黑色。输入中可能有多种颜色的小缺陷（如灰色、红色），全部被橙色光晕标记。解题者需要理解'前景区域中的异类像素'这一更抽象的规则。"
        source: anomaly_detection
        source_task: b99e7126
        delta_lines: 15
      - name: "仅检测叶子像素，忽略小连通分量"
        description: "反转当前的双重检测策略：只标记大型黑色区域的叶子像素（悬挂端点），忽略小型独立黑色连通分量。解题者需要理解图论中的'叶节点'概念来确定哪些像素被标记。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D3
