    alternatives:
      - name: "毛刺保留并标记"
        description: "反转吸收操作：蓝色毛刺不被删除，而是用另一种颜色（如品红色）标记出来。输出中同时有橙色标记的缺陷和品红色标记的毛刺，解题者需推断两种不同的标记规则。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "毛刺扩展而非吸收"
        description: "蓝色毛刺不被吸收，反而向周围的黑色区域扩展1像素（生长）。解题者需发现'小蓝块生长、小黑块被标记'的对偶规则，推理复杂度显著提升。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "无毛刺预处理"
        description: "移除吸收步骤，输入中不包含蓝色毛刺。这简化了任务但让解题者能更专注于缺陷检测的核心逻辑，降低了干扰。"
