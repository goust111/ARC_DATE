  - id: D4
    name: "边界检测：缺陷定位策略"
    tag: boundary_detection
    current: "缺陷必须严格位于蓝色区域内部（每个4邻居都是蓝色或网格边界），叶子像素位于蓝黑区域交界处且仅有<=1个同色邻居"
    alternatives:
      - name: "仅标记跨越边界的缺陷"
        description: "反转当前策略：只标记位于蓝黑边界上的黑色像素（至少有一个蓝色和一个黑色4邻居），忽略完全在蓝色内部的孤立缺陷。解题者需要理解'边界接触'的概念来确定标记对象。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "基于距离的检测"
        description: "检测标准变为黑色像素到最近蓝黑边界的Chebyshev距离：只有距离>=2（即被蓝色完全包围至少两层）的黑色像素才被标记。这要求解题者估算空间距离而非简单的邻域检查。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "凸性检测"
        description: "检测蓝色区域中破坏凸性的黑色像素：如果移除某个黑色小块后蓝色区域变得'更凸'，则标记该缺陷。解题者需要理解几何凸性概念，推理门槛显著提高。"
        source: creative
        source_task: null
        delta_lines: 45

