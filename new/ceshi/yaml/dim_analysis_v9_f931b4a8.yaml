task_id: f931b4a8
task_type: symmetry/pattern
summary: "输入网格分为四个象限：左上和右上为控制象限（前景像素计数决定输出高度和宽度），左下为颜色源瓦片，右下为模板瓦片；将模板铺贴到输出尺寸，模板中的背景像素替换为左下象限对应瓦片重复坐标处的粗粒度颜色"

dimensions:
  - id: D1
    name: "输出尺寸的编码方式"
    tag: symbol_instructions
    current: "左上象限前景像素计数 = 输出行数，右上象限前景像素计数 = 输出列数"
    alternatives:
      - name: "前景色块的外接矩形尺寸决定输出大小"
        description: "左上象限前景区域的外接矩形高度 = 输出行数，右上象限前景区域的外接矩形宽度 = 输出列数。解题者需要从散布的前景像素中提取空间范围而非计数，推理过程从数量统计变为空间感知"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "前景颜色的数值本身编码尺寸"
        description: "左上象限的前景颜色值 = 输出行数，右上象限的前景颜色值 = 输出列数（如颜色6表示6行）。解题者需要将颜色值解释为数字量，引入了符号-数值映射的认知跳跃"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "用连通分量数量编码尺寸"
        description: "左上象限中不同前景连通分量的数量 = 输出行数，右上象限同理。解题者需要识别并计数离散的色块群组，增加了分割与计数的复杂度"
        source: counting
        source_task: 8f215267
        delta_lines: 25
      - name: "前景像素行数/列数编码尺寸"
        description: "左上象限中包含至少一个前景像素的行数 = 输出行数，右上象限中包含前景像素的列数 = 输出列数。解题者需要按行列扫描判断非空行列数，与简单计数不同"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D2
    name: "控制象限的布局位置"
    tag: src
    current: "左上象限控制输出高度，右上象限控制输出宽度"
    alternatives:
      - name: "左上控制宽度，右上控制高度（行列互换）"
        description: "交换两个控制象限的角色：左上的前景计数变为输出列数，右上的变为行数。解题者需要发现这一交叉映射关系，容易产生直觉误判"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "四个象限中两个非对角象限为控制区"
        description: "左下象限和右上象限作为控制区（而非左上和右上），左上和右下为颜色源和模板。改变了输入的空间解读结构，解题者需要重新定位各区域的功能"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "控制信息编码在网格边缘的单行/单列"
        description: "输出尺寸由网格最上行和最左列的前景像素计数决定，其余区域为颜色源和模板。控制信息从二维象限压缩到一维边界，解题者需要识别边界编码"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 25

  - id: D3
    name: "颜色源（左下象限）的结构"
    tag: src
    current: "左下象限作为颜色源瓦片，可以是均匀单色或含有多色行列图案；其像素值在铺贴时按瓦片重复坐标粗粒度填充模板的背景位置"
    alternatives:
      - name: "颜色源为单一固定颜色（由象限内唯一前景色决定）"
        description: "左下象限始终为均匀单色填充，所有模板背景像素替换为同一颜色。去除了粗粒度颜色变化，简化了推理但减少了输出的视觉丰富度"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "颜色源按模板内像素坐标逐像素映射"
        description: "不按瓦片重复坐标而是按模板内局部坐标使用颜色源，即每个模板重复内部的背景像素使用 LL[stencil_r][stencil_c] 的颜色。这使得每个铺贴重复单元的填充颜色相同但内部有颜色变化"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "颜色源为一个小色条/图例"
        description: "左下象限不填满颜色瓦片，而是在角落放置一个小的色条（如2x1或1x3），按顺序循环提供各铺贴重复单元的背景色。解题者需要先识别图例再解码循环规律"
        source: legend_lookup
        source_task: 58490d8a
        delta_lines: 25
      - name: "颜色源为渐变序列"
        description: "颜色源的每行或每列使用不同颜色，铺贴时按输出行/列方向逐步切换背景色，形成渐变效果。解题者需要发现颜色随空间位置递进变化的规律"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "模板（右下象限）的结构"
    tag: src
    current: "右下象限为模板瓦片，含有非零前景色形成的图案（如棋盘格、框架等）和零值背景；背景位置由颜色源填充"
    alternatives:
      - name: "模板全为空（全零）"
        description: "模板象限全部为背景色，此时直接铺贴颜色源。这是当前任务已出现的退化情况（Train 3），作为变体可以使其成为主要模式而非特例"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "模板含多种非零前景色"
        description: "模板中出现两种以上不同的前景色，铺贴后输出呈现更复杂的多色周期图案。解题者需要区分哪些颜色属于模板结构，哪些属于颜色源填充"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "模板为嵌套框架结构"
        description: "模板不是简单的棋盘或散点图案，而是由同心矩形框架嵌套构成（如外层一圈前景色、内层一圈背景、中心前景），铺贴后形成砖墙式嵌套周期图案"
        source: nested_frames
        source_task: 45a5af55
        delta_lines: 15
      - name: "模板为对角条纹"
        description: "模板中的前景像素沿对角线分布（如左上到右下的对角线），铺贴后在大输出中形成连续的斜向条纹。视觉效果与水平/垂直周期截然不同"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D5
    name: "铺贴方式"
    tag: transform
    current: "模板以周期铺贴方式填充输出矩形：output[r][c] = stencil[r % H_stencil][c % W_stencil]，铺贴从左上角 (0,0) 开始"
    alternatives:
      - name: "镜像铺贴（相邻瓦片翻转）"
        description: "相邻的铺贴重复单元沿共享边翻转（水平方向偶数列翻转，垂直方向偶数行翻转），形成无缝镜像拼接。输出呈现万花筒效果，解题者需要发现翻转规律而非简单重复"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 20
      - name: "旋转铺贴（逐象限旋转90度）"
        description: "四个相邻铺贴单元分别为原始、顺时针90度、180度、逆时针90度旋转版本，形成四方旋转对称的铺贴图案。解题者需要识别旋转周期"
        source: rotation
        source_task: 2c181942
        delta_lines: 25
      - name: "偏移铺贴（砖墙式错位）"
        description: "每隔一行（或一列）的铺贴单元水平偏移半个瓦片宽度，形成砖墙式排列。打破了严格的网格对齐，增加了空间推理的维度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "单次放置（不铺贴，居中或左上对齐）"
        description: "模板只放置一次，不进行周期铺贴；输出中未被模板覆盖的区域全部用颜色源填充。解题者需要理解模板不重复而是单次嵌入的逻辑"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D6
    name: "背景替换规则"
    tag: transform
    current: "模板中的零值像素被替换为颜色源在粗粒度坐标（瓦片重复索引）处的颜色：fill_color = LL[tile_row][tile_col]"
    alternatives:
      - name: "背景替换为颜色源在模板内局部坐标处的颜色"
        description: "使用 LL[r % stencil_H][c % stencil_W] 而非 LL[tile_row][tile_col]。填充颜色由模板内的相对位置决定，每个铺贴重复单元内部有颜色变化但各重复单元相同。改变了颜色源的空间映射粒度"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "背景替换颜色按输出行索引循环"
        description: "输出每一行使用不同的背景替换色，颜色从颜色源的某个序列中按行号取模循环获取。形成水平条纹叠加在模板图案上的效果"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "模板前景和背景角色互换"
        description: "模板中的非零像素位置用颜色源颜色填充，零值位置保持模板的默认前景色。反转了前景/背景的语义，解题者需要发现这一对调关系"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "背景替换颜色由模板前景色的邻域决定"
        description: "每个背景像素的替换颜色取决于其最近的模板前景像素的颜色（如最近邻颜色传播），而非来自颜色源象限。改变了颜色来源的逻辑，需要空间距离推理"
        source: flood_fill
        source_task: dbff022c
        delta_lines: 30

  - id: D7
    name: "输出网格形状"
    tag: grid_shape
    current: "输出尺寸由两个控制象限的前景像素计数严格确定：height = count(UL_fg), width = count(UR_fg)"
    alternatives:
      - name: "输出固定为正方形（取两个计数的最大值）"
        description: "输出始终为正方形，边长取两个控制计数的较大值。解题者需要发现取最大值的规则，当两个计数不同时需要理解如何处理"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "输出为模板尺寸的整数倍"
        description: "控制象限的计数不直接决定输出尺寸，而是决定模板沿各方向铺贴的重复次数。输出大小 = count * stencil_size。解题者需要理解计数含义从像素数变为重复次数"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "输出为模板尺寸乘以控制计数除以某基准值"
        description: "输出尺寸由 (count / base) * stencil_size 计算，其中 base 需要从示例中推断（如前景色数值或象限面积）。增加了一层算术推理"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D8
    name: "象限的划分方式"
    tag: meta
    current: "输入网格沿中点均分为四个等面积象限（H/2 x W/2），以正方形或偶数尺寸矩形网格为前提"
    alternatives:
      - name: "用分隔线（特定颜色的行/列）划分象限"
        description: "四个区域由网格内一条水平分隔线和一条垂直分隔线分隔（如灰色线），区域大小不一定相等。解题者需要先检测分隔线位置再确定各区域边界"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 25
      - name: "非等分象限（按内容自适应划分）"
        description: "四个象限的分界不在中点，而是由内容结构决定（如颜色变化的边界处）。解题者需要从像素模式推断实际的分界线位置"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "三区域布局（上方控制区 + 下方左右两源区）"
        description: "不分四个象限，而是上半部分为统一的控制区（高度和宽度信息混合编码），下半部分左右分别为颜色源和模板。从2x2象限变为1+2布局"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D9
    name: "前景/背景的判定"
    tag: match_cond
    current: "零值（颜色0）为背景，非零值为前景；控制象限中非零像素被计数，模板中零值位置被颜色源替换"
    alternatives:
      - name: "最频繁出现的颜色为背景"
        description: "背景色不固定为0，而是各象限中出现频率最高的颜色。解题者需要统计各区域的颜色分布来确定哪种颜色是背景，增加了预处理步骤"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "控制象限中特定颜色为前景标记"
        description: "控制象限的前景不是所有非零色，而是特定的标记颜色（如与模板或颜色源中某种颜色匹配的颜色）。解题者需要通过象限间的颜色关联推断哪种颜色才是有效的前景标记"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 20
      - name: "模板中两种颜色分别映射到模板结构色和颜色源色"
        description: "模板不是非零/零的二值结构，而是由两种非零颜色构成，一种作为固定结构保留，另一种作为可替换位置被颜色源填充。解题者需要区分模板中两种前景色的不同语义角色"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D10
    name: "控制象限前景的空间排列"
    tag: meta
    current: "控制象限的前景像素可以是任意排列（均匀填充、稀疏散布等），仅计数有意义，空间位置无额外语义"
    alternatives:
      - name: "前景像素的空间排列编码额外信息"
        description: "控制象限中前景像素不仅计数决定输出尺寸，其排列形状还编码铺贴偏移或起始相位（如前景色块在象限中偏左则铺贴从模板中间列开始）。增加空间感知维度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "前景颜色多样化，不同颜色分别控制不同参数"
        description: "控制象限中出现多种非零颜色，某种颜色的计数控制输出尺寸，另一种颜色的计数控制铺贴重复次数或相位偏移。解题者需要分离和解读多个颜色通道的含义"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "前景像素排列成数字形状（如3x5点阵数字）"
        description: "控制象限中的前景像素排列成可识别的阿拉伯数字形状，该数字直接表示输出尺寸。解题者需要视觉识别数字而非计数像素，推理模式从量化变为模式识别"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D11
    name: "模板与颜色源的组合逻辑"
    tag: transform
    current: "简单覆盖：模板非零像素保持不变，模板零像素被颜色源替换"
    alternatives:
      - name: "颜色混合（模板色与颜色源色按规则混合）"
        description: "模板非零位置的最终颜色由模板色和颜色源色共同决定（如取两者中数值较大的，或使用一个颜色映射表）。解题者需要发现组合规则而非简单的覆盖逻辑"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "颜色源覆盖模板前景，模板背景保持默认色"
        description: "反转当前逻辑：颜色源的颜色填入模板的非零位置，模板的零值位置保持固定的默认背景色。解题者需要发现前景/背景角色的反转"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "模板作为遮罩，颜色源的两种颜色分别填充遮罩的两侧"
        description: "模板的非零区域定义了边界，颜色源提供的两种颜色分别填充边界的内部和外部（类似 tile_composition）。解题者需要理解遮罩的区域划分逻辑"
        source: tile_composition
        source_task: 7491f3cf
        delta_lines: 25

  - id: D12
    name: "输出中模板像素的颜色来源"
    tag: transform
    current: "模板非零像素在输出中保持其原始颜色值不变"
    alternatives:
      - name: "模板像素重着色为颜色源的互补色"
        description: "模板的前景像素不保持原色，而是被替换为颜色源中与之配对的颜色（如通过一个从可见象限推断的映射表）。解题者需要发现颜色转换规则"
        source: recolor
        source_task: 20270e3b
        delta_lines: 20
      - name: "模板像素颜色由其在控制象限中的位置决定"
        description: "模板中出现的每种前景色，其在输出中的实际颜色由控制象限中对应颜色的位置或数量确定。建立了模板色与控制信息之间的交叉引用"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 25
      - name: "模板像素颜色与颜色源颜色互换"
        description: "输出中模板前景位置使用颜色源的颜色，而背景位置使用模板的前景颜色，实现全局颜色角色对换。视觉效果为正片/负片互换"
        source: color_swap
        source_task: a25697e4
        delta_lines: 10

  - id: D13
    name: "多步处理与迭代"
    tag: multi_step
    current: "单步处理：读取四个象限 -> 计算输出尺寸 -> 铺贴并替换 -> 输出"
    alternatives:
      - name: "两轮铺贴（先粗后细）"
        description: "第一轮用颜色源粗铺贴到输出尺寸，第二轮将模板图案叠加到第一轮结果上。两步的顺序和逻辑都需要被正确推断，增加了流程理解难度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "递归铺贴（模板内嵌套铺贴）"
        description: "模板本身的非零区域内部再进行一次小尺度的铺贴（使用颜色源的子区域），形成分形式的多层嵌套结构。解题者需要识别递归结构"
        source: fractal_tiling
        source_task: a32d8b75
        delta_lines: 35
      - name: "先铺贴再裁剪到控制尺寸"
        description: "先将模板无限铺贴（概念上），然后用控制象限确定的矩形窗口裁剪出最终输出。如果窗口不从 (0,0) 开始，输出中的铺贴相位会偏移，增加了窗口定位的推理"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D14
    name: "颜色源与模板的尺寸关系"
    tag: meta
    current: "颜色源和模板的尺寸相同（均为半网格大小），两者一一对应地参与铺贴"
    alternatives:
      - name: "颜色源尺寸小于模板（需放大对齐）"
        description: "颜色源为小尺寸瓦片（如2x2），模板为大尺寸（如4x4），颜色源需要放大或重复来匹配模板的空间分辨率。解题者需要发现尺寸比例关系"
        source: scaling
