task_id: 36a08778
task_type: move_along_path
summary: "品红色水流从顶部边缘源头垂直下落，遇到红色水平架子后沿架子两侧溢出并继续下落，形成分支瀑布树"

dimensions:
  - id: D1
    name: "下落路径方向"
    tag: path
    current: "水流垂直向下（gravity），遇到架子后水平扩散再继续垂直下落"
    alternatives:
      - name: "对角线下落"
        description: "水流不是垂直下落而是沿45度对角线方向下落，遇到架子后沿架子扩散再从另一侧沿对角线继续。解题者需在非正交坐标系中追踪水流路径，空间推理难度大幅提升"
        source: diagonal_ray
        source_task: "142ca369"
        delta_lines: 30
      - name: "向上喷射（反重力）"
        description: "反转gravity方向：水源位于底部边缘，水流向上喷射，遇到架子后向两侧溢出再继续向上。视觉上呈'倒瀑布'效果，解题者需识别反重力规则"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "水平流动"
        description: "水源位于左侧边缘，水流水平向右流动，遇到垂直障碍后向上下两侧分流再继续向右。将垂直瀑布变为水平河流分支系统，完全改变空间布局"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "螺旋下落"
        description: "水流下落时按顺时针螺旋路径前进，每转90度时检测是否有架子。类似 da515329 的螺旋路径机制，在瀑布场景中产生旋转式的分支模式"
        source: spiral_path
        source_task: "da515329"
        delta_lines: 40

  - id: D2
    name: "架子碰撞后的扩散方式"
    tag: path
    current: "水流碰到架子后在架子上方一行向两侧扩散至架子跨度+1格，然后从两端溢出继续下落"
    alternatives:
      - name: "仅单侧溢出（最近边缘侧）"
        description: "反转双侧扩散为单侧：水流碰到架子后只向距网格边缘更近的一侧扩散并溢出，另一侧截断。解题者需推断方向选择规则，引入边缘距离判断"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "穿透架子继续下落（架子有缺口）"
        description: "如果架子中有1格宽的缺口（背景色），水流直接穿过缺口继续下落而不扩散。解题者需区分完整架子（扩散）和有缺口架子（穿透），增加条件判断复杂度"
        source: width_constraint
        source_task: "332f06d7"
        delta_lines: 20
      - name: "扩散范围由架子长度决定"
        description: "水流在架子上方的水平扩散范围不是固定的架子跨度+1，而是架子长度×2（向两侧各扩展架子长度格），产生更宽的扩散。解题者需推断扩散范围与架子尺寸的数值关系"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "反弹回上方（弹跳机制）"
        description: "水流碰到架子后不仅向两侧扩散，还有部分水流反弹回上方若干格再停止。类似 142ca369 的 reflection 机制，产生上下双向的水花效果"
        source: reflection
        source_task: "142ca369"
        delta_lines: 25

  - id: D3
    name: "水流通道宽度约束"
    tag: path
    current: "水流始终为1列宽，通过每个BFS节点以(row, col)为单位移动"
    alternatives:
      - name: "宽水流（2-3列宽）"
        description: "水源宽度为2-3列，水流下落时保持多列宽度，碰到架子后整体扩散。增加碰撞检测的复杂度，解题者需追踪宽流体的分裂行为"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "通道宽度约束（必须足够宽才能通过）"
        description: "水流有最小宽度要求，如果两个架子之间的间距不够宽，水流无法通过而被卡住。类似 332f06d7 的宽度约束机制，增加可通行性判断"
        source: width_constraint
        source_task: "332f06d7"
        delta_lines: 20
      - name: "水流逐渐变窄"
        description: "每经过一个架子分流后，子水流的宽度减少（如从3列变为2列再变为1列），最终变为0时停止。引入衰减概念，解题者需追踪分支深度与宽度的对应关系"
        source: creative
        source_task: null
        delta_lines: 18

  - id: D4
    name: "轨迹涂色模式"
    tag: trajectory
