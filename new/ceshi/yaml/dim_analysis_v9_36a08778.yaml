      - name: "颜色随深度变化"
        description: "水流的颜色随分支深度递变：第一层为品红，第二层为蓝色，第三层为青色等。解题者需从输出中推断颜色与分支层级的对应关系，引入层级推理"
        source: color_cycle
        source_task: "195c6913"
        delta_lines: 15
      - name: "碰到架子时颜色改变"
        description: "水流每次碰到架子并扩散后，颜色切换为架子颜色（红色），然后下落时再切回水色。交替的颜色编码了碰撞历史，类似 142ca369 的 color_change_on_bounce"
        source: color_change_on_bounce
        source_task: "142ca369"
        delta_lines: 15
      - name: "周期性颜色瓷砖"
        description: "水流路径上以固定周期重复某个小图案（如品红-背景-品红），类似 53fb4810 的 periodic_tiling。产生纹理化的瀑布效果，增加模式识别难度"
        source: periodic_tiling
        source_task: "53fb4810"
        delta_lines: 18

