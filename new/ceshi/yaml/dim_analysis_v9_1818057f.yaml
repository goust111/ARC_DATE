    tag: transform
    current: "所有'+'字图案统一着色为青色(8/teal)，单一固定目标颜色"
    alternatives:
      - name: "目标颜色由'+'所在连通分量大小编码"
        description: "不同大小的连通分量中的'+'着不同颜色：小连通分量(size<15)中的'+'着青色，大连通分量(size>=15)中的'+'着品红色。解题者需要先计算连通分量大小再决定着色，增加了计数和分类的推理步骤。"
        source: counting
        source_task: 8f215267
        delta_lines: 25
      - name: "目标颜色由'+'数量的序号编码"
        description: "按从上到下、从左到右的顺序给'+'编号，第1个用颜色A，第2个用颜色B，依此类推（循环使用一个颜色调色板）。解题者需要推断扫描顺序和颜色循环规则，增加了序列推理的维度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "目标颜色由'+'的邻域密度决定"
        description: "如果'+'的8-邻域（去掉'+'本身5格后剩余的外围格）中前景像素占比超过50%则着色为青色，否则着色为品红色。解题者需要同时判断局部密度和'+'形状，将统计分析与模式识别结合。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "颜色交换：前景色与新颜色互换"
        description: "'+'图案重着色为青色的同时，原本就是青色的像素（如果存在）变为前景色。虽然当前输入中不含青色，但如果输入中预置少量青色干扰像素，解题者需要理解双向颜色交换规则。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 15

  - id: D3
    name: "识别目标：'+'字图案的定义"
    tag: src
    current: "黄色'+'字精灵：任何前景像素(r,c)若其4个正交邻居均为前景色，则(r,c)及其4邻居构成一个'+'"
    alternatives:
      - name: "T型图案识别"
        description: "将目标从'+'字改为T型：中心像素加上3个方向的正交邻居（上、左、右或其他3方向组合）。解题者需要识别不对称的T形而非对称的十字形，旋转不变性判断更复杂。需要检测所有4种旋转方向的T型。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "L型图案识别"
        description: "目标变为L型拐角：中心像素加2个相邻正交方向的邻居（如右和下）。L型有4种旋转变体，每种都需被识别。解题者需辨别L形与其他2-邻居模式的区别，推理基于局部连接性而非完全十字形。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "孤立十字（非嵌入式'+'"
        description: "反转当前规则：只重着色那些恰好由5个像素构成的孤立'+'（即连通分量恰好是5个像素的十字形），而忽略嵌入在大色块中的'+'图案。当前规则是所有嵌入的'+'都算，这里取反为只有独立的才算。但根据spec，当前任务的'+'总是嵌入的，所以这一变体需要在生成时创建同时包含孤立和嵌入'+'的网格。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "3x3实心方块识别"
        description: "目标从'+'字改为3x3全前景色实心方块（9个像素全为前景色）。这是一个更严格的条件（'+'的4个对角也必须是前景色），匹配更少但更大的局部结构。解题者需要区分部分填充和完全填充的3x3区域。"
        source: creative
        source_task: null
        delta_lines: 10

