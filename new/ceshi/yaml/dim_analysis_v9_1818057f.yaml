  - id: D9
    name: "扫描方向和处理顺序"
    tag: multi_step
    current: "从上到下、从左到右扫描内部像素(r in 1..H-2, c in 1..W-2)，基于原始输入判断'+'，一次性完成所有标记"
    alternatives:
      - name: "迭代传播式重着色"
        description: "第一轮扫描只标记'+'的中心像素为青色。第二轮扫描中，任何前景像素若正交邻居中有青色像素，也变为青色。这样'+'从中心向外扩散。如果只做2轮，效果等价于当前规则；但如果做N轮（N可配置），重着色会沿前景连通分量传播。解题者需要推断传播的步数。"
        source: seed_propagation
        source_task: 800d221b
        delta_lines: 25
      - name: "从外向内扫描（边界优先）"
        description: "不按行列顺序，而是从网格边缘开始逐层向内扫描。效果上与当前规则相同（因为基于原始输入判断），但如果改为基于已修改网格判断（即先处理的结果影响后处理的判断），则扫描方向会导致不同结果——靠近边缘的'+'先被处理，其重着色可能破坏内部'+'的邻居条件。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "两步变换：先标记再扩展"
        description: "第一步：识别所有'+'中心，标记为青色（仅中心1像素）。第二步：对每个青色像素，将其4个前景邻居也着色为青色。两步分离使得解题者可以分别推断标记规则和扩展规则。"
        source: multi_step
        source_task: null
        delta_lines: 15
      - name: "逐个'+'依次处理，后续检测基于已修改网格"
        description: "每找到一个'+'就立即重着色，后续的'+'检测基于已修改的网格。这意味着重着色一个'+'后，相邻区域的'+'条件可能改变（因为青色!=前景色，所以原本满足条件的邻居可能不再满足）。处理顺序影响最终结果，解题者需要推断正确的顺序。"
        source: creative
        source_task: null
        delta_lines: 15

