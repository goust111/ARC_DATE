task_id: 1818057f
task_type: transform_in_place
summary: "在红色背景上由黄色前景像素构成的混合图案中，识别所有嵌入的'+'字图案（中心像素的4个正交邻居均为前景色），并将其5个像素重新着色为青色(teal)"

dimensions:
  - id: D1
    name: "核心变换操作：重着色规则"
    tag: transform
    current: "识别'+'字图案后，将构成'+'的5个像素从前景色(黄色4)统一重着色为青色(teal 8)，其余像素不变"
    alternatives:
      - name: "擦除'+'字图案"
        description: "将识别到的'+'字图案的5个像素擦除为背景色，而非重着色为新颜色。解题者需要识别相同的'+'模式，但输出是'减法'而非'替换'。视觉上，前景中出现的空洞让解题者需要反向推断被删除的图案。"
        source: erase
        source_task: 71e489b6
        delta_lines: 5
      - name: "旋转'+'字图案为'X'形"
        description: "将'+'字图案旋转45度变为'X'形：中心不变，4个正交邻居移到4个对角位置。原正交位置恢复为背景色，对角位置着色为新颜色。解题者需要理解从'+'到'X'的几何旋转关系，推理过程更加复杂。"
        source: rotation
        source_task: 2b83f449
        delta_lines: 25
      - name: "分解'+'：中心与臂分别处理"
        description: "将'+'中心像素着色为一种颜色(如青色8)，四条臂的像素着色为另一种颜色(如品红色6)。解题者需同时推断两种不同的着色规则及其与'+'字结构部位的对应关系，增加了颜色映射的推理维度。"
        source: decomposition
        source_task: a47bf94d
        delta_lines: 15
      - name: "根据臂延伸长度条件性重着色"
        description: "只有当'+'字图案的至少一条臂向外延伸超过2个前景像素时才重着色为青色，否则保持原色不变。引入了条件判断：解题者需要不仅识别'+'形状，还需评估其嵌入环境的规模才能决定是否变换。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "'+' 图案膨胀填充"
        description: "识别'+'字图案后，不仅将5个像素着色为青色，还将'+'的外围一圈（即中心的8-邻域中非'+'部分的4个对角格）也填充为青色，形成3x3实心方块。解题者需推断从'+'到实心块的膨胀规则，几何推理更加丰富。"
        source: hole_fill
        source_task: 3a25b0d8
        delta_lines: 15

  - id: D2
