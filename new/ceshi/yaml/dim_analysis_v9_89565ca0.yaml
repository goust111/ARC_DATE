task_id: 89565ca0
task_type: move_in_order
summary: "识别多个彩色线框架中的封闭背景区域数，将每个框架映射为长度等于其房间数的水平色条，按房间数升序排列输出"

dimensions:
  - id: D1
    name: "排序依据：封闭区域数量"
    tag: match_cond
    current: "按每个框架的封闭4-连通背景区域数量升序排列"
    alternatives:
      - name: "按框架外接矩形面积排序"
        description: "用框架bbox的面积（高x宽）替代房间数作为排序键。解题者需要估算每个框架的空间范围而非计数内部房间，改变了推理焦点从拓扑分析到空间感知。"
        source: area_grouping
        source_task: 62593bfd
        delta_lines: 15
      - name: "按框架颜色的像素总数排序"
        description: "用框架在输入中可见的像素总数排序。需要在噪声干扰下准确估计每种颜色的墙壁像素数量，考验视觉统计能力。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "按框架到网格中心的距离排序"
        description: "用框架bbox中心到网格中心的欧几里得距离排序。引入空间位置感知维度，从近到远或从远到近排列。"
        source: distance_ordering
        source_task: 291dc1e1
        delta_lines: 20
      - name: "按框架的内部网格线数量排序"
        description: "用每个框架中可识别的水平线+垂直线总数排序，而非封闭区域数。需要从噪声中重建线段结构并计数，推理过程更直接但仍需去噪。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "降序排列（取反）"
        description: "将排序方向从升序改为降序，房间最多的框架排在最上面。简单的取反但改变了输出的视觉模式。"
        source: inversion
        source_task: null
        delta_lines: 3

  - id: D2
    name: "消歧规则：覆盖顺序"
    tag: match_cond
    current: "房间数相同时，被覆盖在下方的框架排在前面（底部优先）"
    alternatives:
      - name: "按颜色值顺序消歧"
        description: "房间数相同时按颜色索引（如ARC颜色表中的编号）排序。消除了对空间覆盖关系的推理需求，改用颜色属性，但对人类来说需要记忆颜色编号的约定顺序。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "按框架位置（行优先）消歧"
        description: "房间数相同时按框架bbox左上角的行坐标排序，行相同则按列排。类似position_ordering，解题者需要比较空间位置而非覆盖关系。"
        source: position_ordering
        source_task: 2ba387bc
        delta_lines: 15
      - name: "顶部优先（取反）"
        description: "覆盖在上方的框架排在前面而非后面。取反当前的覆盖顺序逻辑，解题者需要正确判断谁在谁上面。"
        source: inversion
        source_task: null
        delta_lines: 5

  - id: D3
    name: "源对象：彩色线框架"
    tag: src
    current: "轴对齐的1像素厚彩色线绘制的分区框架，包含水平和垂直线段形成网格状房间结构"
    alternatives:
      - name: "实心彩色矩形带内部洞"
        description: "用实心彩色矩形替代线框架，其中包含若干背景色的矩形洞。解题者需要识别每种颜色的实心区域并计数内部的洞，视觉上更直观但拓扑分析不同。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "彩色封闭多边形"
        description: "用不规则的封闭多边形轮廓替代矩形网格线。框架仍然围出封闭区域但形状不规则，增加了形状识别和区域计数的视觉复杂度。"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "嵌套彩色方框"
        description: "每个框架由若干嵌套的同色方形边框组成，嵌套层数即为该框架的'计数值'。视觉上更容易辨识但改变了计数对象。"
        source: nested_frames
        source_task: 45a5af55
        delta_lines: 45
      - name: "带内部分隔线的色块"
        description: "用2像素厚的线替代1像素线，使框架更粗更容易识别。保持核心逻辑不变但降低去噪难度，适合作为较简单的变体。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "噪声/干扰机制"
    tag: src
    current: "一种颜色的散落噪声像素覆盖4-9%的网格，既出现在框架内外，也会损坏部分墙壁像素"
    alternatives:
      - name: "无噪声干扰"
        description: "移除所有噪声像素，框架完整可见。大幅降低难度但保留核心的房间计数逻辑，适合简化变体。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "多种颜色的噪声"
        description: "使用2-3种不同颜色的噪声而非单一颜色。解题者需要区分哪些颜色是框架色、哪些是噪声色，增加了分类推理的复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "噪声颜色与某个框架颜色相同"
        description: "噪声使用与某个框架相同的颜色，该框架需通过其他线索（如结构规整性）来区分。极大增加了辨别难度，需要更深入的结构分析。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "干扰框架替代散落噪声"
        description: "添加一个没有封闭区域的额外彩色线段集合作为干扰项，而非散落像素。解题者需要判断哪些线段构成有效框架、哪些是无用干扰。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D5
    name: "目标编码：水平色条长度"
    tag: dst
    current: "每行一个水平色条，长度等于对应框架的封闭区域数量，右侧用噪声色填充"
    alternatives:
      - name: "垂直色条堆叠"
        description: "将输出旋转90度，每列一个垂直色条，高度等于房间数。改变输出的空间方向，解题者需要适应列式编码。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "用色块面积编码"
        description: "每个框架输出一个NxN的同色方块，N为房间数。面积编码比长度编码更直观但占用更多空间，输出网格尺寸需相应调整。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "堆叠在输入网格左边缘"
        description: "不生成新的输出网格，而是在输入网格的左边缘堆叠色条。保持输入的视觉上下文，类似b5ca7ac4的堆叠方式。"
        source: stacking
        source_task: b5ca7ac4
        delta_lines: 25
      - name: "在输出中用点阵表示计数"
        description: "每行不画连续色条，而是在固定间距位置放置N个同色点，类似8f215267的点放置方式。视觉上更稀疏但同样编码了计数信息。"
        source: dot_placement
        source_task: 8f215267
        delta_lines: 15

  - id: D6
    name: "填充/背景色"
    tag: dst
    current: "色条右侧用噪声色（散落像素的颜色）填充至最大宽度"
    alternatives:
      - name: "用背景色（黑色）填充"
        description: "用黑色背景而非噪声色填充空位。解题者不需要识别噪声颜色来构建输出，降低了从输入推断填充色的难度。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "用对应框架颜色的互补色填充"
        description: "每行的填充色与该行框架色有固定的颜色映射关系（如ARC调色板中的互补位置）。增加了颜色推理维度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "不填充，紧凑输出"
        description: "每行仅包含色条部分，不补齐到统一宽度。输出变成参差不齐的形状，宽度信息隐含在行长中。但这不太适合ARC的矩形输出约束，需要其他方式处理。"
        source: tight_crop
        source_task: 67e490f4
        delta_lines: 10

  - id: D7
    name: "变换：房间数到条长的映射"
    tag: transform
    current: "直接映射：色条长度 = 封闭区域数量"
    alternatives:
      - name: "长度 = 房间数 x 2"
        description: "将房间数乘以2作为条长，输出更长更容易区分。保持单调映射但改变比例因子，解题者需要发现这个缩放关系。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "长度 = 最大房间数 - 当前房间数 + 1（取反映射）"
        description: "房间最多的框架输出最短的条，房间最少的框架输出最长的条。完全反转计数-长度关系，增加推理的反直觉性。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "颜色重映射：框架色变为覆盖顺序对应的新颜色"
        description: "输出中的颜色不再是原始框架色，而是基于排序位置重新分配颜色。解题者需要同时推断排序规则和颜色映射规则。"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 20
      - name: "色条长度 = 框架内的墙壁线段数"
        description: "不计数封闭区域而是计数可识别的独立墙壁线段。改变计数对象但保持整体框架不变，需要不同的结构分析方法。"
        source: creative
        source_task: null
        delta_lines: 25

