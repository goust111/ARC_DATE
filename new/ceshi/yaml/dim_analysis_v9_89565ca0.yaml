        delta_lines: 15
      - name: "转置输出：高度 = 最大房间数，宽度 = 框架数"
        description: "输出矩阵转置，每列一种颜色从底部向上堆叠。改变读取方向但保留相同的信息内容。"
        source: inversion
        source_task: null
        delta_lines: 8

  - id: D9
    name: "框架重叠与覆盖关系"
    tag: meta
    current: "框架的外接矩形可能重叠（0-3对），重叠处上方框架的颜色可见，覆盖顺序用于消歧相同房间数"
    alternatives:
      - name: "禁止任何重叠"
        description: "所有框架完全不重叠，消除覆盖顺序的推理需求。同时必须改用其他消歧规则（如颜色值或位置），简化了一个推理维度。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "所有框架必须重叠"
        description: "强制所有框架两两重叠，大幅增加墙壁重建的难度。需要更鲁棒的颜色分离和结构分析能力。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "重叠区域使用第三种颜色标记"
        description: "两个框架重叠的区域显示为混合色或特定标记色，而非简单覆盖。解题者需要理解颜色混合规则来还原原始框架。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D10
    name: "噪声颜色的识别方式"
    tag: meta
    current: "噪声色是唯一一种没有形成封闭区域的非背景色，通过排除法识别"
    alternatives:
      - name: "噪声色是像素数量最少的颜色"
        description: "通过统计各颜色像素数来识别噪声色（最少的那个是噪声）。改变了识别策略，从结构分析变为统计分析。但这可能与当前情况冲突，需要调整噪声量。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "噪声色是唯一没有形成连通大区域的颜色"
        description: "噪声色的最大连通分量很小（如不超过3像素），而框架色有大的连通结构。用连通性而非封闭性来区分。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "噪声色不参与输出"
        description: "输出中不使用噪声色填充，只输出框架色和背景色。噪声色仅在输入中起干扰作用，输出中完全消失。"
        source: inversion
        source_task: null
        delta_lines: 5

