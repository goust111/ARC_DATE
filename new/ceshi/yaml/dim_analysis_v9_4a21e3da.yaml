task_id: 4a21e3da
task_type: move_along_path
summary: "控制像素从网格边缘发射间歇射线切割精灵，切割后的片段根据是否与控制边接壤决定滑向对应角落或消失"

dimensions:
  - id: D1
    name: "射线路径类型"
    tag: path
    current: "straight_ray — 控制像素沿所在行/列发射直线射线到达对侧边缘"
    alternatives:
      - name: "对角线射线切割"
        description: "控制像素沿45度对角线方向发射射线切割精灵，将精灵分为三角形区域而非矩形区域。解题者需理解对角切割的几何关系以及三角形片段如何映射到角落，推理难度显著提升。"
        source: diagonal_ray
        source_task: "142ca369"
        delta_lines: 45
      - name: "双向射线（十字切割）"
        description: "每个控制像素同时向两个正交方向发射射线（如顶部控制像素既纵向又横向发射），使得单个控制像素就能产生四象限分割。这改变了控制像素数量与分割复杂度的关系，解题者需重新推断射线行为。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "射线遇障碍反射"
        description: "射线在碰到精灵像素时不是跳过而是反射90度继续传播，形成L形或Z形的切割线。切割区域不再是简单矩形而是不规则多边形，大幅增加推理复杂度。"
        source: reflection
        source_task: "142ca369"
        delta_lines: 50
      - name: "射线沿精灵边界追踪"
        description: "射线到达精灵后沿其外接矩形边界追踪，形成环形切割。这结合了直线射线和边界追踪两种路径机制，产生全新的分割模式。"
        source: boundary_trace
        source_task: "88bcf3b4"
        delta_lines: 55

  - id: D2
    name: "射线轨迹模式"
    tag: trajectory
    current: "intermittent_skip — 射线跳过前景像素，仅在背景像素上涂色"
    alternatives:
      - name: "连续轨迹（覆盖前景）"
        description: "射线连续涂色不跳过前景像素，射线经过的前景像素被重新着色为控制色。这改变了输出中精灵像素的保留规则，解题者需识别出'连续覆盖'而非'跳过'的模式。取反当前的间歇行为。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "周期性颜色循环轨迹"
        description: "射线在传播时使用多种颜色交替涂色（如控制色和另一种颜色交替），形成条纹状射线。不同颜色段可作为额外线索指示切割后片段的目标位置或变换规则。"
        source: color_cycle
        source_task: "195c6913"
        delta_lines: 20
      - name: "射线长度编码"
        description: "射线不是画到最远前景像素而是画到最近前景像素就停止，仅标记精灵的外边界而非贯穿整个精灵。切割逻辑需要从射线终点推断完整切割线，增加了空间推理步骤。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "渐变宽度轨迹"
        description: "射线随距离逐渐变宽，从1像素宽到3像素宽，形成楔形切割区域。被楔形覆盖的区域整体消失，产生更复杂的保留/消失判断。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D3
    name: "源对象类型"
    tag: src
    current: "control_pixels — 网格边缘的1-2个红色控制像素作为射线源"
    alternatives:
      - name: "边缘色条作为射线源"
        description: "用长度为2-3像素的短色条替代单个控制像素，色条的长度编码射线的某种属性（如切割后保留哪一侧）。解题者需从色条方向推断射线发射方向以及切割规则。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "精灵内部标记像素"
        description: "控制像素不在网格边缘而在精灵内部，射线从精灵内部向外发射到四条边缘。这完全反转了射线的传播方向，解题者需要先定位精灵内部的特殊像素再推断切割方向。"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "角落区域标记"
        description: "不使用边缘像素而在网格角落放置2x2的控制色块，表示该角落是目标位置。射线从角落方块沿行和列同时发射，交叉点处切割精灵。解题者需理解角落标记与切割线的对应关系。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "箭头形状指示方向"
        description: "控制像素构成箭头形状（3像素L形），箭头的朝向指示射线发射方向。这增加了方向推断步骤——解题者需先识别箭头方向再确定射线路径。"
        source: direction_from_shape
        source_task: "3dc255db"
        delta_lines: 25

  - id: D4
    name: "终止条件"
    tag: dst
    current: "射线穿过所有前景像素后停止（涂色到最远的前景像素位置）"
    alternatives:
      - name: "射线到对侧边缘"
        description: "射线不在最远前景像素处停止而是延伸到网格对侧边缘，形成完整的贯穿线。这使切割线在视觉上更明显，但也改变了输出网格中射线的呈现范围。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "射线遇另一条射线停止"
        description: "当有两个控制像素时，射线在交叉点（另一条射线所在行/列）处停止，而非延伸到最远前景像素。这创造了一种交互式终止条件，解题者需理解两条射线的相互约束。"
        source: collision_stop
        source_task: "195c6913"
        delta_lines: 20
      - name: "射线到精灵外接矩形边缘停止"
        description: "射线仅画到精灵外接矩形的边界而非最远前景像素，输出中射线较短。解题者需推断外接矩形的概念并理解射线终止的几何依据。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "距离编码终止"
        description: "射线的长度由控制像素在边缘的位置编码——距边缘中点越远射线越短，距中点越近射线越长。解题者需发现距离与射线长度的对应关系。"
        source: distance_encoding
        source_task: "271d71e2"
        delta_lines: 20

  - id: D5
    name: "切割后片段的变换规则"
    tag: transform
    current: "与控制边接壤的区域滑动到对应角落；不接壤的区域消失（erase）"
    alternatives:
      - name: "所有片段保留，未接壤区域重新着色"
        description: "不接壤控制边的区域不消失而是保留在原位但被重新着色为另一种颜色。解题者需同时推断移动规则和着色规则，增加了变换的复杂度。取反当前的'消失'行为。"
        source: recolor
        source_task: "271d71e2"
        delta_lines: 15
      - name: "片段镜像翻转后滑入角落"
        description: "切割后的片段在滑向角落时需要进行水平或垂直镜像翻转（根据滑动方向决定翻转轴）。解题者需同时理解位移和翻转两种变换的组合。"
        source: reflection
        source_task: "7ed72f31"
        delta_lines: 25
      - name: "片段旋转后滑入角落"
        description: "切割后的片段旋转90/180度后再放入对应角落，旋转角度由控制像素到角落的方位关系决定。这是一种位移+旋转的复合变换，显著增加推理难度。"
        source: rotation
        source_task: "2c181942"
        delta_lines: 30
      - name: "片段按大小排序重新分配角落"
        description: "片段不是按原始象限映射到对应角落，而是按像素数排序后分配——最大的片段去左上角，最小的去右下角，依此类推。解题者需发现大小排序规则。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "消失区域移至对侧角落"
        description: "原本应消失的区域不是删除而是移动到没有控制像素边的对侧角落。所有片段都保留，只是目标角落的映射规则不同——接壤控制边的去同侧角落，不接壤的去对侧角落。"
        source: inversion
        source_task: null
        delta_lines: 20

  - id: D6
    name: "输出网格形状"
    tag: grid_shape
    current: "输出与输入同尺寸（18-20 x 18-20）"
    alternatives:
      - name: "裁剪到有效内容区域"
        description: "输出仅保留包含非背景像素的最小外接矩形区域（tight crop）。网格尺寸变小，解题者需推断裁剪规则。"
        source: tight_crop
        source_task: "e87109e9"
        delta_lines: 10
      - name: "每个保留片段独立裁剪输出"
        description: "输出不是一个完整网格而是多个小网格，每个保留片段各自裁剪为独立的小网格并按顺序排列（类似 frame_separation 的逆操作）。解题者需理解分割输出的规则。"
        source: frame_separation
        source_task: "5545f144"
        delta_lines: 30
      - name: "输出网格扩大为原来的2倍"
        description: "输出网格尺寸加倍，片段在更大的画布上放置到角落，射线和分割线也相应缩放。这测试解题者对尺度变换的理解。"
        source: grid_expand
        source_task: "20270e3b"
        delta_lines: 25

  - id: D7
    name: "多步处理序列"
    tag: multi_step
    current: "两步：先用射线切割精灵，再将片段移到角落"
    alternatives:
      - name: "迭代切割——逐条射线依次处理"
        description: "多个控制像素的射线不同时处理而是按顺序逐条应用：第一条射线切割精灵并移动片段，第二条射线再对已移动的片段进行二次切割和移动。中间状态对推理至关重要。"
        source: multi_step_chain
        source_task: "271d71e2"
        delta_lines: 40
      - name: "切割后合并——片段在角落重组"
        description: "三步过程：切割→移到角落→相邻角落的片段进一步合并为一个连通区域。最终输出中角落片段可能互相拼接形成新形状，增加了形状推理的步骤。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "先变换再切割"
        description: "反转当前的步骤顺序：先对精灵进行某种变换（如旋转90度），然后再用射线切割并移到角落。解题者需推断出变换先于切割的顺序，这与直觉相反。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "递归切割"
        description: "第一次切割后的片段如果仍然足够大（超过阈值像素数），在角落位置会被虚拟射线再次切割为更小片段并移到子角落。形成递归分形式的分割模式。"
        source: creative
        source_task: null
        delta_lines: 50

  - id: D8
    name: "控制像素数量与分布"
    tag: meta
    current: "1或2个控制像素，2个时在垂直边缘（上/下之一和左/右之一）"
    alternatives:
      - name: "固定3个控制像素"
        description: "使用3个控制像素——两个在同一类型边缘（如上、下边各一个）加一个在另一类型边缘，产生3条切割线形成6个区域。更复杂的分区关系让解题者需要推理哪些区域保留哪些消失。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "4个控制像素（每边一个）"
        description: "四条边各一个控制像素，产生两条垂直和两条水平切割线，精灵被分为最多9个区域。保留/消失规则变得更复杂（可能基于与最近控制边的距离判断），极大增加推理难度。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "同一边缘两个控制像素"
        description: "两个控制像素在同一条边缘（如顶部边缘的两个不同列），产生两条平行的垂直切割线，将精灵分为3个纵向区域。中间区域的处理方式（保留/消失/特殊变换）成为新的推理点。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D9
    name: "分割线上前景像素的处理"
    tag: meta
    current: "分割线上的前景像素保留在原位不移动"
    alternatives:
      - name: "分割线像素也参与移动"
        description: "分割线上的前景像素不再保留原位而是被复制到所有相邻区域的边界上，每个移动后的片段都带有分割线像素的副本。解题者需理解'复制到多个目标'的逻辑。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "分割线像素消失"
        description: "取反当前行为：分割线上的前景像素在输出中全部消失，只保留切割后的非分割线片段。这使输出中的片段与原精灵相比缺少了中间的像素行/列。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "分割线像素变色标记"
        description: "分割线上的前景像素在输出中被重新着色为控制色，作为视觉上的分隔标记线。这让分割线在输出中更加显眼，但也增加了颜色映射的推理步骤。"
        source: recolor
        source_task: "271d71e2"
        delta_lines: 10

  - id: D10
    name: "片段目标位置"
    tag: meta
    current: "片段外接矩形紧贴对应角落放置（flush with corner）"
    alternatives:
      - name: "片段对齐到边缘中点而非角落"
        description: "保留的片段不移到角落而是移到对应边缘的中央位置（水平居中或垂直居中）。解题者需发现边缘中点对齐规则而非角落对齐。"
        source: centering
        source_task: "58f5dbd5"
        delta_lines: 15
      - name: "片段保持与分割线的距离"
        description: "片段不紧贴角落而是保持与分割线相同的距离向外移动（等距平移）。输出中片段之间仍有间距，解题者需推断平移距离的计算规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "片段目标位置由颜色编码"
        description: "在网格角落放置小的颜色标记，片段根据标记颜色与自身某种属性的匹配关系选择目标角落，而非简单的空间对应。增加了颜色-位置映射的推理维度。"
        source: legend_lookup
        source_task: "58490d8a"
        delta_lines: 30

  - id: D11
    name: "精灵连通性要求"
    tag: meta
    current: "输入中所有前景像素（包括消失区域）必须形成单个4-连通分量"
    alternatives:
      - name: "多个独立精灵"
        description: "输入中有多个独立的精灵（2-3个不相连的连通分量），每个精灵各自被射线切割和移动。解题者需理解射线对多个独立对象的并行处理。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "精灵允许8-连通"
        description: "精灵的连通性从4-连通放宽到8-连通（对角相邻也算连通），允许更稀疏的精灵形状。切割后的片段可能出现仅通过对角连接的情况，增加视觉判断难度。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "精灵带有洞"
        description: "精灵内部允许有背景色的洞（非简单连通），射线穿过洞时不涂色。切割后某些片段可能继承洞的一部分，输出中的形状更复杂。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D12
    name: "颜色使用方案"
    tag: meta
    current: "固定3种颜色：背景(1-blue), 前景(7-orange), 控制(2-red)，每种颜色有唯一功能"
    alternatives:
      - name: "多色精灵"
        description: "精灵由2-3种前景色组成，每种颜色在切割后保留其原始颜色。片段中包含多种颜色的模式，解题者需确认颜色在变换中保持不变。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "切割区域按区域重新着色"
        description: "每个切割后的区域被着上不同颜色（非原始前景色），颜色由区域的象限位置决定（如左上区域变蓝，右上变绿）。增加了颜色映射的推理维度。"
        source: color_transfer
        source_task: "4c416de3"
        delta_lines: 20
      - name: "控制色与前景色相同"
        description: "控制像素使用与前景相同的颜色，解题者需通过位置（在边缘）而非颜色来识别控制像素。这大幅增加了识别难度——需要从空间关系而非颜色差异推断功能角色。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D13
    name: "射线切割与区域归属判定"
    tag: meta
    current: "ray_splitting — 射线将精灵分为矩形区域，区域与控制边接壤则保留"
    alternatives:
      - name: "按连通分量归属"
        description: "切割后不按几何象限判断而是按切割后剩余前景像素的4-连通分量来判断：与分割线像素相连的分量保留，不相连的消失。这改变了保留判定逻辑，从空间位置变为拓扑连通性。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "按面积大小筛选"
        description: "切割后保留面积最大的N个区域（N等于控制像素数），其余消失。解题者需先计算各区域面积再排序选择，引入了计数/比较的推理步骤。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "控制像素的行/列射线交叉区域保留"
        description: "每个控制像素的射线沿行和列同时投射，只有位于某个控制像素的行范围和列范围交叉区域内的前景像素保留。这将归属判定从'边接壤'改为'行列投影交集'。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D14
    name: "网格尺寸与精灵比例"
    tag: meta
    current: "网格18-20正方形，精灵外接矩形5-8行x8-10列，密度0.39-0.60"
    alternatives:
      - name: "小网格大精灵"
        description: "网格缩小到10-12，精灵相对占比更大（外接矩形4-6x4-6），margin减小到2。解题者面对更紧凑的布局，片段移到角落时可能彼此紧邻甚至重叠，需要更精确的空间推理。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "矩形网格（非正方形）"
        description: "网格从正方形变为明显的矩形（如12x20），精灵形状和切割比例随之改变。长宽比的不对称使得推理更具挑战性。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "大网格小精灵"
        description: "网格增大到25-28，精灵保持相同大小，margin增大到8-10。片段移到角落后之间距离更远，射线更长，视觉上需要跨越更大空间进行对应。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D15
    name: "分割线位置约束"
    tag: meta
    current: "分割线穿过精灵内部，位于外接矩形跨度的40-60%处"
    alternatives:
      - name: "分割线偏向一侧（不对称切割）"
        description: "分割线位于精灵跨度的20-30%或70-80%处，产生一大一小的不对称区域。小区域的片段仅含少量像素，解题者需精确识别小片段并正确移动到角落。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "分割线由精灵的几何中心决定"
        description: "分割线不由控制像素位置决定而是必须通过精灵质心（前景像素坐标均值）。控制像素只指示方向但分割位置由精灵自身属性决定。解题者需推断分割线的定位依据。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "分割线在精灵外部"
        description: "分割线不穿过精灵而是紧贴精灵外接矩形的一侧边缘通过。这使精灵不被实际切割——所有前景像素作为整体移到最近的角落，射线仅起指示方向作用。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D16
    name: "消失区域的存在与功能"
    tag: meta
    current: "2个控制像素时存在消失区域（不与任何控制边接壤的象限），其前景像素在输出中删除"
    alternatives:
      - name: "消失区域变为干扰项"
        description: "消失区域的像素在输出中保留在原位不移动也不删除，作为视觉干扰项。解题者需区分'已移动的片段'和'未移动的残留'两种不同状态的前景像素。"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "消失区域移到网格中心"
        description: "不接壤控制边的区域不消失而是移到网格中心区域（分割线交叉点附近）。所有片段都保留但目标位置不同——接壤的去角落，不接壤的去中心。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "消失区域缩小后保留"
        description: "消失区域的像素不完全删除而是按比例缩小（保留每隔一个像素），形成稀疏化的残留图案。解题者需理解'部分保留'的规则。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D17
    name: "控制像素边缘位置含义"
    tag: symbol_instructions
    current: "控制像素所在边缘隐式决定射线方向（顶部→向下，左边→向右等）和区域保留规则"
    alternatives:
      - name: "控制像素颜色编码指令"
        description: "使用多种控制色（如红色和蓝色），不同颜色的控制像素触发不同的处理规则——红色表示对应区域移到角落，蓝色表示对应区域旋转后移到角落。解题者需从颜色差异推断功能差异。"
        source: legend_lookup
        source_task: "58490d8a"
        delta_lines: 25
      - name: "控制像素偏移编码"
        description: "控制像素不在边缘的精确对齐列/行，而是偏移1-2像素。偏移方向和大小编码额外信息（如偏左表示片段向左翻转，偏右表示不翻转）。解题者需发现偏移量的语义。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "图例区域解释规则"
        description: "网格角落有一个小的图例区域（2x2或3x3），其中的颜色模式指示保留/消失/变换规则。控制像素仅指示射线方向，具体变换由图例决定。增加了符号解读的推理层次。"
        source: symbol_instructions
        source_task: "e87109e9"
        delta_lines: 35
