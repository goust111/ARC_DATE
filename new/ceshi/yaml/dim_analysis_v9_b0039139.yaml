task_id: b0039139
task_type: transform_in_place
summary: "输入被蓝色分隔线划分为四个区段：形状模板、组件计数板、前景色色板、背景色色板；将模板裁剪到外接矩形后用色板重新着色，再按计数板中连通分量数量平铺副本，副本之间用背景色分隔列/行隔开"

dimensions:
  - id: D1
    name: "模板重着色规则"
    tag: transform
    current: "模板像素(色4)替换为区段3的颜色，模板内背景像素(色0)替换为区段4的颜色，形成双色裁剪图案"
    alternatives:
      - name: "颜色互换：前景变背景、背景变前景"
        description: "将色板应用方式反转——模板像素用区段4的颜色，背景像素用区段3的颜色。解题者需要注意前景/背景的映射关系被交换，推理方向与直觉相反，增加了对色板对应关系的辨别难度。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "三色重着色：边缘像素使用第三种颜色"
        description: "模板中与背景4-相邻的模板像素（即边缘像素）使用区段3的颜色，内部模板像素使用区段4的颜色，背景像素保持黑色。解题者需要区分边缘与内部像素，引入边界检测的推理步骤。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "根据连通分量索引交替着色"
        description: "第奇数个副本用区段3做前景+区段4做背景，第偶数个副本反过来用区段4做前景+区段3做背景。解题者需理解交替着色模式与副本序号的对应关系。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "渐变重着色：每个副本前景色逐步变化"
        description: "如果色板中的两种颜色在ARC调色板中相邻（如色5和色6），则各副本的前景色按索引偏移——第1个副本用色板颜色，第2个用色板颜色+1等。解题者需推断颜色渐变规则。但需确保颜色值在有效范围内。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D2
    name: "模板形状定义方式"
    tag: src
    current: "区段1包含一个用色4绘制的形状模板，裁剪为其非背景像素的外接矩形"
    alternatives:
      - name: "模板为负空间：背景像素定义形状"
        description: "反转模板定义方式——色4像素视为背景，色0像素视为形状。解题者需要识别'空洞即形状'的反转逻辑，从负空间中读取图案。这会产生视觉上截然不同的输出。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "模板不裁剪，保留完整边距"
        description: "不裁剪到外接矩形，直接使用区段1的完整网格（含周围的背景行列）作为模板。输出中每个副本会更大且带有边距填充，解题者需理解是否裁剪对输出尺寸的影响。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "模板旋转90度后再平铺"
        description: "先将裁剪后的模板顺时针旋转90度，再进行重着色和平铺。解题者需要先识别旋转变换再推断平铺规则，增加了几何变换的推理层。"
        source: rotation
        source_task: 2b83f449
        delta_lines: 15
      - name: "模板水平镜像后再平铺"
        description: "裁剪后的模板先进行左右镜像翻转，再重着色并平铺。输出中的图案是输入模板的镜像版本，解题者需要识别反射变换。"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 10

  - id: D3
    name: "连通分量计数方式"
    tag: src
    current: "计算区段2中色3像素的4-连通分量数量，该数量决定模板副本的重复次数"
    alternatives:
      - name: "使用8-连通而非4-连通计数"
        description: "将连通性从4-连通改为8-连通（含对角线相邻）。对角线接触的色块会被合并为一个分量，导致计数减少。解题者需要从训练样例中推断使用的是8-连通规则而非更常见的4-连通。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "计数不同颜色的像素种类数"
        description: "区段2中使用多种颜色的像素，重复次数等于不同非背景颜色的种类数而非连通分量数。引入颜色种类计数而非空间连通计数，改变了解题者的计数策略。"
        source: counting
        source_task: 8f215267
        delta_lines: 15
      - name: "计数连通分量的像素总面积决定重复次数"
        description: "重复次数不是连通分量个数，而是所有色3像素的总数量。如区段2有6个色3像素则重复6次。解题者需要逐像素计数而非识别连通区域，且输出尺寸可能更大。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "最大连通分量的面积作为重复次数"
        description: "找到区段2中面积最大的连通分量，其像素数量即为重复次数。解题者需要先分割连通分量，再比较面积并取最大值，增加了多步推理难度。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D4
    name: "副本平铺方向"
    tag: grid_shape
    current: "平铺方向由分隔线方向决定——水平分隔线(行)则垂直平铺，垂直分隔线(列)则水平平铺"
    alternatives:
      - name: "平铺方向与分隔线方向相同"
        description: "反转当前方向映射：水平分隔线则水平平铺，垂直分隔线则垂直平铺。解题者需从训练样例中识别方向对应关系的反转，容易与直觉冲突。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "二维网格平铺"
        description: "不再沿单一方向平铺，而是将副本排成二维矩阵（如2x3、3x2等），行列数由连通分量数量的因数分解决定。解题者需要推断如何将一维重复次数映射到二维布局。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "平铺方向由模板宽高比决定"
        description: "如果模板宽>高则水平平铺，高>宽则垂直平铺，相等则取决于某种消歧规则。去掉了对分隔线方向的依赖，改为由模板自身几何属性决定，解题者需要分析模板形状。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "紧凑打包：交替正反排列节省空间"
        description: "副本不是简单平铺，而是相邻副本上下或左右镜像，使边缘对齐实现更紧凑的排列。类似锯齿形平铺，输出结构不再是简单重复而是镜像交替。"
        source: packed_grid
        source_task: 58f5dbd5
        delta_lines: 25

  - id: D5
    name: "副本之间的分隔方式"
    tag: grid_shape
    current: "相邻副本之间有一行/列宽的分隔带，填充区段4的颜色（背景色板色）"
    alternatives:
      - name: "无分隔带：副本直接拼接"
        description: "去掉副本间的分隔行/列，副本紧密相连。输出更紧凑，边界处的图案可能视觉上连为一体，解题者需要识别重复单元的边界。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "两行/列宽分隔带"
        description: "分隔带从1格加宽到2格，使用区段4的颜色。输出中副本间距更大，视觉上更易区分，但解题者需注意分隔宽度的变化。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "分隔带使用区段3的颜色（前景色）"
        description: "分隔带不用背景色板色而用前景色板色。视觉效果上分隔带变得醒目而非隐蔽，解题者需要推断分隔带颜色来源是哪个色板。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "分隔带宽度随连通分量面积变化"
        description: "每两个相邻副本之间的分隔带宽度等于对应连通分量的像素面积。不同副本间的分隔宽度可能不同，解题者需要建立分量面积与分隔宽度的对应关系。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D6
    name: "区段布局与分隔线结构"
    tag: meta
    current: "四个区段由色1(蓝色)的分隔线(整行或整列)分隔，可以是全水平排列或全垂直排列或混合排列"
    alternatives:
      - name: "分隔线使用不同颜色区分区段功能"
        description: "不同分隔线使用不同颜色：模板与计数板之间用红色分隔，计数板与色板之间用蓝色分隔等。颜色本身编码了区段类型信息，解题者需先解读分隔线颜色含义。"
        source: symbol_instructions
        source_task: null
        delta_lines: 15
      - name: "区段数量可变：支持多个色板"
        description: "允许5个或更多区段——额外的色板区段定义第三种颜色（如边框色）。模板中可能有三种区域（前景、背景、边缘），分别由不同色板着色。增加了颜色映射的复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "区段顺序编码变换参数"
        description: "四个区段的排列顺序本身传达信息：如模板区段在色板区段之前表示先着色后平铺，反之表示先平铺后着色（逐副本独立着色可能不同）。解题者需要从区段排列顺序推断操作顺序。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D7
    name: "计数板中连通分量的空间排布"
    tag: src
    current: "区段2中的色3连通分量排布在网格内，其数量决定重复次数，但分量的具体位置和形状不影响输出"
    alternatives:
      - name: "分量的排布顺序决定副本的排列顺序"
        description: "连通分量按从左到右/从上到下排序，每个分量的形状或面积编码对应副本的某种变换（如面积大的分量对应旋转过的副本）。解题者需建立分量属性与副本变换的对应。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "分量的形状决定副本的变换"
        description: "每个连通分量如果是水平长条则对应副本不变，如果是垂直长条则对应副本旋转90度，如果是方块则对应副本镜像。解题者需要识别每个分量的几何特征并映射到对应变换。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "分量的颜色各不相同，决定副本的前景色"
        description: "区段2中每个连通分量使用不同颜色（如色3、色5、色6等），每个副本的前景色对应其分量的颜色而非统一使用区段3的色板。解题者需要追踪颜色对应关系。"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 20

  - id: D8
    name: "模板裁剪方式"
    tag: transform
    current: "将区段1中的模板裁剪到色4像素的最小外接矩形(bbox)"
    alternatives:
      - name: "裁剪到最大正方形区域"
        description: "不使用最小外接矩形，而是裁剪为包含所有模板像素的最小正方形（短边补齐到与长边等长）。输出中每个副本变为正方形，解题者需推断正方形裁剪规则。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "只裁剪行方向，列方向保持完整"
        description: "仅在垂直方向裁剪到外接矩形，水平方向保留区段1的完整宽度（含两侧背景列）。输出副本比当前更宽，解题者需注意非对称裁剪规则。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "裁剪后填充为矩形：凸包填充"
        description: "先裁剪到bbox，然后将模板的凸包区域全部填充为前景色。原本非凸的模板形状变为填充后的凸形状，解题者需识别凸包填充操作。"
        source: shape_completion
        source_task: a47bf94d
        delta_lines: 20

  - id: D9
    name: "色板区段的表示方式"
    tag: symbol_instructions
    current: "区段3和区段4各为纯色矩形块，直接用其填充颜色作为前景色和背景色"
    alternatives:
      - name: "色板为渐变条纹：取最频繁颜色"
        description: "色板区段不再是纯色，而包含多种颜色的条纹图案。需要取其中出现频率最高的颜色作为目标色。解题者需要先分析色板中的颜色分布再确定目标色。"
        source: majority_color
        source_task: 800d221b
        delta_lines: 15
      - name: "色板为2x2方块编码两种颜色"
        description: "将两个色板合并为一个区段，用2x2方块编码：左上和右下为前景色，右上和左下为背景色（或某种固定位置映射）。解题者需要解读2x2编码规则。"
        source: symbol_instructions
        source_task: f560132c
        delta_lines: 15
      - name: "色板由图例边缘位置决定读取方向"
        description: "色板区段的位置（在网格的上/下/左/右边缘）决定其读取方向：上边缘从上到下读，右边缘从右到左读等。类似 dbff022c 的方向性图例，增加了空间位置推理。"
        source: symbol_instructions
        source_task: dbff022c
        delta_lines: 20

  - id: D10
    name: "输出尺寸计算规则"
    tag: grid_shape
    current: "输出宽度/高度 = 副本数 × 裁剪模板尺寸 + (副本数-1) × 分隔带宽度，另一方向等于裁剪模板的对应尺寸"
    alternatives:
      - name: "输出固定为正方形"
        description: "无论副本数和模板尺寸如何，输出强制为正方形。副本数不足以填满时用背景色填充剩余空间，多余时截断。解题者需要推断正方形约束及截断/填充规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "输出尺寸由色板区段尺寸决定"
        description: "输出的总行数等于区段3的行数，总列数等于区段3的列数。副本和分隔带必须适配这个固定尺寸——如果空间不够则缩小模板，空间多余则增加分隔带宽度。"
        source: scale_to_fit
        source_task: 898e7135
        delta_lines: 25
      - name: "输出紧凑裁剪：去除外围背景色行列"
        description: "计算完平铺后，对输出执行一次紧凑裁剪，去掉全为背景色的外围行和列。如果模板边缘本身就是背景色，这会使输出比预期更小。"
        source: tight_crop
        source_task: bf45cf4b
        delta_lines: 10

  - id: D11
    name: "多步处理顺序"
    tag: multi_step
    current: "三步串行：(1)裁剪模板到bbox，(2)用色板重着色，(3)按连通分量数平铺并加分隔带"
    alternatives:
      - name: "先平铺原始模板再统一着色"
        description: "先将未着色的原始模板（色4+色0）平铺指定次数，然后对整个平铺结果统一执行颜色替换。如果分隔带也包含色0像素，它们也会被替换为区段4的颜色——最终结果相同，但如果引入额外颜色规则（如边缘检测）则会产生不同结果。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "迭代平铺：每次添加一个副本并调整"
        description: "不一次性计算所有副本，而是逐个添加：先放第1个副本，然后在其旁边加分隔带和第2个副本，以此类推。每添加一个副本后可能对已有内容做微调（如边界像素合并）。解题者需理解渐进式构建过程。"
        source: multi_step
        source_task: 16b78196
        delta_lines: 25
      - name: "反向流程：从输出推断输入"
        description: "反转题目方向——输入是平铺后的结果，输出是拆解还原出的单个模板。解题者需要从重复图案中提取基本单元并还原原始颜色。这是当前任务的逆问题。"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "着色与平铺交织：奇数副本用色板A，偶数副本用色板B"
        description: "着色不是一次性完成，而是在平铺过程中交替应用两种色板映射。奇数位副本前景=区段3色/背景=区段4色，偶数位反转。解题者需识别交替着色模式。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D12
    name: "模板中特殊像素的处理"
    tag: meta
    current: "模板区段中只有两种像素值：色4(模板形状)和色0(背景)，不存在其他颜色"
    alternatives:
      - name: "模板包含第三种颜色作为透明标记"
        description: "模板中除色4和色0外还有色1像素，标记为'透明'——在输出中这些位置不着色而是保留为某种默认值（如色0）。解题者需要识别三种像素类型的不同处理方式。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "模板包含多种前景色"
        description: "模板中有色4和色5两种前景色像素。色4用区段3的颜色着色，色5用另一种颜色（如计数板中最频繁的颜色）着色。多色模板增加了颜色映射规则的复杂度。"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 20
      - name: "模板像素具有亮度权重"
        description: "色4像素在输出中用区段3的颜色着色，但如果某像素4-连通邻居中背景像素越多，则该像素在输出中使用区段3和区段4颜色的混合（ARC中表现为第三种颜色）。引入空间上下文敏感的着色规则。"
        source: creative
        source_task: null
        delta_lines: 25
