task_id: b10624e5
task_type: move_to_match
summary: "将左上象限红色锚块旁的彩色图案复制到其他象限的红色锚块旁，按锚块尺寸比进行缩放并按象限关系进行反射"

dimensions:
  - id: D1
    name: "匹配条件：红色锚块颜色匹配"
    tag: match_cond
    current: "所有象限的锚块共享同一颜色（红色），通过 s.anchor_color == d.anchor_color 配对；缩放因子由目标/源锚块尺寸比决定"
    alternatives:
      - name: "多颜色锚块分组配对"
        description: "不同象限使用不同颜色的锚块（如红、蓝、绿），源象限中每种颜色的锚块旁各有不同图案，目标象限通过锚块颜色匹配决定使用哪个图案。解题者需要同时进行颜色识别和图案匹配，推理步骤增加。"
        source: color_match
        source_task: 2c181942
        delta_lines: 25
      - name: "锚块形状匹配而非颜色匹配"
        description: "锚块不再统一为方形，而是有不同形状（L形、T形、十字形等），源和目标通过锚块形状而非颜色配对。缩放因子可由锚块面积比或外接矩形比决定。解题者需要先进行形状分类再匹配。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 35
      - name: "基于锚块数量/像素计数匹配"
        description: "每个象限包含多个不同大小的锚块，源和目标通过锚块数量相等来配对。缩放因子改为由锚块数量编码。将尺寸匹配改为计数匹配，增加数值推理难度。"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 30
      - name: "连接器匹配：锚块间的连接线配对"
        description: "象限间有彩色连接线，源和目标通过共享同一连接线来配对（而非通过锚块颜色相同）。连接线的方向还可以暗示反射轴。解题者需要追踪连接关系而非颜色匹配。"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 30
      - name: "按锚块位置的行列对齐匹配"
        description: "取消颜色匹配，改为按行或列对齐关系配对：与源锚块在同一行的目标接收水平反射图案，同一列的接收垂直反射图案，对角的接收双重反射。位置关系本身编码变换信息。"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 20

  - id: D2
    name: "源对象：左上象限锚块旁的彩色图案"
    tag: src
    current: "左上象限中与红色锚块相邻的彩色像素构成源图案"
    alternatives:
      - name: "每个象限都有独立的源图案"
        description: "不再仅从左上象限取源，而是每个象限的锚块旁都有一个独立的局部图案作为源，需要将每个象限的图案复制到其对称位置的象限。解题者需要识别所有四个方向的配对关系。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "控制像素指定源象限"
        description: "源不固定在左上象限，而是通过网格边缘的控制像素（特殊颜色标记）指示哪个象限是源。解题者必须先解读控制像素的语义来确定源位置。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 25
      - name: "锚块内部嵌入的微型图案作为源"
        description: "源图案不在锚块旁边，而是嵌入在锚块内部（锚块足够大时内部有彩色像素组成的微型图案）。解题者需要先从锚块中提取图案再缩放复制。"
        source: anomaly_detection
        source_task: b99e7126
        delta_lines: 30
      - name: "多个分散像素需组合为完整源图案"
        description: "源图案不是紧凑的连通区域，而是散布在象限内的多个孤立像素或小片段，需要根据颜色或空间关系组合成完整图案后再复制到其他象限。增加图案识别难度。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D3
    name: "目标对象：其他象限的红色锚块定位"
    tag: dst
    current: "其他象限中红色锚块的相邻位置作为目标，图案根据锚块尺寸和象限关系进行缩放和反射后放置"
    alternatives:
      - name: "锚块内部的空洞作为目标槽位"
        description: "目标锚块改为空心结构（内部有洞），缩放后的图案需要填充进锚块内部的空洞中。类似拼图嵌合，解题者需要同时考虑缩放和空间限制。"
        source: cavity_fill
        source_task: 5dbc8537
        delta_lines: 30
      - name: "目标位置由标记像素精确指定"
        description: "目标象限中除了锚块外还有一个特殊颜色的单像素标记，图案的中心应对齐到该标记而非锚块边缘。增加定位精度的推理。"
        source: marker_alignment
        source_task: 581f7754
        delta_lines: 20
      - name: "目标象限的锚块居中对齐"
        description: "图案不放在锚块旁边，而是以锚块中心为参考点对称放置。与当前的边缘对齐不同，这改变了空间定位逻辑。"
        source: centering
        source_task: 58f5dbd5
        delta_lines: 20
      - name: "图案平铺填满目标象限空余区域"
        description: "缩放后的图案不只放置一次，而是像瓷砖一样平铺填满目标象限中锚块以外的所有空余区域。解题者需要推断平铺规则和边界裁剪。"
        source: tiling
        source_task: 65b59efc
        delta_lines: 35

  - id: D4
    name: "变换：缩放规则"
    tag: transform
    current: "缩放因子 = 目标红色锚块尺寸 / 源红色锚块尺寸，图案每个像素按比例放大为 factor x factor 的色块"
    alternatives:
      - name: "固定缩放因子（无动态计算）"
        description: "取消根据锚块尺寸比动态计算缩放因子，改为所有目标统一使用固定倍率（如2倍或3倍）。简化了数值推理但保留空间变换，解题者只需识别固定倍率。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "非均匀缩放（水平和垂直不同倍率）"
        description: "水平和垂直方向使用不同的缩放因子（如水平2倍、垂直3倍），由目标锚块的宽高比决定。图案会被拉伸变形，解题者需要分别推断两个方向的缩放。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "缩小而非放大（缩放因子<1）"
        description: "源图案比目标更大，缩放因子小于1，图案需要缩小。缩小涉及像素合并/采样规则的推理，比放大更具挑战性。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "分形式缩放：图案中的每个像素递归替换为整个图案"
        description: "类似分形平铺，缩放不是简单放大，而是将图案的每个前景像素递归替换为缩小版的整个图案。生成自相似结构，视觉效果独特且推理复杂。"
        source: fractal_tiling
        source_task: a32d8b75
        delta_lines: 35

  - id: D5
    name: "变换：反射规则"
    tag: transform
    current: "反射轴由源与目标的象限相对位置决定——左右关系用水平轴反射，上下关系用垂直轴反射，对角关系用双轴反射"
    alternatives:
      - name: "旋转替代反射"
        description: "从源到目标的变换不使用反射，而使用旋转：右上90度，左下270度，右下180度。旋转和反射在某些图案上会产生不同结果，解题者需要区分这两种变换。"
        source: rotation
        source_task: fc7cae8d
        delta_lines: 20
      - name: "反射轴由锚块内部特征决定"
        description: "反射轴不再由象限位置固定确定，而是由锚块内部的某个特征（如锚块形状的对称轴、或锚块内特殊标记像素的位置）动态决定。解题者需要先分析锚块结构再推断反射方向。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "无反射，仅平移和缩放"
        description: "取消反射变换，图案仅缩放后直接放置（保持原方向）。简化了变换推理但可能使谜题过于简单，适合作为入门级变体。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "对角线反射（45度轴）"
        description: "反射轴固定为45度对角线（而非水平/垂直），所有目标图案都沿对角线翻转。产生视觉上更不直觉的结果，增加空间推理难度。"
        source: diagonal_symmetry
        source_task: 4c416de3
        delta_lines: 15

  - id: D6
    name: "轨迹：源图案保留策略"
    tag: trajectory
    current: "源图案在输出中保留不变（keep source）"
    alternatives:
      - name: "擦除源图案（移动语义）"
        description: "复制完成后源图案从左上象限被删除，输出中只有目标象限有图案。从'复制'变为'移动'语义，解题者需要理解源的消失。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "源图案被重新着色"
        description: "源图案在输出中被重新着色为与目标图案之一相同的颜色，形成视觉上的统一感。解题者需要推断源的颜色变化规则。"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 15
      - name: "源图案路径涂色轨迹"
        description: "从源到目标的'移动路径'上留下彩色痕迹（如用淡色连接源和目标位置），形成视觉上的路径指示。增加轨迹推理维度。"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 25
      - name: "源图案缩放为锚块大小"
        description: "输出中源图案被缩放为与最小目标图案相同的大小，形成所有象限图案大小一致的效果。解题者需要理解双向缩放规则。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D7
    name: "网格形状：输出尺寸"
    tag: grid_shape
    current: "输出网格与输入大小完全相同（same）"
    alternatives:
      - name: "紧凑裁剪到活跃区域"
        description: "输出仅保留包含所有非背景像素的最小外接矩形。如果某些象限较空，裁剪后网格变小。解题者需要推断输出尺寸。"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 15
      - name: "仅输出目标象限"
        description: "输出只包含目标象限的内容，源象限被裁掉。输出尺寸约为输入的3/4或更小，解题者需要判断哪些区域被保留。"
        source: crop
        source_task: a251c730
        delta_lines: 20
      - name: "每个象限独立输出后拼接"
        description: "每个象限单独裁剪为一个子网格，然后按特定排列（如1像素间隔的packed grid）重新拼接。改变输出结构推理方式。"
        source: packed_grid
        source_task: 58f5dbd5
        delta_lines: 25

  - id: D8
    name: "象限结构与分区方式"
    tag: meta
    current: "网格被隐式分为四个象限（左上、右上、左下、右下），象限由红色锚块的位置暗示"
    alternatives:
      - name: "显式分割线划分区域"
        description: "网格中有明确的彩色分割线（水平+垂直各一条）将网格分为四个区域。分割线位置不一定在中心，象限大小可以不等。解题者需要先识别分割线位置。"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 20
      - name: "三分区或六分区"
        description: "网格不再分为四个象限，而是分为三个水平/垂直条带或六个区域（2x3或3x2网格）。源在一个区域，需要复制到其余区域并根据相对位置变换。增加空间推理的维度数量。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "同心区域（内外圈）"
        description: "不用象限划分，而是将网格分为同心的内外区域。源图案在中心区域的锚块旁，需要缩放复制到外围区域的对应锚块旁。径向缩放关系取代象限对称关系。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "对角线分割（三角形区域）"
        description: "网格由对角线分为四个三角形区域而非矩形象限。图案的反射和缩放需要适应三角形区域的几何约束，增加非正交空间推理。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D9
    name: "锚块形状与结构"
    tag: meta
    current: "每个象限有一个红色正方形色块作为锚块，不同象限锚块尺寸不同（尺寸比决定缩放因子）"
    alternatives:
      - name: "锚块为矩形（非正方形）"
        description: "锚块为非正方形矩形（如2x3、1x4），缩放因子需要分别处理宽度和高度方向。解题者需要推断二维缩放参数而非单一比例。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "锚块为L形或其他非矩形形状"
        description: "锚块不是简单矩形而是L形、T形等不规则形状。尺寸比的计算变得模糊（面积比？外接矩形比？），解题者需要推断正确的尺寸衡量标准。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "所有锚块尺寸相同（无缩放）"
        description: "取消尺寸差异，所有象限的锚块大小一致。图案直接复制（1:1），不需要缩放，聚焦于反射变换的推理。简化但保留核心的反射逻辑。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "锚块由多个分散色块组成"
        description: "每个象限的'锚块'不是单一连通色块，而是多个分散的小红色色块。尺寸需要通过某种聚合方式计算（如总面积或外接矩形），解题者需要先识别分散锚块的归属。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D10
    name: "锚块颜色的角色"
    tag: meta
    current: "锚块统一为红色，颜色仅用于标识锚块身份，不编码其他信息"
    alternatives:
      - name: "锚块颜色编码变换类型"
        description: "不同象限的锚块可以有不同颜色，颜色编码该象限应使用的变换类型（如红色=水平反射、蓝色=垂直反射、绿色=旋转90度）。解题者需要先建立颜色-变换映射关系。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "锚块颜色决定输出图案颜色"
        description: "目标图案不保留源图案的颜色，而是被重新着色为目标象限锚块的颜色。如果不同象限锚块颜色不同，各处图案也会有不同颜色。增加颜色推理维度。"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 15
      - name: "锚块颜色与背景色建立映射"
        description: "锚块颜色和背景颜色共同决定缩放因子或变换方式（如颜色差值编码某种参数）。解题者需要从颜色关系中推断数值参数。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D11
    name: "多步处理顺序"
    tag: multi_step
    current: "四步线性流程：识别锚块 -> 计算缩放因子 -> 确定反射轴 -> 复制缩放反射后的图案"
    alternatives:
      - name: "迭代传播：复制结果作为下一轮的源"
        description: "第一轮从左上复制到右上，第二轮以右上的新图案为源复制到右下，第三轮从右下复制到左下。每轮的缩放和反射基于当前源和目标的关系。链式传播引入累积误差的风险，推理更复杂。"
        source: multi_step
        source_task: 16b78196
        delta_lines: 30
      - name: "按锚块尺寸从小到大顺序处理"
        description: "目标象限不是同时处理，而是按锚块尺寸从小到大依次处理，每次处理可能影响后续步骤（如已放置的图案可能与后续图案重叠时需要覆盖规则）。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 20
      - name: "先缩放后反射 vs 先反射后缩放"
        description: "当前为先计算缩放再反射。改为先反射再缩放，对于非对称图案这两种顺序会产生不同结果。解题者需要推断正确的变换顺序。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "双重源：两个象限各提供不同方面的信息"
        description: "左上象限提供图案形状，右上象限提供颜色信息，两者合并后应用到左下和右下。解题者需要从两个源中分别提取不同维度的信息并综合。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D12
    name: "符号编码：图例或参数标记"
    tag: symbol_instructions
    current: "无符号编码——缩放因子和反射轴均从空间关系隐式推导"
    alternatives:
      - name: "网格边缘的缩放因子图例"
        description: "在网格边缘放置数值图例（如用像素条长度编码缩放因子），目标象限的缩放因子从图例读取而非从锚块尺寸比推算。解题者需要先解读图例再应用变换。"
        source: legend_lookup
        source_task: 58490d8a
        delta_lines: 25
      - name: "箭头标记指示反射方向"
        description: "每个目标象限附近有方向性标记像素（如单像素偏移构成的箭头），指示该象限的反射方式。反射轴不再由象限位置唯一确定，而需要读取标记。"
        source: marker_pixels
        source_task: 9aaea919
        delta_lines: 20
      - name: "颜色映射图例定义图案重着色"
        description: "网格角落有一个小型颜色映射表（源色->目标色的色对），图案复制到目标时根据图例进行颜色替换。增加图例解读和颜色映射两层推理。"
        source: template_stamping
        source_task: 65b59efc
        delta_lines: 30
      - name: "锚块边缘像素编码旋转角度"
        description: "目标锚块的某条边上有额外的彩色像素，像素数量编码旋转角度（1个=90度，2个=180度，3个=270度）。将反射替换为旋转，并从像素计数中解码参数。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D13
    name: "图案与锚块的空间关系"
    tag: meta
    current: "图案紧邻锚块放置（与锚块共享边或角），图案的锚定点是锚块的特定角/边"
    alternatives:
      - name: "图案与锚块有固定间距"
        description: "图案不直接相邻锚块，而是与锚块之间有固定间距（如1-2像素的间隔）。间距可能随缩放因子等比放大。解题者需要推断间距规则。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "图案环绕锚块四周"
        description: "源图案不是在锚块一侧，而是环绕锚块所有四条边。目标图案同样需要环绕目标锚块。环绕式布局在缩放和反射时更复杂。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "图案在锚块内部（重叠）"
        description: "源图案覆盖在锚块上方（与锚块像素重叠），通过与锚块颜色不同来区分。目标同样将缩放后的图案叠加到目标锚块上。需要处理颜色叠加逻辑。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "图案位置由锚块朝向决定"
        description: "锚块不是对称正方形而是有方向性的形状（如带一个凸起），图案放在凸起指向的方向。不同象限的锚块朝向不同，决定了图案的相对位置。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D14
    name: "背景与干扰"
    tag: meta
    current: "网格背景为单一颜色，无干扰元素，仅有锚块和源图案作为前景对象"
    alternatives:
      - name: "添加非红色干扰色块"
        description: "网格中散布一些非红色的彩色色块作为干扰项，不参与任何匹配或变换。解题者需要区分锚块和干扰色块，增加视觉过滤难度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "象限边界有装饰线"
        description: "象限之间有彩色装饰线（如网格分割线），这些线不参与逻辑但增加视觉复杂度。线的颜色或样式可能与锚块颜色相同以增加迷惑性。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "部分目标象限预填充噪声像素"
        description: "某些目标象限的锚块旁已有少量随机颜色像素（需要被正确的缩放图案覆盖或清除）。解题者需要判断哪些像素是噪声、哪些应保留。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D15
    name: "源与目标的基数关系"
    tag: meta
    current: "1个源象限（左上）对多个目标象限（1:many），源图案是唯一的"
    alternatives:
      - name: "多源多目标一一配对"
        description: "有两个源象限各含不同图案，两个目标象限各对应一个源。通过锚块尺寸或颜色决定配对关系。解题者需要推断配对规则。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "每个象限既是源也是目标"
        description: "所有四个象限都有局部图案，每个象限将自己的图案复制到对称位置的象限。输出是四个图案叠加的结果，需要处理重叠冲突。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "单一目标接收多个源"
        description: "取反当前的1:many为many:1——多个小象限的图案缩小后合并到一个大象限中。解题者需要推断多图案的空间排列和缩小规则。"
        source: inversion
        source_task: null
        delta_lines: 25

  - id: D16
    name: "缩放因子的确定方式"
    tag: meta
    current: "缩放因子 = d.red_block.size / s.red_block.size，由锚块的边长比直接计算"
    alternatives:
      - name: "缩放因子由象限面积比决定"
        description: "不使用锚块尺寸比，而是用目标象限面积与源象限面积的比值来确定缩放因子。如果象限大小不等（非居中分割），缩放因子会更有变化。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "缩放因子由锚块到象限边界的距离比决定"
        description: "缩放因子取决于锚块到最近象限边界的距离之比。这使得锚块位置（而非锚块大小）成为关键参数，解题者需要测量距离而非比较面积。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "缩放因子固定为2的幂次"
        description: "缩放因子限制为1、2、4等2的幂次，锚块尺寸也按此约束设计。二进制缩放视觉效果更整齐，且像素对齐更可靠。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "缩放因子由锚块颜色深度编码"
        description: "不通过锚块尺寸而是通过锚块的颜色亮度/数值来编码缩放因子（如颜色值2代表2倍缩放，3代表3倍）。但需注意人类看到的是颜色而非数字，因此可改用不同颜色映射（如红=2x，蓝=3x），通过一个图例定义映射关系。"
        source: creative
        source_task: null
        delta_lines: 25
