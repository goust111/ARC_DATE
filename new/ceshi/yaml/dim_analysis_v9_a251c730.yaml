task_id: a251c730
task_type: move_to_match
summary: "在壁纸背景上找到源矩形中的多色精灵，根据锚点颜色匹配目标矩形中的单像素标记，将精灵锚点对齐标记位置印刻到目标矩形中，输出裁剪后的目标矩形"

dimensions:
  - id: D1
    name: "匹配条件：锚点颜色匹配"
    tag: match_cond
    current: "精灵的锚点颜色（最少出现颜色）== 目标矩形中单像素标记的颜色，一对一匹配"
    alternatives:
      - name: "形状嵌合匹配"
        description: "目标矩形中不放单像素标记，而是开出与精灵外接矩形互补的小凹口。精灵需找到形状恰好嵌入的凹口来确定目标位置。推理从颜色识别变为几何互补判断，难度显著提升。"
        source: shape_match
        source_task: "16b78196"
        delta_lines: 40
      - name: "主体颜色匹配"
        description: "取反当前用最稀有颜色匹配的规则：改为用精灵的主体颜色（最多出现颜色）与标记匹配。解题者需要反向思考'多数色才是关键'，而非直觉上的'特殊像素'。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "精灵像素数量匹配"
        description: "目标矩形中放置长度不同的短线段标记，精灵的总像素数等于某个标记线段的长度时构成匹配。从颜色比较变为计数推理，需要解题者数像素。"
        source: size_match
        source_task: "2c181942"
        delta_lines: 25
      - name: "边缘颜色匹配"
        description: "目标矩形的边框在特定位置嵌入与精灵锚点颜色相同的边框段。精灵需匹配边框上对应颜色的行和列来确定印刻中心点。推理增加空间定位步骤。"
        source: edge_color_match
        source_task: "247ef758"
        delta_lines: 30
      - name: "连接器形状+颜色匹配"
        description: "目标矩形中放置2-3像素的小连接器图案（如L形、横线）替代单像素标记。精灵需同时匹配连接器的颜色和朝向/形状。匹配条件从单变量扩展为多变量，增加推理复杂度。"
        source: connector_match
        source_task: "20270e3b"
        delta_lines: 30
      - name: "精灵形状与标记区域形状匹配"
        description: "目标矩形中放置缩小版的精灵轮廓（仅1-2像素的简化形状），精灵需找到与自身形状最相似的简化轮廓标记来确定位置。增加形状识别与抽象推理。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D2
    name: "源对象：精灵结构"
    tag: src
    current: "源矩形中有2-4个精灵，1-2种类型，每种精灵为2x3或3x3外接矩形、5-7像素、恰好2种颜色（主体色=多数、锚点色=单一像素），同类型精灵形状完全相同"
    alternatives:
      - name: "三色精灵"
        description: "精灵由3种颜色组成：主体色、锚点色、装饰色。锚点色仍用于匹配，但装饰色增加了视觉复杂度。解题者需正确识别哪个是锚点色（最少出现的），区分装饰色干扰。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "精灵散布在壁纸上而非框架内"
        description: "取反当前'精灵在源矩形内'的约束：精灵直接散布在壁纸背景上，不被任何框架包围。解题者需在条纹壁纸中分辨出独立精灵，增加图底分离难度。"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "对角像素对作为源对象"
        description: "源对象不是完整精灵，而是对角像素对（两个同色像素位于矩形对角）。印刻时需将这两个像素及它们定义的矩形区域内的特定图案传递到目标。从整体搬运变为几何推断。"
        source: diagonal_markers
        source_task: "9385bd28"
        delta_lines: 35
      - name: "大尺寸稀疏精灵"
        description: "取反当前精灵的紧凑结构：精灵外接矩形扩大到5x5或6x6，但像素数仍只有5-7个，形成稀疏带洞结构。印刻时空洞位置也需正确保留，视觉复杂度增加。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D3
    name: "目标结构：标记类型与放置"
    tag: dst
    current: "目标矩形内部放置2-3个单像素标记，每个标记颜色对应一种精灵的锚点颜色，标记周围有足够空间容纳完整精灵印刻"
    alternatives:
      - name: "标记为小色块而非单像素"
        description: "目标矩形中的标记从单像素扩大为2x2或3x1色块，精灵需将锚点对齐到色块的特定角（如左上角）。增加对齐规则的推理步骤。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "标记在边框上而非内部"
        description: "取反当前'标记在内部'的规则：标记放在目标矩形的边框像素上。精灵的锚点对齐到边框标记位置，精灵体可能部分伸入内部。需要推理边框位置与印刻方向的关系。"
        source: marker_alignment
        source_task: "581f7754"
        delta_lines: 20
      - name: "多框架目标"
        description: "网格中有2-3个独立的目标矩形，每个内部有不同的标记。精灵需先确定进入哪个框架（基于某种规则如框架边框颜色），再在框架内定位标记。增加多层决策推理。"
        source: jigsaw_assembly
        source_task: "8698868d"
        delta_lines: 35
      - name: "标记带方向指示"
        description: "标记不再是单像素，而是一个像素加上相邻的方向指示像素（如标记右方有一个额外像素表示精灵应从左侧进入）。精灵需根据方向指示旋转或翻转后再印刻。增加方向推理。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "变换：锚点对齐方式"
    tag: transform
    current: "将精灵平移使其锚点像素与目标标记像素完全重合，精灵保持原始朝向不变"
    alternatives:
      - name: "旋转后对齐"
        description: "精灵在印刻前需旋转特定角度（如90度），旋转方向由标记在目标矩形内的象限决定（左上→不旋转，右上→顺时针90度等）。增加空间变换推理。"
        source: rotation
        source_task: "2c181942"
        delta_lines: 20
      - name: "镜像翻转后对齐"
        description: "精灵根据标记相对于目标矩形中心的位置进行水平或垂直镜像翻转后再印刻。标记在左半部分则水平翻转，在上半部分则垂直翻转。增加对称性推理。"
        source: reflection
        source_task: "b10624e5"
        delta_lines: 20
      - name: "颜色互换后对齐"
        description: "精灵印刻时主体色和锚点色互换——锚点像素变为主体色，主体像素变为锚点色。视觉上精灵在源和目标中颜色分布反转，解题者需注意这个变换规则。"
        source: color_swap
        source_task: "a25697e4"
        delta_lines: 10
      - name: "重新上色为标记颜色"
        description: "印刻时精灵的主体色变为目标矩形的边框颜色，锚点色保持不变。不同框架边框颜色不同时，同一精灵在不同框架中呈现不同颜色。增加颜色映射推理。"
        source: recolor
        source_task: "20270e3b"
        delta_lines: 10
      - name: "缩放后对齐"
        description: "精灵在印刻时放大2倍（每个像素变为2x2块）。目标矩形需要足够大以容纳放大后的精灵。解题者需推断出缩放规则及缩放因子。"
        source: scaling
        source_task: "b10624e5"
        delta_lines: 25

  - id: D5
    name: "输出裁剪：网格形状"
    tag: grid_shape
    current: "输出为目标矩形的精确裁剪，包含边框，内部清空后重新印刻精灵"
    alternatives:
      - name: "仅输出内部（去边框）"
        description: "取反当前保留边框的规则：输出仅包含目标矩形的内部区域，不包含1像素宽的边框。输出尺寸比目标矩形小2行2列。改变裁剪范围的推理。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "紧凑裁剪到精灵外接矩形"
        description: "输出不是整个目标矩形，而是紧凑裁剪到所有已印刻精灵的最小外接矩形。输出大小因精灵位置而异，解题者需推断裁剪规则。"
        source: tight_crop
        source_task: "20270e3b"
        delta_lines: 15
      - name: "保留完整输入网格"
        description: "取反裁剪规则：输出保留完整30x30网格，但目标矩形内部的精灵已被印刻、源矩形被清除（或保留）。解题者需关注全局变化而非局部裁剪。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "多框架拼接输出"
        description: "如果有多个目标框架，输出将它们按行或列拼接，中间无间隔。输出是一个包含所有已印刻目标框架的合并网格。"
        source: packed_grid
        source_task: "58f5dbd5"
        delta_lines: 20

  - id: D6
    name: "背景结构：壁纸类型"
    tag: meta
    current: "30x30网格以4-5种颜色的垂直或水平条纹壁纸为背景，周期等于颜色数"
    alternatives:
      - name: "棋盘格壁纸"
        description: "背景从条纹变为2色或4色棋盘格图案。矩形框架叠加在棋盘上。改变背景纹理不影响核心推理，但视觉上更复杂，增加图底分离难度。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "纯色背景"
        description: "取反壁纸复杂性：背景为纯色（单一颜色），没有条纹图案。减少视觉干扰，简化矩形识别，但可能需要调整颜色约束以保持足够的颜色数量。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "对角条纹壁纸"
        description: "条纹方向从水平/垂直变为45度对角线。视觉上更复杂，但核心匹配逻辑不变。增加人类的视觉解析难度。"
        source: creative
        source_task: null
        delta_lines: 12

  - id: D7
    name: "源-目标关系：基数映射"
    tag: meta
    current: "每种精灵类型在目标中恰好对应一个标记（一对一映射），源中可有同类型的多个副本但只有一个被使用"
    alternatives:
      - name: "一对多映射"
        description: "目标矩形中同一种锚点颜色出现多个标记，同一精灵需被印刻到所有匹配标记的位置。从一对一变为一对多，测试解题者对重复应用规则的推理。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "多对一映射（叠加）"
        description: "多个不同精灵共享同一锚点颜色（但主体颜色不同），都需印刻到同一标记位置，后印刻的覆盖先印刻的。需推理覆盖顺序（如按精灵大小排序）。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "排除式映射"
        description: "源矩形中包含额外的干扰精灵（锚点颜色在目标中没有对应标记），这些精灵应被忽略。解题者需识别并排除无效匹配，增加筛选推理。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D8
    name: "精灵锚点定义"
    tag: meta
    current: "锚点是精灵中出现次数最少的颜色的像素（单一像素），作为匹配键和定位参考点"
    alternatives:
      - name: "锚点为几何中心像素"
        description: "取反'最稀有颜色为锚点'的规则：锚点改为精灵外接矩形的几何中心像素（取整）。匹配颜色仍看该中心像素的颜色，但定位逻辑从'稀有像素位置'变为'中心位置'。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "锚点为特定角落像素"
        description: "锚点固定为精灵外接矩形的左上角像素。匹配和对齐都以左上角为准。解题者需推理出固定角落规则而非颜色频率规则。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "锚点为多像素标记"
        description: "锚点不再是单个像素，而是精灵中所有稀有颜色像素（2-3个）。对齐时使用这些锚点像素的质心与标记对齐。增加空间计算推理。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D9
    name: "矩形识别与区分"
    tag: meta
    current: "源矩形通过内部含多像素连通分量来识别（精灵），目标矩形通过内部仅含单像素标记来识别；源矩形面积严格大于目标矩形"
    alternatives:
      - name: "边框颜色区分"
        description: "取反面积大小区分规则：源和目标矩形面积可以相同，改为通过边框颜色约定来区分（如源矩形边框颜色不在壁纸调色板中，目标矩形边框颜色在壁纸调色板中）。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "三个矩形（含图例矩形）"
        description: "增加第三个矩形作为图例/指令区域，其中包含颜色对应表或变换规则的符号编码。解题者需先解读图例再执行匹配和印刻。增加符号解码步骤。"
        source: symbol_instructions
        source_task: null
        delta_lines: 40
      - name: "目标矩形更大"
        description: "取反当前'源面积>目标面积'的约束：目标矩形面积大于源矩形。目标内部有更多空余空间，标记更分散。改变大小关系不影响核心逻辑但改变视觉比例。"
        source: inversion
        source_task: null
        delta_lines: 5

  - id: D10
    name: "多步处理：印刻顺序与覆盖"
    tag: multi_step
    current: "所有精灵一次性印刻，无特定顺序要求（精灵间不重叠）"
    alternatives:
      - name: "分步印刻有覆盖顺序"
        description: "精灵按特定顺序（如锚点颜色的色值从小到大）依次印刻，后印刻的覆盖先印刻的重叠区域。当标记位置靠近时会产生覆盖，解题者需推理正确顺序。"
        source: multi_step
        source_task: "247ef758"
        delta_lines: 15
      - name: "迭代处理：印刻后生成新标记"
        description: "第一轮印刻后，新印刻的精灵中某些像素成为第二轮的标记，触发更多精灵印刻。重复直到没有新标记。增加迭代推理深度。"
        source: multi_step
        source_task: "16b78196"
        delta_lines: 30
      - name: "先清除源矩形再印刻"
        description: "增加一个预处理步骤：先从输入网格中移除源矩形（用壁纸填充），然后在目标矩形中印刻精灵。输出保留完整网格而非裁剪。增加全局变化的推理。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D11
    name: "轨迹：源对象移动后的痕迹"
    tag: trajectory
    current: "默认消失——源矩形中的精灵在输出中不保留（输出仅为目标矩形裁剪）"
    alternatives:
      - name: "保留源精灵"
        description: "输出保留完整网格，源矩形中的精灵保持不变，同时目标矩形中印刻了对应精灵。解题者需注意源不消失，输出是整个修改后的网格。"
        source: keep_source
        source_task: "247ef758"
        delta_lines: 10
      - name: "移动轨迹涂色"
        description: "精灵从源矩形'移动'到目标矩形，沿路径在壁纸上留下主体颜色的轨迹线。输出保留全网格，展示移动路径。增加路径推理维度。"
        source: continuous_trail
        source_task: "8b9c3697"
        delta_lines: 30
      - name: "源位置留下锚点色填充"
        description: "精灵从源矩形消失后，其原始位置被锚点颜色的实心矩形填充（外接矩形大小）。视觉上标记了'精灵曾在这里'。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D12
    name: "颜色约束体系"
    tag: meta
    current: "锚点颜色不在壁纸调色板中、不等于源背景色和目标背景色；边框颜色不等于内部背景色；总共7-9种不同颜色"
    alternatives:
      - name: "锚点颜色可与壁纸颜色重叠"
        description: "放宽锚点颜色不在壁纸中的约束，允许锚点颜色与壁纸颜色相同。这增加了在壁纸条纹中识别矩形边界和精灵的难度，因为颜色区分度降低。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "最少化颜色数量"
        description: "取反当前7-9种颜色的丰富调色板：将总颜色数减至5-6种，多个角色复用同一颜色（如壁纸颜色同时用作某精灵的主体色）。增加颜色歧义的推理挑战。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "颜色对应表编码"
        description: "增加一个颜色映射规则：精灵锚点颜色不直接等于标记颜色，而是通过网格中某处的颜色对应表（如2xN的色块阵列）间接映射。增加符号解码步骤。"
        source: symbol_instructions
        source_task: null
        delta_lines: 25

  - id: D13
    name: "矩形布局：空间排列"
    tag: meta
    current: "两个矩形在30x30网格中不重叠排列，可以并排或上下堆叠，间距1-4像素"
    alternatives:
      - name: "矩形部分重叠"
        description: "取反'不重叠'约束：源和目标矩形的边框可以部分重叠（共享边框段）。解题者需正确分割两个重叠矩形的各自内部区域。增加边界判断难度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "矩形嵌套"
        description: "目标矩形嵌套在源矩形内部（源矩形包围目标矩形）。精灵在源和目标之间的区域中，标记在最内层矩形中。改变空间拓扑结构。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "四方位布局"
        description: "取反当前仅两种布局（并排/堆叠）的限制：源矩形可在目标矩形的上、下、左、右四个方向中任一方向，位置完全随机。解题者不能依赖固定的空间关系。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D14
    name: "精灵类型多样性"
