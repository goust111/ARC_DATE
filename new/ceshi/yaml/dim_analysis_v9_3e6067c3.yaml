task_id: 3e6067c3
task_type: move_to_match
summary: "根据底部控制像素序列的颜色顺序，在主区域中找到对应颜色的带框方块，按序在相邻方块之间绘制彩色桥梁连接线"

dimensions:
  - id: D1
    name: "匹配条件：颜色匹配方式"
    tag: match_cond
    current: "控制像素颜色与方块内部填充颜色相同 (s.colors == d.inner_squares.colors)"
    alternatives:
      - name: "边框颜色匹配"
        description: "每个方块使用不同的边框颜色而非内部颜色来标识，控制像素匹配边框颜色。解题者需要关注外层边框而非内部填充，改变了视觉注意力焦点，增加推理难度"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 25
      - name: "形状匹配"
        description: "方块内部不再是纯色填充，而是包含不同形状的小图案（如L形、T形等），控制区域也包含对应的小形状图案进行匹配。从颜色匹配转为形状匹配，要求解题者识别几何形状的对应关系"
        source: shape_match
        source_task: 16b78196
        delta_lines: 40
      - name: "方块大小匹配"
        description: "所有方块内部颜色相同，但大小不同（不同的边框厚度或内部面积），控制区域用不同长度的色条表示对应的方块大小。将颜色维度的匹配转化为数量/尺寸维度，需要度量推理"
        source: size_match
        source_task: 2c181942
        delta_lines: 35
      - name: "内部像素数量匹配"
        description: "方块内部包含不同数量的彩色像素点（如1个、2个、3个），控制区域用相同数量的像素点来指定目标方块。解题者需要计数而非识别颜色"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 30
      - name: "互补色匹配"
        description: "控制像素的颜色与目标方块内部颜色不同，而是通过固定的颜色映射表（如红->蓝、绿->黄等，由额外图例给出）进行间接匹配。需要解题者先理解颜色对应关系再进行匹配，增加了一层间接推理"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D2
    name: "匹配条件：对齐与消歧规则"
    tag: match_cond
    current: "当多个方块具有相同内部颜色时，优先选择行/列对齐且距离最近的方块"
    alternatives:
      - name: "反转优先级：最远优先"
        description: "当多个候选方块对齐时选择最远的而非最近的。迫使桥梁跨越更多间隔，产生更复杂的视觉交叉图案，改变了空间推理策略"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "严格行列交替对齐"
        description: "奇数步必须沿行方向连接，偶数步必须沿列方向连接（或反之）。增加了对序列位置的额外约束，要求解题者同时跟踪步骤编号和空间方向"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "无对齐约束，纯最近邻"
        description: "取消行列对齐要求，仅按曼哈顿距离选择最近的匹配色方块。桥梁可以既有水平又有垂直分量（L形桥梁），增加了路径绘制的复杂性"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "按方块在网格中的位置顺序消歧"
        description: "当多个方块匹配时，按从上到下、从左到右的位置顺序选择第一个未被访问过的方块。引入了全局位置排序作为消歧规则，而非局部距离"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 15

  - id: D3
    name: "源对象：控制像素的编码形式"
    tag: src
    current: "底部区域的单行控制像素序列，每个像素代表一种颜色，从左到右编码访问顺序"
    alternatives:
      - name: "双行控制像素：起点-终点对"
        description: "控制区域由两行组成，上行表示桥梁起点颜色，下行表示桥梁终点颜色，形成配对关系。解题者需要将两行信息对齐组合，增加了信息整合难度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "控制像素位于左侧列"
        description: "控制像素从底部行移到左侧列，从上到下编码访问顺序。改变了空间布局的阅读方向（从水平变为垂直），测试解题者对不同布局方向的适应能力"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "散布的标记像素"
        description: "控制像素不在统一的行/列中，而是散布在网格的边缘位置（四个边上），每个标记像素旁有一个数字指示序号（用相邻像素数量编码）。需要先收集再排序，增加了信息提取的难度"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "对角线标记对指示连接"
        description: "用对角线方向的像素对（如9385bd28中的对角标记）来指示需要连接的两个方块，每对标记的两种颜色分别对应起点和终点方块。从序列编码变为配对编码，改变了信息结构"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 35

  - id: D4
    name: "目标对象：带框方块的结构"
