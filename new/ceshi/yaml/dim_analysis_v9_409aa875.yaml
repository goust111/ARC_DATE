task_id: 409aa875
task_type: move_along_path
summary: "三角形精灵根据形状（L形或V形）确定发射方向，投射物落在顶点沿方向5格处；命中精灵则整体重着色为栗色(9)，两枚投射物落在同一空背景格则涂蓝(1)，单枚落空背景涂栗色(9)"

dimensions:
  - id: D1
    name: "发射路径类型（对角线 vs 轴对齐）"
    tag: path
    current: "L形精灵沿对角线发射，V形精灵沿轴方向发射；方向由形状的缺口/开口方向决定"
    alternatives:
      - name: "统一为直线射线（仅轴对齐）"
        description: "取消对角线发射，所有精灵均沿上下左右四方向发射。解题者不再需要区分L/V形状来判断对角线vs轴方向，降低方向推理复杂度但保留形状->方向映射"
        source: straight_ray
        source_task: "221dfab4"
        delta_lines: 15
      - name: "统一为对角线射线（仅对角线）"
        description: "反转：所有精灵均沿对角线发射。V形现在也沿对角线而非轴方向发射，需重新设计V形的方向编码规则。视觉上投射物落点分布更分散"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "反射路径（遇障碍弹射）"
        description: "投射物不直接飞到目标格，而是在飞行过程中遇到已有精灵会发生45度反射后继续前进。类似 142ca369 的墙壁反射机制，路径变为折线，解题者需模拟弹射轨迹"
        source: reflection
        source_task: "142ca369"
        delta_lines: 40
      - name: "重力流动路径"
        description: "投射物发射后受重力影响向下偏移，每步向下移一格同时保持水平方向不变（类似抛物线）。类似 28a6681f 的流动机制，增加路径预测的复杂度"
        source: gravity
        source_task: "28a6681f"
        delta_lines: 35

  - id: D2
    name: "投射距离"
    tag: path
    current: "固定距离5格（apex + 5 * direction）"
    alternatives:
      - name: "距离由精灵颜色编码"
        description: "不同颜色的精灵投射不同距离（如红色=3格，蓝色=5格，绿色=7格）。解题者需先从示例中推断颜色-距离映射表，再计算落点。融合符号解码与空间推理"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "距离由形状类型决定"
        description: "L形精灵投射距离为4格，V形为6格，不同形状有不同射程。解题者需发现形状与距离的对应关系，增加一层参数推理"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "射线持续到碰撞或边界（无固定距离）"
        description: "投射物沿方向一直飞行直到撞上精灵或网格边界，不受固定距离限制。类似 ray_casting 的经典射线投射，大幅改变落点判断逻辑——需扫描整条射线路径"
        source: ray_casting
        source_task: "5961cc34"
        delta_lines: 25
      - name: "距离等于同方向上到最近精灵的距离减1"
        description: "投射物飞行距离动态决定：找到射线方向上最近的另一个精灵，停在它前面一格。解题者需在每个方向做最近邻搜索，推理复杂度显著提升"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D3
    name: "精灵形状与方向编码"
    tag: src
    current: "两种3像素三角形：L形（轴对齐直角，占2x2的3个角）和V形（顶点+两条对角臂），形状决定发射方向（L对角线/V轴方向）"
    alternatives:
      - name: "箭头形精灵（凸部指向发射方向）"
        description: "用3像素箭头形代替L/V：箭头尖端指向发射方向。类似 3dc255db 的凸部方向编码，形状语义更直观（箭头=方向），但8方向需要8种不同箭头构型"
        source: direction_from_shape
        source_task: "3dc255db"
        delta_lines: 30
      - name: "大小可变的三角精灵（3-5像素）"
        description: "精灵像素数不固定为3，可为3、4或5像素的三角形。更大的精灵提供更明确的方向线索但增加形状识别的多样性，且像素数可编码投射距离"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "双色精灵（顶点色与臂色不同）"
        description: "精灵的顶点像素用一种颜色，臂像素用另一种颜色，顶点颜色标识发射方向类型。解题者需先识别颜色差异来定位顶点，再推断方向，增加视觉解析步骤"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "单像素源 + 边缘位置编码方向"
        description: "类似 4a21e3da 的边缘控制像素：发射源为网格边缘的单像素，方向由其所在边缘决定（上边向下、左边向右等）。完全改变源的形状语义"
        source: control_pixels
        source_task: "4a21e3da"
        delta_lines: 35

  - id: D4
    name: "碰撞规则（投射物-精灵）"
    tag: transform
    current: "投射物命中精灵时，整个被命中精灵重着色为栗色(9)"
    alternatives:
      - name: "命中精灵被擦除（消失）"
        description: "反转重着色为擦除：被命中精灵的所有像素变为背景色，精灵从网格上消失。类似 3dc255db 的消失变换，视觉上更戏剧性，解题者需注意'缺失的精灵'"
        source: erase
        source_task: "3dc255db"
        delta_lines: 5
