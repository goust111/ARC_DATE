        description: "反转'整体重着色'：只将投射物落点那一个像素改色，不影响精灵其余像素。使变换更局部化，解题者需精确定位落点而非整体标记"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "命中精灵被投射物颜色覆盖并向发射方向平移1格"
        description: "被命中精灵不仅变色，还向投射物方向移动1格（被'推开'）。增加空间变换维度，解题者需同时推理颜色变化和位移"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "命中精灵产生连锁反应（继续发射）"
        description: "被命中精灵变色后自身也发射一枚投射物（沿原方向继续），形成连锁反应。类似 5961cc34 的 chain_reaction，解题者需模拟多轮传播直到无新碰撞"
        source: chain_reaction
        source_task: "5961cc34"
        delta_lines: 30

  - id: D5
    name: "碰撞规则（投射物-投射物）"
    tag: transform
    current: "两枚以上投射物落在同一空背景格时涂蓝(1)，单枚涂栗色(9)"
    alternatives:
