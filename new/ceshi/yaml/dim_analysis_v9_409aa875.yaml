        source: creative
        source_task: null
        delta_lines: 10
      - name: "碰撞点不着色，但两枚投射物各自偏转90度继续飞行"
        description: "碰撞后投射物不消失，而是各自偏转90度继续前进直到到达边界。碰撞变成路径修改事件而非终止事件，大幅增加模拟复杂度"
