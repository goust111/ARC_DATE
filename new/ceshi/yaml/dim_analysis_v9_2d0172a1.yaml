task_id: 2d0172a1
task_type: symmetry/pattern
summary: "将粗糙手绘的嵌套框架-色块图转换为规范的矩形边框-像素点图，保留包含关系和兄弟节点的行/列相对顺序"

dimensions:
  - id: D1
    name: "源对象：前景对象类型"
    tag: src
    current: "两种前景对象——框架（闭合简单曲线，恰好1个洞）和色块（无洞的小型填充连通区域，4-11像素），均为同一前景色"
    alternatives:
      - name: "多颜色前景对象"
        description: "框架和色块使用不同颜色（如框架为红色、色块为蓝色），输出时保留各自颜色。解题者需要先按颜色区分对象类别再进行规范化，增加了颜色属性识别的推理步骤。输出中框架边框和内部点使用各自原色。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 25
      - name: "三类前景对象：框架、色块和线段"
        description: "除框架和色块外，增加短线段对象（宽度1像素、长度3-6像素的直线），线段在输出中规范化为固定长度的水平或垂直线（保留方向）。增加了对象分类的复杂度，解题者需要识别三种不同几何特征的对象并分别处理。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "框架内部有装饰纹理"
        description: "框架不再是简单闭合曲线，而是双线边框（厚度2像素），输出时仍规范化为单像素宽矩形边框。解题者需要识别出双线结构实际上是一个框架而非两个嵌套框架，考验对象识别的鲁棒性。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "色块带方向性标记"
        description: "每个色块不再是无方向的填充区域，而是带有一个突出像素的箭头状形状（如T形、L形），输出中保留色块的朝向信息（用1x2或2x1的像素块表示方向）。增加了方向信息的提取和编码。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D2
    name: "源对象：色块的几何属性"
    tag: src
    current: "色块为小型不规则填充区域，像素数4-11，外接矩形2x2到4x4，无洞"
    alternatives:
      - name: "色块为单像素点"
        description: "色块退化为最小形态——单个前景像素。输出中仍为单像素点（不变），但输入的识别变得更困难，因为单像素可能与框架边缘的噪声混淆。解题者需要更仔细地区分属于框架的像素和独立的色块像素。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "色块为较大填充区域"
        description: "色块尺寸增大到12-25像素，外接矩形可达5x5到6x6。输出中仍规范化为单像素点。色块与小型框架在视觉上更容易混淆（都是较大的前景区域），解题者需要更精确地判断是否有洞来区分二者。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "色块尺寸编码信息"
        description: "色块的像素数量决定输出中点的表示方式：小色块(4-6)输出为1x1点，中色块(7-8)输出为1x2水平点，大色块(9-11)输出为2x1垂直点。解题者需要计算色块面积并据此选择输出形态，增加了计数与映射推理。"
        source: size_encoded_parameter
        source_task: 6ffbe589
        delta_lines: 25

  - id: D3
    name: "源对象：框架的几何属性"
    tag: src
    current: "框架为4-连通闭合简单曲线，每个像素恰好有2个4-邻域前景邻居，外接矩形7x7到20x24，带有不规则弯折（turn_ratio 0.34-0.43）"
    alternatives:
      - name: "矩形框架（无弯折）"
        description: "框架为完美矩形环（取反：从弯折到笔直），输出保持不变。任务从'去噪/规范化弯折曲线'变为'纯粹的包含关系+空间排布提取'，降低了几何识别难度但保留结构推理。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "框架为圆形/椭圆形闭合曲线"
        description: "框架不再是粗略矩形而是粗略圆形或椭圆形的闭合曲线，输出仍为矩形边框。解题者需要识别出圆形区域对应矩形输出，几何映射更抽象。生成时使用离散Bresenham椭圆算法加随机抖动。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "框架有缺口（非完全闭合）"
        description: "框架曲线有1-2个小缺口（1-2像素宽），但仍能通过上下文推断出完整包围区域。解题者需要推断'准闭合'结构为框架，增加了容错识别的推理要求。洞的检测需改为使用近似闭合区域而非严格闭合。"
        source: creative
        source_task: null
        delta_lines: 50

  - id: D4
    name: "目标：规范化输出的框架表示"
    tag: dst
    current: "框架在输出中规范化为1像素宽的矩形边框，内部留2格背景间距到子节点"
    alternatives:
      - name: "框架输出为填充矩形区域"
        description: "框架在输出中不是空心边框而是实心填充矩形（子节点叠加在其上），输出变为层叠式布局。解题者需要理解'框架->填充区域'的映射规则，同时辨别层叠关系。视觉呈现完全不同，推理模式从'边框+内容'变为'区域+覆盖'。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "框架输出为角标记"
        description: "框架在输出中仅保留四个角的像素（形成四个点标记矩形区域），子节点放置在四角围成的区域内。解题者需要从四角标记推断矩形边界，是一种更抽象的空间表示方式。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "框架输出为双层嵌套边框"
        description: "框架在输出中变为双层矩形边框（内外各一层，中间1格间距），子节点在最内层内部。这改变了输出的空间占用计算和布局逻辑，解题者需要推断出双层边框的模式。"
        source: nested_frames
        source_task: 45a5af55
        delta_lines: 20

  - id: D5
    name: "目标：规范化输出的色块表示"
    tag: dst
    current: "色块在输出中规范化为单个前景像素点"
    alternatives:
      - name: "色块输出为固定大小的小方块"
        description: "色块在输出中规范化为2x2的填充方块（而非1x1点）。布局间距相应调整。视觉上更明显，解题者需要识别出'色块->2x2方块'的固定映射规则。"
        source: pixel_enlargement
        source_task: bf45cf4b
        delta_lines: 15
      - name: "色块输出为十字形"
        description: "色块在输出中规范化为3x3十字形（中心+四个正交邻居）。占用更多空间，改变了整体布局。解题者需要识别从不规则色块到规整十字形的映射，增加了形状变换的推理。"
        source: decomposition
        source_task: a47bf94d
        delta_lines: 20
      - name: "色块输出保留原始外接矩形大小"
        description: "色块在输出中规范化为与原始色块外接矩形等大的填充矩形（如3x4色块变为3x4填充块）。解题者需要测量原始色块的外接矩形尺寸并在输出中重现，增加了度量提取的推理。"
        source: scale_to_fit
        source_task: 898e7135
        delta_lines: 25

  - id: D6
    name: "变换：包含关系检测方式"
    tag: transform
    current: "通过检测框架的洞（4-连通背景区域中不连接边界的部分）来判断哪些对象在框架内部，选择最小容器作为直接父节点"
    alternatives:
      - name: "基于外接矩形包含的层级判定"
        description: "不使用洞检测而是通过外接矩形包含关系判断层级：若对象A的外接矩形完全包含对象B的外接矩形，则B是A的子节点。这改变了边界情况的处理——对象可能在框架的外接矩形内但不在框架的洞中。解题者需要注意外接矩形vs实际轮廓的区别。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "基于最近距离的父子关系"
        description: "不使用包含关系，而是将每个色块分配给距其质心最近的框架（欧氏距离）。若色块在框架内部和外部的情况都可能发生，解题者需要通过距离而非拓扑关系推断层级。根本性地改变了推理逻辑。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "颜色编码的层级关系"
        description: "使用多种前景色，每个框架和其直接子节点使用相同颜色，不同层级使用不同颜色。包含关系通过颜色一致性判断而非几何拓扑。解题者的推理从空间分析变为颜色分组。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 40

  - id: D7
    name: "变换：兄弟节点排序规则"
    tag: transform
    current: "同一框架内的兄弟节点按其在输入中的行/列带(band)排列——行带不重叠的按行排序，列带不重叠的按列排序"
    alternatives:
      - name: "按面积排序"
        description: "兄弟节点在输出中按原始面积（像素数）从大到小排列，而非保留空间位置关系。解题者需要计算每个对象的面积并据此确定输出位置，从空间推理变为计数+排序推理。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "按到框架中心距离排序"
        description: "兄弟节点按其质心到父框架中心的距离从近到远排列。解题者需要估算距离并确定排序，引入了距离度量的推理维度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "行列顺序取反"
        description: "保持行/列带排序逻辑，但反转方向——从下到上、从右到左排列（取反）。解题者需要发现排序方向被镜像，考验是否能注意到细微的方向反转。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "按外接矩形宽高比排序"
        description: "兄弟节点按外接矩形的宽高比排序：宽扁的在前，窄高的在后。解题者需要分析每个对象的形状比例并据此排序，这是一种不常见但合理的几何属性排序方式。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D8
    name: "变换：外部色块的处理"
    tag: transform
    current: "不在任何框架内的色块（0-1个）放置在最外层框架的一侧，输出中占据3x3背景槽位"
    alternatives:
      - name: "禁止外部色块"
        description: "所有色块必须在某个框架内部，不存在外部色块（取反）。简化了任务结构，使解题者只需关注嵌套包含关系，不需要处理框架外部的特殊情况。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "多个外部色块"
        description: "允许0-3个外部色块分布在框架的不同侧面（上下左右），每个在输出中都获得自己的3x3背景槽位。增加了输出布局的复杂度，解题者需要跟踪多个外部对象的相对位置。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "外部色块在输出中被删除"
        description: "外部色块在输出中不出现（被忽略），只有框架内部的对象被规范化输出。解题者需要推断出'框架外=删除'的规则，增加了过滤逻辑的推理。"
        source: deletion
        source_task: 7b80bb43
        delta_lines: 10
      - name: "外部色块包裹独立边框"
        description: "外部色块在输出中不仅是单像素点，还被一个独立的小矩形边框包围（就像是深度0的单元素框架）。解题者需要推断框架外的色块获得自己的'虚拟框架'，增加了规则推理的复杂度。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D9
    name: "变换：规范化布局的间距规则"
    tag: transform
    current: "框架边框到子节点有2格背景间距，兄弟节点之间有1格间距"
    alternatives:
      - name: "间距由嵌套深度决定"
        description: "顶层框架到子节点3格间距，内层框架到子节点1格间距；兄弟节点之间间距同样随深度递减。解题者需要推断间距与层级深度的对应关系，增加了数值规律发现的推理。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "间距为零（紧密排列）"
        description: "框架边框紧贴子节点（0间距），兄弟节点也紧贴排列（取反：从有间距到无间距）。输出非常紧凑，解题者需要识别出紧密贴合的布局规则。视觉上更密集，区分不同结构更有挑战性。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "间距由子节点数量决定"
        description: "框架到子节点的间距等于子节点数量（如3个子节点则间距为3），兄弟间距固定为1。解题者需要先数出子节点数量才能确定布局间距，引入了计数依赖的布局逻辑。"
        source: creative
        source_task: null
        delta_lines: 15

