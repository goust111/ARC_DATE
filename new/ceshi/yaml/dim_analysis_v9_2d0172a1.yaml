  - id: D19
    name: "对象识别：框架vs色块的判定依据"
    tag: transform
    current: "通过检测洞（4-连通非前景区域中不连接网格边界的部分）判断：有洞=框架，无洞=色块"
    alternatives:
      - name: "按面积判定"
        description: "按对象面积（像素数）判定：面积>阈值（如12像素）=框架，面积<=阈值=色块，不检查洞。改变了判定依据从拓扑属性到度量属性，某些情况下结果可能不同（如大面积无洞对象被判为框架）。需要设计上保证两种判定等价。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "按外接矩形填充率判定"
        description: "计算对象像素数/外接矩形面积的比率：比率<0.5=框架（因为框架是环形，填充率低），比率>=0.5=色块。解题者需要估算填充率来分类对象，引入了比率计算的推理。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "按连通分量的欧拉数判定"
        description: "使用拓扑学的欧拉数（连通分量数-洞数）：欧拉数=0为框架（1个分量-1个洞），欧拉数=1为色块（1个分量-0个洞）。本质上与当前方法等价，但如果引入多洞对象则产生区别。"
        source: creative
        source_task: null
        delta_lines: 10
