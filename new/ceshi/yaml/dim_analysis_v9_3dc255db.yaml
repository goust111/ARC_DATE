task_id: 3dc255db
task_type: move_along_path
summary: "杯状框架(Y形/漏斗形)内的内容像素沿尾部尖刺方向弹射为直线，同时擦除原始内容"

dimensions:
  - id: D1
    name: "路径类型"
    tag: path
    current: "straight_ray — 内容像素从尖刺沿尾部方向发射为一条直线"
    alternatives:
      - name: "对角线弹射"
        description: "尾部尖刺方向改为45度对角线而非正交方向，杯形也相应调整为对角线收敛。解题者需要识别对角方向并沿对角线绘制弹射线，推理难度增加因为对角线路径不如正交方向直观"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 35
      - name: "反弹弹射"
        description: "弹射射线遇到网格边界后反弹(镜面反射)继续前进，直到所有内容像素被放置完毕。解题者需要追踪反弹路径并正确计算反射角度，引入了多步路径推理"
        source: reflection
        source_task: 142ca369
        delta_lines: 30
      - name: "重力流动"
        description: "内容像素不沿尾部方向弹射，而是像水一样受重力影响向下流动(无论杯口朝向)，从尖刺位置开始逐格下落直到遇到网格底边或障碍。解题者需要理解'重力'概念替代'方向弹射'概念"
        source: gravity
        source_task: 28a6681f
        delta_lines: 25
      - name: "扩散填充"
        description: "内容像素不是沿单一方向弹射，而是从尖刺出发向所有可用的正交方向进行BFS扩散，填充N个像素(N=内容数量)。解题者需理解扩散逻辑而非射线逻辑"
        source: BFS_activation
        source_task: 5961cc34
        delta_lines: 35

  - id: D2
    name: "方向确定机制"
    tag: path
    current: "direction_from_shape — 通过识别Y形精灵的凸出尾部(尖刺)来确定弹射方向"
    alternatives:
      - name: "颜色编码方向"
        description: "弹射方向不由杯形结构决定，而由杯内内容像素的颜色决定(如红=上、蓝=下、绿=左、黄=右)。解题者需要从示例中推断颜色-方向映射关系而非分析形状"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "内容像素密度决定方向"
        description: "弹射方向由杯口内容像素的分布密度决定——向内容像素更集中的一侧弹射。解题者需要分析像素分布模式来推断方向"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "箭头像素指示方向"
        description: "在杯形旁边添加一个小箭头精灵(如2-3个同色像素组成的L形)明确指示弹射方向，取代从杯形自身推断方向。解题者需要识别箭头并关联到对应的杯"
        source: symbol_instructions
        source_task: 88e364bc
        delta_lines: 40

  - id: D3
    name: "源对象类型"
    tag: src
    current: "杯口内部散布的单色内容像素(1-7个)"
    alternatives:
      - name: "多色内容像素"
        description: "杯口内部包含多种颜色的内容像素，弹射时按颜色分组排列(如先红后蓝)。解题者需要识别颜色分组规则并按正确顺序排列弹射线中的颜色"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "网格边缘控制像素作为源"
        description: "内容不在杯内，而是以控制像素形式出现在网格边缘，每个控制像素颜色对应一个杯的内容色。解题者需要将边缘像素与杯进行匹配"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 40
      - name: "内容为连通色块而非散点"
        description: "杯口内不是散布的单独像素，而是一个小的连通色块。弹射长度等于色块的像素数，但色块形状可能暗示某种额外信息(如宽度决定弹射线宽度)。改变了源对象的几何特征"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "终点/停止条件"
    tag: dst
    current: "stacking — 内容像素从尖刺向外堆叠，超出网格边界的部分被丢弃"
    alternatives:
      - name: "遇障碍停止"
        description: "弹射路径上放置障碍物(如其他颜色的像素)，射线遇到障碍就停止而非一直延伸到网格边界。未放置的剩余像素被丢弃。解题者需要识别障碍物并计算实际可放置长度"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 20
      - name: "到达目标标记停止"
        description: "网格上存在与内容同色的目标标记像素，弹射线延伸到该标记处停止(而非网格边界)。解题者需要先找到目标标记再确定弹射终点"
        source: marker_alignment
        source_task: 581f7754
        delta_lines: 25
      - name: "环绕到网格对面"
        description: "弹射到网格边界后不停止，而是从对面边界环绕继续，直到所有内容像素放置完毕或回到起点。解题者需要理解环绕逻辑"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "固定距离弹射"
        description: "弹射距离不等于内容像素数量，而由杯形框架的某个几何属性决定(如杯口宽度或杯的高度)。解题者需要先量化杯的几何属性再决定弹射长度"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 20

  - id: D5
    name: "轨迹涂色模式"
    tag: trajectory
    current: "连续单色线段——弹射线为内容像素颜色的连续直线"
    alternatives:
      - name: "间歇式轨迹"
        description: "弹射线不是连续的，而是每隔一个像素留空(如涂-空-涂-空)。解题者需要发现间歇规律并正确生成间隔模式"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 15
      - name: "渐变色轨迹"
        description: "弹射线从内容色渐变为边框色——离尖刺最近的用内容色，最远的用边框色，中间按距离混合(使用调色板中的中间色)。解题者需要识别颜色渐变规律"
        source: color_change_on_bounce
        source_task: 142ca369
        delta_lines: 25
      - name: "周期性颜色循环"
        description: "弹射线使用边框色和内容色交替循环(如边框-内容-边框-内容)。解题者需要发现两色交替规律"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 15
      - name: "长度保持但颜色改变"
        description: "弹射线长度等于内容像素数量，但颜色变为边框色而非内容色。解题者需要注意颜色切换规则"
        source: recolor
        source_task: 7b0280bc
        delta_lines: 10

  - id: D6
    name: "变换操作"
    tag: transform
    current: "erase — 弹射后杯口内的内容像素被擦除(变为背景色)"
    alternatives:
      - name: "内容像素变色保留"
        description: "弹射后杯口内的内容像素不被擦除，而是变为边框色(或另一指定颜色)。输出中杯内仍有可见像素，解题者需要同时追踪弹射和变色两个变换"
        source: recolor
        source_task: 271d71e2
        delta_lines: 10
      - name: "边框也被擦除"
        description: "弹射完成后，整个杯形边框也被擦除，只留下弹射线。输出网格极度简化，解题者需要从输入推断全部信息"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "杯形填充"
        description: "弹射后杯口内部被完全填充为内容色(而非擦除)。解题者需要理解'弹射+填充'的双重变换"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "碰撞变色"
        description: "如果弹射线经过其他杯的边框像素，被击中的边框像素变为弹射线的颜色。引入了杯间交互，解题者需要考虑多杯之间的影响"
        source: collision_detection
        source_task: 409aa875
        delta_lines: 25

  - id: D7
    name: "输出网格尺寸"
    tag: grid_shape
    current: "same_size — 输出网格与输入网格尺寸相同"
    alternatives:
      - name: "紧凑裁剪"
        description: "输出仅保留所有弹射线的紧凑外接矩形区域，去掉空白边缘。解题者需要先完成弹射再确定裁剪范围"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 10
      - name: "仅保留杯内区域"
        description: "输出裁剪为每个杯的外接矩形区域(多杯时纵向/横向拼接)。解题者需要识别裁剪和拼接规则"
        source: crop
        source_task: a6f40cea
        delta_lines: 20
      - name: "扩展网格以容纳全部弹射"
        description: "当弹射线超出网格边界时，不丢弃溢出部分，而是扩展网格尺寸以容纳所有弹射像素。解题者需要推断输出网格需要多大"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 15

  - id: D8
    name: "多步处理顺序"
    tag: multi_step
    current: "ordered_processing — 内容像素逐个移动到尾部堆叠(实际效果等同于一次性放置)"
    alternatives:
      - name: "按距离排序处理多杯"
        description: "多个杯时，按杯到网格中心的距离从近到远依次处理。先处理的杯的弹射线可能成为后续杯的障碍。解题者需要推断处理顺序并预测交互效果"
        source: ordered_processing
        source_task: 1ae2feb7
        delta_lines: 25
      - name: "迭代弹射"
        description: "每个杯不是一次弹射所有内容，而是每轮只弹射一个像素，所有杯轮流弹射，直到所有内容弹射完毕。弹射线可能交错。解题者需要模拟迭代过程"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "链式反应"
        description: "第一个杯弹射后，弹射线如果命中另一个杯的边框，会触发该杯也进行弹射(即使原本不该弹射)。解题者需要追踪连锁触发关系"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 35

  - id: D9
    name: "杯形结构形状"
    tag: src
