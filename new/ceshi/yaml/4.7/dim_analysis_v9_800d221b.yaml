task_id: 800d221b
task_type: transform_in_place
summary: "中心 hub 向外辐射的细路径网络，每条分支按其触碰的种子区主色重新染色，hub 中心像素取与 hub 邻接最多分支的颜色。"

dimensions:
  - id: D1
    name: "分支着色规则（如何从种子推断分支颜色）"
    tag: transform
    current: "每条分支着色为它所触碰的种子区域内部的多数色"
    alternatives:
      - name: "少数色着色（majority→minority 取反）"
        description: "把分支重染为种子内部的少数色而非多数色，需要解题者反向阅读种子内的颜色比例，提高观察粒度。"
        source: inversion
        source_task: null
        delta_lines: 4
      - name: "按触碰像素颜色加权多数票"
        description: "分支颜色 = 与该分支 4-邻接的所有种子像素中出现次数最多的具体颜色（不再先聚合到种子的多数色），让 minority 色也可能赢，解题者必须按邻接计数而非种子整体性质来推理。"
        source: majority_color
        source_task: null
        delta_lines: 12
      - name: "按种子边框内圈第一行/第一列颜色继承"
        description: "分支不取多数色而取种子边框相邻一圈内最靠近接入点的那个像素颜色（局部继承），强调几何接触位置。"
        source: creative
        source_task: null
        delta_lines: 18
      - name: "颜色互换继承（A↔B swap）"
        description: "分支取与种子 majority 互补/相反色（A↔B 互换），解题者必须先识别两种子色再做 swap。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 6
      - name: "按种子区面积排序映射颜色"
        description: "为所有种子按面积排名，分支颜色按其所连种子的面积排名映射到固定调色板（最大→红、次大→蓝……），将颜色推理与几何尺寸耦合。"
        source: creative
        source_task: null
        delta_lines: 22

  - id: D2
    name: "Hub 中心像素的着色规则"
    tag: transform
    current: "hub 中心被涂为与 hub 邻接最多的分支的颜色"
    alternatives:
      - name: "hub 中心取最少触碰颜色"
        description: "取与 hub 邻接最少的分支颜色（仍要求至少存在一条），解题者必须比较各方向计数后挑最小者。"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "hub 整体重染（不只是中心）"
        description: "整块 3x3 hub 全部重染为最常见邻接颜色，使 hub 不再保留 P 颜色，外观差别更显著。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "hub 中心保留为 P，外环按方向继承"
        description: "中心保留 P，hub 外环每个像素按其紧邻方向的分支颜色继承（无邻接者保持 P），将 hub 变为方向编码盘。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "hub 中心为所有分支颜色的 XOR/缺失色"
        description: "若分支用到 N-1 种调色板中的颜色，hub 中心填那个未被任何分支使用的颜色，把 hub 变为 odd-one-out 推理。"
        source: creative
        source_task: null
        delta_lines: 12

  - id: D3
    name: "种子区结构（src 中种子的几何形态）"
    tag: src
    current: "矩形种子区，内部为 majority/minority 两色混合，外缘除贴网格边外有 1 像素 P 边框"
    alternatives:
      - name: "圆点/单色种子（minority 像素移除）"
        description: "种子内部仅含 majority 单色，无 minority 干扰，弱化颜色比例推理但强化分支与种子的几何配对（更易但可作为视觉对照）。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "L 形 / 十字形种子区"
        description: "把矩形种子换成 L 形或十字非凸形状，挑战者需要识别非矩形连通分量并仍正确做 majority 计数。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "种子内部包含洞（hollow seed）"
        description: "种子内部留 1-2 个 bg 像素的洞，majority/minority 仍按非空像素计算；测试 hole vs interior 的区分。"
        source: hole_fill
        source_task: 3a25b0d8
        delta_lines: 14
      - name: "三色混合种子（A/B/C）"
        description: "每个种子内部含 3 种颜色而非 2 种，分支取严格多数；若三色平均则该分支保持 P（异常处理）。"
        source: creative
        source_task: null
        delta_lines: 16

  - id: D4
    name: "Hub 形状/位置"
    tag: src
    current: "3x3 实心方形 hub，置于网格中部三分之一区域"
    alternatives:
      - name: "可变尺寸 hub（2x2~5x5）"
        description: "hub 由 spec 中固定 3x3 改为 2x2 到 5x5 中随机，center 取几何中心（偶数边长则取四像素均值的代表）。考验解题者动态确定 hub 尺寸。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "圆形/十字形 hub"
        description: "把方形 hub 换成 +字或菱形 hub（最大全 P 连通最密集块），solver 需以 \"度=4 的 P 像素聚类\" 重新识别 hub。"
        source: creative
        source_task: null
        delta_lines: 28
      - name: "Hub 偏置至角落"
        description: "hub 放置在网格角落而非中心；几何不对称强化分支方向多样性。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "无显式 hub（多端点路径）"
        description: "完全去掉 hub，路径从一个种子直接延伸到另一个种子；分支着色取两端种子混合策略（如 majority(A)+majority(B) 的某种规则），转为对偶映射任务。"
        source: inversion
        source_task: null
        delta_lines: 35

  - id: D5
    name: "路径几何（branch 的形态）"
    tag: src
    current: "1 像素宽简单链，0-6 个 L 弯，无分叉无 T 字"
    alternatives:
      - name: "允许分叉（树形分支）"
        description: "允许 T-junction，使一条干路从 hub 出发分裂到多个种子；分支着色规则需扩展为按子树各自连接的种子来分别上色。"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "粗路径（2 像素宽）"
        description: "把路径加粗为 2 像素宽走廊，hub 仍保持 3x3；solver 需放宽细路径判定。"
        source: inversion
        source_task: null
        delta_lines: 12
      - name: "对角路径"
        description: "允许路径以 45° 走对角线，分支与种子邻接判定改为 8-邻接；改变路径形态而保留着色逻辑。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "路径中嵌入障碍像素"
        description: "在分支中段放置 1 个非 P 干扰像素（非 bg、非种子色），染色时需跳过障碍并保持其颜色不变；测试解题者识别 noise pixel 的能力。"
        source: creative
        source_task: null
        delta_lines: 18

  - id: D6
    name: "分支与种子的连接基数（src→dst 关系）"
    tag: meta
    current: "1 个种子可连接 1-3 条独立分支，每条分支只触碰 1 个种子"
    alternatives:
      - name: "严格 1:1（每个种子恰好 1 条分支）"
        description: "禁止多重连接，结构更简洁，反向方向；解题者更易识别一一对应关系。"
        source: inversion
        source_task: null
        delta_lines: 6
      - name: "一条分支连接两个种子"
        description: "允许分支两端各自触碰一个不同种子，分支颜色取两端种子 majority 的混合或 \"先到达者胜\"，引入路径方向语义。"
        source: creative
        source_task: null
        delta_lines: 22
      - name: "种子触碰数决定染色权重"
        description: "若一条分支触碰多个种子，按触碰像素数加权决定分支主色（解决并列时按种子 id 顺序），转化为 weighted vote。"
        source: creative
        source_task: null
        delta_lines: 14

  - id: D7
    name: "网格输出形状"
    tag: grid_shape
    current: "原地变换，输出与输入同形状"
    alternatives:
      - name: "tight crop 到 hub+分支外接矩形"
        description: "输出仅保留 hub 加所有分支的 bbox，去掉外围多余 bg 与种子，类似 bf45cf4b 的 tight crop。"
        source: tight_crop
        source_task: bf45cf4b
        delta_lines: 8
      - name: "扩展画布显示 hub 中心放大"
        description: "在原图上方/下方拼接一行展示 hub 中心被选定颜色的 1x3 条带，作为符号化输出说明。"
        source: creative
        source_task: null
        delta_lines: 16
      - name: "仅输出 hub 区域"
        description: "输出只裁剪到 hub 的 3x3，让结果只显示中心着色后的 hub；测试 \"全局推理→局部输出\"。"
        source: crop
        source_task: a251c730
        delta_lines: 6

  - id: D8
    name: "多步序列化（multi_step）"
    tag: multi_step
    current: "单步原地着色（先所有分支后 hub 中心）"
    alternatives:
      - name: "按种子面积顺序顺次染色，后染覆盖先染"
        description: "若多条分支因 D6 出现冲突，先处理面积最大的种子，后处理者覆盖；引入处理顺序的语义。"
        source: multi_step
        source_task: 1ae2feb7
        delta_lines: 12
      - name: "迭代传播（BFS 渐进着色）"
        description: "颜色从种子出发以 BFS 一圈一圈向 hub 染色，每圈染色后再向下一圈传播，最后到达 hub 中心；提供 \"潮水扩散\"的视觉。"
        source: seed_propagation
        source_task: null
        delta_lines: 28
      - name: "两阶段：先识别 hub，再分支着色"
        description: "Step1 先把 hub 整体重染为 majority of all seeds 的色，Step2 才染分支；hub 颜色变成第一步可见的视觉地标。"
        source: multi_step
        source_task: null
        delta_lines: 10

  - id: D9
    name: "符号编码参数（symbol_instructions）"
    tag: symbol_instructions
    current: "无显式符号 legend；着色规则隐含在邻接关系"
    alternatives:
      - name: "Legend 调色板覆盖默认配色"
        description: "在网格角落放置 1xN 调色板：第 i 个种子染色不再用其内部 majority，而是按种子 id 索引 legend；形成显式映射推理。"
        source: symbol_instructions
        source_task: dbff022c
        delta_lines: 22
      - name: "种子内 minority 像素位置编码方向"
        description: "minority 像素位于种子内部的位置（top/bot/left/right）作为 \"目标颜色信号\"，决定该分支被染为某个 legend 色；视觉上是细粒度位置编码。"
        source: creative
        source_task: null
        delta_lines: 24
      - name: "Hub 周围一圈 P 像素中藏入 1 个特殊色作为指令"
        description: "hub 边一圈中夹一个非 P 控制像素，其颜色规定 hub 中心最终染色（覆盖 majority 邻接计数）。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 14

  - id: D10
    name: "种子区与网格边的关系"
    tag: meta
    current: "每个种子都至少触碰 1 条网格边"
    alternatives:
      - name: "种子全部漂浮在内部"
        description: "禁止种子触碰边界，种子被完整 1px P 边框包裹，分支需穿过更长走廊；空间布局更紧凑且对称。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "种子必须占据角落"
        description: "限定每个种子贴 2 个相邻网格边（角落种子），强化对称性。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "混合：部分种子贴边，部分漂浮"
        description: "随机 50/50；对漂浮种子要求完整 P 边框，对贴边种子保持现状；解题者需要适应两类种子。"
        source: creative
        source_task: null
        delta_lines: 12

  - id: D11
    name: "颜色多样性（调色板规模）"
    tag: meta
    current: "4 色：bg / P / seed_A / seed_B（种子内固定 2 色混合）"
    alternatives:
      - name: "每个种子拥有独立的 majority/minority 色对"
        description: "调色板放宽为 1 个 bg + 1 个 P + 每个种子 2 色，共 2 + 2N 色；分支按种子的独立 majority 染色，颜色更丰富。"
        source: creative
        source_task: null
        delta_lines: 14
      - name: "全局只用 3 色（minority = bg）"
        description: "种子内 minority 改为 bg 色，看上去种子内部有空洞；majority 仍主导着色，视觉上更稀疏。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "P 与 majority 同色（隐藏路径）"
        description: "路径色 P 与某种子 majority 相同，解题者必须先按几何（细线 vs 矩形块）拆分两者；增加视觉混淆挑战。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D12
    name: "并列消歧规则（tiebreak）"
    tag: meta
    current: "majority 取 Counter.most_common(1)，并列时按 Counter 内部顺序（不显式定义）"
    alternatives:
      - name: "并列时分支保持 P 不染色"
        description: "若分支触碰的两个种子 count 相等，则不染色保留 P；解题者必须显式识别并列情况。"
        source: creative
        source_task: null
        delta_lines: 6
      - name: "并列时按种子 id（出现顺序/位置）取上方/左方种子"
        description: "并列时按种子 bbox 的 (row, col) 字典序取最早的；引入空间字典序作为消歧。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "并列时混合两色（棋盘格交替）"
        description: "分支并列时按 (r+c) 奇偶交替染两色，形成视觉条纹。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D13
    name: "种子边框去留"
    tag: transform
    current: "种子的 1px P 边框与分支一起被重染为种子 majority"
    alternatives:
      - name: "保留 P 边框不染色"
        description: "只染分支，种子边框保持 P；视觉上形成 \"染色长尾 + 黑框种子\" 对比。"
        source: inversion
        source_task: null
        delta_lines: 4
      - name: "边框按相邻分支颜色染"
        description: "种子边框每段按其相邻分支颜色继承（不一定是该种子 majority），可能让边框出现多色拼接。"
        source: creative
        source_task: null
        delta_lines: 18
      - name: "边框被擦除为 bg"
        description: "种子边框 P 直接擦成 bg，让种子内部裸露；外观更简洁。"
        source: erase
        source_task: 71e489b6
        delta_lines: 6
