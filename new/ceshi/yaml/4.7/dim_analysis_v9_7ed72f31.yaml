task_id: 7ed72f31
task_type: transform_in_place
summary: "红色 marker 定义反射轴或反射中心，将彩色 sprite 的 payload 半边镜像/点反射后画到背景上"

dimensions:
  - id: D1
    name: "变换类型（镜像 vs 其他几何变换）"
    tag: transform
    current: "沿红色轴镜像反射 / 围绕单红点的点反射"
    alternatives:
      - name: "围绕红色轴旋转 90°"
        description: "对于 row 红线，把 payload 绕红线中点顺时针旋转 90°（或扩成绕红线某点的旋转），把红线本身改为'指示旋转方向'的 marker。视觉上 payload 不再是镜像而是侧倒，需要解题者识别旋转中心而非反射轴，推理路径完全不同。"
        source: rotation
        source_task: 2b83f449
        delta_lines: 25
      - name: "沿红色轴平移复制（不翻转）"
        description: "把 payload 不做镜像、整体平移到红线另一侧（保持原朝向），相当于复制粘贴。视觉差异很明显：解题者要分辨'镜像'vs'平移'，迫使其检验对称性而非默认 mirror。"
        source: inversion
        source_task: null
        delta_lines: 18
      - name: "沿红色轴做颜色互换的反射（点反射时取补色组）"
        description: "镜像几何不变，但反射后的像素改为另一种与原色形成固定配对的颜色（如 payload 颜色 c1 反射成 c2，由全局色对决定）。考验颜色映射推理。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 22
      - name: "沿红色轴做滑移反射 (glide reflection)"
        description: "在普通镜像基础上再沿红线方向偏移 1 格，形成滑移反射。视觉上看似镜像但坐标错位，迫使解题者发现该额外偏移。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "用红色轴做缩放（payload 反射后再缩 0.5x 或扩 2x）"
        description: "反射半边的 payload 在尺寸上发生变化（按红线长度比例放缩），增加几何推理难度。"
        source: scaling
        source_task: b10624e5
        delta_lines: 30

  - id: D2
    name: "Marker 形状语义（线/点之外的扩展）"
    tag: src
    current: "红色直线（行/列）= 轴反射；单红点 = 点反射；区分 embedded vs isolated"
    alternatives:
      - name: "新增对角红线作为反射轴"
        description: "允许 marker 是 45° 对角红色线段，对应沿对角的镜像（转置式反射）。增加方向枚举从 2 种扩到 4 种，考验解题者识别非轴对齐的对称。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "红色 L 形拐角作为旋转中心"
        description: "L 形红色 marker 的拐点作为 90° 旋转中心，L 的两臂方向暗示旋转角度（90°/180°/270°）。同时引入符号编码与几何约束。"
        source: anchor_rotation
        source_task: 7b3084d4
        delta_lines: 40
      - name: "红色 2x1 短杆替代单红点"
        description: "将'单红点点反射'换成'红色 2x1 短杆为反射中心'，反射时以杆的几何中心（半整数坐标）为中心。考验解题者识别非整数中心的反射几何。"
        source: inversion
        source_task: null
        delta_lines: 18

  - id: D3
    name: "Marker 与 payload 的连接关系"
    tag: src
    current: "embedded: 红线 4-连通到 payload；isolated: 红点 8-邻域内有 payload 但 4 不相邻"
    alternatives:
      - name: "全部 marker 都是 isolated（远离 payload）"
        description: "去掉 embedded 类型，所有红色 marker 都是远离 payload 的孤立像素，反射对象通过最近 payload 推断。增加'匹配关系'的搜索难度。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "红色 marker 与 payload 距离编码反射倍数"
        description: "红点距离 payload bbox 越远，对应反射后位移倍数越大（距离=1 一倍反射，距离=2 两倍反射形成多重镜像）。引入数值编码。"
        source: size_encoded_parameter
        source_task: 6ffbe589
        delta_lines: 30
      - name: "red marker 必须正好穿过 payload 内部（非边缘）"
        description: "embedded 红线不再贴 payload 一侧而是从中央穿过，payload 在两侧已部分显现，解题者要补全缺失的对称半。"
        source: symmetry_repair
        source_task: 8e5c0c38
        delta_lines: 18

  - id: D4
    name: "Marker 颜色（语义控制色）"
    tag: symbol_instructions
    current: "marker 永远是红色 (2)；payload 颜色为非 bg 非红"
    alternatives:
      - name: "marker 颜色由 payload 色数决定（多色 marker）"
        description: "marker 不固定为红，而是每条 marker 用一种独特颜色，且该颜色对应一种反射策略（如蓝=水平反射，绿=垂直反射，橙=点反射）。引入符号-策略映射。"
        source: symbol_instructions
        source_task: e87109e9
        delta_lines: 28
      - name: "marker 颜色等于 payload 颜色"
        description: "marker 不再是固定红，而是 payload 颜色本身的'高亮'变体（视觉上需要解题者通过几何形状而非颜色识别 marker）。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "两种 marker 颜色：一种触发反射，另一种触发删除"
        description: "红色 marker 触发镜像反射，新增另一颜色 marker（如蓝色）触发删除被它指向的 payload。引入'condition based action'分歧。"
        source: conditional_deletion
        source_task: 8b9c3697
        delta_lines: 35

  - id: D5
    name: "反射对象选择（哪些 payload 被反射）"
    tag: src
    current: "每条 marker 对其紧邻 payload 反射；isolated 红点反射所有 8-邻接颜色组件"
    alternatives:
      - name: "isolated 红点反射所有同色组件（不仅 8-邻接）"
        description: "从'仅 8-邻域'扩展到'整网格内任何与红点 8-邻居颜色相同的连通分量都被点反射'。增加全局推理。"
        source: seed_propagation
        source_task: 800d221b
        delta_lines: 20
      - name: "marker 仅反射特定颜色的 payload（颜色筛选）"
        description: "若一个 marker 8-邻域内有多个 payload，只反射颜色与某全局规则匹配的（如最少色或最多色）。考验排序/计数推理。"
        source: majority_color
        source_task: 800d221b
        delta_lines: 25
      - name: "反射时仅保留 payload 的边缘像素"
        description: "镜像后的 payload 半只保留外轮廓（去掉内部填充），形成空心镜像，与原实心 payload 形成对比。"
        source: creative
        source_task: null
        delta_lines: 18

  - id: D6
    name: "原 payload 是否保留"
    tag: transform
    current: "原 payload 与红色 marker 都保留，仅在 bg 上添加镜像像素"
    alternatives:
      - name: "原 payload 在反射后被擦除"
        description: "反射完成后原 payload 半被擦回 bg，仅保留 marker + 镜像。视觉上'移动'而非'添加'，迫使解题者验证'迁移'语义。"
        source: erase
        source_task: 71e489b6
        delta_lines: 12
      - name: "红 marker 在输出中被替换为 bg"
        description: "执行反射后红色像素全部消失，留下纯净的对称图案。考验解题者识别 marker 仅作辅助而非最终内容。"
        source: deletion
        source_task: 7b80bb43
        delta_lines: 8
      - name: "原 payload 与镜像同时被重新着色"
        description: "反射时整个 sprite（原+镜像）颜色变换为另一指定色（如 bg 之外的 darker tone），marker 也同步换色。"
        source: recolor
        source_task: 2b83f449
        delta_lines: 18

  - id: D7
    name: "迭代/链式反射"
    tag: multi_step
    current: "每个 marker 独立执行一次反射，相互无干涉"
    alternatives:
      - name: "迭代反射：镜像后的 payload 再触发下一次反射"
        description: "若反射后产生的镜像 payload 仍与某 marker 相邻，则继续触发该 marker 的反射，直到稳定。形成多步级联，类似'反射波传播'。"
        source: multi_step
        source_task: 142ca369
        delta_lines: 35
      - name: "按 marker 大小有序处理且后处理可覆盖前者"
        description: "marker 处理顺序由其线段长度决定（长→短），后处理者的镜像可覆盖前者，引入排序/覆盖语义。"
        source: multi_step
        source_task: 1ae2feb7
        delta_lines: 25
      - name: "两级反射：先按红线轴反射一次，再按全图中央轴反射一次"
        description: "组合多步：第一次镜像基于局部 marker，第二次对所有结果做全图反射。复合变换。"
        source: multi_step
        source_task: 2b83f449
        delta_lines: 30

  - id: D8
    name: "网格形状与裁剪"
    tag: grid_shape
    current: "正方形 18-28 边长，原网格不变形"
    alternatives:
      - name: "输出在反射完成后紧密裁剪到所有 payload 外接框"
        description: "输出仅保留所有反射后 sprite 的最小包围框，去掉外围空 bg。考验解题者识别有效区域。"
        source: tight_crop
        source_task: bf45cf4b
        delta_lines: 20
      - name: "输出网格按 marker 数量纵向扩展（每个 marker 一行）"
        description: "原网格保留，每个 marker 在右侧追加一行展示其反射结果，形成'步骤展示式'布局。"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 35
      - name: "矩形（非正方形）网格"
        description: "放宽正方形约束允许长方形网格，迫使生成器与解题者处理 H≠W 的反射边界。"
        source: inversion
        source_task: null
        delta_lines: 8

  - id: D9
    name: "Payload 颜色数量与多色 sprite"
    tag: src
    current: "每个 sprite payload 单色；全图 3-4 种 payload 颜色"
    alternatives:
      - name: "embedded payload 允许多色"
        description: "单条 payload 内允许 2-3 种颜色，反射后保持颜色按位置对应。视觉更复杂，考验颜色保持的反射映射。"
        source: inversion
        source_task: null
        delta_lines: 12
      - name: "反射后 payload 颜色按调色盘循环映射"
        description: "镜像 payload 的颜色按全局给定的颜色循环（c1→c2→c3→c1）替换，结合反射与色变。"
        source: template_lookup
        source_task: 195c6913
        delta_lines: 30
      - name: "全图仅一种 payload 颜色"
        description: "所有 payload 共享同一颜色（含 isolated），视觉对比度更弱，解题者必须依赖几何而非颜色区分对象。"
        source: inversion
        source_task: null
        delta_lines: 8

  - id: D10
    name: "Marker 数量与密度"
    tag: meta
    current: "每图 3-7 个 marker（embedded 1-4，isolated 0-4）"
    alternatives:
      - name: "每图仅 1 个 marker（极少 marker）"
        description: "每图只有一条 marker 与一段 payload，视觉极简，焦点集中在反射机制本身的识别。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "每图 marker 数量 ≥ 8（极密集）"
        description: "把 marker 总数下限提到 8，bg 占比放宽到 70%。考验解题者在密集场景下识别局部反射对应。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "marker 数量编码 payload 颜色数"
        description: "marker 总数 = palette 色数，建立 marker 计数与颜色集合的语义联系，鼓励解题者计数。"
        source: counting
        source_task: 8f215267
        delta_lines: 18

  - id: D11
    name: "反射半边的越界处理"
    tag: meta
    current: "所有反射必须在网格内且落在 bg 上（拒采样保证）"
    alternatives:
      - name: "反射越出网格的部分被裁剪掉"
        description: "允许反射超出网格边界，超出部分自然丢弃。生成器无需保证整体落入网格，输出会出现'半个'对称像。"
        source: clipping
        source_task: 581f7754
        delta_lines: 12
      - name: "反射越界时 wrap 到对侧（环面拓扑）"
        description: "网格按环面拓扑对接，反射越界的像素绕到对侧。引入非欧几何感觉，需推理 wrap 规律。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "反射撞到非 bg 像素时停在第一个非 bg 处"
        description: "反射的 payload 若落在已有非 bg 像素上，从该位置截断（payload 边缘碰撞）。引入碰撞语义。"
        source: collision_detection
        source_task: 409aa875
        delta_lines: 22

  - id: D12
    name: "干扰项 / 假 marker"
    tag: meta
    current: "无干扰：所有红 marker 都是有效反射触发器"
    alternatives:
      - name: "添加红色干扰像素（不触发反射）"
        description: "在网格内额外加入若干红色像素，但它们既无邻接 payload 也不是合法 marker，必须被解题者忽略。考验合法 marker 识别。"
        source: creative
        source_task: null
        delta_lines: 18
      - name: "添加镜像形 payload 但无 marker"
        description: "网格内放置已对称的 payload，没有红 marker，不应被改动。考验'仅在有 marker 时才动作'的原则。"
        source: keep_source
        source_task: 53fb4810
        delta_lines: 12
      - name: "干扰红线长度不足以覆盖 payload"
        description: "添加比 payload 短的红线（不满足 spec 的'红线跨越 payload 全长'），这些应被识别为非法 marker 而忽略。"
        source: creative
        source_task: null
        delta_lines: 15
