task_id: a25697e4
task_type: move_to_match
summary: "将场内的双色工具旋转/翻转后对接到边界框架的阶梯状凹槽中，凹槽大小决定工具-框架配对，若对接使用反射则交换工具两色。"

dimensions:
  - id: D1
    name: "匹配条件（src 与 dst 如何配对）"
    tag: match_cond
    current: "工具的某个色块像素数 == 框架凹槽尺寸；同时形状在 D4 群下与凹槽吻合（形状匹配 + 旋转/翻转）"
    alternatives:
      - name: "颜色直接匹配"
        description: "改为按颜色配对：工具 plug 区域颜色与框架某像素颜色相同才能对接，凹槽尺寸不再决定配对，而由颜色查找表决定。视觉上颜色对应非常直观，推理重点从尺寸数数变为颜色追踪。"
        source: color_match
        source_task: "2c181942"
        delta_lines: 30
      - name: "凹槽内孔洞数量匹配"
        description: "凹槽内可能含若干孤立 bg 小洞，工具的 plug 颜色块数（连通分量个数）必须等于框架凹槽中孔洞个数才能配对，强调连通分量计数推理。"
        source: hole_counting
        source_task: "8698868d"
        delta_lines: 35
      - name: "尺寸序匹配（最大配最大）"
        description: "按工具与框架的尺寸排序对应：最大的工具配最大凹槽框架，依次类推，不再依赖凹槽精确等于色块数。引入有序对应推理。"
        source: size_ordering
        source_task: "31f7f899"
        delta_lines: 25
      - name: "边缘颜色序列匹配"
        description: "工具凸出端的颜色序列必须与框架开口边缘颜色序列一致才能对接，强调线性颜色比对而非纯尺寸。"
        source: edge_matching
        source_task: "7b3084d4"
        delta_lines: 35
      - name: "禁止反射（仅旋转）"
        description: "对接只允许 4 种旋转，禁止翻转。难度降低但需要仔细判断是否能旋转适配，色交换规则也随之消失或仅由旋转触发。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D2
    name: "源对象（src 的形态）"
    tag: src
    current: "场内不接触边界的单连通双色组件（plug 颜色 + handle 颜色）"
    alternatives:
      - name: "三色工具（plug + handle + 头部标记）"
        description: "工具加入第三种颜色作为方向/取向指示像素，必须根据该指示像素确定 plug 朝向再对接，加大解码难度。"
        source: marker_axis
        source_task: "7ed72f31"
        delta_lines: 40
      - name: "工具被分割成多块（需先重组）"
        description: "工具拆成两个相邻的色块，分别散落，对接前先把两块合并得到完整 plug+handle，再去寻找凹槽。多步推理。"
        source: hub_and_branch
        source_task: "800d221b"
        delta_lines: 50
      - name: "工具为空心环"
        description: "工具改为空心闭环，plug 由环内孔洞形状决定而非实心色块；推理者需先识别孔洞形状。"
        source: hollow_frames
        source_task: "4c416de3"
        delta_lines: 45
      - name: "src 与 dst 角色互换"
        description: "把工具固定在边界、框架变成可移动小件——需将带凹槽的小框架去包住边界上的固定凸形。视角反转。"
        source: inversion
        source_task: null
        delta_lines: 50

  - id: D3
    name: "目的地（dst 的形态）"
    tag: dst
    current: "贴在网格某条边的 2 段同色框架（中间空 1 行/列），有阶梯凹槽形成的腔体"
    alternatives:
      - name: "拼图整体装配（多个框架在内部）"
        description: "框架不再贴边而是分布在网格内形成多孔大模板，工具填入对应孔位形成完整图案。从单点对接变为整体拼图。"
        source: jigsaw_assembly
        source_task: "8698868d"
        delta_lines: 45
      - name: "矩形空腔（无阶梯）"
        description: "凹槽改为标准矩形空腔，移除阶梯特征。视觉简洁但匹配条件需以面积+长宽为主，旋转判定更直接。"
        source: cavity_fill
        source_task: "5dbc8537"
        delta_lines: 25
      - name: "框架完全闭合带单孔"
        description: "框架变成闭合矩形外框，仅在某一处留一个洞（如开口在内部一格），工具必须从该洞滑入填合内部空腔。"
        source: hole_filling
        source_task: "898e7135"
        delta_lines: 35
      - name: "中心十字凹槽（不贴边）"
        description: "框架移到网格中心区域，凹槽从十字方向打开（4 个不同方向凹槽）。需要根据 plug 走向判断从哪个方向插入。"
        source: inversion
        source_task: null
        delta_lines: 40

  - id: D4
    name: "对接后的变换"
    tag: transform
    current: "若对接需要翻转且工具两色色块数不等，则交换两色；否则颜色保持"
    alternatives:
      - name: "对接后整体重涂为框架色"
        description: "工具对接成功后，整体重涂为目标框架颜色，淡化原色信息——强调形状-位置而非颜色身份。"
        source: recolor
        source_task: "20270e3b"
        delta_lines: 15
      - name: "对接后擦除工具（仅留框架）"
        description: "工具对接后从输出中删除，只保留框架。突出测试是否能找到唯一吻合方位的判定。"
        source: erase
        source_task: "58f5dbd5"
        delta_lines: 12
      - name: "条件旋转后再对接"
        description: "当 plug 对应的方向与某基准（如最长 handle 边）垂直时执行 90° 旋转后再放置，加入条件性几何变换。"
        source: conditional_rotation
        source_task: "291dc1e1"
        delta_lines: 30
      - name: "颜色继承（plug 取框架色，handle 取 bg 反色）"
        description: "对接时 plug 颜色被替换为框架颜色，handle 改为某固定继承色，推理者需追踪两种颜色的来源链。"
        source: color_transfer
        source_task: "4c416de3"
        delta_lines: 20
      - name: "翻转旋转都不交换颜色（取反）"
        description: "彻底关闭颜色交换规则——任何对接都保持原色。"
        source: inversion
        source_task: null
        delta_lines: 8

  - id: D5
    name: "轨迹（工具如何被移除/留下痕迹）"
    tag: trajectory
    current: "工具从原位置完全消失（默认）"
    alternatives:
      - name: "保留原位置工具（同时显示原位与对接位）"
        description: "输出同时保留工具的原始位置与对接位置——出现两个工具，强调复制-粘贴而非移动。"
        source: keep_source
        source_task: "247ef758"
        delta_lines: 10
      - name: "沿移动路径绘制轨迹"
        description: "在工具从原位置到对接位置的最短路径上画出连续轨迹（用 plug 颜色），形成可视的运动迹线。"
        source: continuous_trail
        source_task: "8b9c3697"
        delta_lines: 35
      - name: "原位置只保留 handle，仅 plug 移动"
        description: "工具拆开移动：只 plug 飞到框架对接，handle 留在原地，强调对象解耦推理。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D6
    name: "输出网格塑形"
    tag: grid_shape
    current: "保持输入相同尺寸的网格"
    alternatives:
      - name: "紧凑裁剪到对接结果"
        description: "输出仅保留所有框架与对接工具的最小外接矩形，去除冗余背景。"
        source: tight_crop
        source_task: "20270e3b"
        delta_lines: 15
      - name: "按对数分布的多块网格"
        description: "输出为多个紧凑块的拼接网格（每对框架-工具占一个独立子格），适合多对场景。"
        source: packed_grid
        source_task: "58f5dbd5"
        delta_lines: 35
      - name: "网格扩张以容纳超出 handle"
        description: "若 handle 超出原边界，则扩张网格以包含完整 handle，避免裁切。"
        source: grid_expand
        source_task: "20270e3b"
        delta_lines: 20

  - id: D7
    name: "多步序列与基数"
    tag: multi_step
    current: "1-2 对工具与框架，平行处理（可独立配对）"
    alternatives:
      - name: "many:1 多工具对单框架（链式堆叠）"
        description: "多个工具按尺寸或颜色顺序依次对接到同一个框架的多个凹槽（如阶梯有多级），形成嵌套对接序列。"
        source: chaining
        source_task: "78332cb0"
        delta_lines: 50
      - name: "迭代对接直到所有凹槽填满"
        description: "每对接一次后框架可能露出新凹槽（剩余 bg 仍连通），重复直到没有 bg 凹槽，类似挤压拼图过程。"
        source: multi_step
        source_task: "16b78196"
        delta_lines: 60
      - name: "1:many 单工具切分填多个框架"
        description: "工具的不同色块分别对接到不同框架（plug 进 frame A，handle 进 frame B），需将单个工具切分。"
        source: creative
        source_task: null
        delta_lines: 50

  - id: D8
    name: "符号编码参数"
    tag: symbol_instructions
    current: "无显式符号；规则纯几何（凹槽大小+反射触发交换）"
    alternatives:
      - name: "图例指明对接方向"
        description: "在网格角落引入小图例（颜色对照表），规定每种 plug 颜色应该对接到哪种颜色的框架，覆盖默认尺寸匹配规则。"
        source: legend_lookup
        source_task: "58490d8a"
        delta_lines: 40
      - name: "控制像素决定是否交换颜色"
        description: "在网格内放置一个特殊像素（如红点）作为开关：有则启用色交换规则，无则禁用，使规则被显式参数化。"
        source: control_pixels
        source_task: "4a21e3da"
        delta_lines: 25
      - name: "标记像素指示工具旋转方向"
        description: "工具内部含一个标记像素（如灰色），其位置编码工具应旋转到哪个方向后再对接，让 D4 选择由符号决定。"
        source: marker_pixels
        source_task: "9aaea919"
        delta_lines: 35

  - id: D9
    name: "凹槽形状（结构性几何）"
    tag: meta
    current: "上三角阶梯型凹槽（1-3 格阶梯），位于框架角"
    alternatives:
      - name: "弧形/对角凹槽"
        description: "凹槽改为对角线（45° 斜切）或弧形阶梯，要求工具具有镜像对角对称才能匹配。"
        source: diagonal_symmetry
        source_task: "4c416de3"
        delta_lines: 30
      - name: "凸起而非凹陷（凸点对接孔）"
        description: "把框架的凹改为凸：框架带一个凸起，工具有对应凹槽，反向对接。完全反转 plug/dst 关系。"
        source: inversion
        source_task: null
        delta_lines: 40
      - name: "随机不规则凹槽"
        description: "凹槽不再是阶梯，而是任意 5-8 像素的连通形状；工具 plug 必须严格匹配该形状（含旋转翻转）。增加形状识别难度。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D10
    name: "工具放置位置约束（src 空间关系）"
    tag: meta
    current: "工具放置远离目标框架（>=4 曼哈顿距离），不接触边界"
    alternatives:
      - name: "工具紧邻其它干扰框架"
        description: "工具被故意放在错误框架附近，距离不再是配对线索，必须严格依靠匹配条件（凹槽尺寸）选择正确目标。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "工具沿网格中心列排列"
        description: "所有工具在同一垂直中线上排成纵列，强制空间次序，配对依赖序号。"
        source: column_alignment
        source_task: "4c3d4a41"
        delta_lines: 25
      - name: "工具贴边但不构成框架"
        description: "工具也可以贴边（与框架同侧），但用单连通+双色判断使其与框架区分；解题者需从结构而非位置判断角色。"
        source: inversion
        source_task: null
        delta_lines: 20

  - id: D11
    name: "颜色策略（视觉调色）"
    tag: meta
    current: "每对框架 1 色 + 工具 plug/handle 2 色（共 3 色），多对可共享框架色"
    alternatives:
      - name: "全部框架同色，工具用不同颜色区分对应关系"
        description: "所有框架共用同一颜色（如灰），但工具有不同颜色，每色对应一个特定凹槽尺寸的框架。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "工具单色（plug 与 handle 同色，但通过形状分区）"
        description: "工具变为单色，plug 与 handle 用形状分隔（如细颈或对角分割），减少颜色信息让推理依赖纯几何。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "颜色多对一（多种颜色 plug 对应同一框架）"
        description: "多个工具用不同颜色但共享同一框架，对接后输出按特定调色板覆盖；增加颜色映射推理。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D12
    name: "色交换触发条件"
    tag: meta
    current: "对接使用反射 (flip) 且工具两色块大小不等 → 交换"
    alternatives:
      - name: "旋转 180° 触发交换（而非反射）"
        description: "把交换触发条件改为旋转 180°，反射不交换。视觉上看不出差别但推理逻辑完全不同。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "凹槽尺寸为奇数才交换"
        description: "把对称性条件替换为数值条件：当凹槽尺寸为奇数（如 5, 7）时交换颜色，凸显数值-视觉混合规则。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "永远交换（无条件）"
        description: "每次对接都进行颜色交换，使输出更具有视觉冲击但需要识别 plug/handle 角色才能理解原工具配色。"
        source: inversion
        source_task: null
        delta_lines: 8
