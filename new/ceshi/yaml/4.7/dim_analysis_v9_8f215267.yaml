task_id: 8f215267
task_type: move_to_match
summary: "对每个空心矩形框架，统计与其同色的散落精灵数量，并在框架中行从右向左以间隔 2 绘制相应数量的同色点作为计数显示。"

dimensions:
  - id: D1
    name: "匹配条件（如何把精灵与框架配对）"
    tag: match_cond
    current: "s.color == d.color（颜色相等）"
    alternatives:
      - name: "形状匹配"
        description: "精灵的形状（外接矩形或像素分布）与框架内的某个形状凹槽/缺口匹配，匹配成功才计数。颜色不再是唯一线索，解题者必须比较形状特征，推理难度提升。"
        source: shape_match
        source_task: "16b78196"
        delta_lines: 30
      - name: "尺寸匹配"
        description: "按精灵的像素面积匹配，每个框架带一个由内部小标记表示的目标面积值（如内部一个像素表示 size=3）；只有面积等于该值的精灵被计数。引入数值-视觉对应推理。"
        source: size_match
        source_task: "2c181942"
        delta_lines: 35
      - name: "边框颜色与中心颜色配对"
        description: "精灵改成双色（外圈+中心），框架按精灵的外圈颜色匹配，但内部点用精灵的中心颜色绘制。需要分离两个颜色属性。"
        source: border_color_match
        source_task: "d35bdbdc"
        delta_lines: 25
      - name: "孔洞数量匹配"
        description: "精灵不再单色，而是带不同数量的内部孔洞（连通的背景子区域）；按孔洞数与框架某种特征对应（例如框架按颜色排序后的索引等于孔洞数）。强化拓扑推理。"
        source: hole_counting
        source_task: "8698868d"
        delta_lines: 40

  - id: D2
    name: "源对象（被计数的精灵特征）"
    tag: src
    current: "右侧散落的小型单色精灵（面积 2-8）"
    alternatives:
      - name: "替换为双色锚点精灵"
        description: "精灵由一个明显锚点像素（如灰色）+ 主体组成，主体颜色用来匹配框架，锚点用来标记是否被计数。增加视觉子结构感。"
        source: anchor_points
        source_task: "4c416de3"
        delta_lines: 30
      - name: "替换为对角像素对"
        description: "精灵改为同色对角像素对（一对像素构成矩形对角线）；通过两点张成的矩形面积或方向贡献计数线索。考验空间识别。"
        source: diagonal_markers
        source_task: "9385bd28"
        delta_lines: 35
      - name: "异常单元识别"
        description: "右侧填充重复的 2x2 单色精灵，但其中『异常』单元（颜色或图案不同者）才被计入。强调 odd-one-out 检测。"
        source: anomaly_detection
        source_task: "b99e7126"
        delta_lines: 40
      - name: "精灵增大为多像素带方向标记"
        description: "精灵改为带方向（朝向）的小箭头形状，只有朝向某框架的精灵才被计入；解题者需识别朝向并计数。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D3
    name: "目标对象（接收计数的容器）"
    tag: dst
    current: "竖直堆叠的 5x11 空心矩形框架（左半部分）"
    alternatives:
      - name: "改为水平条形容器"
        description: "把框架改成水平细长条（1 行高），点沿条向左/右堆叠。形状变化使布局判断更具挑战。"
        source: docking
        source_task: "7c66cb00"
        delta_lines: 25
      - name: "改为不规则空心多边形"
        description: "框架不再是矩形，而是 L 形或 T 形空心结构，中心『轴』沿轮廓延伸；点要沿其骨架放置。增加几何识别。"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "改为带凹槽的实心 dock"
        description: "用类似 a25697e4 的 notch dock 替换框架，点改为塞进凹槽内部。视觉风格全变。"
        source: notch_docking
        source_task: "a25697e4"
        delta_lines: 45
      - name: "嵌套框架"
        description: "框架变为同心嵌套（外+内两层），计数同时显示在内层中行。视觉密度增加。"
        source: nested_frames
        source_task: "45a5af55"
        delta_lines: 40

  - id: D4
    name: "变换（如何呈现计数结果）"
    tag: transform
    current: "在框架中行从右向左以间隔 2 画 N 个同色点"
    alternatives:
      - name: "改为按二进制编码计数"
        description: "用框架中行的若干固定槽位的『亮/暗』编码 N（二进制位）。解题者需推理位编码。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "用一条长度为 N 的连续线段表示"
        description: "不画离散点，而是从右端画一条长度=N 的实心线（或 2N 长包含间隔），等价于条形图。"
        source: line_fill
        source_task: "16de56c4"
        delta_lines: 15
      - name: "改为缩放框架尺寸"
        description: "不在框架内画点，而是按 N 缩放/拉长框架本身（高度=基线+N）。视觉对比鲜明。"
        source: scaling
        source_task: "b10624e5"
        delta_lines: 40
      - name: "用框架内堆叠的小方块（柱状）表示计数"
        description: "在框架底行从左向右画 N 个 1x1 同色实心方块，自下而上像柱状图。"
        source: stacking
        source_task: "3dc255db"
        delta_lines: 20
      - name: "对源精灵就地变换而非删除"
        description: "不将精灵抹除，而是把它们重新染色/重排为框架颜色对齐到框架外侧形成『小尾巴』，仍隐含计数。"
        source: keep_source
        source_task: "53fb4810"
        delta_lines: 35

  - id: D5
    name: "源轨迹（精灵在变换后是否保留）"
    tag: trajectory
    current: "默认消失（被设回背景）"
    alternatives:
      - name: "保留源精灵"
        description: "源精灵不被擦除，与框架内点同时存在；解题需注意输出包含两部分。"
        source: keep_source
        source_task: "247ef758"
        delta_lines: 5
      - name: "源精灵移动到框架右侧粘合"
        description: "精灵不消失，而是平移到对应框架的紧邻右侧，沿框架顶/底边粘连，保持计数信息。"
        source: continuous_trail
        source_task: "8b9c3697"
        delta_lines: 30
      - name: "源精灵被替换为路径痕迹"
        description: "用一条从精灵原位到框架的连接线代替消失，每条线表示一次计数贡献，最终颜色被叠加在框架内。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D6
    name: "输出网格形状/裁剪策略"
    tag: grid_shape
    current: "输出与输入同形（23 列，固定结构）"
    alternatives:
      - name: "紧裁到仅含框架"
        description: "输出仅保留框架及其内部点的最小外接区域，去掉右侧空白区；强调『信息浓缩』。"
        source: tight_crop
        source_task: "20270e3b"
        delta_lines: 15
      - name: "按框架打包成密集列"
        description: "输出把框架紧凑垂直堆叠（去掉精灵区与间隙），形成『打包结果』。"
        source: packed_grid
        source_task: "58f5dbd5"
        delta_lines: 25
      - name: "按计数水平展开"
        description: "输出宽度按最大计数动态扩展，使每个框架的点列从右端开始紧贴边缘。"
        source: grid_expand
        source_task: "20270e3b"
        delta_lines: 20

  - id: D7
    name: "多步处理结构"
    tag: multi_step
    current: "单步：扫描-计数-绘点"
    alternatives:
      - name: "迭代消解"
        description: "每一步取一个精灵，将其『流向』对应颜色框架并在内部添加一个点；按固定顺序（如从上到下、按颜色）一次只处理一个。强调可视的逐步性。"
        source: multi_step
        source_task: "247ef758"
        delta_lines: 40
      - name: "链式聚合"
        description: "多个精灵先按颜色合并成一个聚集对象，再统一传输到对应框架展示。两步：聚合+展示。"
        source: multi_step
        source_task: "446ef5d2"
        delta_lines: 45
      - name: "先排序再计数"
        description: "先把右侧精灵按某属性（面积/位置）排序，再依次落入对应框架；顺序影响最终点的位置或颜色。"
        source: multi_step
        source_task: "291dc1e1"
        delta_lines: 50

  - id: D8
    name: "符号编码 / 图例"
    tag: symbol_instructions
    current: "无显式图例；颜色直接配对"
    alternatives:
      - name: "图例定义颜色映射"
        description: "网格一角放置颜色配对图例（如 marker→fill），匹配条件不再是颜色相等而是『精灵颜色映射后等于框架颜色』。"
        source: symbol_instructions
        source_task: "9385bd28"
        delta_lines: 40
      - name: "图例定义计数符号"
        description: "图例规定不同框架的『展示样式』（点/线/块），每个框架按图例查找呈现。引入符号查表推理。"
        source: legend_lookup
        source_task: "58490d8a"
        delta_lines: 35
      - name: "控制像素指定计数方向"
        description: "每个框架旁有一个红色控制像素，标记点从左/右/上/下不同方向开始排列。"
        source: control_pixels
        source_task: "4a21e3da"
        delta_lines: 30

  - id: D9
    name: "干扰项策略"
    tag: meta
    current: "1-2 个不匹配任何框架颜色的干扰精灵"
    alternatives:
      - name: "无干扰项"
        description: "去掉干扰精灵，所有精灵都对应一个框架；解题者必须明确每个精灵都被计数，无需做颜色筛选。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "干扰项也参与但被否决"
        description: "干扰颜色精灵触发『减一』操作（每出现一个就让某个框架计数减少 1）；引入抵消逻辑。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "用形状干扰替代颜色干扰"
        description: "干扰精灵颜色与某框架相同，但形状不符合规则形（例如带孔），需要靠形状先过滤再计数。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D10
    name: "计数上限与溢出处理"
    tag: meta
    current: "每框架最多 4 点（受 9 列内部空间限制）"
    alternatives:
      - name: "计数上限改为 1（存在性指示）"
        description: "只画一个点表示『是否存在同色精灵』，把计数题简化为存在性判断。降低数值难度但保留映射。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "上限提高并允许换行"
        description: "允许 N>4，超出时在下一行（中行+1）继续点；考查溢出与换行逻辑。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "用单像素颜色编码大计数"
        description: "用 N 的二进制位染成不同颜色像素表示，可在固定槽位表达大数。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D11
    name: "源-目标基数关系"
    tag: meta
    current: "many:1（多个精灵 → 一个框架内的多个点）"
    alternatives:
      - name: "1:many（一个精灵复制到多个框架）"
        description: "一个特殊『标记』精灵的颜色集合决定哪些框架被点亮（每个集合元素是一个目标框架颜色），由一个精灵驱动多个框架。"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "1:1（每精灵恰好对应一框架并消耗它）"
        description: "每个精灵唯一选择一个未被消耗的框架（按位置或编号）；不再统计而是匹配。"
        source: inversion
        source_task: null
        delta_lines: 35
      - name: "多对多分组聚合"
        description: "精灵按形状分组、框架按颜色分组，两组按笛卡尔交叉计数后填入。"
        source: pattern_grouping
        source_task: "c7f57c3e"
        delta_lines: 50

  - id: D12
    name: "点的间距/排列规则"
    tag: meta
    current: "从右向左间隔 2 排列于中行"
    alternatives:
      - name: "改为间隔 1（紧密排列）"
        description: "点连续排列形成实心条，更接近条形图样式。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "改为对称居中"
        description: "点以中行中心为对称轴居中放置，考验中点对齐推理。"
        source: centering
        source_task: "58f5dbd5"
        delta_lines: 15
      - name: "沿框架内部环形排列"
        description: "点沿框架内壁（顺时针）依次落位，N 越多越靠近完整内圈。增加路径感。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D13
    name: "框架排列方向"
    tag: meta
    current: "竖直堆叠在左半部分"
    alternatives:
      - name: "水平排列于上半部分"
        description: "框架水平并排，精灵在下方区域散布；点的方向相应改为竖直。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "对角线排列"
        description: "框架沿对角线错位排布；点的方向沿对角向。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "随机但不重叠的散布"
        description: "框架随机分布，精灵填空隙；视觉无规则但匹配仍按颜色。"
        source: creative
        source_task: null
        delta_lines: 30
