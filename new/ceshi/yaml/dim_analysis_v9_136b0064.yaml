        source: creative
        source_task: null
        delta_lines: 15

  - id: D12
    name: "垂直线段的处理——area 4 的特殊行为"
    tag: transform
    current: "area 4 字形（plus形状）生成垂直向下2格的线段，不改变列坐标；其他字形生成水平线段并改变列坐标"
    alternatives:
      - name: "取消垂直线段——所有字形均为水平线段"
        description: "area 4 改为水平线段（如向右2格），折线变为纯水平锯齿路径。简化了路径形态但保留了左右交替的推理核心"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "引入斜线段（45度对角线）"
        description: "某些字形解码为对角线方向的线段（如右下3格或左下3格）。折线从正交路径扩展到包含对角线段，类似 7b80bb43 的 diagonal_hint，视觉形态更丰富"
        source: diagonal_hint
        source_task: "7b80bb43"
