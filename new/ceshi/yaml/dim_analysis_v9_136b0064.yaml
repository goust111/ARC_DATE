        source_task: null
        delta_lines: 20
      - name: "字形排列为3列 x M行"
        description: "tile 网格从2列扩展为3列（使用更宽的左画布），每行3个字形。字形数量变为3的倍数，列主序遍历涉及更多列，增加了空间复杂度"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D10
    name: "折线的边界约束"
    tag: meta
    current: "折线必须始终保持在左画布范围内（列 0..6，行 0..H-1），超出则生成失败"
    alternatives:
      - name: "折线可以环绕（toroidal wrap）"
        description: "折线到达画布边缘时从对面边缘继续（列方向环绕）。类似 88bcf3b4 的 path_wrapping，解题者需理解环绕机制并在视觉上追踪跨边路径"
        source: path_wrapping
        source_task: "88bcf3b4"
        delta_lines: 15
      - name: "折线碰到边界时反弹"
        description: "类似 142ca369 的反射机制，折线到达边界时反方向继续绘制（如向右碰到右边界则变为向左）。解题者需理解反弹规则，路径变得更曲折"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "画布宽度可变——由字形总数决定"
        description: "左画布宽度不固定为7列，而是由字形的总数或面积总和决定（如 num_glyphs + 2）。解题者需先推断画布宽度规则再追踪路径"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "折线碰到边界时截断并从下一行中央重新开始"
        description: "水平线段如果超出画布边界，则在边界处截断，下一段从画布中央列重新开始。解题者需识别截断和重置机制"
        source: creative
        source_task: null
        delta_lines: 15

