task_id: 136b0064
task_type: move_in_order
summary: "将分隔线左侧的3x3字形（glyph）按列主序解码为折线段指令，从右侧灰色起始点出发，在左画布上逐段绘制彩色折线；每个字形的像素面积决定线段的长度和方向"

dimensions:
  - id: D1
    name: "字形处理顺序——排序规则"
    tag: match_cond
    current: "按列主序（先按 tile 列 c0 从左到右，再按 tile 行 r0 从上到下）依次处理字形"
    alternatives:
      - name: "行主序处理（先上到下，再左到右）"
        description: "将列主序改为行主序，即先处理同一行的两个字形（左列再右列），再处理下一行。解题者需从示例中推断出行优先的遍历顺序，改变了空间扫描的推理方向"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "按字形颜色在固定色序中的位置排序"
        description: "字形不按空间位置排序，而是按其颜色在一个从示例中可推断的色序（如 1,2,3,6）中排列。解题者需先识别色序映射关系再确定处理顺序，从空间推理转变为颜色语义推理"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "按字形面积从小到大排序"
        description: "字形按其像素面积升序（4,5,6,7）处理，不再依赖空间位置。类似 62593bfd 的 area_grouping，解题者需计算面积并排序，核心推理从位置读取变为数量比较"
        source: area_grouping
        source_task: "62593bfd"
        delta_lines: 10
      - name: "列主序但从右到左、从下到上"
        description: "保持列主序但反转两个方向：先处理右列再左列，每列内从下到上。解题者需识别出与自然阅读顺序完全相反的遍历模式"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "按字形到灰色起始点的曼哈顿距离排序"
        description: "类似 291dc1e1 的 distance_ordering，字形按其中心到灰色起始点（映射到左画布后）的距离从近到远处理。解题者需计算距离而非简单扫描位置"
        source: distance_ordering
        source_task: "291dc1e1"
        delta_lines: 12

  - id: D2
    name: "字形编码方式——面积到指令的映射"
    tag: transform
    current: "字形像素面积唯一决定线段：area 4→垂直向下2格，area 5→水平向右3格，area 6→水平向左4格，area 7→水平向左2格"
    alternatives:
      - name: "字形形状（而非面积）决定指令——引入同面积不同形状"
        description: "新增多个面积相同但形状不同的字形模板，每种形状对应不同的线段方向和长度。解题者不能简单数像素，而必须识别具体形状才能解码指令，增加视觉模式匹配难度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "面积到方向的映射反转（小面积对应长线段）"
        description: "反转当前映射：area 4→水平向左4格（最长），area 7→垂直向下2格（最短）。解题者需从示例中重新推断映射关系，不能依赖面积与长度的自然正相关直觉"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "字形颜色决定线段方向，面积决定长度"
        description: "拆分编码维度：颜色决定方向（如红=右、绿=左、蓝=下），面积仅决定长度。解题者需同时推断两个独立映射关系，增加了多维度推理的复杂度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "引入向上方向和水平向右的新字形"
        description: "新增 area 8 或 area 3 的字形模板，支持向上移动和更多水平方向选择。折线可以上下左右四方向运动，路径更加复杂多变"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "字形外接矩形内的空洞位置编码方向"
        description: "3x3字形中空洞像素的位置（上方、下方、左侧、右侧）决定线段方向，填充像素数量决定长度。解题者需同时分析正形和负形，类似更复杂的 glyph_decoding"
        source: glyph_decoding
        source_task: null
        delta_lines: 20

  - id: D3
    name: "源对象——字形的视觉形状与结构"
    tag: src
    current: "4种固定的3x3单色字形模板（plus、diamond、cross、U），每种形状严格绑定一种颜色"
    alternatives:
      - name: "字形尺寸扩大为4x4或5x5"
        description: "字形从3x3扩大到更大的外接矩形，可容纳更多不同面积的形状模板，支持更多线段类型（更多方向和长度选择）。解题者需在更大的模式中识别形状差异"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "字形颜色与形状解绑——颜色独立采样"
        description: "字形的颜色不再由形状决定，而是独立选取。折线颜色由字形颜色决定，但线段方向和长度仍由形状决定。解题者需分别推断形状→运动和颜色→涂色两套规则"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "空心框架字形替代实心字形"
        description: "类似 4c416de3 的 hollow_frames，字形由外框构成，内部像素为空。解题者需通过框架形状和边长来推断指令，视觉上更具挑战性"
        source: hollow_frames
        source_task: "4c416de3"
        delta_lines: 20
      - name: "字形使用多色像素——颜色组合编码"
        description: "每个字形由两种颜色组成，一种颜色编码方向，另一种编码长度。解题者需解读双色组合的语义，增加了颜色组合推理的层次"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "目标结构——折线的构建方式"
    tag: dst
    current: "从灰色起始点出发，每处理一个字形先向下移一行，再按指令画水平或垂直线段，形成连续折线"
    alternatives:
      - name: "折线从底部向上生长"
        description: "反转折线方向：灰色起始点在底部，每步向上移一行再画线段。解题者需识别出与向下生长相反的构建方向，改变空间推理的参考方向"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "多条独立折线——每列字形生成一条折线"
        description: "左列字形和右列字形分别生成独立的折线，两条折线在同一画布上共存。从1:1的字形序列到折线关系变为分组构建，增加了分组推理需求"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "折线绘制在右画布而非左画布"
        description: "输出保留右侧区域（移除分隔线和字形），折线在右侧画布上绘制。空间映射关系改变，解题者需理解左右画布角色互换"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "螺旋路径替代折线"
        description: "字形指令不画直线段，而是画螺旋弧线（如每步按顺时针/逆时针转90度继续画）。路径形态从锯齿折线变为螺旋形，视觉效果显著不同"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "堆叠式输出——每个字形对应一层"
        description: "类似 b5ca7ac4 的 stacking，不构建折线，而是将每个字形解码的线段独立输出为一行/一层，在输出网格中从上到下堆叠。从路径构建变为分层排列"
        source: stacking
        source_task: "b5ca7ac4"
        delta_lines: 20

  - id: D5
    name: "字形到折线颜色的映射"
    tag: transform
    current: "折线每段的颜色等于对应字形的颜色（形状→颜色严格绑定：plus→6，diamond→1，cross→3，U→2）"
    alternatives:
      - name: "所有线段统一使用一种颜色"
        description: "折线整体使用单一颜色（如字形中出现频率最高的颜色），不保留分段颜色信息。简化了颜色推理但保留了路径构建的核心逻辑"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "颜色按处理顺序循环使用固定调色板"
        description: "折线的每段颜色不由字形决定，而是从一个固定调色板中按顺序循环取色（如第1段红、第2段蓝、第3段绿、第4段红...）。颜色与字形解耦，解题者需识别循环色序"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "颜色由线段长度决定"
        description: "线段颜色不由字形形状决定，而由线段长度映射（如 len2→色A，len3→色B，len4→色C）。解题者需推断长度到颜色的映射表，形成间接编码关系"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "颜色渐变——按字形处理顺序使用渐变色"
        description: "折线颜色从起始到终点沿色相渐变（如从浅到深或按色谱顺序）。解题者需识别顺序→颜色的渐变规律，视觉上产生彩虹折线效果"
        source: creative
        source_task: null
        delta_lines: 12

  - id: D6
    name: "分隔线结构与画布分区"
    tag: grid_shape
    current: "第7列为全高垂直分隔线（颜色4），将15列宽的网格分为左7列（字形区）和右7列（灰色起始点区）；输出为左画布（Hx7）"
    alternatives:
      - name: "水平分隔线将网格分为上下两区"
        description: "分隔线改为水平方向，上半部放字形，下半部放灰色起始点。输出画布为水平方向，折线在下半区绘制。空间布局旋转90度，改变视觉阅读方式"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "无分隔线——字形和起始点在同一画布中"
        description: "取消分隔线，字形和灰色起始点共存于同一区域。解题者需自行区分字形区域和路径区域，增加了区域识别的推理难度"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "输出保留完整网格（原位绘制折线）"
        description: "不裁剪为左画布，而是在原始网格上原位绘制折线（移除分隔线和右侧空白列）。类似 frame_separation 的 5545f144，输出保留更多上下文信息"
        source: frame_separation
        source_task: "5545f144"
        delta_lines: 10
      - name: "输出紧凑裁剪为折线的外接矩形"
        description: "类似 20270e3b 的 tight_crop，输出不固定为 Hx7，而是紧凑裁剪为折线实际占据区域的最小外接矩形。解题者需预判折线范围"
        source: tight_crop
        source_task: "20270e3b"
        delta_lines: 12

  - id: D7
    name: "灰色起始点的位置规则"
    tag: meta
    current: "灰色起始点固定在第0行（最顶行），列位置在右侧区域的 col 8..14 中随机选取，映射到左画布后为 col 0..6"
    alternatives:
      - name: "起始点在最底行"
        description: "灰色起始点从最顶行移到最底行，折线从底部向上生长。解题者需识别起始方向的反转，空间推理方向完全颠倒"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "起始点位置由字形数量或面积总和编码"
        description: "灰色起始点的列位置等于字形总数模7或所有字形面积之和模7。解题者需先计算字形属性才能确定起始点，增加了前置推理步骤"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "多个起始点——每个起始点对应一个子集的字形"
        description: "右侧有多个灰色像素，每个分别对应一组字形（如按行分组），各自生成独立折线。从单起点单折线扩展为多起点多折线，显著增加推理复杂度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "起始点在左画布内直接标记"
        description: "灰色像素直接出现在左画布区域而非右侧区域。无需跨区域映射坐标，简化了一步推理，但改变了输入结构的视觉布局"
        source: creative
        source_task: null
        delta_lines: 8

  - id: D8
    name: "字形间的步进规则"
    tag: multi_step
    current: "每处理一个字形时，先向下移动1行（固定步进），再执行该字形对应的线段指令"
    alternatives:
      - name: "步进距离由字形属性决定"
        description: "向下步进的行数不固定为1，而是由当前字形的某个属性（如面积减3，或形状类别编号）决定。解题者需推断步进规则与字形属性的关系"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "无步进——线段直接首尾相连"
        description: "取消每段之间的向下步进，后一段直接从前一段的终点开始绘制。折线变得更紧凑，路径形态从阶梯式变为连续转折式"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "步进方向交替（下→右→下→右...）"
        description: "类似 36a08778 的交替运动模式，步进方向在垂直和水平之间交替。折线的连接段不再总是垂直向下，增加了路径预测的复杂度"
        source: creative
        source_task: "36a08778"
        delta_lines: 15
      - name: "步进2行而非1行"
        description: "每处理一个字形时先向下移动2行。折线变得更稀疏，段与段之间有更大间隔，视觉上更分散。需要更大的画布高度来容纳"
        source: creative
        source_task: null
        delta_lines: 5

  - id: D9
