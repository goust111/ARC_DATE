        delta_lines: 15
      - name: "字形排列为N列 x 2行的宽布局"
        description: "字形排成N列2行的宽布局，处理顺序为列主序。空间布局从高窄变为矮宽，改变了视觉扫描方向"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "字形随机散布在左画布中（非网格对齐）"
        description: "字形不在固定 tile 网格上，而是随机分布在左画布中。解题者需自行找到所有3x3字形并确定处理顺序（如按位置排序），增加了目标检测和排序的推理难度"
