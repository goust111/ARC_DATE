        description: "unique形状的对象在输出中被完全删除（不出现在底部也不出现在任何位置），仅保留duplicated对象在顶部。类似3dc255db的erase。解题者需推断'独特=删除'的规则"
        source: erase
        source_task: "3dc255db"
        delta_lines: 5

