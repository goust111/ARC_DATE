task_id: 62593bfd
task_type: move_in_order
summary: "将网格中的8连通单色对象按D4等价的canonical形状分组：形状出现>=2次的对象平移到顶部边缘，形状唯一的对象平移到底部边缘，水平位置保持不变"

dimensions:
  - id: D1
    name: "分组判据——形状等价类的分类规则"
    tag: match_cond
    current: "计算每个对象在D4二面体群（4旋转x2翻转=8变换）下的canonical形状，统计各canonical形状的出现频次；频次>=2为duplicated组，频次==1为unique组"
    alternatives:
      - name: "按面积（像素数）分组"
        description: "不计算canonical形状，而是直接按对象的像素数量分组：相同面积的对象归为duplicated组（移到顶部），独特面积的对象归为unique组（移到底部）。解题者需要计数而非识别形状等价性，将几何推理简化为算术推理，但仍保留分组-分流的核心逻辑"
        source: area_grouping
        source_task: "62593bfd"
        delta_lines: 10
      - name: "按颜色分组"
        description: "将同颜色的对象归为一组：颜色出现>=2次的对象移到顶部，颜色唯一的对象移到底部。当前任务每个对象颜色通常不同，变体需要允许多个对象共享颜色。解题者需关注颜色属性而非形状属性，视觉上更直观但推理模式完全不同"
        source: color_grouping
        source_task: "b5ca7ac4"
        delta_lines: 12
      - name: "按外接矩形尺寸分组"
        description: "将外接矩形相同尺寸（行数x列数）的对象归为duplicated组，尺寸唯一的归为unique组。解题者需要测量每个对象的外接矩形而非精确形状匹配，降低了D4等价性判断的难度但仍需要空间测量能力"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "按连通方向特征分组（仅旋转等价，不含翻转）"
        description: "canonical形状仅在4次旋转下计算等价性，不包含翻转。镜像对称的形状被视为不同形状。解题者需更精确地判断形状等价关系——L形和其镜像不再等价，增加了形状识别的精细度"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "按凸性分组"
        description: "将对象分为凸形状（外接矩形内无空洞）和非凸形状（L形、T形等有凹陷）两组：凸形状移到顶部，非凸形状移到底部（或反之）。解题者需判断每个对象是否为凸形状，引入几何凸性概念"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D2
    name: "分组后的方向分配规则"
    tag: match_cond
    current: "duplicated形状（频次>=2）的对象移到顶部（row 0），unique形状（频次==1）的对象移到底部（row H-h）"
    alternatives:
      - name: "方向反转——duplicated移底部，unique移顶部"
        description: "反转当前方向：共享形状的对象移到底部，独特形状的对象移到顶部。解题者直觉上可能认为'重复=上'，反转后需从示例中重新推断方向映射，增加认知冲突"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "duplicated移左边缘，unique移右边缘（水平分流）"
        description: "将垂直分流改为水平分流：共享形状的对象平移到左边缘（列0），独特形状的对象平移到右边缘（列W-w），行位置保持不变。完全改变空间布局方向，解题者需识别水平重力而非垂直重力"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "三分方向——频次>=3移顶部，频次==2移中间行，频次==1移底部"
        description: "增加中间层：出现3次及以上的形状移到顶部，出现2次的移到网格中间行，独特形状移到底部。需要更多对象和更大网格，解题者需判断三级频次阈值"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "多数组移顶部，少数组移底部"
        description: "不再以频次>=2为阈值，而是比较各组大小：包含对象数最多的canonical形状组移到顶部，其余所有组移到底部。解题者需要全局比较组大小而非仅检查频次阈值"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D3
    name: "源对象的识别与形态"
    tag: src
    current: "背景上所有8连通单色连通分量，每个对象面积3-12像素，外接矩形在2-5行x2-5列内，形状为不规则多连通块（L、T、十字等）"
    alternatives:
      - name: "4连通替代8连通"
        description: "使用4连通而非8连通识别对象。对角相邻的像素被视为不同对象，同一个8连通对象可能被拆分为多个4连通分量。解题者需理解连通性定义的差异，部分形状的分组结果会改变"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "多色对象（非单色连通分量）"
        description: "每个对象可由多种颜色组成，通过空间邻接关系（而非颜色一致性）定义连通分量。解题者需先通过位置聚类识别对象边界，再计算canonical形状，增加对象分割的难度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "空心框架形状替代实心块"
        description: "对象为空心矩形框架（边框为非背景色，内部为背景色），类似4c416de3的hollow_frames。canonical形状的计算需要考虑内外边界，形状等价判断更复杂"
        source: hollow_frames
        source_task: "4c416de3"
        delta_lines: 18
      - name: "固定形状集合（仅使用预定义的几何原语）"
        description: "对象形状限制为固定集合（如1x3横条、2x2方块、L三格、T四格），不再随机生成。解题者可以更容易地记忆和匹配形状，但需要从有限集合中判断等价关系"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D4
    name: "平移规则——水平位置保持"
    tag: dst
    current: "每个对象仅做垂直平移，水平位置（外接矩形左上角列c0）保持不变；顶部对象dest_r0=0，底部对象dest_r0=H-h"
    alternatives:
      - name: "水平位置也重新排列（按列坐标排序紧密排列）"
        description: "对象移到顶部/底部后，同侧对象按原始列坐标从左到右紧密排列（无间隙）。解题者需推断水平紧缩规则，输出更紧凑但失去原始位置信息"
        source: stacking
        source_task: "b5ca7ac4"
        delta_lines: 20
      - name: "水平居中对齐"
        description: "所有移到顶部的对象水平居中于网格中线，所有移到底部的对象也水平居中。解题者需推断居中对齐规则，输出对称性更强"
        source: centering
        source_task: "58f5dbd5"
        delta_lines: 15
      - name: "水平镜像——c0变为W-c0-w"
        description: "对象在垂直平移的同时水平镜像翻转位置：原本靠左的对象移到右侧对称位置。解题者需同时推断垂直移动和水平镜像两个变换"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "保持行位置不变，仅做水平平移到左/右边缘"
        description: "反转当前的垂直平移为水平平移：duplicated对象平移到左边缘（c0=0），unique对象平移到右边缘（c0=W-w），行位置r0保持不变。完全改变移动方向"
        source: creative
        source_task: null
        delta_lines: 10

