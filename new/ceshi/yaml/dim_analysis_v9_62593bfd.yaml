  - id: D10
    name: "canonical形状的等价变换群"
    tag: match_cond
    current: "D4二面体群——包含0/90/180/270度旋转和水平翻转的8种变换，两个形状若在这8种变换下有相同的归一化坐标则视为等价"
    alternatives:
      - name: "仅平移等价（无旋转无翻转）"
        description: "形状必须完全相同（仅平移差异）才算等价，不允许旋转或翻转。解题者看到两个旋转关系的形状时必须判断它们不等价。大幅增加unique组的可能性，降低duplicated组的出现概率"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "仅旋转等价（C4群，不含翻转）"
        description: "允许0/90/180/270度旋转但不允许翻转。手性形状（如L和其镜像J）被视为不同。解题者需精确判断旋转等价而排除翻转等价，增加了手性推理的难度"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "完全等价（任意仿射变换）"
        description: "扩展等价群到包含缩放的相似变换：不同大小但形状相似的对象也视为等价。例如3像素的L和6像素的放大L视为同组。解题者需理解尺度不变的形状匹配"
