task_id: 6ffbe589
task_type: move_to_match
summary: "裁剪主板区域，根据外部同色提示精灵的像素数(mod 4)对板内各颜色层独立旋转90度的整数倍"

dimensions:
  - id: D1
    name: "匹配条件：颜色匹配"
    tag: match_cond
    current: "s.color == d.color，提示精灵与板内颜色层通过颜色一致性配对"
    alternatives:
      - name: "形状匹配：提示精灵形状嵌入目标缺口"
        description: "提示精灵的形状需要与板内某个颜色层的局部缺口形状吻合才能配对，解题者需通过形状比对而非颜色来确定对应关系，增加空间推理难度"
        source: shape_match
        source_task: 16b78196
        delta_lines: 25
      - name: "边缘颜色匹配：通过板边缘颜色确定对应层"
        description: "提示精灵的颜色不直接匹配层颜色，而是匹配板边缘某行/列上的特征颜色，解题者需先识别边缘线索再推断对应关系，增加间接推理步骤"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 20
      - name: "尺寸匹配：提示精灵面积与颜色层面积排序对应"
        description: "提示精灵按面积从小到大排序，与板内颜色层按面积从小到大排序一一对应。解题者需同时计算提示和层的面积并排序，推理链更长"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 20
      - name: "空间对齐匹配：提示精灵的行/列位置与颜色层中心对齐"
        description: "提示精灵所在的行或列坐标与板内某颜色层质心的行或列最接近，从而配对。解题者需利用空间位置关系而非颜色来推断，增加几何推理"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 20

  - id: D2
    name: "变换参数编码方式"
    tag: match_cond
    current: "cue_size mod 4 编码旋转次数，即提示精灵的像素数量对4取模决定旋转角度"
    alternatives:
      - name: "提示精灵的外接矩形宽度编码旋转次数"
        description: "用提示精灵外接矩形的宽度(mod 4)代替像素数来编码旋转量。解题者需关注精灵的空间跨度而非面积，改变了需要提取的特征维度"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "提示精灵的颜色在调色板中的序号编码旋转次数"
        description: "用颜色在板内所有颜色按出现频率排序后的序号(mod 4)来编码旋转量，无需外部提示精灵。解题者需统计频率并排序，推理方式完全不同"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "提示精灵到板中心的曼哈顿距离编码旋转次数"
        description: "用提示精灵质心到板中心的曼哈顿距离(mod 4)编码旋转量。解题者需计算空间距离，将位置信息转化为变换参数，增加空间推理"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "提示精灵的连通孔洞数编码旋转次数"
        description: "用提示精灵内部的4-连通背景孔洞数量来编码旋转次数(0-3)。解题者需识别拓扑特征（孔洞数），而非简单计数像素"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 15

  - id: D3
    name: "变换类型：旋转"
    tag: transform
    current: "np.rot90(layer, -cue_size % 4)，对每个颜色层独立执行顺时针90度整数倍旋转"
    alternatives:
      - name: "镜像翻转代替旋转"
        description: "提示精灵编码翻转方向(水平/垂直/对角线)而非旋转角度。解题者需辨别翻转类型，翻转与旋转的视觉效果截然不同，增加变换识别难度"
        source: reflection
        source_task: b10624e5
        delta_lines: 15
      - name: "旋转+翻转组合变换"
        description: "提示精灵的形状特征同时编码旋转和翻转：像素数mod4编码旋转，精灵是否沿对角线对称编码是否翻转。解题者需提取两个独立特征，复合推理更复杂"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 20
      - name: "颜色层平移代替旋转"
        description: "提示精灵编码平移方向和距离（如精灵在板的上方表示向上平移，面积表示平移像素数），颜色层在板内做循环平移。视觉效果从旋转变为滑动"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "条件性变换：根据层的位置决定旋转/翻转"
        description: "外层做旋转，中层做水平翻转，内层做垂直翻转。提示精灵仍编码变换参数，但不同层应用不同类型的变换，解题者需推断层级与变换类型的对应关系"
        source: conditional_rotation
        source_task: 291dc1e1
        delta_lines: 18

