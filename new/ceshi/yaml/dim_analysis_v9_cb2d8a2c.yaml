task_id: cb2d8a2c
task_type: move_along_path
summary: "绿色像素从网格边缘出发，沿直角转弯路径绕过红色障碍条，每条红色条的最小回避距离由其上蓝色像素数量决定，蓝色像素最终变为红色"

dimensions:
  - id: D1
    name: "路径导航方式"
    tag: path
    current: "直角转弯路径寻找（pathfinding）——绿色路径从边缘出发，遇到障碍条时以直角转弯绕行，始终保持与障碍条的最小距离"
    alternatives:
      - name: "对角线路径绕行"
        description: "绿色路径在需要转弯时改为45度对角线方向移动，而非严格的水平/垂直直角转弯。这使得路径更短但视觉上更难追踪，解题者需要适应非正交方向的距离计算。"
        source: diagonal_path
        source_task: 35ab12c3
        delta_lines: 25
      - name: "最短路径（BFS）"
        description: "绿色路径不再按固定的转弯规则行进，而是寻找从起点到网格对侧的最短路径（满足距离约束下的BFS最短路径）。路径形状不再是规整的矩形转角，可能产生更复杂的锯齿形状。"
        source: shortest_path
        source_task: 7b0280bc
        delta_lines: 30
      - name: "螺旋式绕行"
        description: "绿色路径遇到障碍条后不是简单绕过，而是以螺旋方式围绕障碍条旋转（如顺时针），同时保持距离约束。路径在每个障碍条处形成螺旋弯曲，视觉上更复杂有趣。"
        source: spiral_path
        source_task: da515329
        delta_lines: 35
      - name: "重力流动路径"
        description: "绿色路径不再主动导航，而是像水流一样受重力影响向下流动，遇到障碍条时向两侧扩散绕行。路径方向主要由'重力'决定而非起点位置，解题者需要理解流体力学直觉。"
        source: gravity
        source_task: 28a6681f
        delta_lines: 30

  - id: D2
    name: "路径转弯规则"
    tag: path
    current: "遇到障碍条时在距离约束处直角转弯，转弯方向由障碍条位置和路径当前方向决定，路径总是绕向障碍条的远端继续前进"
    alternatives:
      - name: "固定转弯方向（始终顺时针或逆时针）"
        description: "路径在遇到需要转弯时始终按顺时针（或逆时针）方向转弯，而非自动选择绕行方向。解题者需要从训练示例中推断固定的转弯偏好规则，增加了规则发现的难度。"
        source: turning_rules
        source_task: e87109e9
        delta_lines: 20
      - name: "转弯方向由障碍条上蓝色像素位置决定"
        description: "蓝色像素在障碍条上的位置（靠近起始端还是末端）决定路径在该障碍条处向左还是向右转弯。这使得蓝色像素承担双重角色——既编码距离又编码方向。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "反射式转弯（入射角等于反射角）"
        description: "路径到达距离约束边界时不做直角转弯，而是像光线反射一样以入射角等于反射角的方式弹开。这可能产生非90度的斜向路径段，增加了几何推理复杂度。"
        source: reflection
        source_task: 142ca369
        delta_lines: 25
      - name: "路径分叉（遇到障碍两侧同时绕行）"
        description: "路径遇到障碍条时分裂为两条子路径，分别从两侧绕行，然后在障碍条的另一端汇合继续。输出中显示两条绕行路径，形成包围障碍条的环形图案。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D3
    name: "距离约束的编码方式"
    tag: trajectory
    current: "distance_constraint——路径与每条障碍条的最小距离 = 该条上蓝色像素的数量，路径必须在该距离之外通过"
    alternatives:
      - name: "距离约束取反（距离 = 总像素数 - 蓝色数量）"
        description: "最小回避距离不是蓝色像素数量，而是障碍条总长度减去蓝色像素数量（即红色像素的数量）。蓝色越多反而距离越近，解题者需要理解反向的编码关系，增加了推理的反直觉性。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "距离由蓝色像素间距编码"
        description: "最小回避距离不是蓝色像素的数量，而是蓝色像素之间最大间距（或最小间距）。解题者需要分析蓝色像素的空间分布而非简单计数，增加了空间分析的维度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "距离由障碍条长度编码"
        description: "最小回避距离由障碍条的总长度（红+蓝像素总数）按某种映射决定，如长度除以某个常数向上取整。蓝色像素不再直接决定距离，而是与条长度共同编码。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "GCD间距约束"
        description: "路径不是保持固定最小距离，而是在通过障碍条区域时以蓝色像素数量为步长跳跃前进（涂色位置按GCD间距排列），形成间歇性轨迹。"
        source: gcd_spacing
        source_task: 16de56c4
        delta_lines: 25

  - id: D4
    name: "轨迹涂色模式"
    tag: trajectory
    current: "连续涂色——绿色路径经过的每个背景格子都被涂为绿色，形成连续的绿色线条"
    alternatives:
      - name: "周期性涂色图案"
        description: "路径轨迹按固定的涂色周期进行，如每隔两格涂一格，或使用两种颜色交替涂色（如绿色和黄色）。解题者需要识别周期模式并在测试中正确延续该模式。"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 15
      - name: "间歇跳跃轨迹"
        description: "路径轨迹在绕行每个障碍条的段落内连续涂色，但在两个障碍条之间的直线段上间歇涂色（每隔一格）。这使得不同区域的涂色密度不同，视觉上更丰富。"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 15
      - name: "颜色随障碍条变化"
        description: "路径在经过每个障碍条的绕行区域时，使用不同的颜色涂色——颜色由该障碍条上蓝色像素的数量映射到调色板。这使得路径变为多色，解题者需要理解颜色-数量的映射关系。"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 20
      - name: "仅在转弯处涂色"
        description: "路径的直线段保持背景色不变，只在直角转弯的拐角区域涂色（如转弯前后各1-2格）。这将连续轨迹变为离散的转弯标记，视觉上完全不同，解题者需要理解路径但只标记关键点。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D5
    name: "源对象类型"
    tag: src
    current: "网格边缘的单个绿色像素作为路径起点，向网格内部延伸"
    alternatives:
      - name: "多个绿色像素（多条路径）"
        description: "网格边缘有多个绿色像素，每个独立发出一条路径。多条路径可能需要各自独立绕行障碍条，或者路径之间也成为彼此的障碍物。增加了多路径协调的推理需求。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "绿色像素位于网格内部"
        description: "绿色起始像素不在网格边缘而在内部某位置，路径需要向多个方向延伸直到离开网格或满足某终止条件。起始位置的选择增加了方向判断的复杂性。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "L形标记作为起点"
        description: "路径的起始标记不是单像素，而是一个L形或箭头形的2-3像素结构，形状编码了路径的初始行进方向。解题者需要先从形状中解读方向信息。"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 20
      - name: "一对绿色像素定义起点和终点"
        description: "网格边缘有两个绿色像素，一个是路径起点，另一个是路径终点。路径必须从起点出发经过所有障碍条最终到达终点，而非无限延伸到边界。终点约束增加了路径规划的难度。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D6
    name: "路径终止条件"
    tag: dst
    current: "路径绕过所有障碍条后继续延伸至网格边缘（traverse past all red bars）"
    alternatives:
      - name: "到达指定目标像素终止"
        description: "网格中放置一个特殊颜色的目标像素，路径必须绕过所有障碍条后恰好到达该目标。如果路径无法到达目标则需要调整绕行方向。增加了路径规划的目标导向性。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 20
      - name: "遍历固定步数后终止"
        description: "路径的总长度由某个参数编码（如所有蓝色像素数量之和），到达该步数后路径终止。解题者需要先计算总步数，再规划路径方向。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 20
      - name: "绕行完最近的N条障碍条后终止"
        description: "路径不需要绕过所有障碍条，只需绕过距起点最近的N条（N由起始像素的某属性编码）。解题者需要判断哪些障碍条在范围内，哪些应该忽略。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "路径形成封闭环路终止"
        description: "路径不是单向延伸，而是需要绕行后回到起始点附近形成一个封闭的环路。这要求路径的几何形状满足闭合条件，大幅增加了空间推理难度。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D7
    name: "障碍条方向"
    tag: obstacle
    current: "障碍条可以是水平或垂直方向的线段，由红色和蓝色像素组成"
    alternatives:
      - name: "仅允许一种方向的障碍条"
        description: "所有障碍条统一为水平方向或垂直方向，而非当前的混合方向。这简化了空间推理但改变了路径的典型形状——例如全水平障碍条导致路径主要在垂直方向上做绕行。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "对角线障碍条"
        description: "障碍条沿45度对角线方向放置（阶梯状像素序列），距离约束变为沿对角线方向计算。这大幅增加了距离计算和路径规划的复杂度，因为对角线距离与曼哈顿距离不同。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "L形或T形障碍物"
        description: "障碍物不是简单直线段，而是L形或T形的拐角结构。路径需要在多个方向上同时满足距离约束，转弯策略需要考虑障碍物的多段形状。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "封闭矩形框架障碍物"
        description: "障碍物为封闭的矩形框架（空心），路径需要在框架外部保持距离约束，同时蓝色像素分布在框架的不同边上。框架的二维形状使距离约束更复杂。"
        source: frame_completion
        source_task: a6f40cea
        delta_lines: 35

  - id: D8
    name: "障碍条上的蓝色像素数量与分布"
    tag: obstacle
    current: "每条障碍条有1-4个蓝色像素散布在红色像素之间，蓝色像素数量直接编码该条的最小回避距离"
    alternatives:
      - name: "蓝色像素位置编码方向信息"
        description: "蓝色像素不仅编码距离数量，其在障碍条上的位置（靠近左/上端还是右/下端）还编码路径绕行的方向偏好。解题者需要同时解读数量和位置两层信息。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "蓝色像素替换为其他颜色编码"
        description: "不用蓝色像素计数，而是用不同颜色的像素编码不同的距离值——例如黄色=1，蓝色=2，绿色=3。解题者需要从训练对中推断颜色-距离的映射表。"
        source: color_pairing
        source_task: 16de56c4
        delta_lines: 20
      - name: "蓝色像素连续排列在条的一端"
        description: "蓝色像素不再散布在障碍条中，而是聚集在条的一端形成连续块。蓝色块的长度编码距离，同时蓝色块的位置（哪一端）可能编码额外信息（如绕行方向）。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "无蓝色标记，距离由条长度决定"
        description: "移除蓝色像素标记，所有障碍条纯红色。最小回避距离由障碍条的长度按固定公式计算（如长度/3向上取整）。解题者需要推断长度-距离的数学关系而非简单计数。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D9
    name: "蓝色像素的变换"
    tag: transform
    current: "recolor——所有蓝色像素在输出中变为红色，使障碍条变为纯红色"
    alternatives:
      - name: "蓝色像素被擦除"
        description: "蓝色像素在输出中变为背景色（消失），而非变为红色。障碍条上出现空隙，视觉上暗示'信息已被提取使用'。解题者需要注意蓝色像素在输入中存在但输出中消失。"
        source: erase
        source_task: 3dc255db
        delta_lines: 5
      - name: "蓝色像素变为绿色"
        description: "蓝色像素在输出中变为绿色（与路径同色），暗示蓝色像素被路径'吸收'。这在视觉上将蓝色像素与路径关联起来，使编码关系更直观。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "蓝色像素保持不变"
        description: "蓝色像素在输出中保持原样不变。解题者仍需计算蓝色像素来确定距离，但输出中不做任何颜色变换。这简化了变换规则，让解题者专注于路径逻辑。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "蓝色像素向路径方向移动"
        description: "蓝色像素不仅变色，还在输出中移动到路径的转弯点位置。每个蓝色像素对应路径上的一个关键点，形成'标记-路径'的空间对应关系。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D10
    name: "障碍条的空间排列"
    tag: obstacle
    current: "障碍条在网格中分散排列，路径依次绕过每个障碍条，障碍条之间有足够的空间供路径通过"
    alternatives:
      - name: "障碍条紧密排列形成迷宫"
        description: "障碍条之间距离很近，路径需要在狭窄通道中穿行。不同障碍条的距离约束可能重叠，路径需要同时满足多个距离约束。这大幅增加了路径规划的难度。"
        source: width_constraint
        source_task: 332f06d7
        delta_lines: 20
      - name: "障碍条平行排列（一字排开）"
        description: "所有障碍条平行排列（如全部水平），路径依次从上到下绕过每个障碍条。规整的排列使得路径形成阶梯状的规律图案，但距离参数的变化仍需推理。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "障碍条按嵌套方式排列"
        description: "障碍条以嵌套的方式排列——一个较长的障碍条内部区域包含一个较短的障碍条。路径需要逐层穿入嵌套结构，同时满足每层的距离约束，形成同心矩形的绕行图案。"
        source: concentric_frames
        source_task: 13e47133
        delta_lines: 25
      - name: "障碍条形成十字交叉"
        description: "水平和垂直障碍条在交叉点重叠，路径需要同时考虑两个方向的距离约束。交叉点处的路径选择更加复杂，可能需要在四个象限中选择绕行路线。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D11
    name: "输出网格形状"
    tag: grid_shape
    current: "输出与输入尺寸相同（same size），在原网格上叠加路径并修改蓝色像素颜色"
    alternatives:
      - name: "裁剪到路径覆盖区域"
        description: "输出仅保留包含绿色路径和障碍条的最小外接矩形，去除空白边缘。解题者需要先计算路径范围，再确定输出的裁剪边界。"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 10
      - name: "仅输出路径（移除障碍条）"
        description: "输出网格仅保留绿色路径像素，将障碍条和所有非路径元素变为背景色。这测试解题者是否能完全重建路径的形状。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "输出为路径的布尔掩码"
        description: "输出使用两种颜色——路径区域（路径经过的一侧）涂为一种颜色，路径另一侧涂为另一种颜色。路径本身成为分界线，输出表达的是区域划分而非线条。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D12
    name: "多步处理顺序"
    tag: multi_step
    current: "Step 1: 计算每条障碍条上蓝色像素数量确定最小距离; Step 2: 从边缘延伸绿色路径并依次绕过障碍条; Step 3: 所有蓝色像素变为红色"
    alternatives:
      - name: "逐步处理（每次只处理一条障碍条）"
        description: "路径不是一次性规划好绕过所有障碍条，而是逐步处理——先绕过最近的障碍条，该障碍条消失（蓝变红），然后继续向下一条障碍条延伸。训练示例展示多个中间步骤。"
        source: multi_step
        source_task: 271d71e2
        delta_lines: 25
      - name: "链式反应：绕过障碍条后激活下一条"
        description: "初始只有一条障碍条可见，路径绕过它后'激活'了下一条障碍条（从背景色变为可见）。路径需要在不知道后续障碍条的情况下做出转弯决策，测试逐步推理能力。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 30
      - name: "先变换后寻路"
        description: "Step 1: 先将所有蓝色像素变为红色（获得纯红障碍条）; Step 2: 再根据原始蓝色数量的记忆（需从训练对中推断）规划路径。处理顺序的反转使得解题者需要理解两步之间的信息传递。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "按障碍条距离排序处理"
        description: "路径优先绕过距离起始点最近的障碍条，然后是次近的，依此类推。当障碍条距离相同时，按某种消歧规则（如行号优先）决定顺序。增加了排序推理的维度。"
