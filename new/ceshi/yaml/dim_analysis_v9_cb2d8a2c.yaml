  - id: D14
    name: "距离计算度量"
    tag: meta
    current: "使用曼哈顿距离（沿行或列的最短距离）衡量路径与障碍条之间的间距"
    alternatives:
      - name: "切比雪夫距离（棋盘距离）"
        description: "距离约束改为使用切比雪夫距离（行距和列距取最大值），对角线邻居距离为1。这意味着路径需要在对角线方向上也保持足够距离，约束范围变为正方形而非十字形。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "仅计算垂直于障碍条方向的距离"
        description: "距离约束只在垂直于障碍条的方向上计算——水平障碍条只考虑纵向距离，垂直障碍条只考虑横向距离。平行于障碍条方向上的距离不受限。这简化了约束的计算方式。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "到障碍条最近蓝色像素的距离"
        description: "距离不是到整条障碍条的距离，而是到障碍条上最近蓝色像素的欧氏距离。这使得距离约束的形状变为以蓝色像素为圆心的圆形区域，路径需要绕过多个圆形禁区。"
        source: creative
        source_task: null
        delta_lines: 25

