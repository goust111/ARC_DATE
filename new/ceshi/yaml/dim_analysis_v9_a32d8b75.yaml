      - name: "所有图例面板共享同一颜色池"
        description: "多个图例面板的精灵必须使用相同的两种颜色（而非各自独立分配），仅通过框架形状和旋转/位置区分不同复合精灵。减少颜色种类但增加形状区分要求"
