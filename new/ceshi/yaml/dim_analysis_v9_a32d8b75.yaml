  - id: D15
    name: "处理流程的步骤顺序"
    tag: multi_step
    current: "五步流程：读取图例 -> 铺贴构建 -> 旋转 -> 确定位置 -> 放置"
    alternatives:
      - name: "先放置后变换：在画布上原位构建复合精灵"
        description: "先确定位置并放置框架模板到画布上（放大后），然后在每个框架活跃位置处原位填入单元精灵，最后整体旋转画布区域。步骤顺序的改变导致不同的中间状态理解"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "迭代构建：多轮铺贴逐步细化"
        description: "第一轮将框架铺贴到画布，第二轮将单元精灵铺贴到框架的每个活跃区域。两轮使用不同的位置/旋转标记，解题者需理解两阶段的递进关系"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "条件分支：根据框架特征选择不同的后续操作"
        description: "框架的某个属性（如活跃像素数量的奇偶性）决定后续流程——奇数时旋转后铺贴，偶数时铺贴后旋转。解题者需发现条件分支规则"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D16
    name: "锚点对齐语义"
    tag: meta
    current: "锚点索引0/1/2分别表示起始/中间/结束，独立应用于行和列方向"
    alternatives:
      - name: "九宫格绝对定位"
        description: "3x3标记的9个位置直接对应画布被等分为3x3九宫格后的9个区域中心，复合精灵的中心对齐到对应区域中心。定位更直观但精度有限"
