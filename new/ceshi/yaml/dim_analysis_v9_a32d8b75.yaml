        source_task: 9aaea919
        delta_lines: 25

  - id: D17
    name: "颜色分配约束"
    tag: meta
    current: "单元精灵颜色与画布背景颜色必须不相交，框架颜色与单元精灵颜色不相交"
    alternatives:
      - name: "允许精灵颜色与背景颜色重叠"
        description: "取消颜色不相交约束，精灵中某种颜色可能与背景相同。叠加后该颜色的像素视觉上'消失'在背景中，解题者需推断被隐藏的精灵部分"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "精灵颜色由框架颜色和背景颜色通过规则推导"
        description: "精灵的两种颜色不是独立选择的，而是通过框架颜色和背景颜色的某种运算（如颜色值相加取模）确定。解题者需发现颜色间的数学关系"
        source: creative
        source_task: null
