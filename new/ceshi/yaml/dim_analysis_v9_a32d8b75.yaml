task_id: a32d8b75
task_type: move_to_match
summary: "从左侧图例中读取单元精灵、框架模板、位置标记和旋转标记四组信息，将单元精灵铺贴到框架的每个活跃像素位置构建放大的复合精灵，再根据标记确定旋转角度和锚点位置，最终放置到画布背景上"

dimensions:
  - id: D1
    name: "匹配条件：精灵组装方式"
    tag: match_cond
    current: "s1（单元精灵）替换 d1（框架模板）中每个活跃像素，形成分形式的放大复合精灵"
    alternatives:
      - name: "形状匹配嵌入：单元精灵形状必须匹配框架中的凹槽形状"
        description: "框架中包含多个不同形状的凹槽区域，单元精灵需通过旋转/翻转匹配对应凹槽后嵌入。解题者需识别形状匹配关系而非简单铺贴，推理难度显著提升"
        source: shape_match
        source_task: 16b78196
        delta_lines: 40
      - name: "颜色匹配铺贴：框架中不同颜色的活跃像素对应不同的单元精灵变体"
        description: "框架使用多种颜色标记不同区域，每种颜色对应单元精灵的不同颜色交换版本。解题者需发现颜色与精灵变体的映射关系"
        source: color_match
        source_task: 2c181942
        delta_lines: 25
      - name: "计数匹配：框架中的连通空洞数量决定铺贴重复次数"
        description: "框架中包含若干个不连通的洞区域，单元精灵的铺贴尺寸或数量由洞的数量决定（如3个洞则铺贴3x3次），解题者需先计数空洞再推断放大规则"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 30
      - name: "边缘对齐拼接：单元精灵的边缘图案必须与相邻铺贴块的边缘一致"
        description: "铺贴时要求相邻单元精灵副本的接触边具有相同颜色序列，形成无缝拼接效果。不满足边缘条件的位置用旋转版本替代，解题者需推理边缘匹配与旋转的关系"
        source: edge_matching
        source_task: 7b3084d4
        delta_lines: 35

  - id: D2
    name: "源对象：单元精灵的结构"
    tag: src
    current: "NxN（N=2-5）全填充精灵，恰好2种非{0,6}颜色，读取时进行颜色交换（a<->b）"
    alternatives:
      - name: "单元精灵包含空洞像素"
        description: "精灵不再全填充，允许包含背景色0的空洞，铺贴后复合精灵中出现镂空效果。解题者需区分精灵本身的空洞和框架的非活跃区域，视觉辨识难度增加"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "单元精灵使用3种颜色"
        description: "精灵使用3种非{0,6}颜色而非2种，颜色交换规则变为三色循环置换（a->b->c->a）。解题者需发现更复杂的颜色映射关系"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "单元精灵为非正方形矩形"
        description: "精灵允许为MxN矩形（如2x3、3x4），铺贴后复合精灵的行列缩放比不同。解题者需分别推断水平和垂直方向的放大因子"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "多个不同单元精灵交替铺贴"
        description: "图例中包含两个不同的单元精灵，在框架中交替使用（如棋盘格式：奇数位置用精灵A，偶数位置用精灵B）。解题者需发现交替模式"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D3
    name: "目标对象：框架模板的结构"
    tag: dst
    current: "HxW掩膜（H=4-8, W=3-5），单色绘制，8-连通，活跃像素9-17个，填充率50-65%"
    alternatives:
      - name: "框架为嵌套层次结构"
        description: "框架不再是扁平掩膜，而是多层嵌套结构——外层框架的每个活跃像素位置放置一个更小的子框架，再在子框架的活跃位置铺贴单元精灵，形成三级分形。视觉效果更精细，需要递归思维"
        source: fractal_scaling
        source_task: b99e7126
        delta_lines: 40
      - name: "框架使用多种颜色标记不同铺贴规则"
        description: "框架中使用两种颜色标记活跃像素，不同颜色对应不同铺贴行为（如颜色A处正常铺贴、颜色B处铺贴精灵的镜像版本）。解题者需发现颜色编码的变换差异"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "框架必须4-连通而非8-连通"
        description: "将框架的连通性约束从8-连通收紧为4-连通，排除纯对角连接的形状。可生成的框架形状类别受限但更规则，解题者可利用这一隐含约束帮助推理"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "框架由规则几何形状定义"
        description: "框架不是随机连通图案，而是特定几何形状（如L形、T形、十字形、Z形等俄罗斯方块样式），每种形状对应固定的铺贴模板。解题者需识别标准几何形状"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "变换：分形铺贴构建"
    tag: transform
    current: "将颜色交换后的单元精灵铺贴到框架每个活跃像素位置，构建(fh*uh)x(fw*uw)的复合精灵"
    alternatives:
      - name: "递减尺寸铺贴：每层铺贴使用缩小的精灵"
        description: "框架分为中心和边缘区域，中心区域使用原始尺寸精灵铺贴，边缘区域使用缩小版本（如2x2变1x1）。输出呈现视觉上的尺寸衰减效果，解题者需发现距离与缩放的关系"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "铺贴时精灵根据框架位置旋转"
        description: "每个框架活跃像素位置的精灵根据该位置在框架中的方向旋转（如上方的像素对应精灵旋转0度、右方旋转90度等），形成放射状的复合精灵"
        source: conditional_rotation
        source_task: 291dc1e1
        delta_lines: 20
      - name: "反向铺贴：框架的非活跃位置铺贴精灵"
        description: "将铺贴逻辑反转——在框架掩膜的零值（非活跃）位置铺贴精灵，活跃位置保持空白。相当于框架的负片效果，解题者需发现反转规则"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "精灵缩放铺贴：每个活跃像素放大为kxk区域再铺贴"
        description: "不是直接将精灵放到每个活跃像素对应位置，而是先将框架的每个活跃像素放大为kxk区域，然后用精灵填充整个放大区域。效果类似双重放大，视觉上更大且更复杂"
        source: pixel_enlargement
        source_task: bf45cf4b
        delta_lines: 20

  - id: D5
    name: "变换：旋转方式"
    tag: transform
    current: "根据时钟指针标记确定旋转方向（上=0度、右=90度、下=180度、左=270度），对复合精灵整体旋转"
    alternatives:
      - name: "支持45度增量旋转（含对角线方向）"
        description: "时钟指针增加四个对角方向（右上=45度、右下=135度等），实现8向旋转。对角旋转需要特殊的像素插值逻辑，视觉上产生倾斜效果，推理和实现难度显著提升"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "旋转加翻转组合"
        description: "除了旋转外，标记中还编码翻转信息（如指针颜色不同表示需要额外水平/垂直翻转）。解题者需同时推断旋转角度和翻转方向"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 15
      - name: "框架和精灵分别旋转"
        description: "旋转标记编码两个独立的旋转角度——一个控制框架旋转、另一个控制单元精灵旋转。使用3x3标记中不同颜色的两个像素分别编码，解题者需解码两层旋转信息"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "旋转角度由精灵内颜色比例决定"
        description: "不使用时钟指针标记，而是通过单元精灵中两种颜色的像素数量比例来确定旋转：较多颜色占比越高则旋转角度越大（如>75%对应270度，50-75%对应180度等）。消除独立标记，推理更抽象"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D6
    name: "符号编码：位置标记的编码方式"
    tag: symbol_instructions
    current: "5x5边框6方块内3x3区域中的单个颜色4像素，行列位置(0-2)编码锚点对齐（起始/中间/结束）"
    alternatives:
      - name: "二进制位置编码：多个标记像素的排列组合"
        description: "使用3x3区域中多个像素的在/不在来编码更精确的位置信息（如用3位二进制表示0-7的行偏移），允许更细粒度的定位。解题者需发现二进制编码规则"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "颜色编码位置：不同标记颜色对应不同锚点"
        description: "3x3区域中的标记像素始终在固定位置（如中心），但使用不同颜色编码锚点信息（如红=起始、绿=中间、蓝=结束）。解题者需建立颜色-位置映射而非空间-位置映射"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "相对偏移编码：标记像素位置直接表示画布上的像素级偏移"
        description: "标记像素在更大的NxN方块（如5x5内部）中的位置直接映射为画布上的比例偏移（行位置/N = 垂直比例），实现连续定位而非三级离散。需要更精确的空间推理"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "双标记交叉定位：行和列分别由两个独立标记编码"
        description: "使用两个独立的1D标记（一个水平条编码列位置、一个垂直条编码行位置），解题者需分别解读两个标记并组合为2D坐标"
        source: creative
        source_task: null
        delta_lines: 20

