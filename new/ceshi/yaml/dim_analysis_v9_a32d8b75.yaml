      - name: "锚点表示复合精灵的哪个角/中心对齐到画布对应位置"
        description: "反转锚点语义：不是'画布的起始/中间/结束'，而是'精灵的哪个部分（左上角/中心/右下角）对齐到画布的固定参考点'。解题者需理解以精灵为中心的对齐逻辑"
        source: inversion
