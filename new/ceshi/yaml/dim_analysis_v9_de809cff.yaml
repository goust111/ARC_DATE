task_id: de809cff
task_type: transform_in_place
summary: "网格包含两个大面积前景色区域和背景区域，区域内的黑色凹痕（dent）被转化为3x3的对侧前景色补丁且中心着色为teal(8)；处理前先清除孤立色斑和单像素边界突出"

dimensions:
  - id: D1
    name: "核心变换规则：凹痕到3x3补丁"
    tag: transform
    current: "每个黑色凹痕的3x3邻域多数前景色为A时，凹痕变为3x3的前景色B补丁，中心为teal(8)"
    alternatives:
      - name: "凹痕变为对侧色十字形而非3x3方块"
        description: "凹痕处不生成完整3x3补丁，而是生成十字形（5个像素：中心+上下左右），中心仍为teal(8)，四臂为对侧前景色。解题者需要区分十字形与方块的模式，视觉形状变化使输出更稀疏、更具辨识度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "凹痕变为同侧前景色补丁（非对侧）"
        description: "凹痕被填充为其所在区域的同色3x3补丁（而非对侧色），中心仍为teal(8)。这是颜色对调逻辑的取反——'修复'凹痕而非'植入'异色块。解题者需要区分修复vs植入的规则，难度降低但视觉效果截然不同。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "凹痕大小决定补丁颜色：单像素用对侧色，多像素用同侧色"
        description: "单个黑像素凹痕生成对侧色3x3补丁，而两个或以上相邻黑像素组成的凹痕生成同侧色补丁。解题者需要根据凹痕面积推断不同的着色规则，增加了分类判断维度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "颜色交换：凹痕附近的同侧色像素变为对侧色，对侧色像素变为同侧色"
        description: "凹痕触发局部的双向颜色交换，不仅填充凹痕本身，还翻转3x3区域内所有已有前景像素的颜色。中心仍为teal(8)。产生更复杂的局部马赛克效果，解题者需要追踪双向变换。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 20
      - name: "凹痕变为嵌套框架：外层对侧色、内层teal"
        description: "凹痕生成5x5嵌套补丁而非3x3：外圈(5x5边框)为对侧前景色，内圈(3x3中心区域)的中心为teal(8)、其余为同侧前景色。增大了补丁尺寸，使凹痕变换的视觉冲击力更强，也增加了空间冲突的可能性。"
        source: nested_frames
        source_task: 45a5af55
        delta_lines: 25

  - id: D2
    name: "中心标记颜色"
    tag: transform
    current: "凹痕中心像素在输出中被着色为teal(8)，作为变换发生的视觉标记"
    alternatives:
      - name: "中心保持黑色（0）不变"
        description: "凹痕中心不着色为teal，保持原始黑色（0）。3x3补丁仍为对侧前景色包围一个黑色中心，形成'空心'补丁。解题者需要注意凹痕位置通过中心黑像素保留了痕迹，是当前规则的简化取反。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "中心颜色由凹痕在区域中的相对位置决定"
        description: "凹痕靠近区域边缘时中心为teal(8)，靠近区域中心时中心为maroon(9)。位置编码颜色增加了空间距离计算的推理需求，解题者需要判断'靠近边缘'的阈值。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "中心颜色为对侧区域的前景色（与补丁同色）"
        description: "中心不使用特殊标记色，而是与3x3补丁其余部分同色（均为对侧前景色）。补丁变为纯色3x3方块，视觉上更简洁但失去了凹痕位置的精确标记，解题者需要通过3x3方块的存在推断原始凹痕。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "中心颜色交替：奇数凹痕teal(8)，偶数凹痕maroon(9)"
        description: "按凹痕从左上到右下的扫描顺序编号，奇数编号的凹痕中心为teal(8)，偶数编号的中心为maroon(9)。引入计数和顺序敏感的着色规则，解题者需要正确枚举所有凹痕并确定序号。"
        source: counting
        source_task: 8f215267
        delta_lines: 20

  - id: D3
    name: "凹痕识别条件：3x3邻域多数色判定"
    tag: transform
    current: "凹痕的（清洁后）3x3邻域中多数前景色为某一色时，该凹痕被认定为属于该色区域并触发变换"
    alternatives:
      - name: "使用4-连通邻居而非3x3邻域判定"
        description: "仅检查凹痕的4个正交邻居（上下左右）的多数前景色，忽略对角线邻居。这在区域交界处可能产生不同的判定结果，解题者需要精确追踪正交连接而非完整3x3窗口。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "要求邻域全部为同一前景色（非多数）"
        description: "仅当3x3邻域中的所有非黑像素都是同一前景色时才触发变换，混合邻域的凹痕保持黑色不变。这是多数规则到全一规则的严格化，减少了被处理的凹痕数量，仅区域深处的凹痕会变换。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "少数色决定补丁颜色（而非多数色的对侧）"
        description: "补丁颜色不取多数色的对侧，而是直接使用3x3邻域中的少数前景色。在两色混合的边界凹痕处，少数色和多数色的对侧可能不同。解题者需要精确计数邻域中两种前景色的数量。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "邻域范围扩大到5x5"
        description: "使用5x5邻域（而非3x3）来判定凹痕所属区域的多数色。更大的检测窗口使边界凹痕更稳定地被归属到大区域，但也可能误判位于小区域角落的凹痕。输出补丁仍为3x3。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D4
    name: "前景色区域的数量与类型"
    tag: src
    current: "恰好两个大面积前景色区域（如绿色3和黄色4），形成不规则形状占据网格大部分面积"
    alternatives:
      - name: "三个前景色区域"
        description: "使用三种前景色区域（如红、绿、蓝），每个区域内的凹痕补丁颜色为另外两色中的某一个（由邻接关系或固定映射决定）。三色系统产生更复杂的颜色映射规则，解题者需要推断三色间的对应关系。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "单个前景色区域加背景"
        description: "仅有一种前景色和背景（0），凹痕处的3x3补丁使用一种固定的第二色（如teal本身扩展为补丁色）。简化了颜色对调逻辑，解题者仅需识别凹痕位置，但失去了双色对调的核心趣味。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "两个前景色区域颜色相近（视觉挑战）"
        description: "两个前景色区域使用视觉上接近的颜色（如蓝1和紫5，或绿3和teal8），增加人类视觉区分的难度。规则不变但解题者需要更仔细地观察颜色差异来判断区域归属。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "前景色区域大小不对称：一大一小"
        description: "一个前景色区域占据网格80%以上面积，另一个仅占10%左右。大区域内凹痕多但补丁颜色为小区域色（稀有色），小区域内凹痕少但补丁颜色为大区域色（常见色）。不对称增加了视觉辨识挑战。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D5
    name: "前景区域的形状与空间关系"
    tag: src
    current: "两个前景色区域形成大面积不规则形状，互相邻接且共同覆盖网格大部分面积，区域边界呈现锯齿状"
    alternatives:
      - name: "区域为规则矩形块"
        description: "两个前景区域分别为矩形（可能通过一条直线或阶梯线分隔），边界规则整齐。凹痕在矩形内部的位置更容易判断归属，降低了邻域判定的歧义，但视觉上更几何化。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "区域呈棋盘格式交错"
        description: "两种前景色以棋盘格形式交错排列（如4x4的色块交替），凹痕位于各色块内部。棋盘结构使每个凹痕的邻域几乎总是混合色，增加了多数色判定的挑战。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "区域呈同心嵌套结构（一个包围另一个）"
        description: "外层区域完全包围内层区域（类似框架/洞结构），凹痕可在内层或外层出现。包围关系使边界凹痕的邻域判定更复杂，且补丁可能跨越边界溢出到另一区域。"
        source: hole_fill
        source_task: 3a25b0d8
        delta_lines: 25

  - id: D6
    name: "预清洁步骤：孤立色斑与边界突出的处理"
    tag: multi_step
    current: "变换前先清洁前景区域：移除背景/边缘区域中的孤立前景色斑点（single-cell specks），将单像素边界突出（protrusion）重着色为周围区域色"
    alternatives:
      - name: "无预清洁步骤"
        description: "跳过预清洁，直接对原始网格执行凹痕变换。孤立色斑和边界突出保留原样，可能导致邻域判定结果不同。简化了处理流程但解题者可能被噪点误导，需要自行区分真实凹痕和噪点。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "清洁后保留色斑痕迹（teal标记）"
        description: "被清除的孤立色斑在输出中不是直接消失，而是变为teal(8)标记点。解题者需要区分两种teal像素：凹痕变换的中心标记 vs 被清除色斑的痕迹。增加了teal像素的语义多重性。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "预清洁范围扩大：移除所有小于N像素的连通分量"
        description: "不仅清除单像素色斑，还清除面积小于阈值N（如3或5像素）的小型连通分量。更激进的清洁可能误删真正的小凹痕群，解题者需要推断清洁阈值。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "清洁步骤与变换步骤交替迭代"
        description: "不是先完成所有清洁再执行变换，而是交替执行：清洁一轮→变换一轮→再清洁→再变换，直到稳定。迭代过程中新生成的3x3补丁可能产生新的突出需要清洁。解题者需要模拟多轮迭代过程。"
        source: multi_step
        source_task: 2b83f449
        delta_lines: 30

  - id: D7
    name: "凹痕的空间分布与密度"
    tag: src
    current: "黑色凹痕散布在两个前景区域内部，相互之间有一定间距，密度中等（每个区域约3-8个凹痕）"
    alternatives:
      - name: "凹痕仅出现在区域边界附近"
        description: "凹痕限制在距离区域边界1-2像素的范围内，区域深处不出现凹痕。边界凹痕的邻域更可能包含两种前景色的混合，增加了多数色判定的歧义度。解题者需要格外注意边界效应。"
        source: boundary_detection
        source_task: 71e489b6
        delta_lines: 15
      - name: "凹痕密集成簇出现"
        description: "凹痕不再均匀散布，而是以2-4个一组的簇出现在少数位置。相邻凹痕的3x3补丁可能重叠，需要消歧规则（如后处理覆盖前处理）。解题者需要处理补丁间的空间冲突。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "凹痕沿直线或对角线排列"
        description: "凹痕不随机分布，而是沿水平、垂直或对角线方向排列成行。有规律的分布使解题者可能发现空间模式，但3x3补丁的连续放置形成条纹效果，视觉上更有规律性。"
        source: diagonal_hint
        source_task: 7b80bb43
        delta_lines: 15

  - id: D8
    name: "背景区域的角色"
    tag: meta
    current: "背景色（0）区域不参与变换，仅作为前景区域之间的分隔空间和网格边缘填充"
    alternatives:
      - name: "背景区域也包含凹痕（前景色凹痕）"
        description: "背景区域中也可以出现前景色的单像素'反向凹痕'——背景中的前景色点。这些反向凹痕触发类似的3x3补丁变换但使用背景色（0）。增加了变换的对称性，解题者需要在三种区域类型中都寻找凹痕。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "背景区域在输出中填充为第三种颜色"
        description: "原本黑色的背景区域在输出中变为一种新颜色（如灰色5），使输出没有任何黑色像素。解题者需要推断背景色的变化规则，增加了一个全局变换维度。"
        source: recolor
        source_task: 2b83f449
        delta_lines: 10
      - name: "背景区域中的散落像素提供颜色映射线索"
        description: "背景区域中的孤立前景色像素不是噪点，而是符号指令：它们的颜色指示哪种前景色区域内的凹痕应优先处理，或指示补丁颜色的映射方向。解题者需要先解读背景中的线索。"
        source: symbol_instructions
        source_task: null
        delta_lines: 25

  - id: D9
    name: "3x3补丁与区域边界的交互"
    tag: meta
    current: "3x3补丁完全在原始凹痕的3x3邻域内生成，可能覆盖同区域的前景像素，边界凹痕的补丁可能延伸到背景或另一区域"
    alternatives:
      - name: "补丁被裁剪到所属区域边界内"
        description: "3x3补丁生成后被裁剪，仅保留落在凹痕所属前景区域内的部分，跨越边界的像素不改变。补丁形状从方块变为不规则形状，解题者需要理解边界裁剪的效果。"
        source: clipping
        source_task: 581f7754
        delta_lines: 20
      - name: "补丁优先覆盖：新补丁覆盖已有补丁"
        description: "当多个凹痕的3x3补丁重叠时，按从左上到右下的顺序，后处理的补丁覆盖先处理的补丁。引入处理顺序敏感性，解题者需要推断覆盖顺序。"
        source: multi_step
        source_task: 247ef758
        delta_lines: 15
      - name: "补丁溢出效应：补丁扩展到对侧区域时触发连锁反应"
        description: "当3x3补丁的像素溢出到另一前景区域时，溢出像素被视为该区域的新'异色斑'，可能在后续迭代中触发额外的变换。形成连锁反应机制，解题者需要模拟多步传播。"
        source: seed_propagation
        source_task: 800d221b
        delta_lines: 30

