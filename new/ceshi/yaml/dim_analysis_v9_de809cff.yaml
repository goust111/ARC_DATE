  - id: D12
    name: "凹痕形状：单像素 vs 多像素"
    tag: src
    current: "凹痕主要为单个黑像素（1x1），偶尔出现相邻的2个黑像素"
    alternatives:
      - name: "凹痕为小型连通区域（2-4像素）"
        description: "凹痕可以是2x1、1x2、L形等2-4像素的小型黑色连通区域。补丁以凹痕的质心为中心生成，大小仍为3x3。解题者需要识别各种形状的凹痕并确定其中心位置。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "凹痕形状编码补丁方向"
        description: "单像素凹痕生成标准3x3补丁；2像素水平凹痕生成3x1水平条纹补丁；2像素垂直凹痕生成1x3垂直条纹补丁。凹痕的几何形状决定补丁的形状和方向，增加了形状到形状的映射推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "凹痕为线段（长度3+的黑色直线）"
        description: "凹痕为3像素或更长的水平/垂直黑色线段。补丁沿线段方向延伸，宽度为3像素、长度等于线段长度+2。解题者需要判断线段方向并据此确定补丁的矩形形状。"
        source: stretch
        source_task: 7b5033c1
        delta_lines: 25

  - id: D13
    name: "两种前景色之间的对调映射关系"
    tag: meta
    current: "固定双色对调：区域A的凹痕用色B填充补丁，区域B的凹痕用色A填充补丁（简单二元交换）"
    alternatives:
      - name: "颜色映射由图例区域定义"
        description: "网格边缘有一个2x1的颜色图例，指定A→X、B→Y的映射关系（X、Y可以是A、B或第三种颜色）。解题者需要先解读图例再应用映射，图例引入了符号解码步骤。"
        source: symbol_instructions
        source_task: dbff022c
        delta_lines: 25
      - name: "凹痕补丁颜色为两种前景色的混合标志"
        description: "补丁不使用对侧纯色，而是交替使用两种前景色形成棋盘格图案（中心仍为teal）。混合图案使补丁视觉上更独特，解题者需要推断棋盘格规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "单向映射：只有一种区域的凹痕触发变换"
        description: "仅区域A中的凹痕生成补丁（使用色B），区域B中的凹痕保持黑色不变。打破了对称性，解题者需要从训练示例中推断哪种颜色的区域是'活跃'的。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D14
    name: "边界突出（protrusion）的定义与处理"
    tag: multi_step
    current: "单像素边界突出被识别为：一个前景像素的4-邻居中多数为另一区域色或背景色，该像素被重着色为周围多数色"
    alternatives:
      - name: "突出保留但标记为特殊颜色"
        description: "单像素突出不被清除重着色，而是被标记为teal(8)保留在输出中。解题者需要区分两类teal像素：凹痕中心标记和突出标记，增加了输出中teal语义的多义性。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "突出定义扩大：2像素宽的突出也被清除"
        description: "不仅清除单像素突出，还清除宽度<=2像素的边界突出（狭窄的'半岛'结构）。更激进的清洁改变了区域边界的平滑度，解题者需要推断清除的宽度阈值。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "突出被视为凹痕触发变换"
        description: "边界突出不被清除，而是被视为一种特殊凹痕：突出像素的3x3邻域被填充为对侧色补丁。突出和凹痕共享相同的变换规则，统一了处理逻辑但增加了触发点数量。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D15
    name: "孤立色斑（speck）在背景区域中的处理"
    tag: multi_step
    current: "背景/边缘区域中出现的前景色孤立像素（specks）在预清洁步骤中被移除（变为背景色0）"
    alternatives:
      - name: "色斑保留为干扰项"
        description: "不清除背景中的孤立色斑，让它们作为干扰项保留在输出中。解题者需要区分真正的前景区域和背景中的噪点色斑，增加了区域识别的干扰。"
        source: conditional_deletion
        source_task: 8b9c3697
        delta_lines: 10
      - name: "色斑指示凹痕变换的激活条件"
        description: "背景中的孤立色斑充当控制信号：只有当某前景区域对应的色斑存在于背景中时，该区域内的凹痕才被激活执行变换。解题者需要建立背景色斑与前景区域之间的控制关系。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 20
      - name: "色斑颜色指示补丁中心的着色"
        description: "背景中的孤立前景色斑不被清除，其颜色决定对应区域内凹痕补丁中心的颜色（而非固定使用teal）。不同区域可能有不同的中心标记色，增加了颜色映射的复杂性。"
        source: symbol_instructions
        source_task: null
        delta_lines: 20

  - id: D16
    name: "对称性修复：变换后的输出是否具有对称性"
    tag: meta
    current: "输出不要求具有任何对称性，变换后的网格保持不规则形状"
    alternatives:
      - name: "输出要求关于某轴对称"
        description: "变换后还需执行对称性修复：找到最接近的对称轴（水平或垂直），删除破坏对称性的补丁或补充缺失的补丁。解题者需要推断对称轴并判断哪些补丁应保留/删除。"
        source: symmetry_repair
        source_task: 8e5c0c38
        delta_lines: 30
      - name: "凹痕以区域中心为对称点成对出现"
        description: "每个前景区域的凹痕关于区域的几何中心呈点对称分布。变换后的补丁自然形成对称图案。解题者可以利用对称性验证推理但需要正确识别区域中心。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "补丁放置后执行镜像复制"
        description: "每个3x3补丁放置后，在对侧前景区域的对称位置（关于网格中心点对称）放置一个同色补丁。解题者需要推断镜像放置规则，补丁数量翻倍。"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 25

  - id: D17
    name: "凹痕与区域边界的最小距离约束"
    tag: meta
    current: "凹痕可出现在区域内部任意位置，包括紧邻区域边界处（距边界1像素）"
    alternatives:
      - name: "凹痕必须距区域边界至少2像素"
        description: "凹痕限制在区域内部深处（距边界>=2），确保3x3补丁完全落在本区域内不会溢出。消除了边界效应的歧义，降低了邻域判定的难度但限制了凹痕位置的多样性。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "凹痕恰好位于区域边界上"
        description: "凹痕不在区域内部，而是恰好位于两个前景区域的边界像素位置。凹痕的3x3邻域必然包含两种前景色，多数色判定成为关键挑战。3x3补丁横跨两个区域。"
        source: boundary_detection
        source_task: 71e489b6
        delta_lines: 15
      - name: "凹痕距离边界的远近决定补丁是否带teal中心"
        description: "距边界1-2像素的凹痕生成无teal中心的纯色3x3补丁，距边界3+像素的凹痕生成带teal中心的补丁。位置决定变换细节，解题者需要测量凹痕到边界的距离。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D18
    name: "多凹痕补丁重叠时的处理规则"
    tag: multi_step
    current: "当多个凹痕的3x3补丁区域重叠时，所有补丁同时生成，重叠区域的颜色由最后写入的像素决定"
    alternatives:
      - name: "重叠区域使用teal(8)标记冲突"
        description: "当两个或以上补丁在某像素重叠时，该像素变为teal(8)（而非任一补丁色）。teal不仅标记凹痕中心，还标记补丁冲突点。解题者需要推断冲突检测规则。"
        source: collision_detection
        source_task: 409aa875
        delta_lines: 20
      - name: "重叠区域保留原始前景色不变"
        description: "重叠像素不被任何补丁改变，保持原始前景色。只有非重叠部分正常着色。解题者需要模拟补丁重叠检测来判断哪些像素会被保留。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "重叠补丁合并为更大的连通补丁区域"
        description: "当两个补丁重叠时，它们合并为一个包含两个凹痕的大型连通补丁区域，颜色统一为两个凹痕中距离区域中心更近者的补丁色。引入了合并和距离比较逻辑。"
        source: creative
        source_task: null
        delta_lines: 25
