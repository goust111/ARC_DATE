    name: "图例与障碍物的对应关系"
    tag: symbol_instructions
    current: "图例中每个颜色条目与主区域中同色障碍物一一对应——图例颜色即障碍物颜色，4个条目对应最多4种障碍物颜色"
    alternatives:
      - name: "图例颜色与障碍物颜色不同（间接映射）"
