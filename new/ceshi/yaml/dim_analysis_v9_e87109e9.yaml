      - name: "图例条目包含数量编码"
        description: "图例中每个条目不仅编码转弯方向，条的高度/长度还编码该颜色障碍物允许的最大碰撞次数。超过次数后射线直接穿透该颜色障碍物。解题者需提取两个参数。"
        source: creative
