task_id: e87109e9
task_type: move_along_path
summary: "孤立的青色(8)2x2方块向四个基方向发射射线，遇到障碍物色块时根据图例中颜色条的左/右位置决定顺时针或逆时针转弯，图例区域在输出中被裁剪移除"

dimensions:
  - id: D1
    name: "射线初始发射方向"
    tag: path
    current: "从青色方块向4个基方向（上下左右）同时发射射线（ray_casting），射线沿直线延伸"
    alternatives:
      - name: "仅向2个方向发射（水平或垂直）"
        description: "青色方块只向水平或垂直两个方向发射射线，由方块内部某种不对称特征（如额外标记像素的位置）决定。解题者需先判断发射轴向，减少了射线数量但增加了方向推断层级。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "向8个方向发射（含对角线）"
        description: "射线不仅向4个基方向发射，还向4个对角线方向发射，共8条射线。对角线射线同样遵循转弯规则。大幅增加了路径追踪和转弯判断的复杂度，网格中的轨迹更加密集。"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 30
      - name: "向对角线方向发射（替代基方向）"
        description: "射线沿4个对角线方向发射而非基方向，遇到障碍物后按图例规则转45度或90度。完全改变了路径几何，解题者需在对角线坐标系中追踪轨迹。"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 25
      - name: "发射方向由图例中条目顺序编码"
        description: "不是同时向4个方向发射，而是按照图例中条目从左到右的颜色顺序依次发射射线——第一条向上，第二条向右，以此类推。解题者需要将图例顺序映射到方向序列。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D2
    name: "转弯规则"
    tag: path
    current: "遇到障碍物时根据图例查找该颜色——图例中颜色条在左侧表示逆时针转弯，在右侧表示顺时针转弯"
    alternatives:
      - name: "镜面反射替代转弯"
        description: "射线遇到障碍物时不转弯，而是按物理镜面反射规则弹回（入射角等于反射角），障碍物充当反射面。这将规则从'图例查找转向'变为'几何反射'，移除了图例但增加了空间推理。"
        source: reflection
        source_task: 142ca369
        delta_lines: 30
      - name: "转弯角度可变（90度/180度）"
        description: "图例中颜色条位置编码不同的转弯角度：左侧表示90度逆时针转弯，右侧表示180度掉头。解题者需要区分两种完全不同的路径变化模式，路径可能出现折返。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "障碍物形状编码转弯方向"
        description: "移除图例，改为由障碍物自身的形状决定转弯方向——宽度大于高度的障碍物触发顺时针转弯，高度大于宽度的触发逆时针。解题者需要从障碍物的几何属性推断规则，无需查表。"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 25
      - name: "交替转弯（忽略图例颜色）"
        description: "射线在第一次遇到障碍物时顺时针转弯，第二次逆时针，第三次顺时针，以此交替。转弯方向与障碍物颜色无关。移除了图例查找逻辑但引入了计数/状态追踪推理。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D3
    name: "图例编码方式"
    tag: symbol_instructions
    current: "顶部灰色区域包含4个图例条目，每个为4行高的单色竖条在4格宽空间的左侧或右侧——左侧=逆时针，右侧=顺时针"
    alternatives:
      - name: "图例用箭头符号编码方向"
        description: "图例中每个障碍物颜色旁放置一个由2-3像素构成的L形或箭头形符号，符号的朝向直接指示转弯方向。比左右位置更直观，但解题者需要识别微小的形状差异。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "图例编码转弯角度（条的长度=角度）"
        description: "图例中颜色条的长度（短=90度，长=180度）编码转弯角度，而条的位置仍编码方向。这在图例中增加了第二个维度的信息，解题者需同时解读位置和长度两个参数。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "图例在网格底部而非顶部"
        description: "将图例区域从顶部移至底部。裁剪时需移除底部行而非顶部行。这改变了解题者的阅读习惯——通常先注意顶部信息，但此处关键信息在底部。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "无集中图例——规则由障碍物邻近像素编码"
        description: "移除顶部图例区域，改为在每个障碍物旁放置一个单像素标记（如在障碍物左侧或右侧放一个特殊颜色像素），标记位置指示该障碍物的转弯方向。规则变为局部编码，解题者需逐个检查障碍物附近的标记。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D4
    name: "轨迹涂色模式"
    tag: trajectory
    current: "沿路径连续涂青色(8)，从源到障碍物或网格边缘形成连续实线轨迹"
    alternatives:
      - name: "颜色随转弯段变化"
        description: "每次转弯后射线颜色改变为触发转弯的障碍物颜色——第一段为青色，遇到红色障碍物后变为红色，再遇到蓝色障碍物后变为蓝色。解题者需同时追踪路径和颜色继承链。"
        source: color_change_on_bounce
        source_task: 142ca369
        delta_lines: 15
      - name: "周期性涂色模式"
        description: "轨迹按固定颜色周期涂色（如青色-青色-背景-青色-青色-背景...），形成虚线而非实线。解题者需识别周期长度并在测试用例中正确复现。视觉上更加复杂。"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 15
      - name: "按图例条目顺序循环涂色"
        description: "射线颜色按图例中4个条目的颜色顺序循环——如第一段涂颜色A，第二段涂颜色B，以此循环。图例不仅编码转弯方向，还编码颜色序列。大幅增加了图例解读的复杂度。"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 25
      - name: "仅在转弯点涂色"
        description: "反转连续轨迹：射线在直线段不涂色，只在每个转弯点及其前后各1像素处涂色。轨迹变为围绕障碍物的短标记，解题者需理解射线存在但不可见的概念。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D5
    name: "射线源对象"
    tag: src
    current: "孤立的青色(8) 2x2方块作为射线源，位于背景区域中，四方向发射"
    alternatives:
      - name: "单像素源"
        description: "将2x2方块缩小为单个青色像素作为射线源，射线宽度从2像素变为1像素。视觉上更简洁，但轨迹更细更难追踪，同时射线与障碍物的碰撞判定更精确。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 20
      - name: "3x3方块源（射线宽度3）"
        description: "源方块从2x2扩大为3x3，对应射线宽度变为3像素。射线更粗，占据更多空间，转弯时的几何更复杂（需处理外侧与内侧半径差异），视觉上更醒目。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "多个源方块"
        description: "网格中放置2-3个不同颜色的源方块，每个独立发射射线并遵循各自的转弯规则。射线轨迹可能交叉或互相阻挡。解题者需同时追踪多条独立的射线系统。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "网格边缘上的源像素"
        description: "源不是网格内部的方块，而是网格边缘上的标记像素对。射线只从边缘向内部发射（最多2个方向）。这限制了射线数量但改变了空间布局的性质。"
        source: particle_movement
        source_task: 9bbf930d
        delta_lines: 25

  - id: D6
    name: "射线终止条件"
    tag: dst
    current: "射线遇到障碍物时转弯继续，最终在到达网格边缘时终止"
    alternatives:
      - name: "遇到另一条射线轨迹时终止"
        description: "射线在碰到自身或另一条射线已涂色的像素时终止，而非到达网格边缘。这创造了射线间的依赖关系，先涂的轨迹限制后涂的范围。解题者需推断射线发射和转弯的处理顺序。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 20
      - name: "转弯次数耗尽后终止"
        description: "每条射线有固定的最大转弯次数（如2次），超过后射线停止延伸。转弯次数由源方块的大小或图例中的参数编码。解题者需发现计数约束并正确应用。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 15
      - name: "遇到特定颜色障碍物时终止（不转弯）"
        description: "图例中额外标记一种'终止颜色'——遇到该颜色障碍物时射线直接停止而非转弯。其他颜色障碍物仍触发转弯。解题者需区分两类障碍物的功能差异。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D7
    name: "障碍物形状与大小"
    tag: obstacle
    current: "障碍物为各种大小的矩形色块（3x11、9x4、7x4等），位于网格中不同位置，形状和大小各异"
    alternatives:
      - name: "统一大小的正方形障碍物"
        description: "所有障碍物统一为相同大小的正方形（如3x3或4x4），只是颜色和位置不同。规则化的形状降低了视觉噪音，让解题者更专注于转弯逻辑而非障碍物几何。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "L形或T形障碍物"
        description: "障碍物不是简单矩形而是L形或T形。射线从不同方向碰到同一障碍物的不同边时可能有不同的交互行为。解题者需精确判断碰撞面来确定转弯方向。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "单像素障碍物"
        description: "所有障碍物缩小为单个彩色像素。射线宽度为2但障碍物仅1像素，碰撞判定更微妙——只有射线的一列/一行碰到障碍物。视觉上障碍物更不显眼，增加了识别难度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "线段状障碍物（仅1像素宽/高）"
        description: "障碍物为细长的线段（宽度或高度为1），类似于墙壁。射线碰到线段时沿其长度方向滑行还是转弯需要新的规则定义。视觉上更像围栏或边界而非色块。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D8
    name: "障碍物数量与空间分布"
    tag: obstacle
    current: "3-4个障碍物，分布在源方块周围的不同方向，各自覆盖网格的不同区域"
    alternatives:
      - name: "仅1个障碍物"
        description: "网格中只放置1个障碍物，射线只有一次转弯机会。极大简化了路径追踪但图例中大部分条目变成干扰项——解题者需判断哪些图例条目是有效的。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "6-8个障碍物（高密度）"
        description: "增加障碍物数量到6-8个，射线可能多次转弯形成复杂的折线路径。需要更大的网格来容纳，路径追踪难度大幅提升。部分射线可能在多次转弯后回到源附近。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "障碍物对称分布"
        description: "障碍物围绕源方块呈旋转对称或镜面对称排列。这创造了对称的射线轨迹图案，解题者可能利用对称性简化推理，但也可能被对称性误导忽略图例中的方向差异。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D9
    name: "射线宽度"
    tag: trajectory
    current: "射线宽度为2像素（与源方块2x2的边长一致），射线占据2行或2列"
    alternatives:
      - name: "射线宽度为1像素"
        description: "从1x1源发射宽度为1的细射线。路径更精细，转弯时几何更简单，但视觉上更难追踪。适合作为简化版本理解基本规则。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "射线宽度可变（由段长决定）"
        description: "射线初始宽度为2，每次转弯后宽度递增1（变为3、4...）或递减1。解题者需同时追踪宽度变化和方向变化，路径形状会逐渐膨胀或收缩。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "射线宽度等于障碍物触发边的长度"
        description: "射线碰到障碍物后，转弯段的宽度变为障碍物被碰边的长度。如碰到4x7障碍物的4像素边，转弯后射线宽度变为4。解题者需从障碍物几何推断射线宽度变化。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D10
    name: "输出网格裁剪方式"
    tag: grid_shape
    current: "移除顶部6行图例区域，输出为紧密裁剪后的主区域（tight_crop），输出尺寸 = 输入行数-6 x 原列数"
    alternatives:
      - name: "保留图例区域（输出与输入同尺寸）"
        description: "输出不裁剪图例，保持与输入相同尺寸。射线轨迹叠加在主区域上，图例区域保持不变。解题者不需要推断裁剪边界，但需理解图例是只读参考不被射线影响。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "裁剪到射线轨迹的最小外接矩形"
        description: "输出仅保留包含所有射线轨迹（含源方块）的最小外接矩形，移除图例和所有无轨迹的边缘区域。裁剪边界不再固定（不总是去掉顶部6行），解题者需计算轨迹范围。"
        source: tight_crop
        source_task: null
        delta_lines: 15
      - name: "输出仅包含轨迹图案（移除障碍物和背景）"
        description: "输出网格中只保留青色射线轨迹像素，所有障碍物和背景都设为黑色/统一色。这测试解题者是否能完整追踪所有轨迹，不依赖障碍物位置来验证。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D11
    name: "障碍物对射线的阻挡行为"
    tag: path
    current: "射线碰到障碍物边缘时立即转弯，障碍物完全阻挡射线不让穿过"
    alternatives:
      - name: "半透明障碍物（射线穿透后转弯）"
        description: "射线碰到障碍物时不在边缘转弯，而是穿过障碍物后在另一侧边缘出来时转弯。障碍物区域内也会被涂色。改变了转弯的触发位置，路径几何显著不同。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "障碍物颜色决定阻挡vs通过"
        description: "图例中额外编码了哪些颜色障碍物可以被穿透（射线直接通过不转弯）、哪些会触发转弯。例如图例条在中间位置表示穿透。解题者需处理三种状态：顺时针、逆时针、穿透。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "BFS式流动扩展（非直线）"
        description: "射线不沿直线前进，而是像流水一样通过BFS扩展——遇到障碍物绕过而非转弯，优先填充障碍物两侧的空间。完全改变了路径语义，从射线变为洪泛填充。"
        source: flood_fill
        source_task: b9e38dc0
        delta_lines: 40

