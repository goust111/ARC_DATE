        source: recolor
        source_task: 271d71e2
        delta_lines: 10
      - name: "障碍物在碰撞后生长扩展"
        description: "每次被射线碰到后，障碍物向射线来源方向扩展1行/列像素。多次碰撞使障碍物逐渐变大。这创造了动态的网格状态，后续射线面对的障碍物比最初更大。"
        source: creative
        source_task: null
        delta_lines: 25

