        source_task: null
        delta_lines: 10
      - name: "一对多匹配"
        description: "一个精灵可以同时匹配多个框架（如一个精灵包含多种颜色，每种颜色对应一个框架各贡献一个计数）。解题者需要理解一个精灵可以'分裂'计入多个框架。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "配对后排除"
        description: "精灵按从上到下的顺序逐个匹配框架，每个精灵匹配后该框架的计数加1且该精灵被消耗——但如果某框架已达到最大点数(4)则溢出到下一个同色框架。增加顺序依赖和溢出逻辑。"
        source: creative
        source_task: null
        delta_lines: 25

