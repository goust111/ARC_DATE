        source: creative
        source_task: null
        delta_lines: 30

  - id: D10
    name: "颜色使用约束"
    tag: meta
    current: "每种颜色最多用于一个框架，干扰精灵使用不与任何框架重复的颜色；总颜色数 = 1(背景) + 3-4(框架) + 1-2(干扰) = 5-7种"
    alternatives:
      - name: "多框架共享颜色"
        description: "允许两个框架使用相同颜色（但位置不同），精灵按空间距离匹配最近的同色框架而非按颜色唯一匹配。增加了空间推理需求——相同颜色需要通过位置消歧。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "框架使用双色边框"
        description: "每个框架用两种颜色绘制边框（如上下边用色A，左右边用色B），精灵匹配框架的主色（面积更大的边颜色）。解题者需识别框架的主色而非仅看到颜色。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "干扰色与框架色相同但面积区分"
        description: "干扰精灵的颜色可与框架颜色相同，但通过形状/面积标准区分——如干扰精灵面积严格为1（单像素），匹配精灵面积>=2。解题者需要发现面积阈值规则。"
        source: creative
        source_task: null
        delta_lines: 12

