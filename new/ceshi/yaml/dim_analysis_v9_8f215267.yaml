        source: inversion
        source_task: null
        delta_lines: 15

  - id: D12
    name: "匹配的基数关系"
    tag: meta
    current: "多对一 (many:1) — 多个精灵可以匹配同一个框架，每个精灵只匹配一个框架"
    alternatives:
      - name: "一对一匹配"
        description: "每个框架最多匹配一个精灵（N只能是0或1），点存在与否变为布尔值。简化计数但增加配对唯一性约束。"
