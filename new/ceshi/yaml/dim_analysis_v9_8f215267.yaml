task_id: 8f215267
task_type: move_to_match
summary: "按颜色匹配将散布的精灵归类到对应颜色的空心框架中，计数后在框架中心行从右侧起每隔2列绘制等数量圆点"

dimensions:
  - id: D1
    name: "匹配条件：颜色匹配"
    tag: match_cond
    current: "精灵颜色 == 框架颜色 (s.color == d.color)，同色精灵被归属于对应框架"
    alternatives:
      - name: "形状匹配"
        description: "不按颜色匹配，而是按精灵的形状与框架内某个缺口/标记形状一致来配对。每个框架内嵌一个小形状标记，精灵形状与之吻合则归属该框架。解题者需从形状而非颜色推断关联，改变了推理入口。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 30
      - name: "边缘颜色匹配"
        description: "框架的四条边各用不同颜色绘制，精灵颜色与框架某一条边的颜色相同即匹配。解题者需要识别框架边缘的颜色分布而非整体颜色，增加局部观察需求。"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 25
      - name: "大小匹配"
        description: "精灵面积（像素数）决定其归属哪个框架——如框架按大小排序，面积最小的精灵归属最小框架、面积最大的归属最大框架。解题者需要同时排序精灵和框架，增加比较推理。"
        source: size_match
        source_task: 2c181942
        delta_lines: 20
      - name: "大小排序匹配"
        description: "精灵按面积排序，框架按垂直位置排序，两者按序号一一对应（第k大的精灵匹配第k个框架）。解题者需排序两组对象并建立序数映射。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 20
      - name: "行对齐匹配"
        description: "精灵与框架之间按行位置就近匹配——精灵中心行最接近哪个框架的中心行，就归属于该框架。解题者需要关注空间位置关系而非颜色属性。"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 15

  - id: D2
    name: "源对象：精灵类型"
    tag: src
    current: "小型单色连通精灵，面积2-8像素，外接矩形最大4x3，散布在框架右侧区域"
    alternatives:
      - name: "多色精灵"
        description: "精灵由两种颜色组成——主色和装饰色。匹配时使用主色（占多数的颜色），但精灵视觉上更复杂。解题者需要判断精灵的主色而非简单读取颜色，增加颜色识别难度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "对角线标记像素对"
        description: "源对象变为对角线排列的同色像素对（两个像素呈斜对角），而非连通精灵。更简洁但需要不同的识别策略来发现这些分散的标记。"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 20
      - name: "精灵散布在框架四周而非仅右侧"
        description: "精灵不限制在框架右侧区域，可以出现在框架上方、下方、左侧的任意位置。解题者需要全局扫描而非仅关注右半部分，增加搜索范围。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "固定形状精灵"
        description: "所有精灵形状相同（如全是1x2水平条或2x1垂直条），仅颜色不同。排除形状作为区分线索，纯粹依赖颜色匹配。视觉上更整齐规律。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D3
    name: "目标对象：框架结构"
    tag: dst
    current: "5x11的空心矩形框架，仅由周边一圈像素组成，垂直排列在网格左半部分，间隔2行"
    alternatives:
      - name: "不同尺寸框架"
        description: "每个框架大小不同（如5x7、5x9、5x11等），点的间距和容量随框架宽度变化。解题者需要根据每个框架的实际尺寸推断点的布局参数，增加自适应推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "非矩形框架"
        description: "框架形状为L形、T形或十字形等非矩形结构，中心行的概念需要重新定义。解题者需要识别不同形状框架中的'中心行'逻辑。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "水平排列框架"
        description: "框架从垂直排列改为水平排列（左右并排而非上下堆叠），精灵散布在框架下方区域。改变空间布局，点的绘制方向可能随之从水平变为垂直。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "框架带有内部结构"
        description: "框架不再是简单空心矩形，而是内部有水平或垂直隔板（如分成左右或上下两格），点绘制在特定隔间内。增加框架内部结构的解析难度。"
        source: cavity_fill
        source_task: 5dbc8537
        delta_lines: 25

  - id: D4
    name: "变换规则：计数方式"
    tag: transform
    current: "直接计数与框架同色的精灵数量 N"
    alternatives:
      - name: "计数精灵总面积"
        description: "N不是同色精灵的个数，而是同色精灵的总像素面积（如3个精灵面积分别为2、3、4，则N=9——但需除以某个因子使点数合理）。解题者需要累加面积而非简单计数，增加数值推理。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "计数后取反"
        description: "先计数同色精灵数N，然后绘制 (MAX - N) 个点（MAX为最大可能点数如4）。即精灵越多，点越少——反直觉的映射关系。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "排除干扰项后计数"
        description: "精灵中混有与框架颜色相同但形状特殊的'假精灵'（如面积为1的单像素），需要排除这些干扰项后再计数。解题者需识别真伪精灵的区分标准。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "洞计数"
        description: "N不由精灵数量决定，而由每个精灵内部的连通洞（背景色区域）数量之和决定。如一个精灵有1个洞，另一个有2个洞，则N=3。解题者需分析精灵内部拓扑结构。"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 20

  - id: D5
    name: "变换规则：点的布局方式"
    tag: transform
    current: "在框架中心行从右侧起每隔2列放置N个同色点（列坐标: c1-2, c1-4, c1-6, ...）"
    alternatives:
      - name: "从左侧开始放置"
        description: "取反放置方向：点从框架左侧内壁开始向右排列（列坐标: c0+2, c0+4, c0+6, ...）。视觉上的左右镜像，解题者需要发现方向变化。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "在中心列垂直放置"
        description: "点不再水平排列在中心行，而是垂直排列在框架的中心列上（从底部向上每隔1行放一个点）。改变了维度轴向——从水平计数变为垂直计数。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "在对角线方向放置"
        description: "点沿框架内部的对角线方向放置（从右下角开始向左上方每隔一格放一个点）。解题者需要发现对角线模式而非水平/垂直模式。"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "点间距由精灵面积决定"
        description: "点之间的间距不再固定为2，而是由同色精灵的平均面积决定（如平均面积3则间距3）。解题者需要同时推断数量和间距两个参数。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "填充连续线段而非离散点"
        description: "不绘制N个离散点，而是从右侧开始绘制长度为N的连续水平线段。视觉上从散点变为线段，N的推断方式不变但输出模式不同。"
        source: line_fill
        source_task: 16de56c4
        delta_lines: 8

  - id: D6
    name: "干扰项处理"
    tag: meta
    current: "存在1-2个干扰精灵，颜色不匹配任何框架，在输出中被移除但不影响计数"
    alternatives:
      - name: "无干扰项"
        description: "取消干扰精灵——所有精灵都对应某个框架颜色。简化了过滤步骤，但降低了识别噪声的推理需求。作为基线简化变体仍有意义。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "干扰项保留在输出中"
        description: "干扰精灵在输出中不被移除，保持原位。解题者需要判断哪些精灵被'吸收'（消失并转化为点）、哪些被保留（干扰项）。增加输出差异分析的复杂度。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "干扰项使用框架颜色但面积超标"
        description: "干扰精灵颜色与某框架相同，但面积超过某个阈值（如>5像素）。解题者需发现'只有小精灵才被计数'的隐含大小约束。"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "干扰精灵计入扣减"
        description: "干扰精灵不是被忽略，而是作为'负计数'——存在干扰精灵时，对应颜色框架的点数减少。解题者需发现减法规则。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D7
    name: "精灵移除方式"
    tag: trajectory
    current: "所有精灵在输出中完全移除（设为背景色），无轨迹残留"
    alternatives:
      - name: "保留精灵在原位"
        description: "精灵不被移除，在输出中保持原位，同时框架内绘制点。解题者需要对比输入输出发现'新增了什么'而非'什么消失了'。"
        source: keep_source
        source_task: 247ef758
        delta_lines: 5
      - name: "精灵移动到框架内部"
        description: "匹配的精灵不是消失后转化为点，而是直接移动到对应框架内部的指定位置（如从左到右排列在框架内部）。将抽象计数变为具象搬运。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "精灵变为连接轨迹"
        description: "每个精灵从原位到对应框架之间绘制一条水平或垂直的单色连接线（使用精灵颜色），精灵本身消失。输出中可见从精灵区到框架的'路径痕迹'。"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 25

