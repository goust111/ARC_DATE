        source: creative
        source_task: null
        delta_lines: 15

  - id: D14
    name: "多步处理顺序"
    tag: multi_step
    current: "单步处理——同时移除所有精灵并绘制所有框架的点，无顺序依赖"
    alternatives:
      - name: "按框架从上到下顺序处理"
        description: "框架按从上到下的顺序依次处理，每处理一个框架时先计数当前剩余精灵中的同色精灵并移除它们，然后绘制点。如果后续框架的精灵在前面步骤中被错误移除（颜色相同的歧义情况），增加顺序依赖推理。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "两阶段处理：先计数再绘点"
        description: "第一步对所有精灵分类计数并在框架外部临时标记数量（如在框架右侧用临时色标记N个像素），第二步根据标记绘制内部点并清除标记。输出中临时标记消失，但中间状态暗示了双阶段过程。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "迭代累积处理"
        description: "精灵按某种顺序（如从上到下、从左到右）逐个处理——每消耗一个精灵，对应框架立即新增一个点。如果有覆盖/重叠规则，顺序会影响最终结果。解题者需推断处理顺序。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D15
    name: "符号编码参数"
    tag: symbol_instructions
    current: "无符号编码——点的数量和位置完全由精灵计数和固定间距规则决定"
    alternatives:
      - name: "图例指定点间距"
        description: "在网格角落放置一个小型图例（如一对彩色像素间隔N格），指示点的间距参数。不同输入可有不同间距，解题者需先解读图例再应用规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "图例指定颜色映射"
        description: "网格边缘有一个小型颜色映射表（2xN），将精灵颜色映射到框架颜色（如红色精灵实际对应蓝色框架）。间接匹配增加推理层级。"
        source: legend_lookup
        source_task: 58490d8a
        delta_lines: 25
      - name: "控制像素指定绘制方向"
        description: "框架边缘某个位置有一个额外的控制像素（如在框架上边或下边），指示该框架的点绘制起始方向（上→从顶部绘制，下→从底部绘制）。解题者需识别控制像素并据此调整每个框架的绘制方向。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 20

  - id: D16
    name: "点的最大容量约束"
    tag: meta
    current: "每个框架最多放4个点（受框架内部9列宽度和间距2限制），超出则无法放置"
    alternatives:
      - name: "点可多行排列"
        description: "当同色精灵数量超过单行容量时，点换行继续排列（在中心行上方或下方新开一行）。解除单行限制，增加布局复杂度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "间距自适应调整"
        description: "点间距不固定为2，而是根据匹配精灵数量动态调整以均匀填充框架内部宽度。N个点均匀分布在可用空间中。解题者需推断自适应间距公式。"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "溢出标记机制"
        description: "当精灵数超过框架容量（>4）时，多余的计数以不同方式表示——如在框架边框上打缺口表示溢出数。解题者需发现两种不同的编码规则。"
        source: creative
        source_task: null
        delta_lines: 20
