    tag: match_cond
    current: "s.border_color == d.center_color（源精灵的边框色等于目标精灵的中心色）"
    alternatives:
      - name: "中心色对中心色匹配"
        description: "改为 s.center_color == d.center_color，即源和目标精灵中心色相同时配对。解题者需要关注中心色而非边框色，简化了属性层级但改变了匹配逻辑。"
        source: color_match
        source_task: 2c181942
        delta_lines: 10
      - name: "边框色对边框色匹配"
        description: "改为 s.border_color == d.border_color，即两个精灵边框色相同时配对。改变了跨属性匹配为同属性匹配，解题者需要从不同的视觉线索中发现规则。"
        source: color_match
        source_task: 2c181942
        delta_lines: 10
      - name: "反转匹配方向"
        description: "改为 s.center_color == d.border_color（与当前条件的属性角色对调），解题者需要注意匹配方向的微妙变化，容易与当前规则混淆，增加推理辨别难度。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "形状匹配"
        description: "精灵不再通过颜色配对，而是通过几何形状匹配：源精灵的外轮廓形状与目标精灵的内部空腔形状互补嵌合。将推理从颜色域转移到几何域，大幅改变解题策略。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 45
      - name: "尺寸排序匹配"
        description: "多个源和目标精灵按面积排序，第k大的源匹配第k大的目标。解题者需要进行大小比较和排序推理，不依赖颜色而依赖相对大小关系。"
