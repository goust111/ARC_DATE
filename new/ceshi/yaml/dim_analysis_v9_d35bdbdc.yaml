task_id: d35bdbdc
task_type: move_to_match
summary: "找到通过灰色路径端点相连的带边框精灵，根据源精灵边框色匹配目标精灵中心色，将源的中心色转移到目标中心，最后删除未连接到灰色路径的精灵。"

dimensions:
