task_id: a395ee82
task_type: move_to_match
summary: "单色模板精灵(色T)与单例像素晶格匹配：晶格中唯一T色像素为原点，其余为O色；按晶格偏移将模板stamp至各位置，原点副本重着色为O，重叠区域也着色为O"

dimensions:
  - id: D1
    name: "匹配条件机制"
    tag: match_cond
    current: "color_match — 单例像素中唯一与模板同色(T)的像素被识别为原点，其余O色像素为普通晶格点"
    alternatives:
      - name: "形状匹配替代颜色匹配"
        description: "取消颜色区分原点。改为：晶格点不再是单像素，而是2x2或3x3的微型图案。其中一个微型图案的形状与模板形状的缩略版一致(如模板是L形，原点也是微型L形)，其余为简单方块。解题者需要通过形状相似性找到原点，推理更具挑战性"
        source: shape_match
        source_task: 16b78196
        delta_lines: 40
      - name: "位置规则确定原点"
        description: "所有晶格点颜色相同(均为O色)，原点由空间位置规则确定——始终是晶格中最靠近模板的像素，或是晶格外接矩形的中心点。解题者需从示例中归纳出位置规则而非简单颜色匹配"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "多色映射匹配"
        description: "晶格点使用3种不同颜色(而非仅T和O两种)。每种颜色对应不同的stamp重着色方案：颜色A的stamp用色A绘制，颜色B用色B绘制，原点(T色)用模板原色。解题者需要推断颜色→重着色的映射规则"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "大小编码匹配"
        description: "晶格点改为不同大小的色块(1x1, 2x2, 3x3等)。原点是最大的色块，其余按大小排序对应stamp的绘制优先级(大色块的stamp覆盖小色块的stamp)。引入大小推理"
        source: size_match
        source_task: 2c181942
        delta_lines: 35
      - name: "连通性匹配"
        description: "晶格点之间用细线连接形成一个图。原点是图中度数最高(连接最多)的节点。解题者需要分析连通结构找到中心节点，推理更抽象"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 40

  - id: D2
    name: "源对象结构"
    tag: src
    current: "单例像素晶格 — 5-6个单像素按均匀间距(gunit=2)排列成4-连通多联骨牌，其中1个T色为原点，4-5个O色为普通点"
    alternatives:
      - name: "双像素标记对"
        description: "每个晶格点由相邻的两个像素组成(水平或垂直对)。第一个像素指示stamp颜色，第二个像素指示stamp方向(上/下/左/右翻转)。解题者需要同时解码颜色和方向两层信息"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 45
      - name: "十字形标记"
        description: "每个晶格点由5像素十字形组成(中心+4邻)。中心像素颜色决定是否为原点，4个臂像素的存在/缺失编码stamp的上下左右裁剪。解题者需解析十字形的结构信息"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "单像素但间距不均匀"
        description: "保持单像素晶格点，但间距不再均匀(gunit不固定)。每对相邻晶格点的距离编码stamp之间的间距比例。解题者需要从不等距中推断stamp放置规则，难度显著提升"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "色块簇替代单像素"
        description: "每个晶格点替换为3x3的小色块，色块内部图案(如对角线、十字)指示stamp的绘制变体(如旋转90度、水平翻转等)。原点色块的边框颜色与模板色T一致"
        source: anomaly_detection
        source_task: b99e7126
        delta_lines: 45

  - id: D3
    name: "目标模板结构"
    tag: dst
    current: "单连通单色精灵(色T)，外接矩形3-4行x3列，面积6-10，填充率0.65-0.85，触及外接矩形四边"
    alternatives:
      - name: "多色模板"
        description: "模板不再是单色，而是由2-3种颜色组成的多色精灵。stamp时保持多色结构不变，但原点stamp的所有颜色都替换为O色(或按颜色映射表变换)。解题者需要处理多色stamp的着色规则"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "含孔洞的模板"
        description: "模板精灵内部有1-2个孔洞(背景色像素被精灵像素包围)。stamp时孔洞保持为背景色。原点stamp的非孔洞像素着O色。解题者需区分孔洞和外部背景"
        source: hole_fill
        source_task: 67e490f4
        delta_lines: 20
      - name: "大型稀疏模板"
        description: "模板外接矩形扩大到5-6行x4-5列，但填充率降低到0.3-0.5，形成稀疏的散点结构。stamp更大但更稀疏，重叠检测更复杂"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "模板为框架而非实心"
        description: "模板是一个空心框架(仅边框有色，内部为背景色)。stamp时框架结构保持，原点stamp框架着O色。视觉上更像'窗口'阵列而非实心stamp阵列"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 25

  - id: D4
    name: "stamp着色变换规则"
    tag: transform
    current: "recolor + pattern_stamping — 原点stamp着O色，其余stamp着T色；重叠区域(total>=2)着O色"
    alternatives:
      - name: "渐变着色"
        description: "使用3种以上颜色。stamp着色由其与原点的曼哈顿距离(晶格单位)决定：距离1用颜色A，距离2用颜色B，距离3+用颜色C。原点用O色。解题者需要推断距离→颜色的映射规则"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "重叠区域保持模板色而非特殊色"
        description: "取反当前重叠规则：重叠区域保持模板色T(而非变为O)，仅原点stamp着O色。解题者需要注意'重叠不变色'的反直觉规则"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "重叠区域使用第三种颜色"
        description: "引入第四种颜色R。原点stamp着O色，非原点stamp着T色，但重叠区域着R色(不同于O和T)。需要4种颜色(bg, T, O, R)，解题者需推断三层着色逻辑"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "旋转变换替代重着色"
        description: "所有stamp使用同一颜色T，但原点stamp旋转180度放置。不再有O色重着色，改为几何变换区分原点。解题者需要发现空间翻转而非颜色变化"
        source: rotation
        source_task: 2c181942
        delta_lines: 25
      - name: "stamp擦除模式"
        description: "非原点stamp正常着T色绘制，但原点stamp不绘制(擦除该位置，保持背景色)。输出中出现一个'缺口'，解题者需推断缺口位置对应原点"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 15

  - id: D5
    name: "stamp重叠处理规则"
    tag: transform
    current: "重叠像素(被两个或以上stamp覆盖)统一着O色"
    alternatives:
      - name: "stamp不允许重叠"
        description: "取反当前设计：如果两个stamp有像素重叠，则后绘制的stamp完全覆盖先绘制的(按晶格点的某种排序)。解题者需推断覆盖优先级规则"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "重叠像素消失"
        description: "两个stamp重叠的像素变为背景色(消失)，形成'干涉'效果。解题者需理解重叠=消除的逻辑"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "重叠计数着色"
        description: "重叠像素的颜色由覆盖次数决定：覆盖1次用色A，覆盖2次用色B，覆盖3次用色C。不同重叠层级产生不同颜色，形成类似热力图的视觉效果"
        source: creative
        source_task: null
        delta_lines: 25

