task_id: dd6b8c4b
task_type: move_along_path
summary: "通过橙色背景从绿色方块进行flood-fill可达性检测，收集可达的栗色像素，按距离排序后以行优先顺序填入绿色方块内部"

dimensions:
  - id: D1
    name: "可达性判定方式"
    tag: path
    current: "flood_fill——从绿色方块出发，通过橙色背景像素进行4连通flood-fill扩散，判断栗色像素是否可达"
    alternatives:
      - name: "直线射线可达性"
        description: "不使用flood-fill，而是从绿色方块的四条边向外发射水平/垂直射线，只有射线能直接到达（不经过弯折）的栗色像素才算可达。这将推理从区域连通性转变为视线判断，解题者需要判断哪些像素在方块的'视野'内。"
        source: straight_ray
        source_task: 221dfab4
        delta_lines: 25
      - name: "最短路径长度约束"
        description: "不仅要求连通可达，还要求从绿色方块到栗色像素的最短路径长度不超过某个阈值（如方块边长的2倍）。距离过远的栗色像素即使连通也不被收集。解题者需要估算路径距离。"
        source: shortest_path
        source_task: 7b0280bc
        delta_lines: 20
      - name: "对角线连通性（8连通）"
        description: "使用8连通（包括对角线相邻）替代4连通进行flood-fill。这使得对角线方向上的橙色像素也能传递可达性，可能使原本被阻挡的栗色像素变为可达，改变收集结果。解题者需要注意连通性定义的差异。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "沿边界追踪可达性"
        description: "可达性不通过面积扩散判定，而是沿品红墙壁的外边界追踪——只有边界追踪路径能到达的栗色像素才被收集。这类似迷宫的'左手法则'，解题者需要理解沿边界行走的概念。"
        source: boundary_trace
        source_task: 88bcf3b4
        delta_lines: 30

  - id: D2
    name: "连通性阻断条件"
    tag: obstacle
    current: "品红（magenta/6）像素作为墙壁阻断flood-fill扩散，形成封闭或半封闭区域"
    alternatives:
      - name: "多种颜色的墙壁分层阻断"
        description: "引入两种不同颜色的墙壁，一种完全阻断扩散，另一种只阻断特定方向（如只阻断水平扩散但允许垂直穿越）。解题者需要识别墙壁类型并理解方向性阻断规则。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "墙壁有通道口"
        description: "品红墙壁中存在宽度为1-2像素的间隙（通道口），flood-fill可以通过间隙进入被围区域。解题者需要仔细观察墙壁是否完全封闭，判断哪些区域真正被阻隔。类似corridor_following的通过性判断。"
        source: corridor_following
        source_task: 332f06d7
        delta_lines: 15
      - name: "墙壁为动态（收集后消失）"
        description: "每收集一个栗色像素后，该像素周围的一段墙壁消失，可能打开新的可达区域。需要迭代执行：收集→墙壁变化→重新判定可达性→再收集。这引入了多轮迭代推理。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "非背景色像素均为障碍"
        description: "不仅品红像素阻断扩散，所有非橙色（非背景）像素都阻断扩散，包括其他栗色像素本身。这意味着一个栗色像素可能阻断通往其身后其他栗色像素的路径，收集顺序变得关键。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D3
    name: "收集对象的排序规则"
    tag: path
    current: "sorting_by_distance——收集到的栗色像素按照到绿色方块的距离（flood-fill步数）从近到远排序"
    alternatives:
      - name: "按距离从远到近排序"
        description: "取反当前排序：最远的栗色像素最先填入方块左上角。这完全反转了填充顺序，视觉结果明显不同，解题者需要注意排序方向的反转。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "按空间位置排序（行优先扫描序）"
        description: "不按距离排序，而是按栗色像素在网格中的位置排序——先按行号从小到大，同行按列号从小到大。这将排序逻辑从路径距离转为纯坐标排序，解题者需要确定使用的是哪种排序标准。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "按与方块中心的欧几里得距离排序"
        description: "使用欧几里得距离（直线距离）而非flood-fill步数来排序。两种距离在有墙壁阻挡时可能产生不同的排序结果，增加了距离概念的推理层次。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "按颜色/像素值分组排序"
        description: "如果栗色像素替换为多种不同颜色的像素，先按颜色分组排序（如颜色值从小到大），组内再按距离排序。这增加了双重排序键的推理需求。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "填充目标区域的方式"
    tag: path
    current: "row_major_fill——按行优先顺序从绿色方块内部左上角开始，逐个填入收集到的栗色像素"
    alternatives:
      - name: "从右下角开始反向行优先填充"
        description: "取反当前填充方向：从方块内部右下角开始，按行优先从右到左、从下到上填充。视觉效果完全镜像，解题者需要注意填充起始点和方向的变化。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "列优先填充"
        description: "从左上角开始但按列优先顺序填充——先填满第一列，再填第二列，以此类推。与行优先的视觉效果明显不同，解题者需要区分行优先和列优先两种可能。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "螺旋填充"
        description: "从方块外围开始螺旋向内填充，或从中心向外螺旋填充。这创造了更复杂的填充路径，解题者需要理解螺旋遍历的概念。"
        source: spiral_path
        source_task: da515329
        delta_lines: 20
      - name: "按距离对应位置填充"
        description: "不按固定顺序填充，而是将方块内部的每个位置也计算一个'距离值'（如到方块中心的距离），然后将距离最近的栗色像素填入距离最近的方块位置。这创造了距离映射的对应关系。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D5
    name: "源对象（被收集的对象）"
    tag: src
    current: "栗色（maroon/9）散布像素——散落在网格各处的单个栗色像素，作为被收集的目标"
    alternatives:
      - name: "多像素色块作为收集对象"
        description: "被收集的不是单个像素，而是由2-4个相连像素组成的小色块。收集时整个色块作为一个整体被移动到方块内部，需要保持色块形状。这增加了形状匹配和放置的推理需求。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "多种颜色的待收集像素"
        description: "散布的像素不仅有栗色，还有其他颜色（如蓝色、黄色）。不同颜色的像素填入方块后保持各自颜色。解题者需要追踪多种颜色的收集与排序。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 15
      - name: "网格边缘像素作为源"
        description: "被收集的像素限定在网格边缘（第一/最后行列），而非散布在整个网格中。这限制了源的空间分布，使可达性判断更有规律性。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 10
      - name: "品红框架上的特殊标记像素"
        description: "被收集的不是散布的栗色像素，而是品红框架边缘上的特殊颜色标记。这将源从'区域外散布'变为'框架上附着'，改变了可达性的判定逻辑。"
        source: touch_point_connection
        source_task: a6f40cea
        delta_lines: 20

  - id: D6
    name: "目标容器（绿色方块）"
    tag: dst
    current: "绿色3x3方块（内含红色中心像素）——作为收集容器，内部空间被收集到的栗色像素填充"
    alternatives:
      - name: "可变大小的目标容器"
        description: "目标容器不固定为3x3，而是由示例中确定的不同大小（如4x4、5x5）。容器大小决定了最多能收集多少像素，多余的像素保留原位。解题者需要根据容器大小推断收集数量上限。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "多个目标容器"
        description: "网格中存在多个绿色方块，每个方块独立收集自己可达范围内的栗色像素。不同方块的可达区域可能重叠，此时需要消歧规则（如就近分配）。这大幅增加了多目标推理的复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "非正方形容器（L形/矩形）"
        description: "目标容器为L形、T形或非正方形矩形，填充时仍按行优先顺序但需要跳过不属于容器的位置。这增加了容器形状识别和填充路径规划的难度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "容器为空心框架（仅填充边框）"
        description: "收集到的像素不填充方块内部的全部位置，而只替换方块的外框像素（绿色边框），中心红色像素保持不变。这改变了填充的空间范围和顺序逻辑。"
        source: frame_completion
        source_task: a6f40cea
        delta_lines: 15

  - id: D7
    name: "收集后原位置的变换"
    tag: trajectory
    current: "栗色像素被收集后从原位置消失（变为橙色背景），同时出现在方块内部新位置"
    alternatives:
      - name: "原位置保留痕迹色"
        description: "收集后栗色像素不完全消失，而是变为另一种颜色（如灰色）作为'已收集'标记。这让解题者能在输出中追溯哪些像素被收集过，增加了视觉信息量。"
        source: recolor
        source_task: 271d71e2
        delta_lines: 10
      - name: "收集路径上留下轨迹"
        description: "从栗色像素到绿色方块的flood-fill路径上所有经过的橙色像素被涂为特殊颜色，形成可见的'运输路径'。解题者需要理解不仅是端点变化，路径本身也被可视化。"
        source: continuous_trail
        source_task: 142ca369
        delta_lines: 25
      - name: "原位置保持不变（复制而非移动）"
        description: "取反当前行为：栗色像素被复制到方块内部但原位置不消失。这从'移动'变为'复制'，输出中栗色像素同时存在于原位和方块内，解题者需要注意这一区别。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "不可达像素变色标记"
        description: "不仅可达像素消失，不可达的栗色像素也发生变换——变为另一种颜色（如蓝色）。这让解题者能直接从输出看出哪些像素不可达，增加了可达性判断的可验证性。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D8
    name: "方块内部填充与原有内容的交互"
    tag: transform
    current: "收集到的栗色像素覆盖方块内部的绿色像素（从左上角按行优先），红色中心像素在最后可能被覆盖也可能保留（取决于收集数量）"
    alternatives:
      - name: "红色中心始终保留（跳过）"
        description: "填充时红色中心像素被视为'固定点'，行优先遍历时跳过该位置。这改变了填充位置的映射关系，解题者需要注意特殊像素的存在。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "填充替换绿色但保留非绿色"
        description: "方块内部只有绿色像素被替换为栗色，非绿色像素（如红色中心）保持不变。如果方块内部有多种颜色的装饰像素，它们都被保留。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "填充颜色由收集距离决定"
        description: "不是所有像素都填为栗色——距离近的像素填为深色，距离远的填为浅色（使用多种颜色表示距离梯度）。方块内部呈现距离热力图效果。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "填充时交替使用栗色和原绿色"
        description: "按棋盘格模式交替填充：奇数位置填栗色，偶数位置保留绿色。这创造了棋盘纹理效果，解题者需要识别交替填充的规律。"
        source: alternating_pattern
        source_task: 13e47133
        delta_lines: 15

  - id: D9
    name: "品红框架的结构"
    tag: obstacle
    current: "品红像素形成围绕绿色方块的不完全封闭框架，框架形状不规则，部分区域有开口允许flood-fill穿透"
    alternatives:
      - name: "规则矩形框架（有明确开口）"
        description: "品红框架为严格的矩形，每条边有0-2个明确的1像素开口。开口数量和位置决定了哪些方向的栗色像素可达。更规则的结构让解题者更容易分析可达性。"
        source: frame_completion
        source_task: a6f40cea
        delta_lines: 15
      - name: "多层嵌套框架"
        description: "品红框架不是单层，而是两层或三层嵌套的同心矩形框架，每层有不同位置的开口。只有同时穿过所有层开口的路径才能到达最外层的栗色像素。这大幅增加了可达性分析的复杂度。"
        source: concentric_frames
        source_task: 13e47133
        delta_lines: 25
      - name: "迷宫式墙壁"
        description: "品红像素形成类似迷宫的复杂通道结构，而非简单的框架。栗色像素散布在迷宫的不同死胡同和通道中，解题者需要追踪迷宫路径判断可达性。"
        source: corridor_following
        source_task: 332f06d7
        delta_lines: 30
      - name: "框架颜色编码区域功能"
        description: "使用两种颜色的墙壁（如品红和蓝色），品红墙壁完全阻断，蓝色墙壁允许单方向通过（如只能从内向外但不能从外向内）。这引入了方向性屏障的概念。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D10
    name: "距离消歧规则"
    tag: path
    current: "同距离的栗色像素需要消歧排序（tiebreak），当前使用某种确定性规则（如行号优先）"
    alternatives:
      - name: "同距离按列号优先"
        description: "同距离的栗色像素按列号从小到大排序（而非行号优先）。这在有多个同距离像素时产生不同的填充顺序，解题者需要从示例中辨别消歧规则。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "同距离按顺时针角度排序"
        description: "同距离的像素按照相对于方块中心的顺时针角度排序（如从正上方开始顺时针）。这引入了角度概念，增加了空间推理的维度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "同距离像素合并为一个颜色值"
        description: "如果多个像素同距离，将它们视为一组，在方块内用特殊标记（如不同颜色）表示。解题者需要识别分组逻辑。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D11
    name: "输出网格形状"
    tag: grid_shape
    current: "same——输出网格与输入尺寸完全相同"
    alternatives:
      - name: "裁剪到方块及其周围区域"
        description: "输出仅保留绿色方块及其品红框架区域的外接矩形，移除远处的空白区域。这要求解题者理解裁剪边界的确定规则。"
        source: crop
        source_task: a6f40cea
        delta_lines: 10
      - name: "仅输出方块内部"
        description: "输出仅为绿色方块内部的填充结果（如3x3网格），完全移除外部信息。这是极端裁剪，解题者需要理解输出内容只是方块内部的状态变化。"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 10
      - name: "网格尺寸扩大以显示路径"
        description: "输出网格在方块周围扩大，额外区域用来可视化收集路径。扩大的尺寸由最远可达像素的距离决定。这让路径信息显式化。"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 20

  - id: D12
    name: "源-目标基数关系"
    tag: meta
    current: "many:1——多个栗色像素被收集到一个绿色方块中"
    alternatives:
      - name: "1:1 单像素到单位置映射"
        description: "每个栗色像素与方块内部的一个特定位置一一对应（如通过距离匹配或颜色匹配），而非按排序顺序填充。这将问题从排序填充转为匹配映射，推理逻辑完全不同。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "many:many 多像素到多方块"
        description: "网格中有多个绿色方块和多个栗色像素区域，每个方块只收集其可达范围内的像素。方块之间可能竞争同一个像素，需要就近分配规则。这大幅增加了多目标分配的推理复杂度。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "1:many 一个源填充多个目标"
        description: "只有一个特殊的'源区域'包含所有待分配的像素，但有多个目标方块。源区域的像素按某种规则分配给不同的方块（如按距离、按颜色匹配）。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D13
    name: "收集数量与容器容量的关系"
    tag: meta
    current: "可达栗色像素数量可能少于、等于或多于方块内部空间（3x3方块有8个绿色位置+1个红色中心=最多8或9个位置）"
    alternatives:
      - name: "恰好填满（数量=容量）"
        description: "严格保证可达栗色像素数量恰好等于方块可填充位置数。这增加了任务生成的约束但消除了'多余/不足'的歧义，解题者可以用数量一致性来验证答案。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "溢出处理（数量>容量）"
        description: "当可达像素超过容器容量时，多余的像素执行其他操作——如在方块外围形成第二层、或改变方块边框颜色。这增加了溢出情况的处理逻辑。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "不足时容器缩小"
        description: "当可达像素不足以填满方块时，方块未被填充的部分保持绿色（但方块整体缩小到恰好容纳收集到的像素数的最小正方形）。这引入了容器自适应的逻辑。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D14
    name: "品红框架与方块的空间关系"
    tag: obstacle
    current: "品红框架紧邻绿色方块外侧，形成围绕方块的边界结构，框架与方块之间无间隔"
    alternatives:
      - name: "框架与方块之间有间隔通道"
        description: "品红框架与绿色方块之间有1-2像素宽的橙色通道。栗色像素可能出现在通道中，且通道本身也是flood-fill扩散的一部分。这增加了空间层次。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "方块位于框架角落（非中心）"
        description: "绿色方块不在品红框架的中心位置，而是偏向某个角落。这使得不同方向的可达性不对称，解题者需要考虑方块位置对收集结果的影响。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "框架与方块分离（不相邻）"
        description: "品红框架与绿色方块之间有较大的橙色空间间隔，框架形成独立的区域分隔结构。方块和框架的空间关系不再是包含关系而是分离关系。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D15
    name: "多步处理与迭代"
    tag: multi_step
    current: "单步处理——一次性flood-fill判定可达性，收集所有可达像素，排序后填入"
    alternatives:
      - name: "逐步收集（每步收集最近的一个）"
        description: "每次只收集距离最近的一个栗色像素，收集后该像素消失，然后重新进行flood-fill判定可达性（可能因为某个像素消失而打开新路径），再收集下一个。迭代直到无可达像素。"
        source: multi_step
        source_task: 271d71e2
        delta_lines: 20
      - name: "先收集后排序再填充（三阶段）"
        description: "明确分为三个阶段：(1)标记所有可达像素；(2)按某种规则对可达像素重新排序；(3)按另一种规则填入方块。当前是排序和填充合并，分离后可以使用不同的排序/填充规则组合。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "BFS逐层收集（按距离层处理）"
        description: "按BFS层（距离=1的先处理，然后距离=2，以此类推）逐层收集。每层收集完后，该层的栗色像素全部消失，可能影响后续层的可达性。这引入了层次依赖的推理。"
        source: BFS_activation
        source_task: 5961cc34
        delta_lines: 25
      - name: "双向收集（方块也向外扩展）"
        description: "方块不仅收集外部像素，自身也向外扩展——每收集一轮，方块边界向外扩展一圈，能够'够到'更远的像素。这是一种增长式收集机制。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D16
    name: "背景色的角色"
    tag: meta
    current: "橙色（7）作为唯一的可穿越背景色，flood-fill只通过橙色像素扩散"
