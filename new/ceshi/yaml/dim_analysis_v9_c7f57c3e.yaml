task_id: c7f57c3e
task_type: move_to_match
summary: "多色精灵按颜色模式分为两组，组间交换颜色模式，同时保持每个精灵的尺度不变并最大化位置重叠。"

dimensions:
  - id: D1
    name: "分组匹配条件"
    tag: match_cond
    current: "按颜色模式（如 teal/green 组 vs red/green 组）将精灵分为两组，同组精灵共享相同颜色组合"
    alternatives:
      - name: "按形状分组而非颜色模式"
        description: "精灵不再按颜色模式分组，而是按外形轮廓分为两组（如L形组 vs T形组），组间交换颜色模式。解题者需要先识别形状类别，再判断颜色交换规则，推理重点从颜色分析转向形状分析。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 30
      - name: "按精灵大小分组"
        description: "精灵按像素数量或外接矩形面积分为大/小两组，大组与小组之间交换颜色模式。解题者需要计数或测量来确定分组，增加数值推理成分。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 20
      - name: "按空间位置分组"
        description: "精灵按在网格中的位置分组（如上半部分 vs 下半部分，或左半 vs 右半），位置组间交换颜色模式。解题者需要发现空间分区规则而非颜色模式规则。"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 20
      - name: "按连通区域分组"
        description: "精灵通过共享颜色的相邻像素形成连通簇，同一簇的精灵为一组，簇间交换颜色模式。需要发现精灵间的隐含空间连接关系。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D2
    name: "配对匹配策略"
    tag: match_cond
    current: "跨组配对时要求尺度相同（s.scale == d.scale）且位置重叠最大化"
    alternatives:
      - name: "仅按尺度匹配（忽略位置重叠）"
        description: "取消位置重叠最大化约束，仅要求尺度相同即配对。当存在多个同尺度候选时引入消歧规则（如优先选择距离最近者），简化空间推理但增加消歧复杂度。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "按边缘颜色匹配"
        description: "每个精灵的外边缘有一行特殊颜色像素，跨组精灵必须边缘颜色一致才能配对。引入边缘属性作为匹配线索，解题者需要关注精灵边界而非整体。"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 30
      - name: "按洞的数量匹配"
        description: "每个精灵内部有不同数量的背景色洞，跨组精灵必须洞数相同才能配对。需要计数精灵内部的连通背景区域，增加空间分析难度。"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 25
      - name: "按对称性匹配"
        description: "精灵对按镜像对称性配对：A组某精灵与B组中形状互为镜像（水平/垂直/对角镜像）的精灵配对后交换颜色。需要识别对称关系才能正确配对。"
        source: mirror_symmetry
        source_task: 4c416de3
        delta_lines: 35

  - id: D3
    name: "位置重叠约束"
    tag: match_cond
    current: "配对后最大化精灵的位置重叠（maximize position overlap），交换后精灵尽量保持原位"
    alternatives:
      - name: "最小化位置重叠"
        description: "取反当前最大化逻辑，配对时选择位置重叠最少的精灵进行交换。颜色模式将被传送到最远的位置，视觉上产生更剧烈的变化。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "完全位置交换"
        description: "配对精灵不仅交换颜色模式，还交换位置——A组精灵移动到B组配对精灵的位置，反之亦然。同时涉及颜色和空间的双重变换。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "位置由尺度编码"
        description: "交换后精灵不保持原位，而是按尺度大小从左到右或从上到下排列。位置不再由重叠决定而由排序规则决定，增加排序推理。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 25

  - id: D4
    name: "源对象特征"
    tag: src
    current: "多色精灵（polychrome sprites），每个精灵使用不同的颜色组合构成可识别的颜色模式"
    alternatives:
      - name: "单色精灵加标记像素"
        description: "精灵主体为单色，分组线索改为精灵内部或相邻的标记像素颜色（如红色/蓝色标记点），标记颜色决定分组。简化精灵结构但增加标记识别的推理。"
        source: marker_pixels
        source_task: 9aaea919
        delta_lines: 25
      - name: "含空心区域的框架精灵"
        description: "精灵为空心框架结构，颜色模式体现在框架边缘颜色和内部填充颜色的组合上。交换时框架色和填充色同时交换，视觉上更复杂。"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 30
      - name: "嵌套精灵"
        description: "每个精灵由大精灵包含小精灵的嵌套结构组成，分组依据外层颜色，交换时只替换内层颜色模式保留外层框架。增加了层次结构识别。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "对角线条纹精灵"
        description: "精灵的颜色模式由对角线条纹（如从左上到右下的交替颜色带）构成，分组基于条纹方向或颜色顺序。交换条纹模式比交换块状颜色更难视觉化。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D5
    name: "目标位置/锚定方式"
    tag: dst
    current: "交换后精灵保持在与配对精灵最大重叠的位置，本质上近似原位交换"
    alternatives:
      - name: "对齐到网格锚点"
        description: "输出中有预定义的锚点位置（如等距网格交点），交换后精灵移动到最近的锚点而非保持原位。增加了网格感知和对齐推理。"
        source: centering
        source_task: 58f5dbd5
        delta_lines: 25
      - name: "堆叠到公共区域"
        description: "所有交换后的精灵不保持分散布局，而是按顺序堆叠到输出网格的一个公共区域（从左到右或从上到下排列）。输出布局完全不同于输入。"
        source: stacking
        source_task: 3dc255db
        delta_lines: 30
      - name: "重力下落到底部"
        description: "交换颜色模式后，精灵向下'下落'直到碰到网格底边或其他精灵，形成堆积效果。结合了颜色交换和物理运动两种推理。"
        source: gravity
        source_task: 62593bfd
        delta_lines: 30

  - id: D6
    name: "颜色模式交换方式"
    tag: transform
    current: "两组之间完全交换颜色模式（A组获得B组的颜色，B组获得A组的颜色），同时保持尺度不变"
    alternatives:
      - name: "单向颜色传递（非交换）"
        description: "取反'双向交换'为'单向传递'：只有A组精灵获得B组的颜色模式，B组精灵保持不变（或消失）。解题者需要判断传递方向而非对称交换。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "颜色通道轮换"
        description: "不是交换两组的完整颜色模式，而是对所有精灵的颜色进行通道轮换（如 teal→red, red→green, green→teal）。每个精灵内部颜色映射统一变换，需要发现映射规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "颜色模式混合"
        description: "配对精灵交换后，每个精灵获得两组颜色的混合模式——保留自身一种颜色，替换另一种为配对精灵的颜色。需要分析哪些颜色被保留哪些被替换。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "颜色取反（互补色替换）"
        description: "不交换到对方组的颜色，而是将每个精灵的颜色替换为某种互补/反转映射（如ARC调色板中的对称位置颜色）。从组间交换变为规则性变换。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D7
    name: "尺度保持规则"
    tag: meta
    current: "交换颜色模式时保持精灵的尺度（scale）不变，同尺度精灵配对"
    alternatives:
      - name: "交换时同时缩放到目标尺度"
        description: "配对精灵尺度可以不同，交换颜色模式时将源精灵缩放到目标精灵的尺度。增加了缩放变换的推理，需要理解颜色模式如何在不同分辨率间映射。"
        source: scaling
        source_task: b10624e5
        delta_lines: 35
      - name: "尺度决定颜色映射顺序"
        description: "尺度不作为配对条件，而是决定颜色映射顺序：最大尺度精灵优先获得第一种颜色模式，次大获得第二种，依此类推。尺度从匹配条件变为排序参数。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "统一缩放到最大/最小尺度"
        description: "交换后所有精灵统一缩放到组内最大（或最小）精灵的尺度，输出中所有精灵大小一致。引入全局归一化概念。"
        source: inversion
        source_task: null
        delta_lines: 30

  - id: D8
    name: "输出网格形状"
    tag: grid_shape
    current: "输出网格与输入网格大小相同（same），精灵在原位交换颜色模式"
    alternatives:
      - name: "紧凑裁剪输出"
        description: "输出仅保留包含所有非背景像素的最小外接矩形，去除多余的背景行列。如果精灵分布紧凑则输出会明显小于输入。"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 10
      - name: "分离输出为多个子网格"
        description: "输出不是单一网格，而是将每组精灵分别裁剪输出，或用分隔线将两组分开显示。类似多帧输出格式。"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 25
      - name: "输出网格扩展以容纳重排"
        description: "交换后精灵可能需要更多空间（如不再重叠），输出网格自动扩展到所需尺寸。解题者需要推断输出尺寸变化规则。"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 20

  - id: D9
    name: "多步处理顺序"
    tag: multi_step
    current: "步骤：识别精灵 → 按颜色模式分组 → 同尺度跨组配对 → 交换颜色模式"
    alternatives:
      - name: "迭代交换（多轮）"
        description: "不是一次性交换，而是分多轮进行：第一轮交换主色，第二轮交换副色，每轮产生中间状态。解题者需要理解迭代过程中的渐进变化。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "先合并再分裂"
        description: "配对精灵先合并为一个大精灵（叠加/并排），然后以新的颜色模式分裂回两个精灵。中间合并步骤改变了推理流程。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "链式传递（A→B→C→A）"
        description: "三组精灵形成环形传递链：A组颜色传给B组，B组传给C组，C组传给A组。每组获得的不是直接对方的颜色而是链上下游的颜色，增加追踪复杂度。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "条件性交换"
        description: "不是所有精灵都交换，只有满足特定条件（如面积大于阈值、位于特定行列）的精灵才参与交换，其余保持不变。需要先判断哪些精灵参与。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D10
    name: "精灵数量与分组基数"
    tag: multi_step
    current: "精灵数量不定，分为恰好两组，组间1:1或多:多配对"
    alternatives:
      - name: "三组颜色模式三向交换"
        description: "精灵分为三组（三种颜色模式），形成环形交换（A→B, B→C, C→A）。三组分类比二组更难识别，环形交换也比双向交换更复杂。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "一组多数vs一组少数"
        description: "两组精灵数量不对称（如3个vs1个），少数组的颜色模式被复制到多数组的所有精灵上，多数组的模式传给少数组唯一精灵。引入一对多映射。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "每个精灵独立一组（全排列）"
        description: "不分组，每个精灵有唯一颜色模式，按某种规则（如位置顺序）进行环形轮换：第1个获得第2个的模式，第2个获得第3个的，最后一个获得第1个的。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D11
    name: "背景处理"
    tag: meta
    current: "背景色保持不变，仅精灵前景像素参与颜色交换"
    alternatives:
      - name: "背景区域也参与颜色变换"
        description: "精灵周围的局部背景区域（如外接矩形内的背景像素）也随颜色模式一起交换，变为对方组的'局部背景色'。前景背景一起变换增加复杂度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "背景色随主色组变化"
        description: "整个网格的背景色根据交换结果变化——如果A组原始背景区域覆盖更大则背景变为B组关联色。全局背景变化是强视觉线索。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "交换后精灵之间的背景区域填充"
        description: "交换颜色后，配对精灵之间的背景区域被填充为某种颜色（如两个颜色模式的共有色），形成视觉连接。增加空间关系表达。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D12
    name: "颜色模式的定义粒度"
    tag: meta
    current: "颜色模式按精灵使用的颜色组合整体定义（如 teal+green 为一组模式）"
    alternatives:
      - name: "按像素级颜色排列定义模式"
        description: "颜色模式不仅看使用了哪些颜色，还看颜色的空间排列（如上红下绿 vs 左红右绿视为不同模式）。交换时需要精确复制空间排列，增加空间推理精度要求。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "按颜色占比定义模式"
        description: "模式由颜色的面积比例定义（如70%红+30%绿 vs 50%红+50%绿），交换时保持新颜色的面积比例与原模式一致。需要数量估算。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "按主色/辅色层级定义模式"
        description: "每个模式有主色（面积最大）和辅色之分，交换时只交换主色保留辅色，或只交换辅色保留主色。部分交换需要识别颜色层级。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D13
    name: "干扰项处理"
    tag: meta
    current: "输入中不包含干扰项，所有非背景精灵都参与分组和交换"
    alternatives:
      - name: "存在不参与交换的干扰精灵"
        description: "输入中混入1-2个颜色模式不属于任何组的干扰精灵（使用独特颜色），这些精灵在输出中保持不变。解题者需要先排除干扰项再执行交换。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "背景中有噪声像素"
        description: "背景中散布少量随机颜色的噪声单像素，不属于任何精灵。解题者需要在连通分量分析时忽略这些孤立像素。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "存在边框/分隔结构"
        description: "网格中有明显的边框线或十字分隔线将精灵划分为区域，这些结构线不参与交换但提供分组线索。增加结构识别层。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D14
    name: "交换后的轨迹/残留"
    tag: trajectory
    current: "无轨迹，颜色模式直接替换，原始颜色完全消失"
    alternatives:
      - name: "保留原始颜色的轮廓痕迹"
        description: "交换后在精灵边缘保留1像素宽的原始颜色轮廓，标记'这里曾经是什么颜色'。增加视觉信息丰富度，解题者需要理解轮廓保留规则。"
        source: keep_source
        source_task: 3e6067c3
        delta_lines: 20
      - name: "交换路径可视化"
        description: "在两个配对精灵之间绘制一条连线（使用交换的颜色），可视化颜色传递路径。增加了路径绘制逻辑。"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 25
      - name: "原位留下半透明影子"
        description: "交换后原始位置留下原颜色模式的淡化版本（使用较浅的同系颜色），新颜色覆盖在上面。视觉上可以同时看到新旧模式。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D15
    name: "符号编码/图例"
    tag: symbol_instructions
    current: "无符号编码，颜色模式直接从精灵颜色推断分组"
    alternatives:
      - name: "图例区域指示颜色映射"
        description: "网格边缘有一个小型图例区域，用颜色对（如左色→右色）显示交换规则。解题者需要先解读图例再应用交换。增加符号解码步骤。"
        source: legend_lookup
        source_task: 58490d8a
        delta_lines: 25
      - name: "标记像素指示分组"
        description: "每个精灵旁有一个标记像素（红或绿），相同标记色的精灵属于同一组。分组不再由精灵颜色模式隐式决定而由显式标记决定。"
        source: marker_pixels
        source_task: 9aaea919
        delta_lines: 20
      - name: "边缘色带编码交换规则"
        description: "网格顶部或左侧有一行/列色带，色带中颜色的排列顺序编码了颜色映射关系（第1色→第2色，第3色→第4色等）。需要解码色带才能执行交换。"
        source: creative
        source_task: null
        delta_lines: 30
