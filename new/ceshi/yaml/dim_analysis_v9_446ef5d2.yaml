      - name: "颜色编码的角标记"
        description: "不用 L 形，而是在矩形目标角放置 2x2 的彩色方块，方块内 4 种颜色的排列编码了角类型（TL/TR/BL/BR）和矩形的宽高比。解题者需要解读颜色排列的含义"
