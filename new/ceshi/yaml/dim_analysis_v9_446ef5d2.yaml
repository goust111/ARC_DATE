  - id: D18
    name: "碎片切割方式"
    tag: meta
    current: "矩形被切割成网格状（行列划分后可合并相邻格），所有碎片都是矩形且恰好拼成完整矩形"
    alternatives:
      - name: "不规则切割线（非轴对齐）"
        description: "切割线不必沿行列方向，可以是阶梯形或锯齿形。碎片仍然精确拼合但边界形状更复杂，视觉上呈现'碎裂'效果，边缘匹配从直线变成折线"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "重叠切割（碎片有共享像素）"
        description: "相邻碎片在边界处共享 1 行/列像素（重叠区域）。拼接时重叠部分需要一致才算匹配。改变了面积计算逻辑——总面积大于碎片面积之和"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "仅水平或仅垂直切割"
        description: "矩形只沿一个方向切割成条带状碎片（如全部水平切割）。简化了空间推理为一维排序问题，但每块碎片更长，边缘信息更丰富"
        source: creative
        source_task: null
        delta_lines: 15

