task_id: 446ef5d2
task_type: move_to_match
summary: "将散布在背景上的矩形碎片通过边缘颜色匹配拼接成一个完整矩形，矩形的一个角由 L 形标记指示，rect_col 充当通配色"

dimensions:
  - id: D1
    name: "边缘匹配条件"
    tag: match_cond
    current: "相邻碎片的接触边上，非 rect_col 像素位置和颜色必须一致；rect_col 充当通配符可匹配任何颜色"
    alternatives:
      - name: "严格全像素匹配（取消通配符）"
        description: "取消 rect_col 的通配符功能，要求接触边上所有像素（包括 rect_col）完全一致。这迫使解题者在更严格的约束下寻找唯一拼接方案，减少试错空间，提升精确推理难度"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "形状轮廓匹配（非矩形碎片嵌入凹槽）"
        description: "碎片不再是矩形，而是带有凸出和凹入的锯齿边缘（类似真实拼图）。匹配条件变为凸出部分恰好填入相邻碎片的凹入部分，形状互补。这将任务从颜色匹配转向几何形状匹配，视觉上更直观但推理更复杂"
        source: shape_match
        source_task: 16b78196
        delta_lines: 60
      - name: "旋转后边缘匹配"
        description: "碎片可以旋转 90/180/270 度后再匹配边缘颜色。解题者需要推断每块碎片的正确朝向，增加了旋转搜索的维度，显著提升难度"
        source: rotation
        source_task: fc7cae8d
        delta_lines: 35
      - name: "翻转后边缘匹配"
        description: "碎片可以水平或垂直翻转后匹配。与旋转不同，翻转会改变手性，解题者需要判断每块是否需要镜像翻转，增加了对称性推理"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 30
      - name: "颜色互补匹配"
        description: "接触边上非 rect_col 的像素不要求相同颜色，而是要求互补色（通过预定义的颜色映射表，如红配蓝、绿配黄）。解题者必须先从已完成的示例中推断出颜色映射关系，再进行拼接"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "连接器匹配"
        description: "每块碎片的边缘中间有一个特殊颜色的连接器像素，相邻碎片的连接器颜色和位置必须对齐。不再需要整条边匹配，只需连接器点对点匹配，降低了约束密度但增加了定位精度要求"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 30

  - id: D2
    name: "源对象的形状与结构"
    tag: src
    current: "散布在背景上的矩形碎片，每块 2-7 格宽高，包含 rect_col 和 interior_col 像素，至少一条边含非 rect_col 像素"
    alternatives:
      - name: "非矩形多边形碎片"
        description: "碎片不局限于矩形，可以是 L 形、T 形等多边形。拼接后仍需形成矩形，但碎片本身的不规则形状使空间推理更具挑战性。视觉上碎片轮廓更丰富多样"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "碎片带有洞（空缺区域）"
        description: "某些碎片内部含有背景色的洞，拼接时这些洞需要被其他碎片的凸出部分填充。引入了负空间匹配的概念，类似真实拼图的嵌入关系"
        source: cavity_fill
        source_task: 5dbc8537
        delta_lines: 45
      - name: "碎片尺寸统一"
        description: "所有碎片大小相同（如都是 3x4），只有内部颜色图案不同。消除了尺寸差异带来的位置线索，迫使解题者完全依赖边缘颜色推理拼接顺序"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "碎片包含干扰项"
        description: "网格上除了正确碎片外还散布有额外的干扰碎片，这些干扰碎片的边缘颜色与某些位置部分匹配但无法完成完整拼接。解题者需要先识别并排除干扰项"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D3
    name: "目标结构的形式"
    tag: dst
    current: "以 L 形标记的缺失角为起点，碎片拼接成一个完整矩形，矩形四条外边全为 rect_col"
    alternatives:
      - name: "拼接成 L 形或 T 形等非矩形目标"
        description: "最终拼接目标不是矩形，而是 L 形、十字形等预定义形状。标记可以指示整体形状类型。解题者需要推断目标轮廓后再拼接，增加了形状推理层"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "拼接成正方形（取消矩形自由度）"
        description: "最终拼接结果必须是正方形而非任意矩形。这减少了可能的目标尺寸候选，但增加了碎片切割的约束，改变了因式分解的推理策略"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "多个独立矩形目标"
        description: "网格上有多个 L 标记，每个标记对应一个独立的矩形。碎片需要分组后分别拼接到对应的标记位置。增加了分组推理——哪些碎片属于哪个目标"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "无标记角——从碎片边缘约束推断矩形位置"
        description: "去掉 L 标记，解题者需要纯粹从碎片边缘的全 rect_col 约束推断哪些边是外边缘，从而确定拼接方向和矩形位置。大幅提升推理难度"
        source: inversion
        source_task: null
        delta_lines: 30

  - id: D4
    name: "拼接后的变换操作"
    tag: transform
    current: "纯平移拼接，不做任何变换；输出网格与输入同尺寸，组装矩形放在标记角位置，其余填背景色"
    alternatives:
      - name: "拼接后重新上色"
        description: "拼接完成后，根据某种规则重新上色：例如将所有 interior_col 统一替换为 rect_col 的互补色，或按区域面积大小排序重新分配颜色。增加了后处理推理步骤"
        source: recolor
        source_task: 20270e3b
        delta_lines: 20
      - name: "拼接后裁剪输出（仅输出矩形区域）"
        description: "输出不再是与输入同尺寸的网格，而是裁剪为恰好包含组装矩形的最小网格。改变了输出尺寸推理，解题者需要确定裁剪边界"
        source: crop
        source_task: a251c730
        delta_lines: 10
      - name: "拼接后擦除标记"
        description: "拼接完成后 L 标记像素被擦除为背景色，输出中不保留标记。解题者需要意识到标记仅作为定位工具，最终输出不包含它"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 5
      - name: "拼接后镜像反射"
        description: "组装完成的矩形需要沿某个轴（由标记角位置决定）进行镜像翻转后再放置。增加了方向推理的复杂度"
        source: reflection
        source_task: b10624e5
        delta_lines: 15

  - id: D5
    name: "轨迹/源碎片去留"
    tag: trajectory
    current: "碎片移动后从原位消失，输出中只有组装后的矩形和背景"
    alternatives:
      - name: "保留源碎片原位"
        description: "碎片在原位保留不变，同时在标记角处放置组装好的矩形。输出同时显示散布的碎片和组装结果，解题者需要理解这是一种'复制并组装'而非'移动并组装'"
        source: keep_source
        source_task: 247ef758
        delta_lines: 8
      - name: "碎片沿移动路径留下轨迹"
        description: "每块碎片从原位移动到目标位时，沿路径留下单色轨迹线。视觉上可以看到碎片的移动方向，增加了输出的信息密度，也暗示了空间推理的路径"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 30
      - name: "碎片消失后原位留下轮廓线"
        description: "碎片离开后，在原位用特殊颜色绘制其外接矩形的边框轮廓（空心框）。视觉上标记了碎片曾经的位置，帮助验证但也增加输出复杂度"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D6
    name: "输出网格形状"
    tag: grid_shape
    current: "输出与输入网格尺寸相同，组装矩形放置在标记角对应位置，其余区域填充背景色"
    alternatives:
      - name: "紧凑裁剪至矩形区域"
        description: "输出仅为组装后矩形本身，裁去所有背景区域。输出尺寸变为矩形的宽高，解题者需要推断输出尺寸与碎片总面积的关系"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 8
      - name: "自适应扩展网格"
        description: "如果组装矩形超出输入网格边界，则自动扩展网格尺寸以容纳。标记位置可以靠近网格边缘，解题者需要判断是否需要扩展以及扩展方向"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 15
      - name: "碎片打包排列输出"
        description: "输出不是将矩形放在原位，而是将所有碎片按行列顺序紧凑排列在一个新网格中（碎片之间有 1 像素间隔），展示正确的拼接顺序但不实际拼合。解题者需要推断排列规则"
        source: packed_grid
        source_task: 58f5dbd5
        delta_lines: 25

  - id: D7
    name: "多步拼接策略"
    tag: multi_step
    current: "从锚定碎片（包含标记角的碎片）开始，逐块附加碎片直到矩形完成；使用回溯搜索找到唯一解"
    alternatives:
      - name: "由外向内逐层拼接"
        description: "先拼外圈碎片（所有边缘全为 rect_col 的碎片优先），再逐层向内拼接。改变了拼接顺序的推理——解题者需要识别哪些碎片属于外圈。视觉上可以看到'剥洋葱'式的层次结构"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "行优先逐行拼接"
        description: "碎片必须严格按行从上到下、从左到右的顺序逐一放置。每块碎片只需与左侧和上方已放置的碎片边缘匹配。简化了搜索空间但要求解题者推断行填充规则"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "两阶段拼接：先列后行"
        description: "第一步：将碎片按列分组并拼成垂直条带；第二步：将条带水平拼接成完整矩形。每步独立验证边缘匹配。分解了问题但增加了分组推理"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "链式顺序拼接（无回溯）"
        description: "碎片按特定顺序（如面积从大到小、或颜色编号从小到大）逐一贪心放置，不允许回溯。解题者需要推断排序规则以确定拼接顺序"
        source: chaining
        source_task: 78332cb0
        delta_lines: 20

  - id: D8
    name: "标记系统的形式"
    tag: symbol_instructions
    current: "3 像素 L 形标记（2x2 缺一角），使用独特颜色（仅出现 3 次），缺失角指示矩形的一个顶点"
    alternatives:
      - name: "单像素标记+方向编码"
        description: "标记简化为单个特殊颜色像素，矩形的展开方向由该像素相对于网格中心的象限决定（左上象限向右下展开等）。减少了标记的信息量，迫使解题者从位置推断方向"
