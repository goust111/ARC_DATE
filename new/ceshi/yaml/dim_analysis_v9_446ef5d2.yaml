      - name: "极低填充率（碎片内大部分是 rect_col）"
        description: "碎片内部仅 5-15% 为彩色像素，大部分是 rect_col。边缘匹配信息极少，通配符效果更强，解题者需要从稀疏的彩色线索中推理。大幅提升难度"
        source: inversion
