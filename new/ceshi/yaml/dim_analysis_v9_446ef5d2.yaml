    alternatives:
      - name: "极高填充率（碎片内几乎全是彩色）"
        description: "碎片内部 70-95% 为非 rect_col，rect_col 仅出现在边缘的少数位置。边缘匹配更容易（彩色信息更多），但视觉上更花哨。改变了信息密度的平衡"
