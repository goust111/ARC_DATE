        source_task: null
        delta_lines: 25
      - name: "十字形标记指示中心"
        description: "标记改为 5 像素的十字形（中心+四方向各一格），放置在矩形中心而非角落。解题者需要从中心位置反推矩形四个角的位置，结合碎片面积确定尺寸"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "边线标记指示两条边"
        description: "标记不是点或 L 形，而是两条短线段分别标示矩形的一条水平边和一条垂直边的位置。解题者从两条线段的交点推断角位置，从线段长度获取尺寸线索"
        source: creative
        source_task: null
        delta_lines: 30

