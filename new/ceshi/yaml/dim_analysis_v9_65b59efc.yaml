        source_task: null
        delta_lines: 12
      - name: "分隔线宽度从1像素增加到2像素"
        description: "每条分隔线占据2列/行而非1列/行，虚线图案在2像素宽度上重复。网格更大但信息密度降低，影响坐标映射计算"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D11
