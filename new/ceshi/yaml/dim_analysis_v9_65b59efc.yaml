        source: rotation_flip
        source_task: a25697e4
        delta_lines: 15
      - name: "模板缩放后印章"
        description: "模板先按2倍缩放（每个像素变成2x2块），再铺贴到输出的对应位置（输出块大小相应变大为2Nx2N）。解题者需发现缩放因子"
