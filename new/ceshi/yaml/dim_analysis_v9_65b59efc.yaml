        delta_lines: 8
      - name: "无分隔线：依靠模板间距推断边界"
        description: "移除所有显式分隔线，模板之间直接相邻（无gap列/行）。解题者需从模板颜色边界和空白区域自行推断分段结构，难度大幅增加"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "双色分隔线：水平和垂直分隔线使用不同颜色"
        description: "水平分隔行用颜色A、垂直分隔列用颜色B，两种颜色在交叉点形成十字花色。视觉上更丰富，解题者需正确识别两种分隔色"
