      - name: "输出裁剪为紧凑外接矩形"
        description: "输出不再固定为(NxN)x(NxN)，而裁剪到所有非背景像素的最小外接矩形。解题者需推断完整输出后再裁剪"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 10

  - id: D12
    name: "变换：模板印章的几何变换"
    tag: transform
    current: "模板掩膜直接铺贴，不进行任何旋转或翻转"
    alternatives:
      - name: "根据输出块位置旋转模板"
        description: "输出块的行列索引决定模板的旋转角度：(0,*)行不旋转、(1,*)行旋转90度、(2,*)行旋转180度、(3,*)行旋转270度（或按列/对角线分配旋转）。解题者需发现位置-旋转的映射规则"
