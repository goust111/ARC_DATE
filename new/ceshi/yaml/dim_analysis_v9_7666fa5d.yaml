task_id: 7666fa5d
task_type: move_to_match
summary: "在16x16网格上识别位于反对角线(r+c=k)上的平行线段，沿主对角线(r-c=b)方向在相邻线段之间填充红色，形成平行四边形填充区域"

dimensions:
  - id: D1
    name: "匹配条件：投影配对机制"
    tag: match_cond
    current: "s.left_projection_point == d — 右侧对角线段的端点沿主对角线方向投影到左侧平行线段上，配对条件为投影点落在另一条线段的b范围内"
    alternatives:
      - name: "颜色编码配对替代投影配对"
        description: "每条反对角线段使用不同颜色，填充区域的颜色由相邻两条线段的颜色组合决定（如通过颜色映射表）。解题者需发现颜色对应规则而非几何投影关系，将空间推理转变为颜色编码推理"
        source: color_match
        source_task: 2c181942
        delta_lines: 40
      - name: "端点颜色匹配决定填充连接"
        description: "每条线段的两个端点像素标记为特殊颜色，只有端点颜色相同的线段之间才进行填充。解题者需识别端点颜色并建立配对关系，而非依赖几何邻近性"
        source: endpoint_matching
        source_task: 97d7923e
        delta_lines: 45
      - name: "线段长度排序匹配"
        description: "不再按反对角线k值的顺序填充，而是按线段长度从长到短排序后，在排序相邻的线段对之间填充。长度相同时按k值消歧。解题者需先排序再填充，增加了多步推理"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 30
      - name: "镜像对称匹配"
        description: "线段以网格中心为对称点成对出现，填充区域由对称配对的线段之间的空间决定。解题者需发现对称结构而非简单的线性排列关系"
        source: mirror_symmetry
        source_task: 4c416de3
        delta_lines: 50

  - id: D2
    name: "源对象：线段方向"
    tag: src
    current: "反对角线段(r+c=k为常数)——每条线段沿左上到右下方向延伸，步长为(r+1,c-1)"
    alternatives:
      - name: "主对角线段替代反对角线段"
        description: "线段改为沿主对角线方向(r-c=b为常数)排列，步长为(r+1,c+1)。填充方向相应变为沿反对角线方向扫描。这是方向的完全反转，保持算法结构不变但改变视觉外观和坐标推理"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "水平线段替代对角线段"
        description: "线段改为水平方向(行固定)，填充在垂直方向上相邻水平线段之间进行（每列独立填充同行之间的空白）。将对角线推理简化为行列推理，但保持'平行线段间填充'的核心逻辑"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "垂直线段替代对角线段"
        description: "线段改为垂直方向(列固定)，填充在水平方向上相邻垂直线段之间进行。与水平线段方案正交，同样简化坐标系但改变扫描方向为逐行扫描"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "混合方向线段"
        description: "同一题中同时包含反对角线段和主对角线段，填充规则变为：同方向的线段之间按原规则填充，不同方向的线段相交处形成特殊图案。大幅增加几何推理复杂度"
        source: creative
        source_task: null
        delta_lines: 60

  - id: D3
    name: "源对象：线段结构"
    tag: src
    current: "每条线段是连续的反对角线像素序列，长度2-9个像素，无间断"
    alternatives:
      - name: "虚线段替代实线段"
        description: "线段中每隔一个像素留空(交替着色与背景色)，形成虚线效果。填充规则不变，但解题者需将虚线识别为单一线段而非多个短线段。增加了对象识别的难度"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "端点标记线段"
        description: "每条线段的两个端点使用与线段主体不同的颜色（如线段为绿色、端点为黄色）。端点颜色提供额外线索但也增加颜色解析复杂度。填充规则基于线段整体位置不变"
        source: marker_pixels
        source_task: 9aaea919
        delta_lines: 35
      - name: "线段由成对的单像素标记表示"
        description: "每条线段不再显示完整像素序列，仅显示两个端点像素。解题者需推断这两个同色像素表示一条隐含的线段，然后在隐含线段之间填充。极大增加推理难度"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 40

  - id: D4
    name: "目标位置：填充区域定义"
    tag: dst
    current: "沿主对角线方向(b=r-c固定)，在相邻反对角线段之间严格内部的背景色像素位置填充红色"
    alternatives:
      - name: "填充包含线段像素（覆盖式填充）"
        description: "填充区域不再保留原始线段像素，而是将整个平行四边形区域（包括线段本身）都覆盖为红色。这是当前'保留线段像素'规则的反转，简化了填充逻辑但改变了视觉结果"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "仅填充边界（轮廓式填充）"
        description: "不填满整个平行四边形区域，只填充平行四边形的边界轮廓（即连接相邻线段端点的边界线）。将'面积填充'变为'轮廓绘制'，解题者需理解封闭区域的边界概念"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "填充扩展到最外侧线段之外"
        description: "除了在线段之间填充外，还在最左侧线段的左边和最右侧线段的右边（沿主对角线方向）填充到网格边缘。这是当前'仅内部填充'的扩展版，解题者需推断外部扩展规则"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "间隔填充（棋盘式）"
        description: "在相邻线段之间的填充区域中，只填充与线段端点同奇偶性的像素位置，形成棋盘格效果。增加了坐标奇偶性推理要求"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D5
    name: "变换操作：填充颜色规则"
    tag: transform
    current: "所有填充区域统一使用红色(color 2)，不受线段颜色影响"
    alternatives:
      - name: "填充颜色与线段颜色相同"
        description: "填充区域使用与相邻线段相同的颜色而非固定红色。如果两侧线段颜色不同，则使用左侧（较小k值）线段的颜色。将固定颜色变为动态颜色选择，但在当前单色线段设计中等价，需配合多色线段方案才更有趣"
        source: recolor
        source_task: 20270e3b
        delta_lines: 15
      - name: "交替颜色填充"
        description: "多个相邻线段之间的不同填充区域使用交替颜色（如第一个区域红色、第二个区域蓝色、第三个区域红色...）。解题者需发现颜色交替模式，增加了规律发现的维度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "渐变色填充"
        description: "填充颜色根据距离最近线段的距离在两种颜色之间渐变——靠近左侧线段使用颜色A，靠近右侧线段使用颜色B。在ARC离散颜色空间中可实现为离散色阶（如红、橙、黄三段），增加空间距离感知"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "填充颜色由线段长度编码"
        description: "填充颜色由相邻两条线段的某种属性（如较短线段的长度）通过查找表决定。长度为2→红色，长度为3→绿色等。解题者需建立长度到颜色的映射关系"
        source: size_encoded_parameter
        source_task: 6ffbe589
        delta_lines: 30

  - id: D6
    name: "轨迹处理：源像素保留策略"
    tag: trajectory
    current: "保留源线段像素不变（线段颜色不被红色覆盖），仅填充背景色位置"
    alternatives:
      - name: "移除源线段（仅保留填充）"
        description: "填充完成后，原始线段像素恢复为背景色，只留下红色填充区域。这是'保留源'的反转，输出中看不到原始线段，解题者需从纯填充形状推断原始线段位置"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "源线段变色为第三种颜色"
        description: "填充完成后，原始线段像素统一变为一种新颜色（如黄色），与填充色和背景色都不同。产生三色输出，增加视觉层次和颜色角色辨别难度"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 15
      - name: "连续轨迹：线段向填充方向延伸涂色"
        description: "线段不仅保留原位，还在填充过程中沿其延伸方向（沿反对角线方向）继续涂上线段颜色，形成从线段出发的射线轨迹。填充区域在射线之间"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 40

  - id: D7
    name: "网格形状与输出裁剪"
    tag: grid_shape
    current: "输入输出使用相同的16x16网格，不裁剪不扩展"
    alternatives:
      - name: "紧凑裁剪到填充区域"
        description: "输出网格裁剪为仅包含所有填充像素和线段像素的最小外接矩形。减小输出尺寸，解题者需同时推断填充规则和裁剪规则"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 15
      - name: "输出仅保留填充区域的布尔掩码"
        description: "输出网格中仅显示填充区域（红色）和背景色，所有线段像素也替换为背景色。相当于提取填充掩码，解题者需理解填充是唯一要计算的目标"
        source: crop
        source_task: a251c730
        delta_lines: 10
      - name: "动态网格大小"
        description: "网格大小不固定为16x16，而是根据线段的空间分布动态选择（如12x12到20x20），使得线段始终能合理分布。增加解题者对不同尺度题目的泛化能力要求"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D8
    name: "多步处理：填充顺序与迭代"
    tag: multi_step
    current: "单步处理——对每条主对角线独立扫描，收集活跃线段后一次性填充所有区间"
    alternatives:
      - name: "逐层迭代填充"
        description: "分多轮处理：第一轮只填充最近的两条线段之间，第二轮填充次近的线段之间，以此类推。每轮填充的结果会影响下一轮的线段识别（如被填充的区域变成新的'线段'边界）。引入迭代推理"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "先连接后填充（两步处理）"
        description: "第一步：用线段颜色连接同一反对角线上断开的线段片段（跨越间隙）。第二步：在连接后的完整线段之间进行填充。增加了前置处理步骤，需要理解线段合并逻辑"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "按线段距离顺序处理"
        description: "从距离最近的线段对开始填充，然后逐渐处理距离更远的线段对。不同距离的线段对使用不同的填充颜色。增加了顺序依赖和多颜色规则"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D9
    name: "线段间的空间关系：平行性约束"
    tag: meta
    current: "所有线段均位于反对角线上(r+c=常数)，因此所有线段天然平行"
    alternatives:
      - name: "允许非平行线段"
        description: "线段可以分别在反对角线和主对角线方向上存在，形成交叉网格。填充规则变为在封闭区域内填充（flood fill封闭区域），解题者需识别由交叉线段围成的封闭多边形"
        source: creative
        source_task: null
        delta_lines: 60
      - name: "线段方向由颜色编码"
        description: "使用两种不同颜色的线段，一种颜色表示反对角线方向，另一种表示主对角线方向。填充仅在同方向同颜色的相邻线段之间进行。增加了颜色→方向的解码推理"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "平行线段对之间要求最小间距"
        description: "只有当两条平行线段之间的距离(k值差)大于某个阈值时才进行填充，距离太近的线段对之间不填充。解题者需发现距离阈值规则（可通过示例推断），增加了数值约束推理"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D10
    name: "线段数量与拓扑：分段分裂"
    tag: meta
    current: "4-6个连通分量（8连通），可能有同一反对角线上的分裂线段（同k值但b范围不重叠），使用4-5条不同的反对角线"
    alternatives:
      - name: "严格单线段约束"
        description: "每条反对角线上最多一条线段，禁止分裂。减少线段数量和拓扑复杂度，使填充区域更规则（纯平行四边形），降低对象识别难度但保持填充推理"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "密集分裂线段"
        description: "大幅增加线段分裂概率和分裂数量——每条反对角线可分裂为3段或更多。填充仍在活跃线段间进行，但分裂导致的间隙使填充区域呈现复杂的不规则形状"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "仅使用两条反对角线"
        description: "将反对角线数量限制为恰好2条（最少有效配置），形成单一填充区域。极简版本便于理解核心规则，但缺少多区域的复杂性"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D11
    name: "填充规则：扫描方向"
    tag: meta
    current: "沿主对角线方向(b=r-c固定)扫描，对每条主对角线独立收集活跃反对角线段并填充"
    alternatives:
      - name: "沿反对角线方向扫描填充"
        description: "改为沿反对角线方向(k=r+c固定)扫描，收集同一反对角线上不同位置的线段（此时'线段'定义在主对角线上），在线段间填充。将扫描方向旋转90度，保持算法结构但改变几何解读"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "双向扫描填充"
        description: "同时沿主对角线和反对角线两个方向扫描，填充区域为两个方向填充结果的交集（或并集）。产生更复杂的填充图案，解题者需理解双重扫描逻辑"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "逐行逐列正交扫描"
        description: "不沿对角线方向而是沿水平行方向扫描——对每一行，找出该行上被线段覆盖的像素，在同行的线段像素之间填充。将对角线逻辑简化为正交逻辑，大幅降低坐标推理难度"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D12
    name: "背景色与颜色体系"
    tag: meta
    current: "背景色为azure(8)，线段颜色为单一非背景非红色(可为3/4/9等)，填充色固定为红色(2)"
    alternatives:
      - name: "多色线段系统"
