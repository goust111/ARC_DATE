        source: creative
        source_task: null
        delta_lines: 20

  - id: D13
    name: "线段重叠范围约束"
    tag: meta
    current: "相邻反对角线上的线段必须有至少2个b值的重叠范围(OVERLAP_MIN_B=2)，确保它们之间存在可填充区域"
    alternatives:
      - name: "无重叠约束（允许无填充线段对）"
        description: "移除相邻线段的b范围重叠要求。某些线段对之间可能没有公共b值因此无填充区域，解题者需判断哪些线段对之间应该填充。增加了条件推理"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "完全包含约束"
        description: "要求较短线段的b范围完全被较长线段的b范围包含（而非仅部分重叠），填充区域形成梯形而非平行四边形。改变几何形状，增加视觉辨别难度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "大重叠要求"
        description: "将最小重叠b值增加到6或更多，迫使线段高度对齐，填充区域变得更宽更规则。这是当前约束的强化版本，产生更紧凑的填充图案"
        source: creative
        source_task: null
        delta_lines: 5

  - id: D14
    name: "符号编码：控制信息"
    tag: symbol_instructions
    current: "无符号编码——任务规则完全由空间几何关系隐含定义，无图例、标记像素或编码控制参数"
    alternatives:
      - name: "图例指示填充颜色"
        description: "在网格角落放置一个小型图例区域，展示'线段颜色→填充颜色'的映射关系。当任务扩展到多色线段时，图例帮助解题者确定每种线段颜色对应的填充颜色"
        source: legend_lookup
        source_task: 58490d8a
        delta_lines: 40
      - name: "标记像素指示填充方向"
        description: "在每条线段附近放置一个红色标记像素，标记像素相对于线段的位置（上方/下方）指示填充方向——朝标记像素方向填充。如果没有标记则不填充。增加了方向编码推理"
        source: marker_pixels
        source_task: 9aaea919
        delta_lines: 45
      - name: "控制像素指示线段连接顺序"
        description: "在网格边缘放置与线段同色的控制像素，控制像素的排列顺序指示线段之间的配对顺序（而非按k值自然排序）。解题者需先解码控制信息再执行填充"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 50

  - id: D15
    name: "干扰项：非参与元素"
    tag: meta
    current: "无干扰项——网格中所有非背景像素都是有效线段的一部分，参与填充计算"
    alternatives:
      - name: "添加孤立干扰像素"
        description: "在网格中散布与线段同色的孤立像素（不属于任何线段的8连通分量），这些像素不参与填充计算。解题者需通过连通分量大小过滤掉孤立像素，增加噪声鲁棒性要求"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "添加非对角线方向的干扰线段"
        description: "添加水平或垂直方向的同色线段，这些线段不在任何反对角线上因此不参与填充。解题者需发现'只有反对角线方向的线段才有效'的规则"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "添加不同颜色的无关线段"
        description: "在网格中放置另一种颜色的对角线段，这些线段不参与填充（只有特定颜色的线段才触发填充）。解题者需识别哪种颜色是'活跃'颜色"
