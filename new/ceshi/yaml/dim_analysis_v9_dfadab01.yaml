        source_task: null
        delta_lines: 10
      - name: "使用6种或更多标记色"
        description: "扩展到6种以上标记色，对应更多字形图案。解题者需要记忆和区分更多的映射关系，字形之间的视觉差异可能更微妙。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "标记色数量逐题递增"
        description: "训练示例中标记色种类逐渐增加（示例1用2种，示例2用3种，测试用4种或更多）。解题者需要识别递增模式并预测测试中将出现多少种标记色。"
        source: creative
        source_task: null
        delta_lines: 15
