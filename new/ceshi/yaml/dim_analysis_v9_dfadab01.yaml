task_id: dfadab01
task_type: transform_in_place
summary: "输入中的单像素标记按固定字形字典被替换为对应的4x4图案（标记色->图案色），样本字形及其右下标签在输出中消失，超出网格边缘的部分被裁剪"

dimensions:
  - id: D1
    name: "字形替换变换方式"
    tag: transform
    current: "每个标记像素被替换为固定4x4字形图案，标记位置为字形左上角，字形使用与标记色不同的固定输出色"
    alternatives:
      - name: "字形放大替换"
        description: "将每个标记替换为更大的字形（如6x6或8x8），图案按比例放大。解题者需要识别放大倍数与图案的对应关系，同时网格空间约束更紧张，裁剪情况更频繁，增加了空间推理复杂度。"
        source: pixel_enlargement
        source_task: bf45cf4b
        delta_lines: 20
      - name: "字形旋转后替换"
        description: "每个标记的字形在放置前旋转特定角度（如顺时针90度），旋转角度由标记在网格中的象限位置决定（左上0度，右上90度，左下270度，右下180度）。解题者需要先推断旋转规则再匹配字形，显著增加推理步骤。"
        source: conditional_rotation
        source_task: 291dc1e1
        delta_lines: 25
      - name: "字形镜像替换"
        description: "标记的字形在放置时根据其所在行/列的奇偶性进行水平或垂直翻转。偶数行正常放置，奇数行水平翻转。解题者需要观察字形方向的系统性变化并推断翻转规则。"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 20
      - name: "字形嵌套替换"
        description: "将标记替换为嵌套结构：外层是该标记色的4x4字形，内部2x2区域不是背景色而是填充另一个标记色的微缩字形（如2x2版本）。解题者需要识别双层嵌套的对应关系，类似分形思维。"
        source: nested_frames
        source_task: 45a5af55
        delta_lines: 30
      - name: "字形叠加合成"
        description: "当两个标记的4x4字形区域发生重叠时，重叠像素取两个字形颜色中较大的色号值（或特定合成规则如异或）。解题者需要理解叠加规则，并在重叠区域推断正确的颜色。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D2
    name: "标记色与字形色的映射关系"
    tag: transform
    current: "固定全局映射：标记色2->字形色4（空心方块），3->1（菱形），5->6（对角块），8->7（X形），映射关系跨所有示例一致"
    alternatives:
      - name: "标记色保持不变"
        description: "字形图案保持各自的几何形状，但输出颜色与标记色相同（如色2标记产生色2的空心方块），而非映射到不同颜色。消除了颜色映射推理，转而突出纯几何图案识别。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "样本字形定义局部映射"
        description: "每道题的颜色映射由样本字形区域动态定义，不再使用全局固定映射。不同题目中同一标记色可能对应不同字形。解题者必须先解读样本区域才能推断映射，类似图例解码。"
        source: template_lookup
        source_task: 195c6913
        delta_lines: 30
      - name: "颜色循环映射"
        description: "标记色到字形色的映射不固定，而是按标记在网格中出现的顺序（从左到右、从上到下扫描）循环使用一个调色板。第1个遇到的标记用字形色A，第2个用B，依此类推并循环。解题者需要推断扫描顺序和循环规则。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "相邻标记交换颜色"
        description: "相邻（曼哈顿距离最近）的两个不同色标记的字形颜色交换：A标记放置B的字形色，B标记放置A的字形色。未配对的标记使用默认色。引入空间配对推理。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 30

  - id: D3
    name: "标记来源对象"
    tag: src
    current: "散布在网格中的单像素标记，使用字形字典中的颜色（2、3、5、8），标记位置即字形放置的左上角"
    alternatives:
      - name: "2x2色块标记"
        description: "标记不再是单像素，而是2x2同色色块。字形放置位置仍以色块左上角为准，但字形大小可能需调整以适配更大的标记。解题者需识别色块-字形的尺度关系。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "网格边缘控制像素"
        description: "标记像素仅出现在网格的四条边缘上，其行列坐标编码字形放置位置（如边缘行号=字形行号，列号由另一条边缘上的同色像素确定）。解题者需要通过边缘坐标的交叉定位来推断放置位置。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 35
      - name: "对角线像素对标记"
        description: "标记由两个同色像素组成，它们位于某矩形区域的对角。字形放置在该矩形的中心位置。解题者需要先配对同色对角像素，再计算中心坐标。"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 30
      - name: "标记位置为字形中心而非左上角"
        description: "标记像素代表字形的中心位置而非左上角。4x4字形的中心向上和向左各偏移2格放置。改变了坐标对齐逻辑，解题者需要推断偏移规则。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "十字形标记编码字形类型"
        description: "标记不是单像素，而是小十字形（中心+上下左右各1像素），十字臂的数量（1-4）编码对应哪种字形。解题者需要计数十字臂来确定字形类型，而非直接看颜色。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D4
    name: "样本字形展示与消失"
    tag: symbol_instructions
    current: "输入中可能包含一个样本字形（完整4x4图案）及其右下角一格处的单像素标签（标签颜色=该字形对应的标记色），样本和标签在输出中消失"
    alternatives:
      - name: "样本字形保留在输出中"
        description: "反转当前的消失规则：样本字形在输出中保留不变，仅标签消失。解题者需要区分'原始样本'和'新生成的字形实例'，而两者视觉上完全相同，增加了辨别难度。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "多个样本字形作为完整图例"
        description: "输入中展示所有字形类型的样本（如4个样本排成一列），每个样本旁有对应标签色。形成完整的图例区域，解题者必须通读整个图例才能解码映射关系。样本不使用固定字形字典，而是每题随机生成图案。"
        source: glyph_decoding
        source_task: 136b0064
        delta_lines: 40
      - name: "样本字形编码为调色板条"
        description: "样本不以4x4图案形式展示，而是压缩为网格边缘的2xN调色板条，每行一对颜色表示'标记色->字形色'的映射。解题者需要解读调色板条并结合固定字形形状推断输出。"
        source: symbol_instructions
        source_task: dbff022c
        delta_lines: 30
      - name: "标签位于样本字形左上角"
        description: "标签像素从右下角改为左上角（与字形的[0,0]位置重合，该位置恰好是背景色的字形可正常显示）。改变了样本区域的识别方式和标签定位规则。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D5
    name: "字形的固定几何形状"
    tag: meta
    current: "四种固定4x4字形图案：空心方块（边框填充）、菱形（对角连接环）、对角块（2x2块对角排列）、X形（角和中心交叉）"
    alternatives:
      - name: "字形为旋转变体"
        description: "四种字形不是独立设计，而是同一基础图案的0/90/180/270度旋转。解题者需要识别旋转关系而非独立记忆四种图案，推理模式从'查表'变为'旋转推断'。"
        source: rotation
        source_task: 2b83f449
        delta_lines: 20
      - name: "字形为非对称图案"
        description: "将对称的4x4字形替换为非对称图案（如L形、阶梯形等）。非对称字形在旋转/翻转后会产生不同视觉效果，可与D1的旋转替换维度组合产生更多变化。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "字形大小可变"
        description: "不同标记色对应不同大小的字形（如色2对应3x3，色3对应4x4，色5对应5x5）。解题者需要同时推断颜色-图案映射和颜色-尺寸映射，增加了维度。"
        source: size_encoded_parameter
        source_task: 6ffbe589
        delta_lines: 25
      - name: "字形为3x3而非4x4"
        description: "所有字形缩小为3x3图案，标记间距也相应缩小。更小的字形在视觉上更难辨认，但允许在同样大小的网格中放置更多标记，产生更密集的输出图案。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D6
    name: "网格边缘裁剪规则"
    tag: grid_shape
    current: "字形放置时如果超出网格边界，超出部分被裁剪（只显示网格内的部分）"
    alternatives:
      - name: "网格自动扩展"
        description: "不裁剪超出部分，而是自动扩展网格尺寸以容纳所有字形。输出网格可能比输入大。解题者需要推断网格扩展量，改变了对输出尺寸的预期。"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 25
      - name: "环绕放置（toroidal）"
        description: "超出网格边缘的部分从对面边缘环绕进入（类似贪吃蛇的环面拓扑）。字形可能在网格的相对边缘'分裂'显示。解题者需要理解环面映射规则。"
        source: path_wrapping
        source_task: 88bcf3b4
        delta_lines: 30
      - name: "紧凑裁剪输出"
        description: "输出不保持原始网格大小，而是紧凑裁剪到所有字形的外接矩形。输出尺寸由字形分布决定，消除了周围的空白边距。"
        source: tight_crop
        source_task: bf45cf4b
        delta_lines: 20
      - name: "禁止裁剪——仅处理完全在网格内的标记"
        description: "反转裁剪规则：字形超出边界的标记直接忽略不处理（等同于该标记不存在）。解题者需要判断哪些标记会被跳过，引入了基于位置的条件过滤。"
        source: conditional_deletion
        source_task: 8b9c3697
        delta_lines: 15

  - id: D7
    name: "标记的空间排列模式"
    tag: meta
    current: "标记在网格中呈规则的等间距排列（如每隔4或5个单元格），形成网格状分布"
    alternatives:
      - name: "标记随机散布"
        description: "标记不再等间距排列，而是在网格中不规则散布（但保证字形之间有足够间距不重叠）。解题者不能依赖规则间距模式来推断标记位置，必须逐个定位。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "标记沿对角线排列"
        description: "标记沿主对角线或反对角线排列，形成阶梯状分布。字形在对角方向部分重叠成为可能，输出呈现对角条带状视觉效果。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "标记排列编码数字信息"
        description: "标记的行列间距本身编码了信息（如间距3表示使用旋转，间距4表示不旋转）。解题者需要先测量间距再推断变换参数。空间布局从纯位置信息升级为语义信息载体。"
        source: symbol_instructions
        source_task: null
        delta_lines: 30

  - id: D8
    name: "字形字典中标记色与字形色的数值关系"
    tag: meta
    current: "标记色与字形色形成固定配对：2->4、3->1、5->6、8->7，配对关系为全局常量"
    alternatives:
      - name: "标记色+固定偏移=字形色"
        description: "字形色=标记色+2（mod 10），即颜色通过固定算术变换得到。解题者需要发现数值规律而非死记映射表。但注意ARC谜题中人类看到的是颜色而非数字，所以需要确保颜色对之间存在可视觉辨认的系统性关系。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "字形色由相邻标记决定"
        description: "字形的输出颜色不固定，而是取决于与该标记最近的另一个标记的颜色。引入了空间关系决定属性的机制，解题者需要为每个标记找到其最近邻并确定颜色。"
        source: attribute_transfer
        source_task: d35bdbdc
        delta_lines: 30
      - name: "字形色由标记所在象限决定"
        description: "输出颜色由标记在网格中的位置（四个象限之一）决定，而非由标记色决定。同色标记在不同象限产生不同颜色的字形。解题者需要同时推断位置规则和字形图案规则。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D9
    name: "字形放置的多步处理顺序"
    tag: multi_step
    current: "单步处理：所有标记同时被替换为字形，无先后顺序依赖"
    alternatives:
      - name: "按颜色分批次处理"
        description: "先放置所有色2标记的字形，再放置色3的，依此类推。后放置的字形可以覆盖先放置的字形。当字形区域重叠时，处理顺序决定最终可见结果。解题者需要推断颜色优先级。"
        source: multi_step
        source_task: 271d71e2
        delta_lines: 20
      - name: "先消除样本再放置字形"
        description: "明确分为两步：第一步识别并擦除样本字形区域和标签，第二步再放置所有标记的字形。强调了两步串行的处理流程，确保样本区域不影响字形放置。"
        source: multi_step
        source_task: d59b0160
        delta_lines: 15
      - name: "迭代放置：字形触发新标记"
        description: "第一轮放置所有原始标记的字形；如果某个字形的角落像素颜色恰好是另一种标记色，则视为新标记并在第二轮继续放置字形。迭代直到无新标记产生。引入链式反应机制，解题者需要模拟多轮传播。"
        source: seed_propagation
        source_task: 800d221b
        delta_lines: 35
      - name: "从外向内逐层放置"
        description: "先放置最靠近网格边缘的标记字形，再逐层向内处理。内层字形可能被外层字形的边缘遮挡。解题者需要推断处理顺序与空间位置的关系。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D10
    name: "字形之间的重叠处理"
    tag: meta
    current: "标记间距足够大，字形之间通常不重叠；若发生边缘裁剪则简单截断"
    alternatives:
      - name: "重叠区域取颜色混合"
        description: "当两个字形区域重叠时，重叠像素使用两者中非背景色的那个（若都非背景则取色号较大的）。解题者需要理解混合规则并在重叠区域反推原始字形。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "重叠区域标记为特殊颜色"
        description: "重叠像素统一变为一种特殊颜色（如红色9），非重叠部分正常显示。这使重叠成为显性信息，解题者可以从特殊颜色的分布反推字形布局。"
        source: collision_detection
        source_task: 409aa875
        delta_lines: 20
      - name: "密集排列允许大量重叠"
        description: "标记间距缩小到字形尺寸以下（如间距2而非4），使得每个字形都与邻居重叠。输出变成密集的交织图案，解题者需要从高度重叠的结果中分辨各字形的贡献。"
        source: tile_composition
        source_task: 7491f3cf
        delta_lines: 25

  - id: D11
    name: "样本字形的数量与位置"
    tag: symbol_instructions
    current: "0或1个样本字形出现在输入中，位置不固定（可能在角落或中间区域），部分示例无样本"
