task_id: 20270e3b
task_type: move_to_match
summary: "两个精灵各带一个水平连接器（ctrl色横条），将plug精灵平移使其连接器对齐到base精灵连接器正上方一行进行对接，连接器重新着色为body色，最终紧凑裁剪输出。"

dimensions:
  - id: D1
    name: "连接器匹配条件"
    tag: match_cond
    current: "两个精灵的连接器具有相同的归一化形状（相同长度的ctrl色水平条），按形状/颜色匹配"
    alternatives:
      - name: "颜色匹配而非形状匹配"
        description: "每个精灵拥有不同长度的连接器但颜色不同，通过连接器颜色（而非形状）决定配对。解题者需要关注颜色属性而非几何形状，改变推理重点。"
        source: color_match
        source_task: 2c181942
        delta_lines: 20
      - name: "连接器形状嵌合匹配"
        description: "连接器不再是简单的水平条，而是具有凹凸轮廓的锯齿形边缘，plug的连接器轮廓必须与base的连接器轮廓互补嵌合（如拼图块）。需要空间推理来判断哪两个边缘互补。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 35
      - name: "连接器长度+颜色双重匹配"
        description: "存在多对精灵（如4个精灵形成2对），每个连接器有不同颜色和长度，必须同时匹配颜色和长度才能配对。增加消歧难度，解题者需要同时考虑两个属性。"
        source: size_match
        source_task: 2c181942
        delta_lines: 30
      - name: "边缘行列对齐匹配"
        description: "不使用连接器，而是通过精灵边缘的前景像素行/列模式匹配：plug的顶部边缘前景列位置必须与base的底部边缘前景列位置一致，类似瓷砖拼接。推理方式从'找连接器'变为'分析边缘模式'。"
        source: edge_match
        source_task: 78332cb0
        delta_lines: 40

  - id: D2
    name: "连接器方向"
    tag: match_cond
    current: "连接器为水平条，对接方向为垂直（plug在base上方对接）"
    alternatives:
      - name: "垂直连接器水平对接"
        description: "连接器改为垂直的ctrl色竖条，对接方向变为水平（plug从左侧或右侧对接到base）。改变空间推理方向，解题者需要判断左右对接而非上下对接。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "连接器方向由上下文决定"
        description: "连接器可以是水平或垂直的，对接方向由连接器朝向决定（水平→垂直对接，垂直→水平对接）。每个示例方向可能不同，增加泛化难度。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "L形连接器角落对接"
        description: "连接器为L形（2-3个ctrl像素组成直角），对接时两个L形连接器互相拼合形成矩形。增加形状识别和旋转推理难度。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D3
    name: "源对象结构"
    tag: src
    current: "两个薄壁8连通精灵，各自包含obj像素构成的壁和一个水平ctrl连接器条"
    alternatives:
      - name: "实心精灵（无洞）"
        description: "精灵改为实心块而非薄壁结构，没有内部背景色洞。简化了精灵识别，但对接后的合并体更紧凑，视觉上更容易验证正确性。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "多连接器精灵"
        description: "每个精灵有2个连接器（不同颜色或不同位置），必须选择正确的连接器进行对接。增加了决策复杂度，解题者需要推断哪个连接器是'活动'的。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "含干扰像素的精灵"
        description: "输入中除了两个主精灵外，还有1-2个小型干扰色块（不同颜色），解题者需要识别并忽略这些干扰项，只对接带有匹配连接器的精灵。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "空心框架精灵"
        description: "精灵为完全空心的矩形框架（只有边框像素），连接器位于框架边缘。对接后形成更大的空心结构，视觉上更有规律感。"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 25

  - id: D4
    name: "目标对接方式"
    tag: dst
    current: "plug精灵平移到base精灵上方，连接器行相邻（plug连接器在base连接器正上方1行），直接拼接"
    alternatives:
      - name: "嵌入式对接（插入洞中）"
        description: "base精灵有一个与plug形状匹配的凹槽/洞，plug需要嵌入该洞中而非简单拼接在边缘。需要形状匹配推理来判断plug如何嵌入。"
        source: notch_docking
        source_task: a25697e4
        delta_lines: 40
      - name: "对接后保持间距"
        description: "plug对接时不是紧贴base，而是连接器之间保持1像素间距（由连接器颜色填充），形成可见的接缝。输出中保留连接器颜色作为接缝标记。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "重力下落对接"
        description: "plug从上方'下落'到base上，停在base表面（不一定在连接器位置），连接器仅决定水平对齐。类似俄罗斯方块的放置逻辑。"
        source: gravity
        source_task: 62593bfd
        delta_lines: 30

