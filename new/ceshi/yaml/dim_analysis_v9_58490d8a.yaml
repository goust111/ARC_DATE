        source: creative
        source_task: null
        delta_lines: 35
      - name: "图例条目水平排列替代垂直排列"
        description: "当前关键色从上到下排列在图例框左列，改为从左到右排列在图例框顶行。计数圆点变为从上到下垂直放置。匹配和计数逻辑相同但方向旋转90度，解题者需适应不同的空间方向"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "多个分散图例框替代单一图例框"
        description: "不使用一个统一的大图例框，而是为每种关键色各放一个独立的小黑色框（内含一个关键色像素），这些小框分散在网格各处。输出为所有小框内填入对应计数圆点。解题者需先定位多个分散的图例框再分别处理"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "图例框有彩色边框"
        description: "图例框的边框不是黑色而是某种独特的非背景色（如灰色），内部仍为黑色填充。解题者需先通过边框色识别图例框区域，再提取内部关键色。引入了额外的区域识别步骤"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "变换操作：计数到圆点序列"
    tag: transform
    current: "每种关键色的框外连通分量数量n转换为n个同色圆点，从关键列开始每隔一列放置一个"
    alternatives:
      - name: "圆点替换为条形填充"
        description: "不放置离散圆点，而是从关键列开始连续填充n个像素（无间隔），形成一条长度为n的同色条。解题者需将精灵计数映射为连续条的长度，视觉上从离散点变为连续条"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "计数编码为二进制圆点"
        description: "用二进制编码表示计数：例如3表示为(1,1)即两个圆点，5表示为(1,0,1)即第1和第3位有圆点第2位空。解题者需推断二进制编码规则，大幅增加数值推理难度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "精灵面积之和替代连通分量计数"
        description: "不统计连通分量个数，而是统计该颜色在框外的总像素面积。圆点数等于总面积（需调整图例框宽度以容纳更多圆点）。解题者需精确计算像素面积而非简单计数对象数量"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "从右向左放置圆点（反方向）"
        description: "圆点从图例框右侧开始向左放置，而非从关键列向右。解题者需发现放置方向的变化，是方向维度的直接取反"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "圆点大小编码精灵面积"
        description: "每个精灵对应的圆点不再是1x1像素，而是与该精灵面积相关的小块（如面积4的精灵对应2x2块，面积6的对应2x3块），在图例行中依次排列。解题者需同时推断计数规则和面积→大小映射规则"
        source: creative
        source_task: null
        delta_lines: 40

