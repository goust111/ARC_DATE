task_id: 58490d8a
task_type: move_to_match
summary: "统计图例框外各关键颜色精灵的数量，在黑色图例框内以等间隔圆点序列表示计数结果"

dimensions:
  - id: D1
    name: "匹配条件：颜色匹配"
    tag: match_cond
    current: "s.color == d.color — 图例框内的关键像素颜色与框外精灵颜色一致即为匹配组"
    alternatives:
      - name: "形状匹配替代颜色匹配"
        description: "图例框内不再放单个颜色像素，而是放小型形状模板（如L型、T型等），框外精灵也有不同形状。匹配条件变为精灵形状与模板形状一致。解题者需识别形状而非颜色进行分组，增加了视觉形状比较的推理难度"
        source: shape_match
        source_task: 16b78196
        delta_lines: 40
      - name: "尺寸匹配：按精灵面积分组"
        description: "图例框内的关键像素用不同大小的色块（如1像素、2像素、3像素的小条）表示不同的面积类别。框外精灵按其像素面积与图例中色块大小匹配来分组。解题者需测量精灵面积并与图例尺寸对应，引入数值测量推理"
        source: size_match
        source_task: 2c181942
        delta_lines: 35
      - name: "空间区域匹配：按精灵所在象限分组"
        description: "图例框按行对应网格的不同区域（上/下或左/右半区），框外精灵根据其所在区域被分配到对应的图例行。匹配条件从颜色属性变为空间位置属性，解题者需发现位置→图例行的映射规则"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 30
      - name: "连接器颜色匹配"
        description: "每个图例行有一个颜色标记像素，同时框外每组精灵之间有一个同色的单像素'连接器'。匹配条件为连接器颜色与图例标记色一致。解题者需先识别连接器像素再进行颜色匹配，增加了中间推理步骤"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 35

  - id: D2
    name: "源对象：框外精灵的定义"
    tag: src
    current: "框外各关键颜色的独立连通分量（8连通），每种颜色的所有精灵形状相同，外接矩形2x2至3x3，面积4-7像素"
    alternatives:
      - name: "多色精灵替代单色精灵"
        description: "每个精灵由两种颜色组成（如边框色+填充色），匹配仍按主体颜色进行但精灵视觉上更复杂。解题者需先识别精灵的主体色再进行分组计数，增加了颜色提取的难度"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "不同形状的同色精灵"
        description: "当前规则要求同色精灵形状完全相同，改为允许同色精灵有不同形状（但面积范围相同）。解题者需依据颜色而非形状来分组，但形状的差异可能造成视觉干扰，增加了抗干扰推理能力"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "精灵为线段而非色块"
        description: "将精灵从2D色块改为水平或垂直的1像素宽线段（长度2-4），计数规则不变。视觉形态从紧凑块变为细长线，解题者需识别线段为独立计数单元"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "精灵含内部洞"
        description: "精灵为中空的环形或框型结构（如2x2框型、3x3环形），连通分量中包含被精灵颜色包围的背景色洞。解题者需将有洞的结构也识别为独立精灵，增加连通分量理解的复杂度"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D3
