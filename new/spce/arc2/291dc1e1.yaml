spec:
  grid:
    bg: 8
    perpendicular_to_blue_dim: always 8 (1 line + 1 gap + 2 band1 + 1 gap + 2 band2 + 1 trailing)
    parallel_to_blue_dim: 1 line + (N_slots * rect_len + (N_slots-1) * 2 gap + 2 border), where N_slots = max rects per band
  corner:
    position: any of 4 grid corners
    marker_color: 0 (unique color, differs from both adjacent line colors)
  edge_lines:
    blue: color 1, spans full edge from corner (horizontal or vertical)
    red: color 2, spans the other full edge from same corner
    blue_orient: h or v (determines rotation); when blue is vertical, grid is tall; when horizontal, grid is wide
  rectangles:
    count: 4-9 total, split across 2 bands
    thickness: always 2 cells perpendicular to blue axis
    length_along_red: 2, 4, 6, or 8 cells [observed]
    layout: 2 parallel bands at db=1 and db=4 from blue edge; rects within each band separated by 2 bg cells along red axis
    band_counts: 2-5 rects per band
    colors: 3-6 distinct colors from {3,4,5,6,7,9} [observed]; each rect has one dominant color
    multi_color: 0-3 rects may contain 1-3 minority-color pixels (any rect color), rest are single-color
  output:
    width: max rect width after optional rotation
    height: sum of all rect heights after optional rotation
    stacking: rects sorted by (db, dr) placed top-to-bottom, centered horizontally
    rotation: if blue_orient == v, each rect rotated 90° CCW before stacking

generation_strategy:
  approach: output-first then invert
  steps:
    1. Choose blue_orient (h or v) and corner position (any of 4 corners).
    2. Pick N = 4-9 rects. For each, choose length along red axis (even, 2-8) and assign a dominant color from a pool of 3-6 non-reserved colors.
    3. Optionally make 0-3 rects multi-color by replacing 1-3 pixels with another rect color; ensure the rect stays a single connected component.
    4. Assign each rect a sorting key (db, dr). db ∈ {1, 4} (exactly 2 bands). dr values are strictly increasing within each db band, with dr gaps ≥ rect_length + 2.
    5. Sort rects by (db, dr) — this is the output stacking order.
    6. Build output: stack rects top-to-bottom, centered to max width, bg fill. If blue_orient == v, rotate each rect 90° CCW before stacking.
    7. Build input placement: if blue_orient == v, rotate each rect 90° CW (invert step 6 rotation) to get input form (always 2 cells wide, variable height).
    8. Place rects in the interior grid: 2 bands perpendicular to blue edge (band offsets 2-3 and 5-6 from corner along perpendicular axis), rects positioned along red axis with 2-cell bg gaps between them.
    9. Compute grid size: perpendicular dim = 8; parallel dim = 1 + 1 + max_band_span + 1 trailing (where max_band_span covers all rects in the longer band plus their gaps).
    10. Draw edge lines: blue line (color 1) along full edge from corner, red line (color 2) along the other full edge, marker (color 0) at corner cell.
