spec:
  grid:
    bg: 8
    short_dim: 8 (perpendicular to blue edge; = 1 edge + 1 gap + 2 band0 + 1 gap + 2 band1 + 1 border)
    long_dim: 8-28 (along blue edge; = 1 edge + 1 gap + max_band_extent + 1-2 trailing)
  edge_lines:
    blue: color 1, spans full row or column through corner
    red: color 2, spans the perpendicular full row or column through corner
    marker: color 0, at the grid corner where both lines meet; differs from both adjacent line cells
    corner: any of 4 grid corners
    blue_orient: h when grid is wide, v when grid is tall [observed]
  rectangles:
    count: 4-9 total, split into 2 bands of 2-5 each
    thin_dim: always 2 (perpendicular to blue edge)
    thick_dim: even in {2,4,6,8} (along blue edge)
    placement: |
      Two bands parallel to blue edge at db=1 and db=4 from the blue line.
      Within each band, rects separated by 2 bg cells along the blue direction.
      First rect starts at dr=1 from the red line.
    color: dominant color from {3,4,5,6,7,9}; repeats allowed across rects
    multicolor: 0-3 rects may have 2-3 minority pixels of 1-2 other colors (<=25% of area) [observed]
  output:
    sort rects by (dist_to_blue asc, dist_to_red asc, along_blue, along_red)
    if blue is vertical, rotate each rect 90 CCW
    stack top-to-bottom with no gaps, centered horizontally on bg
    size: height = sum of rotated heights; width = max of rotated widths

generation_strategy:
  approach: input-first
  steps:
    - Pick corner (any of 4) and blue_orient (h or v)
    - Set edge lines: blue=1 along one axis, red=2 along the other, marker=0 at corner
    - Choose 4-9 rects, split into 2 bands (2-5 each)
    - For each rect pick thick_dim in {2,4,6,8} and a color from {3,4,5,6,7,9}
    - Optionally sprinkle 2-3 minority-color pixels in 0-3 rects
    - Place rects per band with 2-cell gaps; long_dim = 2 + max_band_extent + 1-2
    - Fill rest with bg=8; orient grid so short_dim=8; solver produces output
