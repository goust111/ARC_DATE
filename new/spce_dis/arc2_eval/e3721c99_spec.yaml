spec:
  grid: 30x30, bg=0
  divider:
    color: 1
    shape: full-row horizontal OR full-col vertical OR L-shaped (horizontal+vertical arms meeting at corner)
    separates legend panel from workspace
  legend_panel:
    position: one edge/corner of grid, bordered by divider on workspace side
    arrangement: horizontal (3-tall, width=2*holes+1) when panel is horizontal strip; vertical (height=2*holes+1, 3-wide) when panel is vertical strip
    shape_pattern: |
      XXX    XXX    XXXXX    holes=0 -> 3x3 solid
      XXX    X.X    X.X.X    holes=N -> alternating filled/hole rows (or cols)
      XXX    XXX    XXXXX    size 3 x (2N+1) or (2N+1) x 3
    count: 2-4 legend shapes, each a distinct non-bg non-grey color (color 1 allowed)
    hole_values: each legend has a distinct non-negative hole count; need not be consecutive (e.g. {2,4,5})
    spacing: 1 bg cell between adjacent legends, 1 bg cell inset from grid edge and divider
  grey_sprites:
    color: 5 in input
    count: 8-11
    bbox: 2x3 to 11x17, amorphous connected shapes (4-connectivity)
    holes: 0-5 per sprite; each hole is a 4-connected bg region fully enclosed within the sprite's bbox; holes vary widely in size (1-22 cells) and shape (irregular blobs, not just single dots); larger sprites tend to have larger holes
    matching: sprites whose hole count matches a legend entry get recolored to that legend's color
    distractors: 1-7 sprites with hole counts not in legend; these get erased to bg
    at_least_one_match: >=1 sprite per legend color [observed]
    placement: non-overlapping, in workspace area only, not touching divider or legend panel

generation_strategy:
  approach: direct construction
  steps:
    1. Choose divider type (horizontal/vertical/L) and position; draw it with color 1
    2. Choose 2-4 legend colors (distinct, non-bg, non-grey; may include 1) and assign each a distinct hole count 0-5
    3. Build legend shapes as 3-wide (or 3-tall) XXX/X.X stacks; place in legend panel with 1-cell spacing
    4. For each legend, generate 1-3 random amorphous grey sprites with the matching hole count; holes should be irregular blobs of varying sizes (1-22 cells), grown by random walk from interior seeds; place in workspace
    5. Generate 1-7 distractor grey sprites with hole counts NOT in the legend set; place in workspace
    6. Ensure all grey sprites are non-overlapping, separated by >=1 bg cell, 4-connected, and within workspace bounds
