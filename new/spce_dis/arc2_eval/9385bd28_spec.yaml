spec:
  grid: 10-19 rows x 10-19 cols, single bg color (any color 0-9)
  legend:
    position: vertical stack of 2-col-wide rows near bottom-left (col 0-2), bottom row at or within 1 of grid bottom
    entries: 2-5 rows, each row = (marker_color, fill_color); read bottom-to-top for processing order
    marker_color != bg; fill_color can equal bg, another marker_color, or a unique color
  markers:
    L-pair: 2-5 per grid; two L-shaped 3-pixel corners at diagonally opposite bbox corners (6 pixels total)
    2x2-block: 0-1 per grid; solid 2x2 block of a marker color (recolored to fill, no bbox fill)
    anchor_diagonal: either TL-BR or TR-BL (both occur; TL-BR more common ~80%) [observed]
    bbox: height 2-19, width 2-12; gap between corners >= 0 in each dimension
    no-op entries: 0-1 legend entries whose marker has no non-legend pixels (skipped)
  distractors: 0-1 L-pair-shaped groups of a non-legend color [observed]
  overlap: marker bboxes may nest or partially overlap; processing order resolves conflicts
  transform: |
    For each legend entry bottom-to-top: fill entire marker bbox with fill_color,
    preserving marker pixels of current + later entries and legend pixels.
    2x2 blocks are simply recolored. Later fills overwrite earlier ones.

generation_strategy:
  approach: output-first
  steps:
    1. Pick grid size, bg color, legend column (0-2), and 2-5 legend entries with distinct marker colors.
    2. For each L-pair entry, choose anchor diagonal (TL-BR or TR-BL), place two 3-pixel L-corners at opposite bbox corners on a bg grid. Ensure bboxes fit grid and don't collide with the legend column region. Optionally nest or overlap bboxes.
    3. For 0-1 entries, optionally make a 2x2 block instead of L-pair.
    4. Build legend column at bottom-left: stack (marker, fill) pairs bottom-to-top.
    5. Optionally add 0-1 distractor L-pairs in an unused color.
    6. Verify solver reproduces expected output; reject if marker placements are ambiguous.
