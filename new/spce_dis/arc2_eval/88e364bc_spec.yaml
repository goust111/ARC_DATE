spec:
  grid: 20x20, bg=0
  legends:
    count: 1-2, placed at grid corners (TL/TR/BL/BR)
    structure: solid rectangle, 5x5 for cardinal dirs or 6x7 for diagonal dirs
    colors: 3 colors -- fill color C (most frequent) = matching wall color, center color (4 pixels, more central), indicator color 2/red (2 pixels, more peripheral)
    direction: sign(centroid(indicator) - centroid(center)) gives slide direction
    each legend's fill color C is unique and matches exactly one wall color
  walls:
    1-2 distinct wall colors, each forming a mostly-connected irregular closed boundary (~1 cell thick, fill ratio 0.47-0.75)
    each wall color encloses 1-3 interior regions; some regions may be empty (no yellow)
    different wall colors may be 4-adjacent, forming a connected maze-like structure
    wall cells per region boundary: 14-48
  regions:
    interior size: 12-97 cells (passable = bg or yellow)
    1-3 regions contain yellow; 0-1 regions are empty [observed]
    each region's border color determined by majority adjacent wall color
  yellow_pixels:
    total: 2-6 per grid; 1-2 per region
    slide 1-6 steps in the direction dictated by the legend whose fill color matches the region's border color
    stack against far wall or other yellows
  output: same grid with each yellow slid to its final position; walls and legends unchanged

generation_strategy:
  approach: output-first
  steps:
    1. Pick 1-2 wall colors and assign each a direction (cardinal or diagonal); create matching legend(s) at distinct corners (5x5 for cardinal, 6x7 for diagonal)
    2. For each wall color, draw 1-3 irregular closed boundaries on the grid (1-cell-thick fences with occasional steps/notches, interior 15-90 cells, fill ratio 0.45-0.75); walls of different colors may touch
    3. For each region that will contain yellow, place 1-2 yellow pixels at their OUTPUT (slid) positions -- against the far wall in the slide direction
    4. Derive INPUT by reverse-sliding each yellow 1-6 steps opposite the direction, ensuring the path is clear inside the region
    5. Verify no legend/wall overlap, all regions fully enclosed, and slide distances >= 1
