spec:
  grid: 8 rows x 20 cols (fixed) [observed]
  colors: bg=0, grey=5 (frame+bar), 4 distinct column colors drawn from {1,2,3,4,6,7,8,9}
  slot_frame:
    bbox: rows 0-7, cols 9-19 (fixed) [observed]
    shape: |
      row 0:      ########### (cols 9-19 grey)
      row 1..3:   col 9 grey, col 19 grey (side walls)
      row 4..5:   col 9 bg, col 19 grey (left-wall opening at rows 4,5)
      row 6:      col 9 grey, col 19 grey
      row 7:      ########### (cols 9-19 grey)
    interior: rows 1-6, cols 10-18
  slot_columns:
    positions: cols 11, 13, 15, 17 (odd interior cols; even cols 10,12,14,16,18 stay bg)
    lengths: [3, 4, 4, 3] (fixed pyramid, top-down from row 1) [observed]
    contents_per_col: |
      Downward stack from row 1 of length L (3 or 4):
      top k cells are grey caps (k in [0, L-1]), bottom (L-k) cells are a single unique color.
      Each col must have >=1 colored cell (k <= L-1).
    colors: 4 distinct colors across the 4 cols (no repeats), each != 0 and != 5
  bar:
    bbox: rows 2-5, cols 1-7 (base always at row 5) [observed]
    base: row 5 fully grey at cols 1-7 (7-wide horizontal base)
    projection_cols: cols 1, 3, 5, 7 (odd; match slot cols spacing)
    projection_heights: 4 values h1,h2,h3,h4 each in [1, 4] (inclusive height counting base row)
    shape: |
      At each proj col c, grey cells span rows (6-h)..5. Base row 5 is full.
      Even cols 2,4,6 only have the base cell at row 5.
    no_relation_required: bar heights are independent of slot column lengths/colored counts
  output:
    outside_slot: all bg (bar removed from original location)
    inside_slot: frame preserved; bar translated into slot base at row 5 cols 11-17 (dx=+10, dy=0);
      colored cells per col = min(input_colored_count, 5-h) stacked flush at top (row 1),
      grey fills below colors down to bar top.

generation_strategy:
  approach: output-first, then invert
  steps:
    - Render fixed 8x20 canvas with bg=0.
    - Draw slot frame at rows 0-7 cols 9-19 with fixed grey skeleton (top/bottom row full,
      right wall full, left wall grey at rows 0,1,2,3,6,7 with gap at rows 4,5).
    - Pick 4 bar projection heights h = [h1,h2,h3,h4] with each hi sampled uniformly in [1,4].
      Sampling is free (independence); at least one hi < 4 is preferred so at least one col has
      an above-bar colored region (avoid fully-hidden colors).
    - Pick 4 distinct colors c1..c4 from {1,2,3,4,6,7,8,9} (exclude 5) for slot cols 11,13,15,17.
    - For each slot col index i (lengths L = [3,4,4,3]):
        choose input_colored_count n_i in [1, L_i] (uniform);
        place grey caps at rows 1..(1 + L_i - n_i - 1), place color c_i at the next n_i rows
        (so column is filled contiguously from row 1 down for L_i cells).
    - Draw bar at rows 2-5, cols 1-7: base row 5 fully grey cols 1-7; for each projection
      col c in {1,3,5,7} with height h, fill grey at rows (6-h)..5.
    - (No inversion needed beyond leaving slot columns' colored-plus-grey stack as the input.)
