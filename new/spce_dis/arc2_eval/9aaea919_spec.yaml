spec:
  grid: 30x30
  background: any color from {0-9} except 2, 3, 5
  lanes:
    count: 4, at fixed column centers 5, 11, 17, 23 (col ranges 3-7, 9-13, 15-19, 21-25)
    spacing: 6 columns between centers
  sprite:
    shape: |
      .XXX.
      XXXXX
      .XXX.
    size: 3x5 bounding box, 11 pixels (plus/diamond)
    color: each lane has one monochrome color, all 4 distinct, from {0-9} minus {bg, 5}; CAN be 2 or 3
    vertical_period: 4 rows (3 sprite + 1 gap)
    bottom_sprite_top_row: 25 (bottom row = 27)
    count_per_lane: 1-3 in input
  markers:
    shape: horizontal 1x5 bar on row 29 (last row), aligned to lane column range
    red_count: 1-2 bars (color 2), marking source lanes
    green_count: exactly 1 bar (color 3), marking destination lane
    unmarked_lanes: 1-2 lanes have no marker
  transformation:
    red_lane_sprites: recolored to grey (5)
    green_lane: gains N new sprites (N = total red-lane sprite count), using the plus shape recolored to green lane's sprite color, stacked upward from bottom in empty period-4 slots
    markers: all removed (set to bg)
    unmarked_lanes: unchanged
    constraint: green_lane existing sprites + N must fit in grid (max ~7 sprites per lane)

generation_strategy:
  approach: output-first
  steps:
    1. Choose bg from {0-9} minus {2,3,5}. Pick 4 distinct sprite colors from {0-9} minus {bg,5}, assign one to each of the 4 lanes.
    2. Decide marker assignment -- pick 1-2 lanes as red-marked (source), 1 lane as green-marked (destination), rest unmarked. Choose sprite counts per lane (1-3 each).
    3. Build the OUTPUT first -- green lane has its original sprites plus N new sprites (N = total red sprites) stacked upward at period 4. Verify total green lane sprites fit (top_row >= 1). Red lane sprites colored grey(5). Unmarked lanes unchanged.
    4. Derive INPUT from output -- replace grey sprites in red lanes with their original colors. Add N new sprites' positions in green lane back to bg. Place red(2) and green(3) marker bars at row 29 under marked lanes.
