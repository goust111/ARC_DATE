spec:
  grid: 20x20 input, (2N)x(2N) square output, N=2-7
  background: 0
  pieces: exactly 4 single-color pieces + 1 marker pixel (color 5)
  marker:
    color: always 5, exactly 1 cell, singleton in entire grid
    position: at a corner of anchor piece bounding box, 8-adjacent to anchor only
    output: always lands at (0,0) after anchor rotation
  anchor:
    color: 7 [observed]; piece 8-adjacent to marker
    rotation: rotated so marker corner maps to top-left (0,0)
  output_tiling: |
    2Nx2N square split into 4 NxN quadrants (TL,TR,BL,BR).
    4 rectangular tabs modify the plain split:
    - 2 H-tabs: single-column-wide (depth x 1) strips crossing horizontal boundary (row N),
      at columns p and 2N-1-p  (p in 1..N-1)
    - 2 V-tabs: single-row-tall (1 x depth) strips crossing vertical boundary (col N),
      at rows p and 2N-1-p  (same p as H-tabs) [observed]
    Each tab extends one piece into an adjacent quadrant.
    Tab depth: 1 to N-1 per tab (varies independently).
    At N=2, only 3 tabs may be present (one slot too small).
  piece_properties:
    colors: 4 distinct from {1-4,6-9}, anchor=7 [observed], marker=5
    connectivity: all pieces 8-connected (may be 4-disconnected near marker)
    each_piece_area: N*N +/- small tab/slot adjustment (sum = 4*N*N)
  input_layout:
    pieces_scattered: bounding boxes non-overlapping on 20x20 bg=0 grid
    separation: no two pieces 8-adjacent [observed]

generation_strategy:
  approach: output-first
  steps:
    - pick N in 2-7; pick tab position p in [1, N-1]
    - pick 4 tab depths in [1, N-1]; pick direction per tab (which piece protrudes)
    - build 2Nx2N output grid with plain 2x2 quadrant split, then flip ownership
      at each tab rectangle; verify all 4 pieces are 8-connected
    - assign 4 distinct colors (TL anchor = 7); place marker 5 at (0,0)
    - extract each piece's shape from output
    - rotate anchor so marker moves from TL to a random corner (undo solver rotation)
    - randomly rotate each non-anchor piece (solver tries all rotations)
    - scatter all 4 pieces on 20x20 grid with no bbox overlap and >=1 cell gap
