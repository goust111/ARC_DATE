spec:
  task: assemble scattered fragments into one composite image by matching overlapping regions
  background: single most-common color
  composite:
    shape: 5-14 rows x 12-22 cols
    non_bg_colors: 6-7 distinct colors
    forms a 4-connected component of non-bg pixels
  fragments:
    count: 3-6
    shape: 4-connected non-bg component of arbitrary irregular shape consisting of multiple (typically 1-3) smaller basic units
    size: 3-7 rows x 3-13 cols
    colors_per_piece: 2-5 non-bg colors
  basic_units:
    smaller (typically <= 3x3) units, e.g. square frame, checker, H-shape, diamond, staircase
    larger sparse outline (e.g. I-shape, L-shape, U-shape) acting as "wire connectors" linking 2-3 pieces ONLY at their endpoints (e.g. I/L: 2 endpoints, U: 3 endpoints)
    dot_pair (3x1/1x3 with bg gap) acting as glue (overlap_zone) between two pieces
  overlap_zones:
    adjacency graph of fragments is a tree (N-1 edges for N fragments) and each edge corresponds to an overlap zone
    overlap_rect:
      pattern_families:
        square_frame_or_checker:
          shape: 3x3 | 2x3 | 3x2
          layout: filled non-bg, 2 distinct non-bg colors (frame+center, or checker)
          bg_fraction: 0%
        symmetric_strip:
          shape: 1xn | nx1, n in {3, 4, 5}
          layout: palindrome (color distribution symmetric about center)
          bg_fraction: 0-60% (sample variants across the range, not just the 0 end)
      common_constraints:
        non_bg_count >= 2
        distinct_colors_incl_bg: 2-3, avoid monochrome overlaps which can create translation ambiguity
    pixels in overlap must match exactly between the two pieces (including bg)
    overlap always touches at least one edge of each piece
    must be the STRICTLY unique max-area valid overlap between that pair — no other shift (partial or full) between the same two pieces may tie on area.
    no two distinct edges share identical overlap content
  input_grid:
    size: 20-30 rows x 20-25 cols
    fragment pieces are non-overlapping with >= 1 cell gap (observed >= 2)
    total fragment area is 13-35% of input area
  output_grid: tight crop of the assembled composite
generation_strategy:
  approach: output-first, region-first
  key_principle: |
    Each piece occupies a rectangular territory (bbox) in the composite.
    For every tree edge (i, j), overlap_rect_ij IS the geometric intersection
    of piece i's bbox and piece j's bbox — not a pattern placed inside a
    piece. Design piece positions and sizes such that each intended
    overlap_rect emerges naturally as a bbox intersection.
  steps:
    - Design composite as a tree of N=3-6 piece territories (rectangles).
    - For each tree edge, pick an overlap_rect from pattern_families
      (square_frame_or_checker or symmetric_strip) and place it at the
      intended bbox intersection location.
    - Fill each piece: the overlap region is fixed; the rest of the piece's
      bbox gets its own 2-5 non-bg decoration + bg.
    - Verify: non-bg is 4-connected, each tree-edge overlap is the strictly unique max-area exact-match.
    - Tight-crop the composite to get the output.
    - Extract each piece as a fragment (tight bbox).
    - Scatter on input grid (20-30 x 20-25) with >=2 bg cell gap.
