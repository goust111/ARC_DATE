spec:
  grid:
    input: 3-8 rows x 3-8 cols, always square [observed]
    output: 2H x 2W (doubled dimensions)
  colors: 4 distinct (including black/0 background), 3 non-background [observed]
  content: arbitrary pattern; NOT LR-symmetric and NOT UD-symmetric
  transform: |
    output = [[flipud(fliplr(G)), flipud(G)],
              [fliplr(G),         G        ]]
    i.e. four-way mirror symmetry around input's upper-left corner;
    original grid placed in lower-right quadrant
  background_fraction: 0.33-0.56 [observed]

generation_strategy:
  approach: direct (input = output source; no inversion needed)
  steps:
    1. Pick side length N in [3, 8].
    2. Pick 3 non-zero colors from ARC palette (1-9).
    3. Fill NxN grid randomly with 0 and the 3 chosen colors, ~35-55% black.
    4. Verify grid is NOT LR-symmetric and NOT UD-symmetric; reject if so.
    5. Return the NxN grid as input.
