spec:
  grid: 15x15 (height and width each divisible by 3) [observed: all examples are 15x15]
  block_size: 5x5 (grid_dim / 3)
  colors:
    fill: any non-black color (1-9), dominant; observed 6,7,8,9
    marker: 0 (black) [observed]
  marker_pixels:
    count: 1-3 total in the grid
    placement: exactly 1 marker pixel per occupied block; no block has >1 marker
    blocks_occupied: 1-3 out of 9 blocks
  output: 3x3 grid; cell = marker color if block contains any marker, else fill color

generation_strategy:
  approach: direct construction (simple task, no inversion needed)
  steps:
    1. Choose grid dimensions H x W where H % 3 == 0 and W % 3 == 0; use 15x15 to match eval
    2. Choose fill color from {1-9} and marker color = 0
    3. Choose K = randint(1, 3) blocks to occupy from the 9 possible
    4. For each chosen block, place exactly 1 marker pixel at a random position within that block
    5. Fill all remaining cells with the fill color
