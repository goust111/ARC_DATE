spec:
  grid: 6-10 rows x 6-12 cols
  background: black
  colors: input uses only red on black; output replaces some red with pink
  objects:
    type: 4-connected red components on black background
    total_count: 6-9
    small_objects:
      count: 4-6
      area: 1-3 each
    large_objects:
      count: 1-3
      area: 4-8 each
    shapes: freeform polyominoes; no symmetry constraint
    placement: may touch grid border; may be diagonally adjacent (8-connected) to other objects
  red_density: 14-36% of cells [observed]
  transform:
    rule: recolor every 4-connected red object with area >= 4 to pink; keep smaller objects and background unchanged
    output_size: same as input

generation_strategy:
  approach: direct random placement (transform is trivial recoloring, no output-first needed)
  steps:
    1. Pick grid H in [6,10], W in [6,12].
    2. Decide large_count in [1,3] and small_count in [4,6].
    3. For each large object, generate a random 4-connected polyomino with area in [4,8].
    4. For each small object, generate a random 4-connected polyomino with area in [1,3].
    5. Place objects one by one on the black grid, ensuring no two share a 4-connected neighbor (they must remain distinct 4-connected components). Diagonal adjacency is allowed.
    6. If a placement fails after reasonable retries, shrink remaining objects or retry from step 1.
    7. Verify total red density is 10-40% and both small and large categories are non-empty.
