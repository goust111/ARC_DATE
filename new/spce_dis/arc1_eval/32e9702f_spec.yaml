spec:
  grid: 3-10 rows x 3-10 cols, always square [observed]
  colors:
    background: BLACK (0)
    foreground: any single color except BLACK and GREY (e.g. GREEN, YELLOW, ORANGE, MAGENTA)
  segments:
    count: 1-4 solid horizontal 1-cell-thick segments, each on a distinct row
    length: 2-6 cells per segment
    row_gap: >=2 rows between consecutive segment rows [observed]
    placement: segments may start at col 0 or end at col W-1; no other constraints
  transformation:
    - fill entire output grid with GREY (5)
    - shift every foreground pixel one column left; pixels at col 0 are clipped (lost)
    - paint shifted positions with foreground color

generation_strategy:
  approach: direct (input-first) -- transformation is trivial shift, no tight output constraints
  steps:
    1. pick grid size N x N, N in [3..10]
    2. pick fg color from {1,2,3,4,6,7,8,9} minus 5
    3. pick num_segments k in [1..4], ensuring k distinct rows fit with gap >= 2
    4. for each segment, pick a random row (maintaining gap >= 2) and random contiguous column span of length 2-6 within [0..N-1]
    5. fill grid with BLACK, place segments with fg color
  validation: at least 1 segment; all segments single-row, contiguous, same fg color; bg is BLACK
