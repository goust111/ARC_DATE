spec:
  grid: 2-6 rows x 2-6 cols (square) [observed]
  background: 0 (black), must be unique dominant color
  foreground:
    count: 1-3 pixels
    color: single non-blue color (not 0 or 1), same for all fg pixels
    density: 5-25% of grid cells
    placement: scattered, no two on same cell
  output:
    size: 2H x 2W (double input dimensions)
    colors: background(0) + foreground color + blue(1)
    transform: |
      Each input cell becomes a 2x2 block in output:
      - Foreground cell -> solid 2x2 block of its color
      - Background cell on a selected NW-SE diagonal -> 2x2 with blue on main diagonal only (TL and BR)
      - Other background cell -> 2x2 all black
    diagonal_selection: a diagonal (offset = row-col) is selected if any foreground pixel lies on it

generation_strategy:
  approach: direct (input is simple enough to generate directly)
  steps:
    - Pick grid size H=W in [2,6]
    - Pick foreground color from {2,3,4,5,6,7,8,9}
    - Pick 1-3 random cells for foreground placement (ensure density <=25%)
    - Fill remaining cells with 0
    - Validate: blue(1) not used as fg color; bg(0) is strictly dominant
