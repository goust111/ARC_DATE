spec:
  grid: 9x9 [observed], background 0 [observed]
  colors: exactly 2 non-background colors
  sprite:
    description: single 8-connected monochromatic component with area 4-6
    fits_in: 3x3 window centered on its centroid (unique unambiguous centering)
    color: 8 [observed]
  markers:
    description: 1-4 isolated single-pixel components, all same color, different from sprite
    color: 4 [observed]
    placement: scattered across grid, no marker adjacent (8-conn) to sprite or other markers
  output:
    shape: 3 rows x (3 * marker_count) cols
    content: the 3x3 sprite tile repeated marker_count times horizontally

generation_strategy:
  approach: output-first
  steps:
    1. Pick bg, sprite_color, marker_color as 3 distinct colors.
    2. Build a 3x3 tile with 4-6 sprite-colored pixels on bg, forming a single
       8-connected component. Ensure the centroid-centering is unambiguous
       (the _axis_start function must return a unique best start for both axes;
       verify by checking that the centroid is not exactly between two candidate
       window positions).
    3. Choose marker_count in 1-4. Output = tile repeated marker_count times.
    4. Place the sprite on a 9x9 bg grid at a random valid position (ensuring
       the 3x3 window fits within bounds).
    5. Place marker_count single pixels of marker_color on empty cells, not
       8-adjacent to the sprite or to each other.
