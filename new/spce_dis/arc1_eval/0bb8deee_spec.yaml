spec:
  grid: 12-16 rows x 12-13 cols, background always 0
  separator_cross:
    one foreground color forms a full solid row and a full solid column
    the row and column intersect, dividing the grid into 4 quadrants
    each quadrant is at least 3 cells wide and 3 cells tall
  colors: exactly 5 foreground colors -- 1 separator + 4 sprite (all distinct)
  sprites:
    one per quadrant, each a different non-separator color
    tight bounding box is exactly 3x3
    filled cells per sprite: 4-6 out of 9 (rest are background)
    need not be connected (1-4 connected components observed)
    positioned anywhere within its quadrant (surrounded by background)
  output:
    always 6x6 -- four 3x3 sprite crops packed in 2x2 layout
    UL/UR/LL/LR quadrant order preserved

generation_strategy:
  approach: output-first
  steps:
    1. Generate four 3x3 sprites, each a single distinct color on bg=0, with 4-6 filled cells each
    2. Pack them into a 6x6 output grid (UL, UR, LL, LR)
    3. Choose a 5th distinct color for the separator cross
    4. Pick separator row r in [3, H-4] and col c in [3, W-4] where H in [12,16], W in [12,13]
    5. Build four quadrant regions (sizes: r x c, r x (W-c-1), (H-r-1) x c, (H-r-1) x (W-c-1))
       -- each must be >= 3 in both dimensions
    6. Place each 3x3 sprite at a random valid position within its quadrant, rest is bg
    7. Assemble input: quadrants separated by the solid cross row and column
