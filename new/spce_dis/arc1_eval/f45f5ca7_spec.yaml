spec:
  grid: 10x10, background black (0)
  src: 7-8 colored pixels, all in column 0; 2-3 rows are empty (background)
  colors: exactly {teal(8), red(2), yellow(4), green(3)}, each appearing 1-3 times, all 4 present
  lane_mapping: teal->col1, red->col2, yellow->col3, green->col4
  output: erase column 0, place each pixel at (same_row, lane_column_for_its_color)
  constraints:
    - no two fg pixels on the same row share a color (each row has at most 1 pixel)
    - grid width > 4 (satisfied by 10)
    - empty rows can appear anywhere [observed]

generation_strategy:
  approach: direct (trivial transform, input is the constrained object)
  steps:
    1. Create 10x10 black grid
    2. Choose 7-8 rows (out of 10) to receive a foreground pixel
    3. Assign each chosen row a color from {8, 2, 4, 3} such that all 4 colors appear at least once (total count 7-8 distributed across 4 colors, each 1-3)
    4. Place each color in column 0 of its assigned row
    5. Output is derived by moving each pixel from (r, 0) to (r, lane[color])
