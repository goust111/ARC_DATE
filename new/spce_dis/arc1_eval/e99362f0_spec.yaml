spec:
  grid:
    input: (2*pH+1) x (2*pW+1) where pH=3-7, pW=3-7 [observed: pH=5, pW=4]
    output: pH x pW (one panel)
  cross:
    color: any non-bg color, fills exactly one full row and one full column [observed: 4/yellow]
    position: center row and center column, splitting grid into 4 equal panels
  panels:
    count: 4 (TL, TR, BL, BR)
    each panel has exactly 2 colors -- one shared bg + one unique fg
    bg: common to all 4 panels, differs from cross color [observed: 0/black]
    fg: 4 distinct colors, all differ from bg and cross (6 colors total) [observed: TL=7, TR=9, BL=2, BR=8]
    fg_fill_ratio: 30-80% of panel cells per panel
    fg connectivity: 1-5 connected components, no constraint
  overlap:
    panels must have pairwise fg overlaps (non-trivial compositing)
    all 4 fg colors must appear in the output
  transform:
    layer order bottom-to-top: BL, TR, TL, BR
    composite panels at same local coords; later layers overwrite earlier fg; bg is transparent

generation_strategy:
  approach: output-first
  steps:
    1. Pick pH in 3-7, pW in 3-7; choose 6 distinct colors for bg, cross, TL_fg, TR_fg, BL_fg, BR_fg
    2. Build the output panel (pH x pW) ensuring all 4 fg colors appear at least once
    3. Decompose output into 4 panels by reverse-layering (BR=top, then TL, TR, BL):
       - BR panel fg pixels = output pixels matching BR_fg, plus optionally more cells (hidden beneath BR)
       - TL panel fg pixels = output pixels matching TL_fg, plus optionally cells hidden by BR
       - TR panel fg pixels = output pixels matching TR_fg, plus optionally cells hidden by BR or TL
       - BL panel fg pixels = output pixels matching BL_fg, plus optionally cells hidden by any above
       - Remaining cells in each panel are bg
       - Each panel must have 30-80% fg fill
    4. Assemble input: place panels in 4 quadrants separated by cross row and cross column
