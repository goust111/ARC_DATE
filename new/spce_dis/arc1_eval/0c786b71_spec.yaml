spec:
  type: symmetry/pattern
  grid: 3 rows x 4 cols [observed]; solver accepts any rectangular grid
  colors: exactly 3 distinct non-black colors [observed]
  content: arbitrary fill with no inherent LR/UD/rot180 symmetry [observed]
  output:
    size: 2H x 2W (double both dimensions)
    quadrants: |
      upper-left  = rot180(input)    upper-right = flipud(input)
      lower-left  = fliplr(input)    lower-right = input (unchanged)
    result is a 2-fold mirror mosaic centered at the grid midpoint

generation_strategy:
  approach: direct (input-only; output is a deterministic reflection)
  steps:
    1. Pick grid dimensions H in 2-6, W in 2-6
    2. Pick 3 distinct colors from 1-9
    3. Fill H x W grid randomly with those 3 colors
    4. Reject if the grid has LR, UD, or 180-degree symmetry (to avoid degenerate outputs)
