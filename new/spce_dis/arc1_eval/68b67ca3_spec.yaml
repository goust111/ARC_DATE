spec:
  grid: 6x6 [observed]; solver handles any even HxW
  background: 0 (black)
  lattice_structure:
    even_rows_even_cols: contain the meaningful pixel data (3x3 logical grid)
    odd_rows: all background (separator rows)
    odd_cols: all background (separator columns)
  logical_cells:
    non_bg_count: 4-7 out of 9 cells [observed]
    distinct_non_bg_colors: 3-4 [observed]
    colors_used: any non-zero ARC colors (1-9)
  output:
    size: H/2 x W/2 (i.e. 3x3 for 6x6 input)
    content: exactly input[::2, ::2], preserving all colors

generation_strategy:
  approach: direct construction (task is trivially invertible)
  steps:
    1. Pick even dimensions H, W (e.g. 6x6; for variety try 4-10 even values)
    2. Create the logical grid (H/2 x W/2) with bg=0
    3. Place 4-7 non-bg pixels from 3-4 distinct colors at random positions
    4. Build input by interleaving bg separator rows and columns
       - input[2*r, 2*c] = logical_grid[r, c]
       - input[odd rows] = 0, input[:, odd cols] = 0
