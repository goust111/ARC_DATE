spec:
  grid: 7x7 input -> 3x3 output
  background: BLACK
  dominant_color:
    choices: [BLUE, RED, GREEN]
    pixel_count: 12-21
    fraction_of_fg: 0.61-0.78
  distractors:
    distinct_colors: 4-7, drawn from any non-BLACK color except the dominant
    pixels_per_color: 1-4
    total_pixels: 5-10
  total_fg_pixels: 18-29 out of 49
  pixel_placement: randomly scattered across the 7x7 grid [observed]
  codebook:
    BLUE:  |
      . . T
      T T .
      . T .
    RED:   |
      . . .
      T T T
      . . .
    GREEN: |
      . T T
      . T .
      . T .
  output: 3x3 BLACK grid with codebook stencil painted TEAL, selected by dominant color

generation_strategy:
  summary: direct construction (no inversion needed; input is random noise)
  steps:
    1. Pick dominant color uniformly from {BLUE, RED, GREEN}.
    2. Choose dominant pixel count in [12, 21].
    3. Choose number of distractor colors in [4, 7]; sample that many distinct colors from palette minus {BLACK, dominant}.
    4. For each distractor color, assign 1-4 pixels (total distractors 5-10).
    5. Scatter all fg pixels randomly into distinct cells of the 7x7 grid (total fg 18-29).
    6. Output is the codebook stencil for the chosen dominant color.
