spec:
  grid: odd H x odd W, H in 3-9, W in 3-9, H >= 3, W >= 3
  background: black (0)
  marker:
    count: exactly 1 non-background pixel
    position: geometric center of grid (H//2, W//2)
    color: any non-black color (1-9)
  output:
    same dimensions as input
    outer border (row 0, row H-1, col 0, col W-1) filled with marker color
    all interior cells are background (0)
    marker pixel is erased

generation_strategy:
  approach: direct (task is simple enough for forward generation)
  steps:
    1. Pick odd H in [3,5,7,9] and odd W in [3,5,7,9]
    2. Pick marker_color from 1-9
    3. Create H x W grid of zeros
    4. Place marker_color at (H//2, W//2)
