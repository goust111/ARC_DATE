spec:
  grid: 4x4 square [observed]
  colors: exactly 4 distinct non-black colors
  symmetry: input must NOT have 90-degree rotational symmetry (all 4 rotations must be distinct)
  pattern: no other structural constraints; cells filled freely
  output:
    grid: 8x8 (2n x 2n)
    layout: |
      TL = original, TR = rot90 CCW,
      BL = rot180,   BR = rot270 CCW

generation_strategy:
  approach: direct random
  steps:
    1. Pick n=4 (or 3-5 for variety).
    2. Choose 4 distinct colors from 1-9.
    3. Fill an n x n grid randomly with those 4 colors.
    4. Reject if the grid has 90-degree rotational symmetry (rare for random fills).
    5. Return the grid as input.
