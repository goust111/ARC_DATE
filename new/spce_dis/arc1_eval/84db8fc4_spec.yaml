spec:
  grid: 10x10 [observed]
  input_colors: exactly {0 (black), 1 (blue), 3 (green)}
  output_colors: exactly {1, 2 (red), 3, 5 (grey)} — no black remains
  barrier:
    composition: blue(1) + green(3) pixels scattered across grid, 54-65% of cells
    both colors present in nearly every row and column [observed]
    blue_pixels: 24-36; green_pixels: 23-39
    4-connected barrier components: 3-10; largest typically >=24
  black_regions:
    definition: 4-connected components of black(0) pixels
    total_count: 11-18
    edge_touching: 7-9 components (size 1-12 each)
    enclosed: 2-10 components (size 1-14 each); must have >=1
    black_fraction: 35-46% of cells
  transform:
    preserve all blue and green pixels unchanged
    recolor each edge-touching black region to red(2)
    recolor each enclosed black region to grey(5)
  key_constraint: barrier must form enclosures so >=1 black region is fully interior (no cell on grid border)

generation_strategy:
  approach: output-first — build barrier + enclosed regions first, then set all black=0 for input
  steps:
    1. Place barrier pixels (blue+green) on a 10x10 grid, ~55-65% density, randomly assigning each barrier cell to blue or green
    2. Identify 4-connected non-barrier regions; ensure >=2 enclosed (no border cell) and >=7 edge-touching regions exist
    3. If constraint fails, retry barrier placement (use random fill or grow a connected wall with gaps)
    4. Build output by filling edge-touching regions with red(2) and enclosed regions with grey(5)
    5. Build input by replacing all red and grey pixels with black(0); barrier pixels unchanged
  validation: verify total black components 11-18, enclosed >=1, edge >=1
