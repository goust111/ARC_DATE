spec:
  grid: 13-27 rows x 13-25 cols, background black (0)
  colors: all 9 non-bg colors (1-9) present in every input [observed]
  frames:
    count: 2-3 monochrome rectangular frames with 1px-thick complete borders
    border_color: each frame uses a distinct non-bg color; that color also appears as noise elsewhere
    outer_size: 4-12 rows x 5-12 cols (min interior 2x3)
    placement: non-overlapping bounding boxes; may touch grid edges
    interior_areas: all distinct; largest is >=1.9x the second-largest
    interior_content: sparse colored pixels on black bg (~65-75% black), may include the frame's own border color
  noise:
    region: all cells outside frame bounding boxes
    density: ~29-33% non-bg pixels among outside cells
    colors: all 9 non-bg colors appear as scattered single pixels [observed]
  output: strict interior of the unique largest-area frame (border excluded)

generation_strategy:
  approach: output-first
  steps:
    1. Pick grid dimensions H in [13,27], W in [13,25].
    2. Choose 2-3 frame count N. For each frame choose a distinct border color from 1-9.
    3. Decide the largest frame first -- pick interior dims so its area is clearly the largest.
       Place its outer rect on the grid. Then place smaller frames with non-overlapping bboxes.
    4. Fill each frame interior with sparse random non-bg pixels (~30% fill, any color 1-9 including the border color).
    5. Draw each frame's 1px border in its assigned color.
    6. Fill outside-frame cells with ~30% random non-bg noise (all 9 colors represented).
    7. Output = interior of the largest frame (step 4 content).
