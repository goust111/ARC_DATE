spec:
  grid: 3-15 rows x 3-15 cols (square [observed], output must fit 30x30)
  transform: scale entire grid by 2x — each pixel becomes a 2x2 block of same color
  output_size: 2*H x 2*W
  pattern:
    colors: 2 non-black colors + black background [observed]
    non_black_fraction: 25-35% of pixels [observed]
    connectivity: all non-black pixels form a single connected component [observed]
    position: pattern does not fill the grid; at least one edge row/col is all-black [observed]
    content: arbitrary small shape, no symmetry required

generation_strategy:
  approach: direct (transform is trivial 2x upscale, no inversion needed)
  steps:
    1. Pick grid size H, W in 3-15 (keep H*2 <= 30 and W*2 <= 30)
    2. Pick 2 distinct non-black colors
    3. Place a connected region of 20-35% of cells using random walk or flood-fill
    4. Assign the two colors to the region cells (e.g. random per cell)
    5. Ensure at least one border row or column is all-black
    6. Output = scale_sprite(input, 2)
