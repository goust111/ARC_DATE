spec:
  grid: 10-17 rows x 10-19 cols, black background
  markers:
    count: 1-3 green pixels, only non-black color in input
    position: each marker (r,c) satisfies r >= 2, r <= H-3, c >= 2, c <= W-3
    margin_from_edge: >=1 on all sides of the 5x5 scaffold bounding box [observed]
  transform: expand each green marker into a fixed gantry scaffold, keeping green pixel
  scaffold_per_marker: |
    Row r-2: 5 grey cells at cols [c-2..c+2]          (cap)
    Row r-1: red at c-2, grey at c, red at c+2        (upper posts + grey stem)
    Row r:   red at c-2, GREEN at c (kept), red at c+2 (mid posts)
    Row r+1: red at c-2, red at c+2                    (lower posts)
    Row r+2: full-width baseline — red everywhere, teal at cols [c-2..c+2]
    Interior cells (c-1,c+1 in rows r-1..r+1; c in row r+1) stay black.
  non_overlap: 5x5 scaffold cores must not overlap each other or any baseline row;
    requires |dr| >= 5 or |dc| >= 5 between any pair, and no scaffold core row == another marker's r+2
  baseline_rows: each marker's baseline (r+2) must be distinct [observed, but shared baselines are handled by solver if teal regions consistent]

generation_strategy:
  approach: direct placement (input is simple — just green pixels on black)
  steps:
    1. Pick grid size H in [10,17], W in [10,19]
    2. Pick marker count k in [1,3]
    3. Place markers one at a time; for each, choose (r,c) with r in [2,H-3], c in [2,W-3]
    4. Reject if new marker's 5x5 box [r-2..r+2, c-2..c+2] overlaps any existing scaffold box
    5. Reject if new marker's baseline row r+2 intersects any existing scaffold core rows, or vice versa
    6. Ensure at least 1 row margin from grid edge for the scaffold box [observed]
    7. Output is all-black grid with green pixels at chosen positions
