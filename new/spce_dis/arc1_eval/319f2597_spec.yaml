spec:
  grid: 20x20 [observed]
  background: none; every cell is colored (no black except the marker)
  fill: each non-marker cell is independently drawn from colors 1-9 (uniform random)
  marker:
    shape: solid 2x2 block of black (color 0)
    count: exactly 1
    position: interior (top-left corner row in 0-18, col in 0-18; not on grid edge [observed])
  red_pixels:
    role: red (2) appears naturally via random fill; ~9-13% of non-marker cells [observed]
    no special placement; red pixels in the cross survive erasure
  transform:
    cross: union of the 2 marker rows (full width) and 2 marker columns (full height) = 76 cells
    rule: set every non-red cell in the cross to black; red cells and cells outside the cross are unchanged
    result: cross becomes mostly black with 8-11 red holes [observed]

generation_strategy:
  approach: direct (input is the constrained structure; output is derived)
  steps:
    1. Pick grid size 20x20.
    2. Fill entire grid with random colors drawn uniformly from 1-9.
    3. Pick a random interior position (r in 0..18, c in 0..18) for the 2x2 marker.
    4. Set the 4 marker cells to black (0).
    5. Derive output by applying the transform - set cross cells (marker rows + marker cols) to black except where color is red (2).
