task_id: 8cb8642d
type: transform_in_place

spec:
  grid: 12-19 rows x 14-24 cols, background 0
  rectangles:
    count: 1-3 solid filled rectangles on bg
    size: 6-13 rows x 6-11 cols (each dim >= 6 so interior >= 4x4)
    structure: entirely filled with a single frame_color, except one interior pixel of a different marker_color
    marker: exactly 1 pixel, strictly inside the border (row and col each >= 1 from rect edge)
    placement: non-overlapping, no shared cells; min gap >= 0 (may be adjacent); >= 1 cell padding from grid edge on all sides [observed]
  colors: each rect has a distinct frame_color != bg; marker_color != frame_color and != bg; marker colors may repeat across rects; a color may be frame for one rect and marker for another
  output:
    same grid size; bg everywhere except rectangle regions
    each rect border preserved in frame_color; interior cleared to bg then X drawn in marker_color
    X pattern: diagonal arms from interior corners at 45 deg; center row(s) filled horizontally where arms meet (connector)

generation_strategy:
  approach: direct construction (no inversion needed; input is simpler than output)
  steps:
    1. Pick grid H in [12,19], W in [14,24]
    2. Pick N in [1,3] rectangles; assign each a random size (h in [6,13], w in [6,11])
    3. Place rectangles on grid with >= 1 cell padding from edges and no overlap (retry or greedy packing)
    4. Assign distinct non-zero frame colors per rect; assign a marker color per rect (!= its frame, != 0)
    5. Fill each rect bbox entirely with its frame_color
    6. Place one marker pixel at a random strict-interior position in each rect
    7. Return the grid as input
