spec:
  grid: 5x5 input, 3x3 output
  background: 0
  x_pattern:
    positions: all 9 cells on main diagonal and anti-diagonal (both diags of a 5x5)
    all_other_cells: background (0)
    colors: 5 distinct non-zero colors; center color unique, other 4 each appear twice
    symmetry: 180-degree rotational -- pixel(r,c) == pixel(4-r, 4-c)
  transform: |
    Fold X arms onto 3x3 perimeter + center:
      NW arm: (0,0)->(0,0), (1,1)->(0,1)
      NE arm: (0,4)->(0,2), (1,3)->(1,2)
      center: (2,2)->(1,1)
      SW arm: (3,1)->(1,0), (4,0)->(2,0)
      SE arm: (3,3)->(2,1), (4,4)->(2,2)

generation_strategy:
  approach: direct construction (input is small and fully constrained)
  steps:
    - pick 5 distinct non-zero colors A,B,C,D,E
    - assign center (2,2)=E
    - assign rotationally-paired positions with shared colors enforcing 180-rot symmetry:
        (0,0)&(4,4)=A, (0,4)&(4,0)=B, (1,1)&(3,3)=C, (1,3)&(3,1)=D
    - fill remaining 16 cells with 0
