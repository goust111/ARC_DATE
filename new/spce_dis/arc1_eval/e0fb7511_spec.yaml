spec:
  grid: 13x13 [observed]
  colors:
    input: black (0) and blue (1) only
    output: same as input but multi-cell black objects recolored to teal (8)
  background: blue (1), fills ~70-85% of grid
  black_pixels: 16-31% of grid (~27-52 pixels)
  objects:
    total_components: 18-30 (4-connected black components)
    singletons: 13-24 isolated single black pixels (noise), kept as black in output
    multi_cell: 5-7 objects with size >= 2, recolored to teal in output
    multi_cell_sizes: 2-8 pixels each; most are small (2-3), with 1-2 larger (5-8)
    multi_cell_bbox: at most ~5x3 [observed]
  transform:
    rule: recolor every 4-connected black component with area > 1 to teal; singletons and blue unchanged

generation_strategy:
  approach: direct random construction
  steps:
    1. Create 13x13 grid filled with blue.
    2. Place 5-7 multi-cell black objects (random 4-connected polyominoes, sizes 2-8 with most being 2-3 and 1-2 being 5-8) at random non-overlapping positions. No two objects should be 4-adjacent to each other.
    3. Scatter 13-24 singleton black pixels in remaining blue cells, ensuring none is 4-adjacent to any other black pixel.
    4. Verify total black pixel coverage is 16-31%.
