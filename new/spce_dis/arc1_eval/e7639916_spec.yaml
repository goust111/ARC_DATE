spec:
  grid: 8-14 rows x 12-20 cols, background black (0)
  markers:
    count: exactly 3
    color: azure (8) [observed]; solver allows any non-blue, non-bg color
    placement: all lie on the border of their shared bounding box
    pattern: exactly 1 marker at a corner of the bbox, 2 on edge-only (not corners) [observed]
    coverage: all 4 sides of bbox touched by at least one marker [observed]
    distinct_positions: 3 distinct rows and 3 distinct columns
  bbox:
    height: 6-10
    width: 8-14
    aspect_ratio: 1.0-1.75
    non-degenerate: both dimensions >= 2
    margin: >= 1 cell from every grid edge
  no_blue: blue (1) absent from input
  transform: draw blue (1) rectangular border along bbox perimeter, then restore marker pixels on top

generation_strategy:
  approach: direct construction (simple task, no inversion needed)
  steps:
    1. Pick grid size H in [8,14], W in [12,20]
    2. Pick bbox top-left (r0,c0) and bottom-right (r1,c1) with height 6-10, width 8-14, margins >= 1 from all grid edges
    3. Choose one of the 4 corners of the bbox for the corner marker
    4. Place 2 edge-only markers on the remaining 2 sides not already covered by the corner marker; each at a non-corner position on its side
    5. Verify all 3 markers have distinct rows and distinct columns (reject and retry if not)
    6. Fill grid with black, place 3 azure pixels at marker positions
