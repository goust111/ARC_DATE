spec:
  grid: square, 2-5 rows/cols [observed]
  background: black (0)
  foreground:
    color: exactly 1 non-black, non-red color
    pixel_count: 1-2
    placement: no foreground pixel in row 0 (must have room for shadow above)
    any_column_allowed: true, including column 0 (shadow wraps to rightmost column)
  shadow_fg_overlap: allowed; when a shadow cell coincides with a foreground cell, foreground wins
  output:
    tile: input copy with red (2) painted at (r-1, (c-1) % W) for each fg pixel at (r,c); fg overwrites red
    tiling: tile repeated 3x3, so output is 3H x 3W

generation_strategy:
  approach: direct input generation (constraints are simple enough)
  steps:
    - pick grid size N x N, N in 2..5
    - pick one foreground color from {1,3,4,5,6,7,8,9} (exclude black=0 and red=2)
    - pick 1-2 distinct cells for foreground, all with row >= 1
    - fill grid with black, place foreground pixels
    - verify solver produces valid output (shadow + 3x3 tiling)
