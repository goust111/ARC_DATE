spec:
  grid: 5-8 rows x 5-8 cols, black background
  objects: every foreground object is either a solid 2x2 block or a single 1x1 pixel
  colors: only green(3) and red(2) on black(0); green always present, red may be absent [observed: red present in 6/7]
  green_2x2_blocks: 1-3 (this is the count the output encodes)
  distractors:
    red_2x2_blocks: 0-3
    green_1x1_pixels: 0-4
    red_1x1_pixels: 0-3
  total_objects: 4-11
  spacing: objects may be 4-adjacent to each other but never overlap
  output:
    fixed: 3x3 black grid
    rule: N = count of green 2x2 blocks; fill diagonal cells (0,0),(1,1),...,(N-1,N-1) with blue(1)

generation_strategy:
  approach: direct construction (output is trivially derived from input)
  steps:
    1. Pick N (green 2x2 count) uniformly from {1,2,3}
    2. Pick grid size H,W each from 5-8
    3. Place N green 2x2 blocks at random non-overlapping positions (top-left corner r in [0,H-2], c in [0,W-2])
    4. Pick distractor counts -- red_2x2 in 0-3, green_1x1 in 0-4, red_1x1 in 0-3; total objects 4-11
    5. Place distractor 2x2 blocks and 1x1 pixels at positions that do not overlap existing objects
    6. Build output -- 3x3 black grid with first N diagonal cells set to blue
  notes:
    - adjacency between objects is allowed; only overlap is forbidden
    - ensure grid is large enough to fit all objects (reject if placement fails)
