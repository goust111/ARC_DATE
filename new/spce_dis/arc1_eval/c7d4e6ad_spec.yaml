spec:
  grid: 10x10, background BLACK
  marker_column:
    position: column 0
    contains: one colored (non-BLACK, non-GREY) pixel per grey-row, all in same column
  gap: columns 1-2 are always BLACK (separates marker from shape)
  grey_shape:
    role: placeholder to be recolored
    columns: span cols 3-7, width 3-5 cols
    rows: 7-8 contiguous rows; top/bottom 1-2 rows of grid are empty
    connectivity: single 4-connected component
    density: 0.4-0.6 within bounding box
    pixels_per_row: 1-5
    total_pixels: 12-20
    symmetry: none [observed]
  color_bands:
    count: 2-4 distinct colors, each forming a contiguous vertical band of 1-4 rows
    colors: distinct non-BLACK non-GREY colors; each band uses exactly one color
    marker_pixel: one per grey-row in column 0, colored to match its band
  transform: replace each GREY pixel with the control color from column 0 in its row
generation_strategy:
  approach: direct construction
  steps:
    1. Start with 10x10 BLACK grid.
    2. Choose 7-8 contiguous interior rows (leaving 1-2 empty rows at top and bottom).
    3. Partition these rows into 2-4 consecutive bands of 1-4 rows each. Assign a unique non-BLACK non-GREY color to each band.
    4. Generate a 4-connected grey shape spanning those rows in columns 3-7 (1-5 grey pixels per row, total 12-20). Ensure single connected component.
    5. Place one marker pixel per active row in column 0 with the band's color.
    6. Columns 1-2 and columns beyond the shape remain BLACK.
