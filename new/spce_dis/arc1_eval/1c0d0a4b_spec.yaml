spec:
  grid:
    row_bands: 1-3
    col_bands: 1-3
    total_tiles: 3-9
    dimensions: (4*row_bands+1) x (4*col_bands+1), so 5-13 rows x 5-13 cols
    margins: 1 row/col of bg on all sides
    separators: exactly 1 bg row between adjacent row bands, 1 bg col between adjacent col bands
  colors:
    bg: BLACK (most frequent)
    fg_input: TEAL (azure/8) -- exactly one non-bg color [observed]
    fg_output: RED (2) -- replaces bg cells inside tiles
  tiles:
    size: 3x3 each
    fg_pixels_per_tile: 4-7 (no fully empty or fully filled tiles)
    pattern: arbitrary binary within the 4-7 fg constraint; no symmetry required
  transform:
    within each 3x3 tile, invert occupancy -- fg cells become bg, bg cells become RED
    separator rows/cols remain bg throughout

generation_strategy:
  approach: direct construction (task is simple inversion, no tight output constraint)
  steps:
    1. Pick row_bands R in [1,3] and col_bands C in [1,3] with R*C >= 3
    2. Grid size = (4R+1, 4C+1); fill with BLACK
    3. For each of the R*C tile positions at rows [1+4i..3+4i], cols [1+4j..3+4j]
       generate a random 3x3 binary mask with 4-7 fg cells, fill those with TEAL
    4. Input is the constructed grid
