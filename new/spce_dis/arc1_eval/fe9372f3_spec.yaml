spec:
  grid: 7-30 rows x 10-17 cols
  background: black
  src:
    shape: 5-pixel red plus (3x3 bbox, center + 4 cardinal neighbors)
    count: exactly 1
    placement: center at least 2 cells from every edge (so cardinal rays have >=1 cell)
    min_cardinal_ray_length: 2 [observed]
  output:
    red_plus: preserved unchanged
    diagonal_rays: from each of 4 diagonal neighbors of center, paint blue to grid edge
    cardinal_rays: from 2 cells beyond center in each cardinal direction, paint repeating teal-teal-yellow pattern to grid edge
    no_overlap: rays only traverse black cells (guaranteed since input is black + red only)

generation_strategy:
  approach: direct (input is trivially simple - just place a red plus on a black grid)
  steps:
    1. Pick grid dimensions H in [7,30], W in [10,17]
    2. Pick center (cr, cc) with cr in [2, H-3], cc in [2, W-3] ensuring min(cr-1, H-2-cr, cc-1, W-2-cc) >= 2
    3. Fill grid with black, place red plus at center (5 pixels)
    4. No other foreground pixels - input is complete
