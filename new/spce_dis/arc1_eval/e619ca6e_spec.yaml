spec:
  grid: 25-29 rows x 22-29 cols
  background: 0 (black)
  foreground: single color (always 3/green in eval) [observed]
  rectangles:
    count: 1-3 solid filled axis-aligned rectangles
    height: 2-4
    width: 2-5
    area: 6-10
    position: placed in upper portion so room_below/height >= 3 (ensures >=2 stamps downward per direction)
    separation: non-overlapping, well-separated (row_sep >= 2, col_sep >= 4)
  trajectory:
    directions: two downward diagonals from each rect, stepping (h, -w) and (h, +w)
    stamps_per_direction: 2-12 (at least 2 in every direction)
    clipping: some stamps partially exit grid laterally (2-4 clipped stamps per example)
    total_stamps: 5-25 per example
  output: same grid with all stamped copies unioned onto background

generation_strategy:
  approach: input-first (rectangles are the only input structure; output is deterministic)
  steps:
    1. Choose grid size H in [25,29], W in [22,29]
    2. Choose num_rects in [1,3]
    3. For each rect, pick h in [2,4], w in [2,5] with area in [6,10]
    4. Place each rect so that room_below >= 3*h (ensures >=3 stamps down) and horizontal position allows >=2 stamps in each lateral direction (c0 >= w to get left stamps, c0 + 2*w <= W to get right stamps)
    5. Verify rects do not overlap each other (reject if they do)
    6. Output is computed deterministically by the solver (stamp along both diagonals until off-grid)
