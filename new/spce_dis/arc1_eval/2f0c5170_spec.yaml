spec:
  grid: 18-23 rows x 18-23 cols, background color 8
  colors: 4 colors total — bg (always 8), fill (always 0), 1 marker color, 1 sprite color
  windows:
    count: exactly 2 solid (no bg holes) rectangles on the bg
    separation: non-overlapping with >=0 row gap and >=0 col gap, >=1 cell margin to grid edges
    source: 4-7 rows x 5-7 cols, contains fill + 1 marker pixel + sprite pixels
    dest: 5-9 rows x 5-9 cols, contains only fill + 1 marker pixel
  marker: exactly 1 pixel of marker color in each window (2 total in grid)
  sprite:
    pixels: 7-11 sprite-color pixels forming a blob (sprite+marker is one 4-connected component)
    marker_adjacent: marker pixel is 4-adjacent to at least one sprite pixel
    bbox: 3-4 rows x 3-5 cols
    fit: sprite blob (relative to marker) must fit entirely within dest window when aligned at dest marker
    density: 0.19-0.36 of source window area [observed]
  dest_extra: dest is strictly larger than sprite bbox in at least one dimension (extra 1-6 rows/cols)
  output: dest window shape, filled with fill color, then sprite+marker painted at marker-aligned offset

generation_strategy:
  approach: output-first
  steps:
    1. Pick 4 distinct colors for bg(8), fill(0), marker, sprite.
    2. Build the sprite blob (3-4 x 3-5 bbox, 7-11 sprite pixels, 4-connected with marker).
       Place marker inside blob so sprite+marker is one 4-connected component.
    3. Build dest window (5-9 x 5-9) filled with fill color + 1 marker pixel.
       Ensure sprite blob fits when marker-aligned — marker position in dest must have
       enough clearance in all 4 directions to contain the sprite extent.
    4. Build source window as tight bounding box of sprite+marker, padded with fill on all
       sides (at least 0-1 cells padding each side, total source size 4-7 x 5-7).
       Place marker pixel and sprite pixels; fill the rest with fill color.
    5. Place both windows on an 18-23 x 18-23 bg grid with >=1 margin and >=0 gap between them.
    6. Output = dest-sized grid of fill, with sprite+marker painted at the marker-aligned offset.
