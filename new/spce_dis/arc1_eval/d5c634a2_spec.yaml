spec:
  input_grid:
    size: 5-15 rows x 4-15 cols
    background: BLACK
    colors: [RED] only
  t_tetrominoes:
    count: 2-8 total, each orientation 1-4
    shapes: |
      up_T (stem above):    down_T (stem below):
        .X.                   XXX
        XXX                   .X.
    color: RED
    placement: non-overlapping; 4-connected separation (no shared edges); diagonal touching allowed
  output_grid:
    size: fixed 3x6
    structure: two 3x3 panels side by side on BLACK background
    left_panel: GREEN pixels at corner slots counting up_T (slot order TL BL TR BR)
    right_panel: BLUE pixels at corner slots counting down_T (slot order TL BL TR BR)

generation_strategy:
  approach: direct input construction (simple counting task)
  steps:
    1. Choose up_count in 1-4 and down_count in 1-4 with total 2-8
    2. Choose grid size large enough to fit all T shapes with spacing (heuristic ~4*total cells needed + padding)
    3. Place each T tetromino one at a time on the grid, ensuring no 4-connected overlap with existing RED cells; retry placement on collision
    4. Output is deterministic from counts, no need for output-first
