spec:
  grid: 13x13 [observed], generalize to 10-20 rows x 10-20 cols
  background: black (0)
  markers:
    count: exactly 2 pixels
    color: red (2) [observed]; any single non-black, non-blue color
    placement: different rows AND different columns (opposite corners of a rectangle)
    row_gap: >=3 (so interior height >=2); observed 4-9
    col_gap: >=3 (so interior width >=2); observed 5-8
    no_blue_in_input: blue (1) must not appear in the input
  output:
    divider_rows: the two marker rows painted fully with marker color
    divider_cols: the two marker cols painted fully with marker color
    interior: strict interior rectangle (between divider rows/cols, exclusive) filled blue
    rest: background color

generation_strategy:
  approach: direct (task is simple enough for forward construction)
  steps:
    1. Pick grid size H x W in 10-20 range
    2. Pick background = black, marker color = red (or any non-black, non-blue)
    3. Pick two distinct rows rlo, rhi with rhi - rlo >= 3, both in [0, H-1]
    4. Pick two distinct cols clo, chi with chi - clo >= 3, both in [0, W-1]
    5. Place marker pixels at two opposite corners of the rectangle, e.g. (rlo, clo) and (rhi, chi), or (rlo, chi) and (rhi, clo)
    6. Fill rest with background
