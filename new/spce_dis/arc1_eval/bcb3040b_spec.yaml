spec:
  grid: 10-18 rows x same cols (always square) [observed]
  colors:
    input: black(0) background, blue(1) foreground, red(2) markers
    output: adds green(3) on path where blue was; red fills rest of path
  markers:
    count: exactly 2 red pixels
    alignment: horizontal, vertical, or 45-degree diagonal (queen-move)
    placement: both on grid boundary edges; path spans full grid dimension [observed]
    neither marker sits on a blue pixel (both are on otherwise-black cells)
  blue_foreground:
    density: 0.35-0.50 of total cells
    components: 9-35 (many small + a few larger ones; sizes 1-28)
    scattered across the grid, not forming a single connected blob
  path:
    length: equals grid side length (10-18 cells)
    blue_on_path_fraction: 0.19-0.56 (mix of blue and black along the segment)
  transform:
    copy input; walk inclusive segment between markers
    path cell blue(1) -> green(3); path cell black(0) or red(2) -> red(2)
    all off-path cells unchanged

generation_strategy:
  approach: direct construction (task is simple enough)
  steps:
    1. Pick N uniformly from 10-18; create NxN black grid
    2. Choose direction (horizontal / vertical / diagonal); place two red markers
       at opposing boundary cells spanning full grid dimension along that axis
    3. Randomly fill ~35-50% of non-marker cells with blue(1)
    4. Ensure path has a mix of blue and black cells (fraction blue on path 0.15-0.60);
       if not, resample a few path cells
    5. Verify exactly 2 red pixels, neither overlapped by blue
