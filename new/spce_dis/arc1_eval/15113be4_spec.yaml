spec:
  grid: 23x23 (fixed)
  lattice:
    cells: 6x6 grid of 3x3 cells; cell starts at columns/rows 0,4,8,12,16,20
    separators: yellow(4) lines at positions 3,7,11,15,19; one row and one col separator removed for instruction region
  instruction_region:
    location: 6x6 block in one of the 4 corners, spanning 2x2 adjacent cells where the shared separator is removed
    positions: (1,1) top-left, (1,16) top-right, (16,1) bottom-left, (16,16) bottom-right
    border: fully surrounded by yellow (adjacent separators + grid-edge row/col which becomes all-yellow)
    encoding: 3x3 binary mask via 2x2 sub-blocks; solid accent = on, solid empty(0) = off; no partial blocks
    mask_bits: 3-5 out of 9
    accent_color: one color from {2,3,5,6,7,8,9} (not blue/yellow/black)
  content_cells:
    count: 32 (36 total minus 4 instruction-corner cells)
    pixels: each cell is 3x3 containing only blue(1) and empty(0)
    blue_density: 0.33-0.49 across all content cells [observed]
    empty_cells: 0-1 (all-black cells) [observed]
  transform:
    rule: for each content cell where ALL mask-on positions are blue, recolor those positions to accent
    matching_cells: 2-4 per grid [observed]
    non-matching cells preserved unchanged

generation_strategy:
  approach: output-first (build output, then derive input by replacing accent with blue)
  steps:
    1. Pick a random corner; set instruction origin accordingly
    2. Generate a 3x3 binary mask with 3-5 set bits; encode as 6x6 using 2x2 accent blocks
    3. Choose accent color from {2,3,5,6,7,8,9}
    4. Build the 23x23 grid with yellow separators at all 5 positions except the one row and one col crossing the instruction region
    5. Fill the instruction-corner edge row/col entirely with yellow; place the 6x6 instruction block at the offset position
    6. For each of the 32 content cells, generate a random 3x3 blue/empty pattern with blue density ~0.33-0.49
    7. Designate 2-4 random content cells as matching; overwrite their mask-on positions with accent color (output state)
    8. Ensure non-designated cells do NOT have blue at all mask positions (reject or flip one mask-position pixel to empty)
    9. To get input: copy output, replace all accent pixels in content cells with blue
