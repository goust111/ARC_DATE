task_id: 414297c0
type: move_to_match

spec:
  grid: 16-26 rows x 18-24 cols, bg=0
  rectangle:
    size: 6-12 rows x 6-15 cols, solidly filled with fill_color (not bg, not stamp_color)
    markers: 2-5 isolated single pixels of distinct colors inside the rectangle (not fill_color, not stamp_color)
    each marker >=1 cell from every edge so stamped sprites stay in bounds
  sprites:
    count: one per marker + 0-1 distractors (distractor marker color absent from rectangle)
    shape: 3x3 bbox centered on a single marker pixel; 3-7 of the 8 neighbor cells filled with stamp_color
    stamp_color: single color shared by all sprites, always 2 [observed]; distinct from fill_color, bg, and all marker colors
    each sprite has exactly 1 marker pixel + stamp_color pixels; all sprites have distinct shapes
  placement: all sprites and rectangle are 8-connected components on bg; no overlap between any components
  output: crop to rectangle bbox; stamp each sprite's pattern onto matching marker position; no stamp overlap between sprites

generation_strategy:
  approach: output-first
  steps:
    1. Pick fill_color, stamp_color=2, and K=2-5 distinct marker colors (all mutually distinct, none bg=0)
    2. Choose rectangle size (6-12 x 6-15); create filled rectangle
    3. For each marker, generate a random 3x3 sprite pattern (3-7 of 8 neighbors filled with stamp_color, center=marker pixel); ensure all K patterns are distinct
    4. Place markers inside rectangle such that each marker is >=1 from all edges and stamped 3x3 patterns do not overlap each other or extend outside the rectangle
    5. Stamp all patterns to build the output; verify no stamp-pixel collisions
    6. Build input by placing the clean rectangle (fill + marker pixels only) and scattering the K sprites (and 0-1 distractors) on bg with no component overlap
