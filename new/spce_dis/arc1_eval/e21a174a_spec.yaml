spec:
  grid: 7-13 rows x 7-13 cols, background 0
  sprites:
    count: 3-5, each a distinct foreground color
    layout: vertically stacked with no gaps (each sprite bbox top = previous bbox bottom + 1)
    column_center: all sprites share the same column center
    widths: 3-11 cells, may vary within an example but always odd and centered [observed]
    heights: 1-5 rows each
    symmetry: every sprite mask is left-right symmetric [observed]
    density: 0.50-1.00 (cells / bbox area); every row and column of bbox has >= 1 cell
  stack:
    top_margin: exactly 1 row of background above the stack
    bottom_margin: exactly 1 row of background below the stack
    grid_rows = stack_height + 2
    left/right_margin: >= 1 column of background on each side
  output: reverse the top-to-bottom order of sprites; each sprite keeps its shape and column span, but the vertical positions are reassigned so the bottom sprite goes to the top slot and vice versa

generation_strategy:
  approach: direct construction (no inversion needed; input is fully specified, output is a simple reorder)
  steps:
    1. Pick num_sprites in [3,5] and grid_cols in [7,13]
    2. For each sprite, pick a height in [1,5] and a width in [3, grid_cols-2] (odd, centered)
    3. Generate each sprite mask (LR-symmetric, no empty rows/cols, density >= 0.5)
    4. Compute stack_height = sum of sprite heights; set grid_rows = stack_height + 2
    5. Assign distinct foreground colors (one per sprite); place sprites contiguously starting at row 1
    6. Fill remaining cells with background 0
