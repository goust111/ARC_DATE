spec:
  grid:
    input: 3x3
    output: 5x5
  colors:
    distinct_count: 5-9 (any non-background ARC colors 1-9)
    no_black: true [observed]
  transform: numpy edge-pad with width 1 on all sides
  description: |
    The 3x3 input is placed at center of 5x5 output.
    Each border pixel is replicated outward one cell, creating
    2x2 blocks at corners, 1x2 (or 2x1) pairs along edges.

generation_strategy:
  approach: direct random
  steps:
    - Generate a 3x3 grid with random colors chosen from ARC palette (1-9)
    - Ensure at least 5 distinct colors are used
    - The output is np.pad(input, 1, mode='edge')
