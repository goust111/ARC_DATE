spec:
  grid: 3-4 rows x 10-14 cols, bg=0
  row_structure: |
    Each row has a contiguous non-bg prefix at columns 0..P-1, rest is bg.
    prefix[0] == prefix[P-1] (boundary color), interior = prefix[1..P-2].
    Boundary color differs from all interior colors within the same row.
  prefix_length: 3-4, same for all rows within one grid [observed]
  width_constraint: w >= 2*P - 1 (must fit prefix + gap + suffix)
  gap_length: w - 2*P + 1, range 5-7
  colors: 2-4 distinct non-bg colors per grid from {1,2,3,8} [observed]
  row_diversity: rows may repeat; at least 2 distinct rows [observed]
  transform: |
    For each row: keep prefix at left, fill columns P..w-P with boundary color,
    copy prefix[1:] into columns w-P+1..w-1. Output = prefix + boundary_fill + suffix.

generation_strategy:
  approach: direct construction (simple row-independent task)
  steps:
    1. Pick h in [3,4], prefix_len P in [3,5], w in [2*P+3, 2*P+7] (ensures gap >= 4).
    2. Pick 2-4 non-bg colors.
    3. For each row, pick a boundary color and P-2 interior colors (all != boundary).
       Form prefix = [boundary, *interior, boundary].
    4. Place prefix at columns 0..P-1, fill rest with bg=0.
