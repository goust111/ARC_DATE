spec:
  grid: 10x10 [observed]
  background: black [observed]
  src:
    shape: 3x3 hollow square (8 border pixels, center is background)
    color: one of green/yellow/pink/teal (encodes direction)
    placement: not already flush with its target edge; distance to target edge 3-5
  path:
    direction: green=left, yellow=down, pink=up, teal=right
    action: slide sprite until bbox is flush with the indicated grid edge
  output:
    grid same size, all background except the 3x3 hollow square at its destination edge
    sprite row (for left/right) or column (for up/down) preserved from input

generation_strategy:
  approach: output-first
  steps:
    1. Choose grid size 10x10
    2. Pick color from {green, yellow, pink, teal} determining direction
    3. Compute destination position flush with that edge (row or col free within valid range 0..7)
    4. Place 3x3 hollow square at destination to form the output
    5. To derive input, pick an original position along the movement axis at distance 3-5 from the edge (same row for left/right, same col for up/down)
    6. Input is all-black grid with sprite at that original position
