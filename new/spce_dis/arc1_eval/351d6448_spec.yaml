spec:
  grid: 4 equal panels stacked vertically, separated by single solid-color rows
  panel: 3 rows x 8-15 cols [observed]; bg = 0, separator color != bg (always 5 [observed])
  input: 4 panels (the animation strip); output: 1 panel (the 5th frame)
  models: exactly one of these three must match per input
  model_A_translation:
    a multi-color sprite (1-2 colors, 2-4 cells [observed]) on bg
    translates by constant (dr, dc) each frame; dr in {-1,0,1}, dc in {-1,0,1}, not (0,0)
    sprite must remain fully inside panel for all 5 frames
    foreground cell count is constant across panels
  model_B_repeated_increment:
    single non-bg color grows each frame; new cells per step (the increment) are constant-size
    successive increments are translations of each other by fixed (dr, dc)
    the 5th increment must land inside the panel and not overlap existing cells
    foreground mask is NOT fixed (it grows); only 1 non-bg color
  model_C_fixed_mask_prefix:
    foreground mask (all non-bg cells) is identical across all 4 panels
    one color (the increasing color) fills a rightward or leftward column-prefix of the mask
    remaining foreground cells use a different static color
    prefix front advances by constant step (1-2 cols) per frame
    the 5th frame prefix must still have foreground cells to fill
  colors: 1-2 non-bg colors per panel; bg=0; separator color from {1-9} minus panel colors

generation_strategy:
  approach: output-first — build valid 5-frame sequence, use frames 1-4 as input
  steps:
    1. Pick model (A, B, or C) uniformly
    2. Choose panel dims (H=3, W=8-15), bg=0, separator color (e.g. 5)
    3. For model A — design a small sprite (1-3 rows, 1-3 cols, 1-2 colors), pick (dr,dc),
       place sprite in frame 1 so 5 translations all fit inside panel; build 5 frames
    4. For model B — pick single color, design initial blob and increment shape (1-3 cells),
       pick shift (dr,dc); place so all 5 increments fit and don't overlap; build 5 frames
    5. For model C — design a foreground mask (irregular shape spanning multiple rows),
       pick increasing color and static color, choose direction (left/right) and step size;
       set initial prefix front so 5 steps of growth fit within mask; build 5 frames
    6. Verify exactly one model matches (avoid degenerate cases like single-cell sprites
       that could match both A and B)
    7. Stack frames 1-4 with separator rows as input; frame 5 is output
