spec:
  grid: 15x15, background 0
  objects:
    count: exactly 4 filled 3x3 blocks (area=9, no bg cells)
    placement: scattered on grid, non-overlapping, >=1 cell gap between any two
    columns: objects placed in two x-bands (left ~col 2-3, right ~col 7-8), 2 per band [observed]
  color_rule:
    each_object: uses only non-bg colors (1-9)
    two_color_objects: exactly 3 objects use exactly 2 distinct colors; freq split is 3+6 or 4+5
    three_color_object: exactly 1 object uses exactly 3 distinct colors; freq split varies (e.g. 3+3+3, 2+2+5, 1+3+5)
    cross_object: colors mostly unique across objects; rare overlap allowed (1 example shares a color)
  output: 3x3 crop of the unique three-color object

generation_strategy:
  approach: direct construction
  steps:
    1. Pick 8-9 distinct non-bg colors (1-9); partition into 4 groups — three groups of 2 colors, one group of 3 colors
    2. For each 2-color group, fill a 3x3 grid with the two colors (split 3+6 or 4+5, random pattern)
    3. For the 3-color group, fill a 3x3 grid with three colors summing to 9 cells (any positive split)
    4. Place the four 3x3 blocks on a 15x15 black grid at non-overlapping positions with >=1 cell gap between any pair
    5. Output is the 3-color block
