spec:
  grid: 10x10 [observed]
  background: gray (5); single foreground marker color black (0) [observed]
  marker_color: must differ from palette {blue, red, green, yellow}
  markers:
    total_pixels: 8-15
    occupied_columns: exactly 4 distinct columns
    pixels_per_column: 1-4
    rows_with_markers: 6-8 distinct rows [observed]
    multi_column_rows: some rows may have markers in 2+ columns
    column_gaps: 1-4 between consecutive occupied columns
  output:
    same grid size, background unchanged
    each marker pixel recolored by left-to-right rank of its column among the 4 occupied columns
    rank 0 -> blue(1), rank 1 -> red(2), rank 2 -> green(3), rank 3 -> yellow(4)

generation_strategy:
  approach: direct (task is simple recoloring, no complex constraints)
  steps:
    1. Create 10x10 grid filled with gray (5)
    2. Pick 4 distinct columns from 0-9
    3. For each column, pick 1-4 random rows to place black (0) markers, total 8-15 pixels
    4. Ensure markers span at least 6 distinct rows
    5. Verify background color and marker color are not in {blue, red, green, yellow}
