spec:
  grid: 23x23 [observed]
  background: black (0)
  rectangles:
    count: 2-3
    color: teal (8), solid filled
    height: even, 6-14
    width: even, 6-14
    min_dimension: >=6 in both h and w
    placement: non-overlapping, non-adjacent (min gap >=1 cell between any two)
  output:
    same grid size; background unchanged
    each teal rectangle replaced in-place by a quadrant-colored frame with yellow interior
    frame_width: 2 cells on all sides
    quadrant_colors:
      upper-left: magenta (6)
      upper-right: blue (1)
      lower-left: red (2)
      lower-right: green (3)
    interior: yellow (4), fills the (h-4)x(w-4) center
    quadrant split: at row h//2 and col w//2 (each quadrant is h/2 rows x w/2 cols)

generation_strategy:
  approach: direct (input-only; output is deterministic recoloring)
  steps:
    1. Create a 23x23 black grid.
    2. Choose rect count k in [2, 3].
    3. For each rectangle, pick even h in [6, 14] and even w in [6, 14].
    4. Place rectangles on the grid with at least 1 cell gap between any pair and from grid edges (all placements observed have >=1 cell margin from borders).
    5. Fill each placed rectangle with teal (8).
  notes: Retry placement if rectangles cannot fit without overlap/adjacency. With 23x23 grid and 2-3 small-to-medium rectangles, acceptance rate is high.
