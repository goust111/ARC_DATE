task_id: 29700607
type: move_along_path

spec:
  grid: 11-15 rows x 11-15 cols, always square [observed]
  background: 0
  src:
    description: contiguous run of 3 distinct non-bg colors on row 0
    count: always 3 [observed]
    position: roughly centered horizontally (center offset ~-1 from grid center) [observed]
  dst:
    description: each src color has 0 or 1 endpoint pixel on the left wall (col 0) or right wall (col w-1)
    count_with_endpoint: 2-3 per example; 0-1 colors lack an endpoint
    endpoint_row: row 2 to row h-2 (relative 0.14-0.90 of grid height)
    wall_side: left (col 0) or right (col w-1); at least 1 on each side when 3 endpoints exist [observed]
  path:
    description: L-shaped path per color -- vertical from src down its column, then horizontal to endpoint wall
    no_endpoint_case: vertical line from row 0 to bottom edge (row h-1) staying in src column
    path_length: 8-16 cells per color
  constraints:
    - all paths must be non-overlapping (no two paths share any cell)
    - all colors are distinct non-bg values
    - input contains only bg, the 3 src pixels on row 0, and 2-3 endpoint pixels; rest is bg
  output:
    description: input with all path cells painted in their respective src color

generation_strategy:
  approach: path-first -- build all L-shaped paths, verify non-overlap, then strip paths to get input
  steps:
    1. Pick grid size N x N, N in [11,15].
    2. Pick 3 adjacent columns near center for the src run.
    3. Assign 3 distinct non-bg colors.
    4. For each color, decide endpoint or no-endpoint (0-1 may have no endpoint).
    5. For colors with endpoints, pick wall side (col 0 or col w-1) and a row in [2, h-2].
    6. Build all L-shaped paths (vertical + horizontal segments). Verify no cell overlap between any pair; reject and retry if overlap occurs.
    7. Input = bg grid + 3 src pixels on row 0 + endpoint pixels on walls.
    8. Output = input + all path cells painted.
