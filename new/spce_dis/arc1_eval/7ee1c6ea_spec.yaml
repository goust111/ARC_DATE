spec:
  grid: 10x10 [observed]
  colors: exactly 4 — black(0), frame_color, swap_A, swap_B
  frame:
    color: gray(5) [observed]; appears ONLY as frame pixels
    shape: 1-cell-thick hollow rectangle, 6x6 to 8x8
    position: offset >= 1 from all grid edges; uniform gap on opposite sides [observed]
    interior_size: 4x4 to 6x6
  interior:
    colors: black + swap_A + swap_B (no frame color)
    black_fraction: 15-50% of interior cells
    swap_A and swap_B fill remaining cells in random-looking pattern
  outside:
    colors: black + swap_A + swap_B (same two swap colors, no frame color)
    black_fraction: 25-40% [observed]
    random-looking fill
  transform:
    region: strictly inside the frame (excluding frame border)
    rule: swap swap_A <-> swap_B; preserve black pixels, frame, and outside

generation_strategy:
  approach: direct construction (transform is trivial swap, no output-first needed)
  steps:
    1. Pick grid 10x10; choose frame_color=5, pick 2 distinct non-black non-5 swap colors
    2. Pick frame bbox with height,width in [6,8], offset >= 1 from all edges
    3. Draw 1-cell-thick hollow rectangle of frame_color
    4. Fill interior randomly with black (15-50%), swap_A, swap_B
    5. Fill outside region randomly with black (25-40%), swap_A, swap_B
    6. Verify exactly one rectangular frame is detectable (no accidental frame from outside colors)
