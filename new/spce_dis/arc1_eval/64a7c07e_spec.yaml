spec:
  grid: 5-12 rows x 5-12 cols, always square [observed]
  background: 0 (black)
  objects:
    count: 1-2, 8-connected foreground components
    color: single color per object (always 8/azure) [observed]
    bbox: always square (width == height), side 1-5
    density: 0.5-1.0 within bbox (can have holes/gaps)
    positioning: placed in the left portion of grid so that right_edge + bbox_width < grid_width
    separation: when multiple objects, they occupy disjoint row bands (no row overlap) [observed]
  rule: each object shifts right by its own bbox width; original cells cleared to background
  constraints:
    - shifted objects must stay within grid bounds
    - shifted objects must not overlap each other or other original positions
    - grid_width >= 2 * max_object_bbox_width + 1 (ensures room for shift)

generation_strategy:
  approach: output-first
  steps:
    1. Pick grid size N x N, N in [5, 12]
    2. Pick num_objects in [1, 2]
    3. For each object, pick a square bbox side S in [1, 5] ensuring 2*S+1 <= N
    4. Place objects in OUTPUT positions first (right-shifted locations), ensuring they fit within grid and don't overlap, each at least S cols from left edge
    5. Generate random 8-connected sprite patterns within each SxS bbox (density 0.5-1.0)
    6. Derive INPUT by shifting each object LEFT by its bbox width S, clearing output positions
    7. Verify no object touches grid left boundary col<0 (should hold by construction from step 4)
    8. Ensure objects don't share row bands to avoid shifted-object collisions
