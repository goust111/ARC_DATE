spec:
  grid: 12-19 rows x 12-16 cols, black background
  separator_lines:
    color: green (only non-black color in input)
    horizontal: 2-4 full-width green rows, never at row 0 or last row
    vertical: 2-4 full-height green cols, never at col 0 or last col
    no adjacent lines (gap >= 2 between any two)
    all green pixels lie exactly on these full rows/cols (no stray green)
  table_cells:
    rows: 3-5 bands (h-lines + 1), cols: 3-5 bands (v-lines + 1)
    band_width: 1-6 pixels each [observed]
    all cell interiors are black in the input
  output_rule:
    top-left corner cell -> red, top-right -> yellow
    bottom-left -> blue, bottom-right -> teal
    strictly interior cells (not on any border row/col band) -> orange
    all other edge-band cells remain black
    green separator lines preserved unchanged

generation_strategy:
  approach: direct construction (input is purely structural, no complex inversion needed)
  steps:
    1. Pick grid H in [12,19], W in [12,16]
    2. Choose num_hlines in [2,4], num_vlines in [2,4] ensuring (num_hlines+1)*(num_vlines+1) >= 9 so interior cells exist [observed]
    3. Partition H into (num_hlines+1) band heights >= 1 plus num_hlines separator rows; partition W similarly
    4. Place green lines at cumulative band boundaries; verify no line at row 0/last or col 0/last
    5. Fill everything else black; done -- input is black + green only
