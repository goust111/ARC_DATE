spec:
  grid: 9 rows x 10 cols [observed, solver handles any size]
  background: 0 (most frequent color); forms 1-cell-wide separator rows/cols including outer border
  lattice:
    rows: 2 bands [observed], cols: 3 bands [observed]; solver handles any NxM
    block_size: 3 rows x 2 cols [observed]; all blocks same size (required)
    separator_width: 1 [observed]
  blocks:
    each block contains 1-2 non-bg colors; no bg cells inside blocks (required)
    majority_color: strictly most frequent; occupies 4/6, 5/6, or 6/6 cells
    minority_color: 0-2 cells of one other non-bg color scattered in the block
    majority colors may repeat across blocks; minority may overlap with other blocks' majority
    total distinct non-bg colors per grid: 7-8 [observed]
  output:
    size: (lattice_rows + 2) x (lattice_cols + 2) = 4x5 [observed]
    1-cell bg border; interior cell (r,c) = majority color of block (r,c)

generation_strategy:
  approach: output-first
  steps:
    1. Choose lattice dimensions R=2, C=3 and block size BH=3, BW=2
    2. Pick bg=0. Choose 6 non-bg colors for the output interior (repeats allowed)
    3. Build the output grid with bg border and interior majority colors
    4. For each block, fill BH x BW cells with its majority color
    5. For each block, replace 0-2 cells with a random non-bg minority color (different from majority); ensure majority remains strictly dominant
    6. Assemble input by interleaving blocks with 1-wide bg separator rows/cols and bg border
