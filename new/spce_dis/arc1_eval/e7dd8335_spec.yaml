spec:
  grid: 7-11 rows x 7-11 cols
  background: BLACK (0)
  foreground:
    color: BLUE (1), exactly one foreground color
    pixels: 16-22
    connectivity: single 8-connected component with interior holes (outline-like, not solid)
  bbox:
    height: even, 6-8
    width: 4-10
    must contain foreground pixels in both upper and lower halves
  symmetry: UD symmetric [observed]; LR symmetric in 3/4 examples [observed]
  margins: >=0 on all sides; at least 1 side can touch grid edge
  transform:
    upper half of bbox (rows r0..r0+h/2-1) foreground pixels stay BLUE
    lower half of bbox (rows r0+h/2..r1) foreground pixels become RED (2)

generation_strategy:
  approach: output-first, then strip red to get input
  steps:
    1. Pick grid dims 7-11 x 7-11
    2. Pick even bbox height (6 or 8) and bbox width (4-10)
    3. Place bbox with >=0 margin on each side
    4. Generate an outline-like shape inside the bbox that is UD symmetric,
       8-connected, has interior holes, and occupies both halves.
       Technique -- draw a random closed outline within the bbox (e.g. border
       of a rectangle + internal bars, or an irregular outline), then mirror
       the top half downward to enforce UD symmetry
    5. Build output -- color upper-half fg BLUE, lower-half fg RED
    6. Build input -- replace all RED pixels with BLUE (uniform BLUE shape)
    7. Validate -- single 8-connected component, interior holes exist,
       fg in both halves, even bbox height
