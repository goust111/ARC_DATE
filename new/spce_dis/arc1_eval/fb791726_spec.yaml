spec:
  grid: square, H=W, 3-8 rows/cols
  background: black
  foreground_color: single color, not black or green
  pair_blocks:
    count: 1-3 (observed 1-2)
    structure: each block is 3 contiguous rows (pattern_row, blank_row, pattern_row) where the two pattern rows are identical
    placement: blocks are contiguous starting at row 0 [observed]
    constraint: H >= 3 * num_pairs; remaining rows below last block are all black
  pattern_row:
    pixels: exactly 1 foreground pixel per row [observed]
    column: any column 0..W-1; different pairs may use different columns
  output:
    size: 2H x 2W
    upper_left: input with gap rows overwritten to green
    lower_right: input with gap rows overwritten to green
    upper_right_and_lower_left: black except gap rows are green
    green_rows: each gap row becomes full-width green across all 2W columns in both row r and row r+H

generation_strategy:
  approach: direct construction (input is simple enough)
  steps:
    1. pick H = W in [3..8]
    2. pick num_pairs in [1..3] such that 3 * num_pairs <= H
    3. pick one foreground color from {1..9} excluding green (3)
    4. for each pair k (0-indexed), place a triplet at rows 3k, 3k+1, 3k+2 where rows 3k and 3k+2 share the same pattern (a single fg pixel at a random column) and row 3k+1 is blank
    5. remaining rows (3*num_pairs .. H-1) are all black
