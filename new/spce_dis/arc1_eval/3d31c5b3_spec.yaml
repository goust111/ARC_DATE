spec:
  grid: 12 rows x 6 cols (fixed); 4 equal-height bands of 3x6 stacked vertically
  background: black (0)
  bands:
    count: 4, each 3x6
    colors: band0=gray(5), band1=yellow(4), band2=red(2), band3=azure(8) [observed, always these colors in this order]
    each_band: exactly 1 non-black foreground color on black background; 4 band colors are distinct
    fg_density: 22-83% per band (no band is all-black or all-foreground)
    connectivity: 1-5 connected components per band; no regularity required
  output:
    size: 3x6 (one band height)
    rule: overlay all 4 bands at same position with priority band0 > band1 > band3 > band2; black where all 4 are black
    black_pixels: 0-3 positions may remain black (where all 4 bands are black)

generation_strategy:
  approach: direct random generation (task is simple enough)
  steps:
    1. Set grid to 12x6, band_height=3.
    2. Pick 4 distinct non-black colors (use [5,4,2,8] to match eval pattern).
    3. For each band, randomly set each cell to fg_color or black with density ~30-75%.
    4. Ensure each band has at least 1 fg pixel and at least 1 black pixel.
    5. Stack 4 bands vertically to form the 12x6 input.
    6. Compute output by painting bands in reverse priority order (band2, band3, band1, band0).
