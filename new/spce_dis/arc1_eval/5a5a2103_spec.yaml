spec:
  grid: NxN cell grid (N=3-5) with 1px divider bars; total size = N*4 + (N-1) per axis [observed: always square]
  cell_size: 4x4 [observed: constant across all examples]
  divider_bars: single non-bg color forms all full-row and full-column bars; 1px wide
  colors: N+3 total distinct colors — bg (0 [observed]), divider, template, and N marker colors; all mutually distinct
  markers:
    location: first column of cells, one per row band
    shape: centered 2x2 block within 4x4 cell [observed]
    color: unique per row, distinct from bg/divider/template
  template:
    location: exactly 1 non-first-column cell contains foreground pixels; all other non-first-column cells are empty
    pixels: 6-8 out of 16 [observed]; arbitrary pattern, may be disconnected (1-2 components [observed])
    color: single color, distinct from bg/divider/markers
  output:
    transform: clear all cell interiors to bg, stamp template mask into every cell recolored by that row's marker color
    divider bars unchanged

generation_strategy:
  approach: output-first
  steps:
    1. Pick N in [3,5]. Pick N+3 distinct colors for bg, divider, N markers, template.
    2. Build the output grid — N*4+(N-1) square. Fill divider bars. For each cell, stamp a random template mask (6-8 pixels, at least 1 pixel) using that row's marker color.
    3. Generate template mask — random 4x4 binary mask with 6-8 on-pixels.
    4. Build input from output — copy output, then replace all cell contents with bg except first-column cells get centered 2x2 marker blocks. Place template mask in one random non-first-column cell using the template color.
