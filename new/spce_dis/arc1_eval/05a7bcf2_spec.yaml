spec:
  grid: 30x30 [observed]
  background: black
  divider:
    type: single full-span horizontal or vertical line of teal (color 8)
    position: 9-19 from one edge, splitting grid ~1:2 (yellow side 9-10 deep, red side 19-20 deep)
  yellow_side:
    colors: black + yellow only; no red
    objects: 3-5 connected yellow components, total 13-23 pixels
    per_lane: 1-3 contiguous yellow pixels; 8-15 of 30 lanes contain yellow
    gap: 2-9 cells between nearest yellow pixel and divider (always >=1)
  red_side:
    colors: black + red only; no yellow
    structure: every lane has 1-5 contiguous red pixels, scattered freely; total 46-73 red pixels
    constraint: red count per lane <= red_side_depth
  output_transform:
    - original yellow pixels become green
    - gap between nearest yellow and divider fills with yellow
    - on red side, only lanes with yellow are affected -- fill with teal and pack red against far edge
    - lanes without yellow are unchanged; total red count preserved

generation_strategy:
  approach: output-first
  steps:
    1. pick grid 30x30, orientation (H or V), divider position (9-10 from yellow edge)
    2. place divider line of teal
    3. for each lane, decide if it has yellow (pick 8-15 lanes); assign 1-5 red pixels per lane (all 30 lanes get red)
    4. on yellow side, place 3-5 connected yellow blobs (each blob spans contiguous lanes); per blob-lane place 1-3 contiguous yellow pixels with gap >=2 to divider
    5. on red side, for non-yellow lanes scatter red contiguously at random positions; for yellow lanes also scatter red contiguously at random positions
    6. verify no lane exceeds red_side_depth in red count
