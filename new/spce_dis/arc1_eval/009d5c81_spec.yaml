spec:
  grid: 14x14, always
  background: black (0)
  foreground_colors: exactly 2 -- body=cyan(8) and marker=blue(1) [observed]
  body:
    desc: irregular shape, 8-connected (1 component), not necessarily 4-connected
    pixels: 14-31
    bbox: 3-8 rows x 7-10 cols, density 0.38-0.72
    placement: upper portion of grid (top row 0-2, bottom row 4-8)
  marker:
    desc: 3x3 glyph, one of 3 fixed patterns that encode a target color
    patterns:
      plus (5px) -> red, T-down (6px) -> green, T-up (6px) -> orange
    #  .#.   #.#   ###
    #  ###   .#.   #.#
    #  .#.   ###   .#.
    placement: lower portion of grid (top row 8-10), no overlap with body bbox
  output:
    body pixels recolored from cyan to the color decoded from the marker glyph
    marker pixels erased (set to background)
    grid size unchanged

generation_strategy:
  approach: direct construction (simple task, no inversion needed)
  steps:
    1. Create 14x14 black grid
    2. Pick one of 3 marker glyphs; place 3x3 marker (blue) in lower portion (rows 8-11, cols 0-11)
    3. Generate an 8-connected irregular body shape (cyan) in upper portion (rows 0-8, cols 0-13) with 14-31 pixels; ensure body bbox does not overlap marker bbox and body pixel count > marker pixel count
    4. Verify exactly 2 foreground colors, body is 8-connected, and bboxes are disjoint
    5. Build output by recoloring body pixels to decoded color and clearing marker
