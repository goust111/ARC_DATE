spec:
  grid: 14x14, background 0
  frame:
    color: 2 [observed]
    shape: hollow rectangle, border is 1-cell-wide single-color ring
    interior_has_no_frame_color: true
    size: 6x6 or 10x10 (interior 4x4 or 8x8, always even) [observed]
    position: anywhere on grid with >=0 margin on each side
  pattern:
    location: inside frame interior, tight bbox is exactly half the interior size
    structure: 2x2 arrangement of 4 distinct non-bg non-frame colors; each quadrant is a solid (N/2)x(N/2) block where N=interior side length
    offset: placed at arbitrary position within interior so remaining cells are bg
    colors: 4 distinct from {1-9} minus frame color
  output:
    crop to frame bbox; scale pattern 2x to fill interior exactly; frame border preserved

generation_strategy:
  approach: output-first
  steps:
    1. Pick N in {2, 4} (half-interior side). Frame size = 2N+2.
    2. Pick frame_color (default 2, or any non-bg color).
    3. Pick 4 distinct colors from {1..9} minus {bg, frame_color}.
    4. Build output: frame border of frame_color, interior filled with 2x2 block pattern scaled to NxN per quadrant (each quadrant is NxN solid color).
    5. Build input (14x14 bg grid): place frame at random valid position. Inside frame interior, place the half-scale pattern (N/2 x N/2 per quadrant, total NxN) at a random offset so it fits, fill rest of interior with bg.
