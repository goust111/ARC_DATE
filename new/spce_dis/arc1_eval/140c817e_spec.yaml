spec:
  grid: 9-14 square (NxN)
  background: single non-blue color (observed: maroon/cyan/orange)
  control_pixels:
    color: blue
    count: 2-4
    placement: all distinct rows AND all distinct columns
    separation: pairwise row-diff >= 2 and col-diff >= 2 [observed]
    edge: allowed (one test example has a corner pixel)
  output:
    same_size: true
    rule: |
      1. Paint full row and full column through each control pixel blue.
      2. Paint the 4 diagonal neighbors (if in-bounds) of each control pixel green.
      3. Recolor each control pixel red.
      Painting order matters: blue crosses first, green diagonals overwrite, red centers last.
    colors_added: red (centers), green (diagonal marks), blue (cross lines)

generation_strategy:
  approach: direct (input is trivially simple -- just bg + a few blue pixels)
  steps:
    1. Pick grid size N uniformly from 9-14.
    2. Pick background color randomly from non-blue, non-red, non-green colors.
    3. Pick num_controls from 2-4.
    4. Sample num_controls distinct rows and num_controls distinct columns,
       ensuring all pairwise row-diffs >= 2 and col-diffs >= 2.
    5. Place blue pixels at the (row_i, col_i) pairs on a bg-filled NxN grid.
