spec:
  grid: 4x4 [observed]; solver supports any h,w >= 3
  background: color 0 [observed]; solver uses most-frequent color
  foreground_block:
    shape: exactly 2x2, all 4 cells non-background
    colors: 4 distinct non-background colors [observed]
    position: anywhere such that the block does not touch the grid border (r in 1..h-3, c in 1..w-3) [observed: centered at (1,1)]
  transform:
    clear the 2x2 block and map each cell to the corresponding grid corner
    top-left of block -> grid[0,0]; top-right -> grid[0,w-1]
    bottom-left -> grid[h-1,0]; bottom-right -> grid[h-1,w-1]
  output: same-size grid, background everywhere except the 4 corners holding the block's colors

generation_strategy:
  approach: direct (task is simple enough)
  steps:
    1. Pick grid size h,w each from 4-8, ensuring h >= 3 and w >= 3
    2. Pick background color (0 is fine, or any single color)
    3. Pick 4 distinct non-background colors for the 2x2 block
    4. Pick block top-left position r0 in [1, h-3], c0 in [1, w-3]
    5. Fill grid with background, place the 4 colors in the 2x2 block at (r0,c0)
