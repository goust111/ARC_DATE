spec:
  grid: 3x3 [observed], could generalize to 2-5 rows x 2-5 cols
  colors: only BLACK (background) and GREY (foreground)
  grey_pixels: 3-5 per grid, density 33-56%
  connectivity: grey pixels may form 1 or multiple connected components
  transform: each pixel expands to a 2x2 block in a (2H x 2W) output
  black_pixel: becomes [[0,0],[0,0]]
  grey_pixel: becomes [[BLUE,RED],[RED,BLUE]] (checkerboard)
  output_colors: BLACK, BLUE (1), RED (2)

generation_strategy:
  approach: direct random generation (transformation is trivial local rewrite)
  steps:
    1. pick grid size H in [2,5], W in [2,5]
    2. fill grid with BLACK
    3. randomly set 25-60% of pixels to GREY (at least 2 grey pixels)
    4. output is deterministic 2x expansion of input
