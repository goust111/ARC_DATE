spec:
  grid: 15x15 input; output is lower panel only (9x15)
  layout:
    separator: row 5, solid gray (5) across full width
    upper_panel: rows 0-4 (5 rows); row 0 and row 4 are all-black padding
    lower_panel: rows 6-14 (9 rows x 15 cols)
  upper_panel_objects: # three 3x3 bboxes at fixed positions in rows 1-3
    template: cols 2-4, color blue (1), density 0.56-0.89; same shape in upper and lower
    marker: cols 6-8, color red (2), 5-cell T-shape; arm row is top or bottom
    sprite: cols 10-12, one color from {3,4,6,7,8}, density 0.44-0.89
  lower_panel_object:
    template_copy: same color (1) and pattern as upper template, placed so sprite fits adjacent
    placement: if arm-top, >=3 rows free below template; if arm-bottom, >=3 rows free above
    template_row_range: top-left row 1-5 within lower panel [observed]
    template_col_range: left col 1-8 within lower panel [observed]
  rule: |
    Output = lower panel. Paste sprite flush below (arm-top) or above (arm-bottom) template,
    left-aligned with template bbox. Only non-bg sprite pixels are pasted.

generation_strategy:
  approach: output-first
  steps:
    1. Generate a random 3x3 binary mask for template (density 0.56-0.89, at least 4 cells)
    2. Generate a random 3x3 binary mask for sprite (density 0.44-0.89, at least 4 cells)
    3. Choose T-arm direction (top or bottom) randomly
    4. Place template in lower panel (9x15) ensuring 3 free rows on the side indicated by arm
    5. Build output by pasting sprite adjacent to template on that side, left-aligned
    6. Build input grid (15x15) = upper(5 rows) + separator(row 5, gray) + lower(9 rows, template only)
    7. Fill upper panel row 1-3 with template at cols 2-4, red T at cols 6-8, sprite at cols 10-12
    8. Pick sprite color randomly from non-reserved colors (not 0,1,2,5)
