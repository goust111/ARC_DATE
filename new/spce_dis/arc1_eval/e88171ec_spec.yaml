spec:
  grid: 15-21 rows x 15-21 cols, always square [observed]
  background: random per-cell binary noise (black vs one primary non-black color)
  noise:
    primary_color: any non-black, non-teal color (1-7 except 8)
    secondary_color: optionally one additional non-black color at ~5-10% of non-black cells [observed]
    non_black_fraction: 50-65% of total grid cells
    distribution: independent uniform random per cell (no spatial structure)
  target_rectangle:
    color: black (0), solid axis-aligned rectangle
    min_side: 3
    size: 4-6 rows x 4-6 cols
    area_fraction: 6-10% of grid
    uniqueness: must be the strictly largest solid rectangle (any color) with min_side>=3; no ties allowed
    position: anywhere in grid (not touching edge required by size constraint)
  transform:
    rule: fill strict interior (excluding 1-cell border) with teal (8)
    border: 1-cell black border preserved unchanged
    rest: all other cells unchanged

generation_strategy:
  approach: construct rectangle first, then fill noise around it
  steps:
    1. Choose grid size N in [15,21] (square grid).
    2. Choose rectangle dimensions H_r in [4,6], W_r in [4,6].
    3. Place rectangle at random position ensuring it fits within the grid.
    4. Fill all cells outside the rectangle with random binary noise (black=0 with p~0.4, primary_color with p~0.6).
    5. Verify no accidental solid rectangle of any color (min_side>=3) in the noise has area >= H_r * W_r. If so, re-randomize the noise (rejection is rare given small rectangle sizes vs noisy background).
    6. Output is a copy of input with interior cells [r0+1:r1, c0+1:c1] set to teal.
