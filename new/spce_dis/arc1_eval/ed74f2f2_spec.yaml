spec:
  grid:
    input: fixed 5x9, only black(0) and grey(5)
    output: 3x3
  layout: |
    rows 0,4 all black; cols 0,4,8 all black
    left region: rows 1-3, cols 1-3 (code glyph)
    right region: rows 1-3, cols 5-7 (mask)
  code_glyph:
    exactly 5 grey pixels forming one of 3 shapes:
      T-shape: "###/.#./.#." -> BLUE(1)
      S-shape: "##./.#./.##" -> RED(2)
      Z-shape: ".##/.#./##." -> GREEN(3)
  mask:
    grey pixel count: 4-7 out of 9 [observed]
    any pattern of grey/black in 3x3; must have >=1 grey pixel
  transform: output = right mask with grey pixels replaced by color decoded from left glyph

generation_strategy:
  approach: direct construction (task is simple, no inversion needed)
  steps:
    1. create 5x9 black grid
    2. pick one of 3 code glyphs uniformly; place in rows 1-3, cols 1-3
    3. generate random 3x3 mask with 4-7 grey pixels (reject if all black)
    4. place mask in rows 1-3, cols 5-7
    5. output = 3x3 mask with grey replaced by codebook color, black stays black
