spec:
  grid: 10-18 rows x 12-18 cols
  background: 0
  sprite:
    color: 1 [observed]
    bbox: 2x2 or 3x3 [observed]
    area: 3-6 pixels, 8-connected, density 0.67-0.75
    count: 3-6 (equal to area)
  layout:
    pattern: sprites arranged on an NxN grid (N = sprite bbox side) where occupied cells exactly match the normalized sprite shape
    separation: 1 cell gap between adjacent sprite bboxes in both row and column directions
  legend:
    pixel_count: equals sprite count (one pixel per sprite)
    occupancy: same NxN pattern as the sprite shape / layout
    spacing: 1 cell between consecutive legend rows and columns
    colors: 2-4 distinct non-bg non-source colors; repeats allowed
    placement: does not overlap any sprite; anywhere on grid with room
  transform:
    each sprite is recolored to the legend color at the matching (row-rank, col-rank) position
    legend and background unchanged

generation_strategy:
  approach: output-first
  steps:
    1. Choose sprite bbox side N in {2, 3}; generate an 8-connected shape of area A within NxN (A < N*N, A >= 3)
    2. The shape's normalized cell set S defines both the sprite layout and the legend occupancy
    3. Build NxN legend grid; for each cell in S assign a non-bg non-source color (2-4 distinct, repeats OK)
    4. Build the sprite cluster as |S| copies of the shape on an NxN layout with 1-cell gaps; recolor each copy per legend -> this is the output state
    5. Place legend and sprite cluster on a grid (10-18 x 12-18) with no overlap and >= 0 padding
    6. To get input, revert all sprite copies to source color (1); keep legend
