spec:
  grid: 3 rows x 3 cols [observed]
  colors: 2-3 distinct non-black colors (from palette 1-9)
  symmetry: input must NOT be left-right symmetric (ensures non-trivial output)
  transform: |
    tile = [fliplr(input) | input]
    output = [tile | tile]
    output is same height, 4x width
  output: same height as input, width = 4 * input_width

generation_strategy:
  approach: direct random (trivial transform, no inversion needed)
  steps:
    1. pick grid size R x C (R in 2-5, C in 2-5) [observed: always 3x3]
    2. pick 2-3 colors from non-black palette (1-9)
    3. fill grid randomly with chosen colors
    4. reject if grid is left-right symmetric
