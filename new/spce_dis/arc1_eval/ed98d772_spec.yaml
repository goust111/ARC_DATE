spec:
  grid: 3x3 square [observed]
  background: black (0)
  sprite:
    colors: exactly 1 non-black foreground color (any from ARC palette)
    fg_cells: 4-7 out of 9
    symmetry: not rotationally symmetric by 90 degrees (ensures the 4 quadrants differ)
  output:
    size: 6x6 (2*input side)
    layout: 2x2 pinwheel of the input under rotation
    top_left: original
    top_right: 90-degree CCW rotation (np.rot90 k=1)
    bottom_left: 180-degree rotation (np.rot90 k=2)
    bottom_right: 90-degree CW rotation (np.rot90 k=-1)

generation_strategy:
  steps:
    1. Pick grid side n=3 [observed, solver supports any n>0].
    2. Pick 1 random foreground color from ARC palette (1-9).
    3. Fill an n x n grid randomly with fg/bg, ensuring 4-7 fg cells.
    4. Reject if the grid has 90-degree rotational symmetry (all 4 quadrants would be identical, making the task trivial).
    5. Return the grid as input.
