spec:
  grid: odd square, side length 5-29
  input: all cells are color 0 (black)
  output: same dimensions; cells where row%2==0 OR col%2==0 become color 1 (blue); cells where both row and col are odd remain color 0
  pattern: period-2 lattice anchored at top-left corner, forming a grid of 1-wide blue lines with 1x1 black holes at odd/odd intersections

generation_strategy:
  approach: direct construction (input is trivial)
  steps:
    1. pick odd side length N uniformly from {5,7,9,...,29}
    2. create NxN grid filled with 0
    3. return as input (output is deterministic from input)
