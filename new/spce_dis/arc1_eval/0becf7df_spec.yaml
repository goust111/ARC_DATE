spec:
  grid: 10x10, background 0 [observed]
  legend:
    position: top-left 2x2 block at (0,0)-(1,1)
    content: 4 distinct non-zero colors, all different from each other
    rows: each row defines a bidirectional swap pair (left <-> right)
  main_object:
    colors: exactly the same 4 colors as the legend
    connectivity: single 4-connected component, separated from legend by >=1 bg column
    pixel_count: 13-23
    bbox: 6-8 rows x 4-6 cols, top row overlaps legend rows (row 1), does not reach grid edge [observed]
    density: 0.48-0.72 within bbox
    per_color: each of the 4 colors has 2-8 pixels (no color dominates excessively)
  transform:
    legend and background unchanged
    each foreground pixel outside legend swapped to its row-mate color in the legend
    all swaps simultaneous (use original colors)

generation_strategy:
  approach: direct construction (transform is trivially invertible)
  steps:
    1. Pick 4 distinct non-zero colors; assign to 2x2 legend at (0,0)-(1,1)
    2. Choose object bbox starting at row 1, col >= 2, spanning 6-8 rows and 4-6 cols within the 10x10 grid
    3. Build a single 4-connected blob within the bbox using all 4 legend colors, with 13-23 total pixels and density 0.45-0.75; ensure each color appears at least 2 times
    4. Verify legend and object are separated by >=1 bg column (col 2 of object bbox >= 3, or no object pixel in cols 0-1)
    5. Place legend and object on a 10x10 bg=0 grid
    6. Output = apply simultaneous pairwise swap of legend row colors to the object pixels
