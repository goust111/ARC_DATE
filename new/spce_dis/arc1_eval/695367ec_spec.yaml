spec:
  input:
    grid: NxN solid square, N in 2-6 [observed 2-5]
    color: single non-black color, uniform across all cells
  output:
    grid: fixed 15x15, black background
    lattice: full-spanning rows and columns painted in input color at indices N, 2N+1, 3N+2, ... (i.e. arange(N, 15, N+1))
    separator_count: 2-5 lines [observed], at least 1 required by solver
  transform: |
    The input square's side length N sets the lattice cell spacing.
    Separator lines appear at positions N, 2N+1, 3N+2, etc. within [0,14].
    Every pixel on a separator row or column gets the input color; all others stay black.

generation_strategy:
  approach: direct (input-only; output is deterministic from input)
  steps:
    1. Pick N uniformly from {2, 3, 4, 5, 6}.
    2. Pick a non-black color c (1-9).
    3. Return an NxN grid filled entirely with c.
