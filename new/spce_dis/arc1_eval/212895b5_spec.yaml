spec:
  grid: 16-21 rows x 17-23 cols
  colors:
    bg: black (0)
    square: azure (8) [observed]
    blocker: gray (5) [observed]
    output_ray: red (2), output_ribbon: yellow (4)
  square:
    shape: solid 3x3, exactly one per grid
    margin: >=5 cells from every edge
  blockers:
    count: 24-64 (scales with grid area); density ~6-13%
    mostly isolated single pixels; occasional 2-3 cell clusters (4-connected)
    no blocker on the 8 ray/ribbon start cells (the ring just outside the 3x3 square corners and side-centers)
  transform:
    red_rays: 4 diagonal rays from square corners (NW/NE/SW/SE), each extends 1 cell per step until hitting edge, blocker, or horizontal pinch (both left+right neighbors non-bg)
    yellow_ribbons: 4 diagonal ribbons from side-centers in clockwise pinwheel (top->NE, left->NW, bottom->SW, right->SE); alternates single-cell (even steps) and 3-cell orthogonal slice (odd steps); stops when any cell in a slice is out-of-bounds or non-bg
    ray lengths: 0-10 cells; ribbon steps: 0-5 steps
    total painted cells: 31-52 across all rays+ribbons
  constraints:
    at least 4 of the 8 emitters (4 rays + 4 ribbons) must extend >=2 steps [observed]

generation_strategy:
  approach: output-first
  steps:
    1. Pick grid size H in [16,21], W in [17,23].
    2. Place 3x3 square with center (rm, cm) ensuring >=5 margin on all sides.
    3. For each of the 4 red ray directions, choose a target length L in [1,8] (capped by margin). Place a blocker pixel at the cell where the ray would stop (just beyond L). If L equals max margin, no blocker needed (edge stops it).
    4. For each of the 4 yellow ribbon directions, choose target steps S in [1,5] (capped by margin). Place a blocker at the first cell of step S (or within the 3-cell slice at odd step S). If S equals max, edge stops it.
    5. Scatter additional blocker pixels randomly on remaining bg cells (avoid the 3x3 square and the ray/ribbon start ring). Target total blocker count ~6-13% of grid area. Allow small 2-3 cell clusters.
    6. Verify solver produces >=30 painted cells; if not, reduce blocker density and retry.
