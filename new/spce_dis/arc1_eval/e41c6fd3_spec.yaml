spec:
  grid: 13-17 rows x 23-30 cols, background BLACK
  sprites:
    count: 3-5 distinct foreground colors, one must be TEAL (anchor)
    shape: all sprites share identical 4-connected mask within bbox of 4-5 rows x 4-6 cols
    density: 0.60-0.80 of bbox filled
    symmetry: LR [observed]
    connectivity: single 4-connected component per color
  placement:
    columns: each sprite at distinct left column; column gaps >= sprite_width (no horizontal overlap when aligned)
    rows: each sprite at a different top row; vertical spread 6-10 rows between min/max top
    fit: anchor_top + sprite_height <= grid_rows (aligned sprites must fit)
    no_overlap: sprites must not overlap in the input either
  anchor: TEAL sprite determines the target top row for output alignment
  output: clear grid to bg, paste each sprite at (anchor_top, original_left)

generation_strategy:
  approach: output-first
  steps:
    1. Choose grid dimensions (13-17 rows, 23-30 cols) and sprite count N (3-5)
    2. Generate a random 4-connected LR-symmetric sprite mask in a 4-5 x 4-6 bbox with density 0.6-0.8
    3. Pick N distinct colors including TEAL; assign each a left column such that consecutive lefts differ by >= sprite_width (place output)
    4. Choose anchor_top (the shared top row in output) ensuring anchor_top + sprite_height <= grid_rows
    5. Build output by pasting the sprite mask in each color at (anchor_top, left_col)
    6. Build input by displacing each sprite vertically: assign each a random top row != anchor_top (except TEAL stays at anchor_top), ensuring sprites don't overlap and fit within grid bounds; spread tops over 6-10 row range
