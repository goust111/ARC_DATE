spec:
  grid: 6-16 rows x 6-13 cols, background black (0)
  frames:
    count: 1-5 monochrome one-cell-thick rectangular frames
    colors: any non-black, non-grey(5), non-orange(7) color; multiple frames may share a color
    dimensions: 3x3, 3x4, or 4x3 [observed]; solver allows >=3 in each dimension
    interior: background-colored; area 1 (3x3) or 2 (3x4/4x3) [observed]
    placement: non-overlapping, min 2-cell gap between bounding boxes [observed]; may touch grid edges
  transform:
    rule: fill each frame's interior with grey(5) if interior area == 1, orange(7) if > 1
    frame borders preserved unchanged

generation_strategy:
  approach: direct construction (task is simple enough; no inversion needed)
  steps:
    1. Choose grid size within observed ranges
    2. Pick number of frames 1-5
    3. For each frame pick a color from {1,2,3,4,6,8,9} (excluding 0,5,7) and a size from {3x3, 3x4, 4x3}
    4. Place frames on the grid with no overlap and min 1-cell bbox gap; allow touching grid edges
    5. Draw each frame as a solid-color border with black interior
    6. Output = input with interiors filled per the area rule
