spec:
  grid: 15x15 [observed]
  background: black (0)
  blue_markers:
    color: blue (1)
    count: 4-8
    position: interior only (rows 1-13, cols 1-13; min 1 cell from border)
    separation: Chebyshev distance >= 3 between any two markers (no overlapping 3x3 neighborhoods)
  obstacles:
    description: randomly scattered single-pixel noise across the grid
    distinct_colors: 4-7 (any non-black non-blue color)
    total_cells: 70-101 (31-45% of grid)
    per_color_cells: 4-32
    connectivity: mostly isolated single pixels; occasional 2-4 cell clusters
  interaction: >=50% of markers have at least 1 obstacle in their 3x3 neighborhood [observed]
  transform:
    rule: for each blue marker, fill all black cells in its 3x3 neighborhood with blue
    obstacles in the neighborhood are preserved unchanged

generation_strategy:
  approach: direct construction (simple task, no inversion needed)
  steps:
    1. Create 15x15 black grid
    2. Choose 4-8 marker positions in rows 1-13, cols 1-13 with pairwise Chebyshev distance >= 3
    3. Choose 4-7 obstacle colors from non-blue palette
    4. Scatter 70-101 obstacle pixels randomly on non-marker cells (uniform across grid including borders)
    5. Place blue markers at chosen positions
    6. Ensure at least half of markers have >=1 obstacle in their 3x3 neighborhood; if not, add a few obstacle pixels into sparse marker neighborhoods
