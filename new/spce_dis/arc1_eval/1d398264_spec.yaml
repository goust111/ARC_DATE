spec:
  grid: 10-20 rows x 10-20 cols, square, background 0
  block:
    shape: filled 3x3, all 9 cells non-background
    center_color: unique color appearing exactly once in block, not in surrounding 8
    surround_colors: 3-4 distinct non-bg colors across the 8 non-center cells
    total_distinct_colors: 4-5 (center + surround colors), none is bg
    symmetry: never LR or UD symmetric [observed]
  placement:
    min_distance_center_to_any_edge: 2-3
    max_distance_center_to_any_edge: 6-16
  output:
    same grid size, input preserved
    each non-center cell emits a ray in its compass direction from center
    ray painted with that cell's color, extending from the cell outward to grid edge
    center cell unchanged; 8 rays total, lengths 2-16 pixels each

generation_strategy:
  approach: direct (input is simple; no inversion needed)
  steps:
    1. Pick grid size H=W uniformly from 10-20
    2. Pick center position (r,c) with min 2 margin from every edge, at least one edge within 3
    3. Choose 1 center color and 3-4 surround colors, all distinct, all from 1-9
    4. Fill 3x3 block -- assign surround colors to the 8 cells ensuring no LR/UD symmetry and center color unique
    5. Rest of grid is 0
