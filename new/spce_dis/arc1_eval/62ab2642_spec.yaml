spec:
  grid: 5-15 rows x 5-12 cols (area 60-150)
  colors_input: BLACK (background) + GREY (walls) only
  colors_output: same plus ORANGE (smallest region) and TEAL (largest region)
  walls:
    color: GREY
    width: exactly 1 cell (no 2x2 grey block anywhere)
    connectivity: single 4-connected component [observed]
    fraction: 35-44% of grid cells [observed]
  black_regions:
    definition: 4-connected components of BLACK pixels
    count: 7-8
    area_min: 1-4 (unique -- no tie for smallest)
    area_max: 10-23 (unique -- no tie for largest)
    area_ratio: >=5 between largest and smallest [observed]
    all regions touch the grid border [observed]
  transform:
    recolor unique-smallest black region ORANGE
    recolor unique-largest black region TEAL
    all other pixels unchanged

generation_strategy:
  approach: direct wall generation with validation
  steps:
    1. Pick random H in [5,15], W in [5,12].
    2. Generate a single connected grey wall network on the grid with 1-cell-wide constraint (no 2x2 grey). Use a random walk / spanning-tree approach starting from a random cell, growing grey paths that branch and meander. Target grey fraction ~35-44%.
    3. Compute all 4-connected BLACK components. Require 7-8 regions with unique min and unique max area, and min != max.
    4. If constraints not met, retry from step 2 (or adjust wall placement).
    5. Input is the BLACK+GREY grid. Output is produced by coloring smallest region ORANGE, largest TEAL.
