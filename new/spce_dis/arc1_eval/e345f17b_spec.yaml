spec:
  grid: 4x8 [observed], generalizable to H x 2W where H=3-6, W=3-6
  background: BLACK
  layout: two equal-size panels side by side (left W cols, right W cols)
  left_panel:
    colors: BLACK + PINK only
    foreground_density: 38-62% [observed], use 30-70%
  right_panel:
    colors: BLACK + GREY only
    foreground_density: 38-75% [observed], use 30-70%
  constraint: panels share no foreground color; each cell is independently fg or bg
  output:
    size: H x W (one panel)
    rule: YELLOW where both panels are BLACK at the same position, else BLACK
    yellow_count: >=1 (at least one cell is bg in both panels)
  output_yellow_density: 12-44% [observed]

generation_strategy:
  approach: output-first
  steps:
    1. pick H in 3-6, W in 3-6
    2. generate output panel (H x W) with some YELLOW cells on BLACK bg; yellow density 15-45%, at least 1 yellow
    3. for each cell in output, if YELLOW => both panels are BLACK at that position; if BLACK => at least one panel has foreground
    4. for BLACK-output cells, randomly assign which panel(s) get foreground -- at least one must be fg, both can be fg
    5. build left panel -- fg cells are PINK, bg cells are BLACK
    6. build right panel -- fg cells are GREY, bg cells are BLACK
    7. concatenate left and right panels horizontally to form 2W-wide input
    8. verify each panel has >=30% foreground density; reject if not
