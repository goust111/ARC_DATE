spec:
  grid: always 3x3
  colors: 1-5 distinct non-black colors (values 1-9, never 0)
  color_counts_per_cell: no constraint on frequency distribution
  transform: |
    scale = number of distinct colors in input.
    Output is 3*scale x 3*scale: each input pixel becomes a scale x scale solid block.
  output_size: 3-15 rows/cols (3*scale where scale=1..5)

generation_strategy:
  approach: direct (input is simple enough to generate directly)
  steps:
    1. Pick n_colors uniformly from 1-5.
    2. Sample n_colors distinct colors from 1-9 (excluding 0).
    3. Fill a 3x3 grid randomly using exactly those n_colors (each color appears at least once).
    4. Output = scale_sprite(grid, n_colors).
