spec:
  grid:
    height: 6 [observed]
    width: 2*panel_width + 1, panel_width 3-6 [observed 4]
  separator:
    single full-height vertical column of a non-black color
    position: middle column (col = panel_width) dividing two equal-width panels
    color: any non-black color not used in panels [observed BLUE]
  panels:
    two equal-sized rectangular regions (left of separator, right of separator)
    background: BLACK
    foreground: single non-black, non-separator color [observed YELLOW]
    density: each panel 25-67% foreground cells
    overlap: panels share some foreground positions (2-9 cells) [observed]
    union: 75-83% of panel area [observed]; at least 1 black cell in output
  output:
    same size as one panel (height x panel_width)
    cell is TEAL if either panel has foreground at that position, else BLACK
    no all-black rows or columns [observed]

generation_strategy:
  approach: output-first
  steps:
    1. Pick panel_width (3-6) and height (4-8); compute grid_width = 2*panel_width + 1
    2. Choose separator_color (non-black) and panel_fg_color (non-black, different from separator)
    3. Build the output panel (height x panel_width) with TEAL/BLACK; target 70-85% TEAL density, ensure no all-black rows/columns and at least 1 BLACK cell
    4. For each TEAL cell, randomly assign it to left-only, right-only, or both panels (at least some overlap); map TEAL -> fg_color in assigned panel(s), BLACK -> BLACK in both
    5. For each BLACK cell in output, both panels must be BLACK at that position
    6. Assemble input as [left_panel | separator_col | right_panel]
