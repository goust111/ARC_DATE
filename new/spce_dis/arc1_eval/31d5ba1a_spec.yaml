spec:
  grid: 6 rows x 5 cols (all examples identical) [observed]
  structure: |
    Input is vertically split into two equal halves (top and bottom), each 3x5.
    Each half has one shared background color and one unique foreground color.
  background: single color shared by both halves; always BLACK(0) [observed]
  top_half:
    foreground: one color, distinct from bottom fg; always MAROON(9) [observed]
    fg_density: 5-9 cells out of 15 (33%-60%)
    components: 2-5 connected components (scattered, not necessarily one blob)
  bottom_half:
    foreground: one color, distinct from top fg; always YELLOW(4) [observed]
    fg_density: 8-10 cells out of 15 (53%-67%)
    components: 1-4 connected components
  overlap: top and bottom fg masks overlap at 3-7 cells (always non-zero)
  output:
    size: half-height x width (3x5)
    colors: background + PINK(6) only
    rule: PINK at positions where exactly one half has foreground (XOR); background where both agree
    pink_cells: 5-9 cells

generation_strategy:
  approach: direct random (task is simple enough)
  steps:
    - Pick grid size (use 6x5 to match eval, or vary H=4-8 even, W=4-6 for diversity)
    - Choose background color; choose two distinct non-bg, non-PINK foreground colors
    - For each half, randomly fill ~33%-67% of cells with that half's foreground color
    - Ensure the two fg masks have non-zero XOR (at least 1 cell differs) and non-zero overlap (at least 1 cell both fg)
    - Stack top and bottom halves to form the input grid
