spec:
  grid: 11-15 rows x 7-9 cols, black background
  bar:
    color: grey
    width: 1 pixel
    anchored: top edge (row 0), contiguous downward
    height: 4-7 cells
    column: 2-4 (at least 1 col on each side)
  transform:
    preserve: grey bar unchanged
    left_fill: for each column d=1..bar_col, fill teal from top for min(grid_height, bar_height + 2*d) cells
    right_fill: for each column d=1..cols_right, fill pink from top for bar_height - 2*d cells; stop when non-positive
  constraints:
    cols_left: 2-4
    cols_right: 3-5
    at_least_1_pink_column: bar_height >= 3 (so bar_height - 2 >= 1) [observed]
    pink_visible_columns: 1-3
    left_clipping: may or may not clip to grid height [observed]

generation_strategy:
  approach: direct (input is trivial -- single bar on black)
  steps:
    1. Pick grid H in [11,15], W in [7,9]
    2. Pick bar_col in [2, W-2] ensuring cols_right >= 2
    3. Pick bar_height in [3, min(H-1, 7)] ensuring bar_height - 2 > 0 (at least 1 pink col visible)
    4. Place grey bar at column bar_col, rows 0..bar_height-1 on black grid
