spec:
  grid: 7-11 rows x 7-13 cols
  background: 0
  object:
    count: exactly 1, single non-zero color (any 1-9), 4-connected
    bbox_height: 2-7
    bbox_width: 3-6
    pixel_count: 6-22
    density_in_bbox: 0.27-1.00
    shape: arbitrary connected blob; may be hollow frame, solid block, or irregular [observed]
    margins: >=1 on all sides from grid edges
  transform:
    anchor: bottom row of object bbox
    rule: each fg pixel at (r,c) moves to (r, c-(bottom-r)); pixels shifted past left edge are clipped
    clipping: 0-3 pixels may be lost; left_margin < obj_height is allowed
    output: same grid size, same bg/fg colors

generation_strategy:
  approach: direct (input-first) — the transform is a simple deterministic shear, no complex constraints
  steps:
    1. Pick grid H in [7,11], W in [7,13]
    2. Pick a single fg color from 1-9
    3. Generate a random 4-connected object with bbox height h in [2,7], width w in [3,6]
    4. Place object so all margins >= 1; left_margin >= 1 (some clipping OK)
    5. Ensure fg pixel count < total/2 (bg must dominate)
    6. Apply shear transform to derive output
