spec:
  grid: 15x15 [observed, all examples identical]
  background: black(0) [observed]
  frame:
    color: green(3), single foreground color [observed color, solver derives dynamically]
    shape: 1-pixel-thick solid rectangle
    bbox: rows 2-10, cols 3-11 (9x9) [observed, all identical]
    interior: 7x7 [observed]
  control_pixel:
    count: exactly 1, same color as frame
    position: anywhere inside the interior (can touch interior edge or be fully interior)
  output_transform:
    preserve: frame, control pixel, everything outside frame
    fill: each bg pixel inside frame colored by Chebyshev distance to control pixel
    colors: odd distance -> yellow(4), even distance -> red(2) (hardcoded in solver)

generation_strategy:
  approach: direct construction (task is simple enough)
  steps:
    1. Create 15x15 black grid
    2. Draw green(3) rectangular frame at rows 2-10, cols 3-11
    3. Pick a random position (r,c) in the 7x7 interior and place green(3) control pixel
  note: |
    All eval examples share identical grid size, frame size, and frame position.
    To add variety, consider varying grid size (10-20), frame size (5-13 odd),
    frame position, and frame color from non-red/yellow colors, while keeping
    fill colors yellow(4)/red(2) as required by solver. Frame interior must be
    at least 3x3 so concentric rings are visible.
