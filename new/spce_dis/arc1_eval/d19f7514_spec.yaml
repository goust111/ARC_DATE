spec:
  grid: 12 rows x 4 cols (two 6x4 panels stacked vertically) [observed]
  panels:
    layout: top panel above bottom panel, same dimensions
    top: green (3) foreground pixels on black (0) background
    bottom: grey (5) foreground pixels on black (0) background
    fg_density_each: 33-62% of panel cells per mask
  output:
    size: one panel (6x4) [observed]
    rule: pixel-wise union of top and bottom masks, colored yellow (4) on black (0)
    union_density: 50-88% of panel cells

generation_strategy:
  approach: direct random (task is simple enough)
  steps:
    1. Pick panel dimensions H=6, W=4 (fixed from eval; could generalize to 4-8 x 3-6)
    2. Generate green mask -- randomly set each cell to green with probability 35-65%
    3. Generate grey mask independently -- same approach, probability 35-65%
    4. Ensure each mask has at least 1 fg pixel (reject if empty)
    5. Stack top (green) and bottom (grey) vertically to form the 12x4 input
    6. Compute output as union of both masks recolored to yellow
