spec:
  grid: 10x10, black background [observed]
  foreground_colors: exactly blue(1), red(2), green(3), yellow(4) - all four must be present
  pixel_counts:
    per_color: 2-8 pixels each
    total: 13-25 foreground pixels [observed]
    constraint: each count <= grid height (so bars fit)
  placement: pixels scattered randomly across the grid (no structural pattern required)
  output:
    same dimensions as input
    columns 0-3 filled bottom-up with blue/red/green/yellow bars respectively
    bar height = count of that color in input
    all other cells black

generation_strategy:
  approach: direct random placement (input is the unconstrained structure)
  steps:
    1. Create 10x10 black grid
    2. For each of 4 colors, pick a count uniformly from [2, 8]
    3. Randomly select that many unique cells from all 100 grid positions (without replacement across colors)
    4. Place each color's pixels at their assigned cells
