spec:
  grid: 14-22 rows x 3-5 cols, tall and narrow
  background: BLACK
  foreground_colors: exactly BLUE and TEAL
  objects:
    type: solid rectangles (fully filled, no holes)
    count: 8-16 per grid
    height: 1-3 rows each (mostly 1-2)
    width: 2 to grid_width cols (>=2, never 1)
    stacking: objects tile all rows top-to-bottom with no gaps and no overlaps; sum of heights == grid height
    color_alternation: strictly alternating BLUE/TEAL in top-to-bottom order; first color is either
    left_offset: each rect has arbitrary column offset; rect does not need to touch left or right edge
  transform:
    ordering: sort objects by (top_row, left_col) -- equivalent to top-to-bottom since no row sharing
    recolor: every 3rd object starting from rank 0 (indices 0, 3, 6, ...) becomes RED
    all other objects and background unchanged

generation_strategy:
  approach: direct construction (constraints are easy to satisfy forward)
  steps:
    1. Pick grid width W in [3,5] and object count N in [8,16]
    2. Generate N rectangle heights (each 1-3, mostly 1-2); grid height H = sum of heights; reject if H < 14 or H > 22
    3. Assign alternating colors BLUE/TEAL starting with a random choice
    4. For each rectangle, pick a width in [2, W] and a random column offset in [0, W-width]
    5. Stack rectangles top-to-bottom filling all rows
    6. Build input grid with BLACK background and place each colored rectangle
