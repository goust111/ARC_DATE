spec:
  grid: 2-5 rows x 3-6 cols; output is 3x tiled (3H x 3W, must be <=30x30 so H<=10, W<=10)
  background: black (0)
  foreground:
    color: single color, not blue (1) or green (3); observed {2,4,5,6}
    count: 1-3 pixels, very sparse (density <=12.5%)
    placement: anywhere in grid, may be on edges or interior
  rows_with_fg: 1-2 rows contain fg pixels [observed]
  transform:
    step1: tile input 3x3 to produce output canvas
    step2: in every row containing a tiled fg pixel, fill all bg cells with blue (1)
    step3: for each tiled fg pixel at (r,c), if (r-1,c-1) or (r+1,c+1) is still bg, set it to green (3)
  output_colors: bg + fg_color + blue (1) + green (3)

generation_strategy:
  approach: direct input generation (transform is deterministic tiling + marking)
  steps:
    1. pick H in [2,10], W in [2,10] such that 3H<=30 and 3W<=30
    2. pick one fg color from {2,4,5,6,7,8,9} (exclude 0,1,3)
    3. pick fg_count in [1,3]
    4. create H x W grid of zeros
    5. place fg_count pixels at random distinct positions
    6. ensure at least one fg pixel exists (trivially satisfied)
  notes: no hard constraints on placement; solver handles all positions including edges and corners
