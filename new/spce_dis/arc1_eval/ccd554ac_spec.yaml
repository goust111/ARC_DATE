spec:
  task_type: symmetry/pattern (tiling)
  tile:
    shape: square NxN, N in 2-5
    colors: exactly 2 distinct colors, one is always black (0) [observed]
    non_black_color: any single non-black color (1-9) [observed]
    cell_distribution: both colors present; ratio varies freely
    symmetry: none required (most examples are asymmetric)
  transform:
    output: tile repeated N times in each axis, producing N^2 x N^2 grid
    formula: output = np.tile(input, (N, N))

generation_strategy:
  steps:
    1. pick N uniformly from 2-5
    2. pick one non-black color c from 1-9
    3. fill an NxN grid randomly with 0 and c (ensure both colors appear at least once)
  notes: trivially correct; no output-first needed since any valid tile produces a valid task
