spec:
  grid: 2-10 rows (must be even) x 1-8 cols
  colors: 2-4 non-maroon colors; maroon (9) must be absent from input
  regions:
    top_half: rows 0..H/2-1, uses 1-2 colors
    bottom_half: rows H/2..H-1, uses 1-2 colors
    halves_may_share_colors: true
  output:
    size: (H+1) x (W+1), filled with maroon (9)
    top_half: copied to (0,0)
    bottom_half: copied to (H/2+1, 1) — offset by +1 row, +1 col
    result: L-shaped maroon separator between the two halves

generation_strategy:
  approach: input-first (task is trivial — any valid input produces a valid output)
  steps:
    1. Pick H (even, 2-10) and W (1-8).
    2. Pick 2-4 colors from non-maroon palette.
    3. Fill an HxW grid randomly with chosen colors.
    4. Verify maroon is absent (guaranteed by step 2).
    5. Output is deterministic from solver — no need to construct it.
