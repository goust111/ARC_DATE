spec:
  grid: odd square, 15-19 rows/cols
  background: 7
  divider: color 4, fills center column except center cell
  marker: color 8, appears at exactly (cr,0), (cr,cc), (cr,w-1) where cr=cc=h//2
  source_object:
    location: entirely in left half (cols < cc), right edge always at col cc-1
    connectivity: single connected component
    colors: 3-7 distinct colors, all disjoint from {4, 7, 8}
    left_edge: uniform single color (outermost shell)
    width_profile: monotonically increases then decreases (convex), steps of 0-2 per row
    max_width: 5-7 cols
    row_span: 10-15 rows, always includes center row, >=1 empty rows above and below
    pixel_count: 35-83
  right_half: entirely background (7) in input, receives 180-rotated copy in output
  transform: for each source pixel at (r,c), paint (2*cr-r, 2*cc-c) with same color

generation_strategy:
  approach: output-first
  steps:
    1. Pick odd N in [15,19]; create NxN grid filled with bg=7
    2. Place divider (4) in center column, marker (8) at (cr,0), (cr,cc), (cr,w-1)
    3. Design source object in left half abutting col cc-1
       a. Choose convex width profile (grow 0-2 per row, then shrink 0-2), 10-15 rows, spanning center row
       b. Pick 3-7 distinct colors from {0,1,2,3,5,6,9}; fill rows with layered color bands (outer shell uniform color)
       c. Verify object is connected and fits within grid with >=1 empty row top/bottom
    4. Compute 180-rotation of source around (cr,cc); place on right half (guaranteed to fit and not overlap)
    5. Output = full grid; input = grid without the rotated copy
