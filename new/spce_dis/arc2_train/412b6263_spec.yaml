spec:
  grid: 5-9 rows x 5-10 cols; output must fit 30x30 so W<=13, H<=28
  colors:
    background: orange(7) [observed]; any non-blue color in principle
    body: grey(5) [observed]; single non-marker non-bg color
    marker: maroon(9) [observed]; unique color with exactly 2 pixels total
    frame: blue(1); never present in input
  objects:
    count: exactly 2, identical solid rectangles (2-4 rows x 2-4 cols)
    composition: all body-colored except one marker pixel per object
    marker_position: on the bounding-box edge; same relative position in both objects
    placement: obj0 anchored at grid corner (0,0); obj1 anchored at opposite corner (H-1,W-1)
    separation: 4-disconnected; row_gap>=1 OR col_gap>=1 where gap = dim - 2*obj_dim
  background_fill: all non-object pixels are background color
  transform:
    rotate entire input 90 degrees CCW to get tile (W x H)
    output = 2 vertical copies of tile inside a 1px blue frame with blue separator row
    output_size: (2*W + 3) x (H + 2)
    frame horizontal rows have bg-colored corner pixels (endpoints)

generation_strategy:
  approach: direct construction (input is the constrained structure)
  steps:
    1. Pick H in [5..13], W in [5..13] ensuring 2*W+3<=30 and H+2<=30
    2. Pick 3 distinct colors for bg, body, marker; none is blue(1)
    3. Pick object dims oh in [2..4], ow in [2..4]
    4. Verify placement feasibility: H-2*oh>=1 OR W-2*ow>=1 (4-disconnect)
    5. Place obj0 at (0,0)...(oh-1,ow-1) and obj1 at (H-oh,W-ow)...(H-1,W-1) filled with body
    6. Pick a random edge cell within the oh x ow bbox; set it to marker in both objects (same relative pos)
    7. Fill remaining grid with bg
