spec:
  grid: 9-16 rows x 9-16 cols, entirely teal (8) except for black (0) 5x5 regions
  regions:
    count: 1-4 black 5x5 rectangular regions
    structure: 1-pixel-wide black border enclosing a 3x3 interior
    interior: mix of teal and black pixels; teal count 1-6 per interior
    constraint_teal: at least 1 teal pixel in interior (solver asserts)
    constraint_black: at least 2 non-center black pixels [observed]
    center: can be either teal or black (legend center = teal so never filled)
    placement: non-overlapping, minimum 1-cell gap between bboxes; may touch grid edges
  legend: fixed 3x3 positional color map applied to each interior
    # 1(blue)  7(orange) 6(pink)
    # 4(yellow) 8(teal)  5(grey)
    # 2(red)   9(maroon) 3(green)
  transform: for each interior position (r,c) != center, if pixel is black, recolor to legend[r][c]

generation_strategy:
  approach: direct construction (task is simple transform-in-place)
  steps:
    1. Choose grid dimensions H x W in [9,16]
    2. Choose N regions (1-4) that fit non-overlapping with >=1 cell gap
    3. For each region, pick top-left (r,c) so 5x5 bbox fits in grid
    4. Fill entire grid with teal, then stamp each 5x5 bbox as all-black
    5. For each 3x3 interior, randomly set 1-6 positions to teal (ensure >=1 teal and >=2 non-center black remain)
    6. Output is derived by applying legend coloring to remaining black non-center interior pixels
