spec:
  grid: 3x3 arrangement of sub-cells separated by single-pixel black rows/cols
  separators: exactly 2 full black rows and 2 full black cols, forming a 3x3 grid of sub-cells
  center_subcell:
    size: always 3x3 (forced by separator placement)
    content: 8 grey pixels + 1 maroon pixel at center position (1,1)
  non_center_subcells:
    size: 1-9 rows x 1-9 cols (varies independently per band)
    content: orange (7) background with 0-3 scattered single-pixel distractors
  pink_control:
    count: exactly 1 pink (6) pixel, placed in any non-center sub-cell
    constraint: must NOT be in the same row-band AND col-band as center sub-cell simultaneously
  distractors:
    total_colored_pixels: 4-10 (including the 1 pink) across all 8 non-center sub-cells
    colors: 3-4 distinct non-pink colors chosen from {blue, red, green, yellow, cyan}
    sub-cells_with_pixels: 4-7 of 8 non-center sub-cells contain >=1 colored pixel
    each pixel is isolated (no adjacency requirement) [observed]
  transformation:
    - restore old maroon cell (center) to grey
    - pink's row-band relative to block (above/same/below) selects target row (0/1/2)
    - pink's col-band relative to block (left/same/right) selects target col (0/1/2)
    - paint selected cell maroon; recolor pink pixel to maroon
    - net change is exactly 3 cells; all distractors unchanged

generation_strategy:
  approach: direct construction (constraints are simple enough)
  steps:
    1. Pick 2 row-band sizes and 2 col-band sizes for non-center bands (each 1-7); center band is always 3
    2. Compute full grid dimensions = sum of band sizes + 2 separators per axis
    3. Fill grid with orange (7); draw black separator rows and cols
    4. Fill center sub-cell with 8 grey + 1 maroon at center (1,1)
    5. Choose a target maroon position != (1,1) in the 3x3 block to determine the pink's required relative band
    6. Place pink pixel in any non-center sub-cell whose row-band and col-band match the required relative position
    7. Scatter 3-9 distractor pixels (from 3-4 distinct colors in {blue,red,green,yellow,cyan}) across non-center sub-cells, each on an orange cell
