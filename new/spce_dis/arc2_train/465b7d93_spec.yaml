spec:
  grid: 10x10 [observed]
  background: single dominant color; 7 in all examples [observed]
  colors: exactly 2 foreground colors (frame + sprite)
  frame:
    color: 6 in all examples [observed]; any non-bg color allowed by solver
    shape: 1px-thick perfect rectangular border, h>=3 w>=3
    size: 3-8 per side; always square [observed]
    interior: all background; dims 1-6 per side
    position: anywhere on grid; may touch grid edges
  sprite:
    color: any non-bg, non-frame color
    bbox: 1x1 or 2x2 [observed]; solver handles any size
    pixels: 1-4; single 4-connected component
    position: entirely outside frame bounding box
    shapes_observed: |
      #   ##   #.   ##
          ##   ##   .#
  output:
    frame: preserved unchanged
    sprite: cleared from original position
    interior: sprite stretched to fill frame interior via corner-mapped
      line drawing + flood-fill of enclosed regions

generation_strategy:
  approach: output-first
  steps:
    1. Pick grid 10x10, bg color, frame color, sprite color (all distinct).
    2. Choose frame size S (3-8, square) and place it on grid with room for sprite outside.
    3. Choose sprite bbox (1x1 or 2x2) and pick a valid 4-connected pattern within it.
    4. Compute the stretched output by mapping sprite bbox corners to interior
       corners, drawing lines between 4-adjacent mapped pixels, flood-filling
       enclosed regions. Verify the stretched pattern is non-trivial.
    5. Place stretched pattern inside frame interior to form the output grid.
    6. To build input, remove stretched pattern from interior (restore to bg)
       and place original sprite at a random location outside the frame bbox
       with no overlap.
