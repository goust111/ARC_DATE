spec:
  grid: 16x16 [observed]
  colors:
    background: 7 [observed]
    bg_marker: 8 [observed] -- pixel value in marker column on background rows
    src_marker: 1 [observed] -- pixel value in marker column on source bar rows
    bar_colors: 2-3 distinct, from palette minus {bg, bg_marker, src_marker}
  marker_column: single column at any position (observed range 3-8)
  source_bars:
    count: 2-4 full-width horizontal bars
    each row is monochrome (bar_color) except marker column (src_marker)
    never on row 0 or last row; gap to each edge >= 1
    gap between consecutive bars: 1-8 rows
    same-color bars are consecutive in top-to-bottom order [observed]
  background_rows: monochrome bg except marker column has bg_marker
  transformation:
    each non-bar row takes nearest bar's color; marker column gets src_marker
    each bar row becomes all src_marker with marker column = bg_marker
    midpoint row between different-color bars (even gap) becomes all src_marker (separator)
    midpoint between same-color bars stays as that bar's color (no separator)

generation_strategy:
  approach: direct (input structure is simple enough)
  steps:
    1. Pick grid 16x16, bg=7, bg_marker=8, src_marker=1
    2. Pick marker_col uniformly from 0..15
    3. Pick num_bars in 2-4, pick 2-3 distinct bar colors from {0,2,3,4,5,6,9}
    4. Assign colors to bars so same-color bars are consecutive in sequence
    5. Place bars at rows such that no bar at row 0 or 15, gaps >= 1
    6. Fill grid -- bg rows get bg with bg_marker in marker column; bar rows get bar_color with src_marker in marker column
