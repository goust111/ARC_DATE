spec:
  grid: 8-20 rows x 8-20 cols (square or near-square) [observed]
  background: azure (8) [observed]; solver requires bg != yellow
  foreground: single non-yellow color; blue (1) in all examples [observed]
  objects: two-pixel bars (horizontal or vertical adjacent pairs), 4-connected isolated
  plus_motif:
    structure: 4 bars arranged as a plus around a center pixel with 1-cell bg gap
    arm_offsets_from_center: left (0,-3)(0,-2), right (0,2)(0,3), up (-2,0)(-3,0), down (2,0)(3,0)
    gap_cells: (0,-1)(0,1)(-1,0)(1,0) must be background
    center: background in input, recolored to yellow (4) in output
    count_per_grid: 1-4
    center_margin: >=3 from all edges
    no_shared_arms: each bar belongs to at most one plus
  distractor_bars:
    count: 1-23 (ratio 0.20-0.60 of total bars)
    may form partial pluses (2-3 arms) as long as not all 4 arms + gaps are satisfied
    may touch grid edges
  total_bars: 5-39

generation_strategy:
  approach: output-first
  steps:
    1. Pick grid size H x W in [8..20].
    2. Pick N plus centers (1-4). Place each center at (r,c) with r,c in [3..H-4, 3..W-4].
       Ensure no two centers share arm cells (min manhattan dist >= 5 in each axis independently, or verify no overlap).
    3. For each center, place 4 two-pixel bars at the 8 arm offsets. These cells must all be background before placement.
    4. Place D distractor bars (D >= 1, roughly 0.2-0.6 of total). Each is a random horizontal or vertical two-pixel bar on background cells.
       Constraint: no distractor may complete a 4th arm of any partial plus (verify no new 4-arm+gaps-ok centers are created).
       Bars must remain isolated (no 4-adjacent fg neighbor outside the bar itself).
    5. Input = grid with all bars on bg. Output = input with each plus center set to yellow.
