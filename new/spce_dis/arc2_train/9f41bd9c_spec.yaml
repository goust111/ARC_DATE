spec:
  grid: 16-18 rows x 16-18 cols
  regions:
    sky: uniform bg color (top rows above object), not MAROON
    floor: uniform floor color (bottom band), not bg or MAROON; thickness 4-6 rows
    object: single color, not bg/floor/MAROON; exactly 3 distinct colors total in input
  object:
    shape: |
      2 solid (fully filled) top rows, then 3-9 checkerboard rows (#.#.#)
      width 5 [observed]; pattern: cols 0,2,4 = obj, cols 1,3 = bg
    height: 5-11 total rows (2 solid + 3-9 patterned)
    placement: flush against one vertical edge (left or right) and resting directly on the first floor row
    empty_rows_above: 3-6 [observed]
    fit_constraint: obj_w + max(0, obj_h - 3) <= grid_width
  transformation:
    move: clear source object to bg; repaint on opposite side edge
    shear: first 3 relative rows keep edge-flush; each subsequent row shifts 1 cell inward
    trail: on the first floor row, paint MAROON from the source side edge to 1 cell before the outermost bottom support pixel
generation_strategy:
  approach: output-first
  steps:
    1. Pick grid dims (16-18 x 16-18), floor thickness (4-6), bg/floor/obj colors (3 distinct, none MAROON)
    2. Pick destination side (left or right), obj_w=5, obj_h (5-11), verify obj_w + max(0, obj_h-3) <= width
    3. Pick empty rows above object (>= 1), verify obj top_row + obj_h = grid_height - floor_thickness
    4. Build output grid: bg sky, floor band, place sheared object on destination side, paint MAROON trail on first floor row
    5. Derive input: remove sheared object, place original (un-sheared) object flush against the opposite side edge at the same rows, remove trail (restore floor)
