spec:
  grid: 3 square HxH panels side-by-side separated by 2 solid vertical bar columns; H = 5-6
  input_size: H rows x (3H+2) cols
  output_size: H x H
  background: 7 [observed]
  separator: single-column solid bars of color 6, at columns H and 2H+1 [observed]
  panels: each panel contains exactly 3 monochromatic 4-connected objects on bg
  object_ordering: within each panel, objects are strictly left-to-right (bbox col ranges non-overlapping)
  object_size: 1-8 cells per object
  colors: |
    all objects use non-bg, non-separator colors (0-5, 8-9 observed)
    colors MAY repeat across panels or even within a panel
    the 3 selected objects must have mutually distinct colors
  selection_rule: from panel k (0-indexed), take the k-th object in left-to-right order
  output: H x H bg canvas with the 3 selected objects stamped at their original panel-relative coords
  non_overlap: the 3 selected objects must occupy disjoint cells in the output

generation_strategy:
  approach: output-first
  steps:
    - pick H in 5-6; create H x H bg canvas
    - place 3 non-overlapping monochromatic objects with distinct colors; call them sel_0 (leftmost), sel_1 (middle), sel_2 (rightmost) by bbox column order
    - for panel 0, sel_0 is object index 0; add 2 more distractor objects to its right (all 3 strictly column-separated)
    - for panel 1, sel_1 is object index 1; add 1 distractor to its left and 1 to its right (all 3 strictly column-separated)
    - for panel 2, sel_2 is object index 2; add 2 more distractor objects to its left (all 3 strictly column-separated)
    - distractor colors are any non-bg, non-separator color (may repeat)
    - assemble input: panel_0 | sep_col | panel_1 | sep_col | panel_2
