spec:
  grid: 7x7 square [observed]; solver requires square >= 3
  structure: |
    (0,0)=corner, row 0 cols 1..N-1=top_band, col 0 rows 1..N-1=left_band
    rows 1..N-1 x cols 1..N-1 = payload (6x6)
  control_bands:
    marker: one color appearing exactly once in top_band AND once in left_band
    filler: one other color filling the rest of both bands
    corner: a third color at (0,0), distinct from marker, filler, and all payload colors
  payload:
    colors: 6 distinct colors partitioning all 36 cells (no background/zero)
    per_color_size: 4-9 cells [observed]
    connectivity: each color mostly forms 1 connected component (occasionally 2) [observed]
    disjoint_from_control: payload colors share no color with corner, marker, or filler
  all_nine_nonzero_colors_used: true [observed]; 3 control + 6 payload = colors 1-9
  shift:
    row_shift: 0-based index of marker in left_band; range 0..N-2
    col_shift: 0-based index of marker in top_band; range 0..N-2
  output: payload cyclically rolled down by row_shift and right by col_shift

generation_strategy:
  approach: direct (transformation is a simple cyclic roll; no tight output constraints)
  steps:
    - pick 3 distinct control colors (corner, marker, filler) and 6 distinct payload colors from 1-9, using all 9 [observed]
    - generate a 6x6 payload by flood-fill or random Voronoi tiling with the 6 payload colors; ensure full coverage, each color >= 4 cells
    - choose row_shift in [0,5] and col_shift in [0,5]; avoid (0,0) to ensure non-trivial output [observed in 3/4 examples]
    - build top_band (length 6): all filler, set position col_shift to marker
    - build left_band (length 6): all filler, set position row_shift to marker
    - assemble 7x7 grid with corner at (0,0), top_band in row 0, left_band in col 0, payload in lower-right
