spec:
  grid: 3-12 rows x 5-13 cols; height is odd (2k+1) or even (2k) where k = marker_count (1-6)
  colors: bg (any except pink/6) + top_fg_color + marker_color; top_fg and marker may be the same or different; 2-3 distinct colors total
  top_row:
    row 0 is a mix of bg and top_fg_color; top_fg occupies 30-65% of cells in random positions
  vertical_markers:
    col 0 of every odd row (1, 3, 5, ...) holds marker_color; rest of each marker row is bg
    even rows below row 0 are entirely bg
  output:
    3 rows x same width
    row 0: copy of input row 0
    row 1: copy of input row 1 (marker_color at col 0, bg elsewhere)
    row 2: pink (6) at every position where row 0 has top_fg_color, bg elsewhere

generation_strategy:
  approach: direct construction (input is simple enough)
  steps:
    1. Pick width W in 5-13, marker_count K in 1-6, height H = 2K or 2K+1
    2. Choose bg (not pink/6), top_fg_color != bg, marker_color != bg (may equal top_fg or pink)
    3. Build row 0 - place top_fg_color at ~30-65% of W positions randomly, rest bg
    4. Build rows 1..H-1 - odd rows get marker_color at col 0 + bg; even rows all bg
    5. Output is trivially derived: rows 0-1 copied, row 2 = pink mask of row 0 foreground
