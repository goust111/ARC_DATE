spec:
  grid: square NxN where N=3 [observed, solver allows any N>=1]
  background: color 8 (azure), fills majority of cells
  non_bg_cells: 1-4 cells out of N*N are non-background
  non_bg_colors: 1-3 distinct colors (not 8), may repeat across cells
  output_size: (4N)x(4N) — each dimension is 4x the input
  transform: |
    Output is 2x2 arrangement of quadrants, each quadrant is a 2x2 tile of a rotated input:
      upper-left:  rot180 tiled 2x2
      upper-right: rot90-CW tiled 2x2
      lower-left:  rot90-CCW tiled 2x2
      lower-right: original tiled 2x2

generation_strategy:
  approach: direct (transformation is deterministic; input is the only free variable)
  steps:
    - pick grid size N (use 3 to match eval, or 3-5 for variety)
    - fill NxN grid with background color 8
    - choose 1-4 cells to be non-background
    - assign 1-3 random non-bg colors from palette {1-7,9} to those cells
    - compute output by applying the four-quadrant rotational tiling rule
