spec:
  background: always color 7
  input:
    grid: 5-9 cols x 6-9 rows (interior >= 3x3 required)
    frame: rounded rectangle - corners are bg, all other border cells are frame_color
    frame_color: any single color != 7 (observed 3,4,6,8,9)
    interior: (h-2)x(w-2) region, mostly bg with a sparse motif
    motif:
      bbox: 1x1 to 3x3 (must fit within 3x3)
      non_bg_pixels: 1-7 cells within the bbox
      colors: 1-2 distinct non-bg colors; may include frame_color
      placement: anywhere inside interior such that bbox fits
  output:
    grid: always 15x15, filled with bg
    icon: 5x5 rounded frame (corners=bg, border=frame_color, 3x3 interior)
    icon_interior: motif bbox centered in the 3x3 space (floor-centered)
    placement: two identical icons at (2,2) and (8,8) on the canvas

generation_strategy:
  approach: output-first
  steps:
    1. Pick bg=7, frame_color from {1-6,8,9} randomly
    2. Generate motif bbox (1x1 to 3x3) with 1-7 non-bg pixels using 1-2 colors from palette minus bg (may include frame_color)
    3. Build the 5x5 icon (rounded frame + centered motif) and verify output correctness
    4. Build input by choosing interior dimensions (h-2 >= 3, w-2 >= 3, both >= motif bbox dims) and placing motif randomly inside, then wrapping with the rounded frame border
