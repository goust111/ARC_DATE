spec:
  task_type: move_in_order
  background: 7 [observed]
  color_groups:
    count: 2-3 distinct non-background colors
    pixel_count: each color has a perfect-square number of pixels (1,4,9,16,...)
    side_lengths: all sqrt(pixel_count) values are distinct; observed range 1-4
    arrangement: pixels of each color scattered arbitrarily in input; may be disconnected (1-3 components), any shape
  input_grid:
    rows: 5-7, cols: 4-10
    bg_fraction: 0.42-0.58 of total pixels
    must be large enough to hold all non-bg pixels
  output_grid:
    height: max(side_lengths)
    width: sum(side_lengths) + (n_colors - 1) gap columns
    layout: solid filled squares, bottom-aligned, left-to-right by increasing side length, 1 bg-column gap between neighbors

generation_strategy:
  approach: output-first
  steps:
    1. Pick n_colors in [2,3]. Choose n_colors distinct non-bg colors and bg=7.
    2. Pick n_colors distinct side lengths from [1,2,3,4] (or up to 5 for variety).
    3. Build the output grid (deterministic from sides + colors).
    4. Choose input grid dimensions large enough to fit all non-bg pixels with ~45-55% background.
    5. Scatter each color's pixels into the input grid in arbitrary (non-square) arrangements; allow disconnected components and overlapping bounding boxes with other colors.
    6. Fill remaining cells with background.
