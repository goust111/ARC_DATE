spec:
  task_type: symmetry/pattern
  input:
    grid: even rows x even cols, exactly one dimension is 4, other (n) is even in 4-12
    orientation: vertical (4 cols, n rows), horizontal (n cols, 4 rows), or square (4x4)
    structure: partitioned into 2x2 blocks; total block count equals n
    colors: 8-10 unique colors across the grid; blocks may share colors across blocks and within blocks
  output:
    grid: 2n x 2n square
    structure: four n x n quadrants (UL, UR, LL, LR), each filled with n concentric corner-fill layers
    layer_source: |
      2x2 blocks read in reverse row-major order (bottom-right first, left, then up).
      Block k's top-left -> UL layer k, top-right -> UR layer k,
      bottom-left -> LL layer k, bottom-right -> LR layer k.
      Layer 0 = outermost, layer n-1 = innermost single cell.
    quadrant_fill: each quadrant pixel at (r,c) gets color from layer min(r, c) for UL,
      min(r, n-1-c) for UR, min(n-1-r, c) for LL, min(n-1-r, n-1-c) for LR

generation_strategy:
  approach: direct (input is the unconstrained structure; output is deterministic)
  steps:
    - pick n from even values in [4, 12]
    - pick orientation randomly: vertical (n x 4), horizontal (4 x n), or square (only if n=4)
    - fill each cell of the input grid with a random color 0-9
    - ensure at least 8 distinct colors appear across the grid (resample if needed)
    - output is computed deterministically by the solver
