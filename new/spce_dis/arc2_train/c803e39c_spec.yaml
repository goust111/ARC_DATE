spec:
  grid:
    n: 3-5 (mask side length)
    input: (n+2) rows x (4*(n+2)+3) cols (may clip rightmost bg border, observed in test)
    output: n^2 x n^2
  layout: four panels separated by 3 full-height separator columns (color 5)
    background: 0 (black), each panel has 1-cell bg border around content
  panels:
    panel_0 (inner tile mask): n x n binary mask, color 1, fill 50-80%, not all-filled
    panel_1 (outer layout mask): n x n binary mask, color 2, fill 50-70%, not all-filled
    panel_2 (foreground swatch): n x n solid block, any non-bg/non-sep color
    panel_3 (background swatch): n x n solid block, any non-bg/non-sep color, differs from panel_2
  colors: all 6 colors (bg=0, sep=5, panel0=1, panel1=2, panel2, panel3) are distinct [observed]
  masks:
    connectivity: 1-2 components allowed for both masks
    symmetry: no consistent symmetry required
    fill: neither trivially sparse (<30%) nor fully filled
  transform: output = Kronecker(panel_1, panel_0) painted with panel_2 on foreground, panel_3 on background

generation_strategy:
  approach: direct (input structure is simple, output is deterministic)
  steps:
    1. Pick n in [3,5]
    2. Generate panel_0 mask (n x n) with fill ratio in [0.4, 0.8], ensure not all-filled
    3. Generate panel_1 mask (n x n) with fill ratio in [0.4, 0.8], ensure not all-filled
    4. Choose 4 distinct non-zero non-5 colors for panels 0-3 (panel0=1, panel1=2 observed but not required)
    5. Build input grid with bg=0 border around each n x n content, separated by color-5 columns
    6. Output = np.kron(panel_1, panel_0) colored with panel_2/panel_3 colors
