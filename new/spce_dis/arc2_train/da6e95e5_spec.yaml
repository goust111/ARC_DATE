spec:
  grid: 30x30, single background color
  clusters: 4-6 total, each with 4 same-color L-bracket corner markers + 1 center object
  markers:
    bbox: all 2x2 (area=3) or all 3x3 (area=5) within an example
    shape: L-bracket; NW has filled top-row + left-col; NE=flipLR(NW), SW=flipUD(NW), SE=flip_both(NW)
    alignment: NW/NE share rows, SW/SE share rows, NW/SW share cols, NE/SE share cols
    area: 3 for 2x2, 5 for 3x3
  center_objects:
    bbox: all same size within example; 2x2 to 4x5 observed
    monochromatic, 8-connected, not 8-adjacent to any same-color marker pixel
    area: 3-14 (partial fill of bbox)
  spatial_layout:
    outer_dim = 2*marker_dim + center_dim - 2 (per axis)
    for 2x2 markers center exactly fills gap between inner marker edges
    for 3x3 markers center bbox overlaps marker rows/cols by 1 on each side
    clusters non-overlapping in their outer bboxes [observed]
  rule: exactly 1 cluster has center_color == marker_color; output = crop of that center
  colors: 5-7 non-bg colors total; each cluster uses a distinct marker color

generation_strategy:
  approach: output-first
  steps:
    1. Choose marker_size (2x2 or 3x3) and center_bbox (H x W, 2-4 x 2-5)
    2. Choose N=4-6 clusters, each with distinct marker_color; pick one as target (center_color == marker_color)
    3. For the target cluster, generate a random monochromatic sprite in center_bbox, ensuring it is not 8-adjacent to marker pixel positions (derive from L-bracket + spatial formula)
    4. For distractor clusters, generate center sprites of same bbox but different color from their markers
    5. Compute each cluster outer_bbox using formula; place all clusters non-overlapping on 30x30 grid
    6. Render markers (4 L-brackets per cluster) and center objects onto background
