spec:
  grid: 5 rows x 1 col (fixed)
  pixels: 5 distinct colors chosen from 0-9, one per cell
  structure: |
    [A]  <- upper segment
    [B]
    [C]  <- center separator (fixed in output)
    [D]  <- lower segment
    [E]
  transform: swap A<->B and D<->E; center C stays in place

generation_strategy:
  approach: direct (task is trivially invertible)
  steps:
    1. pick 5 distinct colors from 0-9
    2. assign them to positions [0..4] in a 5x1 grid
    3. output is [in[1], in[0], in[2], in[4], in[3]]
