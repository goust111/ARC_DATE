spec:
  grid: 4x4, even dimensions required [observed: always 4x4, solver allows any even]
  background: single dominant color filling 50-75% of cells
  control_pixel:
    color: red (2), exactly one
    position: anywhere on grid (not on quadrant boundary since grid is 4x4)
  distractors:
    count: 3-7 non-bg, non-red pixels scattered across grid
    colors: any non-bg, non-red colors; repeats allowed
    spread: appear in multiple quadrants [observed]
  output:
    canvas cleared to background
    the quadrant (top/bottom x left/right) containing the red pixel is filled with red
    quadrant size is (H/2) x (W/2)

generation_strategy:
  approach: direct construction (task is simple enough)
  steps:
    1. pick grid size H x W with both even; use 4x4 [observed]
    2. pick background color (any color except red)
    3. fill grid with background
    4. pick a random quadrant and place exactly one red pixel at a random cell within it
    5. place 3-7 distractor pixels at random background cells
       - each distractor color != background and != red
       - spread across at least 2 quadrants [observed]
