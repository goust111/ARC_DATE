spec:
  grid: 9-21 rows x 15-24 cols, green (3) background
  seed_row:
    position: row 1-4 (0-indexed), single row containing all orange (7) pixels
    structure: 3-9 consecutive runs of orange separated by exactly 1 green gap each
    run_lengths: 1-7 each
    total_orange_pixels: 9-12
    span: may start/end at grid edge or have 0-3 cell margins on each side
  output_rule:
    below_seed: every 2 rows, place children at midpoints of active-bg-active triplets
    color_alternation: pink (6), orange (7), pink, orange, ...
    stop: when no triplets remain OR next row would exceed grid
  generation_levels: 1-8 (output is non-trivial)
  constraint: rows_below_seed >= 2 (at least 1 generation level fits)
  extra_rows_below_last_gen: 1-8 [observed]

generation_strategy:
  approach: output-first
  steps:
    - pick grid dims (rows 9-21, cols 15-24)
    - pick seed_row (1-4), ensuring rows_below >= 2 * desired_gen_levels
    - pick desired_gen_levels (1-8); ensure rows_below >= 2 * gen_levels
    - build seed row backwards from desired convergence depth — start with
      all-isolated pattern (guaranteed deep) or mix runs+gaps for shallower trees;
      simulate _children_between_gapped_pairs to verify gen_levels >= desired
    - all inter-run gaps must be exactly 1 bg cell
    - input = green grid with seed row placed; output = run solver to verify
