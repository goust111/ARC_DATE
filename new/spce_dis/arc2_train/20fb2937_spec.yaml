spec:
  grid: 20 rows x 11 cols input; output is rows below separator (13 x 11) [observed]
  background: 7 [observed]
  colors: 3 sprite colors + 3 marker colors + 1 separator color, all mutually distinct except separator may equal a sprite or marker color
  legend:
    layout: |
      rows 0-2: three 3x3 filled squares at col-ranges [0-2, 4-6, 8-10], separated by bg columns 3 and 7
      row 3: all bg
      row 4: three singleton marker pixels at cols 1, 5, 9 (center column of each sprite), each a unique color
      row 5: all bg
    sprite_size: 3x3 [observed]
    num_entries: 3 [observed]
    mapping: each marker color maps to the sprite color directly above it (by left-to-right pairing)
  separator: solid row of single non-bg color spanning full width at row 6; color is 6 [observed]
  lower_field:
    size: 13 rows x 11 cols [observed]
    markers: 8-9 singleton pixels using only the 3 marker colors from the legend
    placement: each marker's 3x3 expansion must fit within bounds (>=1 from each border) and no two expanded squares overlap (Chebyshev distance between any pair >= 3)
    coverage: all 3 marker colors appear at least once
  rule: discard legend+separator; replace each lower-field marker with a 3x3 filled square of the mapped sprite color, centered on the marker

generation_strategy:
  approach: output-first
  steps:
    1. Pick 3 distinct sprite colors and 3 distinct marker colors (disjoint from each other and from bg=7); pick separator color (6 or any non-bg color)
    2. Build 13x11 output by placing 8-9 non-overlapping 3x3 filled squares (using sprite colors) on a bg grid; ensure all 3 sprite colors appear and no square touches the border
    3. For each placed square, record its center position and randomly assign one of the 3 marker colors (ensuring all marker colors used at least once)
    4. Derive lower-field input: 13x11 bg grid with singleton marker pixels at each recorded center
    5. Build legend (rows 0-5): three 3x3 sprite squares in rows 0-2 at fixed column positions, bg row 3, marker singletons in row 4 at cols 1/5/9 matching the sprite-to-marker mapping, bg row 5
    6. Assemble: legend (6 rows) + separator row (7th) + lower-field input (13 rows) = 20x11 input grid
