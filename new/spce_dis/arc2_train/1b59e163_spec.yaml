spec:
  grid: 18x18, background color 4
  sources:
    count: 2-3 per grid
    structure: 8-connected component of monochrome sprite pixels + 1 marker pixel of a different color
    sprite_color: any non-bg color; multiple sources may share the same sprite color
    marker_color: unique per source; distinct from all sprite colors and bg; not color 5
    sprite_pixels: 3-8, 8-connected, LR-symmetric about the marker column [observed]
    component_bbox: 3-4 rows x 3-5 cols (including marker)
    marker_position: 8-adjacent to at least one sprite pixel; may be inside or outside sprite bbox
  destinations:
    count: 1-3 per source marker color (total across grid 3-6)
    structure: isolated single pixel matching a source's marker color
    placement: stamps at destinations must stay in-bounds and not overlap each other
  distractors:
    count: 2-3 isolated single pixels of color 5
    removed in output along with all source components
  output_rule: |
    Clear grid to bg. For each source, stamp its sprite at every destination marker
    of matching color, using the marker as anchor. Keep destination marker pixels;
    erase source components, source markers, and distractor pixels.

generation_strategy:
  approach: output-first
  steps:
    1. Pick 2-3 source definitions, each with a unique marker_color, a sprite_color (!=marker, !=bg, !=5), and a small LR-symmetric sprite shape (3-8 pixels, bbox 3-4 x 3-5) with marker 8-adjacent to the sprite.
    2. For each source, pick 1-3 destination marker positions; stamp sprite+marker at each destination on the output grid, ensuring in-bounds and no overlap.
    3. Build input from scratch on a bg grid. For each source, place the source component (sprite+marker) at a random valid position (not overlapping anything). Place each destination as a lone marker pixel at its output position.
    4. Place 2-3 distractor pixels (color 5) at random empty cells.
    5. Validate: solver(input) == output.
