spec:
  grid:
    rows: 5-11, must be odd
    cols: 10-28
  background: single color (always 8 in eval [observed])
  foreground:
    color: exactly 1 non-background color
    pixel_count: 6-15, must be <= grid width, and (width - count) must be even
    shape: irregular scattered blob spanning 3-8 rows and 3-8 cols, NOT a horizontal line
    connectivity: may be disconnected (1-8 connected components observed)
    bbox_fill_ratio: 0.29-0.67 (sparse, not a filled rectangle) [observed]
  output:
    all foreground erased; same count of pixels redrawn as a contiguous
    horizontal segment on the middle row, centered with equal left/right margins

generation_strategy:
  approach: output-first
  steps:
    1. pick odd H in [5,11], pick W in [10,28]
    2. pick fg_count in [6, W] such that (W - fg_count) % 2 == 0
    3. pick bg color and one distinct fg color
    4. build output grid = all bg, place fg_count pixels centered on row H//2
    5. build input grid = all bg; scatter fg_count pixels of fg color into an
       irregular multi-row blob (spanning >=3 rows, not a single-row line)
       anywhere in the grid; accept any connectivity
