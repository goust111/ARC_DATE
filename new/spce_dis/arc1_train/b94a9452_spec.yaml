spec:
  grid: 10-16 rows x 10-16 cols, background color 0 [observed]
  foreground_rect:
    shape: square, side 3-8
    placement: fully inside grid with >=1 cell bg margin on all sides
    content: exactly 2 non-bg colors, no bg holes
    structure: |
      majority color fills the square, minority color forms a smaller
      centered square block inside; (outer_side - inner_side) is even
      and >=2 so margins are symmetric; inner_side 1-3 [observed]
    colors: 2 distinct non-bg colors chosen from 1-9
  output:
    size: same as foreground_rect (cropped)
    rule: swap the two foreground colors (majority <-> minority)

generation_strategy:
  approach: output-first
  steps:
    1. Pick outer square side S in 3-8 and inner square side I in 1..(S-2) with (S-I) even
    2. Pick 2 distinct non-bg colors (from 1-9) as majority and minority
    3. Build S x S output grid filled with minority, place I x I majority block centered
    4. Swap colors to get the foreground crop (input's fg rect) -- majority fill, minority center
    5. Pick canvas size H x W each in range [S+2, S+10], ensuring >=1 margin on each side
    6. Place the fg rect at a random position on a bg=0 canvas respecting margins
    7. Input = canvas; Output = step-3 grid
