spec:
  grid: 16-27 rows x 17-23 cols
  rectangle:
    size: 6-10 rows x 6-9 cols
    position: fully interior (>=2 cell gap from every grid edge) [observed]
    composed of exactly 2 colors (base + marker), both non-black, distinct
    base_color: fills entire rect except marker pixels (dominant)
    marker_color: 1-3 sparse interior pixels (not on rect border, min 1 cell from edge)
    each marker on a unique row AND unique column (no shared row/col between markers)
  noise:
    all cells outside the rectangle are random from all 10 colors (0-9)
    roughly uniform distribution across colors
    noise must NOT accidentally form a larger 2-color >=3x3 rectangle with interior-only minority pixels
  output:
    crop to rectangle dimensions
    cross pattern: start with base everywhere, then paint full row + full column for each marker position with marker color
    cell is marker iff its row or column contains a marker; otherwise base

generation_strategy:
  approach: output-first
  steps:
    1. Pick rect dims H_r (6-10) x W_r (6-9) and 2 distinct non-black colors for base and marker
    2. Pick n_markers (1-3); choose n_markers interior positions with all-unique rows and all-unique columns (row in [1,H_r-2], col in [1,W_r-2])
    3. Build output grid as cross pattern from those positions
    4. Build the input rectangle: fill with base, place marker pixels at chosen positions
    5. Pick grid dims H >= H_r+4, W >= W_r+4; place rectangle at random interior position with >=2 gap from all edges
    6. Fill all cells outside rectangle with uniform-random colors from 0-9
    7. Validate no accidental 2-color rectangle outside the intended one is larger (reject if so)
