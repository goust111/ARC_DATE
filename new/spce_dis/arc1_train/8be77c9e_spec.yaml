spec:
  grid: 3x3 [observed]
  colors: exactly {0, 1} — 0 is background, 1 is foreground [observed]
  density: 22-56% foreground cells (2-5 out of 9)
  symmetry: input must NOT be UD-symmetric (otherwise output is trivially doubled)
  at_least_one_all_zero_row: true [observed]
  transform: output = vstack(input, input flipped UD) — produces a 2H x W grid with vertical mirror symmetry

generation_strategy:
  approach: direct random
  steps:
    1. Pick grid size H x W; eval always uses 3x3 but solver works for any size, so use 3-5 x 3-5
    2. Pick foreground color from 1-9; eval uses 1 [observed]
    3. Fill grid randomly with 0 and the foreground color, density 20-60%
    4. Reject if grid is UD-symmetric (input[::-1] == input)
    5. Reject if grid is all-zero (trivial)
