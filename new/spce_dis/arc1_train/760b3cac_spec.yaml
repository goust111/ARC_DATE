spec:
  grid: exactly 6 rows x 9 cols, background 0
  layout: 3x3 tiling of six panels (2 rows x 3 cols of 3x3 blocks)
  source_sprite:
    position: center panel top half (rows 0-2, cols 3-5) [observed]
    color: 8 [observed]
    pixels: 4-7 within 3x3 bbox
    symmetry: must NOT be LR-symmetric (reflection must differ from original)
    connectivity: may be disconnected (1-3 components observed)
  marker:
    position: center panel bottom half (rows 3-5, cols 3-5), directly below source [observed]
    color: 4 [observed]
    shape: |
      exactly one of two fixed 3x3 patterns (5 pixels each):
        left:  [[1,0,0],[1,1,1],[0,1,0]]   -> reflect to left panel
        right: [[0,0,1],[1,1,1],[0,1,0]]   -> reflect to right panel
  destination: left panel (cols 0-2) or right panel (cols 6-8) at same rows as source, must be empty bg
  transform: horizontally flip source sprite and paint into destination panel with source color; source and marker unchanged

generation_strategy:
  approach: direct construction (fixed layout, low complexity)
  steps:
    1. Create 6x9 grid of zeros.
    2. Generate a random 3x3 binary mask with 4-7 filled cells that is NOT LR-symmetric.
    3. Place it in source panel (rows 0-2, cols 3-5) with color 8.
    4. Pick direction LEFT or RIGHT uniformly at random.
    5. Place the corresponding fixed marker pattern in rows 3-5, cols 3-5 with color 4.
  validation: verify source mask != fliplr(source mask).
