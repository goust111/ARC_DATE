spec:
  grid:
    input: exactly 3x3
    output: exactly 9x9
  colors:
    distinct_count: 3-4 (including black/0)
    black_pixels: 4-5 out of 9 [observed]
    non_black_colors: 2-3 distinct, each used 1-3 times [observed]
  transform:
    rule: nearest-neighbor 3x upscale; each input pixel (r,c) becomes a solid 3x3 block at output rows 3r..3r+2, cols 3c..3c+2
    applies_to: all pixels including black background

generation_strategy:
  approach: direct random (input is tiny and unconstrained)
  steps:
    1. Create a 3x3 grid initialized to 0 (black).
    2. Pick 2-3 distinct non-black colors from 1-9.
    3. Fill 4-5 random cells with those colors (rest stay black).
    4. Ensure at least 2 distinct non-black colors appear.
    5. Output is np.repeat(np.repeat(grid, 3, axis=0), 3, axis=1).
