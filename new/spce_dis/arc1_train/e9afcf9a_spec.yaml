spec:
  grid: exactly 2 rows x 3-30 cols [observed: all examples use 6 cols]
  colors:
    top_row: single solid color filling entire row
    bottom_row: single solid color filling entire row, distinct from top
    any two distinct ARC colors (0-9)
  transform: create checkerboard from the two row colors
    even columns (0, 2, 4, ...): keep original top/bottom order
    odd columns (1, 3, 5, ...): swap top/bottom colors

generation_strategy:
  approach: direct construction (task is trivial)
  steps:
    1. pick width W uniformly from 3-20
    2. pick two distinct colors A, B from 0-9
    3. build input as 2xW grid where row 0 is all A, row 1 is all B
