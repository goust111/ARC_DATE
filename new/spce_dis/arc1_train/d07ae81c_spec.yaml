spec:
  grid: 12-19 rows x 12-19 cols
  colors: exactly 4 distinct colors — 2 base (high freq) + 2 marker (low freq)
  base_layout:
    description: |
      Grid partitioned into rectangular blocks by alternating vertical column bands
      and optional horizontal row bands of the majority base color.
    column_bands: 3-4 bands alternating MIN/MAJ starting with MIN; widths 2-10
    row_bands: 1-5 bands alternating MIXED/UNIFORM-MAJ starting and ending with MIXED; heights 2-15
    result: MIN blocks appear only at MIXED-row x MIN-col intersections; all else is MAJ
    majority_area: 56-59% of grid [observed]
  markers:
    total_count: 2-3 single pixels
    per_base: each base color hosts >=1 marker pixel (one has 1, other has 1-2)
    placement: each marker sits inside a single base-color block, Chebyshev distance >=1 to any other-base cell
    constraint: 8-neighbors must have a unique majority base color (not on block boundary)
    color_mapping: bijection between 2 base colors and 2 marker colors
  transform:
    rule: for each marker pixel, activate both full diagonals (NW-SE, NE-SW) to grid edges
    recolor: each activated base-color cell becomes its paired marker color; original markers unchanged

generation_strategy:
  approach: build base layout first, then place markers with constraint checks
  steps:
    1. Pick 4 distinct colors; assign 2 as base (MAJ/MIN), 2 as marker (one per base).
    2. Choose H, W in [12, 19]. Generate 3-4 column band widths (>=2, alternating MIN/MAJ from MIN).
       Generate 1-5 row band heights (>=2, alternating MIXED/UNIFORM-MAJ from MIXED, ending MIXED).
       Ensure widths sum to W, heights sum to H.
    3. Fill the grid: MIXED rows follow column band colors; UNIFORM rows are all MAJ.
    4. For each base color, pick 1-2 positions (total 2-3) strictly inside that color's blocks
       (Chebyshev >=2 from block edge preferred, >=1 required). Place the paired marker color there.
    5. Verify solver assertions pass (4 colors, frequency split, unique neighbor majority).
