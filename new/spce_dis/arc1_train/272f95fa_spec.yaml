spec:
  grid: 12-19 rows x 14-19 cols
  colors:
    input: exactly 2 colors -- background (BLACK) and separator (GREY) [observed]
    output: adds RED, YELLOW, PINK, GREEN, BLUE in the plus-shaped regions
  separator_lattice:
    structure: exactly 2 full-width GREY rows + 2 full-height GREY columns
    partition: divides grid into 3x3 = 9 rectangular regions
    band_sizes: each band (row or col) is 2-10 cells wide; need not be equal
  regions:
    corners (0,0)(0,2)(2,0)(2,2): remain background in output
    plus_shape: filled with fixed colors in output
      top_middle (0,1): RED
      mid_left (1,0): YELLOW
      center (1,1): PINK
      mid_right (1,2): GREEN
      bot_middle (2,1): BLUE
  constraint: all 9 regions are pure background in the input

generation_strategy:
  approach: direct construction (task is simple enough)
  steps:
    1. Pick grid height H in [12,19], width W in [14,19].
    2. Choose 2 distinct separator row positions so all 3 row bands have size >= 2.
    3. Choose 2 distinct separator col positions so all 3 col bands have size >= 2.
    4. Fill entire grid with BLACK (bg=0).
    5. Draw 2 full-width GREY rows and 2 full-height GREY columns.
    6. Return the input grid (output is deterministic from solver).
