spec:
  grid: 5-7 rows x 6-7 cols
  background: single non-black color filling most of the grid (always color 1 / blue in eval) [observed]
  foreground:
    colors: exactly 2 distinct non-background, non-black colors
    pixel_count: 3-6 total foreground pixels
    bbox: 2-3 rows x 2-3 cols, fully interior (margins >= 1 on all sides)
    fill_ratio: 0.67-1.0 of bbox area occupied by foreground pixels
    connectivity: 1-2 connected components (4-conn); single component under 8-conn [observed]
  input_contains_black: never
  transform: crop to foreground bbox; replace background pixels inside crop with black

generation_strategy:
  approach: output-first
  steps:
    1. Pick grid size H in [5,7], W in [6,7].
    2. Pick bg color from non-black colors (e.g. 1-9).
    3. Build output (the cropped bbox) first, size bh in [2,3] x bw in [2,3].
    4. Pick 2 distinct foreground colors (non-black, non-bg).
    5. Fill bh x bw output with a mix of the 2 foreground colors and black (for bg holes); ensure 67-100% cells are foreground and at least 1 pixel of each foreground color exists.
    6. Build input as H x W grid filled with bg color.
    7. Place output into input at random position ensuring margins >= 1 on all sides, replacing black pixels with bg color.
