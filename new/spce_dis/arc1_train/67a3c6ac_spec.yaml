spec:
  grid: square, 3-7 rows/cols [observed]
  colors: exactly {1, 2, 6, 7} (blue, red, magenta, orange) [observed]
  content: random fill using all 4 colors; grid is NOT left-right symmetric
  transform: output = horizontal reflection (reverse each row)
  output_size: same as input

generation_strategy:
  steps:
    1. Pick side length N uniformly from 3-7
    2. Fill an NxN grid with random colors from {1, 2, 6, 7}, ensuring all 4 colors appear
    3. Reject if the grid is already LR-symmetric (re-roll)
    4. Return the grid as input; np.fliplr(grid) as output
