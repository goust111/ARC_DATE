spec:
  grid: exactly 3x3, same for input and output
  colors:
    count: 2-3 distinct non-black colors per grid
    palette: any from 1-9 (black/0 never used) [observed]
  transform: rotate entire grid 180 degrees (equivalent to reverse all rows then reverse each row)
  constraint: input must NOT be 180-degree rotationally symmetric (so output differs from input)

generation_strategy:
  step1: create a 3x3 grid filled with 2-3 randomly chosen non-black colors (1-9)
  step2: reject if the grid is 180-degree rotationally symmetric (output would equal input)
  step3: output = np.rot90(input, 2)
