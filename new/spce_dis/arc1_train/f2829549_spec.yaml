spec:
  grid: 4 rows x 7 cols [observed]; width must be odd >= 3
  structure: left_panel | separator_col | right_panel, each panel is (H x W//2)
  separator:
    solid vertical column at col W//2
    color: non-bg, distinct from both panel fg colors; blue(1) [observed]
  panels:
    background: black(0) [observed]
    left_fg: exactly 1 non-bg color; orange(7) [observed]
    right_fg: exactly 1 non-bg color, different from left_fg; grey(5) [observed]
    left_fg_density: 3-6 cells out of 12 (25-50%) [observed]
    right_fg_density: 4-8 cells out of 12 (33-67%) [observed]
    fg placement: random; 1-3 connected components per panel [observed]
  output:
    size: same as one panel (H x W//2)
    rule: green(3) where BOTH panels have bg; bg(0) otherwise
    green_cells: 2-5 out of 12 (>= 1 required for non-trivial output)

generation_strategy:
  approach: output-first
  steps:
    1. Pick H=4, panel_W=3 [observed]; set grid width = 2*panel_W + 1
    2. Generate output panel: place 2-5 green cells randomly on H x panel_W grid, rest bg
    3. For each cell in the panel, green means BOTH panels must be bg at that position
    4. For non-green (bg) cells, at least one panel must have fg; randomly assign fg to left, right, or both
    5. For green cells, both panels get bg at that position
    6. Fill left panel fg cells with orange(7), right with grey(5)
    7. Assemble input: left_panel | blue(1) separator col | right_panel
    8. Validate: each panel has 1 fg color, fg density in range, >= 1 green in output
