spec:
  grid: 10 rows x 4 cols [observed]; even height H, width W required by solver
  background: 0
  upper_half:
    rows: 0 to H/2-1, entirely background
  lower_half:
    rows: H/2 to H-1, staircase bar-chart pattern
    columns: W bars, each contiguous from a start_row down to the bottom row
    column_heights: all distinct, in range 1 to H/2; exactly one column has max height H/2
    bottom_row: fully foreground (all W cells non-zero)
    fg_per_row: non-decreasing from top to bottom [observed]
    fg_colors: 3-4 distinct colors from 1-9; most columns single-color, 0-2 columns may have 2 colors [observed]
  transform: copy lower half into upper half with reversed row order; lower half unchanged
  output: vertically (UD) symmetric

generation_strategy:
  approach: output-first
  steps:
    1. Set H=10, W=4 (or pick even H in 6-14, W in 3-5 for variety).
    2. Build the output (UD-symmetric grid). Choose H/2 distinct column heights as a
       size-W subset of {1..H/2} that includes H/2. Assign each column a random position.
    3. Pick 3-4 distinct foreground colors from 1-9. Assign a primary color to each column.
       Optionally let 0-2 shorter columns share a second color at the bottom 1-2 rows.
    4. Fill columns bottom-up to their heights with assigned colors to form the lower half.
    5. Mirror lower half vertically to get the upper half (the full output).
    6. Derive input by blanking the upper half (set to 0). Lower half is kept as-is.
