spec:
  grid: 9 rows x 13 cols [observed]; generalizable to (S*R) x (S*C + S + 1) where S=sprite side, R=slot rows, C=slot cols
  background: 0
  divider:
    single full-height column at col S (=3 [observed]), color 5 [observed]
    separates left panel (cols 0..S-1) from right panel (cols S+1..end)
  sprite:
    SxS (3x3 [observed], solver requires odd), placed at top-left of left panel (rows 0..S-1)
    all S*S cells are non-background; uses 3-5 distinct colors, none of which are bg(0), divider(5), or marker(1)
    remaining left-panel rows are all background
  right_panel:
    partitioned into RxC grid of SxS slots (3x3 grid of 3x3 slots [observed])
    each slot is either marked (single marker pixel at center, rest bg) or unmarked (all bg)
    marker_color: 1 (blue) [observed], must differ from bg, divider, and sprite colors
    marked_slots: 3-6 out of 9 total
  output:
    each marked slot is replaced by a copy of the sprite; unmarked slots, divider, left panel unchanged

generation_strategy:
  approach: direct (task structure is simple, no inversion needed)
  steps:
    1. Pick S=3 (odd), R=3, C=3 slot-grid dimensions
    2. Allocate grid of (S*R) x (S*C + S + 1) = 9x13
    3. Choose divider_color (5) and marker_color (1), both non-zero and distinct
    4. Generate sprite -- fill all S*S cells with random colors from palette excluding {0, divider_color, marker_color}; use 3-5 distinct colors
    5. Place sprite at rows 0..S-1, cols 0..S-1; fill rest of left panel with bg
    6. Fill divider column (col S) with divider_color
    7. Randomly select 3-6 of the R*C=9 right-panel slots to mark; place marker_color at each center cell, rest bg
    8. Verify marker_color not in sprite colors (guaranteed by step 4)
