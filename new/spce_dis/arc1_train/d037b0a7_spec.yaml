spec:
  grid: 3x3 [observed]
  background: 0 (black), always dominant color
  sources:
    count: 2-3, each a single non-background pixel
    colors: all distinct, all non-zero
    placement: exactly one source per column, columns below each source are all background
    rows: at least one source must NOT be on the bottom row (ensures non-trivial output)
  transform:
    rule: for each source at (r, c), fill column c from row r to the bottom with source color
    output_size: same as input
    cells_changed: 3-4 [observed]

generation_strategy:
  approach: direct (task is simple enough for forward construction)
  steps:
    1. create a 3x3 grid filled with 0
    2. pick N=2-3 distinct non-zero colors
    3. pick N distinct columns from {0,1,2}
    4. for each (color, column) pair, pick a row such that at most one source is on the bottom row and no two sources share the same (row, col) — ensure at least one source has row < 2
    5. place each source pixel; verify that columns below each source are background (guaranteed by having one source per column)
