spec:
  grid:
    shape: square, 5x5 or 7x7 [observed]
    size_range: 5-7 rows/cols
  colors:
    palette: exactly {1, 2, 3, 4, 7, 8} — six colors, no 0/5/6/9 [observed]
    each color appears at least once [observed]
    cells filled randomly from palette with no large monochrome regions
  content:
    grid must NOT be vertically symmetric (input != flipud(input))
  transform:
    output = flipud(input) — reverse the row order, preserving each row

generation_strategy:
  approach: direct random generation (transform is trivial inversion)
  steps:
    1. pick N from {5, 7}
    2. fill an NxN grid with random draws from {1, 2, 3, 4, 7, 8}
    3. ensure all 6 colors appear (resample any missing color into a random cell)
    4. reject if grid == flipud(grid) (astronomically unlikely for random fill)
