spec:
  grid: always 13x13, bg=0
  colors: 4 total -- bg(0), marker(always 4), left_color, right_color (distinct non-0 non-4)
  frame:
    four corner pixels of marker color at (r0,c0),(r0,c1),(r1,c0),(r1,c1)
    left side bar: column c0 rows r0+1..r1-1 filled with left_color
    right side bar: column c1 rows r0+1..r1-1 filled with right_color
    top/bottom bars and interior: all bg
    interior size: 2-5 rows x 4-6 cols, width always even
  motif:
    shape: exactly matches frame interior (H x W)
    split into left half (W/2 cols) and right half (W/2 cols)
    left half uses one motif color only, right half uses the other only
    each color region is 4-connected; whole motif is 4-connected
    density (non-bg / total): 0.45-0.75
    placed elsewhere on grid with no row overlap with frame; gap 0-4 rows
  flip: ~half the examples have motif edge colors matching frame sides; the other half are swapped (need horizontal flip)
  output: crop of the frame bbox with motif inserted into interior, flipped if needed so left edge color = left_color

generation_strategy:
  approach: output-first
  steps:
    1. Pick interior H in [2,5], W in {4,6} (always even)
    2. Pick 3 distinct non-zero colors -- marker=4, left_color, right_color
    3. Build motif (H x W) -- left W/2 cols use colorA, right W/2 cols use colorB, each region 4-connected, whole motif connected, density 0.45-0.75
    4. Build output: frame corners=4, left bar=left_color, right bar=right_color, interior=oriented motif (colorA mapped to left_color side)
    5. Build 13x13 input -- place frame at random valid position
    6. Coin-flip whether to flip the motif horizontally before placing it (swaps colorA/colorB sides)
    7. Place the (possibly flipped) motif at a non-overlapping location on the grid with 0-4 row gap from frame
