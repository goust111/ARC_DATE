spec:
  grid: exactly 3 rows x 4 cols
  colors: exactly 2 — one background, one foreground (any ARC colors 0-9)
  foreground_density: 33-50% of cells are foreground
  no_symmetry: input tile must NOT be LR-symmetric (all examples are asymmetric) [observed]
  transform: |
    Tile the input into a 6x8 output by 2x2 reflection:
      upper-left = original, upper-right = horizontal flip,
      lower-left = vertical flip, lower-right = 180-degree rotation.

generation_strategy:
  approach: direct random (input is the simpler structure)
  steps:
    1. Pick two distinct ARC colors for bg and fg.
    2. Create a 3x4 grid filled with bg.
    3. Randomly set 4-6 cells (33-50%) to fg.
    4. Reject if the tile is LR-symmetric (optional aesthetic filter).
    5. Build output by concatenating [tile, fliplr(tile)] on top and [flipud(tile), rot180(tile)] on bottom.
