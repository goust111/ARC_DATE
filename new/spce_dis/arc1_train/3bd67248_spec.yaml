spec:
  grid: square NxN, N in 3-15
  background: black (0)
  bar:
    position: column 0, full height
    color: single non-bg color, not red (2) or yellow (4); observed {gray, magenta, azure, green}
  rest: all cells in columns 1..N-1 are background
  transform:
    - preserve the left-edge bar
    - draw red (2) diagonal from (0, N-1) stepping down-left one cell per row, ending at (N-2, 1)
    - fill bottom row from column 1 to N-1 with yellow (4)
    - result is a right-triangle outline: bar=left side, diagonal=hypotenuse, bottom=base

generation_strategy:
  approach: direct (input is trivial to construct)
  steps:
    1. pick N uniformly from 3..15
    2. pick bar_color from {1,3,5,6,7,8,9} (any color except 0=bg, 2=red, 4=yellow)
    3. create NxN grid filled with 0
    4. set column 0 to bar_color
