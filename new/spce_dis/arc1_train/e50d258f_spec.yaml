spec:
  grid: always 10x10
  background: BLACK(0), separates all panels
  panels:
    count: 2-3
    colors: exactly TEAL(8), RED(2), BLUE(1) in every panel
    shape: solid filled rectangles (no bg inside), dims 3-7 rows x 3-6 cols
    separation: each panel surrounded by bg (or grid edge) on all 4 sides, gap >= 1
    teal_majority: teal is plurality color in most panels [observed]
    red_per_panel: every panel has >= 1 RED pixel
    red_uniqueness: exactly one panel has strictly the most RED pixels
    red_margin: winner exceeds runner-up by exactly 1 [observed]
    coverage: panels cover 46-64% of grid cells [observed]
  transform: crop and return the panel with the highest RED pixel count unchanged

generation_strategy:
  approach: direct construction (panels are simple; no inversion needed)
  steps:
    1. Choose panel_count in {2, 3} and generate that many distinct (h, w) pairs with h in [3,7], w in [3,6]
    2. For each panel, fill with TEAL, then scatter RED and BLUE pixels randomly; ensure each panel has >= 1 RED
    3. Assign red counts so exactly one panel has a unique maximum (e.g. pick winner, give it max_red, give others strictly fewer with distinct or tied-below counts)
    4. Place panels on a 10x10 BLACK grid with >= 1 cell gap between any two panels and between panels and each other; use rejection or greedy placement to ensure no overlap/adjacency
    5. Verify the solver (_solid_panel_boxes) recovers all panels and picks the correct winner
