spec:
  grid: 3-5 rows x 3-5 cols, square [observed]
  colors:
    exactly two non-black colors present: grey (5) and one paint color
    paint_color: any Color except black (0) and grey (5)
    no black pixels in input
  pixel_distribution:
    grey_ratio: 0.28-0.56 of total pixels
    remaining pixels are paint_color
  pattern: grey and paint pixels are freely scattered; no symmetry or connectivity required
  transform:
    output same dimensions as input
    grey pixels become paint_color
    paint pixels become black
    i.e. output = where(input==grey, paint_color, black)

generation_strategy:
  summary: direct construction (task is trivial; no inversion needed)
  steps:
    1. pick grid size H=W randomly from 3-5
    2. pick paint_color randomly from non-black non-grey colors
    3. for each cell, randomly assign grey or paint_color with grey probability ~0.3-0.55
    4. ensure at least 1 grey pixel and 1 paint pixel exist (resample if needed)
