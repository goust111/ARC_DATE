spec:
  grid: 3 rows x 10-17 cols, black background
  markers:
    count: exactly one grey (5) pixel per column (W total)
    row_per_column: each in row 0, 1, or 2; no two adjacent columns share the same row [observed]
    row_coverage: all three rows used at least once [observed]
  transformation:
    rule: starting from rightmost column, recolor grey marker to green (3) in every other column
    green_columns: cols w-1, w-3, w-5, ... (step -2 from rightmost)
    green_count: ceil(W/2); remaining markers stay grey

generation_strategy:
  approach: direct (task is simple enough)
  steps:
    1. pick W uniformly from 10-17
    2. create 3xW black grid
    3. for each column left-to-right, pick a row in {0,1,2} different from previous column's row; place grey pixel there
    4. ensure all three rows appear (resample if not)
