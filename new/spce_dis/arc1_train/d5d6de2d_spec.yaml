spec:
  grid: 10-25 rows x 10-25 cols, always square [observed]
  background: black
  foreground_color: red (only non-background color in input)
  components:
    type: 4-connected red regions, non-overlapping (bboxes separated by >=1 cell gap)
    frames:
      count: 1-3
      shape: 1-cell-thick hollow rectangular outlines (all border cells red, interior black)
      height: 3-6, width: 3-9
      may touch grid edges
    solids:
      count: 0-1 (distractors)
      shape: fully filled red rectangle, always 2x2 [observed]
  total_components: 1-4
  transform:
    - erase all red pixels to black
    - for each hollow frame, fill its strict interior (excluding border) with green
    - solid rectangles produce nothing in output

generation_strategy:
  approach: direct construction (task is simple enough)
  steps:
    1. pick grid size N x N, N in [10, 25]
    2. pick number of frames (1-3) and solids (0-1)
    3. for each frame, pick height in [3, 6] and width in [3, 9]
    4. for each solid, pick a 2x2 block
    5. place all components on grid with non-overlapping bboxes (>=1 cell gap between any two bboxes); allow touching grid edges
    6. draw frame borders (top/bottom rows, left/right cols of bbox) in red, interior stays black
    7. draw solids as filled red rectangles
    8. verify at least one frame exists
