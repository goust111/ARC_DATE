spec:
  grid: 7-9 rows x 7-9 cols, black background
  src:
    type: red horizontal segment, left-anchored (starts at column 0), contiguous
    length: 2-5
    row: 2-3 (at least 2 rows above for green wedge) [observed]
  constraints:
    - bar_len + bar_row <= W (green wedge top row must fit in grid width)
    - bar_len - 1 <= H - bar_row - 1 (blue wedge must have room below) [observed]
    - rest of grid is black (only foreground is the red segment)
  output:
    - red segment preserved in place
    - above red: green left-aligned wedge; row r has width bar_len + (bar_row - r), widest at top
    - below red: blue left-aligned wedge; row r has width bar_len - (r - bar_row), narrowing by 1 per row until width reaches 0
    - forms a right-leaning triangle/diamond shape with green top, red middle, blue bottom

generation_strategy:
  approach: direct (simple task, constraints easy to satisfy)
  steps:
    - pick H in [7, 10], W in [7, 10]
    - pick bar_len in [2, min(6, W-2)]
    - pick bar_row in [2, min(H-bar_len, W-bar_len)] ensuring bar_len+bar_row <= W and bar_row+bar_len <= H
    - place red segment at row bar_row, columns 0..bar_len-1 on black grid
