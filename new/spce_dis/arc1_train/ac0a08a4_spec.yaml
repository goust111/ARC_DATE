spec:
  grid: 3x3
  background: color 0 (black)
  foreground:
    count: 2-5 non-background pixels
    colors: each fg pixel has a distinct non-zero color (no repeats) [observed]
    placement: scattered among bg cells; no two fg pixels share a color
  transform:
    scale_factor: N = number of fg pixels
    rule: replace every input cell with an NxN block of the same color
    output_size: 3N x 3N (ranges 6x6 to 15x15)

generation_strategy:
  summary: direct construction -- task is simple enough that forward generation works perfectly
  steps:
    1. Choose N uniformly from 2-5 (the number of fg pixels)
    2. Create a 3x3 grid filled with 0
    3. Choose N distinct positions out of 9 cells (random sample)
    4. Assign N distinct non-zero colors (sample N from 1-9 without replacement)
    5. Place each color at its chosen position
    6. Output is computed by scaling the grid by factor N (each cell becomes NxN block)
