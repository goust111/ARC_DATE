spec:
  grid: 3x3 square
  colors: exactly 2 — black (0) + one non-black foreground color
  foreground_cells: 3-7 out of 9
  pattern_symmetry: must NOT be invariant under 90-degree rotation (otherwise output == input, trivially ambiguous)
  no_other_symmetry_constraint: LR/UD symmetry not required [observed — none in eval]
  transform: rotate entire grid 90 degrees counterclockwise (np.rot90(grid, 1))

generation_strategy:
  approach: direct random generation (task is simple enough)
  steps:
    1. Create a 3x3 grid of zeros
    2. Pick a random non-black color (1-9)
    3. Pick k = random(3, 7) cells out of 9 to be foreground
    4. Fill those cells with the chosen color
    5. Reject if grid == np.rot90(grid, 1) (rot90-invariant patterns are trivial)
    6. Output = np.rot90(input, 1)
