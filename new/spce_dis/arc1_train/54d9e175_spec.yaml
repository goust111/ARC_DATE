spec:
  grid: (4R-1) rows x (4C-1) cols, where R=1-2 row-cells, C=3 col-cells [observed]
  background: black (0)
  separators: single-pixel grey (5) full rows and/or full columns forming a regular grid
  cells: every non-separator region is exactly 3x3
  markers:
    count: one per cell, always at center position (1,1) within the 3x3 window
    colors: blue(1), red(2), green(3), yellow(4); repeats allowed across cells
    rest_of_cell: all black (background)
  color_map:
    blue(1)->pink(6), red(2)->orange(7), green(3)->teal(8), yellow(4)->maroon(9)
  output:
    separators: unchanged
    each 3x3 cell: filled solid with the paired color of its center marker

generation_strategy:
  approach: direct construction (task is simple enough)
  steps:
    1. Pick R in {1,2} and C=3; compute grid size (4R-1) x (4C-1)
    2. Fill entire grid with black; place grey separator rows at indices 3,7,... and cols at 3,7,...
    3. For each 3x3 cell, pick a random marker color from {1,2,3,4} and place it at the cell center
