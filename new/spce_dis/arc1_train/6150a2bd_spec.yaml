spec:
  grid: 3x3
  transform: rotate entire grid 180 degrees (np.rot90(grid, 2))
  non_zero_region: upper-left triangle where r+c <= 2
    # cells (0,0),(0,1),(1,0) always non-zero; cells (0,2),(1,1),(2,0) may be 0 or non-zero
    # cells (1,2),(2,1),(2,2) always 0
  colors:
    background: 0 (black) fills lower-right triangle (r+c > 2) and optionally anti-diagonal cells
    non_zero_count: 4-6 cells [observed]
    distinct_non_zero_colors: 3-5, each from 1-9
    duplicates_allowed: yes, 1-2 colors may repeat [observed]

generation_strategy:
  approach: direct random construction (task is trivially simple)
  steps:
    1. Create 3x3 grid of zeros.
    2. Fill cells (0,0),(0,1),(1,0) with random non-zero colors (1-9).
    3. For each anti-diagonal cell (0,2),(1,1),(2,0), independently choose non-zero color or 0, ensuring at least 1 of the 3 is non-zero [observed].
    4. Cells (1,2),(2,1),(2,2) remain 0.
    5. Output = np.rot90(input, 2).
