spec:
  grid: fixed 9x9
  structure: conceptually a 3x3 lattice of 3x3 blocks
  cell_values: integers 0-9; 0 is background
  color_coverage: at least 9 of the 10 values (0-9) present across the grid [observed]
  non_zero_density: 18-43 of 81 cells are non-zero (22-53%)
  per_block_nonzero: 1-7 cells per 3x3 block; no block is all-zero [observed]
  transform: output is the upper-right 3x3 block (rows 0-2, cols 6-8) extracted verbatim
  output: 3x3 grid, exact copy of that block

generation_strategy:
  approach: direct random construction
  steps:
    1. Create a 9x9 grid initialized to 0.
    2. Choose a target fill count in range 18-43.
    3. Randomly distribute non-zero values (1-9) across the grid to reach the
       target fill count, ensuring every 3x3 block has at least 1 non-zero cell.
    4. Optionally shuffle to ensure at least 9 distinct values appear in the grid.
    5. Output = grid[0:3, 6:9].
