spec:
  task_type: symmetry/pattern
  seed_tile:
    size: 3x3 [observed]
    colors: 3-4 distinct colors from palette 0-9
    symmetry: no LR or UD symmetry (ensures non-trivial output)
  output:
    size: 2*H x 2*W (6x6 for 3x3 input)
    structure: |
      [seed | fliplr(seed)]
      [flipud(above) row   ]
    quadrants: UL=seed, UR=fliplr(seed), BL=flipud(seed), BR=rot180(seed)
    symmetry: both LR and UD symmetric by construction

generation_strategy:
  approach: direct (input is simple, no inversion needed)
  steps:
    1. Pick grid size H x W, both in 2-5 (eval uses 3x3)
    2. Pick 3-4 random distinct colors from 0-9
    3. Fill an HxW grid randomly with those colors
    4. Reject if the grid is LR-symmetric or UD-symmetric (output would be trivially patterned)
    5. Return the HxW grid as input
