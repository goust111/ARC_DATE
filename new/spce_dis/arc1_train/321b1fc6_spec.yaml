spec:
  grid: 10x10, background 0
  sprite:
    description: polychromatic source sprite (2-4 distinct non-bg, non-placeholder colors)
    size: 2-3 rows x 2-4 cols, 4-7 pixels
    connectivity: single 4-connected component (union of all sprite colors)
    mask_density: 0.58-1.0
    colors_not_contain: placeholder color
  placeholder:
    color: 8 [observed]; solver discovers it dynamically -- any color works if unique candidate
    count: 3 identical copies of sprite mask, each monochromatic in placeholder color
  layout:
    all 4 objects (1 sprite + 3 placeholders) are mutually non-4-adjacent (no shared edges)
    objects may touch grid border
  solver_uniqueness: only the placeholder color may satisfy all of -- >=2 same-mask components,
    remaining fg forms 1 component, source sprite excludes that color
  output: erase sprite to bg; replace each placeholder with sprite colors at matching positions

generation_strategy:
  approach: output-first
  steps:
    1. Design a sprite mask (2-3 rows x 2-4 cols, 4-7 fg pixels, 4-connected, density 0.58-1.0)
    2. Assign 2-4 distinct colors (not 0 or 8) to sprite fg pixels
    3. Pick 4 non-overlapping, non-4-adjacent positions on a 10x10 grid for the sprite bbox;
       one position is the source, three are placeholder targets
    4. Build output -- place colored sprite at all 4 positions
    5. Build input -- at the 3 placeholder positions replace sprite colors with color 8;
       at the source position keep the colored sprite as-is
    6. Validate solver uniqueness -- no other color forms a valid candidate
