spec:
  grid:
    rows: 2-5 [observed], square [observed]
    cols: same as rows [observed]
  colors:
    distinct_count: 3-8 (includes 0/black when present)
    background: 0 (black); may be absent in small grids
    non-zero_colors: 3-7 distinct, each from palette 1-9
  content:
    no special structure required; arbitrary pixel colors
    background_fraction: 0.0-0.5 [observed]
  transform:
    each pixel (r,c) maps to a 2x2 block at output (2r:2r+2, 2c:2c+2) with the same color
    output_shape: (2*H, 2*W)

generation_strategy:
  approach: direct random input generation (transformation is trivially invertible)
  steps:
    1. pick H = W = random in 2..5 [observed]; allow non-square up to 6 for variety
    2. choose K = random in 3..8 distinct colors from 1..9
    3. fill HxW grid randomly from {0} union chosen colors
    4. ensure at least 3 distinct non-zero colors appear in final grid
    5. output = np.repeat(np.repeat(input, 2, axis=0), 2, axis=1)
