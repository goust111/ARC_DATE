spec:
  grid:
    panel_size_n: 3-5
    layout: two NxN square panels, side-by-side (Nx2N) or stacked (2NxN)
  panels:
    background: single color shared by both panels (always 0 [observed])
    source_panel:
      fg_colors: 2-4 distinct non-bg colors, all disjoint from template marker
      fg_pixel_count: 2 to n*n-1, covering 20-60% of panel
    template_panel:
      fg_color: exactly 1 marker color (always 8 [observed]), disjoint from source colors
      fg_pixel_count: 3 to n*n-2, covering 30-80% of panel
      connectivity: 1-2 connected components [observed]
    panel_order: source can be first or second panel (disambiguated by color count)
  output:
    size: n^2 x n^2
    rule: |
      For each non-bg source pixel at (r,c) with color C, stamp the template
      mask (recolored to C) into output block (r,c). All other blocks are bg.

generation_strategy:
  approach: direct construction (constraints are simple enough)
  steps:
    1. Pick n in [3,5], orientation (LR or TB), bg=0, marker color, 2-4 source fg colors all distinct from bg and marker.
    2. Create template panel (NxN) with marker pixels forming a pattern of 3 to n*n-2 cells on bg.
    3. Create source panel (NxN) with 2 to n*n-1 non-bg pixels, each colored from the chosen source palette. Ensure at least 2 distinct fg colors used.
    4. Randomly decide panel order (source first or second).
    5. Concatenate panels into Nx2N (LR) or 2NxN (TB) input grid.
    6. Verify solver disambiguates correctly (one panel has exactly 1 fg color, the other has >=2, colors disjoint).
