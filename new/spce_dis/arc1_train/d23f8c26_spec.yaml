spec:
  grid: 3-7 rows x 3-7 cols, square (rows == cols), both odd
  background: 0 (black), most frequent color
  foreground:
    distinct_colors: 5-6, each pixel a random non-bg color
    density: 35-56% of all cells are non-bg
    middle_column: 2-4 of H cells are non-bg (at least one bg cell remains)
    off_center: >=3 non-bg pixels scattered across non-middle columns
  transform: keep only the center column (col W//2); fill everything else with bg

generation_strategy:
  approach: direct (transformation is trivial erasure, so forward generation is easy)
  steps:
    1. Pick N uniformly from {3, 5, 7}; grid is NxN, bg=0
    2. Fill grid with bg
    3. For the middle column (col N//2), randomly set ~40-70% of cells to random non-bg colors (1-9), leaving at least one cell as bg
    4. For all other cells, scatter non-bg pixels at ~30-50% density using random colors (1-9)
    5. Ensure total distinct fg colors >= 4 (re-roll a few pixels if needed)
    6. Output is bg everywhere except middle column copied from input
