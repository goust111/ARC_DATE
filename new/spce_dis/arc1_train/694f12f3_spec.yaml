spec:
  grid: 10x10, black background
  foreground_color: yellow (4) [observed]
  objects:
    count: exactly 2 solid (filled) rectangles of the foreground color
    dimensions: each 3-6 rows x 3-6 cols (minimum 3 in both dims to have nonempty interior)
    areas: must be distinct between the two rectangles
    placement: non-overlapping, separated by >=1 row or column of black; may touch grid borders
  transform:
    - preserve background and each rectangle's 1-cell border
    - fill smaller rectangle's interior (bbox shrunk by 1 on each side) with blue (1)
    - fill larger rectangle's interior with red (2)

generation_strategy:
  approach: direct construction (task is simple enough)
  steps:
    1. set grid to 10x10 black
    2. generate two rectangles with height in [3,6] and width in [3,6] such that their areas differ
    3. place both on the grid with no overlap and >=1 cell gap between bounding boxes
    4. fill both rectangles with yellow
  validation:
    - both rectangles fit within the 10x10 grid
    - no overlap between the two rectangles (including adjacency -- >=1 cell gap)
    - areas are distinct
