spec:
  grid: 3x3 square
  colors: exactly 3 distinct non-black colors (values 1-9) [observed]
  cell_values: all non-zero (no black/background) [observed]
  symmetry: input must NOT be symmetric across the main diagonal (input != input.T)
  transform: transpose the grid — output[r,c] = input[c,r]

generation_strategy:
  steps:
    1. Pick 3 distinct colors from 1-9.
    2. Fill a 3x3 grid randomly using those 3 colors (each color used at least once).
    3. If the grid equals its own transpose, reshuffle (rejection is rare for 3x3).
    4. Return the grid as input.
