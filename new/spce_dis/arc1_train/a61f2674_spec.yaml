spec:
  grid: 9x9 [observed]
  background: BLACK
  bars:
    color: GREY (single foreground color)
    count: 4-5
    width: 1 cell each
    orientation: vertical, bottom-aligned to last row
    column_spacing: every 2 columns (gap of 1 empty column between bars)
    first_column: any even or odd start; all bars on same parity [observed]
    heights: all distinct within example, range 1 to grid_height
  transform:
    clear: remove all bars
    tallest: repaint at original position in BLUE (unique tallest height required)
    shortest: repaint at original position in RED (unique shortest height required)
    other_bars: removed entirely

generation_strategy:
  approach: direct (simple enough to generate forward)
  steps:
    1. Create 9x9 BLACK grid
    2. Pick bar_count in [4, 5]
    3. Pick start_col parity (0 or 1); place bars at columns start_col, start_col+2, ...
       ensuring all fit within grid width (max col <= 8)
    4. Generate bar_count distinct heights from [1..9] (sample without replacement)
    5. For each bar, fill column from (9 - height) to row 8 with GREY
    6. Verify unique tallest and shortest (guaranteed by distinct heights)
