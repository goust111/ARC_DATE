spec:
  grid: 3 rows x 4 cols [observed, could vary 2-6 rows x 2-6 cols]
  colors: exactly 2 non-black colors, no black (0) used [observed]
  content: arbitrary pattern of the 2 colors filling every cell
  symmetry: input is NOT vertically symmetric [observed in 4/5, not required]
  transform: |
    output = vstack(flipud(input), input)
    output height = 2 * input height, same width

generation_strategy:
  approach: direct random generation (task is trivially invertible)
  steps:
    1. Pick grid dimensions rows in [2,6], cols in [2,6]
    2. Pick 2 distinct non-zero colors (1-9)
    3. Fill every cell randomly with one of the 2 colors
    4. Return the grid as input
