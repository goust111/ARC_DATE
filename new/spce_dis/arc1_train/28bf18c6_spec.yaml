spec:
  grid: 8x8, background black (0) [observed]
  sprite:
    bbox: exactly 3x3
    color: single non-background color (1-9)
    foreground_pixels: 4-6 out of 9 cells
    connectivity: 8-connected single component [observed]
    position: top-left corner anywhere in rows 0-5, cols 0-5 (bbox fits in 8x8)
  output:
    shape: 3x6
    content: sprite crop concatenated with itself horizontally

generation_strategy:
  approach: direct (task is simple enough)
  steps:
    1. Pick a random non-zero color (1-9).
    2. Generate a 3x3 binary mask with 4-6 foreground cells that form a single 8-connected component.
    3. Place the sprite at a random position in an 8x8 black grid (top-left row in 0-5, col in 0-5).
    4. Build output by horizontally concatenating two copies of the 3x3 sprite crop.
