spec:
  grid: 13-17 rows x 13-17 cols, background black (0)
  colors: exactly 2 foreground colors -- frame_color and marker_color
  frames:
    count: 2-3 non-overlapping, non-nested rectangular 1px-thick hollow frames, all frame_color
    frame_color forms ONLY complete rectangular frames (no stray pixels)
    sizes: 3-8 per side; largest frame is unique by area (area gap >=12)
    largest: 6-8 rows x 7-8 cols [observed]
    smaller: 3-5 rows x 3-6 cols [observed]
  marker_pixels:
    scattered small components (mostly 1px, some 2-3px) of marker_color
    total count: 9-23; component count: 9-19
    some inside largest frame interior (2-4 pixels, 8-16% of interior)
    rest scattered across the grid outside all frames
    no marker pixel touches a frame border cell [observed]
  output:
    crop to largest frame bbox
    recolor every non-bg pixel (frame border + interior markers) to marker_color
    size equals largest frame dimensions

generation_strategy:
  approach: output-first
  steps:
    1. Pick grid H x W in [13,17]. Pick bg=0, frame_color, marker_color (distinct non-bg).
    2. Place 2-3 non-overlapping rectangular frames of frame_color. Make one uniquely largest (6-8 per side, area gap >=12 from second-largest). Smaller frames 3-5 per side.
    3. Inside the largest frame interior, place 2-4 marker_color pixels on random bg cells.
    4. Scatter 7-17 additional marker_color pixels (mostly singletons, a few 2px clusters) on bg cells outside all frame bboxes.
    5. Optionally place 0-2 marker pixels inside smaller frame interiors.
    6. Output = crop largest frame bbox, replace all non-bg with marker_color.
