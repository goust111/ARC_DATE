spec:
  grid: square, 2-5 rows x 2-5 cols
  colors: 2-3 distinct colors
  content: arbitrary pixel pattern, no special structure required
  asymmetry: input should NOT have 4-fold rotational symmetry so all four quadrants look distinct [observed]
  output:
    size: 2N x 2N where input is N x N
    layout: |
      top-left = original input
      top-right = 90-degree clockwise rotation
      bottom-left = 90-degree counterclockwise rotation
      bottom-right = 180-degree rotation

generation_strategy:
  approach: direct (task is trivially invertible)
  steps:
    1. pick N uniformly from 2-5
    2. pick 2-3 colors from palette 0-9
    3. fill an NxN grid randomly with those colors
    4. reject if the grid has 4-fold rotational symmetry (all rotations identical)
