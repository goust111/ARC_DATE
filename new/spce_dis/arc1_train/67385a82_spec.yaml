spec:
  grid: 3-6 rows x 3-6 cols, black (0) background
  colors: input uses only black + green (3); output replaces multi-pixel green objects with teal (8)
  foreground:
    total_components: 3-5 (4-connected green objects)
    single_pixel: 1-3 isolated green pixels (stay green in output)
    multi_pixel: 1-2 objects with area 2-5 each (recolored to teal in output)
    green_density: 0.25-0.55 of total cells [observed]
  rule: recolor every 4-connected green component with area > 1 to teal; leave single-pixel green and black unchanged

generation_strategy:
  approach: direct random placement (constraints are loose enough for low rejection)
  steps:
    1. Pick grid dimensions uniformly from 3-6 rows x 3-6 cols
    2. Start with all-black grid
    3. Choose num_multi in [1,2] and num_single in [1,3]
    4. For each multi-pixel component, grow a random 4-connected blob of size 2-5 on empty cells (random walk or BFS expansion)
    5. Place num_single isolated green pixels on remaining black cells, ensuring each has no 4-connected green neighbor
    6. Verify total green density in 0.20-0.60; retry if not
    7. Build output by copying input and recoloring all multi-pixel component cells to teal
