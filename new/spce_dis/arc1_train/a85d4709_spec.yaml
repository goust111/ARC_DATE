spec:
  grid: 3x3, fixed
  background: black (0)
  markers:
    color: grey (5)
    count: exactly 1 per row (3 total)
    placement: each row has one grey pixel and two black pixels
    column_repeats_allowed: yes, rows may share same marker column (1-3 unique columns observed)
  transform:
    type: transform_in_place
    rule: fill entire row with color determined by marker column
    column_color_map: col0 -> red (2), col1 -> yellow (4), col2 -> green (3)
  output: 3x3 grid where each row is a solid color from {2, 4, 3}

generation_strategy:
  approach: direct random (grid is tiny, no rejection needed)
  steps:
    1. Create 3x3 black grid
    2. For each row, pick a random column (0, 1, or 2) and place grey (5) there
