spec:
  grid: 10-15 rows x 14-16 cols
  background: BLACK (fills entire grid except 2 marker pixels)
  markers:
    red: exactly 1 pixel (Color.RED=2), the path start
    green: exactly 1 pixel (Color.GREEN=3), the path target
    placement: different row AND different column; both >=1 cell from grid edges [observed]
  path:
    shape: L-shaped (one right-angle turn) from red toward green
    routing: horizontal-first from red's row to green's column, then vertical toward green, stopping 1 cell before green
    color: TEAL (8), painted only on background cells
    length: h_dist + v_dist - 1 where h_dist=|col_diff|, v_dist=|row_diff|; observed 15-17
    the red and green pixels themselves are NOT painted teal
  output: input + teal L-path; red and green markers preserved

generation_strategy:
  approach: direct (input is trivial — just 2 pixels on a blank grid)
  steps:
    1. Pick grid size H in [10,15], W in [14,16]
    2. Fill grid with BLACK
    3. Place red pixel at (r1, c1) and green pixel at (r2, c2) with r1 != r2 and c1 != c2
    4. Ensure both markers are >= 1 cell from all grid edges
    5. Ensure Manhattan distance (|r1-r2| + |c1-c2|) >= 14 for non-trivial paths [observed]
