spec:
  grid: 11 rows x 11 cols [observed]; solver requires 2*panel_h+1 rows, panel_h >= 1, width >= 1
  background: 0 (black)
  divider:
    single solid horizontal row at row panel_h (middle), color 5 [observed], any non-bg color works
    spans full width; exactly one such row exists
  panels:
    two equal-size panels above and below divider, each panel_h x width
    each panel uses exactly 1 foreground color, distinct from each other, from bg, and from divider color
    fg pixel count per panel: 5-10 [observed], density ~10-18%
    fg pixels are scattered individual cells (no connected blobs required)
    no positional overlap: for every (r,c), at most one panel has a fg pixel there
  output:
    delete divider row, overlay both panels => merged panel_h x width grid
    every fg pixel from both panels appears at its original (r,c) in output

generation_strategy:
  approach: output-first
  steps:
    1. Choose panel dims (e.g. panel_h=3-7, width=7-15 for variety, or fixed 5x11)
    2. Pick 3 distinct non-bg colors: color_top, color_bot, color_div (all != 0, all different)
    3. Build merged output grid (panel_h x width) on bg=0
    4. Place 5-12 fg pixels total, randomly split between color_top and color_bot (each >=3), at non-overlapping positions
    5. Derive input by splitting: top panel keeps color_top pixels, bottom panel keeps color_bot pixels, insert divider row of color_div between them => (2*panel_h+1) x width input
