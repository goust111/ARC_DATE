spec:
  grid: 12-27 rows x 14-25 cols
  colors:
    background: always BLACK (0)
    foreground: one non-red, non-black color (observed: azure, blue, green, yellow)
    red: absent from input, used only in output
  blank_lines:
    definition: rows/columns consisting entirely of background color
    blank_rows: 0-3
    blank_cols: 1-2
    total: 2-5 (at least 1 blank row or 1 blank col)
    position: never at grid edges [observed]
    segment_size: >=1 rows/cols between consecutive blanks and edges
  foreground_pattern:
    density_in_non_blank_area: 0.68-0.72 (randomly scattered)
    every non-blank row has >=1 foreground pixel
    every non-blank column has >=1 foreground pixel
  output_transform:
    recolor all cells in blank rows and blank columns to RED
    all other cells unchanged

generation_strategy:
  approach: direct construction (constraints are easy to satisfy forward)
  steps:
    1. Pick grid H in [12,27], W in [14,25]
    2. Pick fg color from {1,3,4,5,6,7,8,9} (exclude RED=2)
    3. Choose blank row count in [0,3] and blank col count in [1,2], ensuring total >=2
    4. Place blank rows/cols at non-edge positions with >=1 gap between them and edges
    5. Fill non-blank cells randomly with fg at ~70% density and bg at ~30%
    6. For each non-blank row, if it has no fg pixel, flip one random bg cell to fg
    7. For each non-blank col, if it has no fg pixel, flip one random bg cell to fg
    8. Set every cell in blank rows and blank cols to bg (ensuring they are fully bg)
