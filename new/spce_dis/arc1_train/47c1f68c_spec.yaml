spec:
  grid: odd square N x N, N in 7-13
  colors: exactly 3 -- bg (0), cross_color, mask_color (all distinct non-zero)
  cross:
    one full row + one full column of cross_color intersecting at the exact center ((N-1)/2, (N-1)/2)
    the cross row and column are the ONLY occurrences of cross_color
  mask:
    4-7 pixels of mask_color placed strictly in the upper-left quadrant (rows 0..center-1, cols 0..center-1)
    no pixel on the cross row/column; asymmetric (neither LR nor UD) [observed]
    may be disconnected (1-4 components observed); density 0.19-0.44 of quadrant
  remaining cells: bg (0)
  output:
    (N-1) x (N-1) grid; cross row and column removed
    mask recolored to cross_color and mirrored into all four quadrants (LR + UD + both)
    output has perfect 4-way (LR + UD) symmetry

generation_strategy:
  approach: output-first
  steps:
    1. Pick N odd in [7, 9, 11, 13]; set Q = (N-1)/2
    2. Choose bg=0, cross_color, mask_color (two distinct non-zero colors)
    3. Create Q x Q quadrant; place 4-7 random asymmetric pixels as mask
    4. Build (N-1)x(N-1) output by mirroring quadrant mask (recolored to cross_color) into all four quadrants
    5. Build N x N input -- insert cross row at center and cross column at center (all cross_color), place mask pixels (in mask_color) in the upper-left quadrant, fill rest with bg
