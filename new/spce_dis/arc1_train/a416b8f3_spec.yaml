spec:
  grid: 3-5 rows x 3-4 cols
  colors: 3-6 distinct colors including 0 (black background)
  background_fraction: 0.30-0.56 [observed]
  symmetry: input has no LR or UD symmetry [observed]
  content: arbitrary colored cells on black background; no special object structure required
  transform: output = input tiled once horizontally, i.e. [input | input], doubling width

generation_strategy:
  approach: direct — task is trivial (identity tile), so generate input directly
  steps:
    1. Pick height in [3,5], width in [3,4]
    2. Pick 2-5 non-zero colors randomly from 1-9
    3. Fill grid with 0 (background), then place non-zero colors in ~40-70% of cells
    4. Ensure no LR or UD symmetry (reject if symmetric, low rejection rate)
    5. Output is np.concatenate([grid, grid], axis=1)
