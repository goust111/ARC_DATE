spec:
  grid: 3x3 (fixed)
  colors:
    num_distinct: 5-6
    frequency_distribution: exactly one color has count 3 (the dominant); remaining 4-5 colors split the other 6 cells with counts in {1, 2}
    dominant_color: unique — no ties for the maximum frequency
    palette: any 5-6 distinct colors from 0-9
  output: entire grid filled with the dominant color

generation_strategy:
  approach: direct construction (task is simple enough)
  steps:
    1. Pick grid size 3x3
    2. Choose 5-6 distinct colors from 0-9
    3. Designate one as the dominant color with count=3
    4. Distribute remaining 6 cells among the other 4-5 colors, each getting 1-2 cells, summing to 6
    5. Randomly assign these counts to the 9 cell positions
    6. Verify the dominant color is strictly the most frequent (guaranteed by construction since max non-dominant count is 2 < 3)
