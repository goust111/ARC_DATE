spec:
  grid: 6x6 [observed], can generalize to 5-10 rows x 5-10 cols
  background: single color (always 0 in eval [observed])
  marker_block:
    size: exactly 2x2
    colors: 4 distinct non-background colors
    placement: not touching any grid edge (min 1 cell margin on all sides)
    position_range: r0 in [1, H-3], c0 in [1, W-3]
  transform:
    rule: each marker cell's color fills the diagonally-opposite corner rectangle
    rectangles: extend min(2, distance_to_edge) rows/cols from the block
    mapping: |
      TL color -> bottom-right rect, TR color -> bottom-left rect
      BL color -> top-right rect,    BR color -> top-left rect
    marker_block: unchanged in output

generation_strategy:
  approach: direct (input is simple enough to construct directly)
  steps:
    1. Pick grid size H x W (6x6 observed; generalize to 5-10)
    2. Fill grid with background color
    3. Pick block top-left (r0, c0) ensuring r0 >= 1, r0 <= H-3, c0 >= 1, c0 <= W-3
    4. Choose 4 distinct non-background colors for TL, TR, BL, BR of the 2x2 block
    5. Place the block on the grid
  validation:
    - exactly 4 non-background cells forming a contiguous 2x2 block
    - block has 1+ cell margin to every grid edge
