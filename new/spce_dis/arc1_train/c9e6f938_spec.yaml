spec:
  grid:
    rows: 3 [observed]
    cols: 3 [observed]
  colors:
    palette: exactly {0, 7} [observed]
    non-zero_cells: 1-4 (not all zero)
  constraint: input must NOT be left-right symmetric (otherwise output is trivially two identical halves)
  output:
    rows: same as input
    cols: 2x input cols
    left_half: identical to input
    right_half: left-right mirror of input

generation_strategy:
  steps:
    1. Pick rows in 2-5, cols in 2-5 (eval uses 3x3 but solver is general).
    2. Fill grid with 0. Randomly place 1-ceil(rows*cols/2) cells of color 7.
    3. Reject if grid is left-right symmetric (ensures non-trivial output).
    4. Return the grid as input.
