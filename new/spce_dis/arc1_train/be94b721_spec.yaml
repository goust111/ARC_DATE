task_id: be94b721
description: Crop the unique largest 4-connected monochromatic foreground object to its bounding box.

spec:
  grid: 5-9 rows x 9-13 cols
  background: 0 (black) [observed]
  objects:
    count: 3-4 monochromatic 4-connected components, each a distinct non-bg color
    largest: exactly one component has strictly the largest pixel area (6-10 cells)
    distractors: remaining components have area 3-6, all smaller than the largest
    bbox_dims: 2-4 rows x 2-3 cols per component
    fill_ratio: 0.56-1.00 (pixels / bbox area)
    separation: no two fg components are 4-adjacent; min 1-cell bg gap between any pair
    placement: scattered across the grid; may touch grid border [observed]
  output:
    content: tight bounding-box crop of the largest component, bg fills non-object cells
    size: 3-4 rows x 2-3 cols (matches largest component's bbox)

generation_strategy:
  approach: direct (forward construction; task is simple selection, no inversion needed)
  steps:
    1. Choose grid H in [5,9], W in [9,13].
    2. Choose N in [3,4] distinct non-zero colors.
    3. For each component, generate a random 4-connected monochromatic blob within a
       2-4 x 2-3 bounding box with fill ratio >= 0.5. Ensure the largest has strictly
       the most pixels (area 6-10) and each distractor has fewer pixels.
    4. Place all components on the grid with >= 1 cell bg gap between any two components
       (no 4-adjacency between distinct fg pixels). Retry placement if overlap or adjacency.
    5. Output is the tight crop of the largest component's bounding box.
