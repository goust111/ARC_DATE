spec:
  grid: 3x3 [observed, solver accepts any size]
  colors: 4 distinct colors including 0 [observed]
  symmetry: input is NOT LR or UD symmetric [observed]
  transform: |
    Four-quadrant mirror tiling. Output is 2H x 2W.
    Upper-left  = original input
    Upper-right = input flipped left-right
    Lower half  = upper half flipped top-bottom
  output_size: 6x6 (2x input dimensions)

generation_strategy:
  approach: direct random input
  steps:
    1. Pick grid size H x W, 2-5 each (use 3x3 to match eval)
    2. Choose 3-5 distinct colors from 0-9, always including 0
    3. Fill HxW grid randomly with chosen colors
    4. Reject if grid has LR or UD symmetry (output would look trivial)
    5. Return the HxW grid as input
