spec:
  grid: 12x12, black background
  colors: input gray(5) only; output adds pink(6), orange(7), teal(8)
  objects:
    type: gray single-pixel-thick square frames (hollow rectangles)
    count: 2-3 per grid, each with a distinct interior size from {1,2,3}
    frame_sizes: outer bbox (N+2)x(N+2) for interior side N; pixels = 4N+4
    frames_complete: all frames are complete (never clipped), even when touching grid border
    separation: min Chebyshev distance >= 2 between any two frames (no 4-adjacent gray from different frames)
    border_touching: 0-1 frames may touch grid edge [observed]
  enclosed_interiors: each frame encloses exactly one solid NxN black region (N in 1-3)
  transform:
    fill_map: 1x1 -> pink(6), 2x2 -> orange(7), 3x3 -> teal(8)
    gray outlines and exterior black unchanged

generation_strategy:
  approach: direct placement (simple enough that output-first is unnecessary)
  steps:
    1. Create 12x12 black grid
    2. Choose 2-3 distinct sizes from {1,2,3} (3/4 examples use all three)
    3. For each size N, the frame occupies (N+2)x(N+2) pixels; place frames one at a time at random positions ensuring the frame fits within the 12x12 grid and maintains Chebyshev distance >= 2 from all previously placed frames
    4. A frame may extend to the grid border (top-left at row/col 0 or bottom-right at row/col 12-(N+2)) but must remain complete
    5. Draw each frame as a hollow gray rectangle on the black grid
