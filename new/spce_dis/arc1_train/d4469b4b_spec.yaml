spec:
  grid:
    input: 5x5 fixed
    output: 3x3 fixed
  input:
    background: black
    foreground_color: exactly one of red(2), blue(1), or green(3)
    foreground_pixels: 8-14 randomly scattered on the 5x5 grid
    shape: noise/distractor; foreground pixel positions carry no semantic meaning
  output:
    color_mapping:
      blue(1): grey plus/cross (center + 4 cardinal neighbors)
      red(2): grey top-T (full top row + center column below)
      green(3): grey lower-right L (full bottom row + right column above)
    background: black
    foreground: grey(5)
  transform: ignore foreground positions entirely; output determined solely by foreground color

generation_strategy:
  approach: direct random construction (task is simple enough)
  steps:
    - pick foreground color uniformly from {blue, red, green}
    - create 5x5 black grid
    - choose pixel count k uniformly from 8-14
    - randomly select k of the 25 positions and set them to the chosen color
    - output is the fixed 3x3 grey symbol for that color
