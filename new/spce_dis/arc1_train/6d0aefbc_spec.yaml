spec:
  grid:
    input: 3x3 [observed]
    output: same height, double width (3x6 [observed])
  colors:
    palette: subset of {1, 6, 8} [observed]
    distinct_per_grid: 2-3
    no_black: color 0 never appears [observed]
  transform: append left-right mirror of input as right half
    # output[:, :W] == input; output[:, W:] == fliplr(input)
  input_symmetry: input is NOT required to be LR-symmetric (4/5 are not, 1/5 is)

generation_strategy:
  approach: direct random (task is trivially invertible)
  steps:
    1. Choose grid size 3x3 (all eval examples are 3x3).
    2. Pick 2-3 colors from {1, 6, 8}.
    3. Fill the 3x3 grid randomly with the chosen colors.
    4. Output = np.concatenate([grid, np.fliplr(grid)], axis=1).
