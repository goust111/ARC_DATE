spec:
  grid: 3x3 input, output is 3*S x 3*S where S = number of distinct foreground colors
  background: color 0 (black) [observed], must be the unique most-frequent color
  foreground:
    distinct_colors: 2-4
    total_fg_cells: 4-5
    colors may repeat (some fg color can occupy 1-3 cells)
    bg_cells: 4-5 (always majority of 9 cells)
  transform: replace each pixel with an S x S block of the same color

generation_strategy:
  approach: direct (input is trivially small)
  steps:
    1. Pick n_fg from {2, 3, 4}
    2. Pick n_fg distinct non-zero colors (1-9)
    3. Create a 3x3 grid filled with 0
    4. Place fg_cells (4-5 total) at random positions, assigning from the chosen colors so each color appears at least once; remaining fg cells get random repeats
    5. Verify bg (color 0) is strictly the most frequent color (>= 5 cells when fg=4, >= 4 cells when fg=5) and is the unique mode
    6. Output = scale each pixel to an n_fg x n_fg block
