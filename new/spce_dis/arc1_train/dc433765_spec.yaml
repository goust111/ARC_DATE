spec:
  grid: 3-11 rows x 3-11 cols; mostly square [observed]
  background: black (color 0); fills all cells except the two markers
  markers:
    green: exactly 1 pixel (color 3) — the source that moves
    yellow: exactly 1 pixel (color 4) — the fixed destination
  alignment: green and yellow lie on the same row, column, or exact 45-degree diagonal
  direction_types: horizontal, vertical, or diagonal (all three appear)
  chebyshev_distance: 2-7 between green and yellow (never adjacent)
  no_other_colors: grid contains only black, green, and yellow
  transform: |
    Clear green's cell to black. Place green one step closer to yellow
    along the shared axis (unit step in row and/or col direction).
    Yellow stays fixed. All other cells unchanged.

generation_strategy:
  approach: direct (task is simple enough for forward construction)
  steps:
    1. Pick grid dimensions H in [3,11], W in [3,11].
    2. Pick a direction type: horizontal, vertical, or diagonal (8 possible unit vectors).
    3. Place yellow marker at a random valid cell.
    4. Pick Chebyshev distance d in [2, max feasible for grid/direction], place green
       d steps away from yellow along the chosen direction (must stay in bounds).
    5. Verify the cell one step from green toward yellow is in-bounds (guaranteed by d>=2).
    6. Fill all other cells with black.
