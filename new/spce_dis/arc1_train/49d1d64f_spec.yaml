spec:
  grid: 2-3 rows x 2-3 cols (input); output is input+2 in each dimension
  colors: 3-6 distinct colors per input; any ARC colors allowed
  border_constraint: all cells on the input perimeter are non-black [observed]
  interior: may contain black (0) or any color
  transform:
    - place input at out[1:-1, 1:-1]
    - copy input top row to out[0, 1:-1]
    - copy input bottom row to out[-1, 1:-1]
    - copy input left col to out[1:-1, 0]
    - copy input right col to out[1:-1, -1]
    - four output corners are always black (0)

generation_strategy:
  approach: direct input generation (transform is trivial / non-invertible)
  steps:
    1. pick H in [2,5], W in [2,5]
    2. fill HxW grid with random non-zero ARC colors for all border cells
    3. fill interior cells (if any) with random ARC colors including 0
    4. output is derived deterministically by the extrusion rule above
