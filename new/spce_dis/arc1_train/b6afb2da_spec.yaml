spec:
  grid: 10x10 [observed]
  background: BLACK
  objects:
    count: 2 [observed]
    type: solid GREY rectangles (fill their bounding box)
    height: 3-6
    width: 4-6
    min_dimension: >=3 so interior cells exist [observed]
    separation: non-overlapping, non-touching; >=1 row or col gap between bounding boxes
  transform:
    corners: recolored BLUE (4 per rectangle)
    remaining_border: recolored YELLOW
    interior: recolored RED
    background: unchanged

generation_strategy:
  approach: direct (simple task, no inversion needed)
  steps:
    1. Create 10x10 BLACK grid.
    2. Sample rect_1 with h in [3,6], w in [4,6]. Place at random valid position.
    3. Sample rect_2 with h in [3,6], w in [4,6]. Place so bounding boxes have >=1 cell gap (no touching). Retry placement if overlap/touch.
    4. Fill both rectangles with GREY to produce input.
    5. For output, recolor each rectangle per transform rule.
