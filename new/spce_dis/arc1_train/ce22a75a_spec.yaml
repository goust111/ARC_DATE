spec:
  grid: 9x9 (3x3 macro-grid of 3x3 blocks) [observed]
  background: black
  markers:
    color: grey
    placement: exactly one pixel at center of each marked 3x3 block (row%3==1, col%3==1)
    count: 3-4 out of 9 macro-blocks
    remaining blocks: all black
  output:
    transform: replace each marked 3x3 block entirely with blue; unmarked blocks stay black
    colors_used: blue only (no grey preserved)

generation_strategy:
  steps:
    1. Create a 9x9 black grid (or NxN where N is a multiple of 3, 9-15 for variety).
    2. Enumerate all macro-block positions in the (N/3)x(N/3) macro-grid.
    3. Randomly select 2-5 macro-blocks to mark (at least 1, not all).
    4. Place a grey pixel at the center of each selected block (row*3+1, col*3+1).
    5. Output is derived by filling each selected 3x3 block with blue, rest black.
