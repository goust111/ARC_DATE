spec:
  grid: (2H+1) x W where H=W=4, so input is 9x4 [observed constant]
  background: black (0)
  separator: one solid full-width row of yellow (4) at row H, splitting grid into two equal HxW masks
  upper_mask:
    foreground_color: orange (7) [observed], any non-bg non-green non-separator color accepted by solver
    fill: 8-10 cells of 16 (50-62%) [observed]
    exactly 1 foreground color besides bg
  lower_mask:
    foreground_color: red (2) [observed], any non-bg non-green non-separator color accepted by solver
    fill: 6-8 cells of 16 (38-50%) [observed]
    exactly 1 foreground color besides bg
  colors: bg, upper_fg, lower_fg, separator must all be distinct; green (3) must NOT appear in input
  output:
    size: HxW (same as one mask)
    rule: green (3) where both masks have bg at that cell; bg elsewhere
  complement_cells: 2-6 of 16 (12-38%), i.e. the union of two masks must NOT cover the entire grid [observed]

generation_strategy:
  approach: output-first
  steps:
    1. Pick H=W=4 (fixed per eval). Choose bg=0, sep_color=4, upper_fg=7, lower_fg=2.
    2. Generate output mask (HxW) with K green cells, K in 2-6, rest bg. Place green cells randomly.
    3. Green cells = positions where both masks must be bg. For non-green cells, at least one mask must be fg.
    4. For each non-green cell, randomly decide which masks are fg -- upper only, lower only, or both.
       Ensure upper total fill is 8-10 and lower total fill is 6-8.
    5. Build upper mask (fg cells get upper_fg, rest bg) and lower mask similarly.
    6. Assemble input as [upper_mask; separator_row; lower_mask] (9x4 grid).
