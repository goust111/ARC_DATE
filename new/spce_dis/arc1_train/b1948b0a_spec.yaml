spec:
  grid: 3-6 rows x 4-6 cols
  colors: exactly two — pink (6) and orange (7), no other colors
  pink_fraction: 40-55% of cells [observed]
  distribution: both colors scattered freely, no special spatial structure required
  output:
    same dimensions as input
    every pink pixel replaced with red (2)
    every orange pixel unchanged
    result contains exactly red (2) and orange (7)

generation_strategy:
  step1: pick random rows in 3-6, cols in 4-6
  step2: fill grid randomly with pink (6) and orange (7), each cell ~50/50
  step3: ensure both colors are present (reject if monochrome — negligible rejection rate)
