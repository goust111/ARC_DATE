spec:
  grid: 2-6 rows x 2-6 cols, square [observed]
  background: black (0)
  foreground:
    color: exactly 1 non-background color, not teal (8)
    count: 1-3 pixels, sparse (<=~25% of cells)
    placement: at most 1 fg pixel per column [observed]; at least 1 column has no fg
  transform:
    step1: in every column containing a fg pixel, recolor all bg cells to teal (8)
    step2: tile the resulting grid 2x2 to produce the output
  output: 2*H x 2*W grid; contains original fg pixels, teal marks, and untouched bg columns

generation_strategy:
  approach: direct input generation (simple task, low rejection)
  steps:
    1. pick H=W from 2-6
    2. pick fg color from {1-7,9} (exclude 0=bg and 8=teal)
    3. pick k = randint(1, min(H, W, 3)) foreground pixels
    4. choose k distinct columns; for each, place the fg pixel in a random row
    5. ensure at least 1 column has no fg pixel (guaranteed since k < W by step 3 cap)
    6. fill remaining cells with bg (0)
