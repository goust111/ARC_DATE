spec:
  grid: 3x3 [observed], black background
  foreground:
    colors: exactly 1 non-black color
    count: 1-8 (observed 1-5), pixels placed at arbitrary positions
  output: 1 x fg_count row filled with the foreground color
  transform: count non-black pixels, emit that count as a single row of the foreground color

generation_strategy:
  approach: direct (task is trivially generatable forward)
  steps:
    1. Pick grid size 3x3
    2. Pick a non-black foreground color uniformly from ARC palette
    3. Pick fg_count in 1-8 (leave at least 1 black cell)
    4. Randomly choose fg_count distinct cell positions and fill with foreground color
    5. Output is np.full((1, fg_count), fg_color)
