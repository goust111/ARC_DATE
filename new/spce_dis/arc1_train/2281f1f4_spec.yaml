spec:
  grid: 10x10 [observed], background black, no red in input
  marker_color: gray (5), single marker color only
  column_headers: gray pixels in row 0, columns 0..W-2 (never in last column)
    count: 2-5
  row_headers: gray pixels in column W-1, rows 1..H-1 (never in row 0)
    count: 2-5
  top_right_corner: always background (row 0, col W-1 is empty)
  all_other_cells: background (markers exist ONLY on row 0 and column W-1)
  output: input preserved; at each (row_header_r, col_header_c) intersection, fill with red (2)
    red_count equals num_col_headers * num_row_headers

generation_strategy:
  approach: direct construction (simple enough, no inversion needed)
  steps:
    1. Create 10x10 black grid
    2. Pick num_col_markers in 2-5, choose that many distinct columns from 0..8
    3. Pick num_row_markers in 2-5, choose that many distinct rows from 1..9
    4. Place gray (5) at row 0 for each chosen column
    5. Place gray (5) at column 9 for each chosen row
    6. Verify g[0,9] is background (guaranteed by col range 0..8 and row range 1..9)
