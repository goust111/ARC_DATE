spec:
  grid: 10x10 [observed]
  background: black (color 0) [observed]
  bars:
    count: exactly 3
    color: all gray (color 5) in input
    shape: each is a straight 1-cell-thick horizontal or vertical bar
    orientation: any mix of H and V [observed mixes: all-V, 2H+1V]
    lengths: 2-7, all three distinct
    separation: bars do not 4-touch each other
    placement: may touch grid edges
  transform:
    longest bar -> blue (1)
    middle bar -> yellow (4)
    shortest bar -> red (2)
    background pixels unchanged

generation_strategy:
  approach: direct (input is simple enough to generate forward)
  steps:
    1. Create 10x10 black grid.
    2. Place 3 gray bars one at a time. For each bar, pick a random orientation
       (H or V), a random length (2-7), and a random position. Ensure all three
       lengths are distinct, bars stay within grid bounds, and no bar 4-touches
       another bar (no shared 4-neighbor with any previously placed bar cell).
    3. Output is produced by sorting bars by length and recoloring
       longest->blue, middle->yellow, shortest->red.
