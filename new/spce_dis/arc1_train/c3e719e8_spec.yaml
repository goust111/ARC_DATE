spec:
  grid: 3x3, all cells non-black (colors 1-9)
  colors: 3-4 distinct colors
  dominant_color: exactly one color with strictly highest frequency (3-6 cells out of 9)
  non_dominant_cells: 3-6 cells with 2-3 other colors
  output: 9x9 grid of 3x3 block slots; slots at positions where dominant color appears get stamped with full input copy; rest are black

generation_strategy:
  approach: direct construction (input is tiny, constraints are simple)
  steps:
    1. Pick 3-4 distinct non-black colors randomly
    2. Pick one as dominant; assign it to 3-6 of the 9 cells (randomly chosen positions)
    3. Fill remaining cells with the other colors, ensuring no other color ties with the dominant count
    4. Verify unique-most-frequent constraint; retry step 2-3 if tied
    5. Output is deterministic from input via solver
