spec:
  grid:
    shape: 3x3 square [observed]
    side_length: 3-5 (solver requires square; eval always 3)
  colors:
    distinct_count: 3-5 per grid
    palette: any ARC colors (0-9)
  content:
    no special structure required; random fill is fine
    input should NOT be rotationally symmetric (rot90) to keep output non-trivial [observed]
  output:
    shape: 2N x 2N where N is input side length
    upper_left: original input
    upper_right: input rotated 90 degrees clockwise
    lower_left: input rotated 90 degrees counterclockwise
    lower_right: input rotated 180 degrees

generation_strategy:
  approach: direct random (input is unconstrained; output is deterministic)
  steps:
    1. pick side N=3 (or 3-5 for variety)
    2. pick 3-5 distinct colors randomly from 0-9
    3. fill NxN grid randomly with those colors
    4. reject if grid equals its own rot90 (to avoid trivial output)
    5. output is computed deterministically by the solver
