task_id: 8e5c0c38
task_type: transform_in_place
summary: "对网格中每个非背景色精灵独立找到其最佳垂直对称轴，删除没有镜像对应像素的噪声像素，使每个精灵恢复完美的垂直镜像对称"

dimensions:
  - id: D1
    name: "对称修复的变换方式"
    tag: transform
    current: "删除没有镜像对应像素的噪声像素，使精灵恢复垂直镜像对称"
    alternatives:
      - name: "补全缺失的镜像像素而非删除多余像素"
        description: "反转当前策略：不删除无对应的噪声像素，而是在镜像位置添加像素使其对称。噪声像素被视为'缺失了镜像伙伴'的合法像素而非多余像素。解题者需理解'补全'而非'削减'的修复逻辑，输出的精灵会比输入更大。推理方向完全相反。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "噪声像素重着色而非删除"
        description: "不将噪声像素变为背景，而是将其重着色为一种统一的标记颜色（如每个精灵的噪声像素统一变为红色）。解题者需识别哪些像素是不对称的，并改变其颜色而非删除。输出中保留精灵的完整轮廓但颜色分化，视觉效果更丰富。"
        source: recolor
        source_task: 2b83f449
        delta_lines: 15
      - name: "整个精灵旋转90度后修复对称"
        description: "先将每个精灵在其外接矩形内旋转90度，然后执行对称修复。解题者需同时推断旋转和对称修复两步操作的组合效果，多步推理需求增加。"
        source: rotation
        source_task: 2b83f449
        delta_lines: 35
      - name: "噪声像素沿对称轴翻转到镜像位置"
        description: "不删除噪声像素，而是将其沿对称轴翻转到镜像位置。如果镜像位置已有像素则不动作。效果是噪声像素从一侧'跳'到另一侧，精灵形状改变但仍保持不对称（只是不对称的方向反转）。解题者需理解'翻转定位'的空间变换规则。"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 20
      - name: "删除像素使精灵变为点对称而非轴对称"
        description: "不修复为垂直轴镜像对称，而是修复为绕中心的180度旋转对称（点对称）。判断'多余像素'的标准从镜像对应变为旋转对应，需要同时考虑行和列两个方向。解题者的对称性推理从一维（轴）扩展到二维（点），难度显著提升。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D2
    name: "对称轴方向"
    tag: transform
    current: "仅搜索垂直对称轴（遍历所有可能的垂直轴位置，选择得分最高的轴）"
    alternatives:
      - name: "水平对称轴修复"
        description: "将对称轴从垂直方向改为水平方向。噪声像素的添加和删除判据变为上下镜像而非左右镜像。视觉模式不同——解题者需识别水平对称性破坏，这在人类直觉中不如垂直对称性自然，可能增加感知难度。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "每个精灵独立选择最佳轴方向（垂直或水平）"
        description: "不固定为垂直轴，而是对每个精灵同时评估垂直和水平两个方向，选择得分更高的那个方向作为该精灵的对称轴。不同精灵可能使用不同方向的轴。解题者需为每个精灵独立判断轴方向，增加了逐对象推理的复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "对角线对称轴修复"
        description: "对称轴为45度或135度对角线，判断镜像对应时需沿对角方向翻折。这是一个不常见的对称性类型，解题者需要在二维空间中进行对角翻转推理，难度较高但产生视觉上有趣的对称图案。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "使用外部标记指示对称轴方向"
        description: "在每个精灵附近放置一个特殊颜色的标记像素（如红色线段），标记的朝向指示该精灵应使用的对称轴方向（水平标记=垂直轴，垂直标记=水平轴）。解题者需先解码标记的语义，再执行对应方向的对称修复。增加了符号解码步骤。"
        source: marker_axis
        source_task: 7ed72f31
        delta_lines: 40

  - id: D3
    name: "被变换的源对象类型"
    tag: src
    current: "3个独立颜色的近对称精灵，每个精灵使用单一颜色，精灵间互不重叠"
    alternatives:
      - name: "单个大型近对称精灵"
        description: "整个网格中只有一个大型精灵（而非3个小精灵），使用单一颜色。精灵占据更多空间，噪声像素更多。解题者只需处理一个对称修复问题，但精灵更大、形状更复杂、轴定位更难。任务从'多实例简单修复'变为'单实例复杂修复'。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "精灵数量增加到5-6个"
        description: "增加精灵数量至5-6个（需要更大的网格或更小的精灵来容纳），每个仍有独立颜色和独立对称轴。解题者需处理更多修复实例，工作量增加但每个实例的推理不变。考验系统性和全面性。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "多色精灵（每个精灵使用2种颜色）"
        description: "每个精灵由两种颜色组成（如外轮廓一种颜色、内部填充另一种颜色），两种颜色共享同一对称轴。噪声可能出现在两种颜色中的任何一种上。解题者需理解同一精灵内的两种颜色服从相同的对称轴约束。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "精灵具有空洞（内部有背景色区域）"
        description: "干净的精灵不仅是实心的像素集合，还包含对称分布的内部空洞（背景色孔）。噪声可能填充原本应为空洞的位置，或在外轮廓上添加多余像素。解题者需理解空洞也是对称结构的一部分，增加了形状复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "精灵部分重叠"
        description: "允许不同颜色的精灵在空间上部分重叠，重叠区域显示其中一种颜色（后绘制的覆盖先绘制的）。输出中需要恢复每个精灵的完整对称形状，包括被遮挡的部分。解题者需推断遮挡关系并'还原'被覆盖的像素。"
        source: creative
        source_task: null
        delta_lines: 50

  - id: D4
    name: "噪声像素的放置约束"
    tag: meta
    current: "噪声像素必须与干净形状4邻接，其镜像位置必须为背景色，且噪声不互相配对"
    alternatives:
      - name: "噪声像素可在精灵外接矩形内任意位置"
        description: "放宽噪声约束：噪声像素不要求与干净形状相邻，可以出现在精灵外接矩形范围内的任何背景位置（仅保留镜像位置为背景的约束）。噪声可能离精灵主体较远，形成孤立的散点。解题者需在更大范围内识别不对称像素。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "噪声像素仅出现在对称轴一侧"
        description: "限制所有噪声像素只出现在对称轴的同一侧（如全部在右侧或全部在左侧）。这使不对称性具有方向一致性——解题者可以通过比较两侧差异快速识别噪声侧，但需推断'哪一侧是噪声侧'的规则。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "噪声像素可以是删除（缺失）像素而非添加像素"
        description: "噪声不是在干净形状上添加多余像素，而是从干净形状中删除部分像素（形成凹陷/缺口）。输入中缺失的像素打破对称性，解题者需将缺失位置补回。这使任务从'削减'变为'补全'，与D1的替代方案类似但从生成角度改变。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "噪声像素数量由精灵颜色值编码"
        description: "每个精灵的噪声数量不是随机的11-33%，而是恰好等于精灵颜色的数值（如颜色3有3个噪声像素，颜色7有7个噪声像素）。解题者可能发现颜色值与噪声数量的对应关系，但这个关系在视觉上不可直接观察——此方案需重新设计使数量关系可通过其他视觉线索推断。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D5
    name: "对称轴定位算法"
    tag: transform
    current: "遍历所有可能的垂直轴位置（整数轴和半整数轴），选择对称配对得分最高的轴"
    alternatives:
      - name: "对称轴由外部标记显式指定"
        description: "在网格中放置特殊颜色的垂直线段或单像素来显式标记每个精灵的对称轴位置。解题者无需推断轴位置，而是需要理解标记与精灵的对应关系。将任务的核心挑战从'发现对称轴'转移到'利用给定轴执行修复'。"
        source: marker_axis
        source_task: 7ed72f31
        delta_lines: 35
      - name: "选择得分第二高的轴进行修复"
        description: "反转轴选择规则：不选最佳轴，而选次佳轴。由于次佳轴的得分比最佳轴低但仍有一定的对称匹配，删除的像素会更多。解题者需理解'选择次优而非最优'的反直觉规则。这要求精灵设计上最佳轴和次佳轴有明显的得分差距以保证唯一性。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "使用外接矩形中心作为固定对称轴"
        description: "不搜索最佳轴，而直接使用精灵外接矩形的垂直中心线作为对称轴。如果精灵的实际对称轴偏离中心线，这种方法会删除更多像素。解题者需理解'中心线=对称轴'的简化规则，并处理轴偏移带来的额外删除。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "轴位置由精灵间的空间关系决定"
        description: "每个精灵的对称轴不由其自身像素分布决定，而由其与另一个特定精灵的相对位置决定（如两个精灵中心连线的中垂线）。解题者需建立精灵间的配对关系并推导轴位置，将单精灵问题升级为多精灵关联问题。"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D6
    name: "精灵的对称类型"
    tag: transform
    current: "垂直镜像对称（bilateral mirror symmetry about a vertical axis）"
    alternatives:
      - name: "四重对称（同时垂直和水平轴对称）"
        description: "要求精灵同时满足垂直和水平两个方向的镜像对称。噪声像素是破坏任意一个方向对称性的像素。解题者需同时检查两个方向的镜像对应关系，删除在任一方向上缺少配对的像素。约束更强，删除的像素可能更多。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "旋转对称（90度旋转不变）"
        description: "精灵需满足90度旋转对称（C4对称群），即旋转0/90/180/270度后形状不变。这要求精灵大致为正方形。噪声像素打破旋转对称性。解题者需在四个旋转位置同时检查像素对应，推理复杂度大幅提升。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "平移对称（重复图案的周期性）"
        description: "精灵不是关于轴对称，而是包含周期性重复的小图案。噪声像素打破周期性。解题者需识别重复周期和基本图案，然后删除不符合周期规律的像素。这是一种完全不同的对称概念——从空间对称变为周期对称。"
        source: creative
        source_task: null
        delta_lines: 45

  - id: D7
    name: "网格尺寸与布局"
    tag: grid_shape
    current: "22x22固定网格，3个精灵放置在预定义的互不重叠区域（slot布局），精灵间最小间距>=4"
    alternatives:
      - name: "紧凑裁剪输出"
        description: "输出不保持22x22的完整网格，而是裁剪到包含所有修复后精灵的最小外接矩形。解题者需额外推断输出尺寸会缩小，且需理解裁剪边界的确定规则。改变了输入输出的尺寸关系。"
        source: tight_crop
        source_task: bf45cf4b
        delta_lines: 15
      - name: "网格尺寸随精灵数量和大小动态调整"
        description: "不使用固定的22x22，而是根据精灵的实际大小和数量动态计算最小所需网格。不同样例可能有不同大小的网格（如15x18, 20x25等）。解题者看到的网格大小变化，但核心规则不变，增加了泛化能力的考验。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "精灵自由放置（无slot约束）"
        description: "取消预定义slot布局，精灵可以在网格任意位置放置，只需满足外接矩形不重叠且有最小间距。这使精灵分布更不规则、更难预测，解题者无法利用固定的空间区域来分离不同精灵。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "极小网格（每个精灵独占一个小网格）"
        description: "将3个精灵分别放在3个独立的小网格中（如输入是3个小网格拼接的长条形），每个子网格只包含一个精灵。解题者需先理解分区结构，再对每个分区独立执行修复。空间结构从'共享大网格'变为'分区小网格'。"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 30

  - id: D8
    name: "精灵的几何约束"
    tag: meta
    current: "像素数6-46，外接矩形2-9行x3-12列，填充密度0.35-0.89，通常1个连通分量"
