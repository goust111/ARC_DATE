        source: inversion
        source_task: null
        delta_lines: 5
      - name: "间隙约束依赖精灵大小（大精灵要求更大间隙）"
        description: "间隙要求不是固定值，而是随精灵像素数量按比例增加（如间隙>=像素数/10）。大精灵需要更清晰的对称信号，小精灵可以容忍更模糊的信号。引入了自适应约束，生成器需要更精细地控制噪声分布。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D11
    name: "多步处理序列"
    tag: multi_step
    current: "单步处理：对每个颜色独立执行轴搜索和噪声删除，各颜色间无依赖关系"
    alternatives:
      - name: "迭代修复直到收敛"
        description: "将对称修复作为一轮，反复执行多轮：第一轮删除噪声后可能改变某些精灵的最佳轴位置（如果不同颜色精灵有空间交互），再执行第二轮修复。直到输出不再变化为止。虽然当前任务中颜色独立可能使迭代不必要，但如果引入跨颜色依赖则变得有意义。"
        source: multi_step
        source_task: 28a6681f
        delta_lines: 15
      - name: "按颜色优先级顺序处理"
        description: "不是并行处理所有颜色，而是按某种规则确定颜色处理顺序（如按颜色值从小到大，或按精灵大小从大到小），先处理的精灵修复结果会影响后续精灵的处理（如修复后暴露的背景区域）。解题者需推断处理顺序规则。"
        source: multi_step
        source_task: 247ef758
        delta_lines: 25
      - name: "两阶段处理：先定位所有轴，再统一删除"
        description: "第一阶段只确定每个精灵的对称轴位置（在原始噪声网格上），第二阶段在确定所有轴后再统一删除噪声。与当前逐颜色处理相比，如果轴搜索受到其他颜色像素的影响，统一处理可能产生不同结果。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "预处理步骤：先合并相邻同色像素再做对称修复"
        description: "在对称修复前增加一步：如果两个同色精灵距离很近（间隔1-2像素），先将它们合并为一个整体再搜索对称轴。解题者需判断哪些色块应被合并、哪些应独立处理，增加了分组推理。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D12
    name: "颜色系统与分组规则"
    tag: meta
    current: "1种背景色+3种不同前景色，每种颜色恰好一个精灵"
    alternatives:
      - name: "两个精灵共享同一颜色"
        description: "其中两个精灵使用相同颜色，解题者需要先将同色像素按空间连通性分成两个独立精灵，然后对每个精灵独立找对称轴并修复。增加了前置的分割/聚类步骤，从纯颜色分组变为空间+颜色联合分组。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "更多颜色（5-7种前景色）"
        description: "增加前景颜色数到5-7种，每种颜色一个精灵。更多精灵需要更大的网格或更小的精灵尺寸。解题者需处理更多修复实例，工作量增加，且需确保没有遗漏任何颜色。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "背景色不均匀（网格有两种背景色分区）"
        description: "网格被分为两个区域，各使用不同的背景色。精灵可以跨越两个背景区域。解题者需先识别两种背景色，在判断'噪声像素的镜像位置是否为背景'时需要考虑该位置所在区域的背景色。增加了背景识别的复杂度。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D13
    name: "增强变换（网格翻转）"
    tag: meta
    current: "生成后以50%概率分别进行上下翻转和左右翻转，作为数据增强"
    alternatives:
      - name: "90度旋转增强"
        description: "除了翻转外增加90/180/270度旋转作为增强选项。旋转后垂直对称轴变为水平对称轴，这本身改变了任务的视觉呈现（solver应仍能处理，因为搜索的是垂直轴，但旋转后精灵的对称轴变为水平方向，solver需相应调整或同时搜索两个方向）。"
        source: rotation
        source_task: 2b83f449
        delta_lines: 15
      - name: "不做任何增强"
        description: "取消所有翻转增强，精灵始终按原始方向放置。所有精灵的对称轴始终是垂直方向，且噪声分布不经过翻转变换。解题者看到的模式更一致，但任务的变化性降低。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "颜色置换增强"
        description: "在翻转的基础上增加颜色随机重映射（在10种ARC颜色中随机分配），使同一拓扑结构可以有不同的颜色方案。纯视觉增强，不改变推理逻辑，但增加了训练数据的多样性。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D14
    name: "精灵间的空间关系"
    tag: meta
    current: "3个精灵放置在预定义的slot布局中，slot间有足够间距（>=4像素），且使用2种固定布局模板"
    alternatives:
      - name: "精灵按特定空间模式排列（如三角形、一字排开）"
        description: "不使用随机slot布局，而是要求3个精灵按特定几何模式排列（如等间距一字排开、正三角形顶点位置等）。解题者可能注意到布局规律，但这不影响核心对称修复逻辑。增加了生成的规则性。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "精灵紧密排列（间距1-2像素）"
        description: "将最小间距从4缩小到1-2像素，精灵几乎紧贴在一起。在视觉上，相邻精灵的噪声像素可能靠近另一个精灵，解题者需要更仔细地按颜色区分不同精灵的像素。增加了颜色分离的注意力要求。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "精灵对称轴彼此对齐"
        description: "要求所有3个精灵的垂直对称轴位于同一列（或相距整数倍间隔的列）。这使轴位置具有全局规律性，解题者可能利用一个精灵的轴位置推断其他精灵的轴。引入了跨精灵的隐式关联。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D15
    name: "符号编码系统"
    tag: symbol_instructions
    current: "无显式符号编码或图例，所有信息通过精灵像素的空间分布隐式传达"
    alternatives:
      - name: "网格边缘图例指示每种颜色的噪声数量"
        description: "在网格边缘放置一个小型图例区域，用不同颜色的像素块表示每种前景色精灵中噪声像素的数量（如3个红色像素表示红色精灵有3个噪声像素）。解题者可利用图例验证修复结果，增加了信息冗余和解码步骤。"
        source: symbol_instructions
        source_task: dbff022c
        delta_lines: 35
      - name: "图例展示修复前后的示例对比"
        description: "在网格角落放置一个微型精灵的噪声版本和干净版本作为训练示例。解题者先从示例推断规则（删除不对称像素），再应用到主网格的大型精灵上。类似训练-测试范式，降低了规则发现的难度。"
        source: symbol_instructions
        source_task: 4c7dc4dd
        delta_lines: 40
      - name: "特殊颜色像素标记对称轴位置"
        description: "在每个精灵的对称轴所在列的网格顶部或底部放置一个特殊颜色的标记像素，显式指出轴位置。解题者无需推断轴位置，核心挑战转移到正确利用给定轴执行噪声删除。简化了轴发现，强化了修复执行。"
        source: symbol_instructions
        source_task: 9aaea919
        delta_lines: 30
      - name: "颜色编码的干扰精灵标记噪声区域"
        description: "在主精灵旁放置一个与之颜色不同的小型辅助精灵，其形状恰好是主精灵噪声像素的镜像图案。解题者需理解辅助精灵编码了噪声信息，并利用它来确定要删除的像素。增加了跨对象的对应关系推理。"
        source: creative
        source_task: null
        delta_lines: 45

  - id: D16
    name: "对称轴类型（整数轴与半整数轴）"
    tag: meta
    current: "支持整数轴（通过某列中心）和半整数轴（两列之间），通过 k/2 参数化表示"
    alternatives:
      - name: "仅允许整数轴"
        description: "限制对称轴只能通过某一列的中心（奇数宽度精灵），不允许半整数轴。精灵必须有奇数列宽，对称轴上有中心列像素。简化了轴搜索空间，但精灵形状的多样性降低。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "仅允许半整数轴"
        description: "限制对称轴只能在两列之间（偶数宽度精灵），不允许整数轴。精灵没有中心列，所有像素都有镜像配对。这使对称结构更'纯粹'（无中心列的特殊性），但排除了奇数宽度的形状。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "混合轴类型但每个样例中所有精灵使用相同类型"
        description: "同一样例中的所有精灵要么全是整数轴，要么全是半整数轴。解题者可以通过观察一个精灵推断其他精灵的轴类型，引入跨精灵的类型一致性约束。但不同样例间轴类型可以变化。"
        source: creative
        source_task: null
        delta_lines: 15
