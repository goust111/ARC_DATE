        description: "大幅增加噪声比例，噪声像素数接近甚至超过干净像素数的一半。精灵的对称结构被严重破坏，轴定位和噪声识别都变得更困难。解题者需要从高度噪声化的图案中恢复原始对称形状，类似去噪重建。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "噪声数量在精灵间相同"
        description: "所有3个精灵拥有完全相同数量的噪声像素（如都是5个）。解题者可能发现这个数值一致性并用作验证条件。增加了跨精灵的数值对称性约束。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "噪声像素可与其他噪声像素互相配对"
        description: "取消'噪声不互相配对'的约束：两个噪声像素可以恰好处于镜像位置。这使得部分噪声看起来像是合法的对称像素，解题者需要更深入地分析整体一致性来区分真正的对称结构和噪声配对。"
        source: inversion
        source_task: null
        delta_lines: 20

