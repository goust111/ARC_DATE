        source: creative
        source_task: null
        delta_lines: 10
      - name: "矩形或线段形精灵（高度规则化）"
        description: "精灵限制为简单的几何形状——实心矩形或单行/列线段。这使对称轴非常明确（矩形天然有多条对称轴），噪声像素成为唯一的不规则性。简化了形状复杂度，但强化了噪声检测的核心任务。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "允许多连通分量精灵"
        description: "精灵可以由多个分离的连通分量组成（如两个对称放置的小块），只要整体满足对称性。噪声可能出现在任何分量上。解题者需理解分离的部分属于同一个逻辑精灵，通过颜色而非连通性来聚合像素。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D9
    name: "噪声比例与数量"
    tag: meta
    current: "噪声像素数为干净精灵像素数的11-33%，绝对上限12个"
    alternatives:
      - name: "极少噪声（每个精灵仅1个噪声像素）"
        description: "每个精灵只有1个噪声像素，打破对称性最小化。解题者需在近乎完美对称的形状中找到唯一的瑕疵像素，考验细节观察力。任务变为'找不同'式的精确定位问题。"
        source: inversion
        source_task: null
        delta_lines: 10
