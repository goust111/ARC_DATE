        delta_lines: 35
      - name: "三层结构：管道-墙-缓冲"
        description: "在管道行和墙行之间增加一行缓冲行(新颜色)。门从1x3扩展为1x3跨越3行。令牌下落时需要穿过缓冲行才到下一管道行（落差变为3行而非2行）。视觉上更复杂的网络结构。"
        source: creative
        source_task: null
        delta_lines: 45

  - id: D7
    name: "单出口约束"
    tag: meta
    current: "每个管段最多有1个向下出口和1个从上入口，保证令牌路径确定性"
    alternatives:
      - name: "允许多出口+选择规则"
        description: "允许管段有2个出口，令牌选择规则为：左侧来的令牌选最左出口，右侧来的选最右出口。打破单出口约束但通过来源方向保持确定性。解题者需要推断方向-出口选择的对应关系。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "出口优先级由颜色编码"
        description: "管段可有多出口，出口处的垂直柱有不同颜色。令牌根据自身属性（来源行的奇偶）选择特定颜色的出口通过。引入了符号指令机制，解题者需解码颜色优先级。"
        source: symbol_instructions
        source_task: null
        delta_lines: 40
      - name: "单入口约束（反转方向）"
        description: "改为保证每个管段最多1个从上方入口，但允许多个出口。令牌始终从唯一入口进入但可能停在有多出口的管段（因为无法决定走哪个）。路径终止条件从'无出口'变为'多出口'。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D8
    name: "洞(hole)的作用"
    tag: meta
    current: "管道行中的黑色单像素洞将管段分割为更短的独立片段，限制令牌水平移动范围"
    alternatives:
      - name: "洞作为额外出口"
        description: "管道行中的洞不再只是分隔符，而是向上/向下的额外通道（因为洞是黑色=墙色，在其上下方可形成开口）。这彻底改变了网络拓扑计算方式。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "可移动的洞"
        description: "洞在输出中会移动位置：与令牌下落同步，每个洞向令牌运动的反方向移动一格。这形成动态网络，解题者需要同时推断令牌运动和洞的运动规则。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "洞由颜色标记替代"
        description: "用彩色像素（如红色）替代黑色洞作为管段分隔符。红色分隔符对某些令牌是透明的（如来自左侧的令牌可穿过，来自右侧的不可以），引入条件性障碍。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D9
    name: "多步处理顺序"
    tag: multi_step
    current: "两步串行：先旋转所有门（in-place修改网格），再模拟所有令牌下落"
    alternatives:
      - name: "逐门处理：开一扇门、落一批令牌"
        description: "门按从上到下顺序逐个打开，每打开一扇门就模拟所有受影响令牌的移动。后面打开的门可能改变前面已下落令牌的路径。解题者需理解渐进式打开的顺序效应。"
        source: multi_step_chain
        source_task: null
        delta_lines: 40
      - name: "令牌按顺序逐个下落"
        description: "所有门先全部打开，然后令牌从上到下、从左到右逐个下落。先落的令牌占据位置后会阻碍后来的令牌（形成新的阻隔物）。引入碰撞/堆叠的交互规则。"
        source: collision_detection
        source_task: 409aa875
        delta_lines: 35
      - name: "三步处理：旋转-下落-清除"
        description: "增加第三步：令牌下落后，检测并清除孤立的垂直柱（上下都没有令牌的柱消失）。这增加了输出与输入的差异，解题者需要理解清除条件。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "反向处理：先移动令牌再关闭门"
        description: "规则反转：输入中门已经打开（垂直柱），输出中令牌先沿路径移动到位，然后门关闭回水平形态。解题者看到的输入输出关系是当前的逆向。"
        source: inversion
        source_task: null
        delta_lines: 20

