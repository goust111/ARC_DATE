task_id: 2b83f449
task_type: transform_in_place
summary: "交替排列的管道-墙壁网格中，门旋转打开形成垂直通道，令牌沿单出口路径下落并在管段末端堆积"

dimensions:
  - id: D1
    name: "门的旋转变换方式"
    tag: transform
    current: "水平1x3门(颜色7)旋转90度变为垂直3x1柱(颜色6)，门原位置变为背景"
    alternatives:
      - name: "门消失而非旋转"
        description: "门直接被擦除（变为背景），不产生垂直柱。这消除了路径中的阻隔物，使管段合并变得更大，令牌下落路径变为多出口选择问题。解题者需要在没有垂直柱作为分隔的情况下推断令牌的目标位置，推理模式完全不同。"
        source: erase
        source_task: 71e489b6
        delta_lines: 20
      - name: "门扩展为十字形"
        description: "水平1x3门旋转后不仅产生垂直3x1柱，还在中心形成十字形(5像素)阻隔物。这进一步分割管段，可能产生更多死路和更短的下落路径，需要解题者识别更复杂的阻隔几何。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "条件性旋转方向"
        description: "门旋转方向取决于门在墙行中的位置：偏左的门顺时针旋转（柱偏右1列），偏右的门逆时针旋转（柱偏左1列）。垂直柱不再在门中心正上方正下方，而是有偏移，改变了路径拓扑。解题者需推断位置与旋转方向的对应关系。"
        source: conditional_rotation
        source_task: 291dc1e1
        delta_lines: 35
      - name: "门反射为水平延伸"
        description: "门不旋转，而是沿水平方向镜像扩展：1x3门变为1x5（左右各延伸1格背景），墙行中形成更宽的通路而非垂直柱。令牌在更宽的水平通道中需要不同的下落逻辑。"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 30

  - id: D2
    name: "门打开后的颜色变化"
    tag: transform
    current: "门颜色(7 teal)变为垂直柱颜色(6 magenta)，即 recolor 从门色到开门色"
    alternatives:
      - name: "保持门色不变"
        description: "旋转后的垂直柱仍使用原门色(7)而非新颜色(6)。视觉上不再有颜色切换的线索，解题者需要纯粹从几何变化推断规则，去掉了颜色变化作为辅助提示。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "多色门对应多色柱"
        description: "不同墙行的门使用不同颜色(如交替使用颜色6和颜色7)，旋转后柱保持对应颜色。解题者需要追踪颜色对应关系，同时这些不同颜色的柱可能在路径规则中有不同含义（如某色柱可穿透）。"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 25
      - name: "颜色编码下落深度"
        description: "垂直柱的颜色由其所在墙行决定（从上到下渐变色）。这为输出增加额外信息编码，解题者需要理解位置到颜色的映射规则。视觉上产生彩色渐变的管道网络。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D3
    name: "令牌移动方式"
    tag: path2
    current: "令牌沿单出口管段垂直下落，每次穿过一面墙（2行），直到无出口可走"
    alternatives:
      - name: "令牌上升而非下落"
        description: "令牌从底部管道行出发向上移动，通过单入口管段上升。这是当前规则的方向反转，解题者需要反向追踪路径。空间推理方向改变，但核心逻辑对称。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "令牌水平移动后再下落"
        description: "令牌先在当前管段内水平移动到出口列正上方，然后下落。移动轨迹在输出中留下痕迹（用特殊颜色标记）。解题者需要同时推断水平运动规则和垂直下落规则，增加了轨迹推理维度。"
        source: path_following
        source_task: null
        delta_lines: 35
      - name: "惯性原则：保持方向直到被迫改变"
        description: "令牌不是简单地向下穿过出口，而是遵循惯性原则：初始方向为向下，遇到阻隔后尝试左转或右转（在管段内水平移动寻找新出口）。类似粒子运动的惯性规则，产生更复杂的路径。"
        source: particle_movement
        source_task: 9bbf930d
        delta_lines: 45
      - name: "令牌弹跳反射"
        description: "令牌下落遇到墙壁不停止，而是反射回上方继续运动，直到遇到开放的柱通道才穿过。引入反射/弹跳物理规则，路径变得更加复杂且需要模拟多步反射。"
        source: path_wrapping
        source_task: 88bcf3b4
        delta_lines: 50

  - id: D4
    name: "令牌堆积规则"
    tag: transform
    current: "令牌在目标管段的远离入口端堆积：入口在左侧则堆到右端，入口在右侧则堆到左端"
    alternatives:
      - name: "靠近入口端堆积"
        description: "完全反转堆积逻辑：令牌在入口同侧堆积而非对面。这是当前规则的取反，改变了输出模式的空间分布，但保持等效的推理难度。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "按到达顺序从左到右排列"
        description: "多个令牌到达同一管段时，按它们原始出发行号（从高到低对应从左到右）排列，而非固定堆积方向。引入排序/消歧规则，解题者需要追踪令牌来源并排序。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "居中堆积"
        description: "令牌到达管段后不靠端而是居中放置。如管段长度为L，k个令牌则从中心向两侧展开。视觉效果截然不同，解题者需要推断居中放置的规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "重力堆积：停在出口正上方"
        description: "令牌不水平移动到管段端点，而是停在它进入管段的那一列（出口列正下方的管道行位置）。这消除了水平移动逻辑，简化了部分推理但改变了输出模式的特征。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D5
    name: "令牌来源位置"
    tag: src
    current: "令牌位于每个非末行管道行的左右两端(col 0 和 col W-1)，每行恰好2个令牌"
    alternatives:
      - name: "仅单侧有令牌"
        description: "每行只有左侧或只有右侧有令牌（由某种规则决定，如奇偶行交替）。减少令牌数量，简化路径数但引入了侧面选择的推理。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "令牌位于管段内部随机位置"
        description: "令牌不固定在边缘，而是在管道行内部某列。需要新的规则确定下落列（如令牌所在列直接向下寻找出口）。这改变了入口侧判断逻辑和堆积方向推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "令牌数量由门数量编码"
        description: "每行的令牌数量等于该行下方墙壁中的门数量（0-3个）。令牌排列在行首连续位置。解题者需要先计数门再确定令牌数，引入了 counting 机制。"
        source: counting
        source_task: 8f215267
        delta_lines: 30
      - name: "令牌颜色区分不同下落规则"
        description: "存在两种颜色的令牌（如绿色和蓝色）：绿色按当前规则下落到远端，蓝色下落到近端。解题者需推断颜色与堆积方向的对应关系，增加了条件分支推理。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D6
    name: "管道网络结构"
    tag: grid_shape
    current: "交替的管道行(背景色)和墙行(黑色)，网格高度=2N+1(N=5-9)，宽度16-19"
    alternatives:
      - name: "垂直管道+水平墙"
        description: "将整个网络旋转90度：管道竖直排列，墙水平排列，令牌从左/右边缘出发水平移动。门是垂直的3x1条，旋转后变为水平1x3柱。解题者面对的几何方向完全不同，但核心逻辑同构。"
