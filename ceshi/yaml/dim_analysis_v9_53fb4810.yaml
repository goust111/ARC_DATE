        description: "源对象为箭头形状而非'+'形状，箭头的朝向直接指示射线方向，无需额外的标记位置推断。简化了方向判断但引入了形状识别的挑战"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 30
      - name: "单像素源点"
        description: "去掉复杂的'+'精灵，源仅为单个彩色像素。标记瓦片直接附着在源像素旁边。极简设计，推理重点完全转向瓦片内容和方向判断"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "不对称色块作为源"
        description: "源精灵不再要求对称性，可以是任意形状的连通色块。标记附着位置更灵活，但也增加了确定'臂端'的难度"
        source: inversion
        source_task: null
        delta_lines: 15

