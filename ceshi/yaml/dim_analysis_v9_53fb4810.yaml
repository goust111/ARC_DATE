task_id: 53fb4810
task_type: move_along_path
summary: "从附着在'+'精灵上的标记瓦片出发，沿远离'+'的方向周期性重复瓦片图案直到网格边界，输入中仅一条射线被预展开作为示例线索"

dimensions:
  - id: D1
    name: "射线路径类型"
    tag: path
    current: "straight_ray — 从标记瓦片出发沿四个基本方向（上下左右）之一做直线射线投射"
    alternatives:
      - name: "对角线射线"
        description: "将射线方向改为45度对角线（左上、右上、左下、右下），瓦片沿对角线方向逐像素平移重复。这大幅改变了空间推理难度，因为解题者需要从对角排列的图案中识别周期性，视觉上也更加新颖"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 30
      - name: "反射弹跳射线"
        description: "射线遇到网格边界时不停止，而是像镜面反射一样改变方向继续传播（类似弹球），直到填满一定长度。增加了多段路径推理，解题者需要理解反射规则和方向变换"
        source: reflection
        source_task: 142ca369
        delta_lines: 40
      - name: "螺旋路径"
        description: "射线从标记出发后按顺时针或逆时针螺旋向内或向外扩展，每碰到边界或已填区域就转90度继续。瓦片沿螺旋路径周期重复，创造出视觉上独特的旋涡状图案"
        source: spiral_path
        source_task: da515329
        delta_lines: 45
      - name: "L形折线路径"
        description: "射线先沿一个方向延伸一段距离（由某种编码决定长度），然后转90度继续延伸至边界。形成L形轨迹，解题者需要同时推断转弯位置和方向"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D2
    name: "射线方向决定机制"
    tag: path
    current: "方向由标记瓦片相对于'+'精灵的附着位置决定——标记在'+'的哪一侧，射线就向那一侧的反方向投射"
    alternatives:
      - name: "由精灵凸出形状决定方向"
        description: "不使用标记位置决定方向，而是由'+'精灵自身形状的不对称部分（如多出的一个像素凸起）指示射线方向。解题者需要仔细分析精灵形状的细微差异来推断方向"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 25
      - name: "颜色编码方向"
        description: "标记瓦片内的颜色排列暗示方向——例如颜色值从小到大排列的方向即为射线方向。解题者需要从颜色序列中解读方向信息"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "向最近网格边界方向投射"
        description: "射线总是朝向距标记瓦片最近的网格边界方向投射，不再依赖标记与'+'的相对位置。这改变了解题者的推理重点，从局部空间关系转向全局距离判断"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D3
    name: "轨迹涂色模式"
    tag: trajectory
    current: "periodic_tiling — 标记瓦片沿射线方向周期性完整重复，形成均匀的平铺图案"
    alternatives:
      - name: "间歇性跳跃平铺"
        description: "瓦片不连续重复，而是每隔N个周期跳过一个（如重复-跳-重复-跳），形成带间隔的周期图案。解题者需要同时推断瓦片内容和跳跃间距"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 15
      - name: "渐变颜色循环"
        description: "每次重复瓦片时，瓦片中的颜色按固定映射表循环替换（如红->蓝->绿->红），使射线呈现渐变的颜色循环效果。解题者需要发现颜色循环规则"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 25
      - name: "镜像交替平铺"
        description: "瓦片在重复时交替进行水平或垂直镜像翻转（正-镜-正-镜），形成对称的条纹图案。视觉上更丰富，解题者需要识别镜像关系"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "单次复制而非周期重复"
        description: "标记瓦片仅复制一次到射线终点（网格边界附近），中间路径保持背景色。这是周期平铺的取反，大幅简化了输出但改变了推理重点"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D4
    name: "源对象形状"
    tag: src
    current: "'+'精灵为小型中心对称色块（3x3十字、3x4胖十字、5x4胖菱形等），bbox至少3x3，左右+上下对称"
    alternatives:
      - name: "矩形框架作为源"
        description: "将'+'精灵替换为空心矩形框架，标记瓦片附着在框架外边缘。框架的开口方向或缺口位置决定射线方向。视觉上完全不同，推理逻辑也需要适应框架结构"
