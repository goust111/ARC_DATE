  - id: D10
    name: "多步处理流程"
    tag: multi_step
    current: "三步流程：Step 1识别图例颜色集合；Step 2找出所有连通分量；Step 3删除包含全部图例颜色的分量"
    alternatives:
      - name: "迭代删除直到无匹配分量"
        description: "删除操作后重新计算连通分量（删除可能导致原本连通的分量断裂为多个子分量），再次检查匹配条件，迭代直到没有新的匹配分量。链式删除产生级联效应，解题者需要模拟多轮迭代。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "先标记后变换：两轮处理"
        description: "第一轮标记所有匹配分量（用特殊颜色标记），第二轮对标记分量执行变换（不一定是删除，可以是重着色等）。两轮处理的中间状态对解题者不可见，需要推断两步流程。"
        source: multi_step
        source_task: 2b83f449
        delta_lines: 25
      - name: "按分量面积从大到小依次处理"
        description: "不是同时删除所有匹配分量，而是按面积从大到小排序依次处理。每删除一个分量后重新计算连通分量和匹配条件。处理顺序影响最终结果，解题者需要推断顺序规则。"
        source: multi_step
        source_task: null
        delta_lines: 30
      - name: "多个图例区域定义多轮筛选"
        description: "网格中存在多个图例区域（如左上角和右下角各一个），每个图例定义不同的颜色集合。按图例顺序依次执行筛选删除。多轮筛选使得分量可能在不同轮次被删除。"
        source: creative
        source_task: null
        delta_lines: 35

