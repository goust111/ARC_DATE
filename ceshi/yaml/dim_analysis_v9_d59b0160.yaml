task_id: d59b0160
task_type: transform_in_place
summary: "左上角绿色边框(颜色3)围成的图例区域定义目标颜色集合，识别网格中所有非背景的4-连通分量，删除包含全部图例颜色的连通分量，保留不包含全部图例颜色的连通分量"

dimensions:
  - id: D1
    name: "颜色匹配条件：全部包含 vs 其他逻辑"
    tag: match_cond
    current: "连通分量必须包含图例中的所有颜色(ALL)才被删除，缺少任何一种图例颜色则保留"
    alternatives:
      - name: "包含任意一种图例颜色即删除"
        description: "将ALL条件放宽为ANY——连通分量只要包含图例颜色中的至少一种就被删除。这是当前规则的取反，大幅改变了筛选的严格程度，解题者需要从示例中推断是ALL还是ANY语义，增加了逻辑推理的歧义性。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "恰好包含图例颜色集合（不多不少）"
        description: "连通分量的颜色集合必须恰好等于图例颜色集合（去掉背景色0后），不能有多余颜色也不能缺少。这比ALL更严格，解题者需要同时检查子集和超集关系，增加了精确匹配的难度。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "不包含任何图例颜色则删除"
        description: "完全反转当前逻辑：删除那些不包含任何图例颜色的连通分量，保留包含至少一种图例颜色的分量。解题者需要发现'保留'而非'删除'与图例的关联，思维方向被反转。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "包含图例颜色数量超过阈值则删除"
        description: "设定阈值（如图例颜色总数的一半向上取整），连通分量包含的图例颜色数量超过阈值才被删除。解题者需要推断阈值而非简单的全有/全无判断，引入了计数比较维度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "多数颜色投票：图例颜色占分量颜色多数则删除"
        description: "如果连通分量中图例颜色的像素数量占该分量总像素数量的多数（>50%），则删除该分量。从颜色种类的集合匹配变为像素级的数量统计，解题者需要估算颜色面积比而非简单枚举颜色种类。"
        source: majority_color
        source_task: 800d221b
        delta_lines: 20

  - id: D2
    name: "核心变换操作：删除 vs 其他处理"
    tag: transform
    current: "匹配的连通分量被删除（所有像素替换为背景色7）"
    alternatives:
      - name: "重着色为指定颜色而非删除"
        description: "匹配的连通分量不被删除，而是整体重着色为图例边框颜色（颜色3/绿色）或图例中某个特定颜色。保留了分量的形状但改变了颜色，解题者需要推断重着色规则而非简单的删除。"
        source: recolor
        source_task: 2b83f449
        delta_lines: 10
      - name: "保留匹配分量、删除不匹配分量（反转保留/删除）"
        description: "当前是删除匹配分量，反转为保留匹配分量并删除其他所有不匹配分量。输出中只剩下包含全部图例颜色的连通分量。这是删除目标的完全反转，视觉效果截然不同。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "匹配分量内部仅保留图例颜色像素"
        description: "不是完全删除匹配分量，而是在分量内部只保留属于图例颜色集合的像素，其余颜色像素变为背景色。这是一种'过滤'操作而非'删除'操作，分量的部分结构被保留。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "匹配分量进行镜像翻转"
        description: "匹配的连通分量不被删除，而是在其外接矩形内进行水平镜像翻转。保留了分量和颜色但改变了空间结构，解题者需要识别哪些分量被翻转了。"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 30
      - name: "匹配分量缩小为单像素标记"
        description: "匹配的连通分量被替换为其质心位置的单个像素（颜色取分量中最常见的颜色），相当于'压缩'操作。从大面积分量变为点标记，视觉变化显著，解题者需要理解压缩规则。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D3
    name: "图例区域的结构与位置"
    tag: symbol_instructions
    current: "图例位于网格左上角，由颜色3（绿色）构成L形边框围成的3x3区域，图例内非背景像素的颜色构成目标颜色集"
    alternatives:
      - name: "图例位于网格边缘的任意位置"
        description: "图例不固定在左上角，而是可以出现在网格的任一边缘（上、下、左、右）。解题者需要先在整个边缘扫描以定位图例，增加了图例查找的难度。图例仍由颜色3边框标识。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "图例为2xN或Nx2调色板条带"
        description: "图例不是方形区域，而是沿网格边缘的窄长条带（2行或2列），颜色直接排列在条带中无需边框。类似dbff022c的调色板读取方式，解题者需要识别条带结构并正确读取颜色序列。"
        source: symbol_instructions
        source_task: dbff022c
        delta_lines: 30
      - name: "图例由分散的单像素标记组成"
        description: "没有集中的图例区域，目标颜色由分散在网格边缘的单个颜色3像素的相邻像素颜色定义。每个边缘上的颜色3像素旁边紧邻一个彩色像素，该颜色加入目标集合。解题者需要收集分散的信息，增加了全局搜索需求。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 40
      - name: "图例为嵌套矩形框架定义颜色层级"
        description: "图例区域由嵌套的颜色矩形框架组成（类似同心圆），从外到内的框架颜色构成目标颜色集合，同时框架的嵌套顺序定义颜色的优先级。解题者需要解析嵌套结构而非简单的平面区域。"
        source: nested_frames
        source_task: 45a5af55
        delta_lines: 35

  - id: D4
    name: "连通分量的连通性定义"
    tag: connected_component
    current: "使用4-连通（上下左右）定义非背景像素的连通分量"
    alternatives:
      - name: "使用8-连通（含对角线）定义连通分量"
        description: "将连通性从4-连通扩展到8-连通（包含4个对角线方向）。这会合并一些在4-连通下分离的分量，改变分量数量和颜色集合，可能导致不同的匹配结果。解题者需要推断连通性的类型。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "同色连通分量而非多色连通分量"
        description: "连通分量仅包含相同颜色的像素（标准的单色连通分量定义），而非当前的跨颜色连通。这会将大的多色分量分裂为多个小的单色分量，每个单色分量只含一种颜色，匹配条件需要跨分量检查。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 25
      - name: "基于外接矩形分组而非连通性"
        description: "不使用连通性分析，而是将重叠或紧密相邻的外接矩形的非背景像素视为同一组。空间上靠近但不直接相连的像素也可能被分为同组。改变了分组逻辑，解题者需要推断基于邻近度而非连通性的分组规则。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "排除颜色0的连通分量"
        description: "在计算连通分量时将颜色0也视为背景色（当前只有颜色7是背景）。颜色0像素不参与连通分量的形成，大的分量可能被颜色0像素分割为多个小分量。解题者需要识别双重背景的规则。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D5
    name: "图例颜色集合的提取方式"
    tag: legend_lookup
    current: "图例区域内所有非背景(7)、非边框(3)颜色的集合作为目标颜色集"
    alternatives:
      - name: "仅使用图例中的特定位置颜色"
        description: "不是提取图例中的所有颜色，而是仅使用特定位置（如对角线位置或角落位置）的颜色作为目标集。图例中的其他颜色是干扰项。解题者需要从空间位置推断哪些颜色有效，增加了位置解码的维度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "图例颜色的出现次数决定匹配阈值"
        description: "图例中每种颜色可以出现多次，出现N次的颜色要求对应连通分量中该颜色至少有N个像素才算匹配。从颜色种类匹配升级为颜色数量匹配，解题者需要计数而非简单集合判断。"
        source: counting
        source_task: 8f215267
        delta_lines: 25
      - name: "图例中的颜色排列定义有序序列"
        description: "图例颜色按特定顺序（如从左到右、从上到下扫描）排列，连通分量不仅要包含所有颜色，还需要颜色在空间上按相同顺序排列（如从左到右依次出现）。引入了空间顺序匹配。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "图例定义颜色对应关系而非颜色集合"
        description: "图例中的颜色按位置形成两两对应关系（如第一行与第二行对应），定义源色-目标色映射。匹配条件变为连通分量中是否包含特定的颜色对（相邻出现的配对颜色）。"
        source: symbol_instructions
        source_task: 9385bd28
        delta_lines: 30

  - id: D6
