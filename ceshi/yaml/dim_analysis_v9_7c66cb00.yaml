  - id: D6
    name: "变换规则：颜色交换逻辑"
    tag: transform
    current: "精灵放入条后执行颜色交换：外层色变为目标条的边框色，内层色变为目标条的填充色"
    alternatives:
      - name: "颜色保持不变"
        description: "精灵放入条后颜色完全不变，保持原始的外层色和内层色。解题者只需推断匹配和放置规则，无需理解颜色变换。简化了推理链但降低了题目的独特性。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "统一重着色为条的边框色"
        description: "精灵的所有颜色（外层+内层）统一重着色为目标条的边框色，变为单色。精灵在条中变为纯色块状嵌入物，丧失内部结构。推理简化但颜色变换规则更易发现。"
        source: recolor
        source_task: 20270e3b
        delta_lines: 10
      - name: "仅外层色变换，内层色消失"
        description: "外层色变为条的边框色（同当前），但内层色区域变为背景色（消失），在条中形成洞。输出中条内的精灵嵌入区出现透明洞，条的填充色从洞中透出。增加视觉解析的复杂性。"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 15
      - name: "颜色交换取决于精灵面积奇偶性"
        description: "精灵总像素数为奇数时执行颜色交换（外层→边框、内层→填充），偶数时不交换（保持原色放入）。解题者需计算像素数并根据奇偶性决定是否变换颜色，增加数值推理维度。"
        source: creative
        source_task: null
        delta_lines: 20

