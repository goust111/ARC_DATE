task_id: 7c66cb00
task_type: move_to_match
summary: "顶部区域的双色精灵（外层色+内层色）通过外层颜色与水平条的填充色匹配，底部对齐放入对应条中，并执行颜色交换：外层色变为条的边框色，内层色变为条的填充色；原始精灵从顶部擦除"

dimensions:
  - id: D1
    name: "匹配条件：精灵与条的配对方式"
    tag: match_cond
    current: "精灵的外层颜色（多数色）等于目标条的填充色：s.outer_color == d.fill_color"
    alternatives:
      - name: "形状匹配替代颜色匹配"
        description: "精灵的外轮廓形状（而非颜色）必须与条中预留的凹槽形状吻合才能配对。条内中部挖出与精灵形状对应的缺口，解题者需进行几何形状比对而非颜色关联。推理从颜色识别转向空间形状匹配，增加视觉推理难度。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 35
      - name: "内层颜色匹配条的边框色"
        description: "配对条件从外层色匹配填充色反转为内层色匹配边框色：s.inner_color == d.border_color。解题者需关注精灵中较少的内层像素而非主色调，反直觉的匹配入口增加推理难度。对于无内层色的精灵需要特殊处理规则（如匹配无边框色区分的条）。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "边缘颜色匹配"
        description: "精灵不再区分内外层，而是取精灵边缘像素（外轮廓第一圈）的颜色与条的边框色匹配：s.edge_color == d.border_color。解题者需识别精灵的轮廓层而非面积多数色，需要更精细的空间感知。"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 25
      - name: "精灵面积排序匹配条的位置排序"
        description: "精灵按总面积从大到小排序，条按从上到下排序，第k大的精灵匹配第k个条。解题者需同时对两组对象排序并建立序数映射，从直接颜色匹配变为间接排序匹配，推理步骤增多。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 25
      - name: "连接器匹配"
        description: "每个精灵底部有一个特殊颜色的单像素'连接器'，每个条的顶部也有对应的连接器像素，精灵与条通过连接器的颜色和列位置匹配配对。解题者需识别微小的连接标记并理解位置对齐关系。"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 30

  - id: D2
    name: "匹配条件：颜色映射方向"
    tag: match_cond
    current: "精灵的外层色（多数色/主色调）作为匹配键，映射到条的填充色"
    alternatives:
      - name: "少数色匹配"
        description: "精灵的内层色（少数色）而非外层色作为匹配键，与条的填充色匹配。解题者需找到精灵中面积更小的颜色区域来判断目标条，与直觉中'看主色'的策略相反，增加注意力分配的难度。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "匹配条的边框色而非填充色"
        description: "精灵的外层色匹配条的边框色（仅在首尾两列出现的颜色）：s.outer_color == d.border_color。条的边框色在视觉上占比很小，解题者需注意条两端的窄边像素。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "双颜色联合匹配"
        description: "配对需同时满足两个条件：精灵外层色等于条的填充色，且精灵内层色等于条的边框色。只有两个条件同时满足才配对成功。增加约束的严格性，解题者需要综合判断两个颜色通道。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D3
    name: "源对象：精灵结构与颜色组成"
    tag: src
    current: "双色精灵：外层色（多数像素）包裹内层色（少数像素，可选），2x2到5x9尺寸，左右对称，在顶部区域互不重叠"
    alternatives:
      - name: "三色精灵"
        description: "精灵包含三种颜色：外层、中间层和内核，每层颜色对应不同条的填充色。精灵的每个颜色区域独立匹配并拆分到各自的目标条中。解题者需识别三层嵌套结构并理解一个精灵拆分到多个目标的规则，增加认知复杂度。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "单色精灵（无内层色）"
        description: "所有精灵都只有一种颜色（纯外层色），没有内层色区域。颜色交换规则简化为外层色变条边框色。解题者只需处理单色匹配和重新着色，推理过程更直接但失去了内层色带来的额外信息。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "精灵有背景色洞"
        description: "精灵内部包含背景色像素形成的'洞'（但整体仍为连通结构），对接放入条中时洞保留，条的原始颜色从洞中透出。解题者需处理非实心精灵的放置，输出中条的填充色通过洞可见，增加视觉复杂度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "不对称精灵"
        description: "取消左右对称约束，精灵可为任意形状（仍需为连通区域）。不对称形状使得精灵的朝向信息更丰富，解题者需判断精灵的原始朝向是否需要调整（如翻转后放入条中）。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "分离式双组件精灵"
        description: "精灵的外层色和内层色不直接相连，而是作为两个分开的小色块放置在顶部区域（但空间邻近）。解题者需先将空间相邻的两个不同色块识别为一个整体精灵，再执行匹配和放置。增加对象分组的推理步骤。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D4
    name: "目标对象：水平条结构"
    tag: dst
    current: "全宽水平条，底部堆叠2-3个，每个条4-8行高，由填充色（内部）和边框色（首尾两列）组成，条间间隔1行背景"
    alternatives:
      - name: "垂直条替代水平条"
        description: "条改为全高垂直条排列在网格右侧或左侧，精灵从空间的另一侧水平对接。条的填充色在中间列、边框色在顶底两行。空间布局旋转90度，解题者需适应水平方向的匹配逻辑。"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "非全宽条（部分宽度）"
        description: "条不再横跨整个网格宽度，而是只占部分列（如宽度10-15），多个条可以在同一行高度水平排列。空间布局更紧凑，解题者需识别条的水平范围和精灵的x位置限制。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "空心矩形框架替代条"
        description: "目标从实心水平条变为空心矩形框架（边缘为边框色，内部为填充色），精灵放入框架内部。框架分散放置而非堆叠在底部。视觉效果从条纹状变为方块状，空间推理从一维变为二维。"
        source: jigsaw_assembly
        source_task: 8698868d
        delta_lines: 40
      - name: "条堆叠在顶部，精灵在底部"
        description: "反转空间布局：条堆叠在网格顶部，精灵放置在底部区域。精灵向上对齐放入条中而非向下。解题者需逆向理解上下关系，对齐方向从底部对齐变为顶部对齐。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D5
