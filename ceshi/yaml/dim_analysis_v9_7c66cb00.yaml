  - id: D14
    name: "多步序列：处理顺序的影响"
    tag: multi_step
    current: "各精灵独立处理，处理顺序不影响最终结果"
    alternatives:
      - name: "有序处理（从上到下的条优先）"
        description: "精灵按匹配条从上到下的顺序依次处理，先处理的精灵已放入条中，后处理精灵若匹配同一条需避让已有精灵的位置。处理顺序影响最终布局，解题者需推断正确的处理次序和避让规则。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "先放置后覆盖"
        description: "所有精灵同时放入条中，当两个精灵在同一条内重叠时，后放置的覆盖先放置的（类似图层叠加）。覆盖顺序由精灵在输入中从左到右的顺序决定。解题者需理解覆盖优先级。"
        source: multi_step
        source_task: 247ef758
