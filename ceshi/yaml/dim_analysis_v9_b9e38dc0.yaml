task_id: b9e38dc0
task_type: move_along_path
summary: "半包围区域内的像素向外洪水填充并沿开口方向辐射，孤立像素沿同方向直线移动至网格边缘并留下背景色轨迹"

dimensions:
  - id: D1
    name: "主路径机制——填充与辐射"
    tag: path
    current: "flood_fill + ray_casting——先洪水填充半包围区域的内部，再沿包围边框的开口方向向外辐射延伸"
    alternatives:
      - name: "仅辐射不填充"
        description: "移除洪水填充步骤，源像素直接沿开口方向向外发射射线而不填充包围区域内部。这简化了路径逻辑，但解题者仍需识别开口方向。视觉上半包围区域保持空心，射线从源点直接射出，形成更简洁的输出。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "填充后向所有开口方向辐射"
        description: "当半包围区域有多个开口时，射线沿每个开口方向分别辐射，而非仅沿主开口方向。解题者需要识别所有开口位置并追踪多条射线，增加了空间分析的复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "边界追踪替代洪水填充"
        description: "不填充半包围区域内部，而是沿区域边界（外围像素的内侧轮廓）涂色，形成描边效果。然后从开口处辐射。这要求解题者区分填充和描边两种模式，推理方式不同。"
        source: boundary_trace
        source_task: 88bcf3b4
        delta_lines: 30
      - name: "同心收缩填充"
        description: "填充不是一次性洪水填充，而是从边界向内逐层收缩填充，每层交替使用源像素颜色和背景色，形成同心环形的填充图案。辐射方向保持不变。视觉上创造了条纹填充效果，解题者需要识别交替涂色模式。"
        source: concentric_frames
        source_task: 13e47133
        delta_lines: 30

  - id: D2
    name: "辅助路径机制——孤立像素移动"
    tag: path
    current: "straight_ray——孤立像素沿与辐射相同的方向直线移动至网格边缘"
    alternatives:
      - name: "孤立像素沿对角线移动"
        description: "孤立像素不沿水平/垂直方向直线移动，而是沿45度对角线移动至网格边缘。对角线方向可由孤立像素相对于半包围区域的位置决定。这改变了路径几何，解题者需要推断对角线方向的决定规则。"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 20
      - name: "孤立像素移动到最近的精灵处停止"
        description: "孤立像素不移动到网格边缘，而是移动到遇到的第一个非背景障碍物（即另一个半包围精灵）处停止。这引入了障碍物感知的停止条件，解题者需要判断路径上是否有阻挡。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 15
      - name: "孤立像素向辐射反方向移动"
        description: "取反辐射方向：孤立像素沿与主辐射方向相反的方向移动至网格边缘。这创造了视觉上的对称分散效果，解题者需要理解方向取反规则。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "孤立像素沿重力方向下落"
        description: "孤立像素不随辐射方向移动，而是统一沿重力方向（向下）移动至网格底部或遇到障碍物。方向固定为下方，解题者需要识别重力规则而非从辐射方向推断。"
        source: gravity
        source_task: 28a6681f
        delta_lines: 15

  - id: D3
    name: "辐射轨迹涂色"
    tag: trajectory
    current: "辐射射线使用源像素颜色连续涂色；孤立像素移动后轨迹变为背景色"
    alternatives:
      - name: "辐射轨迹使用周期性颜色图案"
        description: "辐射射线不使用单一颜色，而是按周期交替涂色（如AABB或AB交替），颜色来源于半包围区域的边框颜色和源像素颜色的交替。视觉上更丰富，解题者需要识别颜色周期规律。"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 15
      - name: "辐射轨迹间歇涂色"
        description: "辐射射线每隔一格涂色，形成虚线而非实线。间隔数可以由半包围区域开口宽度决定。这在视觉上产生明显不同的效果，且解题者需要注意间隔规律。"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 10
      - name: "辐射轨迹长度等于填充面积"
        description: "辐射射线的长度（涂色像素数）恰好等于填充区域的面积。这引入了数值约束，解题者需要计算填充面积来预测射线长度，而非射线延伸到网格边缘。"
        source: length_preservation
        source_task: 88bcf3b4
        delta_lines: 20
      - name: "孤立像素移动轨迹涂为精灵边框颜色"
        description: "孤立像素移动后留下的轨迹不是背景色，而是其对应半包围精灵的边框颜色。这增加了颜色对应关系的推理——解题者需要确定每个孤立像素与哪个精灵关联。"
        source: color_pairing
        source_task: 16de56c4
        delta_lines: 15

  - id: D4
    name: "源对象——内部触发像素"
    tag: src
    current: "半包围区域内最内层的同色连通像素作为洪水填充和辐射的触发源"
    alternatives:
      - name: "边缘控制像素作为触发源"
        description: "网格边缘的单色控制像素触发对应半包围区域的填充和辐射，而非区域内部的像素。解题者需要从控制像素的位置或颜色推断它控制哪个区域，引入了远距离对应关系。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 25
      - name: "多个内部像素触发多次填充"
        description: "半包围区域内可能有多个不同颜色的像素，每个触发独立的填充和辐射，辐射方向和颜色各不相同。解题者需要处理同一区域内多源并行的情况。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "触发源为区域内最大色块"
        description: "当区域内有多个像素时，只有像素数量最多的连通色块触发填充和辐射，其他小色块被忽略。这引入了大小比较的推理，解题者需要计数来确定触发源。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "精灵边框上的特殊标记像素"
        description: "触发源不在区域内部，而是半包围边框上一个特殊颜色的标记像素。填充方向从标记点向内扩散，辐射方向从开口向外。解题者需要在边框上定位标记。"
        source: touch_point_connection
        source_task: a6f40cea
        delta_lines: 20

  - id: D5
    name: "目标/终止条件"
    tag: dst
    current: "辐射射线延伸到网格边缘终止；孤立像素同样移动到网格边缘"
    alternatives:
      - name: "辐射到遇到另一个精灵时停止"
        description: "辐射射线遇到另一个半包围精灵的边框时终止，而非延伸到网格边缘。精灵之间的距离决定了射线长度。解题者需要考虑空间中其他对象的位置。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 15
      - name: "辐射距离由内部像素数量编码"
        description: "辐射射线的长度等于半包围区域内部源像素的数量（或某个倍数）。这将空间终止条件替换为数值约束，解题者需要计数像素来确定射线延伸多远。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 20
      - name: "辐射到遇到同色射线终止"
        description: "当两个不同精灵的辐射射线在路径上相遇时，两条射线都在交汇点终止。这引入了射线间的交互和顺序依赖关系，增加了动态推理难度。"
        source: collision_detection
        source_task: e12f9a14
        delta_lines: 25
      - name: "辐射到填充指定目标区域"
        description: "网格中存在指定的目标空白区域，辐射射线延伸到该区域并填充之，而非简单延伸到边缘。解题者需要识别目标区域并理解射线如何填充它。"
        source: cavity_fill
        source_task: 5dbc8537
        delta_lines: 20

  - id: D6
    name: "半包围精灵的形状结构"
    tag: obstacle
    current: "半包围区域由U形或C形边框围成，有一个明确的开口方向（上/下/左/右）"
    alternatives:
      - name: "多开口的围栏（两个或更多开口）"
        description: "包围区域的边框有两个或更多开口，射线从每个开口分别辐射。解题者需要识别所有开口位置并分别处理每条辐射射线。增加了空间分析和多路径推理的复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "对角线开口方向"
        description: "半包围区域的开口不在正交方向（上下左右），而在45度对角线方向（如左上角缺口）。辐射沿对角线方向延伸。这改变了所有方向的几何推理，使路径追踪更具挑战性。"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 30
      - name: "包围区域带有瓶颈通道"
        description: "半包围区域不是简单的一面开口，而是通过一个狭窄通道（1-2像素宽）连接到外部。辐射必须先通过通道再向外扩散。解题者需要理解瓶颈结构的几何约束。"
        source: corridor_following
        source_task: 332f06d7
        delta_lines: 25
      - name: "完全包围但有可破坏的薄壁"
        description: "区域完全被包围，但有一面墙壁仅为1像素厚（其他面更厚）。填充操作'突破'最薄的墙壁并从该方向辐射。解题者需要比较墙壁厚度来确定辐射方向。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D7
    name: "障碍物阻挡机制"
    tag: obstacle
    current: "obstacle_blocking——第二步变换中，第一步的精灵（含填充后的区域）作为障碍物阻挡孤立像素的直线路径"
    alternatives:
      - name: "障碍物导致路径偏转"
        description: "孤立像素遇到精灵障碍物时不是被阻挡停止，而是绕过障碍物（沿障碍物边缘移动后继续原方向）。这引入了绕行路径的推理，解题者需要确定绕行路线。"
        source: pathfinding
        source_task: cb2d8a2c
        delta_lines: 25
      - name: "障碍物导致反射"
        description: "孤立像素遇到精灵障碍物时像光线一样反射——垂直撞击则水平偏转，水平撞击则垂直偏转。反射后继续移动至网格边缘。增加了弹射路径的推理。"
        source: reflection
        source_task: 142ca369
        delta_lines: 20
      - name: "无障碍物交互（穿透）"
        description: "取消障碍物阻挡机制，孤立像素直接穿过其他精灵继续前进至网格边缘。这简化了逻辑但在视觉上孤立像素轨迹会覆盖精灵像素，解题者需要理解层叠关系。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "障碍物吸收孤立像素并变色"
        description: "孤立像素到达障碍精灵时被吸收，障碍精灵的填充区域变为孤立像素的颜色。这是一种颜色传递机制，解题者需要追踪颜色流动的方向和效果。"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 20

  - id: D8
    name: "变换——填充后精灵的变化"
    tag: transform
    current: "flood_fill变换——半包围区域内部被源像素颜色填满，源像素扩展为整个区域的填充色"
    alternatives:
      - name: "填充后精灵边框被擦除"
        description: "洪水填充完成后，半包围区域的边框像素被擦除为背景色，只保留填充区域和辐射射线。视觉上精灵的骨架消失只剩内容。解题者需要理解先填充再擦除的两步变换。"
        source: erase
        source_task: 3dc255db
        delta_lines: 15
      - name: "填充后精灵边框变色"
        description: "洪水填充完成后，半包围区域的边框颜色变为源像素颜色（或另一种映射颜色），而填充区域保持原边框颜色。这是颜色角色互换，创造了内外颜色反转的视觉效果。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 15
      - name: "精灵边框扩展包围辐射射线"
        description: "填充完成后，精灵的边框沿辐射方向延伸，形成围绕射线的管道状结构。射线被'封装'在管道内。解题者需要理解射线和边框同步延伸的关系。"
        source: frame_completion
        source_task: a6f40cea
        delta_lines: 25
      - name: "填充后源像素消失"
        description: "洪水填充后，原始的源像素（触发点）被擦除为背景色，仅保留区域填充和射线辐射。解题者需要注意源像素在输出中不再可见，这是一个细微但关键的差异。"
        source: erase
        source_task: 3dc255db
        delta_lines: 10

  - id: D9
    name: "输出网格形状"
    tag: grid_shape
    current: "same——输出网格与输入尺寸完全相同"
    alternatives:
      - name: "裁剪到精灵活动区域"
        description: "输出网格裁剪为包含所有精灵及其辐射射线的最小外接矩形，移除四周空白。解题者需要不仅理解变换逻辑，还需正确计算裁剪边界。"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 15
      - name: "仅输出辐射射线区域"
        description: "输出仅保留辐射射线所在的行或列（裁剪为单行/单列或窄条带），精灵本身不在输出中。这是极度裁剪的变体，测试解题者能否预测射线的精确位置。"
        source: crop
        source_task: a6f40cea
        delta_lines: 20
      - name: "输出按精灵数量分区"
        description: "输出网格被分为与精灵数量相等的子区域，每个子区域独立展示对应精灵的填充和辐射结果。子区域用分隔线隔开。解题者需要理解分区对应关系。"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 25

  - id: D10
    name: "多步处理顺序"
    tag: multi_step
    current: "两步处理：第一步填充半包围区域并辐射，第二步孤立像素直线移动（第一步结果作为障碍物影响第二步）"
    alternatives:
      - name: "先移动孤立像素再填充辐射"
        description: "反转两步的处理顺序：先让孤立像素移动到网格边缘，然后再填充半包围区域并辐射。由于顺序不同，孤立像素不受精灵阻挡。解题者需要推断正确的步骤顺序。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "逐个精灵串行处理"
        description: "多个精灵不是并行处理，而是按距离网格边缘的远近依次处理。先处理的精灵填充和辐射的结果作为后续精灵的障碍物。处理顺序显著影响最终结果。"
        source: multi_step
        source_task: 1ae2feb7
        delta_lines: 20
      - name: "三步处理：填充、辐射、移动分离"
        description: "将当前的两步拆为三步：第一步仅填充所有半包围区域（不辐射），第二步从所有填充区域向开口辐射，第三步移动孤立像素。每一步的结果影响下一步。增加了推理的层次性。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "链式反应：辐射触发相邻精灵"
        description: "第一个精灵的辐射射线如果到达另一个精灵的开口处，则触发该精灵的填充和辐射，形成连锁反应。处理从某个起始精灵开始传播。解题者需要追踪整个连锁传播路径。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 35

  - id: D11
    name: "孤立像素与精灵的关联规则"
    tag: meta
    current: "孤立像素位于半包围区域的瓶颈（开口）外侧，沿辐射方向排列，隐式关联到最近的精灵"
    alternatives:
      - name: "颜色匹配关联"
        description: "孤立像素通过颜色与精灵关联——孤立像素颜色与精灵内源像素颜色相同时才建立关联。不同颜色的孤立像素对应不同精灵。解题者需要通过颜色配对来确定关联关系。"
        source: color_pairing
        source_task: 16de56c4
        delta_lines: 15
      - name: "空间最近邻关联"
        description: "孤立像素与曼哈顿距离最近的半包围精灵关联，不限于开口方向。这使关联规则更灵活但需要解题者进行距离计算。位于两个精灵等距位置的孤立像素可增加歧义推理。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "无孤立像素（单步变换）"
        description: "完全移除孤立像素和第二步变换，只保留半包围区域的填充和辐射。这大幅简化了任务，但作为基础变体有助于理解核心机制。"
        source: inversion
        source_task: null
        delta_lines: -15
      - name: "孤立像素在开口方向的延长线上"
        description: "孤立像素必须严格位于其关联精灵开口方向的延长线上（同行或同列），而非仅在开口外侧附近。这约束了孤立像素的放置位置，使关联关系更确定但生成约束更严格。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D12
    name: "精灵数量与空间排列"
    tag: meta
    current: "多个半包围精灵分布在网格中，各自独立，开口方向可能不同"
    alternatives:
      - name: "所有精灵开口方向相同"
        description: "约束所有半包围精灵的开口朝向同一方向（如全部向右开口）。辐射射线平行排列，创造统一的视觉方向性。解题者只需推断一次方向规则而非逐个判断。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "精灵排列成规则网格"
        description: "半包围精灵不是随机分布，而是排列在规则的网格位置上（如3x3阵列）。开口方向按行列交替变化。这增加了空间结构的规律性，解题者需要理解位置与方向的对应模式。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "精灵两两成对且开口相对"
        description: "精灵成对出现，每对中两个精灵开口相对（如一个向左一个向右）。辐射射线在中间区域相遇或交叉。解题者需要理解配对关系和射线交互规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "嵌套精灵（精灵内含精灵）"
        description: "大精灵的半包围区域内包含较小的半包围精灵。需要从最内层向外依次处理填充和辐射。增加了层次结构的推理需求，解题者需要识别嵌套关系并确定处理顺序。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D13
    name: "开口方向的决定规则"
    tag: meta
    current: "开口方向由半包围边框的缺失面自然决定——边框哪一面不完整，射线就向那个方向辐射"
    alternatives:
      - name: "开口方向由内部像素位置编码"
        description: "半包围区域可能有多个薄弱面，开口方向由内部源像素相对于区域中心的偏移方向决定——像素偏左则向左辐射，偏上则向上辐射。解题者需要分析像素的精确位置来推断方向。"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 20
      - name: "开口方向由精灵边框颜色编码"
        description: "引入符号编码：不同颜色的边框面表示不同含义——例如红色面表示开口方向，蓝色面表示封闭面。解题者需要从示例中推断颜色-方向的映射关系。"
        source: symbol_instructions
        source_task: e87109e9
        delta_lines: 25
      - name: "开口方向由外部标记指示"
        description: "在精灵外部放置箭头状标记像素来显式指示辐射方向，而非由边框结构隐式决定。标记像素的排列方向（如两个像素的连线方向）指向辐射方向。解题者需要识别并解读标记。"
        source: marker_axis
        source_task: 7ed72f31
        delta_lines: 20

  - id: D14
    name: "辐射射线宽度"
    tag: trajectory
    current: "射线为1像素宽的单线，沿开口方向延伸"
    alternatives:
      - name: "射线宽度等于开口宽度"
        description: "辐射射线的宽度与半包围区域的开口宽度相同——如果开口为3像素宽，射线也为3像素宽。这创造了扇形或带状的辐射效果，解题者需要测量开口宽度来预测射线形状。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "射线逐渐扩展（锥形辐射）"
        description: "射线从1像素宽开始，每延伸若干格宽度增加1像素，形成锥形扩散。扩展速率可以是固定的（如每3格加宽1像素）。视觉上像光束扩散，增加了几何推理的复杂性。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "粗射线（固定3像素宽）"
        description: "所有辐射射线统一为3像素宽，无论开口大小。这是对射线形态的简单变更，视觉效果更粗壮，但解题者还需额外确定3像素的对齐方式（居中于开口还是偏移）。"
        source: BFS_activation
        source_task: 5961cc34
        delta_lines: 15

  - id: D15
    name: "填充颜色规则"
    tag: transform
    current: "洪水填充使用源像素（内部像素）的颜色填满整个半包围区域"
    alternatives:
      - name: "填充使用边框颜色"
        description: "洪水填充不使用源像素颜色，而是使用半包围边框的颜色来填充内部。源像素颜色仅用于辐射射线。这创造了内部和射线颜色不同的视觉效果，解题者需要区分两种颜色来源。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "棋盘格填充"
        description: "半包围区域内部不用单色填充，而是用源像素颜色和背景色交替形成棋盘格图案。辐射射线保持源像素颜色。视觉上非常独特，解题者需要理解棋盘格填充模式。"
        source: alternating_pattern
        source_task: 13e47133
