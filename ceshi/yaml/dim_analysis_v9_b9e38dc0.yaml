        source: creative
        source_task: null
        delta_lines: 20
      - name: "矩形框架缺一边"
        description: "半包围结构为标准矩形框架去掉完整的一条边，形成明确的三面封闭、一面完全开放的结构。比U形更规则，开口方向更明显，但填充和辐射的几何更标准化。"
        source: frame_completion
        source_task: a6f40cea
