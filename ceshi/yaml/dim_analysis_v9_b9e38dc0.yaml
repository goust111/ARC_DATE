        source: creative
        source_task: null
        delta_lines: 25
      - name: "多色边框标识不同功能面"
        description: "半包围边框的不同边使用不同颜色，每种颜色代表不同的功能（如红色边=反射面，蓝色边=吸收面）。辐射射线遇到不同颜色的边框有不同行为。增加了颜色功能编码的推理。"
        source: symbol_instructions
        source_task: e87109e9
        delta_lines: 25

  - id: D18
