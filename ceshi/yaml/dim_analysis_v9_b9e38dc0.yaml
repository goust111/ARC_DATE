      - name: "渐变距离编码填充"
        description: "填充颜色基于每个像素到源像素的距离——距离不同使用不同颜色（可从预定义调色板中选择）。这创造了从中心向外的距离热力图效果，解题者需要理解距离-颜色映射。"
        source: distance_constraint
        source_task: cb2d8a2c
        delta_lines: 25

  - id: D16
    name: "孤立像素数量与精灵的对应关系"
    tag: meta
    current: "每个精灵对应一个孤立像素，1:1映射关系"
    alternatives:
      - name: "一个精灵对应多个孤立像素"
        description: "每个精灵可能有多个关联的孤立像素，分布在开口方向的不同距离上。所有关联像素同时沿辐射方向移动，形成多条平行轨迹。解题者需要确定多对多的映射关系。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "部分精灵没有孤立像素"
        description: "并非每个精灵都有对应的孤立像素——有些精灵只执行填充和辐射，没有第二步的像素移动。解题者需要判断哪些精灵有关联像素、哪些没有，增加了条件判断的推理。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "孤立像素数量编码射线长度"
        description: "每个精灵关联的孤立像素数量决定辐射射线的长度——如果有3个孤立像素，射线延伸3格。这将像素计数与射线行为关联起来，解题者需要计数来推断射线参数。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 20

  - id: D17
    name: "精灵边框形态多样性"
