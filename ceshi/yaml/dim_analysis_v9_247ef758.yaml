task_id: 247ef758
task_type: move_to_match
summary: "将左侧精灵按颜色匹配右侧框架边缘标记，在行标记×列标记的笛卡尔积位置居中印刻，底部优先覆盖顶部"

dimensions:
  - id: D1
    name: "匹配条件：边缘颜色匹配"
    tag: match_cond
    current: "精灵颜色 == 框架左/右边缘行标记颜色 且 == 上/下边缘列标记颜色（双对边镜像匹配），只有两对对边同时存在该颜色时才构成有效目标"
    alternatives:
      - name: "形状嵌合匹配"
        description: "框架边缘不再用颜色标记，而是在边缘开出与精灵外接矩形形状互补的凹口。精灵需找到形状刚好嵌入的凹口位置来确定目标行/列。推理从颜色识别变为几何互补判断，难度显著提升。"
        source: shape_match
        source_task: "16b78196"
        delta_lines: 40
      - name: "颜色+尺寸双重匹配"
        description: "框架边缘标记不仅有颜色，还有长度（连续同色段长度）。精灵需同时匹配颜色和自身外接矩形的对应维度尺寸。增加数值推理层，仅靠颜色不足以确定目标。"
        source: color_match
        source_task: "2c181942"
        delta_lines: 25
      - name: "单对边匹配（仅行或仅列需双边确认）"
        description: "取反当前双对边镜像规则：行标记只需左边缘有该颜色即可（不要求右边缘也有），列标记仍需上下双边。不对称的匹配条件要求解题者分别推理两个维度的规则差异。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "连接器匹配"
        description: "框架边缘放置小型2-3像素连接器图案（如L形、线段）替代单像素标记。精灵需匹配连接器的颜色和形状才能确定目标位置。从单像素颜色比较升级为小图案匹配，增加感知复杂度。"
        source: connector_match
        source_task: "20270e3b"
        delta_lines: 30
      - name: "模运算索引匹配"
        description: "精灵颜色不直接出现在框架边缘，而是框架边缘有一组编号标记。精灵的颜色值对N取模后得到索引，索引对应框架边缘的第几个标记位置。引入间接数值映射推理。"
        source: modular_indexing
        source_task: "65b59efc"
        delta_lines: 25

  - id: D2
    name: "源对象：精灵类型与属性"
    tag: src
    current: "左侧窄条中2-3个可移动精灵（8连通单色色块，3-9像素，外接矩形≤5x5）加0-1个干扰精灵，颜色各不相同"
    alternatives:
      - name: "多色精灵"
        description: "精灵由两种颜色组成而非单色。匹配时使用主色（占多数的颜色）与框架标记比较，印刻时保留完整多色图案。解题者需先判断主色再执行匹配，增加颜色分析步骤。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "空心精灵（带洞的色块）"
        description: "精灵不再是实心8连通块，而是可包含内部空洞（背景色像素被精灵像素包围）。外接矩形仍≤5x5但有效像素更少。视觉上更复杂，印刻时洞的位置也需正确保留。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "精灵分布在框架四周而非仅左侧"
        description: "取反当前'精灵仅在左侧条带'的空间约束：精灵可能分布在框架的上方、下方或右侧等任意位置。解题者需在整个网格中搜索精灵而非仅关注固定区域。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "对角标记像素对作为精灵"
        description: "源对象不是色块而是对角像素对（两个同色像素位于矩形对角）。印刻时填充该矩形区域。从形状识别变为几何关系推理。"
        source: diagonal_markers
        source_task: "9385bd28"
        delta_lines: 30

  - id: D3
    name: "目标位置：框架与标记结构"
    tag: dst
    current: "框架右侧为矩形框（单色边框+内部背景），边缘标记位于边框像素上，目标为行标记×列标记的笛卡尔积中心点，精灵印刻限制在框架内部"
    alternatives:
      - name: "标记在内部而非边缘"
        description: "取反标记位置：标记不在框架边缘而是在框架内部特定行/列上以小十字或点的形式出现。精灵居中印刻到标记的交叉点。解题者需在内部而非边缘寻找标记，改变注意力分配。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "多个独立框架"
        description: "网格中有2-3个独立的矩形框架（不同基色），每个精灵根据颜色匹配进入对应框架。增加框架-精灵分配的推理，同时每个框架可能有不同数量的标记。"
        source: jigsaw_assembly
        source_task: "8698868d"
        delta_lines: 35
      - name: "框架边缘非对称标记"
        description: "取反当前'上下边缘镜像、左右边缘镜像'的对称规则：上边缘和下边缘的标记颜色可以不同，目标行由左右边缘确定，目标列由上边缘和下边缘各自独立确定。增加标记解析复杂度。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "目标为边缘标记的投影交点"
        description: "框架边缘标记不直接给出行/列坐标，而是标记之间连线的交点才是目标位置。类似投影几何，解题者需计算交点而非简单读取坐标。"
        source: projection
        source_task: "7666fa5d"
        delta_lines: 30

  - id: D4
    name: "变换：印刻与擦除行为"
    tag: transform
    current: "擦除左侧原始精灵，在目标位置居中印刻精灵图案，像素超出框架内部时裁剪（clipping）"
    alternatives:
      - name: "印刻时重着色"
        description: "精灵印刻到目标位置时不保留原色，而是重着色为框架基色或目标位置附近标记的颜色。解题者需推断颜色变换规则而非简单的位置搬移。"
        source: recolor
        source_task: "20270e3b"
        delta_lines: 15
      - name: "印刻时旋转对齐"
        description: "精灵在印刻到目标位置时需根据最近的边缘标记方向旋转（如标记在左边缘则旋转90度）。同一精灵在不同笛卡尔积目标点可能有不同旋转角度。增加空间变换推理。"
        source: rotation
        source_task: "2c181942"
        delta_lines: 25
      - name: "不擦除原始精灵（保留源）"
        description: "当前已标注为 keep_source 但实际 solver 会擦除原始位置。若变为真正保留源（左侧精灵不被擦除），输出同时显示原始位置和目标位置的精灵。解题者需识别'复制'而非'移动'的模式。"
        source: keep_source
        source_task: null
        delta_lines: 5
      - name: "印刻后填充外接矩形"
        description: "精灵印刻到目标后，将精灵的整个外接矩形区域（包括精灵未覆盖的背景像素）都填充为精灵颜色。从稀疏图案变为实心矩形，视觉差异明显。"
        source: creative
        source_task: null
        delta_lines: 12

  - id: D5
    name: "轨迹/源保留行为"
    tag: trajectory
    current: "精灵从左侧条带被擦除（disappear），仅在目标位置出现"
    alternatives:
      - name: "保留源并添加连线轨迹"
        description: "原始精灵保留在左侧条带，同时从精灵中心到每个目标位置画一条同色直线作为连接轨迹。输出中可视化精灵到目标的关联路径，增加轨迹推理。"
        source: continuous_trail
        source_task: "8b9c3697"
        delta_lines: 25
      - name: "移动轨迹用不同颜色标记"
        description: "精灵被擦除，但从原位置到目标位置的移动路径上的像素用分隔线颜色涂色。解题者需理解运动方向和路径规则。"
        source: continuous_trail
        source_task: "8b9c3697"
        delta_lines: 30
      - name: "源保留且目标位置用互补色"
        description: "左侧精灵保留原色，目标位置的印刻使用颜色互补（如原色为红则目标为蓝）。解题者需推断颜色映射规则以及源保留模式。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D6
    name: "输出网格形状"
    tag: grid_shape
    current: "输出与输入同尺寸，整个网格保留（包括左侧条带、分隔线、框架）"
    alternatives:
      - name: "紧凑裁剪至框架内部"
        description: "输出仅保留框架内部区域（裁掉左侧条带、分隔线和框架边缘）。输出尺寸小于输入，解题者需推断裁剪边界。改变输出形态认知。"
        source: tight_crop
        source_task: "20270e3b"
        delta_lines: 10
      - name: "裁剪至框架（含边缘）"
        description: "输出裁剪至整个框架矩形（包含边缘标记），但去掉左侧条带和分隔线。保留边缘标记有助于验证但改变了输出结构。"
        source: crop
        source_task: "a251c730"
        delta_lines: 8
      - name: "框架内部按标记分割输出多个子网格"
        description: "根据行/列标记将框架内部分割为多个子区域，每个子区域独立输出为一个小网格，按网格排列。需要结合 multi_step 逻辑处理分割。"
        source: frame_separation
        source_task: "5545f144"
        delta_lines: 30

  - id: D7
    name: "多步序列：覆盖顺序"
    tag: multi_step
    current: "按精灵在左侧条带中的位置从下到上排序（底部先印刻、顶部后印刻覆盖之前的）"
    alternatives:
      - name: "从上到下排序（取反当前顺序）"
        description: "取反覆盖顺序：顶部精灵先印刻，底部精灵后印刻覆盖。当精灵目标位置重叠时产生不同结果。解题者需从示例中推断相反的优先级规则。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "按精灵面积排序（小优先或大优先）"
        description: "覆盖顺序不由空间位置决定，而由精灵像素数量决定（如面积最小的最先印刻，最大的最后覆盖）。解题者需计算面积而非依赖空间位置。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "按颜色值排序"
        description: "覆盖顺序由精灵颜色的数值大小决定（颜色值小的先印刻，大的后覆盖）。但人类看到的是可视化颜色而非数字——改为按色调在彩虹中的顺序（红→橙→黄→绿→蓝→紫）排序。需从示例中推断色彩排序规则。"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "按标记数量排序"
        description: "拥有更多目标位置（更多行标记×列标记）的精灵先印刻，目标位置少的后覆盖。将覆盖优先级与匹配数量关联，增加推理维度。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D8
    name: "分隔线结构"
    tag: meta
    current: "单列均匀非背景色分隔线，贯穿整个网格高度，将左侧精灵区与右侧框架区分开"
    alternatives:
      - name: "无分隔线"
        description: "取消分隔线，精灵区与框架之间仅有背景色间距。解题者需通过框架结构自行判断区域分界，增加区域分割推理。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "分隔线为多列宽"
        description: "分隔线从1列变为2-3列宽。视觉上更醒目但改变了空间布局计算。解题者需正确识别分隔线宽度以定位精灵区域。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "分隔线为水平方向（上下分布）"
        description: "取反分隔方向：精灵区在上方，框架在下方，由水平分隔行分开。整体布局从左右变为上下，改变空间推理方向。"
        source: inversion
        source_task: null
        delta_lines: 20

  - id: D9
    name: "干扰精灵"
    tag: meta
    current: "0-1个干扰精灵，颜色不出现在框架边缘标记中，输出中保持不变"
    alternatives:
      - name: "无干扰精灵"
        description: "取反：所有左侧精灵都是可移动的，没有干扰项。简化了精灵筛选步骤，但降低了区分信号与噪声的推理需求。"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "干扰精灵颜色出现在部分边缘"
        description: "干扰精灵的颜色出现在框架的单侧边缘（如仅左边缘有但右边缘没有），不满足双对边条件所以仍是干扰项。但视觉上更容易混淆，解题者必须严格验证双对边条件。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "干扰精灵在输出中被删除"
        description: "取反当前'干扰精灵不变'规则：干扰精灵在输出中被擦除为背景色。解题者需推断'不匹配则删除'的规则，而非'不匹配则保留'。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "多个干扰精灵（2-3个）"
        description: "增加干扰精灵数量到2-3个，使左侧条带更拥挤。解题者需从更多候选中正确识别可移动精灵，增加筛选负担。"
        source: creative
        source_task: null
        delta_lines: 5

  - id: D10
    name: "框架边缘额外非匹配颜色"
    tag: meta
    current: "框架边缘可能包含不属于任何精灵的额外颜色（spec 中标注为 observed），这些颜色不构成有效标记"
    alternatives:
      - name: "边缘无额外颜色（纯净边缘）"
        description: "取反：框架边缘仅包含基色和有效标记色，无任何干扰颜色。简化边缘解析但降低噪声过滤推理需求。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "额外颜色仅出现在单侧边缘"
        description: "额外颜色有意设置为仅出现在单侧边缘（如仅上边缘有但下边缘没有），模拟干扰精灵在边缘标记层面的等价物。解题者需严格执行双边确认逻辑。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "额外颜色与某个精灵色相同但位置不对称"
        description: "边缘包含与可移动精灵同色的标记，但仅在单侧（不镜像），构成'假标记'。解题者不能仅靠颜色匹配，还需验证双对边对称，增加验证步骤。"
        source: creative
        source_task: null
        delta_lines: 8

  - id: D11
    name: "笛卡尔积目标模式"
    tag: meta
    current: "每个精灵的目标位置是其行标记×列标记的完整笛卡尔积（如2行×2列=4个目标位置）"
    alternatives:
      - name: "仅对角目标（非完整笛卡尔积）"
        description: "取反完整笛卡尔积：目标仅为行标记和列标记的配对对角位置（第1行配第1列，第2行配第2列），而非所有组合。从4个目标变为2个目标。解题者需推断选择规则。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "单一目标（行列标记的中位数交点）"
        description: "当有多个行/列标记时，目标不是笛卡尔积的所有交点，而是取行标记的中位数和列标记的中位数作为唯一交点。从多目标变为单目标，改变复制逻辑。"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "加权笛卡尔积（标记强度）"
        description: "边缘标记可以有1-3个像素宽度表示'强度'。精灵在高强度标记交点处印刻更大（缩放），低强度处印刻原始大小。引入标记属性到印刻变换的映射。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D12
    name: "精灵印刻对齐方式"
    tag: meta
    current: "精灵以自身中心点（外接矩形中心）对齐到目标位置"
    alternatives:
      - name: "精灵以左上角对齐到目标位置"
        description: "取反居中对齐：精灵的左上角（而非中心）放置在标记交点。偶数尺寸精灵不再有模糊的中心点问题，但印刻偏移量改变。解题者需推断对齐锚点。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "精灵以重心对齐"
        description: "精灵不以外接矩形中心而是以像素重心（所有非背景像素坐标的平均值）对齐。对于不规则精灵，重心与外接矩形中心可能不同，产生微妙偏移。需要精确计算能力。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "锚点由标记颜色编码"
        description: "不同位置的边缘标记使用同色但不同亮度/形状来编码锚点类型（如单像素标记=居中对齐，双像素标记=左上对齐）。解题者需解码标记属性来确定对齐规则。"
        source: anchor_matching
        source_task: "b10624e5"
        delta_lines: 20

  - id: D13
    name: "像素裁剪行为"
    tag: meta
    current: "精灵印刻时超出框架内部边界的像素被裁剪（不绘制）"
    alternatives:
      - name: "超出部分环绕到对面"
        description: "取反裁剪：超出框架右边界的像素从左边界重新进入（环面拓扑），上下同理。精灵可能'跨越'框架边界出现在对侧。增加空间推理的环绕维度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "超出部分绘制在框架边缘上"
        description: "超出内部的像素不被丢弃，而是覆盖框架边缘（边框）的对应像素。输出中框架边缘可能被精灵颜色部分覆盖，改变框架的视觉完整性。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "禁止裁剪（标记位置保证完整印刻）"
        description: "生成时保证所有标记位置都能完整容纳精灵（无需裁剪）。简化输出逻辑但限制标记可选位置范围，改变生成约束。"
        source: inversion
        source_task: null
        delta_lines: 8

  - id: D14
    name: "框架基色与标记的区分方式"
    tag: meta
