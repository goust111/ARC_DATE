        source: creative
        source_task: null
        delta_lines: 25

  - id: D7
    name: "叶子像素修剪规则"
    tag: transform
    current: "在删除对角像素后，迭代修剪提示邻域（切比雪夫1范围）内度为1且有对角前景邻居的叶子像素"
    alternatives:
      - name: "不修剪叶子像素"
        description: "删除对角像素后不执行额外修剪步骤。某些删除后暴露的度1端点保留在输出中。简化了变换流程，但输出中可能出现视觉上不整洁的突出像素，解题者需理解只做最基本的删除。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "全局修剪所有度1叶子像素"
        description: "不限于提示邻域，对整个网格迭代修剪所有度1的叶子像素，直到所有前景像素度数>=2。这可能修剪掉线段的自然端点，导致线段缩短。解题者需理解'全局修剪vs局部修剪'的区别，预测哪些端点会消失。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "修剪后叶子像素变色为标记色"
        description: "需要修剪的叶子像素不被删除，而是变为一种特殊颜色（如红色），在输出中作为标记保留。解题者需识别哪些像素是'被标记的叶子'而非被删除，推理目标从删除变为重新着色。"
        source: recolor
        source_task: 2b83f449
        delta_lines: 20
      - name: "递归修剪直到所有分支消失"
        description: "修剪不仅限于度1像素，而是递归删除所有度<=1的像素直到稳定。如果线段末端形成长链（非环），整条链都被修剪掉，只保留有环或多分支交汇的结构。这是极端版本的修剪，输出可能只保留T型交叉节点附近的像素。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D8
    name: "线段网络拓扑结构"
    tag: meta
    current: "6-8条轴对齐线段（2-5水平+3-6垂直），形成3-5个4连通分量，含2-3个T型交叉节点"
    alternatives:
      - name: "无交叉节点的独立线段"
        description: "移除所有T型交叉节点，所有线段完全独立互不相交。每条线段是一个独立的4连通分量。简化了拓扑结构，解题者的间隙识别更简单（无需区分交叉节点处的像素），但可能使任务过于简单。"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "十字交叉节点代替T型交叉"
        description: "交叉节点从T型（三路）变为十字型（四路），即两条线段完全交叉穿过。拓扑上更复杂，间隙可能出现在交叉节点附近但不能切断交叉点本身。解题者需理解更复杂的节点保护规则。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "单一连通分量的线段网络"
        description: "所有线段连接为一个4连通分量（类似连通的管道网络），通过增加交叉节点数量实现。解题者面对的是一个整体结构而非独立片段，间隙修复后整个网络必须保持连通性。增加了全局一致性推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "允许对角线段"
        description: "线段不限于轴对齐（水平/垂直），还允许45度对角线段。对角线段上的间隙修复方向也是对角的。这大幅增加了方向识别的难度——对角提示链可能与对角线段本身混淆，解题者需精确区分'线段像素'和'提示像素'。"
        source: creative
        source_task: null
        delta_lines: 55

