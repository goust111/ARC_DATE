  - id: D12
    name: "对角像素的检测条件"
    tag: transform
    current: "同时满足两个条件：(1)无正交前景邻居(deg4=0)，(2)有至少一个对角前景邻居"
    alternatives:
      - name: "仅检测无正交邻居（不要求对角邻居）"
        description: "放宽检测条件：只要像素没有正交前景邻居就被视为需删除的孤立像素，不管是否有对角邻居。这会删除所有孤立的前景像素，包括独立的单像素点。解题者需理解更宽泛的'孤立像素清除'规则。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "检测度1像素（恰好1个正交邻居）"
        description: "将检测目标从deg4=0改为deg4=1：有恰好一个正交前景邻居的像素（线段端点或突出像素）被标记为提示。这改变了哪些像素被视为'噪声'，可能影响到线段的自然端点，解题者需区分'自然端点'和'噪声端点'。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "基于连通分量大小检测"
        description: "不逐像素检测，而是按8连通分量大小判断：小于阈值（如<=3像素）的8连通分量被视为对角提示/噪声并删除。大分量是线段网络，小分量是提示。解题者需推断大小阈值并理解连通分量分类规则。"
        source: anomaly_detection
        source_task: b99e7126
        delta_lines: 25

  - id: D13
    name: "多步处理序列"
    tag: multi_step
    current: "三步顺序处理：(1)识别并删除对角像素 → (2)填补相邻间隙 → (3)迭代修剪叶子像素"
    alternatives:
      - name: "先填充后删除"
        description: "反转步骤1和2的顺序：先在对角像素仍存在的情况下填充间隙，然后再删除对角像素。由于填充依赖对角像素的存在来定位间隙，这个顺序应该产生相同结果，但如果提示链与间隙的空间关系更复杂，顺序差异可能导致不同输出。解题者需推断正确的处理顺序。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "逐区域处理（按连通分量依次处理）"
        description: "不全局同时处理所有对角像素和间隙，而是按线段网络的连通分量从左到右、从上到下依次处理。每个分量处理完毕后的结果作为下一个分量处理的输入。解题者需理解处理顺序可能影响共享区域的结果。"
        source: multi_step
        source_task: 247ef758
        delta_lines: 30
      - name: "迭代处理直到收敛"
        description: "将整个三步流程（检测→删除→填充→修剪）视为一轮，反复执行多轮直到网格不再变化。如果第一轮修剪暴露了新的对角像素或新的间隙，后续轮次会继续处理。解题者需理解迭代收敛的概念。"
        source: multi_step
        source_task: 28a6681f
        delta_lines: 25
      - name: "增加预处理步骤：先连接近距离线段"
        description: "在间隙填充之前增加一步：如果两条平行线段端点距离<=2像素且在同一方向上，先将它们连接。然后再执行标准的对角像素删除和间隙填充。解题者需理解'预连接'和'间隙填充'两种不同的修复机制。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D14
    name: "间隙填充的触发条件"
    tag: transform
    current: "间隙附近（切比雪夫距离1范围内）存在对角提示像素时触发填充"
    alternatives:
      - name: "无条件填充所有小间隙"
        description: "不需要对角提示来触发填充——所有长度<=3的水平/垂直间隙自动被填充。移除了提示机制的推理需求，但解题者需理解'自动修复小间隙'的全局规则以及正确的间隙大小阈值。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "仅当两侧线段长度比满足条件时填充"
        description: "间隙填充不依赖对角提示，而依赖间隙两侧线段的长度比：只有当两侧线段长度差<=2时才填充。如果一侧远长于另一侧，不填充（认为是两条独立线段）。解题者需比较线段长度来判断是否应填充。"
        source: creative
        source_task: null
