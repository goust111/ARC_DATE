task_id: 7b80bb43
task_type: transform_in_place
summary: "识别并删除前景线段网络中的45度对角阶梯提示像素，利用提示位置填补直线上的3像素间隙，并修剪残余叶子像素，恢复干净的轴对齐线段网络"

dimensions:
  - id: D1
    name: "间隙填充变换方式"
    tag: transform
    current: "删除对角提示像素后，在提示相邻处填补水平/垂直直线上的3像素间隙，恢复断裂的线段"
    alternatives:
      - name: "对称性修复代替间隙填充"
        description: "不填补间隙，而是检测每条线段是否关于某个对称轴对称，删除破坏对称性的像素使线段变为完美对称。解题者需要从'修复断裂'的思维转换到'修复对称性'的思维，推理目标完全不同。"
        source: symmetry_repair
        source_task: 8e5c0c38
        delta_lines: 50
      - name: "间隙扩展而非填充"
        description: "反转当前规则：不是填补间隙，而是将间隙扩展——在提示标记的相邻位置，将线段两端各额外删除1像素，使间隙从3像素扩大到5像素。解题者需理解'扩大而非修复'的反直觉操作。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "间隙处颜色替换填充"
        description: "间隙不用原前景色填充，而是用对角提示链中像素数量编码的颜色填充（如2像素链用颜色2，3像素链用颜色3）。间隙被修复但使用不同颜色，解题者需推断提示链长度与填充颜色的对应关系。"
        source: recolor
        source_task: 2b83f449
        delta_lines: 25
      - name: "间隙处绘制垂直交叉线段"
        description: "在间隙位置不简单填充，而是从间隙中心向垂直方向延伸一条短线段（长度等于间隙宽度），形成十字交叉。解题者需理解'间隙转化为交叉节点'的规则，输出中出现原本不存在的新拓扑结构。"
        source: connector_draw
        source_task: 3e6067c3
        delta_lines: 35
      - name: "提示链方向决定间隙填充方向"
        description: "对角链向下左延伸时，间隙只填充左半部分；向下右延伸时，只填充右半部分。解题者需同时关注提示链的方向和间隙的位置，将方向信息映射为部分填充规则，增加了方向敏感的推理需求。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D2
    name: "对角提示像素的角色"
    tag: src
    current: "45度阶梯状对角像素（无正交前景邻居，有对角前景邻居）作为间隙位置的提示标记"
    alternatives:
      - name: "正交突出像素作为提示"
        description: "提示不再是对角像素，而是从线段端点向正交方向突出的1-2像素短臂（如水平线末端向上或向下突出）。解题者需识别'垂直于线段方向的突出像素'作为修复标记，空间关系判断方式改变。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "不同颜色的标记像素"
        description: "提示像素不使用前景色，而使用第三种颜色（如红色）。这使提示更容易被视觉识别，但解题者需理解多色系统中不同颜色的语义角色。删除规则从'拓扑检测对角像素'变为'按颜色删除标记像素'。"
        source: marker_axis
        source_task: 7ed72f31
        delta_lines: 20
      - name: "网格边缘控制像素指示间隙位置"
        description: "提示信息不在线段附近，而编码在网格边缘：边缘某行/列的特殊像素指示该行/列存在需要修复的间隙。解题者需建立边缘标记与内部间隙的空间对应关系，全局推理需求增加。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 45
      - name: "种子像素在间隙内部"
        description: "提示不在间隙外部的对角位置，而是间隙内部的一个特殊颜色种子像素（如间隙3像素中的中间像素为非背景非前景的第三色）。解题者需识别间隙中的种子，并将整个间隙填充为前景色（同时删除种子的特殊颜色），推理流程与当前完全不同。"
        source: seed_propagation
        source_task: 800d221b
        delta_lines: 35

  - id: D3
    name: "对角提示的删除逻辑"
    tag: transform
    current: "识别所有无正交前景邻居但有对角前景邻居的像素，统一删除"
    alternatives:
      - name: "保留提示像素不删除"
        description: "反转当前删除规则：对角提示像素在输出中保留，仅执行间隙填充操作。输出中既有恢复的线段，也有保留的对角阶梯。解题者的推理目标从'删除+填充'简化为'仅填充'，但需注意不要误删提示像素。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "对角提示像素被重新着色而非删除"
        description: "提示像素不被删除，而是被重新着色为一种特定的标记颜色（如与背景色不同的第三色）。输出中保留了提示的位置信息但改变了其颜色。解题者需推断颜色变换规则而非简单的删除规则。"
        source: recolor
        source_task: 2b83f449
        delta_lines: 15
      - name: "选择性删除：仅删除与间隙相邻的提示链"
        description: "不删除所有对角像素——仅删除那些在切比雪夫距离1范围内有间隙的对角链（即gap_chains）。独立的干扰链（distractor_chains）保留在输出中。解题者需区分'功能性提示'和'装饰性对角线'，增加分类推理。"
        source: conditional_deletion
        source_task: 8b9c3697
        delta_lines: 25
      - name: "对角提示像素被拉直为正交像素"
        description: "提示链中的每个对角像素被移动到最近的正交位置（与原线段同行或同列），变为线段的延伸部分。效果类似'拉直弯曲的线段末端'，输出中线段会比当前规则更长。解题者需理解'对角转正交'的空间映射规则。"
        source: linearize
        source_task: 7b5033c1
        delta_lines: 30

  - id: D4
