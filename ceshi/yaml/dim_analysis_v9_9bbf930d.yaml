task_id: 9bbf930d
task_type: move_along_path
summary: "品红粒子从最左列出发沿右方向进入由同色条对形成的走廊，遇到彩色障碍时转90度进入垂直于当前方向且两侧同色条对匹配的走廊，直到到达网格边缘或无法转弯为止；输出将粒子移动到最终位置。"

dimensions:
  - id: D1
    name: "路径类型：走廊跟随"
    tag: path
    current: "粒子在同色条对形成的1格宽走廊中移动，遇障碍时转入垂直方向的同色条对走廊（corridor_following + inertia）。"
    alternatives:
      - name: "直线射线路径"
        description: "粒子不再沿走廊前进，而是沿初始方向做直线射线运动，直到碰到任意彩色像素或边界停止；去掉走廊概念，推理从通道识别变成射线终点判断。"
        source: "straight_ray"
        source_task: "221dfab4"
        delta_lines: 30
      - name: "重力流动路径"
        description: "粒子不遵循走廊，而是按重力规则向下/左/右流淌到相邻背景格，类似水流扩散，最终填满所有可达的低洼背景区域；从线性走廊变为面积扩散。"
        source: "gravity"
        source_task: "28a6681f"
        delta_lines: 55
      - name: "最短路径导航"
        description: "粒子从入口出发，沿背景格的最短路径（BFS）到达网格右侧或底侧边缘，路径不限于走廊结构；推理从走廊匹配变为图搜索。"
        source: "shortest_path"
        source_task: "7b0280bc"
        delta_lines: 45
      - name: "对角线反射路径"
        description: "粒子沿45度方向运动，碰到彩色条时发生镜面反射（入射角等于反射角），直到离开网格；从走廊跟随变成反射几何推理。"
        source: "diagonal_ray"
        source_task: "142ca369"
        delta_lines: 50

  - id: D2
    name: "转弯规则"
    tag: path
    current: "被彩色格挡住时检查两个垂直方向，选择有同色条对走廊的一侧转90度；必须恰好一个方向有效（无歧义断裂）。"
    alternatives:
      - name: "固定手性转弯"
        description: "被挡住时始终选择固定方向（如始终右转/顺时针），不检查走廊匹配；推理变为追踪固定旋转方向的螺旋路径。"
        source: "turning_rules"
        source_task: "e87109e9"
        delta_lines: 20
      - name: "转弯方向由障碍色决定"
        description: "阻挡格的颜色决定转弯方向——某些颜色导致上转/左转，其他颜色导致下转/右转；解题者需从样例推断颜色到转向的映射。"
        source: "creative"
        source_task: null
        delta_lines: 30
      - name: "允许双向歧义并取较长路径"
        description: "当两个垂直方向都有有效走廊时不报错，而是选择能走更远的那条路径；把消歧从结构唯一性变为路径长度比较。"
        source: "inversion"
        source_task: null
        delta_lines: 35
      - name: "转弯需要累计两次阻挡"
        description: "粒子被挡一次时原地等待（不转弯），连续第二次被挡时才转弯；引入状态记忆，改变路径追踪的复杂度。"
        source: "creative"
        source_task: null
        delta_lines: 25

  - id: D3
    name: "走廊定义条件"
    tag: path
    current: "走廊由同色条对定义——背景格两侧相邻行/列上的彩色像素颜色必须相同且非背景/粒子色。"
    alternatives:
      - name: "异色条对也形成有效走廊"
        description: "走廊不再要求两侧同色，任意两个非背景色条对之间的通道都是有效走廊；消除真走廊/假走廊的区分，粒子可进入所有通道。"
        source: "inversion"
        source_task: null
        delta_lines: 15
      - name: "走廊需要三格宽"
        description: "有效走廊宽度从1格增加到3格（中间3行/列都是背景），同色条对分布在更外侧；视觉上走廊更宽，结构更稀疏。"
        source: "width_constraint"
        source_task: "332f06d7"
        delta_lines: 40
      - name: "走廊由边界颜色序列定义"
        description: "走廊两侧的条不是单色，而是由特定颜色序列（如ABAB交替）定义，粒子只在序列模式匹配时识别为有效走廊；增加模式匹配维度。"
        source: "creative"
        source_task: null
        delta_lines: 45

  - id: D4
    name: "轨迹涂色"
    tag: trajectory
    current: "无轨迹——粒子移动后只在终点出现，路径上不留任何痕迹。"
    alternatives:
      - name: "连续轨迹涂色"
        description: "粒子经过的每个背景格都被涂成粒子色或走廊色，形成可见的完整运动路径；输出从只看终点变为追踪整条路径。"
        source: "continuous_trail"
        source_task: "142ca369"
        delta_lines: 15
      - name: "周期色轨迹"
        description: "粒子路径上交替涂两种颜色（如粒子色和走廊色），形成条纹轨迹；视觉上更丰富，解题者需推断涂色周期。"
        source: "periodic_pattern"
        source_task: "221dfab4"
        delta_lines: 20
      - name: "仅转弯处涂色"
        description: "只在粒子发生转弯的格子涂上标记色，直行段保持背景色；解题者需先理解路径再识别转弯点位置。"
        source: "creative"
        source_task: null
        delta_lines: 18
      - name: "走廊色轨迹"
        description: "粒子经过走廊时用该走廊对应的条对颜色涂路径，多段路径因不同走廊而有不同颜色；轨迹颜色编码了走廊归属信息。"
        source: "color_pairing"
        source_task: "16de56c4"
        delta_lines: 22

  - id: D5
    name: "源对象：粒子定义"
    tag: src
    current: "品红色粒子位于最左列（col 0），从有效走廊入口的奇数行出发，初始方向固定向右。"
    alternatives:
      - name: "粒子位于网格边缘任意一侧"
        description: "粒子不限于左列，可出现在上下左右四条边缘，初始方向为朝内；解题者需从粒子位置推断初始方向。"
        source: "creative"
        source_task: null
        delta_lines: 30
      - name: "粒子位于走廊内部"
        description: "粒子不在边缘，而是放置在走廊交叉点或走廊中段某处，初始方向由相邻走廊结构决定；起点定位从固定边缘变为内部搜索。"
        source: "inversion"
        source_task: null
        delta_lines: 35
      - name: "控制像素指定起点"
        description: "在网格边缘放置红色控制像素，其所在行/列指示哪些走廊有粒子注入；粒子不再预置在col 0，而是由控制像素间接指定。"
        source: "control_pixels"
        source_task: "4a21e3da"
        delta_lines: 28
      - name: "多色粒子分组"
        description: "粒子有多种颜色，每种颜色的粒子只能进入对应颜色的走廊（颜色必须匹配条对色）；源对象自带走廊选择约束。"
        source: "color_grouping"
        source_task: "b5ca7ac4"
        delta_lines: 32

  - id: D6
    name: "终点条件"
    tag: dst
    current: "粒子在到达网格边缘或遇到完全阻塞（无有效垂直走廊可转）时停止。"
    alternatives:
      - name: "到达目标色像素停止"
        description: "在网格中放置特定颜色的目标像素，粒子到达目标格时立即停止，即使还能继续前进；终点从被动边界变为主动目标搜索。"
        source: "collision_stop"
        source_task: "195c6913"
        delta_lines: 20
      - name: "走过固定步数停止"
        description: "粒子从入口出发后最多走N步（N由某种可见编码给出），即使未到边界也停下；终点变成距离计数问题。"
        source: "distance_encoding"
        source_task: "271d71e2"
        delta_lines: 25
      - name: "穿越固定数量的走廊后停止"
        description: "粒子经过N个不同走廊（N为固定值或由样例推断）后停止；终点由走廊计数而非位置决定。"
        source: "creative"
        source_task: null
        delta_lines: 28
      - name: "碰到异色条对（假走廊）停止"
        description: "粒子可以在真走廊中前进，但一旦进入假走廊区域（两侧条对异色）就立即停止；假走廊从干扰项变成功能性终点。"
        source: "inversion"
        source_task: null
        delta_lines: 18

  - id: D7
    name: "变换：输出处理"
    tag: transform
    current: "粒子从起点消失（变背景），在终点出现（变粒子色），其他像素不变。"
    alternatives:
      - name: "粒子到达终点后扩散"
        description: "粒子到达终点后向四周扩散一格，形成十字或方形标记；输出不是单像素而是小区域，视觉效果更明显。"
        source: "surround"
        source_task: "71e489b6"
        delta_lines: 20
      - name: "粒子改色为走廊色"
        description: "粒子到达终点后颜色变为其最终所在走廊的条对颜色，而非保持品红；需要识别终点所属走廊来确定输出颜色。"
        source: "recolor"
        source_task: "271d71e2"
        delta_lines: 15
      - name: "粒子保留在起点且终点也涂色"
        description: "起点粒子不消失，终点额外涂上品红；输出中有成对的起点-终点标记，解题者需推断配对关系。"
        source: "inversion"
        source_task: null
        delta_lines: 12
      - name: "经过的走廊条对被擦除"
        description: "粒子经过的每段走廊中两侧的彩色条对变成背景色（被粒子'吃掉'），终点处粒子出现；输出中路径痕迹体现为条对缺失。"
        source: "erase"
        source_task: "3dc255db"
        delta_lines: 25

  - id: D8
    name: "障碍物：条对结构"
    tag: obstacle
    current: "彩色条水平铺设在偶数行，从bar_start列延伸到网格右端；真走廊由同色条对构成，假走廊（干扰项）由异色条对构成。"
    alternatives:
      - name: "条对部分断裂"
        description: "走廊的条对不再完整覆盖整行，而是有间断（部分格为背景），粒子需要判断间断处是否仍属于同一走廊；走廊识别变得更困难。"
        source: "creative"
        source_task: null
        delta_lines: 30
      - name: "条对宽度可变"
        description: "某些走廊的条对为2像素厚（占2行），某些为1像素厚；粒子在宽条走廊中可以选择偏移行移动，增加路径选择复杂度。"
        source: "width_constraint"
        source_task: "332f06d7"
        delta_lines: 40
      - name: "垂直条对替代水平条对"
        description: "走廊主方向从水平变为垂直，条对竖直铺设在偶数列，粒子从顶行或底行出发向下/上进入走廊；整体结构旋转90度。"
        source: "inversion"
        source_task: null
        delta_lines: 35
      - name: "增加单独阻挡块"
        description: "除了条对外，在走廊通道中随机放置孤立的彩色阻挡块，粒子遇到阻挡块时也需要转弯或停止；走廊不再是畅通的通道。"
        source: "creative"
        source_task: null
        delta_lines: 22

  - id: D9
    name: "交叉口行为"
    tag: obstacle
    current: "垂直走廊与水平走廊交叉时，要么两条条完全断开让粒子惯性通过，要么两条条不断让粒子完全阻挡——不存在半通过状态。"
    alternatives:
      - name: "交叉口优先级由颜色深浅决定"
        description: "交叉口处两组走廊的条对颜色存在优先级关系，色值较大的走廊为主通道保持连通，色值较小的走廊在交叉处断开；优先级可视化为颜色明暗差异。"
        source: "creative"
        source_task: null
        delta_lines: 35
      - name: "交叉口强制转弯"
        description: "粒子到达交叉口时必须转弯进入垂直走廊，不能直行通过；交叉口从分支选择变成强制改道。"
        source: "inversion"
        source_task: null
        delta_lines: 20
      - name: "交叉口信号灯机制"
        description: "交叉口处放置特殊颜色的像素（如第三种颜色），该颜色指示粒子在此交叉口应直行还是转弯；引入局部符号指令。"
        source: "symbol_instructions"
        source_task: "e87109e9"
        delta_lines: 30

  - id: D10
    name: "真走廊与假走廊的区分"
    tag: obstacle
    current: "真走廊两侧同色，假走廊两侧异色；粒子只沿真走廊转弯。假走廊作为干扰项，结构上与真走廊几乎相同。"
    alternatives:
      - name: "取消假走廊"
        description: "所有走廊都是真走廊（同色条对），粒子路径完全由阻挡和边界决定；去掉干扰项后核心谜题变为纯路径追踪。"
        source: "inversion"
        source_task: null
        delta_lines: 20
      - name: "假走廊为陷阱"
        description: "假走廊不仅是干扰项，粒子若误入假走廊会被困住（终点固定在假走廊入口）；假走廊从视觉干扰变为有功能意义的陷阱。"
        source: "creative"
        source_task: null
        delta_lines: 25
      - name: "真假走廊通过条对间距区分"
        description: "不再用颜色匹配区分真假，而是用条对与通道的间距——真走廊通道宽1格，假走廊通道宽2格（或反之）；区分条件从颜色变为空间属性。"
        source: "creative"
        source_task: null
        delta_lines: 35

  - id: D11
    name: "网格布局：条纹结构"
    tag: grid_shape
    current: "严格条纹布局——偶数行为条行，奇数行为通道行/背景行；输出与输入同尺寸。"
    alternatives:
      - name: "裁剪到粒子路径外接矩形"
        description: "输出只保留所有粒子起点和终点的最小外接矩形区域，去掉与粒子移动无关的边缘行列；解题者需先推断所有终点再确定裁剪区域。"
        source: "tight_crop"
        source_task: "e87109e9"
        delta_lines: 20
      - name: "非均匀行间距"
        description: "条行之间的通道行数不固定（1-3行不等），走廊宽度因位置而异；从严格周期条纹变为不规则排布，走廊识别更难。"
        source: "creative"
        source_task: null
        delta_lines: 40
      - name: "棋盘格布局"
        description: "彩色条不是整行铺设，而是按棋盘格模式分布在偶数行偶数列交汇处，通道变成网格状而非条纹状；走廊结构从线性变为网状。"
        source: "creative"
        source_task: null
        delta_lines: 55

  - id: D12
    name: "粒子数量与路径多样性"
    tag: meta
    current: "3-6个粒子同时存在，每个粒子有0-3次转弯，路径长度14-46格。"
    alternatives:
      - name: "单粒子深度路径"
        description: "只有一个粒子但路径极长（4次以上转弯，覆盖网格大部分区域），把多粒子并行推理变成单粒子复杂路径追踪。"
        source: "inversion"
        source_task: null
        delta_lines: 20
      - name: "粒子间互相阻挡"
        description: "多个粒子同时移动，先到达某格的粒子会阻挡后续粒子，粒子之间存在碰撞停止关系；需要推断处理顺序。"
        source: "collision_detection"
        source_task: "e12f9a14"
        delta_lines: 40
      - name: "粒子按颜色分批次处理"
        description: "粒子有两种颜色，先处理颜色A的所有粒子（它们到达终点后变成障碍），再处理颜色B的粒子；引入两阶段级联。"
        source: "chain_reaction"
        source_task: "5961cc34"
        delta_lines: 35

  - id: D13
    name: "多步处理与级联"
    tag: multi_step
    current: "单步处理——所有粒子独立计算终点，互不影响，结果一次性写入输出。"
    alternatives:
      - name: "逐个粒子顺序处理"
        description: "粒子按从上到下顺序逐个移动，前一个粒子的终点成为后续粒子的障碍；引入可观察的处理顺序依赖。"
        source: "multi_step"
        source_task: "271d71e2"
        delta_lines: 25
      - name: "粒子到达终点后发射新粒子"
        description: "粒子到达终点后在该位置产生新粒子，新粒子沿终点处走廊的另一方向继续移动；形成链式传播直到无法继续。"
        source: "chain_reaction"
        source_task: "5961cc34"
        delta_lines: 45
      - name: "两轮移动"
        description: "第一轮所有粒子移动到终点，第二轮从新位置再次执行相同移动规则；解题者需迭代两次推理才能得到最终状态。"
        source: "multi_step"
        source_task: "28a6681f"
        delta_lines: 15

  - id: D14
    name: "符号编码与图例"
    tag: symbol_instructions
    current: "无图例或符号编码，所有规则由网格结构隐式表达。"
    alternatives:
      - name: "边缘图例指示转弯方向"
        description: "网格顶行或底行放置小型图例符号（如L形或箭头），每种颜色的符号指示该颜色走廊中粒子的转弯偏好方向；规则从结构推断变为符号解读。"
        source: "symbol_instructions"
        source_task: "e87109e9"
        delta_lines: 40
      - name: "角落调色板编码走廊优先级"
        description: "在网格角落放置颜色序列，序列顺序表示走廊优先级——当交叉口存在多个有效转弯时按优先级选择；把硬编码唯一性改为优先级查表。"
        source: "legend_lookup"
        source_task: "58490d8a"
        delta_lines: 35
      - name: "控制像素标记可转弯位置"
        description: "在走廊特定位置放置红色控制像素，粒子只在有控制像素的位置才能转弯，其他位置即使有走廊也不转弯；显式标记替代结构推断。"
        source: "control_pixels"
        source_task: "4a21e3da"
        delta_lines: 28

  - id: D15
    name: "初始方向"
    tag: path
    current: "所有粒子初始方向固定向右。"
    alternatives:
      - name: "初始方向由粒子行号奇偶决定"
        description: "奇数行粒子向右，偶数行粒子向左（或向上/向下），解题者需从样例推断行号与方向的映射规则。"
        source: "creative"
        source_task: null
        delta_lines: 15
      - name: "初始方向由相邻走廊入口方位决定"
        description: "粒子初始方向不固定，而是取决于其相邻的第一个有效走廊入口在哪个方向；需要局部搜索确定起步方向。"
        source: "direction_from_shape"
        source_task: "3dc255db"
        delta_lines: 20
      - name: "初始方向由边缘标记指定"
        description: "每个粒子旁边有一个彩色箭头像素（上/下/左/右的偏移），该偏移方向即为粒子初始运动方向；方向信息显式编码在网格中。"
        source: "directional_movement"
        source_task: "88e364bc"
        delta_lines: 25

  - id: D16
    name: "惯性与间隙穿越"
    tag: path
    current: "粒子保持当前方向不变地穿越背景间隙（包括交叉口间隙），直到遇到彩色像素被阻挡才尝试转弯。"
    alternatives:
      - name: "间隙宽度限制"
        description: "粒子只能穿越宽度不超过N格的背景间隙（N由样例推断），超过N格的间隙视为终点；惯性受距离约束。"
        source: "width_constraint"
        source_task: "332f06d7"
        delta_lines: 20
      - name: "无惯性：每步重新判断"
        description: "粒子每走一步都重新检查四个方向的走廊有效性，选择最优方向前进，而非保持惯性；从惯性运动变为贪心搜索。"
        source: "inversion"
        source_task: null
        delta_lines: 30
      - name: "间隙中减速"
        description: "粒子穿越背景间隙时每隔一格停一次（只走偶数步），间隙中的奇数位置不可达；移动变成跳跃模式。"
        source: "gcd_spacing"
        source_task: "16de56c4"
        delta_lines: 25

  - id: D17
    name: "颜色数量与调色板"
    tag: meta
    current: "网格恰好使用6种不同颜色（不含背景7和粒子6），其中3-6种为走廊色，0-3种为装饰色。"
    alternatives:
      - name: "最少颜色：仅2种走廊色"
        description: "只使用2种走廊色形成所有真假走廊，走廊的区分完全依赖同色/异色配对而非颜色多样性；视觉更简洁但结构判断更精细。"
        source: "inversion"
        source_task: null
        delta_lines: 10
      - name: "每个走廊唯一色"
        description: "每个走廊使用独特的颜色（不复用），走廊数量等于颜色数量；消除颜色复用带来的歧义，但需要更大调色板。"
        source: "creative"
        source_task: null
        delta_lines: 15
      - name: "走廊色与路径长度关联"
        description: "走廊颜色按某种顺序（如颜色ID从小到大）对应递增的路径长度约束，粒子进入特定颜色走廊时有最大行进步数；颜色承载语义信息。"
        source: "creative"
        source_task: null
        delta_lines: 30

  - id: D18
    name: "装饰/干扰项的角色"
    tag: obstacle
    current: "装饰条是放在假走廊通道中的单个彩色像素，作为纯视觉干扰项，不影响粒子移动。"
    alternatives:
      - name: "装饰条作为方向提示"
        description: "假走廊中的装饰像素颜色与某个真走廊条对色匹配时，指示附近有该色真走廊的转弯入口；干扰项变成辅助线索。"
        source: "creative"
        source_task: null
        delta_lines: 25
      - name: "无装饰条"
        description: "完全去除假走廊中的装饰像素，假走廊通道全为背景色；减少视觉噪声，让真假走廊区分更纯粹依赖条对颜色匹配。"
        source: "inversion"
        source_task: null
        delta_lines: 10
      - name: "装饰条作为计数编码"
        description: "假走廊中装饰像素的数量编码某种信息（如该行到最近真走廊转弯口的距离），解题者需要数装饰点来辅助推理。"
        source: "counting"
        source_task: "8f215267"
        delta_lines: 30

  - id: D19
    name: "col 0 / col 1 的特殊结构"
    tag: meta
    current: "col 0 全部为粒子色（品红），col 1 全部为背景色；粒子从col 0出发经过col 1的背景间隔进入走廊。"
    alternatives:
      - name: "选择性粒子放置"
        description: "col 0不再全部为粒子色，只有部分行有粒子，其余为背景；解题者需要识别哪些行有粒子需要移动。"
        source: "creative"
        source_task: null
        delta_lines: 10
      - name: "粒子在最右列"
        description: "粒子放在最右列（col W-1），初始方向向左；结构对称翻转，走廊布局也相应调整。"
        source: "inversion"
        source_task: null
        delta_lines: 15
      - name: "多列缓冲区"
        description: "col 0为粒子色，col 1到col 3为背景色缓冲区（而非只有col 1）；粒子需要穿越更长的空白区才进入走廊，走廊起始位置后移。"
        source: "creative"
        source_task: null
        delta_lines: 12

  - id: D20
    name: "L/U/S形走廊的拓扑变化"
    tag: path
    current: "走廊支持0-3次转弯：直通（0转）、L形（1转）、U形（2转，同色通道由垂直条连接）。"
    alternatives:
      - name: "仅允许直通走廊"
        description: "去掉所有转弯机制，走廊只有水平直通形式；路径推理大幅简化，变体难度从路径追踪变为纯走廊识别。"
        source: "inversion"
        source_task: null
        delta_lines: 40
      - name: "Z形走廊（连续两次同向转弯）"
        description: "走廊支持Z形路径——先右转上，再右转右，形成平行偏移路径；增加转弯拓扑多样性。"
        source: "creative"
        source_task: null
        delta_lines: 35
      - name: "螺旋走廊（3次以上转弯）"
        description: "允许走廊做3次或更多转弯，形成螺旋或蛇形路径，覆盖网格更大面积；路径追踪复杂度显著增加。"
        source: "spiral_path"
        source_task: "da515329"
        delta_lines: 50
