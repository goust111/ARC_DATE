  - id: D8
    name: "洞的定义与计数规则"
    tag: meta
    current: "洞定义为精灵内部完全被精灵像素包围的背景色连通区域（4-连通），计数为此类区域的数目"
    alternatives:
      - name: "8-连通洞计数"
        description: "洞的连通性从4-连通改为8-连通（对角线也算相连），这会改变某些形状的洞数。例如对角线间隙在4-连通下是洞，在8-连通下可能不是。解题者需推断使用的连通性规则"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "洞面积加权计数"
        description: "不是简单计算洞的数量，而是按洞的面积加权：面积≥2的洞算1个，面积1的微洞不计。过滤掉了微小噪声洞，改变了某些精灵的有效洞数，增加了规则推断的难度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "计数凹陷而非封闭洞"
        description: "不计算封闭洞，而是计算精灵边缘的开放凹陷（与外界连通但深度≥2的凹入区域）。从封闭拓扑特征变为开放几何特征，解题者需要不同的视觉分析策略"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "洞数取反（总洞数上限减去实际洞数）"
        description: "匹配使用补数：如果洞数范围是0-3，则实际匹配值为3-洞数。洞最多的精灵匹配图例中洞最少的形状。增加了一层算术反转推理"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D9
