  - id: D11
    name: "多步处理逻辑"
    tag: multi_step
    current: "单步处理——识别图例、计算洞数、直接着色，无迭代或链式操作"
    alternatives:
      - name: "两阶段着色（先标记再确认）"
        description: "第一步将匹配的精灵标记为中间颜色（如浅灰），第二步再根据标记状态赋予最终图例颜色。输出展示最终态，但解题者需理解两步变换的叠加逻辑"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "迭代消除（逐轮处理不同洞数）"
        description: "从洞数最少的开始，每轮处理一种洞数的精灵并着色，同时将对应图例从图例区移除。处理顺序影响最终结果（因为某些精灵可能横跨两种匹配），增加了顺序推理"
