  - id: D13
    name: "灰色精灵的空间分布"
    tag: meta
    current: "灰色精灵随机散布在网格中，不与图例区域重叠"
    alternatives:
      - name: "精灵按洞数分区排列"
        description: "相同洞数的精灵倾向于聚集在同一区域（如同洞数的精灵在同一行或同一象限）。空间布局携带了隐含的分组信息，解题者可利用空间线索辅助匹配"
