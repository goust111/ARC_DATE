task_id: e3721c99
task_type: move_to_match
summary: "网格中散布的灰色精灵根据其洞数与图例形状的洞数匹配，被重新着色为图例对应的颜色"

dimensions:
  - id: D1
    name: "匹配条件：洞数匹配 vs 其他匹配逻辑"
    tag: match_cond
    current: "s.hole_count == d.hole_count — 灰色精灵的洞数与图例形状的洞数一致时匹配"
    alternatives:
      - name: "形状轮廓匹配"
        description: "灰色精灵的外轮廓形状必须与图例形状的外轮廓完全一致（允许平移）才能匹配。从抽象数值属性（洞数）转变为具体几何属性（形状），解题者需要进行视觉形状比对而非计数，推理方式完全不同"
        source: shape_match
        source_task: 16b78196
        delta_lines: 35
      - name: "面积匹配"
        description: "灰色精灵的像素面积（非洞数）与图例形状的面积一致时匹配。洞数是一种拓扑属性，面积是纯几何属性，解题者需要精确计数像素数量而非识别洞结构，认知任务从拓扑分析变为计数"
        source: size_match
        source_task: 2c181942
        delta_lines: 20
      - name: "连通分量数匹配"
        description: "将每个精灵按颜色以外的结构（如骨架分支数）进行匹配，精灵的凸出分支数量需等于图例形状的分支数量。从封闭洞计数变为开放结构分支计数，拓扑推理的侧重点不同"
        source: count_match
        source_task: 6e4f6532
        delta_lines: 30
      - name: "外接矩形宽高比匹配"
        description: "灰色精灵的外接矩形宽高比与图例形状的外接矩形宽高比最接近时匹配。从离散的洞数比较变为连续的比例估算，解题者需要感知整体形状比例而非内部结构"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "旋转/翻转后形状匹配"
        description: "灰色精灵经过旋转或翻转后，形状与图例形状一致才能匹配。引入空间变换搜索，解题者需在心理旋转中测试多种朝向，显著增加推理难度"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 40
      - name: "边缘颜色匹配"
        description: "灰色精灵周围的相邻像素中存在与图例形状颜色相同的彩色标记像素，以此建立匹配关系。从精灵自身属性匹配转变为空间邻域信息匹配，需要关注精灵的周边环境"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 30

  - id: D2
    name: "源对象：灰色精灵的属性与结构"
    tag: src
    current: "灰色连通精灵散布在网格中，每个精灵含有不同数量的洞（内部封闭背景区域）"
    alternatives:
      - name: "多色精灵（非统一灰色）"
        description: "源精灵不全是灰色，而是各有不同颜色，需根据某种属性（如洞数）与图例匹配后被重新着色为图例颜色。解题者不能仅靠'灰色=待处理'来定位源对象，需通过其他线索区分哪些是源哪些是图例"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "精灵为中空框架形状"
        description: "源对象从实心带洞的精灵变为仅由边框构成的中空框架，洞的数量由框架内封闭区域的数目决定。视觉上更复杂，洞的边界更难识别"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 30
      - name: "精灵包含干扰洞（背景色连通但不封闭的凹陷）"
        description: "灰色精灵边缘有开放凹陷（非封闭洞），解题者需区分真正的封闭洞和开放凹陷。增加了洞计数的歧义性，需要精确的拓扑分析"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "精灵带有对角线标记"
        description: "每个灰色精灵附带一对对角标记像素（特定颜色），标记指示精灵在网格中的某种空间关系。源对象携带额外空间信息，影响匹配或放置逻辑"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 30

  - id: D3
    name: "目标结构：图例的设计与位置"
    tag: dst
    current: "彩色图例形状位于网格左上角，每个图例形状有特定颜色和洞数"
    alternatives:
      - name: "图例分散在网格四边"
        description: "图例形状不集中在左上角，而是分散在网格的四条边上（上、下、左、右各有部分图例）。解题者需先在整个网格边缘搜索和收集图例信息，增加了信息整合的难度"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "图例嵌入网格内部（非边缘）"
        description: "图例形状被放置在网格内部而非角落，与灰色精灵混在同一区域。解题者需先区分哪些是图例哪些是待处理精灵，增加了对象分类的推理步骤"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "图例为纯色块（无洞信息）配文字式编码"
        description: "图例区域不再是带洞的形状，而是简单的纯色小方块，旁边用特定排列的标记像素（如点阵）编码对应的洞数。从直接视觉对比变为符号解码+匹配，增加一层抽象推理"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 35
      - name: "图例颜色与位置编码洞数"
        description: "图例形状全部外观相同（如统一的小方块），但按从左到右或从上到下的顺序排列，位置序号即代表对应的洞数。解题者需推断位置-数值的隐含映射关系"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "变换：重新着色的具体规则"
    tag: transform
    current: "s.color = d.color — 灰色精灵被直接重新着色为匹配图例的颜色"
    alternatives:
      - name: "部分重着色（仅洞的边界像素着色）"
        description: "灰色精灵不是整体重着色，而是仅将洞的边界像素（与洞相邻的精灵像素）着色为图例颜色，其余保持灰色。输出中精灵呈现灰色主体+彩色洞边框的双色外观，视觉效果更丰富"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "图例颜色填入洞中"
        description: "灰色精灵本身保持灰色不变，但其洞被填充为匹配图例的颜色。输出中灰色精灵的洞变成彩色，而非精灵本体变色。视觉逻辑反转，测试解题者对变换目标的理解"
        source: hole_fill
        source_task: 3a25b0d8
        delta_lines: 20
      - name: "颜色交换（灰色→图例色，图例→灰色）"
        description: "匹配后灰色精灵获得图例颜色，同时图例形状变为灰色。双向颜色交换使输出与输入的颜色分布发生对称变化，解题者需理解双向变换而非单向赋值"
        source: color_swap
        source_task: a25697e4
        delta_lines: 20
      - name: "渐变着色（按洞数递增色阶）"
        description: "不使用图例颜色，而是根据洞数大小按固定色阶（如洞数1→蓝，2→绿，3→红）着色。去除图例查表，改为数值到颜色的函数映射，解题者需从示例中推断色阶规则"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "删除匹配精灵（仅保留不匹配的）"
        description: "与图例成功匹配的灰色精灵被擦除（变为背景色），未匹配的精灵保留。变换从着色变为删除，输出是原始网格的减法结果，推理逻辑完全反转"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 15

  - id: D5
    name: "符号指令：图例的编码方式"
    tag: symbol_instructions
    current: "图例形状直接用自身的洞数编码匹配关系——计算图例形状的洞数，灰色精灵与之洞数相同则获得该图例颜色"
    alternatives:
      - name: "图例用点阵编码目标洞数"
        description: "图例区域由彩色方块和旁边的标记点组成，标记点的数量表示该颜色对应的洞数。图例本身不需要有洞，信息通过显式的点计数传达。解码方式从视觉拓扑分析变为简单计数"
        source: legend_lookup
        source_task: 97d7923e
        delta_lines: 30
      - name: "图例用面积编码（面积=洞数×固定系数）"
        description: "图例形状的面积除以固定系数等于对应的洞数。解题者需同时理解图例面积的含义和灰色精灵的洞数，两侧的信息编码方式不同，增加了跨表示推理的难度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "图例用颜色对表示（左色=图例色，右色=匹配特征色）"
        description: "图例区域每行有两个色块：左色为目标着色颜色，右色为灰色精灵洞边界应有的特定颜色标记。匹配不再基于洞数而是基于洞周围的颜色标记，图例提供颜色映射表"
        source: rectangle_fill
        source_task: 9385bd28
        delta_lines: 35
      - name: "图例位置隐含排序（从上到下对应洞数1,2,3...）"
        description: "图例仅为竖排的纯色方块，没有洞信息。从上到下的排列位置隐含地编码了洞数（第1个对应1洞，第2个对应2洞...）。解题者需推断位置-数值映射，而非直接读取图例属性"
        source: creative
        source_task: null
        delta_lines: 20

