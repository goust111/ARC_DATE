    alternatives:
      - name: "空心框架方块"
        description: "目标从5x5实心方块改为空心矩形框架（仅边框像素着色），motif雕刻作用在框架上。输出中框架的边框被部分移除，视觉效果类似剪纸。"
        source: jigsaw_assembly
        source_task: 8698868d
        delta_lines: 30
      - name: "尺寸各异的方块"
        description: "方块不再统一为5x5，而是有3x3、5x5、7x7等不同尺寸，motif按比例缩放后居中雕刻。解题者需要推断缩放规则，增加尺寸推理维度。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "预设图案的方块"
        description: "方块不是纯色，而是已有简单图案（如棋盘格、条纹），motif雕刻覆盖在图案之上，将对应像素改为背景色。输出中可见图案与雕刻的叠加效果。"
