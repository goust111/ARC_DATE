task_id: 58f5dbd5
task_type: move_to_match
summary: "将与5x5纯色方块颜色匹配的小型motif精灵居中叠加到方块上，以背景色'雕刻'出洞，然后将所有雕刻后的方块按原始行列顺序紧凑排列输出（1像素间距+1像素边框）。"

dimensions:
  - id: D1
    name: "匹配条件：颜色匹配"
    tag: match_cond
    current: "motif精灵与5x5方块通过相同颜色匹配（s.color == d.color）"
    alternatives:
      - name: "形状嵌合匹配"
        description: "每个5x5方块预先带有一个缺口（notch），motif必须在形状上恰好填入该缺口才算匹配。解题者需要进行空间形状比对而非简单颜色识别，推理难度显著提升。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 40
      - name: "边缘颜色匹配"
        description: "5x5方块的边框像素使用一种颜色标记（如第一行/列的颜色），motif的颜色必须匹配该边框标记色而非方块填充色。需要解题者区分边框色与填充色，增加视觉解析难度。"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 25
      - name: "大小排序匹配"
        description: "motif按面积从小到大排序，方块按位置从左到右排序，按排名一一对应。解题者需要计算面积并理解排序映射关系，而非颜色比对。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 30
      - name: "motif排列与方块洞排列匹配"
        description: "每个方块内预设若干小洞（2-3个像素的空缺），motif由相同数量的子部件组成，子部件的相对排列必须与洞的排列一致才匹配。需要空间布局推理。"
        source: arrangement_match
        source_task: 3a25b0d8
        delta_lines: 45

  - id: D2
    name: "匹配条件：干扰项过滤"
    tag: match_cond
    current: "输入中包含干扰motif（颜色与任何方块不匹配），solver通过颜色匹配自然过滤"
    alternatives:
      - name: "颜色频次消歧"
        description: "多个motif可能共享相同颜色，此时选择出现频率最高（或最低）的那个motif作为匹配项。解题者不仅要匹配颜色，还需要统计频次进行消歧。"
        source: frequency_tiebreak
        source_task: 67e490f4
        delta_lines: 25
      - name: "空间对齐匹配"
        description: "motif不靠颜色匹配，而是按行/列对齐关系匹配：与方块同行或同列的motif匹配到该方块。需要空间位置推理。"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 30
      - name: "连接器颜色匹配"
        description: "每个motif旁边有一个单独的标记像素（连接器），方块边缘也有同色标记像素，通过连接器颜色而非motif本体颜色匹配。解题者需要识别连接器并将其与方块标记关联。"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 35

  - id: D3
    name: "源对象：motif结构"
    tag: src
    current: "单色、8连通、3x3外接矩形内的小型motif精灵，面积4-8像素"
    alternatives:
      - name: "多色motif精灵"
        description: "motif由2种颜色构成（如主体色+装饰色），其中一种颜色用于匹配方块，另一种颜色在雕刻时产生不同效果（如装饰色像素变为第三种颜色而非背景色）。增加颜色角色推理。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "可旋转/翻转的motif"
        description: "motif在输入中可能被旋转或翻转后展示，雕刻时需要还原到标准朝向。解题者需要心理旋转来理解motif的真实形状，增加空间变换推理。"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 25
      - name: "更大尺寸的motif（5x5外接矩形）"
        description: "motif外接矩形从3x3扩大到5x5，此时motif完全覆盖方块区域（居中后无偏移），雕刻后方块可能只剩边缘残留。视觉效果更戏剧化，推理过程类似。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "对角标记对作为motif"
        description: "motif不是连通区域，而是一对对角放置的同色像素（形成矩形的两个对角），雕刻时将这两个对角位置雕空。极简的motif增加识别难度。"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 30

  - id: D4
    name: "源对象：motif数量与干扰"
    tag: src
    current: "总共6-8个motif插槽，其中与方块颜色匹配的motif数量等于方块数，其余为干扰项（0到方块数个干扰），可有0-2个空插槽"
    alternatives:
      - name: "无干扰项（纯净输入）"
        description: "取消所有干扰motif，输入中的每个motif都恰好对应一个方块。简化了过滤推理，但解题者仍需正确匹配颜色和执行雕刻。适合作为简单变体。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "大量干扰项"
        description: "干扰motif数量大幅增加（比匹配motif多2-3倍），迫使解题者在众多候选中精确筛选。增加视觉搜索和颜色匹配的认知负担。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "重复颜色干扰"
        description: "干扰项中有部分motif与方块颜色相同但形状不同，只有正确形状的motif才用于雕刻（需要额外规则如面积最小者为正确motif）。增加消歧复杂度。"
        source: creative
        source_task: null
        delta_lines: 25

