task_id: 8f3a5a89
task_type: move_along_path
summary: "从底左角的品红标记像素出发，通过洪填找到被蓝色结构墙与网格边缘围成的可达区域，在可达区域的内边界上涂橙色，同时擦除不可达一侧的装饰墙"

dimensions:
  - id: D1
    name: "路径/区域发现机制"
    tag: path
    current: "boundary_trace + flood_fill——从标记像素出发做4-连通洪填，找到被结构墙阻挡的可达区域，再在该区域的内边界涂色"
    alternatives:
      - name: "直线射线扫描代替洪填"
        description: "从标记像素向四个基本方向发射射线，射线被墙壁阻挡后标记为可达边界。可达区域改为射线扫过的所有像素的并集。这将全局洪填转变为方向性扫描，解题者需要理解射线-墙壁的阻挡关系而非连通性。"
        source: straight_ray
        source_task: 221dfab4
        delta_lines: 35
      - name: "水流重力模拟"
        description: "标记像素作为水源，水向下和左右流动（不向上），受墙壁阻挡。可达区域为水能到达的所有位置，内边界涂色规则不变。这引入了方向性约束（重力），可达区域不再是各向同性的，解题者需要推理流体的单向传播行为。"
        source: gravity
        source_task: 28a6681f
        delta_lines: 25
      - name: "通道宽度约束洪填"
        description: "洪填时只能通过宽度>=2像素的通道（即通道两侧墙壁间距>=2才可通过），窄于2像素的缝隙视为不可通行。这使得某些在普通洪填下可达的区域变为不可达，解题者需要评估通道宽度。"
        source: width_constraint
        source_task: 332f06d7
        delta_lines: 30
      - name: "同心框架收缩"
        description: "不做洪填，而是从网格边缘开始逐层向内收缩，每层宽度为1像素，遇到墙壁时该方向停止收缩。最终涂色的是最内层接触墙壁或网格边缘的那一圈像素。这将洪填边界追踪转变为由外向内的剥离过程。"
        source: concentric_frames
        source_task: 13e47133
        delta_lines: 40

  - id: D2
    name: "内边界涂色规则"
    tag: trajectory
    current: "inner_border——可达区域中，位于网格边缘、8-邻接结构墙、或4-邻接不可达像素的背景格子涂橙色，形成1像素宽的内边界环"
    alternatives:
      - name: "外边界涂色（在不可达侧涂色）"
        description: "反转边界涂色方向：不在可达区域内侧涂色，而是在不可达区域中紧邻可达区域的像素上涂色，形成外边界环。解题者需要理解可达/不可达的分界后选择另一侧涂色，是当前规则的镜像反转。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "双层边界（内外各一圈）"
        description: "在可达区域的内边界涂橙色（同当前），同时在不可达区域的外边界涂另一种颜色（如绿色）。输出呈现双色边界环。解题者需要同时理解两个方向的边界涂色逻辑。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "间歇性边界（跳格涂色）"
        description: "内边界环不是连续涂色，而是每隔一格涂一格（棋盘格式），形成虚线状边界。解题者需要在识别边界的基础上还判断奇偶涂色模式。"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 15
      - name: "渐变厚度边界"
        description: "边界厚度不固定为1像素。在结构墙附近的边界为2像素厚，在网格边缘附近的边界仍为1像素厚。或者边界厚度取决于距标记像素的距离——近处1像素，远处2像素。解题者需要推断厚度变化规则。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D3
    name: "源对象（标记像素）位置"
    tag: src
    current: "单个品红像素固定在底左角 (H-1, 0)，始终为BL角"
    alternatives:
      - name: "标记可在任意角落"
        description: "标记像素不固定在底左角，而是可以出现在四个角落中的任意一个。解题者需要先定位标记像素的位置，再从该位置开始洪填。增加了初始条件的不确定性。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "标记在网格边缘（非角落）"
        description: "标记像素放置在网格的某条边上但不在角落，如边缘中点附近。这使得可达区域的形状更加不对称和复杂，因为起始点不在角落时被墙壁切分的区域几何性质不同。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 15
      - name: "多个标记像素（多源洪填）"
        description: "网格中放置2-3个不同颜色的标记像素，分别在不同角落或边缘。每个标记的可达区域独立计算，各自涂不同颜色的边界。不同区域可能重叠，重叠处使用特定的颜色合并规则。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "标记在网格内部（非边缘）"
        description: "标记像素放在网格内部的某个位置，被墙壁包围。可达区域完全由墙壁界定（不依赖网格边缘）。这使得可达区域可能是完全被墙壁封闭的内部区域，边界形态更多样化。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "终止/边界判定条件"
    tag: dst
    current: "洪填被结构墙和网格边缘阻挡——结构墙定义为触碰网格边缘且4-邻接可达区域的墙色连通分量"
    alternatives:
      - name: "仅墙壁阻挡（洪填可达网格边缘无阻挡）"
        description: "移除网格边缘作为阻挡条件，洪填仅被墙壁阻挡。如果墙壁未完全封闭一个区域，洪填可以绕过墙壁到达网格另一侧。这要求墙壁必须形成完全封闭的围栏才能产生有意义的不可达区域，改变了墙壁布局的约束。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "特定颜色像素作为目标边界"
        description: "除了墙壁外，网格中存在特定颜色的目标像素。洪填到达目标像素时标记该位置但不穿过。目标像素在输出中保留原色而非被涂为边界色。解题者需要区分墙壁（阻挡+形成边界）和目标（阻挡但不形成边界）。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 20
      - name: "距离限制的洪填"
        description: "洪填不是无限扩展，而是限制在距标记像素曼哈顿距离N以内（N由网格中某种特征编码，如某颜色像素的数量）。超出距离的区域即使无墙壁阻挡也视为不可达。这将空间连通性问题转为距离约束问题。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 25

  - id: D5
    name: "结构墙识别规则"
    tag: obstacle
    current: "结构墙 = 墙色连通分量中满足：(1) 触碰网格边缘 (2) 4-邻接可达区域（第一次洪填的reach0）的分量；非结构墙视为装饰"
    alternatives:
      - name: "所有墙色像素均为结构墙"
        description: "取消结构墙/装饰墙的区分，所有蓝色像素都作为洪填障碍。这简化了规则但移除了装饰墙的干扰逻辑，解题者不再需要区分真假障碍物。如果保留视觉上的装饰像素但不影响洪填，则需要另一种颜色来标识。"
        source: inversion
        source_task: null
        delta_lines: -15
      - name: "按连通分量大小区分"
        description: "较大的墙色连通分量（像素数>=阈值）为结构墙，较小的为装饰墙。阈值可由网格尺寸或其他特征决定。解题者需要计算连通分量大小来判断哪些是真障碍物，引入了大小判断逻辑。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "墙壁颜色多样化"
        description: "结构墙使用一种颜色（如蓝色），装饰墙使用另一种颜色（如红色），两者在视觉上即可区分。但测试用例中可能引入第三种颜色作为干扰——它的功能需要从训练示例中推断。这将隐式规则（位置判定）转为显式线索（颜色判定），但增加了颜色映射的推理。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "反向结构定义：不触碰边缘的墙才是结构墙"
        description: "反转结构墙条件：不触碰网格边缘的墙色连通分量才是真正的障碍物，触碰边缘的反而是装饰。这完全颠覆了当前的识别逻辑，解题者需要从示例中推断出反直觉的规则。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D6
    name: "装饰墙处理规则"
    tag: transform
    current: "可达区域外的装饰墙擦除为背景色，可达区域内的装饰墙保留为墙色"
    alternatives:
      - name: "所有装饰墙均保留"
        description: "不擦除任何装饰墙，无论在可达区域内还是外。输出中装饰墙全部保持原样。这简化了变换规则，但保留了结构墙/装饰墙的识别需求（因为边界涂色仅与结构墙相关）。"
        source: inversion
        source_task: null
        delta_lines: -5
      - name: "装饰墙变色而非擦除"
        description: "不可达侧的装饰墙不是擦除为背景色，而是变为另一种颜色（如绿色或灰色）。这让解题者明确看到装饰墙被'标记'而非消失，输出中的信息更丰富，也增加了颜色变换规则的推理。"
        source: recolor
        source_task: 271d71e2
        delta_lines: 10
      - name: "装饰墙被边界色环绕"
        description: "可达区域内的装饰墙不仅保留，还在其4-邻接的背景像素上涂边界色（形成小型环绕效果）。这让装饰墙也参与输出的涂色逻辑，使得输出图案中出现多个独立的小边界环。"
        source: surround
        source_task: 71e489b6
        delta_lines: 20

  - id: D7
    name: "结构墙形状多样性"
    tag: obstacle
    current: "结构墙可为垂直/水平线段、矩形、钻石形、三角形等形状，每个触碰至少一条网格边缘"
    alternatives:
      - name: "仅允许直线（水平或垂直线段）"
        description: "结构墙限制为纯水平或纯垂直的线段，不允许矩形块或不规则形状。这让可达区域的形状更规则（总是由正交线段和网格边缘围成的多边形），降低了形状复杂度但可能使规则更易于理解。"
        source: inversion
        source_task: null
        delta_lines: -10
      - name: "L形或阶梯形墙壁"
        description: "每个结构墙为L形或阶梯形（由2段正交线段组成），而非简单的直线或矩形。这使得可达区域的边界更复杂，内边界环的形状更不规则，解题者需要追踪更复杂的几何边界。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "单个大型墙壁（而非多个小墙壁）"
        description: "整个网格只有一个大型结构墙连通分量（可以是复杂形状），而非多个独立的小墙壁。这简化了墙壁识别但使得可达区域的形状完全由这一个墙壁决定。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "墙壁形成闭合框架"
        description: "结构墙形成一个完全闭合的矩形框架（仅有一个开口供洪填进入），可达区域为框架内部。这创造了更直观的'房间内部'概念，内边界就是框架开口的补全加框架内壁。"
        source: frame_completion
        source_task: a6f40cea
        delta_lines: 30

  - id: D8
    name: "洪填连通性"
    tag: path
    current: "4-连通洪填（只通过上下左右邻居扩展），8-邻接用于判断结构墙附近的边界像素"
    alternatives:
      - name: "8-连通洪填"
        description: "洪填改用8-连通（包括对角线邻居），可达区域可以通过墙壁的对角线缝隙渗透。这使得墙壁需要在对角线方向上也封堵才能有效阻挡，大幅改变了可达区域的形状，也改变了墙壁布局的设计约束。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "4-连通洪填但边界判定用4-邻接"
        description: "洪填保持4-连通，但边界像素的判定也改为4-邻接（而非当前的8-邻接结构墙检测）。这使得墙壁对角线方向的像素不涂边界色，边界环变得更稀疏。解题者需要注意邻接规则的细微差别。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "混合连通性（方向相关）"
        description: "洪填在水平方向用4-连通，在垂直方向用8-连通（或反过来）。这创造了各向异性的可达区域，水流在某些方向比其他方向更容易渗透，增加了空间推理的不对称性。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D9
    name: "输出网格形状"
    tag: grid_shape
    current: "输出与输入尺寸完全相同（same size），在原网格上修改像素"
    alternatives:
      - name: "裁剪到可达区域外接矩形"
        description: "输出仅保留包含整个可达区域的最小外接矩形，去掉完全不可达的行/列。解题者需要不仅理解涂色规则还要确定正确的裁剪边界。"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 15
      - name: "仅输出边界环（移除内部和墙壁）"
        description: "输出网格中只保留涂橙色的边界像素和墙壁像素，可达区域内部和不可达区域都变为背景色。这测试解题者是否精确理解哪些像素是边界。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "二值化输出（可达/不可达）"
        description: "输出不涂橙色边界，而是将所有可达像素涂为一种颜色，不可达像素涂为另一种颜色，形成二值化分区图。这简化了涂色逻辑但需要解题者理解洪填的完整结果。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D10
    name: "多步处理/迭代逻辑"
    tag: multi_step
    current: "两步洪填——第一次洪填（仅穿过背景和标记）确定reach0，用于识别结构墙；第二次洪填（还可穿过装饰墙）确定最终可达区域reach"
    alternatives:
      - name: "单次洪填（无两步区分）"
        description: "仅做一次洪填，所有墙色像素均视为障碍（不区分结构/装饰）。这简化了处理流程，但要求输入中不存在任何装饰墙（或装饰墙使用不同颜色）。降低了推理复杂度。"
        source: inversion
        source_task: null
        delta_lines: -20
      - name: "迭代洪填（逐层扩展）"
        description: "洪填不是一次完成，而是分多步迭代——每步扩展1像素的距离。每一步的新增像素涂不同颜色，形成从标记向外的渐变距离场。最终输出呈现彩色等高线效果。"
        source: multi_step
        source_task: 271d71e2
        delta_lines: 30
      - name: "先涂边界再擦除装饰"
        description: "反转当前的两步处理顺序：先在所有墙色像素（含装饰）周围涂边界，再通过洪填识别并擦除不可达装饰墙及其关联的错误边界。解题者需要理解擦除步骤的依据——哪些边界是多余的。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "链式传播：边界涂色触发邻近区域"
        description: "第一步从标记洪填并涂内边界。然后检查边界像素是否邻接另一个被不同墙壁围成的区域——如果是，该区域也被涂内边界（使用不同颜色），形成链式传播。解题者需要理解区域间的连锁关系。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 35

  - id: D11
    name: "结构墙数量与空间布局"
    tag: obstacle
    current: "1-4个结构墙连通分量，每个触碰至少一条网格边缘，总墙像素占网格面积的5-15%"
    alternatives:
      - name: "恰好1个结构墙"
        description: "限制为恰好一个结构墙连通分量（如一条从顶部向下延伸的垂直线）。可达区域形状简单，边界环形态规则。降低了结构识别的复杂度，适合作为入门级难度。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "5-8个小型结构墙"
        description: "增加结构墙数量至5-8个但每个很小（2-4像素），密集分布在网格中。可达区域被多个小障碍切割出复杂的锯齿形边界，边界环变得高度不规则。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "结构墙形成迷宫"
        description: "结构墙不是独立分量，而是互相连接形成简单迷宫。可达区域为迷宫的通道区域，内边界沿通道壁涂色。这大幅增加了空间复杂度，输出呈现迷宫内壁涂色的效果。"
        source: corridor_following
        source_task: 332f06d7
        delta_lines: 35

  - id: D12
    name: "可达区域比例约束"
    tag: meta
    current: "可达区域占网格面积的38-87%，且内部深度>=2像素（确保边界环内有可见的背景内部）"
    alternatives:
      - name: "小可达区域（15-35%）"
        description: "缩小可达区域比例，结构墙占据大部分网格。可达区域变成被墙壁围成的小房间，边界环紧凑。解题者面对的是大量墙壁中辨识小区域的任务，视觉上与当前差异明显。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "几乎全可达（90-98%）"
        description: "结构墙非常少且小，可达区域几乎覆盖整个网格。边界环基本沿网格四周和少量墙壁延伸。输出看起来像'几乎全橙边框'中嵌入少量墙壁凸起。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "可达区域必须为凸形"
