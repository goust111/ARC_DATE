task_id: 16b78196
task_type: move_to_match
summary: "将散落的彩色精灵拼插到中央横杆/竖杆的缺口中，形成链式拼接结构，每条链沿固定宽度的条带向外生长，后续精灵填充前一精灵外接矩形中的空腔"

dimensions:
  - id: D1
    name: "匹配条件：形状嵌合 vs 其他匹配逻辑"
    tag: match_cond
    current: "s.shape fits into d.notch.shape — 精灵形状恰好填充杆上缺口的形状"
    alternatives:
      - name: "颜色匹配决定插入位置"
        description: "缺口边缘带有颜色提示像素，精灵必须插入与自身颜色匹配的缺口。这改变了推理重心：从几何形状匹配变为颜色对应关系，解题者需先建立颜色映射再定位"
        source: color_match
        source_task: 2c181942
        delta_lines: 30
      - name: "旋转/翻转后形状匹配"
        description: "允许精灵旋转90/180/270度或翻转后嵌入缺口，大幅增加搜索空间。解题者不仅要识别形状对应，还需推断正确的变换方式，类似真正的拼图"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 45
      - name: "边缘轮廓匹配（拼图齿合）"
        description: "精灵的一条边缘轮廓必须与目标缺口的内轮廓互补对齐，类似拼图的齿合。不要求整体形状完全一致，而是边缘 profile 吻合即可，更接近真实拼图的匹配逻辑"
        source: edge_matching
        source_task: 7b3084d4
        delta_lines: 40
      - name: "连接器颜色+形状双重匹配"
        description: "精灵和缺口各带有一个小型连接器标记（特定颜色的突出像素），匹配时需连接器的颜色和形状同时对应。增加了多条件联合推理的复杂度"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 35

  - id: D2
    name: "源对象：散落精灵的类型与属性"
    tag: src
    current: "单色连通精灵，面积8-13，外接矩形填充率0.54-0.80，不旋转不翻转，散布在杆两侧"
    alternatives:
      - name: "多色复合精灵"
        description: "每个精灵包含两种颜色——外轮廓色和内填充色。匹配时用外轮廓形状对齐缺口，放置后内填充色保留。解题者需区分两层信息，增加视觉分析难度"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "精灵带锚点标记"
        description: "每个精灵有一个特殊颜色的锚点像素，用于对齐缺口中的对应标记点。形状匹配降级为辅助条件，锚点对齐成为主要定位依据"
        source: anchor_points
        source_task: 4c416de3
        delta_lines: 30
      - name: "精灵为中空框架"
        description: "源对象从实心精灵变为带洞的中空框架，洞的形状在链式拼接中与下一层精灵匹配。视觉上更复杂，解题者需理解嵌套的洞-形关系"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 25

  - id: D3
    name: "目标结构：中央杆与缺口的设计"
    tag: dst
    current: "全幅横杆或竖杆（厚度5-7），带6-9个边界缺口（面积1-10，深度1-2），其中1-2个为有效缺口，其余为干扰缺口"
    alternatives:
      - name: "十字形框架替代直线杆"
        description: "目标结构从单条直线杆变为十字形框架，缺口分布在四个方向的臂上。链可以从四个方向生长，空间推理从一维扩展到二维，增加了方向判断的复杂度"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "杆上缺口带颜色填充提示"
        description: "每个缺口的边缘像素不是杆色而是用不同颜色标记，暗示应插入的精灵颜色。将纯几何匹配增强为几何+颜色双重约束"
        source: border_color_match
        source_task: d35bdbdc
        delta_lines: 25
      - name: "多层嵌套框架"
        description: "不是单个杆而是两个同心矩形框架（内框和外框），精灵需先填入外框缺口再延伸到内框缺口。引入空间层次关系，解题者需理解由外到内的嵌套顺序"
        source: socket_fitting
        source_task: 8b9c3697
        delta_lines: 55
      - name: "缺口深度可变（1到杆厚一半）"
        description: "缺口深度从当前的1-2扩展到可深入杆体厚度一半，形成更深的插槽。精灵需更大面积填充深槽，链式生长的起点位置更多样"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D4
    name: "链式拼接的多步处理逻辑"
    tag: multi_step
    current: "1-2条独立链从不同缺口向外生长，每链2-3个精灵，后续精灵填充前一精灵bbox中的空腔并继续延伸"
    alternatives:
      - name: "双向生长链"
        description: "链不仅从杆向外生长，也可以从杆的另一侧同时向内生长（穿过杆），形成贯穿杆的完整通道。解题者需理解双向对称的拼装逻辑"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "分叉链（树状拼接）"
        description: "某个中间精灵有两个空腔，可同时接收两个不同精灵，形成Y形分叉。从线性链升级为树状结构，搜索空间显著增大"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "有序拼装（按颜色深浅排序）"
        description: "链中精灵必须按颜色亮度（色号从小到大或从大到小）排列。解题者除了形状匹配还需推断颜色排序规则，多一层隐含约束"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 20
      - name: "单条长链替代多条短链"
        description: "取消多链结构，改为单条4-6块的长链从一个缺口生长。增加链深度降低链宽度，测试解题者对更长依赖关系的追踪能力"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D5
    name: "变换：放置后的颜色或形状变化"
    tag: transform
    current: "无变换——精灵保持原色原形直接放置到目标位置"
    alternatives:
      - name: "放置后重新着色为杆色"
        description: "精灵插入缺口后颜色变为杆色，与杆融合。输出中链区域与杆同色，只能通过形状轮廓判断拼装是否正确。视觉上大幅不同，测试解题者对隐含结构的理解"
        source: recolor
        source_task: 20270e3b
        delta_lines: 15
      - name: "精灵间颜色交换"
        description: "相邻链上的精灵在拼装后交换颜色。解题者需先推断匹配关系，再应用颜色交换规则，增加一层逻辑推理"
        source: color_swap
        source_task: a25697e4
        delta_lines: 25
      - name: "根据链中位置渐变着色"
        description: "链中第一个精灵保持原色，后续精灵的颜色按固定映射关系变化（例如根据输入中精灵颜色在调色板中的位置偏移）。引入颜色变换规则的推断"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 30

