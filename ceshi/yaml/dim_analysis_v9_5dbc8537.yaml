        source: inversion
        source_task: null
        delta_lines: 10
      - name: "精灵用分隔线隔开"
        description: "精灵之间用特定颜色的单像素分隔线（如红色线）分隔，而非背景色间隔。分隔线本身成为可视的结构元素，解题者需要识别分隔线并忽略它"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "精灵间距编码信息"
        description: "精灵之间的间距（1-3格不等）编码了填充顺序——间距越小的精灵优先填入。这在有相同尺寸精灵时提供额外的排序消歧信息"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D14
    name: "多步处理序列"
    tag: multi_step
    current: "单步处理：识别精灵和洞后一次性匹配填充"
    alternatives:
      - name: "分层递进填充"
        description: "精灵分为两层（由颜色类型区分），第一层精灵先填入后改变洞的形状，第二层精灵再匹配新形成的洞。解题者需要理解填充顺序对后续洞形状的影响，增加了时序推理"
        source: creative
        source_task: null
