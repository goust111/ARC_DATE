task_id: 5dbc8537
task_type: move_to_match
summary: "将散落在模板外部的矩形精灵按外接矩形尺寸匹配并填入模板框架内的矩形洞中，输出紧裁后的填充模板"

dimensions:
  - id: D1
    name: "匹配条件：精灵与洞的对应方式"
    tag: match_cond
    current: "s.bbox == d.rect — 精灵外接矩形尺寸与洞的矩形尺寸完全相等（shape_match）"
    alternatives:
      - name: "颜色边缘匹配"
        description: "洞的边缘带有一圈颜色提示像素，精灵必须匹配到边缘颜色相同的洞中。当多个洞尺寸相同时，通过边缘颜色消歧，增加推理层次——解题者需同时关注形状与颜色两个维度"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 25
      - name: "旋转/翻转后形状匹配"
        description: "精灵的外接矩形可能需要旋转90度或翻转后才能嵌入洞中，洞不再是简单矩形而是L形或不规则形状。解题者需要在心中旋转/翻转精灵来寻找匹配，显著增加空间推理难度"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 35
      - name: "连接器颜色匹配"
        description: "每个精灵带有一个标记色像素作为连接器，洞的对应位置也有相同颜色的标记像素。匹配条件从纯形状变为连接器颜色+形状的双重匹配，使得相同尺寸的精灵可以通过连接器颜色消歧"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 30
      - name: "面积排序匹配"
        description: "精灵按面积从小到大排序后，依次对应洞按某个空间顺序（如从左到右、从上到下）排列的位置。解题者需要先排序精灵面积，再确定洞的空间排列顺序，推理过程从几何匹配变为序关系推断"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 20
      - name: "洞内计数匹配"
        description: "每个洞内部散布一些标记像素（如黑色点），精灵上也有相同数量的标记像素。匹配条件为标记像素数量相等而非形状相等。需要解题者逐个计数并配对，增加认知负荷"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 30

  - id: D2
    name: "精灵来源结构与属性"
    tag: src
    current: "散落在模板外接矩形外部的全填充矩形精灵，每个精灵是完整矩形（bbox内无背景色），含1-2种非背景色，部分为1x1黑色标记点"
    alternatives:
      - name: "非矩形不规则精灵"
        description: "精灵不再是全填充矩形，而是含有内部背景色像素的不规则形状（如L形、T形等）。洞也变为对应的不规则形状。解题者需要进行更复杂的形状匹配，从简单矩形匹配升级为拼图式推理"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "精灵带有空心框架"
        description: "精灵本身是小型空心矩形框架（外圈有颜色，内部为背景色），需要根据框架外形与洞匹配后填入。视觉上精灵和模板都有'洞'，增加视觉辨识的复杂度"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 25
      - name: "对角线标记精灵"
        description: "精灵不以独立连通分量形式存在，而是以对角线像素对的形式出现——两个相同颜色像素位于矩形的对角。精灵的实际形状由对角像素确定的矩形区域定义。解题者需要识别对角关系并推断出隐含矩形"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 35
      - name: "多层嵌套精灵"
        description: "每个精灵由多层颜色嵌套组成（如最外层颜色A，内层颜色B，核心颜色C），匹配时按最外层颜色或嵌套层数进行消歧。这增加了精灵内部结构的复杂性，需要更深入的颜色层次分析"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D3
    name: "目标洞的结构与分布"
    tag: dst
    current: "模板框架内的矩形洞区域，所有洞形成单个4-连通的连续背景色区域，洞总面积精确等于所有精灵面积之和（完美拼贴）"
    alternatives:
      - name: "多框架分布"
        description: "不再是单个大模板框架，而是多个独立的小框架分散在网格中，每个框架内有一个或多个洞。精灵需要先确定属于哪个框架，再确定填入哪个洞。增加了框架归属这一推理层次"
        source: jigsaw_assembly
        source_task: 8698868d
        delta_lines: 40
      - name: "洞区域有冗余空间"
        description: "洞的总面积大于所有精灵面积之和，填充后仍留有一部分背景色区域。解题者不能依赖'完美拼贴'约束来唯一确定放置方案，必须通过形状匹配来确定正确位置，增加了不确定性"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "洞内有引导标记"
        description: "每个洞内部有一个或多个颜色标记像素（角落或边缘），精灵需要与这些标记像素对齐。洞不再是纯背景色，而是包含对齐提示，将纯形状匹配变为标记对齐问题"
        source: marker_alignment
        source_task: 581f7754
        delta_lines: 25
      - name: "嵌套洞结构"
        description: "模板框架中的洞不是简单的矩形区域，而是洞中有洞——大洞内部嵌套着小的基底色岛屿，形成更复杂的拓扑结构。精灵需要恰好匹配这些含岛洞的形状，增加空间推理复杂度"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D4
    name: "填充变换方式"
    tag: transform
    current: "将精灵原样粘贴到匹配的洞中（精灵的背景色像素被基底色替换），输出为紧裁后的模板外接矩形"
    alternatives:
      - name: "颜色重映射"
        description: "精灵填入洞后需要将颜色按规则重映射——例如精灵的主色变为洞边缘提示色，或按照某种颜色对应表替换。解题者需要额外推断颜色变换规则，从纯拼图变为拼图+颜色变换的双重推理"
        source: recolor
        source_task: 20270e3b
        delta_lines: 20
      - name: "旋转后填入"
        description: "精灵在填入洞之前需要旋转（90/180/270度），旋转方向由某种规则决定（如洞的位置相对于模板中心的方位）。增加了空间变换推理的维度"
        source: rotation
        source_task: 2c181942
        delta_lines: 25
      - name: "颜色互换填入"
        description: "双色精灵在填入后需要交换两种颜色。解题者需要观察示例中精灵色与填入后的颜色差异，推断出'交换'这一变换规则"
        source: color_swap
        source_task: a25697e4
        delta_lines: 15
      - name: "镜像翻转填入"
        description: "精灵填入洞时需要水平或垂直镜像翻转，翻转轴由精灵在模板中的相对位置决定（如在模板上半部的精灵水平翻转，下半部的垂直翻转）。增加了方位相关的空间推理"
        source: reflection
        source_task: b10624e5
        delta_lines: 20

  - id: D5
    name: "轨迹与源保留"
    tag: trajectory
    current: "精灵从外部移入洞中后消失（默认行为），输出仅包含填充后的模板"
    alternatives:
      - name: "保留源精灵"
        description: "精灵复制到洞中后，原始位置的精灵保持不变，输出为完整网格而非紧裁。解题者需要识别'复制'而非'移动'语义，输出包含原始精灵与填充后模板共存的画面"
        source: keep_source
        source_task: 247ef758
        delta_lines: 15
      - name: "移动轨迹涂色"
        description: "精灵从原位移动到洞时，沿路径留下特定颜色的轨迹线。输出为完整网格，包含轨迹、原位标记和填充后模板。增加了路径推理维度"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 30
      - name: "源位置标记替换"
        description: "精灵移入洞后，原始位置被一个特定颜色的标记矩形替代（如全黑矩形），作为已被使用的标记。输出为完整网格，解题者需要推断标记替换规则"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D6
    name: "输出网格形状"
    tag: grid_shape
    current: "紧裁到模板外接矩形（tight_crop），输出尺寸等于模板的 dh x dw"
    alternatives:
      - name: "保留原始网格"
        description: "输出保持与输入相同的网格尺寸，精灵被移入洞中后原位变为背景色。解题者需要理解'就地填充'而非'裁剪输出'，改变了输出形式的推理"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "紧密打包网格"
        description: "将所有精灵按顺序紧密排列成一个新矩形网格输出（带1像素间隔），不再填入模板而是按排序打包。完全改变输出语义——从拼图变为排序打包"
        source: packed_grid
        source_task: 58f5dbd5
        delta_lines: 30
      - name: "扩展输出区域"
        description: "输出不仅包含模板区域，还向外扩展一圈边框（如2像素宽的基底色边框），使输出略大于模板外接矩形。解题者需推断扩展量的规则"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 15

  - id: D7
    name: "模板框架方向与位置"
    tag: meta
    current: "模板为条带状（全高或全宽），一维等于网格对应维度，另一维7-10格厚，贴靠3条网格边缘，留出L形外部区域放置精灵"
    alternatives:
      - name: "居中浮动模板"
        description: "模板不贴靠网格边缘，而是浮动在网格中央区域，四周均有空间放置精灵。精灵可以从任意方向散落，增加了空间布局的对称性，但解题者需要从四面搜索精灵"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "十字形外部区域"
        description: "模板占据网格一角的矩形区域（而非条带），使外部空间形成L形或十字形。精灵分布在两条臂上，改变了空间分布模式"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "双模板对称布局"
        description: "网格中有两个对称放置的模板框架（如左右或上下对称），每个模板有自己的洞和对应精灵。解题者需要判断哪些精灵属于哪个模板，增加分组推理"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D8
    name: "精灵数量与尺寸范围"
    tag: meta
    current: "7-15个精灵，含1-4个1x1黑色标记点，非标记精灵最大约8x6，精灵外接矩形全填充"
    alternatives:
      - name: "少量大精灵"
        description: "减少到3-5个精灵，每个精灵面积更大（最大可达12x10）。更少的碎片意味着每步匹配更重要，单个错误无法通过其他匹配补救，增加了单步推理的权重"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "大量微小精灵"
        description: "增加到15-25个精灵，大部分为1x1到3x2的微小碎片。虽然单个匹配简单，但数量巨大使搜索空间爆炸，考验解题者的系统性和耐心"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "无标记点精灵"
        description: "移除1x1黑色标记点，所有精灵均为面积大于1的矩形。简化了精灵类型的多样性，但消除了最简单的填充线索"
        source: inversion
        source_task: null
        delta_lines: 8

  - id: D9
    name: "精灵颜色模式"
    tag: meta
    current: "约70-75%单色精灵、25-30%双色精灵（棋盘/点阵/分裂模式），总共使用6-9种精灵色（含黑色标记）"
    alternatives:
      - name: "全部单色精灵"
        description: "所有精灵均为纯单色填充，通过颜色+尺寸组合来消歧。简化了视觉复杂度但可能出现相同颜色相同尺寸的精灵，需要引入位置关系等额外消歧手段"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "全部双色精灵"
        description: "所有精灵均为双色模式（棋盘/条纹/点阵），没有纯单色精灵。增加了颜色模式的丰富性，解题者可以利用颜色模式来辅助匹配"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "颜色梯度编码"
        description: "精灵中的双色采用固定的行/列渐变模式——例如上半为颜色A、下半为颜色B，且A-B组合在同一任务中不重复。解题者可以利用颜色分布方向作为额外的匹配线索"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D10
    name: "洞区域连通性约束"
    tag: meta
    current: "所有洞形成单个4-连通的连续背景色区域（走廊式布局），精灵面积之和精确等于洞面积（完美拼贴）"
    alternatives:
      - name: "多个独立洞区域"
        description: "洞区域不要求4-连通，允许2-3个独立的洞组。每组洞自成一体，精灵需要分别对应各组。增加了分组匹配的推理步骤——先确定精灵属于哪组洞，再确定具体位置"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "洞区域含非矩形子区域"
        description: "洞区域整体是连通的，但不再可以被完美地分割为矩形子区域，而是包含一些L形或其他不规则子区域。精灵也相应变为不规则形状来匹配，大幅增加空间推理难度"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "洞面积溢出"
        description: "洞区域面积比精灵总面积大若干格（预留固定数量的空格），精灵填入后仍有空隙。解题者不能简单利用'面积守恒'来验证方案，必须纯靠形状匹配确定放置"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D11
    name: "基底色确定方式"
    tag: meta
    current: "基底色为排除背景色后的最大连通分量对应的颜色，通过面积唯一确定"
    alternatives:
      - name: "基底色为特定固定色"
        description: "基底色始终为某种固定颜色（如灰色或黑色），而非需要通过连通分量面积推断。简化了基底色识别步骤，使解题者可以直接聚焦于精灵匹配"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "多基底色框架"
        description: "模板框架由两种交替的基底色组成（如条纹式或棋盘式），洞的边缘颜色提供额外的匹配信息。解题者需要先理解双色框架结构，再利用边缘色进行精灵匹配"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "基底色与某精灵同色"
        description: "基底色不唯一——有一种精灵颜色与基底色相同，该精灵在视觉上'隐藏'在框架中。解题者需要发现框架内有一个看似框架一部分的精灵已经就位，增加了观察力测试"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D12
    name: "精灵放置歧义性与搜索策略"
    tag: meta
    current: "使用DFS回溯搜索进行非重叠精灵放置，精灵按面积降序处理，每个精灵可能有多个候选位置但最终有唯一解"
    alternatives:
      - name: "颜色签名唯一化"
        description: "确保每个精灵的颜色组合完全唯一（不同色集或不同色比例），使得仅凭颜色即可确定每个精灵的目标洞，无需回溯搜索。降低了搜索复杂度但增加了颜色识别的重要性"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "贪心匹配（无歧义保证）"
        description: "设计精灵和洞使得每个尺寸组合全局唯一——即不存在两个精灵有相同的(h,w)尺寸。贪心匹配即可求解，简化了算法但对生成器约束更强"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "多步消歧"
        description: "存在多个相同尺寸的精灵，第一轮通过尺寸匹配确定候选，第二轮通过颜色或模式匹配消歧。解题者需要两轮推理才能确定放置，增加了推理深度"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D13
    name: "精灵分离约束"
