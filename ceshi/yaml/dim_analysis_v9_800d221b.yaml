task_id: 800d221b
task_type: transform_in_place
summary: "路径网络中，每条从hub辐射出的分支根据其所接触的种子区域的多数颜色进行重着色，hub中心像素取与hub相邻最多的重着色分支颜色"

dimensions:
  - id: D1
    name: "分支着色规则"
    tag: transform
    current: "每条分支重着色为其所接触种子区域的多数颜色(majority color)"
    alternatives:
      - name: "少数颜色着色"
        description: "取反当前规则：分支重着色为种子区域内的少数颜色(minority color)而非多数颜色。解题者需要正确识别少数颜色而非直觉上的主导颜色，增加了推理的反直觉性。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "种子面积比例混合着色"
        description: "分支不再统一着色为一种颜色，而是按种子内部两种颜色的比例交替着色分支像素（例如多数色占70%，则分支70%像素为多数色、30%为少数色，沿路径方向交替排列）。解题者需要计算比例并正确分配，增加数值推理难度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "种子唯一颜色着色"
        description: "种子区域内部只含一种非P颜色（无少数色混合），分支直接取该颜色。简化了颜色判定逻辑，但配合其他维度变化仍可产生有趣谜题。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "颜色交换着色"
        description: "分支着色为种子区域的多数颜色，但同时种子区域内部的多数色和少数色互换。输入输出同时发生两种变化，解题者需要发现双重规则。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 15

  - id: D2
    name: "hub中心像素着色规则"
    tag: transform
    current: "hub中心像素取与hub边界相邻的重着色分支中出现最多的颜色"
    alternatives:
      - name: "hub中心取最少相邻颜色"
        description: "取反：hub中心像素取与hub边界相邻重着色分支中出现最少的颜色。解题者需要计数后取最小值而非最大值，改变推理方向。"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "hub完全保持路径色"
        description: "hub中心像素也保持原路径色P不变，不做任何重着色。简化规则，但改变了输出模式，解题者需要识别hub是否参与变换。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "hub整体重着色"
        description: "整个hub（3x3方块）都重着色为最多相邻分支颜色，而非仅中心像素。视觉效果更强烈，hub从纯P色变为大块彩色方块。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "hub中心取种子区域数量最多的颜色"
        description: "hub中心不按相邻分支像素计数，而是按与hub连接的种子区域个数投票——哪种颜色连接了更多种子区域就选哪种。解题者需要计数种子而非像素。"
        source: creative
        source_task: null
        delta_lines: 12

  - id: D3
    name: "颜色传播方向"
    tag: transform
    current: "种子区域的颜色传播到分支路径上（种子→分支）"
    alternatives:
      - name: "分支颜色传播到种子"
        description: "取反传播方向：分支保持路径色P不变，而种子区域内部全部重着色为路径色P。视觉效果是种子区域'消失'融入路径网络。解题者需要逆向理解传播。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "双向颜色传播"
        description: "分支取种子多数颜色的同时，种子边框(P色)也变为种子的少数颜色。形成双向变换，增加规则复杂度。"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "种子传播到相邻背景"
        description: "分支保持P色不变，但种子的多数颜色向种子外围的背景像素扩散一层（flood fill一步）。解题者需要识别扩散范围。"
        source: flood_fill
        source_task: dbff022c
        delta_lines: 20

  - id: D4
    name: "源对象类型：路径网络结构"
    tag: src
