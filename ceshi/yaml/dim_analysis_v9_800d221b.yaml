    alternatives:
      - name: "多hub网络"
        description: "网络中有2个hub（两个3x3方块），分支连接种子到最近的hub。解题者需要判断每条分支属于哪个hub管辖，增加空间推理。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "无hub星形网络"
        description: "没有显式hub方块，所有路径从一个中心交汇点（单像素）辐射出去。hub的识别变为找到度数最高的像素点。简化结构但改变识别策略。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "树形分支网络"
        description: "路径允许T形分叉（一条路径在中途分成两条），形成树状结构而非简单链。每个分叉后的子分支独立着色。解题者需要正确分割树形结构。"
