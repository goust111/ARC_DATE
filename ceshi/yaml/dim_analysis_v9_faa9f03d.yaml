task_id: faa9f03d
task_type: transform_in_place
summary: "修复由单像素标记（红/黄）标识的单像素宽彩色折线网络：将标记替换为对应线色、填充面对的间隙、按黄色控制像素方向擦除旧臂并延伸到网格边缘，交叉处按碎片度消歧"

dimensions:
  - id: D1
    name: "核心变换：间隙填充与射线重定向"
    tag: transform
    current: "红色标记处恢复线色并填充面对端点间的间隙；黄色标记处擦除旧臂并从端点通过标记延伸到网格边缘"
    alternatives:
      - name: "仅填充间隙，不做射线重定向"
        description: "移除黄色控制像素的射线擦除/延伸机制，所有标记统一执行间隙填充。简化推理步骤但保留标记分配和间隙识别的核心挑战，解题者只需推断填充规则而无需区分两种标记行为"
        source: inversion
        source_task: null
        delta_lines: 40
      - name: "射线截断而非延伸到边缘"
        description: "黄色控制不是将线延伸到网格边缘，而是将线截断到标记位置为止（即标记之后的部分被擦除）。反转了延伸方向，解题者需要识别哪部分被移除、哪部分保留，推理方向相反"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "反射而非擦除旧臂"
        description: "黄色控制不擦除旧臂，而是将旧臂以端点为中心反射到垂直方向（如水平臂变垂直臂）。保留了方向性推理但变换机制完全不同，解题者需要识别90度旋转模式"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 35
      - name: "间隙填充使用特殊色而非原线色"
        description: "填充间隙时不用原线色，而是用与两端线色不同的第三种颜色（如灰色），仅在输出中显示修复痕迹。解题者需要额外推断填充色的选择规则，增加颜色推理维度"
        source: branch_recoloring
        source_task: 800d221b
        delta_lines: 25

  - id: D2
    name: "源对象：线网络结构"
    tag: src
    current: "单像素宽的直角折线网络（每色1-4个连通分量，每分量0-6个转角），端点必须到达网格边界且垂直于边缘"
    alternatives:
      - name: "允许对角线段（45度折线）"
        description: "折线不限于水平/垂直，也允许45度对角线段。线段可沿对角方向延伸，间隙填充和交叉检测需要处理对角邻接。增加了几何复杂性，解题者需要在更多方向上识别面对端点"
        source: diagonal_hint
        source_task: 7b80bb43
        delta_lines: 60
      - name: "端点不必到达网格边界（内部悬挂端点）"
        description: "折线端点可以在网格内部终止，不强制延伸到边缘。这使得线网络更自由，但解题者需要区分哪些是真正的端点、哪些是被标记切断的断点，增加端点识别难度"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "2像素宽的线条"
        description: "线条从单像素宽变为2像素宽的带状结构，标记仍为单像素。间隙填充、交叉检测和标记分配都需要适应更宽的线条，视觉上线条更明显但空间更拥挤"
        source: pixel_enlargement
        source_task: bf45cf4b
        delta_lines: 50

  - id: D3
    name: "标记类型与角色分化"
    tag: symbol_instructions
    current: "红色(2)为缺失线色像素的间隙标记，黄色(4)为方向控制标记（擦除旧臂并延伸到边缘）；两者都是单像素"
    alternatives:
      - name: "三种标记颜色，增加第三种功能"
        description: "增加第三种标记颜色（如粉色），用于标识交叉点处的优先色覆盖（强制某颜色在交叉处胜出）。解题者需要推断三种标记各自的功能，增加符号解码维度"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "标记为2x1或1x2的双像素对"
        description: "标记不是单像素而是相邻的2像素对，双像素的排列方向（水平/垂直）编码了间隙填充的方向（仅在该方向填充）。解题者需要同时读取标记位置和朝向，增加空间编码信息"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "统一标记颜色，由位置区分功能"
        description: "所有标记使用同一颜色，通过位置判断功能：位于折线转角处为间隙标记，位于端点旁为方向控制。解题者不能依赖颜色区分，必须通过空间上下文推断标记功能"
        source: inversion
        source_task: null
        delta_lines: 30

  - id: D4
    name: "标记到线色的分配规则"
    tag: transform
    current: "标记沿四个正交方向扫描，分配给最近可见的线色，优先选择沿该轴有邻接支撑的端点"
    alternatives:
      - name: "分配给最远可见线色而非最近"
        description: "标记分配给视线方向上最远的线色而非最近的。反转了距离优先级，解题者需要识别'最远可达'这一反直觉规则，增加推理难度"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "标记颜色编码目标线色"
        description: "不通过空间扫描分配，而是直接用标记的颜色值编码目标线色（如红色标记对应颜色2的线）。简化了分配推理但需要颜色映射表，类似 legend 机制"
        source: seed_propagation
        source_task: 800d221b
        delta_lines: 25
      - name: "按标记与线的曼哈顿距离全局最优匹配"
        description: "所有标记和线端点做全局最小距离匹配（类似二分匹配），而非逐个标记独立扫描。解题者需要考虑全局最优配对，推理从局部变为全局"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D5
    name: "交叉处的颜色消歧规则"
    tag: transform
    current: "黄色控制射线优先；否则原始交叉处选碎片度更高的颜色（pre-repair连通分量更多者胜出），纯填充交叉选较小颜色ID"
    alternatives:
      - name: "交叉处选碎片度更低的颜色（更完整者胜出）"
        description: "反转碎片度规则：在交叉处显示连通分量更少（更完整）的线色。解题者的消歧推理完全翻转，需要识别'完整优先'而非'碎片优先'"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "交叉处选线段更长的颜色"
        description: "不按碎片度而按经过交叉点的线段局部长度消歧（较长段胜出）。解题者需要度量局部长度而非全局碎片度，推理从全局统计变为局部几何"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "交叉处两色交替显示（棋盘格模式）"
        description: "多个交叉点上两种颜色按棋盘格模式交替显示（而非统一一色），解题者需要识别交替模式并推断下层完整线条。增加了视觉复杂性和模式识别需求"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D6
    name: "间隙填充条件判断"
    tag: transform
    current: "面对的端点间隙填充需要两端有轴向支撑（gap>1时两端都需要支撑，gap=1时放宽条件）；两端都是标记的不填充"
    alternatives:
      - name: "仅填充固定长度以内的间隙"
        description: "不检查端点支撑，而是仅当间隙长度不超过阈值k（如k=3）时填充。简化了条件判断但引入了数值阈值推断，解题者需要从样例中推断最大填充长度"
        source: gap_filling
        source_task: 7b80bb43
        delta_lines: 15
      - name: "所有同色同行/同列像素间均填充"
        description: "移除端点支撑检查和间隙长度限制，同色像素在同一行/列上的任意间隙都填充。大幅简化填充规则但可能产生过多填充，解题者需要识别这一激进策略"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "仅在标记两侧填充（标记夹持条件）"
        description: "间隙仅在两端都有标记时才填充（与当前规则相反——当前两端都是标记时反而不填充）。这要求标记成对出现才能触发填充，解题者需要理解标记的'夹持'角色"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D7
    name: "输出网格形状"
    tag: grid_shape
    current: "输出与输入尺寸相同（12x12），原地修复"
    alternatives:
      - name: "裁剪到修复区域的紧凑外接矩形"
        description: "输出仅包含所有非背景像素的最小外接矩形，去除空白边缘。解题者需要同时推断修复规则和裁剪范围，增加了空间推理步骤"
