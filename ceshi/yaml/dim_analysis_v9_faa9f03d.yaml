  - id: D15
    name: "端点支撑判断逻辑"
    tag: meta
    current: "端点的轴向支撑（axis_support）通过检查沿行/列方向是否有相邻同色像素判断；垂直支撑（perp_support）用于gap=1的特殊条件"
