        source_task: 88bcf3b4
        delta_lines: 30
      - name: "黄色控制将整条折线在端点处反射"
        description: "黄色标记触发以端点为中心的折线局部反射（镜像翻折），而非简单的直线延伸。解题者需要理解反射几何，推理更复杂"
