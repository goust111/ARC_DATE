        source: pixel_enlargement
        source_task: bf45cf4b
        delta_lines: 15

  - id: D8
    name: "线色数量与调色板"
    tag: meta
    current: "2-4种线色（从{1,3,5,6,7,8,9}中选取），不使用红(2)和黄(4)"
    alternatives:
      - name: "仅2种线色（最小复杂度）"
        description: "固定使用恰好2种线色，减少颜色交互的复杂度但增大每条线的长度和转角数。解题者更容易追踪颜色但交叉消歧规则更难验证（只有一种交叉组合）"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "5-6种线色（高密度网络）"
        description: "增加线色数到5-6种，需要更大网格（如16x16或20x20）。线网络更密集、交叉更多，解题者需要追踪更多颜色的修复路径，视觉和推理复杂度显著提升"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D9
    name: "折线的几何约束"
    tag: meta
    current: "直角折线（rectilinear polylines），每分量0-6个转角，每色1-4个连通分量，端点垂直于边界"
    alternatives:
      - name: "纯直线段（无转角）"
        description: "所有折线退化为无转角的纯水平或垂直直线段。简化几何结构但需更多线条来填满网格，间隙填充变为一维问题，推理更简单但可作为入门级变体"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "T形/十字形交叉节点"
        description: "允许同色线在某些点形成T形分叉（degree=3），不再严格限制degree<=2。这使得网络从路径变为树，间隙填充和标记分配需要处理分支结构，大幅增加推理复杂度"
        source: hub_and_branch
        source_task: 800d221b
        delta_lines: 45

  - id: D10
    name: "多步处理序列"
    tag: multi_step
    current: "隐含多步：(1)标记分配→(2)间隙填充→(3)黄色控制执行→(4)交叉消歧"
    alternatives:
      - name: "迭代修复直到收敛"
        description: "间隙填充后产生新的面对端点，需要再次填充，反复迭代直到没有新间隙可填。解题者需要推断迭代终止条件，从单步变为收敛型多步推理"
        source: multi_step
        source_task: 28a6681f
        delta_lines: 25
      - name: "按距离从近到远逐步修复"
        description: "先修复距标记最近的间隙，然后是次近的，每步修复后重新计算端点状态。修复顺序影响最终结果，解题者需要识别距离优先的处理序列"
        source: multi_step
        source_task: 3e6067c3
        delta_lines: 30
      - name: "先执行黄色控制再填充间隙"
        description: "反转处理顺序：先执行黄色控制的臂擦除和延伸，再进行红色标记的间隙填充。处理顺序不同可能导致不同的交叉消歧结果，解题者需要推断正确的执行顺序"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D11
    name: "交叉结构约束"
    tag: meta
    current: "每个交叉格仅两色重叠，所有线色都必须参与至少一个交叉，交叉处两线必须正交"
    alternatives:
      - name: "允许三色交叉"
        description: "允许某些格子有三条不同颜色的线重叠，消歧规则需要扩展到三色选择。视觉上更复杂，解题者需要推断更复杂的优先级规则"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "不要求所有线色参与交叉"
        description: "某些线色可以完全独立（不与其他线交叉），移除'每色至少一个交叉'的约束。这允许更灵活的网络布局，解题者需要处理有交叉和无交叉线色的混合情况"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "交叉处显示两色混合标记"
        description: "交叉处不选择一色显示，而是用特殊颜色（如灰色）标记交叉位置，解题者需要从周围上下文推断两条线的颜色。类似于遮挡恢复问题"
        source: creative
        source_task: null
        delta_lines: 20

