        source: creative
        source_task: null
        delta_lines: 50
      - name: "开口方向由齿颜色编码"
        description: "所有结构朝同一默认方向开口，但齿的颜色编码了实际的滑入方向（如颜色1=从左，颜色4=从上等）。解题者需先解码颜色-方向映射，再执行滑入操作。增加符号推理层。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D8
    name: "齿的数量与形状"
    tag: meta
    current: "每个结构有1-3个连续的齿（teeth），齿决定了插槽宽度和匹配红色的形状（min(teeth,2) x teeth）"
    alternatives:
      - name: "非连续齿（间隔齿）"
        description: "齿不再是连续排列，而是间隔分布（如齿-空-齿-空-齿）。红色色块的形状需匹配齿的间隔模式。从连续矩形匹配升级为间隔模式匹配，增加空间模式识别难度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "齿的数量决定滑入距离"
        description: "取反当前齿数仅决定形状的规则：齿的数量同时编码了红色色块的滑入距离（如1齿=滑4格，2齿=滑6格，3齿=滑8格）。增加数值推理层，解题者需从齿数推断移动距离。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "多色齿"
        description: "齿不再使用统一的结构色，每颗齿可以有不同颜色。红色色块需匹配特定颜色组合的齿。从单色匹配升级为颜色模式匹配，增加推理复杂度。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D9
    name: "滑入距离与路径"
    tag: meta
    current: "红色色块从原始位置直线滑入插槽，滑入距离4-8格，路径上必须全是背景色（无障碍物）"
    alternatives:
      - name: "路径上有障碍物需绕行"
        description: "滑入路径上可能存在其他颜色的障碍物像素。红色色块需绕行障碍物（在障碍物前一格转弯，绕过后继续向目标滑行），轨迹变为折线。大幅增加路径推理复杂度。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "固定滑入距离（由结构宽度编码）"
        description: "取消随机滑入距离：滑入距离由结构后壁宽度决定（如宽度-2=距离）。解题者可以从结构几何参数推断出精确的滑入距离，增加数值关系推理。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "弹跳轨迹"
        description: "红色色块不是直线滑入，而是像弹球一样在碰到边界时反弹，最终停在插槽中。轨迹在每次反弹处改变方向。需要多步路径推理，类似反射问题。"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D10
    name: "结构数量与匹配基数"
    tag: multi_step
    current: "2-3个结构，每个结构最多匹配1个红色色块（1:1），可选地有1个未匹配结构（35%概率）"
    alternatives:
      - name: "多对一匹配（多个红色→同一结构）"
        description: "一个大型结构可以有多个独立插槽，分别匹配不同的红色色块。从1:1变为N:1基数，每个色块独立滑入自己的插槽。解题者需理解同一结构内的多个匹配关系。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "链式顺序处理"
        description: "多个结构按特定顺序处理（如从左到右），前一个结构的匹配结果影响后续结构的可用红色色块池。先处理的结构有更多候选色块可选。增加处理顺序推理。"
        source: multi_step
        source_task: "3e6067c3"
        delta_lines: 20
      - name: "迭代嵌套处理"
        description: "第一轮匹配后，已停靠的红色色块本身变成新的'结构'，可以接收更小的红色色块。迭代直到无法继续匹配。引入递归/迭代推理，大幅增加解题复杂度。"
        source: multi_step
        source_task: "16b78196"
        delta_lines: 40

  - id: D11
    name: "干扰项分布约束"
