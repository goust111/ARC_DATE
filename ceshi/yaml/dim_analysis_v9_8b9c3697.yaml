      - name: "干扰项具有特殊标记色"
        description: "干扰项不再使用红色，而是使用一种特殊颜色（如黄色）。所有红色都是有效匹配项，无需排除干扰。简化干扰判断但需推理颜色类别差异。输出中黄色干扰项可能保留或变化。"
