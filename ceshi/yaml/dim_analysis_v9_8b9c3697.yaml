        source_task: "20270e3b"
        delta_lines: 15
      - name: "分离面板输出"
        description: "每个结构及其匹配结果分别裁剪为独立面板，按行排列并用分隔符连接。输出变为多个子网格的拼合，解题者需理解面板分离逻辑。"
        source: frame_separation
        source_task: "5545f144"
        delta_lines: 30
      - name: "仅输出结构内部区域"
        description: "输出仅包含每个结构的外接矩形内部内容，去除结构外部所有像素。类似打包网格，每个结构区域紧密排列。解题者需理解裁剪和排列规则。"
        source: crop
        source_task: "a251c730"
        delta_lines: 25

  - id: D7
    name: "结构朝向：开口方向"
    tag: meta
    current: "每个结构可以朝上下左右任意方向开口（rot_k=0-3），红色色块从开口方向滑入"
    alternatives:
      - name: "仅允许水平开口"
        description: "限制结构只能向左或向右开口（取消上下方向）。简化方向推理但增加水平空间利用的约束。解题者只需在水平维度寻找匹配，降低搜索空间。"
