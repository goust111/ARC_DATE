task_id: 8b9c3697
task_type: move_to_match
summary: "红色色块沿行/列对齐方向滑入大型梳齿结构的内部插槽，滑行轨迹涂黑，无法匹配的干扰红色消失"

dimensions:
  - id: D1
    name: "匹配条件：行列对齐射线投射"
    tag: match_cond
    current: "从结构内部插槽（socket）向四个基本方向发射射线，命中红色色块即确定匹配关系和滑入方向（s.col/row == d.col/row）"
    alternatives:
      - name: "颜色匹配替代对齐"
        description: "结构的齿（teeth）使用不同颜色，红色色块也带有对应颜色标记。匹配不再依赖空间对齐，而是依赖颜色对应关系。解题者需从空间推理切换到颜色映射推理，显著改变解题策略。"
        source: color_match
        source_task: "2c181942"
        delta_lines: 30
      - name: "形状嵌合匹配"
        description: "插槽的空腔形状各不相同（L形、T形等），红色色块也有对应的互补形状。匹配条件从射线对齐变为形状吻合度检测。推理从一维对齐升级为二维几何互补判断。"
        source: shape_match
        source_task: "16b78196"
        delta_lines: 40
      - name: "连接器匹配"
        description: "结构开口处放置小型连接器图案（2-3像素的彩色标记），红色色块附近也有对应的连接器图案。匹配需同时比对连接器的颜色和形状。增加感知复杂度，需要识别局部小图案。"
        source: connector_match
        source_task: "20270e3b"
        delta_lines: 35
      - name: "最近距离匹配（取消对齐约束）"
        description: "取反当前严格的行列对齐要求：每个结构匹配距离最近的红色色块，不要求在同一行/列上。滑入方向由红色色块相对于开口的最短路径方向决定。降低对齐的严格性，增加距离计算推理。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "尺寸排序匹配"
        description: "多个结构按插槽宽度排序，多个红色色块按面积排序，按序对应（最大红色→最宽插槽）。匹配从空间对齐变为排序索引对应，引入全局比较推理。"
        source: size_ordering
        source_task: "31f7f899"
        delta_lines: 25

  - id: D2
    name: "源对象：红色色块属性"
    tag: src
    current: "红色矩形色块（1x1到3x2），分为匹配色块（每个结构最多1个，由齿数决定尺寸）和干扰色块（2-8个散布在网格中）"
    alternatives:
      - name: "非矩形红色色块"
        description: "红色色块不再限于矩形，而可以是L形、T形等不规则形状。插槽空腔形状也相应变化以容纳。滑入后形状需精确嵌入空腔，增加形状识别和旋转判断的难度。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "多色精灵替代纯红色块"
        description: "可移动对象由两种颜色组成（如红色+另一色），整体作为一个精灵滑入。匹配时仍按红色部分与插槽对齐，但印刻时保留多色图案。视觉复杂度提升，需要区分精灵的功能色和装饰色。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "精灵带方向标记"
        description: "每个红色色块附带一个单像素方向标记（如色块某侧有一个不同颜色的像素），指示滑入方向。不再由射线投射推断方向，而由精灵自身携带方向信息。推理从全局空间分析变为局部特征提取。"
        source: diagonal_hint
        source_task: "7b80bb43"
        delta_lines: 25
      - name: "空心框架精灵作为源"
        description: "源对象不是实心红色块，而是空心的红色小框架（外壳红色、内部背景色）。滑入后空心结构嵌套在结构齿的空腔中，形成框中框效果。视觉上更复杂，需要识别空心结构的边界。"
        source: hollow_frames
        source_task: "4c416de3"
        delta_lines: 30

  - id: D3
    name: "目标位置：结构类型与插槽"
    tag: dst
    current: "2-3个梳齿/支架结构，每个有4行深度（标准化形式：后壁+齿+侧壁+空腔），开口方向为上下左右之一，插槽宽度3-5格"
    alternatives:
      - name: "嵌套插槽（多层深度）"
        description: "结构不再是固定4行深度，而是有嵌套的多层空腔（如外层空腔内还有更小的内层空腔）。红色色块需滑入最内层。增加空间层次推理，解题者需判断哪一层才是真正的目标插槽。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "开放式停靠杆"
        description: "目标不是封闭的空腔插槽，而是水平或垂直的开放杆件。红色色块滑入后停靠在杆件的特定标记位置上（类似晾衣架挂衣服）。从封闭空腔嵌入变为开放杆件定位。"
        source: docking
        source_task: "7c66cb00"
        delta_lines: 30
      - name: "碰撞停止（无预设插槽）"
        description: "取反'预设插槽'的概念：结构没有明确的空腔，红色色块沿对齐方向滑动直到碰到结构像素即停止。停靠位置由碰撞决定而非预设。简化结构但增加轨迹推理难度。"
        source: collision_stop
        source_task: "195c6913"
        delta_lines: 20
      - name: "多个插槽的堆叠结构"
        description: "每个大型结构内有多个并列的插槽（如3个独立空腔），每个插槽独立匹配一个红色色块。从1:1的结构-色块关系变为1:N，需要推理多个匹配对的空间关系。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D4
    name: "变换：轨迹涂色"
    tag: trajectory
    current: "红色色块滑入时，所有经过的中间位置涂黑（continuous_trail），形成从原始位置到最终停靠位置的黑色拖尾"
    alternatives:
      - name: "保留源不涂色"
        description: "取反当前的轨迹涂黑：红色色块滑入后，原始位置和路径都保持不变（保留原始红色或背景色），只在目标位置出现红色。视觉上更简洁，但解题者失去了轨迹线索，需要纯粹依赖空间推理确定匹配。"
        source: keep_source
        source_task: "247ef758"
        delta_lines: 10
      - name: "渐变色轨迹"
        description: "轨迹不是统一涂黑，而是用结构颜色（structure_color）涂色，使轨迹看起来像结构的延伸。视觉上轨迹融入结构，解题者需要更仔细地区分原始结构像素和轨迹像素。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "间断轨迹（虚线）"
        description: "轨迹不是连续涂黑，而是每隔一格涂黑（交替涂黑和保留背景色），形成虚线效果。视觉上独特，增加轨迹模式的推理复杂度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "洪水填充轨迹"
        description: "红色色块到达插槽后，从停靠位置向开口方向进行洪水填充（flood_fill），将开口方向上直到原始位置之间的整个矩形区域涂黑，而非仅涂色块扫过的窄带。轨迹宽度等于插槽宽度。"
        source: flood_fill
        source_task: "7666fa5d"
        delta_lines: 15

  - id: D5
    name: "变换：未匹配红色的处理"
    tag: transform
    current: "无法与任何结构匹配的干扰红色色块在输出中被擦除为背景色（conditional_deletion）"
    alternatives:
      - name: "未匹配红色重新着色"
        description: "干扰红色色块不是消失，而是被重新着色为另一种特定颜色（如结构色或黑色）。解题者需推理'匹配→滑入+涂轨迹'和'不匹配→变色'两条规则，增加条件分支的推理。"
        source: recolor
        source_task: "20270e3b"
        delta_lines: 10
      - name: "未匹配红色保留不变"
        description: "取反当前的擦除规则：干扰红色色块在输出中原封不动保留。解题者需区分'移动了的红色'和'留在原位的红色'，推理哪些色块参与了匹配。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "未匹配红色缩小为单像素"
        description: "干扰红色色块不完全消失，而是缩小为1x1单像素（保留在原外接矩形的中心位置）。视觉上仍可见干扰项的痕迹，但明显变小，解题者需推理尺寸变化规则。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D6
    name: "网格形状：输出框架"
    tag: grid_shape
    current: "输出与输入网格尺寸完全相同（19-23行 x 22-27列），仅改变部分像素值"
    alternatives:
      - name: "紧凑裁剪输出"
        description: "输出网格裁剪为仅包含所有结构及其轨迹的最小外接矩形。去除边缘空白区域，输出尺寸小于输入。解题者需额外推理输出尺寸的确定规则。"
