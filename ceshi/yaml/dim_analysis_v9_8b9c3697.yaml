        source: inversion
        source_task: null
        delta_lines: 5
      - name: "面积匹配优先"
        description: "当多个红色色块可见时，优先选择面积最接近插槽空腔面积的色块。引入面积计算和比较推理，解题者需衡量每个候选色块与插槽的面积匹配度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "频率消歧（选最常见颜色变体）"
        description: "红色色块有微小的颜色变体（如深红、浅红），优先选择网格中出现频率最高的颜色变体。需要全局颜色统计推理。"
