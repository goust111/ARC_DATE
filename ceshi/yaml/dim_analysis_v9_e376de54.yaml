task_id: e376de54
task_type: move_to_match
summary: "多条平行同方向线段（不同颜色），以第二长线段为参考基准，将所有线段的两端对齐并延伸或裁剪至该参考长度"

dimensions:
  - id: D1
    name: "匹配条件：以第二长线段为参考基准 vs 其他选取规则"
    tag: match_cond
    current: "以第二长线段的端点范围为参考，所有其他线段的端点对齐到该参考线段的起止位置"
    alternatives:
      - name: "以最长线段为参考基准"
        description: "将参考线段从第二长改为最长线段，所有线段延伸/裁剪到最长线段的范围。推理难度降低——最长线段更容易识别，但改变了核心排序逻辑，测试解题者是否依赖'第二长'这一反直觉规则"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "以最短线段为参考基准"
        description: "参考基准取反为最短线段，所有线段裁剪到最短长度。与原始'第二长'完全相反的选取策略，视觉上输出线段更短、更紧凑，解题者需识别最小值选取规则"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "以中位数长度线段为参考基准"
        description: "当线段数量为奇数时取中间长度，偶数时取较短的中间值。引入统计概念（中位数），增加了数量推理的抽象层次"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "以出现频率最高的长度为参考"
        description: "如果多条线段恰好有相同长度，则以该共享长度为参考。引入频率/众数概念，解题者需同时关注长度和计数两个属性"
        source: frequency_tiebreak
        source_task: 67e490f4
        delta_lines: 15
      - name: "以特定颜色的线段为参考"
        description: "参考线段不由长度排序决定，而是由特定颜色（如所有训练样本中固定的某颜色）决定。从长度比较变为颜色识别，根本性改变推理类型"
        source: color_match
        source_task: 2c181942
        delta_lines: 15

  - id: D2
    name: "源对象：平行线段的方向与类型"
    tag: src
    current: "同方向平行对角线段（45度斜线），每条线段为不同颜色的独立像素链"
    alternatives:
      - name: "水平线段替代对角线段"
        description: "所有线段为水平方向，端点在同一列范围对齐。空间推理从对角坐标简化为单轴坐标，但原始任务已有水平线段的训练样本，此变体使其成为唯一方向"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "垂直线段替代对角线段"
        description: "所有线段为垂直方向，端点在同一行范围对齐。与水平类似但改变坐标轴，视觉上线段堆叠方式不同"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "混合方向的线段（水平+垂直+对角共存）"
        description: "不同线段可以有不同方向（但每条线段内部方向统一），参考基准统一按像素数计算长度。大幅增加识别和比较的复杂度，解题者需统一不同方向线段的长度概念"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "反对角线段（135度方向）"
        description: "线段从左下到右上方向排列（而非左上到右下）。几何方向取反，测试解题者对对角方向的泛化能力"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D3
    name: "目标位置：端点对齐方式"
    tag: dst
    current: "所有线段的两端都对齐到参考线段的起点和终点位置，保持平行间距不变"
    alternatives:
      - name: "仅对齐起点（头端对齐）"
        description: "所有线段仅将起始端对齐到参考线段的起始端，终止端保持原始长度不变。从双端对齐简化为单端对齐，改变了延伸/裁剪方向的推理"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "仅对齐终点（尾端对齐）"
        description: "与仅对齐起点相反，线段仅在末端对齐。视觉上线段的头部参差不齐而尾部整齐，形成'右对齐'效果"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "中心对齐（居中延伸）"
        description: "线段的中心点与参考线段的中心点对齐，向两端等量延伸或裁剪。引入中心点计算的概念，解题者需推断对称延伸规则"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "对齐到参考线段的投影位置"
        description: "每条线段沿垂直于线段方向投影到参考线段所在的直线上，然后对齐到投影区间。涉及投影几何概念，推理难度显著提升"
        source: projection
        source_task: 7666fa5d
        delta_lines: 25

  - id: D4
    name: "变换：延伸或裁剪线段"
    tag: transform
    current: "短于参考的线段延伸像素到参考长度，长于参考的线段裁剪多余像素"
    alternatives:
      - name: "仅延伸不裁剪（短线段延伸，长线段保持不变）"
        description: "比参考短的线段延伸到参考长度，比参考长的线段不做任何改变。输出中仍保留长度差异（长线段更长），解题者需识别单向操作规则"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "仅裁剪不延伸（长线段裁剪，短线段保持不变）"
        description: "比参考长的线段裁剪到参考长度，比参考短的线段不做改变。与仅延伸对称的取反，输出中短线段保持原样"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "延伸时颜色渐变标记"
        description: "线段延伸出的新像素使用与原始颜色不同的标记色（如原始色的相邻色），使延伸部分在视觉上可区分。解题者需同时理解延伸规则和颜色标记规则"
        source: recolor
        source_task: 20270e3b
        delta_lines: 20
      - name: "裁剪的像素用背景色覆盖并留痕"
        description: "被裁剪掉的像素不是简单消失，而是用特定颜色（如灰色）标记，留下'被删除'的痕迹。输出中同时包含最终结果和删除信息"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 15

  - id: D5
    name: "长度比较的排序规则"
