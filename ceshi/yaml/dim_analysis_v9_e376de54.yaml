        source_task: null
        delta_lines: 5
      - name: "按颜色值排序选取参考"
        description: "线段按其颜色数值（如ARC颜色编号0-9）排序，取中间排位的线段为参考。将几何属性（长度）的排序替换为非几何属性（颜色编号）的排序，根本性改变推理维度"
        source: creative
        source_task: null
