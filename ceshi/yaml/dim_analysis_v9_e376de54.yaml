      - name: "分组处理：按方向或位置分组独立对齐"
        description: "如果存在多组不同方向或空间分离的平行线段，每组独立选取参考线段并对齐。一个网格内包含多个独立的对齐子问题"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "两阶段处理：先对齐起点再统一长度"
        description: "第一步将所有线段的起点对齐到参考起点位置，第二步统一所有线段长度到参考长度。将单步双端对齐分解为两步单属性处理"
        source: creative
        source_task: null
        delta_lines: 20

