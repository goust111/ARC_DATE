  - id: D9
    name: "多步处理：参考线段选取与线段变换的顺序"
    tag: multi_step
    current: "步骤1：识别所有平行线段及其颜色；步骤2：计算每条线段长度；步骤3：找到第二长线段为参考；步骤4：将所有线段端点对齐到参考范围"
