  - id: D15
    name: "工具放置距离约束"
    tag: meta
    current: "工具放置在远离目标框架的位置（Manhattan距离>=4），不接触任何边缘"
    alternatives:
      - name: "工具紧邻框架放置"
        description: "工具放置在紧邻框架（距离1-2像素）的位置，解题者可从空间邻近性直接推断配对，降低搜索难度但测试空间推理的直觉。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "工具放置在对面边缘"
        description: "工具必须放置在框架所在边缘的对面边缘上（如框架在左边则工具在右边边缘）。工具本身接触边缘，解题者需区分框架组件和工具组件。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "工具距离编码旋转信息"
        description: "工具到框架的Manhattan距离除以某因子（如2）的余数指示旋转角度（0=0°, 1=90°, 2=180°, 3=270°）。距离不仅用于分离还编码了变换参数。解题者需从距离推断旋转。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 30

