task_id: a25697e4
task_type: move_to_match
summary: "将网格内部的双色工具精灵通过旋转/翻转对接到边缘框架的阶梯形凹槽中，工具的一种颜色区域（plug）精确填充凹槽，另一种颜色区域（handle）向外突出；若对接使用了翻转且两色像素数不等则交换两色"

dimensions:
  - id: D1
    name: "匹配条件：形状匹配方式"
    tag: match_cond
    current: "工具的plug区域形状在D4群变换（旋转/翻转）下与框架凹槽形状一致，plug像素数等于凹槽面积"
    alternatives:
      - name: "颜色匹配替代形状匹配"
        description: "不再根据形状吻合度匹配工具与框架，而是工具的plug颜色必须与框架颜色相同才能配对。凹槽大小固定相同，所有工具形状相同但颜色不同。解题者需从颜色而非几何推断配对关系，推理入口从空间分析变为颜色关联。"
        source: color_match
        source_task: 2c181942
        delta_lines: 25
      - name: "边缘颜色匹配"
        description: "框架的两个子组件用不同颜色绘制（上半和下半各一种颜色），工具的handle颜色必须与框架某子组件颜色一致才能配对。解题者需同时观察框架的颜色分区和工具的handle颜色。"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 25
      - name: "凹槽洞数计数匹配"
        description: "每个框架的凹槽由多个不连通的小洞组成（而非单个阶梯形），工具上标有相应数量的标记像素（如红点）。工具与框架配对条件为标记数等于洞数。解题者需要计数两侧的独立区域/标记数并匹配。"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 30
      - name: "连接器匹配"
        description: "框架凹槽边缘有一个特殊颜色的连接像素，工具上也有对应的连接像素（颜色和相对位置需匹配）。配对条件为连接器颜色和朝向一致。解题者需关注微小的连接标记细节。"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 25
      - name: "面积排序匹配"
        description: "凹槽面积各不相同，工具按总面积排序，第k大的工具匹配第k大凹槽面积的框架。解题者需对两组对象分别排序后建立序数映射。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 20

  - id: D2
    name: "匹配条件：旋转/翻转允许范围"
    tag: match_cond
    current: "允许完整D4群变换（4种旋转 × 2种翻转 = 最多8种朝向）来对齐工具plug与凹槽"
    alternatives:
      - name: "仅允许旋转，禁止翻转"
        description: "工具只能通过0°/90°/180°/270°旋转来匹配凹槽，不允许翻转。这意味着凹槽设计必须保证存在某个旋转角度可精确匹配，且颜色交换规则永远不触发。解题者需判断手性方向，推理难度因排除翻转而略降。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "仅允许翻转，禁止旋转"
        description: "工具只能通过水平/垂直翻转来匹配凹槽，不允许旋转。凹槽设计需确保翻转即可对齐。颜色交换规则频繁触发。约束条件更窄，解题者需判断是否需要翻转。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "固定朝向，无变换"
        description: "工具必须以原始朝向直接对接凹槽，不允许任何旋转或翻转。工具在输入中的朝向就是对接朝向，凹槽设计需精确匹配。这极大简化了搜索空间但增加了空间推理的直接性。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "限制为90度旋转倍数且需推断旋转角度"
        description: "工具可旋转但旋转角度由框架边缘的某种标记指示（如框架角落的彩色标记点数表示旋转90度的次数）。解题者需先解码标记再执行旋转，增加一层符号推理。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D3
    name: "源对象：工具结构"
    tag: src
    current: "不接触边界的单个4-连通分量，恰好包含2种颜色（plug色+handle色），每种颜色区域4-9像素，总面积10-15像素"
    alternatives:
      - name: "三色工具"
        description: "工具包含3种颜色：plug色、handle色和中间'铰链'色（1-2像素连接plug与handle）。铰链色在对接后变为背景色消失，仅plug和handle保留。解题者需识别三色结构并推断铰链的消失规则。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "单色工具（plug即整个工具）"
        description: "工具只有一种颜色，整体即为plug，没有handle。对接后工具完全嵌入凹槽，不会有突出部分。解题者的匹配推理简化为纯形状匹配，但失去handle作为方向线索。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "分离式工具（两个不连通组件）"
        description: "plug和handle不直接相连，而是分开放置在网格上（但距离很近且颜色对应）。解题者需先将两部分识别为一个工具再整体对接。增加了对象分组的推理步骤。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "工具含有空心洞"
        description: "工具内部包含1-2个背景色像素形成的洞（但仍为4-连通整体），对接时洞也被带入框架区域。解题者需处理非实心工具的形状匹配，增加拓扑复杂度。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "目标对象：框架结构"
    tag: dst
    current: "由两个同色4-连通子组件组成的边缘框架，一个子组件是完整矩形（bar），另一个有阶梯形缺口（notch），之间间隔1行/列形成凹槽"
    alternatives:
      - name: "单组件带矩形缺口的框架"
        description: "框架为单个L形或U形连通组件（而非两个分离子组件），凹槽是框架体内挖去的矩形区域。解题者需识别单一组件内的凹槽而非两组件间的间隙，改变了凹槽定位的推理方式。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "空心正方形框架"
        description: "框架为完整的空心正方形或矩形，凹槽是框架某一边上挖去的缺口。类似拼图框架，工具从缺口方向嵌入。视觉上更接近传统拼图。"
        source: jigsaw_assembly
        source_task: 8698868d
        delta_lines: 30
      - name: "水平条形框架（dock into bar）"
        description: "框架变为水平或垂直的单色长条，凹槽是条上挖去的阶梯形缺口。结构更简单，但凹槽在长条上的位置变化增加了定位难度。"
        source: docking
        source_task: 7c66cb00
        delta_lines: 25
      - name: "框架不接触边缘"
        description: "框架放置在网格内部而非边缘，工具同样在内部。对接方向由框架的开口朝向决定（而非边缘方向）。解题者需先判断框架的开口方向，增加空间推理步骤。"
        source: inversion
        source_task: null
        delta_lines: 25

  - id: D5
    name: "目标对象：凹槽形状"
    tag: dst
    current: "阶梯形（staircase/upper-triangular）凹槽，1-3个像素，由间隙行/列与notch组合形成"
    alternatives:
      - name: "矩形凹槽"
        description: "凹槽为简单矩形（而非阶梯形），plug也对应为矩形区域。形状匹配退化为尺寸匹配（宽×高），推理简化但仍需正确旋转。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "不规则多边形凹槽"
        description: "凹槽形状随机生成为任意4-连通区域（不限于阶梯形），面积3-6像素。形状更复杂多变，工具的plug需精确吻合不规则轮廓，增加了形状识别的难度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "T形或十字形凹槽"
        description: "凹槽呈T形或十字形，plug也为对应形状。这类对称性更强的形状在旋转下的匹配更微妙——某些旋转角度看似吻合但实际不对齐。增加空间推理精度要求。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "大面积凹槽（5-10像素）"
        description: "凹槽面积显著增大至5-10像素，plug区域相应增大。更大的形状意味着更多可能的变换组合，但也提供更多视觉线索。改变了题目的规模感。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D6
    name: "变换规则：颜色交换条件"
    tag: transform
    current: "当对接变换使用了翻转（reflection）且plug与handle的像素数不等时，交换工具的两种颜色"
    alternatives:
      - name: "始终交换颜色"
        description: "无论是否使用翻转，对接后工具的两种颜色始终互换。规则简化为无条件交换。解题者不需要判断翻转与否，但需始终记得交换，推理模式从条件判断变为固定操作。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "从不交换颜色"
        description: "完全取消颜色交换规则，工具颜色在对接后保持不变。简化变换逻辑，使题目更聚焦于形状匹配和空间推理。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "旋转次数决定颜色变换"
        description: "旋转90°的次数为奇数时交换两色，偶数时不变（类似奇偶校验）。翻转不再是触发条件，取而代之的是旋转角度的奇偶性。解题者需追踪旋转步数。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "颜色重映射到框架颜色"
        description: "plug颜色变为框架颜色，handle颜色保持不变（或也重映射为另一种指定颜色）。不是两色互换而是重新着色。解题者需推断颜色映射规则。"
        source: recolor
        source_task: 20270e3b
        delta_lines: 15

  - id: D7
    name: "变换规则：对接后工具处理"
    tag: transform
    current: "工具从原始位置移除（恢复为背景色），仅在对接位置显示；输出 = 框架 + 对接后的工具"
    alternatives:
      - name: "保留工具原始位置"
        description: "工具在原始位置保留不消失，同时在对接位置也出现一份副本。输出中同时显示原位和对接位的工具。解题者需理解'复制而非移动'的规则。"
        source: keep_source
        source_task: 247ef758
        delta_lines: 10
      - name: "原位留下轨迹"
        description: "工具从原始位置移除后，原位留下单色轨迹（如灰色或第三种颜色的影子），指示工具曾经的位置。增加视觉信息，输出更复杂。"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 15
      - name: "仅保留plug，handle消失"
        description: "对接后只有plug部分显示在凹槽中，handle部分完全消失（变为背景色）。输出只显示框架和嵌入的plug色块。简化输出但解题者仍需理解完整的匹配过程。"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 10
      - name: "对接后擦除框架保留工具"
        description: "对接完成后框架消失（变为背景色），只保留对接后的工具形态。输出是工具在对接位置的形态但没有框架包围。反直觉的删除规则。"
        source: deletion
        source_task: d35bdbdc
        delta_lines: 15

  - id: D8
    name: "空间关系：框架朝向与边缘绑定"
    tag: meta
    current: "每个框架的两个子组件都接触同一条网格边缘（上/下/左/右），凹槽开口朝向网格内部"
    alternatives:
      - name: "框架接触两条相邻边缘（角落放置）"
        description: "框架放置在网格角落，同时接触两条相邻边缘（如左边+上边）。凹槽开口朝向对角线方向。工具需从斜向对接，空间推理更复杂。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "所有框架接触同一条边缘"
        description: "所有1-2个框架都必须接触同一条边缘（如全在左边），沿该边缘排列。减少方向的多样性但增加同侧排列的拥挤感。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "框架接触对面边缘"
        description: "当有2个框架时，它们必须接触对面的两条边缘（一个在左一个在右，或一个在上一个在下）。工具需穿越整个网格对接到对面框架，空间跨度大。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "框架凹槽朝向边缘而非内部"
        description: "框架的凹槽开口朝向网格边缘（而非内部），工具从内部朝边缘方向对接。handle向内突出而非向外。反转了整体方向逻辑。"
        source: inversion
        source_task: null
        delta_lines: 20

  - id: D9
    name: "基数关系：工具-框架配对"
    tag: meta
    current: "1:1配对，每个工具恰好对应一个框架，1-2对"
    alternatives:
      - name: "多工具对一框架（many:1）"
        description: "一个大框架有多个凹槽（2-3个），需要多个不同工具分别填入不同凹槽。解题者需为每个凹槽找到对应工具并分别对接。增加组合推理复杂度。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "一工具对多框架（1:many）"
        description: "一个工具可以同时对接多个具有相同凹槽形状的框架（工具被复制到每个匹配框架）。解题者需识别所有匹配的框架而非仅一个。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "增加配对数至3-4对"
        description: "框架-工具对数从1-2增加到3-4对，需要在更多候选中推断正确配对。每对的凹槽面积必须两两不同以保证唯一匹配。解题者面对更多对象时推理负担更重。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "含干扰框架（无匹配工具）"
        description: "网格中包含1个额外的框架（有凹槽但无工具可匹配），解题者需识别哪些框架有匹配工具、哪些是干扰项并保持不变。增加排除推理。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D10
    name: "网格输出模式"
    tag: grid_shape
    current: "输出网格尺寸与输入完全相同（18-30行 × 25-30列），仅内容变化"
    alternatives:
      - name: "紧凑裁剪输出"
        description: "输出仅保留对接后的框架+工具区域，裁剪掉所有多余背景。每个框架对接结果单独裁剪输出或整体紧凑裁剪。输出网格显著小于输入。"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 15
      - name: "分离输出（每对一个子网格）"
        description: "当有多对时，每对框架-工具的对接结果分离为独立的小网格，水平或垂直拼接为输出（用分隔线间隔）。解题者需理解分离与拼接规则。"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 25
      - name: "固定尺寸输出"
        description: "无论输入多大，输出固定为某个标准尺寸（如10x10），框架和对接工具被缩放或重新排列以适应。解题者需推断缩放/重排规则。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D11
    name: "多步序列：对接顺序"
    tag: multi_step
    current: "各工具独立对接，顺序不影响结果（每对独立处理）"
    alternatives:
      - name: "有序对接（大到小或近到远）"
        description: "工具必须按特定顺序对接（如按工具面积从大到小），先对接的工具可能影响后续工具的放置空间。解题者需推断正确的对接顺序。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "链式对接"
        description: "第一个工具对接到框架后，其handle部分形成新的凹槽供第二个工具对接，形成嵌套结构。类似16b78196中的链式放置。解题者需识别迭代对接的终止条件。"
        source: multi_step
        source_task: 16b78196
        delta_lines: 35
      - name: "先对接再移动"
        description: "所有工具先对接到各自框架，然后整体执行第二步操作（如所有对接后的框架整体向某方向平移或居中）。两步操作解题者需串联理解。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "对接产生新工具"
        description: "工具A对接到框架后，handle突出部分与相邻区域形成新的'虚拟工具'，该虚拟工具再对接到另一个框架。解题者需理解对接的递归效应。"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D12
    name: "工具颜色区域的拓扑约束"
    tag: meta
    current: "plug和handle各为4-连通区域，两者之间共享1-2条边（inter-color boundary），handle在远离边缘方向延伸"
    alternatives:
      - name: "plug包围handle（或handle包围plug）"
        description: "一种颜色完全包围另一种颜色（如plug形成环形、handle在中心），而非简单相邻。凹槽形状需匹配外层颜色的形状。增加了嵌套结构的识别难度。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "plug和handle沿直线排列"
        description: "plug和handle严格沿水平或垂直方向排列（形成条状工具），而非自由形状。工具的朝向更易识别但形状变化减少。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "多段边界（共享3-5条边）"
        description: "plug和handle之间的接触边界更长（3-5条共享边而非1-2条），两种颜色区域深度交错。工具形状更复杂，旋转后的形状匹配更具挑战。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D13
    name: "配对判定：凹槽面积与工具面积的关系"
    tag: match_cond
    current: "工具的某一色区域像素数恰好等于框架凹槽面积，以此确定配对和plug/handle角色"
    alternatives:
      - name: "handle面积匹配凹槽"
