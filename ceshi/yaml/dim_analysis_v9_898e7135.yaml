task_id: 898e7135
task_type: move_to_match
summary: "将散落在框架外的精灵按照块级形状（经旋转/翻转后）与框架内洞区域匹配，框架按缩放因子 k 放大后将精灵填入对应洞位置，输出裁剪后的放大框架"

dimensions:
  - id: D1
    name: "匹配条件：块级形状匹配（含旋转/翻转）"
    tag: match_cond
    current: "shape_match + rotation_flip — 精灵下采样为块级掩码后，与洞的形状在二面体群（4次旋转 × 水平翻转 = 8种变换）下比较，形状一致即配对"
    alternatives:
      - name: "颜色匹配替代形状匹配"
        description: "每个洞区域的边缘墙壁像素用不同颜色标记，精灵颜色与对应洞边缘颜色一致即配对，无需形状比较。解题者的推理从几何形状对比转为颜色属性匹配，降低了空间推理难度但增加了视觉搜索的复杂度。"
        source: color_match
        source_task: 2c181942
        delta_lines: 40
      - name: "仅旋转不翻转"
        description: "匹配时只允许 0°/90°/180°/270° 旋转，禁止镜像翻转。解题者需要区分手性形状（如 L 和反 L），推理更精细，因为翻转后的形状不再等价。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "禁止旋转和翻转（严格方向匹配）"
        description: "精灵的块级掩码必须与洞形状严格一致，不允许任何旋转或翻转。解题者需要直接对比方向，大幅简化几何推理但要求更精确的视觉比对。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "边缘拼接匹配"
        description: "精灵的开放边缘必须与洞的开放边缘对齐，使得拼接后形成连续的矩形区域。类似拼图边缘匹配，解题者需要推理边缘轮廓的互补性。"
        source: edge_matching
        source_task: 7b3084d4
        delta_lines: 50
      - name: "面积排序匹配"
        description: "精灵按面积从大到小排序，洞按面积从大到小排序，第 i 大精灵对应第 i 大洞（无需形状比较）。解题者只需计数和排序，推理模式从几何转为数值比较。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 30
      - name: "连接器颜色匹配"
        description: "框架外部放置彩色连接线段，连接线的一端指向某个洞，另一端指向对应的精灵。精灵通过追踪连接线找到目标洞。解题者需要路径追踪推理，引入全新的匹配范式。"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 55

  - id: D2
    name: "源对象：精灵的结构与属性"
    tag: src
    current: "精灵由 k×k 实心块组成（k 为缩放因子），每个精灵单色，非单元精灵颜色互不相同，单元精灵（k×k 实心方块）可共享颜色，散布在框架外接矩形之外"
    alternatives:
      - name: "多色精灵"
        description: "每个精灵由 2-3 种颜色组成，块级掩码中不同区域用不同颜色着色。填入洞后保留多色图案。解题者需要同时处理形状匹配和颜色布局，复杂度增加。匹配仍基于形状，但输出需要保留原始颜色分布。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "精灵含内部洞（非实心块）"
        description: "精灵的块级掩码中某些块缺失（形成内部洞），下采样后仍需与框架中洞的形状（含内部洞）匹配。解题者需要处理二阶洞结构——精灵中的洞对应框架洞中的墙壁，增加了嵌套推理层次。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "精灵作为空心轮廓（仅边缘像素）"
        description: "精灵不是实心块组成，而只有外轮廓的 1 像素边框。解题者需要从轮廓推断出完整的块级形状来进行匹配，增加了形状复原的推理步骤。填入时恢复为实心。"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 35
      - name: "精灵嵌入在框架内部"
        description: "反转 src/dst 空间关系：精灵直接放置在框架内部（而非外部），解题者需要先将精灵从框架中提取出来，然后重新按匹配关系放置到正确的洞中。增加了对象分离的前处理步骤。"
        source: inversion
        source_task: null
        delta_lines: 30

  - id: D3
    name: "目标对象：框架与洞的结构"
    tag: dst
    current: "hole_filling — 单色矩形框架（1 像素厚边框），内部布局由洞（背景色单元格）和墙壁（框架色单元格）组成，3-6 个 4-连通洞区域（8-隔离），面积 1-7，含 1-2 个单元洞"
    alternatives:
      - name: "多层嵌套框架"
        description: "框架不是单层矩形，而是多层嵌套的同心矩形。每层框架之间有独立的洞区域，精灵需要匹配到正确层的洞。解题者需要先识别嵌套层次结构，再按层进行匹配。"
        source: creative
        source_task: null
        delta_lines: 60
      - name: "多个独立框架"
        description: "画布上有 2-3 个独立的小框架，每个框架内有部分洞，精灵需要跨框架匹配（某些精灵属于框架 A，某些属于框架 B）。解题者需要先确定精灵属于哪个框架，增加了分组推理。"
        source: jigsaw_assembly
        source_task: 8698868d
        delta_lines: 50
      - name: "洞区域带颜色标记"
        description: "框架内的洞不是纯背景色，而是每个洞区域用独特的标记颜色填充。精灵颜色与洞标记颜色一致即配对，形成颜色到位置的映射。推理从形状匹配转为颜色-位置对应。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "不规则外形框架（非矩形）"
        description: "框架的外边界不是矩形，而是 L 形、T 形或十字形等不规则形状。洞仍分布在框架内部。解题者需要先识别不规则的框架边界，输出裁剪也变为非矩形区域的处理。"
        source: creative
        source_task: null
        delta_lines: 45

  - id: D4
    name: "变换：缩放因子 k 的推断与应用"
    tag: transform
    current: "scale_to_fit — 缩放因子 k（2 或 3）从最小实心方块精灵的边长推断；框架放大 k 倍后精灵恰好填入对应洞位置"
    alternatives:
      - name: "缩小而非放大（反向缩放）"
        description: "精灵是原始大小，框架内的洞比精灵小 k 倍。输出时将精灵缩小后填入洞中（下采样），而非放大框架。解题者的推理方向反转：从'推断放大倍数'变为'推断缩小倍数'。"
        source: inversion
        source_task: null
        delta_lines: 35
      - name: "不同洞使用不同缩放因子"
        description: "不同的洞区域对应不同的缩放因子（如某些洞 k=2，某些 k=3）。解题者需要对每个精灵-洞配对独立推断缩放因子，大幅增加推理复杂度。"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "固定缩放因子（无需推断）"
        description: "所有示例中 k 固定为 2 且不存在单元洞精灵作为线索。解题者需要从精灵与洞的面积比直接推断 k，无法借助最小方块捷径。简化了搜索空间但保留核心推理。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "精灵旋转后再缩放填入"
        description: "当前先缩放再旋转；改为精灵先应用旋转/翻转变换到块级形状，然后按新方向缩放填入洞中。输出中精灵的朝向与输入不同，解题者需要同时推理旋转和缩放的复合变换。"
        source: conditional_rotation
        source_task: 291dc1e1
        delta_lines: 20
      - name: "精灵填入后重着色为洞边缘墙壁颜色"
        description: "精灵填入洞后不保留原色，而是重着色为周围墙壁的颜色。输出中精灵与框架融为一体，解题者需要通过位置而非颜色来验证匹配结果的正确性。"
        source: recolor
        source_task: 20270e3b
        delta_lines: 20

  - id: D5
    name: "输出裁剪方式"
    tag: grid_shape
    current: "crop — 输出为 (layout_h+2)*k × (layout_w+2)*k 的紧密裁剪，即放大后的完整框架（含边框），框架色作为背景"
    alternatives:
      - name: "保留完整画布（不裁剪）"
        description: "输出保留与输入相同大小的画布，精灵填入框架中的洞但框架位置和背景都保持不变，仅删除干扰项和框架外的精灵。解题者需要理解'就地填充'而非'提取放大'的范式。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "仅输出内部布局（去掉边框）"
        description: "输出不包含框架的 1 像素边框，只保留放大后的内部布局区域。输出尺寸为 layout_h*k × layout_w*k。解题者需要推理边框是否包含在输出中。"
        source: tight_crop
        source_task: 67e490f4
        delta_lines: 10
      - name: "输出为打包网格（精灵紧密排列）"
        description: "不输出完整框架，而是将匹配后的精灵按洞的行列顺序紧密排列成网格（精灵之间有 1 像素分隔线）。输出形状取决于精灵数量和排列方式，解题者需要推理排列规则。"
        source: packed_grid
        source_task: 58f5dbd5
        delta_lines: 40

  - id: D6
    name: "干扰项的类型与作用"
    tag: meta
    current: "8-13 个单像素干扰项，使用专用颜色（与框架色和所有精灵色不同），散布在画布上；输出中完全移除"
    alternatives:
      - name: "无干扰项"
        description: "移除所有干扰像素，画布上只有框架和精灵。简化了对象识别步骤，解题者可以直接关注核心匹配逻辑。降低了预处理难度但保留核心推理。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "干扰项为小型多像素色块"
        description: "干扰项不是单像素，而是 2-4 像素的小色块（各色块单色但形状随机）。解题者需要区分小干扰色块和真正的精灵，对象分类推理更具挑战性。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "干扰项使用精灵颜色"
        description: "干扰像素不使用专用颜色，而是随机使用某个精灵的颜色。解题者不能简单通过'该颜色只用于干扰'来过滤，需要通过连通性和大小来区分精灵和干扰。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "干扰项作为额外不匹配的伪精灵"
        description: "除了正常精灵外，还有 1-2 个额外的多像素伪精灵（颜色独特，形状不匹配任何洞）。解题者需要识别并排除这些伪精灵，增加了匹配验证的推理步骤。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D7
    name: "精灵-洞基数关系"
    tag: meta
    current: "严格 1:1 — 每个精灵恰好对应一个洞，每个洞恰好对应一个精灵，总数相等"
    alternatives:
      - name: "多精灵对一洞（many:1）"
        description: "某些大洞需要由多个小精灵拼合填满。解题者需要推理哪些精灵组合起来恰好覆盖一个洞的形状，引入组合搜索问题。"
        source: creative
        source_task: null
        delta_lines: 60
      - name: "一精灵对多洞（1:many）"
        description: "某些精灵需要被复制并填入多个形状相同的洞中。解题者需要识别重复洞形并理解一个精灵可以多次使用。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "精灵数量多于洞数量（需选择）"
        description: "提供的精灵数量多于洞的数量，解题者需要选择正确的子集进行匹配，多余精灵被丢弃。增加了选择推理的维度。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D8
    name: "缩放因子 k 的推断线索"
    tag: meta
    current: "k 从最小实心方块精灵（单元洞对应的 k×k 方块）的边长推断；每个示例保证有 1-2 个单元洞"
    alternatives:
      - name: "无单元洞线索（纯面积比推断 k）"
        description: "移除所有单元洞，k 需要从非单元精灵与洞的面积比（area_piece = area_slot × k²）推断。解题者失去了直观的'最小方块'线索，需要更深的数学推理。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "k 通过框架边框厚度编码"
        description: "框架的边框厚度不再固定为 1 像素，而是恰好等于 k 像素。解题者可以直接从边框厚度读取 k 值，提供了与当前完全不同的推断路径。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "k 通过符号图例编码"
        description: "画布角落有一个小型图例区域，其中包含 k×k 的彩色方块示意。解题者需要先识别图例再提取 k 值，引入了符号解码的前置步骤。"
        source: symbol_instructions
        source_task: 9385bd28
        delta_lines: 35

  - id: D9
    name: "洞区域的空间约束"
    tag: meta
    current: "洞区域 4-连通且彼此 8-隔离（相邻洞之间至少隔 1 像素墙壁，含对角线方向），面积 1-7 像素"
    alternatives:
      - name: "洞区域允许 8-连通"
        description: "洞区域的连通性从 4-连通放宽到 8-连通（允许对角线相邻像素属于同一洞）。精灵的块级掩码也用 8-连通定义。解题者需要处理对角线连通的形状，视觉识别更复杂。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "洞区域允许相邻（仅 4-隔离）"
        description: "洞区域之间只需 4-隔离（不共享边），但允许对角线接触。布局更紧凑，洞数量可以更多，解题者需要仔细区分对角线接触的不同洞区域。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "洞面积范围扩大（含大面积洞）"
        description: "非单元洞面积范围从 2-7 扩大到 2-12，允许更大的不规则形状。大面积精灵的旋转/翻转匹配更具挑战性，因为形状更复杂。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "所有洞面积相同（仅形状不同）"
        description: "所有非单元洞的面积完全相同（如都是 4 像素），只有形状不同。解题者不能使用面积作为快速过滤条件，必须依赖纯形状匹配。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D10
