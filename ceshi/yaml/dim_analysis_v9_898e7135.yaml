        description: "精灵的颜色按照对应洞在框架中的行位置从上到下使用颜色谱（如红→橙→黄→绿）。解题者可以利用颜色顺序作为辅助线索来验证匹配，或直接用颜色排序来缩小搜索范围。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "精灵颜色与洞边缘墙壁颜色对应"
        description: "框架内的墙壁不再单色，每个洞周围的墙壁用不同颜色标记，精灵颜色必须与目标洞的墙壁颜色匹配。解题者获得双重匹配条件（颜色+形状），降低搜索空间但增加视觉信息量。"
        source: border_color_match
        source_task: d35bdbdc
        delta_lines: 35

  - id: D11
    name: "精灵放置约束"
    tag: meta
    current: "精灵散布在框架外接矩形之外的背景区域，彼此间和与框架间至少隔 1 像素背景；最大精灵优先放置"
    alternatives:
      - name: "精灵可部分在框架外接矩形内（但不覆盖框架像素）"
        description: "精灵允许出现在框架的外接矩形区域内（只要不覆盖框架的非背景像素）。解题者需要更精细地分离框架和精灵，因为空间上可能有重叠的外接矩形。"
