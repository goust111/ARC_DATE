        delta_lines: 20
      - name: "精灵排列在画布边缘（有序排列）"
        description: "精灵不是随机散布，而是有序排列在画布的某条边缘（如顶部一行或左侧一列）。解题者可能误以为排列顺序暗示匹配规则，增加了干扰推理。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "精灵按面积从大到小从左到右排列"
        description: "精灵在画布上按面积降序从左到右排列。解题者需要判断这种排列是否是匹配线索（实际上匹配仍基于形状），增加了假线索的推理挑战。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D12
    name: "框架内布局的洞密度"
    tag: meta
    current: "洞占布局面积的 20%-50%，布局尺寸 4-12 行 × 4-8 列"
    alternatives:
      - name: "高密度洞布局（50%-80%）"
        description: "洞占比提高到 50%-80%，墙壁变为少数像素的稀疏骨架。框架内部以洞为主，精灵填入后几乎覆盖整个内部区域。视觉效果更密集，解题者需要识别稀疏的墙壁模式。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "低密度洞布局（5%-20%）"
        description: "洞占比降到 5%-20%，框架内以墙壁为主，洞是少量小区域。精灵很小且稀疏分布，解题者需要仔细寻找框架内的小洞。视觉效果与高密度版本截然不同。"
        source: inversion
