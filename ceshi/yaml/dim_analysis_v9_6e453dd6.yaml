task_id: 6e453dd6
task_type: move_along_path
summary: "左侧黑色精灵向右平移到灰色分隔线旁，封闭的洞（背景色区域触及分隔线内侧）触发向右发射红色射线至网格右边缘"

dimensions:
  - id: D1
    name: "精灵平移路径方向"
    tag: path
    current: "gravity（重力吸引）——黑色精灵沿水平方向向右平移，直到右边缘紧贴灰色分隔线（sep-1列）"
    alternatives:
      - name: "向左平移（反向重力）"
        description: "精灵从分隔线右侧向左平移到分隔线旁，射线从左侧发射到网格左边缘。完全镜像当前逻辑，解题者需要理解方向反转，推理过程对称但视觉上完全不同。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "垂直方向平移（向下重力）"
        description: "分隔线改为水平方向，精灵从上方向下平移到水平分隔线旁。射线从封闭洞向下或向上发射至网格边缘。这将水平逻辑转为垂直逻辑，改变了空间推理的轴向。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "对角线方向平移"
        description: "精灵沿45度对角线方向平移，直到触碰到某条对角线参考线。射线同样沿对角线方向发射。这大幅增加了空间推理的复杂度，因为对角线移动不保持行列对齐。"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 40
      - name: "流体填充式移动"
        description: "精灵像流体一样沿相邻背景格子向分隔线方向流动，遇到障碍物（其他精灵）时绕过。精灵形状在流动过程中可能变形以适应空间。这引入了路径搜索的推理，而非简单的平移。"
        source: flow
        source_task: 28a6681f
        delta_lines: 45

  - id: D2
    name: "射线发射路径"
    tag: path
    current: "straight_ray（直线射线）——从封闭洞所在行向右水平发射红色射线至网格右边缘"
    alternatives:
      - name: "对角线射线"
        description: "射线不沿水平方向发射，而是沿45度对角线方向从洞口发射，遇到网格边缘终止。每个洞口像素可能向右上和右下各发一条射线。这创造了扇形射线图案，视觉效果更丰富。"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 20
      - name: "射线遇障碍反射"
        description: "右侧区域放置若干障碍物像素，射线遇到障碍物时发生反射继续传播。这把简单的直线射线变为多段折线，增加了路径追踪的复杂度。"
        source: reflection
        source_task: 142ca369
        delta_lines: 35
      - name: "射线从洞口向四个方向发射"
        description: "射线不仅向右发射，还向上下左右四个方向同时发射（左向射线在到达分隔线时停止）。这改变了射线的基数关系（1个洞口产生多条射线），输出图案更复杂。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "射线沿分隔线方向传播后转弯"
        description: "射线从洞口先沿分隔线垂直方向传播一段距离，然后转90度向右水平传播。传播距离由洞的高度决定。这引入了两段式路径，解题者需要理解转弯规则。"
        source: turning_rules
        source_task: e87109e9
        delta_lines: 25

  - id: D3
    name: "射线轨迹涂色模式"
    tag: trajectory
    current: "连续涂红色——射线经过的每个右侧格子统一涂为红色(2)"
    alternatives:
      - name: "周期性颜色模式"
        description: "射线轨迹按固定周期交替涂色，如红-背景-红-背景（虚线），或红-蓝-红-蓝。周期长度可由洞的宽度或高度编码。解题者需要识别周期规律而非简单的全涂色。"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 15
      - name: "射线颜色由精灵属性决定"
        description: "不同精灵发射不同颜色的射线——颜色由精灵的像素数量、外接矩形面积或洞的大小决定（如小洞发射红色、大洞发射蓝色）。解题者需要从示例中推断属性到颜色的映射关系。"
        source: color_pairing
        source_task: 16de56c4
        delta_lines: 20
      - name: "射线长度受限（非到边缘）"
        description: "射线不一直延伸到网格右边缘，而是长度等于洞的面积或精灵的宽度。解题者需要计算精灵属性来确定射线终止位置。这从空间约束变为数值约束。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 15
      - name: "渐变涂色（颜色随距离变化）"
        description: "射线颜色从洞口开始逐渐变化——例如先涂红色、到中间涂橙色、到边缘涂黄色。颜色变化序列固定（如ARC调色板中的相邻颜色）。视觉上呈现渐变效果，推理上增加了颜色序列识别。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D4
    name: "射线源对象（精灵形状）"
    tag: src
    current: "黑色4连通精灵——2-8行x2-6列的封闭或半封闭形状，含0-2个内部洞，右侧墙体触及分隔线时洞口触发射线"
    alternatives:
      - name: "单像素控制点作为射线源"
        description: "取消精灵的平移步骤，改为在分隔线左侧放置单个彩色像素作为射线源，像素所在行直接向右发射射线。这极大简化了精灵识别步骤但保留了射线发射逻辑。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 40
      - name: "多色精灵（颜色编码角色）"
        description: "精灵不再是纯黑色，而是由两种颜色组成——外壳用一种颜色，内部标记用另一种颜色。只有特定颜色标记的洞才触发射线。解题者需要识别颜色在精灵中的功能角色。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 25
      - name: "空心框架精灵"
        description: "精灵改为规则的空心矩形框架（厚度为1像素的矩形边框），框架内部全部为洞。触发条件仍为洞口触及分隔线。这让精灵形状更规则，降低了形状识别难度但保持核心逻辑。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "方向性精灵（箭头形）"
        description: "精灵为箭头形状，箭头指向决定射线发射方向（而非固定向右）。箭头可指向右、上、下等方向。平移后箭头方向决定射线走向。这增加了方向推断维度。"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 30

  - id: D5
    name: "封闭洞触发条件"
    tag: src
    current: "enclosure_detection——洞必须是完全封闭的背景色区域（4连通分量不触及左侧子网格边界），且洞的最右列位于sep-2列（触及分隔线内侧）"
    alternatives:
      - name: "洞的最左列触发（而非最右列）"
        description: "反转触发方向：洞的最左侧列位于特定列（如第0列或精灵左边缘+1列）时触发射线。射线仍向右发射但触发条件从右侧检测变为左侧检测。解题者需要重新理解哪些洞是活跃的。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "非封闭缺口也触发射线"
        description: "不仅完全封闭的洞可以触发射线，C形开口或L形结构中朝向分隔线的凹陷区域也可以触发。这移除了封闭性检测要求，改为检测朝向分隔线的凹面结构。推理规则更宽松但需要重新定义什么算'端口'。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "洞的面积决定是否触发"
        description: "只有面积大于某个阈值（如>=2个像素）的封闭洞才触发射线，单像素洞被忽略。或反过来只有单像素洞才触发。解题者需要从示例中推断面积阈值。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "洞的行数决定射线数量"
        description: "当前每个洞口所占的每一行都发射一条射线。替代方案为：每个封闭洞只发射一条射线（从洞的中心行发射），或射线数量等于洞的宽度而非高度。这改变了洞属性到射线数量的映射方式。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D6
    name: "分隔线结构"
    tag: obstacle
    current: "separator_line——单列全高灰色(5)垂直分隔线，将网格分为左右两区；左侧宽(5-11列)，右侧窄(2-4列)"
    alternatives:
      - name: "双线分隔（两列分隔线）"
        description: "分隔线由两列灰色像素组成，中间无间隙。射线从分隔线右侧第一列开始涂色。这微调了空间布局，分隔线更醒目，解题者需要注意分隔线宽度对射线起始位置的影响。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "分隔线带有缺口"
        description: "灰色分隔线不是完整的一整列，而是有若干行被背景色中断（形成缺口）。射线只能从缺口对应的行穿过分隔线到达右侧。这增加了一个空间过滤步骤——触发行必须与缺口对齐。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "水平分隔线（上下分区）"
        description: "分隔线改为水平方向，将网格分为上下两区。精灵在上方区域向下平移到分隔线旁，射线从洞口向下发射到网格底部。这是完全的90度旋转变体。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "分隔线为对角线"
        description: "分隔线不是垂直线而是45度阶梯对角线，从左上角延伸到右下角。精灵在对角线左上方平移到对角线旁。射线从洞口沿垂直于对角线的方向发射。这大幅改变几何推理难度。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "无分隔线（以网格边缘为目标）"
        description: "移除灰色分隔线，精灵向右平移直到右边缘触及网格右边界。射线从洞口向左发射到网格左边缘。这反转了射线方向并简化了结构（无需识别分隔线）。"
        source: inversion
        source_task: null
        delta_lines: 20

  - id: D7
    name: "射线终止条件"
    tag: dst
    current: "射线延伸到网格右边缘（grid.right_edge）——填充从sep+1到w-1的所有列"
    alternatives:
      - name: "射线延伸到目标像素处停止"
        description: "右侧区域放置若干彩色目标像素，射线遇到目标像素时停止而非延伸到边缘。解题者需要识别哪些像素是阻挡射线的目标物。这引入了右侧区域的非空内容。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 15
      - name: "射线长度等于洞的属性值"
        description: "射线不延伸到边缘，而是长度等于洞的像素数量（面积）或洞的高度。例如2像素的洞发射长度为2的射线。解题者需要计数洞的属性来确定射线终止位置。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 15
      - name: "射线在遇到其他射线时停止"
        description: "射线按从上到下的顺序处理，后处理的射线遇到已涂色的射线轨迹时停止。这引入了处理顺序的依赖关系，解题者需要推断正确的射线发射顺序。"
        source: collision_detection
        source_task: e12f9a14
        delta_lines: 20
      - name: "射线填充整行（包括左侧）"
        description: "射线不仅向右延伸到边缘，还向左延伸到网格左边缘（跳过分隔线和精灵像素本身，只涂背景格子）。这让射线变为双向的，输出图案左右对称。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D8
    name: "精灵平移后的残影处理"
    tag: transform
    current: "erase——精灵平移后原位置被擦除为背景色，仅在新位置（紧贴分隔线）显示精灵"
    alternatives:
      - name: "保留原始位置（不擦除）"
        description: "精灵平移后在新位置显示，但原始位置的黑色像素也保留不变。输出同时包含原始和平移后的精灵。解题者需要对比输入输出来理解发生了复制而非移动。"
        source: keep_source
        source_task: 53fb4810
        delta_lines: 10
      - name: "平移路径留下轨迹"
        description: "精灵向右平移时，经过的路径涂上特殊颜色的轨迹（如灰色虚线表示移动路径）。这在视觉上展示了精灵的运动过程，增加了输出的信息量。"
        source: continuous_trail
        source_task: 142ca369
        delta_lines: 20
      - name: "原位置变为特殊颜色"
        description: "精灵平移后原位置不是恢复为背景色，而是变为另一种颜色（如蓝色）作为'残影'标记。解题者需要理解颜色变换规则——黑色精灵移走后变为蓝色残影。"
        source: recolor
        source_task: 271d71e2
        delta_lines: 10
      - name: "精灵不移动，仅投影"
        description: "精灵保持在输入位置不动，但在分隔线旁的对应位置'投影'出精灵的轮廓（用另一种颜色），投影中的封闭洞触发射线。解题者需要理解投影机制而非物理平移。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D9
    name: "输出网格尺寸"
    tag: grid_shape
    current: "same——输出与输入尺寸完全相同"
    alternatives:
      - name: "仅输出右侧区域"
        description: "输出仅包含分隔线右侧的区域（裁剪掉左侧和分隔线本身），只保留射线图案。解题者需要理解输出是输入的子区域，增加了空间对应关系的推理。"
        source: crop
        source_task: a6f40cea
        delta_lines: 10
      - name: "输出扩展为左右对称"
        description: "输出网格宽度翻倍，右侧区域是射线图案的镜像翻转。解题者需要理解输出包含了额外的对称变换。"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 15
      - name: "紧凑裁剪到射线覆盖区域"
        description: "输出仅保留包含所有射线的最小外接矩形（去除无射线的空白行）。这要求解题者不仅计算射线位置还要确定正确的裁剪边界。"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 10

  - id: D10
    name: "多步处理顺序"
    tag: multi_step
    current: "三步序列：Step1平移精灵→Step2检测封闭洞→Step3发射射线。各精灵独立处理，步骤间无交互"
    alternatives:
      - name: "精灵按距离排序依次处理"
        description: "精灵按照到分隔线的初始距离从近到远排序处理。先处理的精灵平移后可能阻挡后续精灵的平移路径（如两个精灵在同一行范围内）。这引入了处理顺序对结果的影响。"
        source: multi_step
        source_task: 1ae2feb7
        delta_lines: 25
      - name: "迭代平移直到所有精灵稳定"
        description: "精灵不是一次性平移到位，而是每轮每个精灵向右移动一格。如果精灵之间发生碰撞则停止。迭代直到没有精灵可以移动。这创造了类似物理模拟的效果。"
        source: multi_step
        source_task: 28a6681f
        delta_lines: 30
      - name: "射线触发后续精灵移动"
        description: "链式反应：第一个精灵平移并发射射线，射线击中的位置如果存在精灵则触发该精灵也平移。处理按链式传播直到无更多触发。增加了因果链推理。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 35
      - name: "先发射射线再平移"
        description: "反转步骤顺序：先在精灵原位置检测洞并发射射线，然后再平移精灵到分隔线旁。由于原位置的洞的几何不同，射线图案会完全不同。解题者需要理解步骤的顺序性。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D11
    name: "发射精灵与干扰精灵的比例"
    tag: meta
    current: ">=60%的精灵为射线发射体（emitter），其余为干扰项（distractor）。干扰精灵形状类似但不满足封闭洞条件"
    alternatives:
      - name: "所有精灵均为发射体（无干扰项）"
        description: "移除所有干扰精灵，每个精灵都有封闭洞且都发射射线。这降低了区分发射体和干扰项的推理难度，让解题者更专注于平移和射线逻辑。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "仅一个精灵为发射体（多数为干扰项）"
        description: "反转比例：只有一个精灵（或少数）满足触发条件，大多数精灵是干扰项。解题者需要仔细区分哪个精灵才是真正的射线源，增加了筛选推理难度。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "干扰精灵具有不同视觉特征"
        description: "干扰精灵不是形似发射体的近似形状，而是明显不同的形状类别（如实心块、十字形等）。这降低了区分难度但让谜题结构更清晰，适合作为入门变体。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "干扰精灵发射虚假射线"
        description: "干扰精灵也发射射线但颜色或长度不同（如蓝色短射线），输出中需要同时包含真射线（红色）和假射线（蓝色）。解题者需要理解两类射线的不同触发条件和行为。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D12
    name: "干扰项类型"
    tag: obstacle
    current: "C形（左开口/右开口）、L形、实心小块——形状类似封闭壳但不满足封闭洞条件的精灵"
    alternatives:
      - name: "洞未对齐分隔线的封闭精灵"
