task_id: bf45cf4b
task_type: transform_in_place
summary: "将单色控制精灵的每个填充像素放大为多色方块瓦片，空洞像素对应背景区域，输出为紧凑裁剪后的放大精灵"

dimensions:
  - id: D1
    name: "像素放大方式"
    tag: transform
    current: "控制精灵中每个填充像素替换为完整的多色方块瓦片副本，每个空洞像素替换为等大的背景区域"
    alternatives:
      - name: "填充像素放大为瓦片、空洞像素放大为瓦片的颜色反转版"
        description: "空洞位置不是背景填充，而是放置瓦片的颜色反转版本（每种前景色替换为互补色或通过固定映射变换）。解题者需发现两种瓦片版本的对应关系，推理难度显著提升"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "填充像素放大为瓦片、空洞像素放大为瓦片的旋转版"
        description: "空洞位置放置瓦片旋转90度/180度的版本而非留空。解题者需同时识别原始瓦片和旋转变体，视觉上输出更密集且需要发现旋转关系"
        source: conditional_rotation
        source_task: 291dc1e1
        delta_lines: 12
      - name: "根据控制精灵中填充像素的邻域数量选择不同瓦片变体"
        description: "填充像素根据其在控制精灵中的4-邻域填充邻居数量（0-4）放大为瓦片的不同旋转/翻转版本（如0邻居用原始、1邻居旋转90度等）。解题者需发现邻域计数与变换的对应关系"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "瓦片按位置渐变：行列位置决定瓦片的旋转角度"
        description: "控制精灵中第r行c列的填充像素放大为瓦片旋转(r+c) mod 4 × 90度的版本。输出呈现系统性旋转渐变效果，解题者需推导位置与旋转的数学关系"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D2
    name: "控制精灵与瓦片的识别规则"
    tag: transform
    current: "通过颜色数量区分：多色分量为瓦片（≥2种前景色），单色分量为控制精灵；平局时以正方形优先"
    alternatives:
      - name: "反转识别规则：单色分量为瓦片模板、多色分量为控制精灵"
        description: "多色分量作为控制精灵（不同颜色编码不同放大规则），单色方块作为基础瓦片。解题者需克服直觉判断，发现角色反转的规则"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "通过面积大小区分：较小分量为瓦片，较大分量为控制精灵"
        description: "不再依赖颜色数量而是面积来判断角色分配。面积较小的对象是瓦片，较大的是控制精灵。解题者需发现面积作为区分标准的规则"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "通过形状特征区分：严格正方形为瓦片，非正方形为控制精灵"
        description: "纯粹通过形状判断角色：外接矩形为正方形的分量是瓦片，非正方形的是控制精灵。当两者都接近正方形时增加推理难度"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "通过位置关系区分：上方/左方对象为控制精灵，下方/右方为瓦片"
        description: "根据两个分量在网格中的相对空间位置来确定角色。解题者需发现空间约定而非形态特征的判断规则"
        source: creative
        source_task: null
        delta_lines: 8

