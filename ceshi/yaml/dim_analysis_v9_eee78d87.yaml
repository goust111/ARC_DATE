task_id: eee78d87
task_type: symmetry/pattern
summary: "将6x6橙色网格中的3x3轮廓字形解码为周期3的橙黑相位瓦片，铺满16x16画布，并在中心6x6区域放置2x2平铺的栗色字形印章"

dimensions:
  - id: D1
    name: "字形到相位瓦片的解码规则"
    tag: match_cond
    current: "4种轮廓字形（plus/H/X/4corners）各对应一种固定的3x3相位瓦片，通过角点与边中心像素的布尔组合确定橙色(7)和黑色(0)的排列"
    alternatives:
      - name: "字形颜色影响相位偏移"
        description: "同一字形形状搭配不同前景色时产生不同的相位偏移（如红色偏移(0,0)、蓝色偏移(1,0)、绿色偏移(0,1)），解题者需同时推断形状决定瓦片内容、颜色决定铺贴起点两层映射关系，增加组合推理难度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "字形旋转状态影响解码"
        description: "字形不限于标准朝向，输入可包含旋转90/180/270度的版本，解码时需先识别旋转角度再映射到标准相位瓦片并施加相同旋转。解题者需判断朝向并相应旋转铺贴结果"
        source: conditional_rotation
        source_task: 291dc1e1
        delta_lines: 30
      - name: "字形像素直接标记橙色位置（正负反转）"
        description: "反转解码逻辑：字形像素位置变为橙色填充(7)，非字形位置变为黑色网格线(0)，不经过当前的复杂布尔解码。解题者需识别正反对调的简化规则，视觉上产生互补格栅图案"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "字形位置编码相位偏移"
        description: "字形在6x6网格中的左上角坐标(r0,c0)取模3作为铺贴的相位偏移量，使相同字形因放置位置不同产生不同的铺贴起点。解题者需额外推断位置到偏移的映射公式"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D2
    name: "源对象的形状集合"
    tag: src
    current: "4种固定的3x3轮廓字形：plus(.#./#11/.#.)、H(#.#/###/#.#)、X(#.#/.#./#.#)、4corners(#.#/.../#.#)，每种仅使用单一非橙色颜色"
    alternatives:
      - name: "字形扩展为4x4或5x5尺寸"
        description: "字形从3x3扩大到更大的尺寸，相位瓦片的周期也相应增大，输出画布的铺贴图案更精细复杂。解题者需处理更大的编码空间和更多的字形类型"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "字形使用双色编码"
        description: "字形内有两种不同的非背景色，一种定义相位瓦片中的橙色位置，另一种定义中心印章的额外装饰层。解题者需分离双层编码信息，增加多维度解读的推理复杂度"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "字形为非对称图案"
        description: "字形集合包含不具有旋转或反射对称性的图案（如L形、Z形等），相位瓦片也失去对称性，方向感知变得重要。解题者需处理不对称铺贴的视觉效果"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "字形从网格边缘色条中读取"
        description: "输入不是简单嵌入式字形，而是网格最外圈的一行/列像素作为图例，编码字形模式。类似195c6913的template_lookup，解题者需先从色条提取字形信息再解码"
        source: template_lookup
        source_task: 195c6913
        delta_lines: 25

  - id: D3
    name: "目标画布的结构"
    tag: dst
    current: "16x16黑色画布用周期3的橙黑相位瓦片铺满，中心(5,5)-(10,10)区域放置2x2平铺的栗色字形印章"
    alternatives:
      - name: "画布尺寸由字形类型决定"
        description: "不同字形类型产生不同大小的输出（如plus生成12x12、H生成18x18），解题者需从训练样例中推断字形类型到画布尺寸的对应关系，增加尺寸推理维度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "多个印章区域等间距分布"
        description: "画布中不止中心一处放置栗色字形印章，而是在多个等间距位置各放一个（如四个象限各一个），类似65b59efc的tiling stamp机制。解题者需理解印章分布规则"
        source: tiling
        source_task: 65b59efc
        delta_lines: 25
      - name: "画布背景使用字形前景色而非黑色"
        description: "铺贴画布的两种颜色不是橙色和黑色，而是橙色和字形的前景色（如绿色plus产生橙绿格栅），最终配色由输入决定。解题者需从输入推断输出的调色板"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "中心区域为空洞的环形格栅"
        description: "中心6x6保持纯黑空洞而非放置栗色印章，栗色字形改为放在输出四个角落各一份。反转中心/边缘的角色，解题者需理解环形布局逻辑"
        source: inversion
        source_task: null
        delta_lines: 20

  - id: D4
    name: "栗色重着色变换"
    tag: transform
    current: "中心6x6区域中字形像素位置统一重着色为栗色(9)，非字形位置保持格栅原样"
    alternatives:
      - name: "保留原始字形颜色不变"
        description: "中心区域的字形像素保持输入中的原始颜色（如绿色3、蓝色1等），不统一转换为栗色。输出包含四种颜色而非三种，解题者需注意颜色保留规则"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "栗色仅出现在格栅线与字形的交叉处"
        description: "栗色只在同时满足「字形像素位置」且「格栅线位置」的像素处出现，其余保持格栅原样。相当于布尔AND运算，解题者需理解两种模式的交集逻辑"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "中心印章做镜像翻转拼接"
        description: "2x2平铺的四个3x3字形不是简单复制，而是左上原始、右上水平翻转、左下垂直翻转、右下180度旋转，形成双轴对称的花纹。解题者需识别对称变换规则"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 15
      - name: "中心印章做旋转拼接"
        description: "四个3x3区域分别为原始、顺时针90度、180度、逆时针90度旋转排列，形成旋转对称的中心图案。解题者需推断旋转铺贴规则而非简单重复"
        source: rotation
        source_task: 2c181942
        delta_lines: 15
      - name: "字形前景色决定重着色目标"
        description: "中心印章的重着色不固定为栗色(9)，而是由字形前景色通过某种映射确定（如色值+1取模10），解题者需从训练样例推断颜色映射规则"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 15

  - id: D5
    name: "输出网格尺寸与裁剪方式"
    tag: grid_shape
    current: "固定16x16方形输出（计算公式为3*6-2=16）"
    alternatives:
      - name: "输出为完整瓦片倍数（紧凑裁剪）"
        description: "输出尺寸为恰好N个完整3x3瓦片（如15x15=5x5瓦片），不留不完整的边缘列/行。解题者需理解尺寸与瓦片数的精确对应关系"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 8
      - name: "输出尺寸由字形像素数编码"
        description: "输出边长等于字形前景像素数量的某个函数（如像素数*3），plus(5像素)产生15x15、H(7像素)产生21x21。解题者需建立像素计数与输出尺寸的对应关系"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "输出为非正方形矩形"
        description: "输出宽度和高度不同（如16x10或12x18），由字形的某种属性（如最左像素列和最右像素列的距离差）决定长宽比。解题者需分别推断两个方向的输出尺寸"
        source: creative
        source_task: null
        delta_lines: 15

