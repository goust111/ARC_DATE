      - name: "火车必须跨区域对接"
        description: "火车不能对接到自身所在区域的车站，必须跨区域对接（强制要求火车和目标车站在不同区域）。解题者需理解这个反直觉的约束条件。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "车站距边界的间距编码旋转角度"
        description: "车站距最近条纹的间距值（2-4像素）编码了旋转的额外参数：间距为2表示不额外旋转，间距为3表示额外旋转90度，间距为4表示额外旋转180度。解题者需注意空间距离与变换参数的对应关系。"
