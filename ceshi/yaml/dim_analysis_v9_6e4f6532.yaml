task_id: 6e4f6532
task_type: move_to_match
summary: "将网格中含有颜色8车身和颜色9耦合器的'火车'精灵，通过耦合器数量与'车站'（孤立的9簇）大小匹配，利用条纹色标记物确定旋转/翻转方向，擦除原位后对接到目标车站上"

dimensions:
  - id: D1
    name: "匹配条件：耦合器数量与车站大小的计数匹配"
    tag: match_cond
    current: "每个火车的耦合器9像素数量必须等于目标车站的9像素数量（|s.coupler9s| == |d|），且每种大小唯一对应一个车站"
    alternatives:
      - name: "颜色匹配替代计数匹配"
        description: "火车车身上携带一个特殊颜色的标签像素（非条纹色），车站旁边也有一个相同颜色的标签像素。配对条件变为标签颜色一致而非耦合器数量一致。所有火车可以拥有相同数量的耦合器，解题者需要从颜色对应关系推断配对目标，推理入口从计数变为颜色关联。"
        source: color_match
        source_task: 2c181942
        delta_lines: 25
      - name: "耦合器形状匹配"
        description: "耦合器不仅数量需匹配，其空间排布形状也必须与车站形状全等（含旋转/翻转）。例如耦合器呈L形则车站也呈L形。不同火车的耦合器数量可以相同但形状不同，解题者需进行精确的形状比较而非简单计数。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 20
      - name: "面积排序匹配"
        description: "火车按车身8像素的总面积排序，车站按9像素数量排序，第k大面积的火车对接到第k大的车站。解题者需对两组对象分别排序后建立序数映射，不再需要精确的计数相等条件。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 20
      - name: "边缘颜色匹配"
        description: "每个车站所在区域的边界条纹有一组独特的颜色组合，火车上的标记像素颜色组合必须与目标车站区域的条纹颜色集合完全一致才能配对（标记不仅指示方向，还同时决定目标）。耦合器数量不再参与匹配。解题者需同时理解颜色编码的双重功能：配对+定向。"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 25
      - name: "洞数计数匹配"
        description: "火车车身有若干个内部空洞（背景色被8像素包围形成的洞），洞的数量等于目标车站的9像素数量。解题者需先识别火车内部的拓扑结构（计数洞数），再与车站大小匹配，增加了拓扑分析的推理层次。"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 30

  - id: D2
    name: "匹配条件：方向确定机制（旋转规则）"
    tag: match_cond
    current: "火车上的条纹色标记物相对于耦合器质心的方向，必须与目标区域对应颜色边界条纹的方位一致，以此唯一确定旋转/翻转操作"
    alternatives:
      - name: "车站形状不对称性决定方向"
        description: "不使用颜色标记物，而是通过车站9像素自身的不对称形状来唯一确定对接方向——耦合器的形状必须在唯一的旋转/翻转下与车站形状重合。车站设计为手性不对称形状（如L形、T形），解题者需通过空间形状推理而非颜色编码来确定方向。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "相邻车站的相对位置决定方向"
        description: "火车上没有颜色标记物，但火车上有多个耦合器子组，每个子组由不同数量的9像素构成。对接方向通过让最大子组朝向最近的网格边缘来确定。解题者需分析耦合器的空间分布模式来推断方向。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "车身形状的对称轴决定方向"
        description: "火车的8像素车身沿某轴近似对称，对接时需让此对称轴与目标区域的某条边界条纹平行。解题者需识别车身的对称性质并与区域几何对齐，推理从颜色编码转为几何对称分析。"
        source: mirror_symmetry
        source_task: 4c416de3
        delta_lines: 30
      - name: "标记像素使用距离编码方向"
        description: "标记物不通过颜色编码方向，而是通过其与耦合器质心的距离编码：距离最近的标记对应火车最终朝上的方向，次近的对应右方，依此类推。所有标记可以是同一颜色，解题者需从空间距离排序推断方向映射。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D3
    name: "源对象：火车结构组成"
    tag: src
    current: "火车由颜色8的不规则色块车身（5-20像素）、颜色9的耦合器（附着于车身，数量1/2/4）和2-3个条纹色标记像素组成，外接矩形4-9行 x 3-8列"
    alternatives:
      - name: "多色车身火车"
        description: "火车车身不再使用统一的颜色8，而是由两种不同颜色组成（如颜色8构成主体，颜色5构成头部），车身内部的颜色分区也编码了方向信息（头部朝向目标区域的某个方向）。去除独立的标记像素，解题者需从车身的内部颜色结构推断方向。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "空心车身火车"
        description: "车身8像素形成一个空心框架（中间有背景色洞），耦合器在框架外侧，标记在框架内部的洞中。解题者需理解空心结构，并注意对接后洞被保留还是填充。增加了空间认知复杂度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "火车由两个分离组件组成"
        description: "火车的车身分为两个不直接相连的8色色块，它们通过共享耦合器9像素（两者都8-邻接耦合器）间接关联。整体作为一个单元移动和对接。解题者需先将两个分离组件识别为同一火车的部分。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "最小化车身（仅耦合器+标记）"
        description: "火车只有1-2个颜色8像素作为最小车身，其余全是耦合器9像素和标记像素。火车在视觉上以9像素为主体。反转了当前'车身大、耦合器小'的比例关系，解题者需要在以9像素为主的结构中识别出微小的8像素车身。"
        source: inversion
        source_task: null
        delta_lines: 20

  - id: D4
    name: "目标对象：车站结构"
    tag: dst
    current: "车站是8-连通的颜色9像素簇，且簇中每个像素的8-邻域内无颜色8像素；大小从{1,2,4}中选取，每个大小唯一对应一个火车"
    alternatives:
      - name: "车站由多种颜色组成"
        description: "车站不再仅由颜色9组成，而是每个车站由一组独特颜色的像素构成（如蓝+红双色车站），火车的耦合器也是对应的多色组合。匹配不仅看数量还要看颜色组合。解题者需进行颜色组合配对推理。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "车站带有方向标记"
        description: "车站除了核心的9像素外，旁边还有一个颜色不同的指示像素（箭头色），指明火车应从哪个方向对接。这取代了火车上的条纹色标记作为方向编码，方向信息从源对象转移到目标对象。解题者需在目标侧读取方向指示。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "车站为空洞（背景色区域）"
        description: "车站不是正值像素，而是被条纹围成的小块背景色区域（类似洞）。火车需要识别区域内特定大小的空洞并对接到那里。耦合器对接后填充背景色区域。解题者需从负空间识别目标，增加感知难度。"
        source: cavity_fill
        source_task: 5dbc8537
        delta_lines: 35
      - name: "车站大小可重复"
        description: "多个车站可以有相同的大小（如两个大小为2的车站），此时仅靠数量无法区分，需额外通过火车标记颜色与车站所在区域的边界条纹颜色关系来消歧。增加了多步推理：先计数筛选候选集，再通过颜色细化匹配。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D5
    name: "变换操作：对接变换类型"
    tag: transform
    current: "擦除火车原位（填背景色）；对火车施加唯一的翻转/旋转使标记朝向正确；平移使耦合器精确对齐车站9像素；车站9像素保留不被覆盖"
    alternatives:
      - name: "对接后重新上色"
        description: "火车对接后，其车身8像素重新着色为目标车站所在区域边界条纹的主色（最常见边界颜色），不再保持颜色8。解题者需推断对接后的颜色变换规则，增加一步推理。"
        source: recolor
        source_task: 20270e3b
        delta_lines: 15
      - name: "镜像反射替代旋转"
        description: "不使用通用的D4群变换，仅允许沿水平轴或垂直轴的镜像反射（不允许90度旋转）。标记物编码的是镜像轴方向而非旋转角度。解题者需判断使用哪种轴的镜像，推理方式从旋转搜索变为二选一的镜像选择。"
        source: reflection
        source_task: b10624e5
        delta_lines: 20
      - name: "保留原位火车（不擦除）"
        description: "对接时不擦除火车的原始位置，输出中同时存在原位的火车和对接后的火车副本。解题者需理解这是一个'复制+移动'操作而非'移动'操作，与大多数ARC任务的擦除直觉不同。"
        source: keep_source
        source_task: 247ef758
        delta_lines: 10
      - name: "颜色交换变换"
        description: "如果对接使用了翻转（flip_ud=True），则火车车身的颜色8与标记像素中某个颜色互换。这类似于a25697e4的颜色交换规则，增加了一个条件判断：翻转触发颜色变换，纯旋转不触发。解题者需关注变换类型与颜色变化的因果关系。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 20

  - id: D6
    name: "轨迹：源对象擦除行为"
    tag: trajectory
    current: "火车从原位完全擦除（填充为背景色），车站9像素始终保留不受影响"
    alternatives:
      - name: "保留源对象轮廓"
        description: "火车移走后，原位留下一个单像素宽的轮廓（用火车车身8的某种映射颜色绘制），形成'幽灵'效果。解题者需理解输出中同时包含对接后的火车和原位的轮廓残影。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "移动路径涂色"
        description: "火车从原位到目标位的平移轨迹上，沿途所有经过的单元格被涂上一种特定颜色（如使用最近的条纹颜色）。解题者需推断移动路径并理解涂色规则。"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 30
      - name: "部分擦除（仅擦除车身保留标记）"
        description: "火车移走后，原位的标记像素不被擦除（保留在原地），只有8像素和9像素被清除。输出中原位的标记像素作为历史痕迹存在，解题者需区分原位标记和对接后的标记。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D7
    name: "网格框架：条纹分区结构"
    tag: grid_shape
    current: "2-4个边缘条纹（每条2-4像素厚，颜色各异）+ 0-1条内部条纹（2像素厚）将网格分为1-2个矩形区域；区域至少10x10"
    alternatives:
      - name: "十字形分区（两条内部条纹）"
        description: "同时有一条水平和一条垂直内部条纹，将内部空间分为四个矩形区域。火车和车站可分布在四个区域中，增加了空间分析复杂度。每个区域有3-4条不同颜色的边界条纹。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "无边缘条纹，仅用内部条纹分区"
        description: "网格没有边缘条纹，仅通过1-2条内部条纹分隔区域。区域的'边界'条纹变为网格边缘本身（无颜色标记）。标记像素的方向编码需改为指向网格边缘而非颜色条纹，解题者需用不同策略判断方向。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "不等厚条纹作为额外信号"
        description: "每条边缘条纹的厚度不仅可变（2-4），且厚度本身编码了额外信息：例如条纹越厚表示该方向的优先级越高，当多个旋转方向都满足标记对齐时选择最厚条纹方向。增加了一层数值推理。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "紧凑裁剪输出"
        description: "输出不保持原始网格大小，而是裁剪为仅包含所有对接后火车+车站的最小外接矩形（去除多余的条纹和背景）。解题者需额外推断输出尺寸的变化规则。"
        source: tight_crop
        source_task: 67e490f4
        delta_lines: 15

  - id: D8
    name: "源-目标基数关系"
    tag: meta
    current: "1:1 严格匹配——每个火车唯一对应一个车站（通过耦合器数量唯一确定），2-3组配对"
    alternatives:
      - name: "多对一对接"
        description: "多个火车共享同一个大型车站，每个火车对接到车站的不同子区域。车站由多个9像素子簇组成，不同火车的耦合器分别匹配不同子簇。解题者需理解一个车站可接纳多个火车且分配方式唯一。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "一对多展开"
        description: "一个火车需要同时对接到多个同大小的车站（复制自身到每个目标位置）。火车在每个目标位置都以相同朝向出现（由标记统一确定方向）。解题者需理解'一个源产生多个副本'的变换模式。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "有干扰项的匹配"
        description: "网格中有一些额外的'假火车'或'假车站'——外观类似但不满足匹配条件的对象。解题者需先过滤干扰项再执行配对。例如某个9像素簇附近有8像素（不是车站），或某个含8的组件没有耦合器（不是火车）。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D9
    name: "多步处理：对接顺序"
    tag: multi_step
    current: "所有火车独立对接，无顺序依赖——各火车的对接互不影响"
    alternatives:
      - name: "顺序对接（先对接的火车影响后续）"
        description: "火车按某种规则排序（如耦合器数量从小到大）依次对接，先对接的火车占据空间后成为后续火车的障碍物。后续火车的对接位置可能因先前火车的存在而需要绕行或调整。解题者需推断正确的处理顺序。"
        source: multi_step
        source_task: 247ef758
        delta_lines: 25
      - name: "链式对接"
        description: "第一个火车对接到车站后，其车身成为第二个火车的新'车站'（第二个火车的耦合器匹配第一个火车车身上的某些像素），形成链式对接结构。解题者需理解对接产生新目标的递归模式。"
        source: chaining
        source_task: 78332cb0
        delta_lines: 40
      - name: "两阶段处理：先匹配后变换"
        description: "第一阶段：所有火车同时移动到目标区域（无旋转，仅平移到区域中心），第二阶段：在目标区域内旋转/翻转并精确对接到车站。输出是第二阶段完成后的状态。解题者需理解分步执行的规则。"
        source: creative
        source_task: null
        delta_lines: 30

