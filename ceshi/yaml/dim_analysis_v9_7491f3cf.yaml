task_id: 7491f3cf
task_type: move_to_match
summary: "四个5x5面板排成一行：面板0包含一条墙线和一个指示像素，面板1和2是对称图案源，面板3（空白）需要根据墙线将面板1和2的非背景像素合成——指示像素侧取面板1，另一侧取面板2"

dimensions:
  - id: D1
    name: "区域分割方式"
    tag: match_cond
    current: "线性分割（line_boundary）——墙由5个线像素组成，形成行/列/对角线/反对角线或L弯的8-连通路径，经过中心(2,2)，将5x5网格分为内外两个区域"
    alternatives:
      - name: "十字交叉分割"
        description: "墙不是一条线，而是两条交叉线（如一行+一列），将5x5网格分为四个象限。指示像素标记其中一个象限为'主区域'取面板1，对角象限取面板2，其余两个象限可取某种混合规则（如面板1和2的交集）。解题者需要理解四象限逻辑而非二分法，推理复杂度显著提升。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "曼哈顿距离分割"
        description: "不使用显式墙线，而是在面板0中放置一个中心标记点，按曼哈顿距离阈值分割区域：距离<=k的像素取面板1，距离>k的取面板2。阈值k从示例中推断（如中心到指示像素的距离）。这引入了连续距离概念，完全改变了空间推理方式。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "棋盘格分割"
        description: "面板0中不画墙线，而是用两种颜色的棋盘格标记区域——颜色A位置取面板1，颜色B位置取面板2。指示像素的颜色决定哪种棋盘格对应面板1。这将空间分割从连续区域变为交错分布，视觉上呈现独特的交织效果。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "连通分量分割"
        description: "面板0中放置若干分散的小色块（不构成连续线），用flood-fill对背景做连通分量分析。指示像素所在的连通背景区域取面板1，其他连通区域取面板2。解题者需要自行识别被色块分隔的区域，而非跟随一条明确的线。"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 20

  - id: D2
    name: "内外区域与图案的对应关系"
    tag: match_cond
    current: "指示像素侧对应面板1（inside→tile1），另一侧对应面板2（outside→tile2），对应关系固定"
    alternatives:
      - name: "颜色匹配决定对应"
        description: "不再固定inside→tile1，而是根据指示像素的颜色来决定对应关系：指示像素颜色与面板1前景色相同则inside→tile1，与面板2前景色相同则inside→tile2。解题者需要观察颜色匹配而非依赖固定位置，增加了一层颜色推理。"
        source: color_match
        source_task: 2c181942
        delta_lines: 10
      - name: "面积大小决定对应"
        description: "指示像素侧如果面积较大则取面板2（像素数更多的图案），面积较小则取面板1（像素数更少的图案）。或者反过来——大区域配稀疏图案，小区域配密集图案。解题者需要同时评估区域面积和图案密度。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 15
      - name: "取反对应——inside取tile2，outside取tile1"
        description: "简单取反当前规则：指示像素侧取面板2的图案，另一侧取面板1的图案。看似简单但与直觉相反，解题者容易陷入'指示像素标记的区域应该用第一个图案'的思维定势，实际需要从示例中发现反转关系。"
        source: inversion
        source_task: null
        delta_lines: 5

  - id: D3
    name: "墙线形状类型"
    tag: match_cond
    current: "直线（行/列/对角线/反对角线）或L弯，经过中心(2,2)，关于指示像素到中心连线对称"
    alternatives:
      - name: "曲线墙（阶梯状折线）"
        description: "墙不限于直线或L弯，可以是阶梯状折线（如Z形或S形），仍然8-连通且经过中心。更多样的墙形状增加了flood-fill结果的不可预测性，解题者需要仔细追踪每种曲线的分割效果。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "环形墙（闭合环路）"
        description: "墙形成一个闭合环路围绕某个区域，而非开放的从边到边的线。指示像素在环内则环内取面板1，环外取面板2。这改变了分割的拓扑结构——从线性分割变为围合分割，类似岛屿与海洋的关系。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "不对称墙"
        description: "取消墙关于指示像素-中心轴对称的约束，允许任意形状的8-连通墙（仍需经过中心并触及至少两边）。不对称墙产生不规则的区域分割，解题者无法利用对称性简化推理，必须完整追踪flood-fill过程。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D4
    name: "源图案（tile1和tile2）"
    tag: src
    current: "两个5x5单色对称图案（D1+D2对角对称），tile1有8-12个非背景像素，tile2有9-12个非背景像素"
    alternatives:
      - name: "多色图案源"
        description: "面板1和面板2各自包含2-3种不同的前景色，形成多色图案。合成时保留原始颜色而非只用单色。这增加了视觉复杂性，解题者需要理解多色保留规则而非简单的'有色/无色'二分。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "非对称随机图案"
        description: "取消D1+D2对称约束，面板1和面板2可以是任意非对称图案（仍有一定数量的非背景像素）。这消除了对称性提供的视觉线索，解题者必须逐像素理解合成规则而非利用图案的结构特征。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "三个源面板"
        description: "增加第三个源面板（面板3），墙将区域分为三部分（如用十字分割）：每个区域分别取不同面板的图案。总面板数增加到5个（cue+3源+1输出），需要更宽的网格。解题者需要理解三源合成，推理难度大幅提升。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D5
    name: "输出目标面板"
    tag: dst
    current: "面板3为全背景色的空白面板，需要填充合成结果"
    alternatives:
      - name: "预填充部分内容的目标面板"
        description: "面板3不是完全空白，而是预填充了部分像素（如已有一些正确的合成像素）。解题者需要补全剩余像素而非从零开始。这类似于填空题模式，降低了初始认知负担但要求解题者识别已有部分的正确性。"
        source: cavity_fill
        source_task: 5dbc8537
        delta_lines: 15
      - name: "目标面板带干扰像素"
        description: "面板3中预先放置了一些'干扰'像素（错误颜色），解题者需要识别并替换这些错误像素同时填充空白位置。这增加了纠错维度，不仅要知道该填什么，还要知道哪些已有内容是错的。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "输出只保留变化区域（裁剪输出）"
        description: "输出不是完整的7x25网格，而是只输出5x5的合成面板（紧凑裁剪）。这改变了输出框架，解题者需要理解输出范围发生了变化。视觉上更简洁但改变了任务的输入-输出格式约定。"
        source: tight_crop
        source_task: 67e490f4
        delta_lines: 10

  - id: D6
    name: "合成变换规则"
    tag: transform
    current: "区域像素合成——inside区域取tile1非背景像素，outside区域取tile2非背景像素，墙上取tile1优先、tile2回退（仅4-连通墙时）"
    alternatives:
      - name: "颜色叠加/混合合成"
        description: "当tile1和tile2在同一位置都有非背景像素时，不是选其一而是用第三种颜色（如两色之和对10取模对应的ARC颜色）。这引入了颜色运算的概念，解题者需要发现颜色叠加规则，推理过程更加数学化。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "异或合成"
        description: "合成规则改为异或逻辑：只在tile1和tile2恰好有一个为非背景时才输出颜色；两者都为非背景或都为背景时输出背景色。这产生了互补效果，区域分割依然有效但具体像素的保留规则完全不同。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "分区颜色互换"
        description: "inside区域使用tile2的图案但将颜色替换为tile1的颜色，outside区域使用tile1的图案但颜色替换为tile2的颜色。即形状来自一个面板，颜色来自另一个面板。解题者需要分离形状和颜色两个属性进行重组。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 15
      - name: "墙线着色规则变化"
        description: "当前墙上像素优先取tile1，回退取tile2（仅4-连通墙时）。替代方案：墙上像素始终取tile1和tile2中非背景像素数更多的那个面板的颜色；或者墙上像素使用独立的第三种颜色（如cue_color）。这改变了边界处理逻辑。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D7
    name: "指示像素的位置约束"
    tag: symbol_instructions
    current: "指示像素必须在面板角落{(0,0),(0,4),(4,0),(4,4)}或边中点{(0,2),(2,0),(2,4),(4,2)}这8个位置之一，且与墙像素8-孤立"
    alternatives:
      - name: "指示像素可在任意边缘位置"
        description: "放宽约束，允许指示像素在5x5面板的任意边缘位置（第0行、第4行、第0列、第4列的任意格子），而非仅限于角落和边中点。这增加了指示像素的可能位置从8个到16个，墙的对称轴方向也更多样。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "指示像素在面板内部"
        description: "指示像素不再限于面板边缘，可以在5x5面板的任意非中心位置。墙仍需经过中心，但指示像素在内部意味着flood-fill的起点更灵活，产生的区域形状更不可预测。解题者需要仔细追踪flood-fill从内部点开始的扩散过程。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "多个指示像素"
        description: "放置2个指示像素分别标记两个区域，每个指示像素的颜色不同，分别对应tile1和tile2。解题者需要识别两个指示像素并通过颜色匹配确定区域-面板对应关系。这明确化了对应关系但增加了视觉元素。"
        source: marker_pixels
        source_task: 9aaea919
        delta_lines: 20

  - id: D8
    name: "面板布局与网格结构"
    tag: grid_shape
    current: "4个5x5面板在同一行排列，1像素宽的边框分隔，总网格7x25"
    alternatives:
      - name: "2x2面板矩阵布局"
        description: "4个面板排成2x2矩阵（cue在左上，tile1在右上，tile2在左下，输出在右下），总网格13x13。这改变了空间布局但保持同样的逻辑。解题者需要适应矩阵而非线性排列，面板间的对应关系需要二维思考。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "可变面板尺寸"
        description: "面板尺寸不固定为5x5，可以是3x3、5x5或7x7等奇数尺寸。不同训练样例可能使用不同尺寸，解题者需要先识别面板尺寸再应用规则。核心逻辑不变但尺寸泛化增加了抽象推理难度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "竖排面板（单列排列）"
        description: "4个面板纵向排列为一列而非一行，总网格25x7。逻辑完全相同但视觉排列方向改变。解题者需要从垂直布局中识别出与水平布局相同的规则结构，测试空间转换的灵活性。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D9
    name: "Flood-fill连通性"
    tag: meta
    current: "4-连通flood-fill（上下左右），从指示像素出发被墙阻挡，确定inside区域"
    alternatives:
      - name: "8-连通flood-fill"
        description: "将flood-fill从4-连通改为8-连通（包括对角线邻居）。这意味着对角线墙（如主对角线）不再能有效分割区域（因为8-连通可以穿过对角线间隙），只有行/列方向的墙或足够宽的墙才能分割。这根本性地改变了哪些墙配置是有效的，解题者需要理解8-连通与4-连通的区别。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "跳跃式flood-fill"
        description: "flood-fill不再逐格扩散，而是跳跃式扩散——每次跳2格（类似国际象棋中象的走法）。墙需要更厚才能有效阻挡这种跳跃扩散。这创造了非连续的inside区域，产生独特的棋盘格状分割效果。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "方向受限的flood-fill"
        description: "flood-fill只能向某些方向扩散（如只能向右和向下），由指示像素相对于中心的位置决定扩散方向。这产生了非对称的区域分割，同一条墙在不同扩散方向下分出完全不同的区域。解题者需要从示例中推断扩散方向限制。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D10
    name: "墙线的4-连通性与回退规则"
    tag: meta
    current: "墙若为4-连通（一个连通分量），则墙上像素允许tile2回退；若非4-连通（如对角线墙），则墙上只能取tile1"
    alternatives:
      - name: "取消回退——墙上只取tile1"
        description: "简化规则：无论墙的连通性如何，墙上像素始终只取tile1的非背景像素，不允许tile2回退。这消除了一条隐藏的条件分支，使规则更统一但可能导致对角线墙上出现更多背景色空洞。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "墙上始终允许回退"
        description: "反转当前规则：无论墙的连通性，墙上像素都先试tile1再试tile2回退。这使所有墙类型行为统一，但改变了对角线墙的视觉输出——对角线墙上会出现更多tile2的颜色。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "墙上像素取两个面板的叠合"
        description: "墙上像素不做优先级选择，而是：如果tile1和tile2都有非背景像素，则取tile1的颜色；如果只有一个有非背景，取那个；都没有则保持背景。这实质上是OR逻辑，使墙成为两个图案的'融合带'。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D11
    name: "面板间的颜色约束"
    tag: meta
    current: "cue_color、t1_color、t2_color三色互不相同且都不等于tile_bg；border可以是任意非tile_bg颜色"
    alternatives:
      - name: "cue_color与某个面板色相同"
        description: "允许cue_color等于t1_color或t2_color。解题者需要从面板0的结构（线vs孤立点）区分墙和图案，而非依赖颜色唯一性来识别。这增加了颜色歧义性，测试结构识别而非颜色识别能力。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "多色墙线"
        description: "墙线不是单一cue_color，而是由两种颜色交替组成（如奇数位置用色A，偶数位置用色B）。指示像素用第三种颜色。解题者需要识别出交替色墙仍然是一条墙线，而非两个独立对象。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "面板1和面板2使用相同前景色"
        description: "t1_color等于t2_color，两个面板只在图案形状上不同，颜色相同。合成结果中无法通过颜色区分像素来源。解题者必须通过空间位置（而非颜色）验证自己的分割理解是否正确，增加了验证难度。"
        source: inversion
        source_task: null
        delta_lines: 5

  - id: D12
    name: "面板0中cue的编码方式"
    tag: symbol_instructions
    current: "面板0用同一种cue_color绘制墙线和指示像素，指示像素通过8-孤立性（无8-邻居是cue）与墙区分"
    alternatives:
      - name: "双色编码——墙和指示像素用不同颜色"
        description: "墙用颜色A，指示像素用颜色B，两者通过颜色而非连通性区分。这降低了识别难度（颜色比连通性更直观），但作为ARC谜题仍然有趣，因为解题者需要理解两种颜色分别代表的语义。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "无显式指示像素——由墙形状暗示方向"
        description: "移除指示像素，inside区域由墙的形状隐式决定——例如L弯的凹侧为inside，或对角线分割时面积较小的一侧为inside。解题者需要从墙的几何特征推断哪一侧是inside，增加了推理深度。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "指示像素为小型精灵而非单像素"
        description: "指示像素不是一个孤立点，而是一个2x2或L形的小型精灵（仍与墙不相邻）。精灵的形状或朝向编码额外信息——如精灵朝向决定flood-fill扩散的优先方向。这增加了符号编码的复杂性。"
        source: anchor_points
        source_task: 4c416de3
        delta_lines: 25

  - id: D13
    name: "面板数量与多步合成"
    tag: multi_step
    current: "单步合成——一次性将tile1和tile2合成到tile3"
    alternatives:
      - name: "链式合成——先合成中间结果再与第三个面板合成"
        description: "增加第5个面板（总共5个源面板+1个输出面板）。第一步用面板1和面板2合成中间结果，第二步用中间结果和面板3再次合成最终结果（可能用不同的墙线分割）。解题者需要理解两步合成流程，每步使用不同的分割规则。"
        source: multi_step
        source_task: 4c7dc4dd
        delta_lines: 40
      - name: "迭代合成——多个面板按顺序叠加"
        description: "有N个源面板（N>2），每个面板按顺序叠加到输出上。第i个面板的像素只在特定条件下覆盖已有结果——如只覆盖背景色位置，或只覆盖最近一次写入的颜色位置。解题者需要理解叠加顺序和覆盖规则。"
        source: multi_step
        source_task: 247ef758
        delta_lines: 30
      - name: "条件合成——基于示例学习规则"
