task_id: 21897d95
task_type: transform_in_place
summary: "网格被分割为多个单色区域，T形颜色1标记指示重新着色规则：茎指向目标区域，对角线单元标识源区域颜色；彩色中心T标记使用中心颜色替代；可选L形颜色9标记触发输出旋转90度"

dimensions:
  - id: D1
    name: "核心重着色变换规则"
    tag: transform
    current: "T标记的茎指向目标区域，目标区域被重着色为源区域颜色（normal T）或中心颜色（colored T）；标记单元被填充为源侧区域的最终颜色"
    alternatives:
      - name: "颜色交换而非单向重着色"
        description: "T标记不是单向将源色涂到目标区域，而是交换源区域和目标区域的颜色。解题者需要追踪双向颜色变化，尤其当多个T标记形成链式交换时，推理复杂度显著增加。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 25
      - name: "混色而非替换"
        description: "目标区域不完全变为源色，而是使用源色和目标色的'混合'——在ARC调色板中选择两色数值的中间色（如红2+蓝8→紫5）。解题者需要推断颜色混合规则而非简单替换，增加了数值推理维度。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "重着色方向反转：源变为目标色"
        description: "茎仍指向目标区域，但颜色流向反转：源区域被重着色为目标区域的原始颜色，目标区域保持不变。这是当前规则的取反，解题者需要注意箭头方向与颜色流向的不一致性，增加了认知挑战。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "多数颜色投票重着色"
        description: "当多个T标记指向同一目标区域时，不取最后一个源色，而是对所有指向该区域的源色进行多数投票，目标区域变为最多次出现的源色。引入计数和投票逻辑，使T标记之间产生竞争关系。"
        source: majority_color
        source_task: 800d221b
        delta_lines: 25

  - id: D2
    name: "标记擦除后的填充规则"
    tag: transform
    current: "所有T标记单元在输出中被填充为源侧区域的最终颜色，使标记'消失'融入源区域"
    alternatives:
      - name: "标记保留不擦除"
        description: "T标记的颜色1像素在输出中保持不变，不被擦除。解题者需要区分哪些颜色1像素是标记vs哪些区域被重着色，视觉上更加混乱但信息更完整。这是keep_source的变体。"
        source: keep_source
        source_task: 53fb4810
        delta_lines: 10
      - name: "标记融入目标区域而非源区域"
        description: "标记单元被填充为目标区域的最终颜色（而非源区域）。这改变了标记'归属'的判断，解题者需要注意标记消失后的颜色来自茎指向的方向而非对角线方向。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "标记变为第三种颜色（边界标记色）"
        description: "T标记单元不融入任何区域，而是变为一种固定的边界颜色（如颜色5），形成可见的区域边界线。输出中保留了标记位置的视觉痕迹，增加了输出的结构化信息。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "标记擦除后形成洞（背景色）"
        description: "T标记单元变为背景色（颜色0），在区域边界留下4像素的'洞'。解题者需要推断标记位置变为空洞而非被区域吞并，产生了独特的视觉特征。"
        source: erase
        source_task: 71e489b6
        delta_lines: 10

  - id: D3
    name: "T标记的形状与结构"
    tag: src
    current: "4单元T-四连骨牌形状，中心有3个邻居，茎为唯一没有对称方向的分支；彩色T中心为非1颜色+3个单独颜色1邻居"
    alternatives:
      - name: "L形标记替代T形"
        description: "使用L形三连骨牌（3个单元形成直角）代替T形四连骨牌。L的短臂指向目标区域（茎），长臂的末端对角线标识源区域。形状从T变为L改变了方向判定规则，解题者需要重新推断茎与源的关系。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "十字形标记（5单元）"
        description: "使用完整十字形（中心+4个方向），其中缺失的一个方向（即中心没有邻居的方向）的对面为茎方向。解题者需要从'缺口'推断方向而非从'突出'推断，是反向推理。"
        source: inversion
        source_task: null
        delta_lines: 35
      - name: "箭头形标记（5单元）"
        description: "使用箭头形状：茎+两个对角线单元形成V形箭尖，明确指向目标区域。箭头方向更直观，降低了方向判定的难度，但增加了形状识别的复杂度（对角线连接而非正交）。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "单像素+方向编码标记"
        description: "用单个颜色1像素作为标记，通过其在区域边界上的相对位置编码方向：像素靠近目标区域侧。源区域通过像素的直接4邻居中的非标记颜色确定。极简标记增加了方向推断难度。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 50

  - id: D4
    name: "标记方向判定机制"
    tag: src
    current: "茎方向为T中心的3个分支中唯一没有对称方向的那个；茎指向目标区域，茎方向+横杆方向的两个对角线单元在源区域中"
    alternatives:
      - name: "茎长度编码优先级"
        description: "T标记的茎可以有1-3格长度（不再固定为1格），茎越长优先级越高。当多个标记指向同一目标时，最长茎的标记生效。解题者需要同时判断方向和长度，增加了数值比较维度。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "横杆方向作为茎"
        description: "方向判定反转：横杆的方向（而非单独突出的方向）指向目标区域。即T的'平头'端指向目标，'突出'端的对面是源区域。这是方向规则的取反，解题者容易产生直觉性错误。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "源区域由茎尖端邻居而非对角线确定"
        description: "源区域不再通过中心+茎+横杆方向的对角线单元确定，而是通过茎尖端（距中心2格）的横向邻居确定。改变了源区域的空间定位方式，解题者需要'穿过'标记去寻找源色。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D5
    name: "normal T 与 colored T 的区分机制"
    tag: symbol_instructions
    current: "normal T：4个颜色1单元；colored T：中心为非1颜色+3个单独颜色1邻居，中心颜色为替换色"
    alternatives:
      - name: "所有T均为normal，替换色由图例区域定义"
        description: "取消colored T，改为在网格边缘放置一个小型颜色图例（如2xN调色板），图例定义源色到替换色的映射关系。解题者需要先解读图例再应用T标记规则，增加了符号解码步骤。"
        source: symbol_instructions
        source_task: dbff022c
        delta_lines: 50
      - name: "T标记大小区分行为"
        description: "不用中心颜色区分，而用T的大小：4单元T为normal重着色，6单元大T（更长的横杆或茎）为colored行为。大小编码替代了颜色编码，解题者需要通过几何尺寸推断行为类型。"
        source: size_encoded_parameter
        source_task: 6ffbe589
        delta_lines: 40
      - name: "T标记朝向区分行为"
        description: "不用中心颜色区分，而用T的绝对朝向：茎朝上/下的T为normal，茎朝左/右的T为colored行为（使用与标记接触的第三种区域颜色作为替换色）。方向与行为的关联增加了空间推理的语义层次。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "颜色奇偶性决定行为"
        description: "T标记中心的颜色值（ARC颜色0-9）的奇偶性决定行为：偶数颜色中心为normal行为，奇数颜色中心使用该颜色作为替换色。人类通过颜色的视觉分类（暖色/冷色近似对应奇偶）来推断，增加了颜色属性推理。注意此方案需要人类能从训练示例中归纳出奇偶规则。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D6
    name: "区域分割方式"
    tag: meta
    current: "网格被分割为3-6个不规则边界的单色4-连通区域，每个区域>=6个单元，通过随机BFS生长生成"
    alternatives:
      - name: "矩形网格分割"
        description: "区域为规则的矩形（通过水平和垂直分割线划分），而非不规则边界。矩形区域使T标记的边界定位更规则化，但区域形状的可预测性降低了空间推理难度。视觉上更整洁，类似棋盘格变体。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "Voronoi式分割（从种子点生长）"
        description: "使用确定性Voronoi式分割（最近种子点归属）而非随机BFS，产生更对称的区域边界。边界形状更加规则但仍非矩形，解题者可能通过边界的直线段和交点推断种子位置。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "条纹式分割（水平或垂直带状）"
        description: "区域为水平或垂直条纹带，宽度不等。T标记仅出现在条纹之间的水平/垂直边界上。线性分割大幅简化了空间结构，但T标记的方向被限制为垂直/水平两种之一。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D7
    name: "旋转触发机制（L9标记）"
    tag: grid_shape
    current: "可选5单元L形颜色9标记：┐(右上角)触发逆时针90度旋转，┌(左上角)触发顺时针90度旋转；约50%概率出现"
    alternatives:
      - name: "无旋转机制"
        description: "完全移除L9旋转标记和旋转逻辑。输出网格始终与输入同尺寸同方向。简化了任务但去掉了一个关键的推理维度，使任务纯粹聚焦于重着色。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "旋转角度由T标记数量决定"
        description: "去掉L9标记，改为根据T标记总数决定旋转：4个标记不旋转，5个顺时针90度，6个180度，7个逆时针90度，8个不旋转（mod 4循环）。解题者需要先数T标记再推断旋转，增加了计数维度。"
        source: size_encoded_parameter
        source_task: 6ffbe589
        delta_lines: 25
      - name: "镜像翻转替代旋转"
        description: "L形标记触发水平或垂直镜像翻转而非旋转。┐触发水平翻转，┌触发垂直翻转。翻转比旋转更容易视觉验证但产生不同的空间变换，解题者需要区分翻转方向。"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 15
      - name: "旋转标记形状变为直线段"
        description: "用3单元水平线段(颜色9)触发顺时针旋转，3单元垂直线段(颜色9)触发逆时针旋转。标记形状更简单，方向编码更直观（线段方向暗示旋转轴），但可能与T标记混淆需要颜色区分。"
        source: creative
        source_task: null
        delta_lines: 20

