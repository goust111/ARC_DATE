        source: creative
        source_task: null
        delta_lines: 25
      - name: "L标记颜色（而非朝向）编码旋转"
        description: "L标记形状固定为一种朝向，但颜色可以是颜色9或颜色8：颜色9逆时针旋转，颜色8顺时针旋转。颜色编码替代几何编码，改变了解题者的推理路径。"
        source: creative
        source_task: null
        delta_lines: 15

