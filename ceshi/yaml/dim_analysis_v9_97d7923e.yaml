      - name: "同组内条的填充色各不相同"
        description: "同组内每条条的填充色互不相同（但帽色相同）。分组仍按帽色，但每条条视觉上更独特。解题者需意识到填充色差异不影响分组，测试对关键特征的识别能力"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "图例颜色与帽色不同，通过位置对应关系映射"
        description: "图例条目的颜色不直接等于帽色，而是通过空间位置建立对应：第1个图例条目对应第1列出现的帽色组。解题者需发现位置序号→组的间接映射，而非直接颜色匹配"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D11
    name: "轨迹/变换范围"
    tag: trajectory
