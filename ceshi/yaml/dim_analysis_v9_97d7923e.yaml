task_id: 97d7923e
task_type: move_to_match
summary: "左上角图例的颜色高度编码排名索引，按端点颜色分组垂直条并按长度排序，将排名对应的条重着色为图例颜色"

dimensions:
  - id: D1
    name: "匹配条件：端点颜色分组"
    tag: match_cond
    current: "s.endpoint_colors == d.color_group — 垂直条的顶部和底部帽色(cap color)与图例条目的颜色一致时归入同一组"
    alternatives:
      - name: "填充颜色分组替代端点颜色"
        description: "将条按内部填充颜色(fill color)而非端点帽色分组，图例也用填充颜色标识组别。解题者需关注条的内部颜色而非两端标记色，改变了视觉注意力焦点"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "条的长度区间分组"
        description: "不按颜色分组，而是按条的长度区间分组（如短/中/长），图例用不同颜色块的宽度编码区间边界。解题者需先推断长度区间划分规则再进行匹配，增加数值推理"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "列位置区域分组"
        description: "按条所在的列位置分区域分组（如左半区和右半区），图例用空间位置编码组别。解题者需发现列位置→组的映射关系，引入空间分区推理"
        source: column_row_alignment
        source_task: 8b9c3697
        delta_lines: 35
      - name: "端点颜色对匹配（顶底可不同色）"
        description: "垂直条的顶端和底端可以是不同颜色，图例用两行像素编码(上色,下色)的组合对。匹配条件变为条的(顶色,底色)对等于图例的颜色对。增加了组合匹配的推理复杂度"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D2
    name: "匹配条件：排名与图例计数的对应"
    tag: match_cond
    current: "s.length_rank_in_group == d.block_count — 图例条目的色块堆叠数k对应组内按长度降序排名第k的条"
    alternatives:
      - name: "升序排名替代降序"
        description: "排名规则反转：最短的条排名为1（当前为最长排名为1）。图例高度k对应组内最短第k条。这是一个直接的取反变体，解题者需发现排序方向的变化"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "图例宽度编码替代高度编码"
        description: "图例条目改为水平排列，色块的水平宽度（而非垂直高度）编码排名索引k。解题者需从水平方向读取计数，改变了图例解读的维度方向"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "图例位置序号编码排名"
        description: "图例条目都是单个像素高度，但按从左到右的位置顺序编码排名：第1个图例条目对应rank=1，第2个对应rank=2。解题者需发现位置序号即排名的隐含规则"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "图例色块数对应条的绝对长度而非排名"
        description: "图例的色块数k不再是排名索引，而是直接等于目标条的填充长度。只有填充长度恰好等于k的条被重着色。将相对排名逻辑改为绝对数值匹配，增加精确计数要求"
        source: count_match
        source_task: 6e4f6532
        delta_lines: 15

  - id: D3
    name: "变换操作：重着色规则"
    tag: transform
    current: "将匹配条的整个填充区域重着色为帽色(cap color)，即图例颜色覆盖填充色"
    alternatives:
      - name: "仅重着色填充区域的部分像素"
        description: "不是整条重着色，而是只重着色填充区域的前k个像素（从顶部或底部起算，k为图例色块数）。输出中条呈现部分重着色的渐进效果，解题者需推断重着色范围与图例的数值关系"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "擦除匹配条替代重着色"
        description: "匹配的条被完全擦除为背景色（而非重着色为帽色）。这是当前变换的取反——从'标记选中'变为'删除选中'，解题者需理解图例标记的是'消除'目标"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 10
      - name: "交换匹配条与非匹配条的颜色"
        description: "组内匹配条和非匹配条交换填充颜色：匹配条变为帽色，非匹配条变为匹配条原来的填充色的互补色或图例指定的另一种颜色。增加了变换逻辑的双向性"
        source: color_swap
        source_task: a25697e4
        delta_lines: 30
      - name: "重着色为图例指定的第三种颜色"
        description: "图例条目包含两种颜色信息：帽色用于分组匹配，另一种独立颜色用于重着色。解题者需从图例同时提取匹配色和目标色两种信息，增加图例解读复杂度"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "源对象：垂直条的结构"
    tag: src
    current: "垂直条结构为cap-fill-cap：顶部和底部各一个帽色像素，中间为单一填充色的连续区域，所有条底部对齐在最后一行"
    alternatives:
      - name: "水平条替代垂直条"
        description: "条改为水平方向（左右帽色像素+水平填充区域），所有条右端对齐在最后一列。图例相应改为按行排列。整体逻辑不变但空间方向旋转90度，改变了视觉扫描方向"
        source: inversion
        source_task: null
        delta_lines: 40
      - name: "条无固定底部对齐（浮动条）"
        description: "垂直条不再底部对齐在最后一行，而是各自浮动在网格的不同行位置。长度计算需用帽色之间的距离。增加了条的定位难度，解题者需逐一识别条的位置和长度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "双层帽色条"
        description: "条的帽色区域从单像素变为多像素（如2-3像素厚的帽），帽色厚度在组内相同。填充长度仍为帽之间的区域长度。增加了条结构识别的视觉复杂度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "条的填充区域为交替双色条纹"
        description: "条的填充区域不是单一颜色而是两种颜色交替（如红蓝红蓝），分组仍按帽色。解题者需理解填充区域的多色不影响分组逻辑，测试对噪声的鲁棒性"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D5
    name: "目标结构：图例的编码方式"
    tag: symbol_instructions
    current: "图例在左上角：每个条目为一列，从第0行开始向下堆叠k个同色像素，k编码该帽色组内的目标排名；条目间间隔1-2列背景色"
    alternatives:
      - name: "图例改为右下角"
        description: "图例从左上角移到右下角，从最后一行向上堆叠。解题者需先定位图例位置再解读，增加了初始探索的不确定性。图例与条的空间分离更明确"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "图例为水平色块行"
        description: "图例改为水平方向：在最上一行中，每个条目为连续k个同色像素水平排列（而非垂直堆叠）。解题者需改变图例的读取方向（宽度=排名）"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "图例为独立的小矩形区域"
        description: "每个图例条目是一个kx1或1xk的小矩形，放置在网格边缘的隔离区域内（用背景色边框包围）。图例不再紧凑排列在角落，而是分散在网格边缘。增加了图例识别的视觉搜索难度"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "图例用不同形状编码排名"
        description: "图例不用像素数量编码排名，而是用形状：单像素=rank1，L形(2像素)=rank2，T形(3像素)=rank3。解题者需识别形状→排名的对应而非简单计数，增加图案识别难度"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D6
    name: "分组内排序规则"
    tag: meta
    current: "组内按填充长度降序排列（最长=rank 1），使用长度作为唯一排序键"
    alternatives:
      - name: "按列位置排序替代长度排序"
        description: "组内条按列位置从左到右排序（最左=rank 1）。长度不再影响排名，解题者需发现空间位置是决定性因素。改变了核心推理维度从数值比较到空间定位"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 10
      - name: "按填充颜色值排序"
        description: "组内条按填充色的视觉属性排序（如颜色映射到某种可视的顺序关系，例如暖色到冷色）。同组条的填充色各不相同，图例用某种视觉线索暗示排序方向。解题者需发现颜色顺序逻辑"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "按条顶部行位置排序"
        description: "组内条按其顶部帽色所在行的位置排序（顶部越高=rank越小）。由于所有条底部对齐，顶部位置等价于长度排序，但如果取消底部对齐则产生不同结果。为浮动条变体做铺垫"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "多键排序：先按长度再按列位置消歧"
        description: "主排序键为填充长度降序，长度相同时按列位置升序消歧。当前任务要求长度全不同所以无需消歧，此变体允许同长度条存在并引入消歧规则，增加推理层次"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D7
    name: "网格形状与尺寸"
    tag: grid_shape
    current: "输出与输入网格尺寸相同(10行 x 10-20列)，仅修改匹配条的填充色"
    alternatives:
      - name: "紧凑裁剪输出仅保留条区域"
        description: "输出裁剪掉图例区域和所有空白列，仅保留包含条的最小外接矩形。解题者需意识到图例在输出中消失，输出是操作结果的紧凑表示"
        source: tight_crop
        source_task: 67e490f4
        delta_lines: 15
      - name: "输出仅包含被重着色的条"
        description: "输出网格中只保留被选中重着色的条（其余条和图例全部变为背景色）。这是当前'全部保留仅改色'的取反——强调选择性输出"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "输出将每组条提取为独立子网格"
        description: "输出不是单个网格而是多个子网格拼接（类似分帧输出），每组条单独提取到一个子网格中。解题者需理解分组提取和重组的逻辑"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 40

  - id: D8
    name: "图例与条的空间关系"
    tag: meta
    current: "图例占据左上角顶部若干行，条从更低的行开始向下延伸到最后一行；图例列和条列可共享同一列（图例在上方且有背景色行间隔）"
    alternatives:
      - name: "图例与条完全空间分离"
        description: "图例占据独立的列区域（如最左侧2-4列），条占据右侧列区域，两者无列重叠。空间布局更清晰但网格需更宽。解题者更容易定位图例和条各自的区域"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "图例嵌入在条之间"
        description: "图例条目不集中在左上角，而是分散嵌入在条所在列的顶部（每组的第一列顶部即该组的图例）。解题者需发现图例与条的局部关联而非全局关联"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "图例在网格底部"
        description: "图例改为放置在网格底部（最后一行向上堆叠），条改为顶部对齐（顶部帽色在第0行）。上下翻转当前布局，测试解题者对位置先验的鲁棒性"
        source: inversion
        source_task: null
        delta_lines: 20

  - id: D9
    name: "组数量与条数量"
