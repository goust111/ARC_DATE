        source: creative
        source_task: null
        delta_lines: 10

  - id: D12
    name: "多步处理逻辑"
    tag: multi_step
    current: "所有图例条目独立处理，组间无依赖顺序：对每个图例(K,k)，找到帽色为K的组，按长度排名选第k条，重着色"
    alternatives:
      - name: "图例条目按序处理，前一步结果影响后续"
        description: "图例条目从左到右依次处理，每处理一个条目后该条从排名池中移除。如果两个图例条目对应同一组，第二个条目的排名在剩余条中重新计算。增加了顺序依赖的推理复杂度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "两轮处理：第一轮分组，第二轮重着色"
        description: "第一轮根据图例将条分组并标记（如改变帽色为统一标记色），第二轮在标记后的网格上执行排名和重着色。解题者需理解两阶段变换的因果链"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "逆向处理：从输出推断图例"
        description: "输入中部分条已被重着色（呈现为输出状态），图例区域为空。任务变为根据已重着色的条推断并填写图例。这是整个任务逻辑的反向，从推理结果变为推理原因"
        source: inversion
        source_task: null
        delta_lines: 40

