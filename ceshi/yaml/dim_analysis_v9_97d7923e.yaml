    current: "1-4个帽色组，每组2-3条，总条数不超过10"
    alternatives:
      - name: "固定每组恰好2条（最小化）"
        description: "每组恰好2条，图例排名只能是1或2。简化了排名推理但保留了分组和匹配逻辑。适合作为较简单的变体"
        source: inversion
