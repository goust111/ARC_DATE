        source: creative
        source_task: null
        delta_lines: 10

  - id: D10
    name: "颜色约束与调色板"
    tag: meta
    current: "帽色和填充色全部互不相同，帽色 != 填充色 != 背景色；同组内所有条共享相同的填充色"
    alternatives:
      - name: "不同组可共享填充色"
        description: "多个不同帽色的组可以使用相同的填充色（如所有组的填充色都是灰色）。分组完全依赖帽色，填充色不再提供分组线索。降低了颜色多样性但增加了视觉混淆"
