task_id: 5545f144
task_type: move_to_match
summary: "三角形精灵沿头部朝向的半线方向移动，消耗对齐的单像素标记点，每次消耗后可能转向90度朝向下一个标记，直到所有标记被消耗；输入为水平拼接的多帧快照（含分隔线），输出为最终精灵位置的单帧。"

dimensions:
  - id: D1
    name: "匹配条件：方向对齐"
    tag: match_cond
    current: "精灵头部方向与标记之间的射线对齐——标记必须位于头部所朝方向的同行或同列半线上（direction_matching），且该步仅一个方向有可达标记。"
    alternatives:
      - name: "颜色匹配消耗"
        description: "标记不再共用单一颜色，而是使用多种颜色；精灵只消耗与自身当前颜色相同的标记，消耗后精灵变为该标记位置周围某种新颜色。解题者需推断颜色匹配规则而非方向规则，推理从几何对齐变为颜色配对。"
        source: color_match
        source_task: 2c181942
        delta_lines: 40
      - name: "最近邻贪心消耗（忽略方向）"
        description: "精灵不受头部方向限制，每步移向曼哈顿距离最近的标记并消耗它，消耗后朝向更新为移动方向；去掉方向约束使路径规划从方向检查变为全局距离比较。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "形状匹配消耗"
        description: "标记不再是单像素，而是小型几何形状（如2x2方块、十字等），精灵只消耗与自身模板形状相似（可旋转匹配）的标记；推理从方向射线变为形状识别与旋转匹配。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 50
      - name: "行列对齐但非方向限定"
        description: "精灵可以向同行或同列的任意方向移动（不限于头部朝向的半线），但每步必须在唯一的一条轴线上有标记；取消方向限制但保留轴线唯一性，推理从'头朝哪'变为'哪条轴有标记'。"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 20

  - id: D2
    name: "源对象：精灵模板类型"
    tag: src
    current: "三角形精灵有4种模板（hollow3, filled4, stem4, midfilled6），3-6像素，每种可旋转至4个朝向，箭头尖端编码朝向方向。"
    alternatives:
      - name: "十字形/加号形精灵"
        description: "精灵替换为十字或加号形状（如中心+四臂），不再有明确的'尖端'，朝向由臂的不对称性编码（如一个臂比其他长）；视觉上从三角变为十字，方向识别更隐晦。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "L形精灵"
        description: "精灵为L形（如3x2减去一角），L的开口方向编码朝向；与三角形不同，L形不具有轴对称性，需要更仔细的旋转推理。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "单像素精灵配外部方向标记"
        description: "精灵本身为单像素，但在相邻位置有一个不同颜色的'方向指示'像素标明朝向；精灵体积最小化，朝向信息从形状转移到颜色配对。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "大型不规则多边形精灵"
        description: "精灵为较大的不规则形状（8-12像素），头部由一个特殊颜色像素标识，其余为统一颜色；增大精灵使得网格拥挤度提高，路径规划更受约束。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D3
    name: "目标对象：标记类型"
    tag: dst
    current: "散布的单像素标记点，与精灵共用同一颜色（actor色），被消耗后消失。"
    alternatives:
      - name: "多色标记点对应消耗顺序"
        description: "标记使用不同颜色，精灵必须按特定颜色顺序消耗（如红-蓝-绿循环）；解题者需从样例推断颜色顺序规则，增加序列推理维度。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "标记为2x2色块"
        description: "标记从单像素扩大为2x2同色色块，精灵头部需到达色块的任意像素即算消耗；增大标记使网格更拥挤，也改变'对齐'的精确定义。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "标记带有方向指示"
        description: "每个标记不再是普通像素，而是带有方向指示的小图案（如小箭头），精灵消耗标记后必须按该标记指示的方向转向（而非自由选择）；从自由转向变为受指令控制。"
        source: legend_lookup
        source_task: 58490d8a
        delta_lines: 50
      - name: "标记在消耗前不可见（隐藏标记）"
        description: "后续帧中某些标记位置被隐藏（与背景同色），解题者需从前面帧推断隐藏标记的存在和位置；增加推理难度，要求跨帧比较。"
        source: inversion
        source_task: null
        delta_lines: 35

  - id: D4
    name: "路径规则：移动方向选择"
    tag: path
    current: "每步恰好一个基数方向的半线上有可达标记，精灵移向该半线上最近的标记；不允许180度反转，只允许前进或90度转弯。"
    alternatives:
      - name: "允许180度反转"
        description: "取消禁止180度反转的约束，精灵可以向任何方向（包括回头）移动；路径可能出现折返，推理从'排除反向'变为更开放的方向选择。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "优先直行、其次右转"
        description: "当多个方向有标记时，使用优先级规则——先直行，次右转，再左转；取消'唯一方向'约束，改用固定优先级消歧，推理变为追踪优先级链。"
        source: turning_rules
        source_task: e87109e9
        delta_lines: 30
      - name: "对角线移动"
        description: "精灵不沿基数方向移动，而是沿45度对角线方向移动到对角线上最近的标记；从正交半线变为对角半线，几何推理难度提升。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "跳跃式移动（隔一消一）"
        description: "精灵沿半线方向移动时跳过最近的标记，消耗第二近的标记；'跳过最近取次近'的规则使解题者需要仔细数距离。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D5
    name: "路径规则：标记消耗机制"
    tag: path
    current: "精灵到达标记位置时消耗该标记（标记消失），头部落在标记位置，精灵模板按新方向重新戳印。"
    alternatives:
      - name: "标记转化而非消失"
        description: "精灵到达标记后，标记不消失而是变为另一种颜色（如变为精灵尾部的一部分），形成可见的已访问标记链；输出中保留所有标记（颜色已改变），视觉信息更丰富。"
        source: recolor
        source_task: 20270e3b
        delta_lines: 20
      - name: "区域消耗"
        description: "精灵到达标记后，不仅消耗该标记，还消耗其曼哈顿距离2以内的所有标记；增加'爆炸半径'概念，路径步数减少但策略变化。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "标记需多次到达才消耗"
        description: "每个标记有'生命值'（用颜色深浅或大小编码），需被精灵经过2-3次才真正消耗；引入多轮循环的路径规划。"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D6
    name: "轨迹：移动痕迹"
    tag: trajectory
    current: "精灵移动无轨迹——旧位置恢复为背景色，只保留当前位置的精灵体。"
    alternatives:
      - name: "连续轨迹涂色"
        description: "精灵经过的每个格子被涂上特殊颜色（如灰色），输出中可见完整移动路径；解题者需同时推断终点和路径轨迹。"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 15
      - name: "保留所有历史精灵位置"
        description: "每次移动后旧位置保留精灵轮廓的'残影'（用半透明色或不同颜色），输出中显示所有历史位置；从单帧结果变为路径全景图。"
        source: keep_source
        source_task: 247ef758
        delta_lines: 25
      - name: "仅在转弯处留下标记"
        description: "精灵只在发生方向变化的位置留下一个彩色标记，直行段不留痕迹；输出中的标记点恰好标识所有转弯位置。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "轨迹编码移动方向"
        description: "精灵经过的格子涂色取决于该段移动方向——向上涂红、向右涂蓝、向下涂绿、向左涂黄；输出的轨迹颜色编码方向信息。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D7
    name: "变换：精灵朝向更新"
    tag: transform
    current: "消耗标记后精灵重新朝向该步的移动方向，模板按新方向旋转重新戳印。"
    alternatives:
      - name: "朝向固定不变"
        description: "精灵始终保持初始朝向，移动方向不影响模板渲染；简化视觉变化，推理重点完全转移到路径追踪上。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "朝向为下一个标记方向"
        description: "消耗标记后精灵不朝向当前移动方向，而是朝向下一个将要消耗的标记方向（前瞻一步）；需要全局路径规划而非局部步骤。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "累积旋转"
        description: "每次转弯时精灵额外旋转90度（叠加在移动方向之上），形成螺旋效果；朝向不直接等于移动方向，增加追踪复杂度。"
        source: conditional_rotation
        source_task: 291dc1e1
        delta_lines: 20
      - name: "消耗后精灵模板变形"
        description: "每消耗一个标记后精灵切换到下一种模板（hollow3 -> filled4 -> stem4 -> midfilled6 循环）；精灵不仅旋转还变形，需要追踪模板状态。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D8
    name: "网格结构：帧拼接方式"
    tag: grid_shape
    current: "输入为多帧水平拼接（分隔线列隔开），输出为单帧；帧是模拟快照，间隔均匀。"
    alternatives:
      - name: "垂直帧拼接"
        description: "帧改为垂直拼接（分隔行隔开），输出仍为单帧；从水平扫描变为垂直扫描，对解题者的帧分离识别方向产生变化。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "网格式帧布局"
        description: "帧排列为2x2或NxM网格形式（行间和列间都有分隔线），输出为单帧；从一维线性帧序变为二维帧网格，需推断阅读顺序。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "无分隔线、帧大小不同"
        description: "取消可见分隔线，帧之间不对齐，解题者需从精灵位置和标记分布推断帧边界；大幅增加帧分离的推理难度。"
        source: inversion
        source_task: null
        delta_lines: 50
      - name: "紧凑裁剪输出"
        description: "输出不再是完整帧大小，而是紧凑裁剪为精灵外接矩形；输出尺寸变小，解题者需推断裁剪规则。"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 15

  - id: D9
    name: "多步序列：帧快照策略"
    tag: multi_step
    current: "帧是等间隔快照——从第0步开始每隔gap步取一帧，gap = total_steps / n_frames；最后一帧有gap个剩余标记。"
    alternatives:
      - name: "不等间隔快照"
        description: "帧快照的间隔不均匀（如第1、3、7、12步），解题者需从标记数量差推断间隔模式；从简单等分变为模式识别。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "仅显示首尾帧"
        description: "输入只有第一帧和最后一帧（中间过程省略），解题者需从起点和终点状态推断完整路径并生成最终结果；大幅增加推理跨度。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "倒序帧"
        description: "帧按时间逆序排列（最后状态在左，初始状态在右），解题者需识别逆序并反向推理出最终结果；增加方向性推理。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "输出为下一帧而非最终帧"
        description: "输出不是最终状态（标记全部消耗），而是下一个快照时间点的状态（仍有标记剩余）；从模拟到终止变为模拟固定步数。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D10
    name: "颜色使用策略"
    tag: meta
    current: "只有三种颜色角色：背景色、actor色（精灵+标记共用）、分隔线色；精灵和标记不可色彩区分。"
    alternatives:
      - name: "精灵与标记不同色"
        description: "精灵用一种颜色、标记用另一种颜色，消耗后标记消失但两者始终视觉可分；降低识别精灵/标记的难度，但标记消耗规则可以更复杂。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "多色标记编码距离"
        description: "标记的颜色编码它们在路径中的消耗顺序（如从暖色到冷色），精灵必须按颜色顺序消耗；增加颜色-顺序映射的推理层。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "精灵颜色随消耗变化"
        description: "精灵每消耗一个标记后颜色改变（按预定序列循环），标记只有与精灵当前颜色匹配时才可消耗；引入状态依赖的颜色匹配。"
        source: color_match
        source_task: 2c181942
        delta_lines: 40

  - id: D11
    name: "路径复杂度约束"
    tag: meta
    current: "total_steps 4-12，turn_ratio 0.4-0.9，至少使用3个基数方向，至少2次转弯，步距2-7且至少2种不同步距，路径至少在一个轴上非单调。"
    alternatives:
      - name: "极简路径（最少转弯）"
        description: "将转弯约束降低到0-1次，形成近乎直线或单次折的简单路径；作为简单难度变体，适合检验基础路径理解。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "螺旋路径约束"
        description: "要求路径形成顺时针或逆时针螺旋（每次只允许同一旋转方向的90度转弯），不允许逆向转弯；路径从自由折线变为规律螺旋。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "回文路径"
        description: "方向序列必须形成回文（如 U-R-D-R-U），精灵先远离再折返；对称性约束增加路径的规律性和可推理性。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D12
    name: "障碍物"
    tag: meta
    current: "网格中无障碍物——除精灵和标记外全为背景色，精灵可自由移动到任何背景格。"
    alternatives:
      - name: "静态障碍色块"
        description: "网格中散布固定颜色的障碍色块（如2x2方块），精灵的射线被障碍阻断——如果障碍在精灵和标记之间则该标记不可达；增加可达性分析。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 35
      - name: "墙壁边界"
        description: "帧内有彩色像素组成的直线墙壁，精灵不能穿过墙壁；射线检查需考虑墙壁遮挡，路径规划从开放空间变为迷宫导航。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "可破坏障碍"
        description: "障碍物第一次被精灵射线命中时被破坏（变为背景），之后该路径变为畅通；引入状态变化的障碍，多轮推理。"
        source: creative
        source_task: null
        delta_lines: 45

  - id: D13
    name: "精灵数量"
    tag: meta
    current: "每帧恰好一个精灵，独立消耗所有标记。"
    alternatives:
      - name: "双精灵交替行动"
        description: "帧内有两个不同颜色的精灵，它们交替行动各自消耗对应颜色的标记；从单体模拟变为双体交替，推理复杂度翻倍。"
        source: creative
        source_task: null
        delta_lines: 60
      - name: "精灵分裂"
        description: "精灵每消耗N个标记后分裂为两个，各自独立继续消耗剩余标记；从单体路径变为分叉树状路径。"
        source: creative
        source_task: null
        delta_lines: 65
      - name: "主从精灵"
        description: "一个主精灵和一个从精灵，主精灵正常移动消耗标记，从精灵镜像复制主精灵的移动（水平或垂直镜像），从精灵经过的标记也被消耗；推理变为同时追踪两个位置。"
        source: mirror_symmetry
        source_task: 4c416de3
        delta_lines: 50

  - id: D14
    name: "唯一方向约束"
    tag: match_cond
    current: "每步恰好一个基数方向半线上有可达标记（CONSTRAINT 1），确保移动方向无歧义。"
    alternatives:
      - name: "允许多方向有标记但取最近"
        description: "放松唯一方向约束，当多个方向都有标记时选择距离最近的标记；消歧从'唯一方向'变为'最短距离'，生成器约束放松。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "优先级方向消歧"
        description: "当多个方向有标记时按固定优先级选择（如 U > R > D > L），不要求唯一方向；解题者需从样例推断优先级顺序。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "标记数量消歧"
        description: "当多个方向有标记时选择该方向半线上标记数量最多的方向；消歧条件变为计数比较，推理从方向唯一性变为统计。"
        source: frequency_tiebreak
        source_task: 67e490f4
        delta_lines: 25

  - id: D15
    name: "帧间信息关系"
    tag: multi_step
