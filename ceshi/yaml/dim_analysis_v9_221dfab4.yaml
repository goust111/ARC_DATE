task_id: 221dfab4
task_type: move_along_path
summary: "从边缘黄色线段向对侧推进条纹，按 Y-Y-G 三色循环涂色，黄色条纹仅在线段跨度内涂色，绿色条纹额外将全行/列非背景像素重新着色为绿色"

dimensions:
  - id: D1
    name: "推进方向"
    tag: path
    current: "从黄色线段所在边缘沿直线向对侧边缘推进（straight_ray）"
    alternatives:
      - name: "对角线推进"
        description: "条纹不再平行于边缘，而是沿45度对角方向推进，每步同时偏移行和列。解题者需在非正交坐标系中追踪条纹位置和跨度映射，空间推理难度大幅提升"
        source: diagonal_ray
        source_task: "142ca369"
        delta_lines: 35
      - name: "双向推进（从线段向两侧扩展）"
        description: "反转'单向'策略：线段不在边缘，而位于网格中部，条纹同时向两侧推进。解题者需识别对称扩展规则，且两侧的绿色条纹可能在同一行/列交叠，增加冲突处理推理"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "螺旋推进"
        description: "条纹从线段出发后按顺时针螺旋向内推进，每到边界处转90度继续。类似 da515329 的螺旋路径，完全改变空间排布模式，需要推断转向和终止条件"
        source: spiral_path
        source_task: "da515329"
        delta_lines: 40

  - id: D2
    name: "步长与间距"
    tag: path
    current: "步长为2（stride 2），条纹之间有1格背景间隙"
    alternatives:
      - name: "步长为3（2格间隙）"
        description: "条纹之间留2格背景间隙而非1格，产生更稀疏的条纹模式。视觉上条纹更分散，解题者需精确推断步长参数"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "GCD 间距（由色块位置编码）"
        description: "步长不固定，而是由前景色块在推进方向上的间距的最大公约数决定。类似 16de56c4 的 GCD 间距机制，将数值推理融入路径规则"
        source: gcd_spacing
        source_task: "16de56c4"
        delta_lines: 25
      - name: "递增步长"
        description: "第一对条纹间隔1格，第二对间隔2格，第三对间隔3格，以此递增。解题者需从输出中发现非等距的递增模式，增加序列推理需求"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D3
    name: "颜色循环模式"
    tag: trajectory
    current: "三步周期循环 Y(4)-Y(4)-G(3)，即每三条条纹重复"
    alternatives:
      - name: "二步周期 Y-G 交替"
        description: "简化为黄绿交替（Y-G-Y-G...），每条条纹都交替切换。缩短周期使模式更容易识别但绿色条纹更频繁，更多前景色块被重着色"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "四步周期 Y-Y-Y-G"
        description: "将周期拉长为四步，三条黄色后一条绿色。绿色条纹更稀疏，解题者需要更多示例才能确定周期长度"
        source: creative
        source_task: null
        delta_lines: 3
      - name: "由线段长度编码周期"
        description: "黄色线段长度 L 决定周期中黄色条纹的数量：周期 = L 条黄色 + 1 条绿色。解题者需先测量线段长度再推断颜色规则，融合计数与模式推理"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "颜色配对（前景色块颜色决定轨迹色）"
        description: "经过前景色块所在行/列时，轨迹颜色变为该色块的颜色而非固定绿色。类似 16de56c4 的颜色配对机制，每条条纹可能有不同的颜色"
        source: color_pairing
        source_task: "16de56c4"
        delta_lines: 20

  - id: D4
    name: "绿色条纹的全行/列重着色范围"
    tag: trajectory
    current: "绿色条纹将全行/列的所有非背景像素重着色为绿色（全局 flood 效果）"
    alternatives:
      - name: "仅跨度内重着色（取消全局 flood）"
        description: "反转当前规则：绿色条纹也仅在线段跨度范围内涂色，与黄色条纹行为一致，不再 flood 全行/列。消除了黄绿条纹的行为差异，使谜题更简单但更一致"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "黄色条纹执行全局 flood，绿色条纹仅限跨度"
        description: "完全反转两种条纹的角色：黄色条纹做全行/列重着色，绿色条纹仅在跨度内涂色。解题者需注意哪种颜色具有扩展效果，容易被直觉误导"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "绿色条纹仅重着色跨度两侧外的像素"
        description: "绿色条纹在跨度内涂绿，但对跨度外的非背景像素执行重着色。与当前'跨度内+全行'的叠加不同，产生互补的涂色区域，增加空间推理复杂度"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "距离约束的重着色范围"
        description: "绿色条纹仅重着色距离线段跨度中心 N 格以内的非背景像素（N 为线段长度）。类似 cb2d8a2c 的距离约束机制，引入距离计算"
        source: distance_constraint
        source_task: "cb2d8a2c"
        delta_lines: 15

  - id: D5
    name: "间隙处理规则"
    tag: trajectory
    current: "条纹之间的1格间隙在线段跨度内强制清除为背景色"
    alternatives:
      - name: "不清除间隙（保留原有像素）"
        description: "反转当前规则：间隙位置的像素保持不变，不强制设为背景色。如果间隙位置恰好有前景色块像素，它们将保留，使输出更复杂且需要精确推断间隙行为"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "间隙也执行重着色（用第三种颜色）"
        description: "间隙位置不清除为背景色，而是涂上红色(2)等第三种颜色。三色交替（条纹-间隙-条纹）产生更丰富的视觉节奏，解题者需同时追踪三种涂色规则"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "间隙宽度周期性变化"
        description: "间隙宽度按 1-2-1-2 模式交替，产生不等距的条纹排列。类似 da515329 的间距约束，解题者需发现非均匀间隙规律"
        source: spacing_constraint
        source_task: "da515329"
        delta_lines: 12

