task_id: 3a25b0d8
task_type: move_to_match
summary: "将 src 精灵中彩色子精灵的排列与 dst 框架中洞的排列按质心秩序匹配，用对应颜色填充 dst 的洞后紧裁输出"

dimensions:
  - id: D1
    name: "匹配条件：排列匹配方式"
    tag: match_cond
    current: "arrangement_match — src 子精灵与 dst 洞按质心的行列秩序(row_rank, col_rank)匹配"
    alternatives:
      - name: "颜色匹配替代排列匹配"
        description: "src 子精灵与 dst 洞各自带有颜色标记（如洞边缘有一个标记像素），通过颜色相同来配对。解题者需要识别颜色线索而非空间排列，推理路径从几何对应转为属性匹配，难度和思维模式均有变化。"
        source: color_match
        source_task: 2c181942
        delta_lines: 35
      - name: "形状匹配替代排列匹配"
        description: "src 的每个子精灵形状与 dst 的某个洞形状完全相同（可能需旋转/翻转），通过形状吻合来配对。这要求解题者逐一比较形状轮廓，推理复杂度显著提升。需要让 src 和 dst 共享相同形状集合。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 50
      - name: "面积/大小排序匹配"
        description: "src 子精灵按面积排序与 dst 洞按面积排序一一对应——最大子精灵填最大洞，依次类推。解题者需要数像素面积并排序，推理过程从空间位置转为数值比较。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 30
      - name: "旋转/翻转后排列匹配"
        description: "当前 solver 已支持旋转/翻转搜索但实际数据均为 identity。变体强制要求 src 相对于 dst 存在非平凡旋转(90°/180°/270°)或翻转，解题者必须在心中旋转 src 才能完成匹配。"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 15
      - name: "连接器颜色匹配"
        description: "src 和 dst 之间通过外部连接线（同色线段）连接，每条连接线将一个子精灵与一个洞关联。解题者需跟踪连接线路径来确定配对关系，引入路径追踪推理。"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 55

  - id: D2
    name: "源对象结构"
    tag: src
    current: "单个 8-连通精灵：轮廓骨架 + 彩色子精灵填充空腔；LR 对称；4-9 个空腔"
    alternatives:
      - name: "多个独立色块作为 src"
        description: "src 不再是单一框架内的子精灵，而是散落在画布上的多个独立彩色色块。解题者需要先识别这些独立色块并将其与 dst 的洞对应。从'框架内部分解'转为'全局搜索收集'，认知模式完全不同。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "src 为嵌套框架（框中框）"
        description: "src 由多层嵌套的轮廓框架构成，每层间隙填充不同颜色。解题者需要逐层解析嵌套结构来确定颜色对应关系，增加层级推理难度。"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 50
      - name: "src 去除 LR 对称约束"
        description: "src 的轮廓骨架不再要求左右对称，空腔可以自由分布在任意位置。这使得排列模式更加多样化，解题者不能依赖对称性简化推理，需要更仔细地比较完整的空间布局。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "src 子精灵包含多色渐变"
        description: "每个空腔不再是单色填充，而是包含两种颜色形成的内部图案（如棋盘格或条纹）。匹配仍按排列进行，但填充 dst 时需要复制完整的双色图案而非单色，增加了变换复杂度。"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D3
