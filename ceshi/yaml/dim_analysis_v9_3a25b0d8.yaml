    alternatives:
      - name: "dst 包含部分预填色的洞"
        description: "dst 的部分洞已经被填上了正确颜色，只有剩余的洞需要填充。解题者需要识别哪些洞已填、哪些未填，然后只对空洞执行匹配。增加了筛选判断步骤。"
