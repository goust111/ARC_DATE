        source_task: null
        delta_lines: 25
      - name: "多个 dst 框架"
        description: "画布上有多个 dst 框架（如 2-3 个），每个框架的洞排列是 src 子精灵排列的一个子集。解题者需要将 src 的子精灵分配到多个 dst 中，形成一对多的匹配关系。"
        source: jigsaw_assembly
        source_task: 8698868d
        delta_lines: 55
      - name: "dst 洞带有颜色边框提示"
        description: "dst 的每个洞周围有一圈不同颜色的边框像素作为提示，该颜色暗示应填入的颜色。解题者需要同时利用排列匹配和颜色提示来确认填充方案，增加了交叉验证推理。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "dst 去除 LR 对称约束"
        description: "dst 的轮廓骨架不要求左右对称，洞可以不规则分布。配合 src 同样去除对称约束，使得匹配完全依赖质心秩序比较，无法利用对称性捷径。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D4
    name: "填充变换方式"
    tag: transform
    current: "hole_fill — 用匹配的 src 子精灵颜色直接填充 dst 对应的洞"
    alternatives:
      - name: "颜色映射变换"
        description: "填充时不直接使用 src 子精灵的原色，而是通过画布上另一个'图例'对象定义的颜色映射表进行转换（如红→蓝、绿→黄）。解题者需要先解读图例，再应用映射填充，增加了符号解码步骤。"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 40
      - name: "填充后擦除 src"
        description: "完成填充后，src 精灵从输出中消失（当前已经是 tight crop 只保留 dst，但变体可以改为输出完整画布并擦除 src）。解题者需要理解'转移'语义——颜色从 src 移走并注入 dst。"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 20
      - name: "填充颜色互补/取反"
        description: "填充 dst 洞时使用 src 子精灵颜色的'互补色'（在 10 色 palette 中定义互补关系，如 color_index 对称映射）。解题者需要发现颜色变换规则而非简单复制。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "按洞面积缩放填充图案"
        description: "将 src 子精灵的形状缩放到与 dst 洞的形状大小匹配后填入，而非简单的颜色平铺。这要求解题者理解几何缩放关系，增加了空间变换推理。"
        source: scale_to_fit
        source_task: 898e7135
        delta_lines: 50

