task_id: 7ed72f31
task_type: transform_in_place
summary: "彩色精灵通过红色标记像素定义的反射轴（水平/垂直红线或孤立红像素）进行镜像或点反射，将镜像像素绘制到背景上"

dimensions:
  - id: D1
    name: "反射变换类型"
    tag: transform
    current: "根据红色标记的几何形状选择反射方式：红线（水平/垂直）触发轴对称镜像，孤立红像素触发点反射（180度旋转）"
    alternatives:
      - name: "统一为旋转变换"
        description: "将所有反射替换为90度旋转：红线标记的精灵绕红线中点旋转90度，孤立红像素的精灵绕该点旋转90度。解题者需要从轴对称思维切换到旋转思维，推理模式完全不同，尤其是非对称精灵在旋转后形状变化更大。"
        source: rotation
        source_task: 2b83f449
        delta_lines: 40
      - name: "对角线轴反射"
        description: "红线不再是水平或垂直的，而是45度对角线方向。精灵沿对角线轴镜像翻转。这要求解题者识别斜向反射规则，空间推理难度显著增加，因为对角线反射在视觉上不如正交反射直观。"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "滑移反射（glide reflection）"
        description: "精灵先沿红色轴镜像，然后沿轴方向平移固定距离（如轴长度的一半）。输出中镜像部分不与原始精灵对齐，而是沿轴偏移。解题者需要推断出'镜像+平移'的组合规则，增加了一步变换的推理。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "对称性修复（删除不对称像素）"
        description: "反转当前的'生成镜像'操作：输入中精灵已经是近似对称的，但有少量不对称像素。变换规则是删除没有镜像对应物的像素，使精灵变为完美对称。解题者需要发现'减法对称化'而非'加法对称化'。"
        source: symmetry_repair
        source_task: 8e5c0c38
        delta_lines: 30
      - name: "条件性变换：颜色决定反射类型"
        description: "精灵颜色决定变换方式：暖色调（橙/黄/品红）的精灵做镜像反射，冷色调（蓝/绿/青）的精灵做点反射，与标记几何形状无关。解题者需要同时关注颜色类别属性和几何属性来推断规则，增加了多维度推理需求。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D2
    name: "反射轴的定义方式"
    tag: src
    current: "红色(2)像素作为标记：嵌入式红线（构成精灵4连通分量的一条边）定义轴对称轴，孤立红像素（4连通无其他像素）定义点反射中心"
    alternatives:
      - name: "边界检测定义反射轴"
        description: "不使用红色标记。反射轴由精灵自身的外接矩形边界定义：精灵贴近外接矩形的哪一条边，就沿该边做镜像。解题者需要通过精灵的形状和位置推断反射方向，无显式标记可用，推理门槛显著提高。"
        source: boundary_detection
        source_task: 71e489b6
        delta_lines: 50
      - name: "双色标记系统"
        description: "使用两种不同颜色的标记：一种颜色（如红色）标记表示水平反射轴，另一种颜色（如蓝色）标记表示垂直反射轴。这消除了'单像素vs线'的几何判别，转为颜色编码的显式指示，但解题者需要先建立颜色-方向的对应关系。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "对角标记对定义反射轴"
        description: "反射轴不由标记线定义，而由两个同色对角像素（如矩形对角）的连线中点和方向决定。类似于用两个锚点定义反射参数，解题者需要理解几何对角关系来确定反射操作。"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 45
      - name: "网格边缘控制像素"
        description: "反射轴的参数由网格边缘的控制像素编码：边缘上某行/列的红色像素指示该行/列为反射轴，精灵则分布在网格内部。源（精灵）与控制信息（轴定义）在空间上分离，增加了全局推理需求。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 40

  - id: D3
    name: "嵌入式标记与精灵的空间关系"
    tag: src
    current: "红线构成精灵4连通分量的一条边，载荷（payload）完全在红线的一侧，红线跨度与载荷平行方向的完整范围一致"
    alternatives:
      - name: "红线穿过精灵中心"
        description: "红线不在精灵边缘，而是穿过精灵中间，将精灵分割为两半。两半可以不同（非对称），输出是将两半都镜像到对侧。解题者需理解'双向镜像'而非单向镜像，空间推理更复杂。"
        source: inversion
        source_task: null
        delta_lines: 35
      - name: "红线与精灵分离但平行"
        description: "红线不直接与精灵4连通，而是在精灵外部但与之平行，间隔1-3个像素。精灵仍然沿红线做反射，但反射后的镜像与原始精灵之间有间隙。解题者需推断间隔距离对镜像位置的影响。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "红线仅部分覆盖精灵边缘"
        description: "红线不必跨越精灵的全部范围，可以只覆盖精灵边缘的一部分。只有红线覆盖范围内的载荷列/行被镜像，超出范围的部分不被镜像。解题者需精确判断红线覆盖范围来确定哪些像素被反射。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D4
    name: "孤立标记的反射范围"
    tag: src
    current: "孤立红像素的8邻域内的非背景、非红色精灵（8连通分量）被点反射"
    alternatives:
      - name: "仅4邻域触发反射"
        description: "将触发范围从8邻域缩小到4邻域（上下左右）。对角线相邻的精灵不被反射。这是当前规则的收紧版本，解题者需要精确区分4连通和8连通的邻接关系，错误判断邻接方式会导致输出错误。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "扩展到2步邻域"
        description: "不仅8邻域内的精灵被反射，距离红像素曼哈顿距离<=2的精灵也被反射。扩大了影响范围，可能导致多个精灵同时被一个红点反射，增加了推理的复杂度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "方向性反射：仅反射特定方向的精灵"
        description: "孤立红像素仅对其某个特定方向（如右侧和下方）的8邻域精灵执行点反射，其他方向的邻域精灵不受影响。方向规则通过示例暗示。解题者需从示例中推断方向性规则，增加了归纳难度。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D5
    name: "标记颜色约定"
    tag: marker_axis
    current: "标记颜色固定为红色(2)，所有示例一致"
    alternatives:
      - name: "标记颜色因示例而异"
        description: "标记颜色不固定为红色，每个示例中标记可以是不同颜色（如蓝、绿、橙），但在同一网格内所有标记颜色一致。解题者需要先识别哪种颜色在扮演'标记'角色（通常是唯一出现在线/孤点位置的颜色），增加了模式识别的第一步推理。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "标记颜色编码反射方向"
        description: "不同颜色的标记表示不同反射操作：红色标记做水平轴反射，蓝色标记做垂直轴反射，绿色标记做点反射。解题者需建立颜色到变换类型的映射。消除了原来通过标记几何推断变换类型的推理步骤，但增加了颜色语义解码。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "标记颜色与精灵颜色配对"
        description: "每个精灵有自己专属颜色的标记线（与精灵同色或形成固定颜色对）。当网格中有多组精灵-标记对时，解题者需通过颜色匹配找到每个精灵的对应反射轴，增加了配对推理步骤。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 30

  - id: D6
    name: "镜像像素的绘制规则"
    tag: transform
    current: "镜像像素必须落在背景格上才绘制，原始精灵和红色标记保持不变"
    alternatives:
      - name: "镜像覆盖所有像素"
        description: "镜像像素无条件覆盖目标位置，即使那里已有其他精灵或标记。这可能导致精灵之间的覆盖和颜色冲突，解题者需理解覆盖优先级规则（后处理的覆盖先处理的），推理难度增加。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "原始精灵被擦除，仅保留镜像"
        description: "反射后原始载荷被擦除（变为背景），仅镜像副本保留。红色标记也被擦除。这反转了'保留原始+添加镜像'的规则，解题者需要推断出'移动而非复制'的语义。"
        source: erase
        source_task: 71e489b6
        delta_lines: 15
      - name: "镜像像素使用不同颜色"
        description: "镜像部分不使用原始精灵的颜色，而是使用基于调色板映射的另一种颜色（如固定偏移或颜色对映射表）。解题者可以从颜色区分原始和镜像，但需要推断颜色映射规则。视觉上更丰富，逻辑上增加一层编码。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 20

  - id: D7
    name: "网格输出形态"
    tag: grid_shape
    current: "输出与输入同尺寸（18-28的正方形网格），精灵原地变换"
    alternatives:
      - name: "紧凑裁剪输出"
        description: "输出不保持原网格尺寸，而是紧凑裁剪到包含所有非背景像素的最小矩形。解题者不仅需要计算反射，还需要确定输出的边界范围，增加了一个输出格式推理步骤。"
        source: tight_crop
        source_task: bf45cf4b
        delta_lines: 15
      - name: "输出为长方形（非正方形）"
        description: "网格不限制为正方形，可以是任意长宽比的矩形（如14x26）。反射规则不变，但边界条件更复杂——某些方向的反射可能因网格形状不对称而被截断。解题者需要同时考虑反射和非对称边界约束。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "网格扩展以容纳所有反射"
        description: "如果反射像素超出当前网格边界，输出网格会自动扩展以容纳所有反射结果。解题者需要预判输出网格尺寸，这取决于所有精灵反射后的最大范围。"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 20

  - id: D8
    name: "标记几何形态的判别逻辑"
    tag: marker_axis
    current: "红色像素的几何形态决定反射类型：单个像素=点反射中心，同行排列=水平轴，同列排列=垂直轴"
    alternatives:
      - name: "L形标记定义双轴反射"
        description: "标记不仅是直线或单点，还可以是L形（水平+垂直各一段）。L形标记定义两条互相垂直的反射轴，精灵需做两次反射（先水平再垂直），产生3个镜像副本（水平镜像、垂直镜像、中心对称镜像）。解题者需从标记形状推断多次反射的组合规则。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "标记长度编码反射次数"
        description: "红线标记的长度决定反射操作的重复次数：长度2=反射1次（当前规则），长度3=反射后再旋转90度，长度4=生成四折对称。解题者需建立长度-变换复杂度的对应关系，不同标记产生不同的对称模式。"
        source: size_encoded_parameter
        source_task: 6ffbe589
        delta_lines: 35
      - name: "十字形标记定义四折对称"
        description: "标记为十字形（+），同时定义水平和垂直两条反射轴。精灵沿两个轴分别反射，加上中心点反射，总共产生3个镜像副本。视觉上产生四折对称的图案，推理复杂度显著增加，是当前单轴反射的自然推广。"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D9
    name: "精灵的连通性与组成"
    tag: src
    current: "嵌入式精灵为4连通分量（包含红色标记和单色载荷），孤立精灵的载荷为8连通单色分量，每个精灵严格单色"
    alternatives:
      - name: "统一使用8连通定义所有分量"
        description: "将嵌入式精灵的分量定义也改为8连通。这使得对角线相邻的像素也被视为同一分量的一部分，可能导致原本独立的精灵被合并为一个更大的分量。解题者需准确理解8连通的含义才能正确分割精灵。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "多色精灵"
        description: "精灵不再是单色的，可以包含2-3种颜色（整体仍为一个4连通分量）。镜像时保持每个像素的原始颜色。解题者需要识别多色连通分量并理解颜色在反射中被保留的规则，视觉上更复杂。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "精灵由外接矩形定义"
        description: "精灵不通过连通分量定义，而是通过外接矩形内所有非背景像素定义。即使矩形内的像素不连通，也被视为同一精灵的一部分。这改变了精灵边界的判定方式，可能产生有'洞'的精灵被整体反射。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D10
    name: "多标记间的处理顺序"
    tag: multi_step
    current: "先处理嵌入式标记（遍历所有含红色像素的4连通分量），再处理孤立红像素。各标记独立处理，无顺序依赖"
    alternatives:
      - name: "从上到下逐个处理，后续反射可覆盖先前结果"
        description: "标记按在网格中从上到下、从左到右的顺序依次处理。每步反射的结果成为下一步的输入——后续反射的镜像像素可以覆盖之前的反射结果。解题者需要模拟处理顺序才能得到正确输出，增加了序列推理。"
        source: multi_step
        source_task: 247ef758
        delta_lines: 30
      - name: "链式反射：一个镜像触发相邻标记的二次反射"
        description: "如果一个精灵的镜像落在另一个标记的反射范围内，该镜像会被二次反射。这种链式效应使得单次反射可能产生多个副本，解题者需要迭代模拟直到所有反射传播稳定。类似连锁反应的递归推理。"
        source: multi_step
        source_task: 142ca369
        delta_lines: 45
      - name: "先反射孤立标记，再反射嵌入式标记"
        description: "反转当前的处理顺序：孤立标记的点反射先执行，产生的新像素可能影响嵌入式标记的载荷范围判定。解题者需要推断正确的处理顺序，增加了元推理（推理关于规则本身的信息）难度。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D11
    name: "载荷的形状约束"
    tag: meta
    current: "嵌入式载荷为2-6行/列的外接矩形，密度0.50-0.80，3-11像素；孤立载荷1-8像素，外接矩形最大4x4"
    alternatives:
      - name: "载荷必须是矩形（无洞）"
        description: "载荷不再是任意连通形状，而是完整的矩形（所有格都被填充）。这简化了精灵的视觉复杂度，使镜像结果更规整。作为降低难度的变体有价值——解题者更容易视觉确认反射的正确性。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "载荷为极稀疏形状（密度0.2-0.4）"
        description: "载荷外接矩形内的像素密度大幅降低，精灵呈现散点/骨架状。反射规则不变，但视觉识别更困难——稀疏的像素点更难看出是'一个精灵'以及其对称关系，增加了视觉推理门槛。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "载荷为L形或T形特定模板"
        description: "载荷不是随机连通形状，而是从预定义的几何模板（L形、T形、Z形等俄罗斯方块形状）中选择。解题者需要识别这些规则形状及其反射结果，更强调对标准几何形状的直觉理解。"
        source: creative
        source_task: null
        delta_lines: 20

