  - id: D13
    name: "颜色调色板约束"
    tag: meta
    current: "3-4种不同的非背景、非红色颜色，每个嵌入式精灵单色"
    alternatives:
      - name: "仅用2种颜色"
        description: "所有精灵只使用2种颜色，大幅简化调色板。视觉上更简洁，但同色精灵更多，解题者需更依赖空间位置而非颜色来区分精灵和匹配反射关系。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "5-7种颜色丰富调色板"
        description: "增加颜色种类至5-7种，每个精灵使用不同颜色。视觉上更丰富多彩，颜色成为精灵的强区分特征。每个精灵颜色独特，更容易视觉追踪反射对应关系。"
        source: creative
        source_task: null
        delta_lines: 5
