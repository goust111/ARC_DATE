        description: "不同颜色的精灵在反射时有不同的距离倍率：如某种颜色精灵的镜像距离轴1倍（正常反射），另一种颜色距离轴2倍（双倍远离轴）。解题者需从多个示例中推断颜色-距离倍率的对应关系。这将颜色从纯视觉属性升级为功能性参数。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D14
    name: "反射结果的边界与碰撞处理"
    tag: transform
    current: "所有反射必须完全落在网格边界内，且仅落在背景格上（无重叠）"
    alternatives:
      - name: "允许反射超出边界（截断）"
        description: "反射像素超出网格边界的部分被截断丢弃。这意味着靠近边缘的精灵只能产生部分镜像。解题者需要理解'截断'规则，判断哪些像素被保留，哪些因边界而丢失。"
        source: clipping
        source_task: 581f7754
        delta_lines: 10
      - name: "反射超出边界时环绕到对侧"
        description: "网格视为环面拓扑：反射像素超出右边界从左边界进入，超出下边界从上边界进入。这引入了非直觉的空间关系，解题者需要理解周期性边界条件。产生的视觉效果会有精灵'分裂'出现在网格两端。"
        source: path_wrapping
        source_task: 88bcf3b4
        delta_lines: 25
      - name: "反射像素与现有像素重叠时进行颜色选择"
        description: "当镜像像素落在已有非背景像素的位置时，不简单覆盖或跳过，而是根据固定规则选择保留哪个颜色（如保留颜色编号较大的，或保留先处理的标记产生的颜色）。解题者需从多个冲突案例中推断选择规则。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D15
    name: "符号编码：图例与辅助信息"
    tag: symbol_instructions
    current: "无显式图例或符号编码。变换规则完全由红色标记的空间几何隐式定义"
    alternatives:
      - name: "边缘图例定义反射类型映射"
        description: "网格边缘放置一个2xN的小型图例区域：每行一对颜色，左色代表标记形态，右色代表对应的反射产出颜色。图例本身不参与反射，但为变换提供额外的颜色映射参数。解题者需要先解码图例再执行反射操作。"
        source: symbol_instructions
        source_task: dbff022c
        delta_lines: 35
      - name: "调色板块编码反射方向"
        description: "网格角落放置一个调色板块，通过颜色排列编码反射方向信息：如颜色从左到右排列表示水平反射，从上到下排列表示垂直反射。解题者需先理解调色板的空间编码，再应用到各精灵。"
        source: symbol_instructions
        source_task: 9385bd28
        delta_lines: 35
      - name: "标记像素数量编码反射倍数"
        description: "嵌入式标记的红线长度不仅定义轴位置，还编码反射的重复次数：长度N表示精灵被反射N次（产生N个等间距排列的镜像副本）。解题者需从标记长度推断输出中精灵副本的数量，量化推理与几何推理结合。"
        source: size_encoded_parameter
        source_task: 6ffbe589
        delta_lines: 35

  - id: D16
    name: "精灵与标记之间的基数关系"
    tag: meta
    current: "一对一关系：每个标记对应一个精灵（或一组8邻域精灵），每个精灵有且只有一个标记"
    alternatives:
      - name: "多对一：多个精灵共享一个反射轴"
        description: "一条红线同时作为多个精灵的反射轴（红线两侧各有多个独立精灵，各自沿该轴反射）。解题者需识别'共享轴'的概念，将轴的影响范围推广到所有邻近精灵，不再是一一对应的简单匹配。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "一对多：一个精灵被多个标记反射"
        description: "一个精灵邻近多个标记，需要同时沿所有邻近标记进行反射，产生多个镜像副本。解题者需要确定精灵属于哪些标记的'辐射范围'，然后对每个标记分别执行反射，增加了空间推理复杂度。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "标记之间的配对关系驱动两步反射"
        description: "标记两两配对（通过最近距离或相同方向），每对标记定义一个复合反射操作：精灵先沿第一个标记反射，结果再沿第二个标记反射。解题者需发现配对规则并模拟两步反射的链式过程。"
        source: multi_step
        source_task: 35ab12c3
        delta_lines: 40

