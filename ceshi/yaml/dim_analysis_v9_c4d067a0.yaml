task_id: c4d067a0
task_type: move_to_match
summary: "左上角的小型精灵图作为图例定义一个稀疏像素模式，网格中已存在部分对应的放大色块；通过已有色块推算缩放因子和偏移量，将图例中缺失的像素以相同比例放大后放置到网格对应位置"

dimensions:
  - id: D1
    name: "匹配条件：坐标映射方式"
    tag: match_cond
    current: "图例像素位置通过统一缩放因子+偏移量映射到网格位置，缩放因子由已有色块的间距与图例像素间距的比值确定"
    alternatives:
      - name: "颜色匹配对接"
        description: "不使用坐标缩放映射，而是通过颜色匹配将图例中的色块放入网格中具有相同边框颜色的空框架中。解题者需要识别框架的边框颜色与图例色块的对应关系，从坐标推理变为颜色配对推理"
        source: color_match
        source_task: 2c181942
        delta_lines: 40
      - name: "形状匹配嵌入"
        description: "图例中每个符号不是单像素而是小形状，网格中有对应形状的凹槽，根据形状匹配将符号嵌入凹槽。推理从缩放映射变为形状识别与旋转匹配"
        source: shape_match
        source_task: 16b78196
        delta_lines: 50
      - name: "非均匀缩放（行列不同比例）"
        description: "行方向和列方向使用不同的缩放因子（如行缩放3倍，列缩放5倍），解题者需要分别推断两个方向的缩放比例。增加了缩放推理的复杂度，输出色块变为非正方形矩形"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "旋转后缩放映射"
        description: "图例在映射到网格之前需要先旋转90/180/270度，解题者需要发现旋转关系后再做缩放映射。已有色块的位置暗示旋转角度，增加了空间推理的维度"
        source: rotation
        source_task: fc7cae8d
        delta_lines: 25
      - name: "镜像翻转后缩放映射"
        description: "图例经过水平或垂直翻转后再缩放映射到网格。已有色块的位置关系与图例呈镜像关系，解题者需要先识别翻转方向再推算完整映射"
        source: mirror_symmetry
        source_task: 4c416de3
        delta_lines: 25
      - name: "锚点匹配缩放"
        description: "图例中有一个特殊颜色的锚点像素，网格中也有同色锚点色块，通过锚点对齐确定偏移量，再由锚点色块的尺寸确定缩放因子。解题者需要先识别锚点再推算映射"
        source: anchor_matching
        source_task: b10624e5
        delta_lines: 30

  - id: D2
    name: "源对象：图例的结构与位置"
    tag: src
    current: "左上角稀疏像素模式（非背景色像素以偶数间隔排列在奇数行/列上），每个像素代表一个待放大的色块"
    alternatives:
      - name: "图例位于右下角"
        description: "将图例精灵从左上角移至右下角，解题者需要先在不同位置定位图例。改变了视觉扫描的起点，但核心逻辑不变，测试解题者对图例位置的灵活识别"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "图例为密集排列（无间隔）"
        description: "图例像素紧密排列（相邻行列）而非以背景色间隔排列，解题者需要发现密集模式与网格间隔色块的对应关系。改变了缩放因子的计算方式"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "多个图例精灵"
        description: "网格中存在两个或更多图例精灵，每个控制不同区域的色块放置。解题者需要识别多个图例并分别处理其映射关系，从1:1变为多源"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "图例为边缘像素行/列"
        description: "图例不是二维精灵而是沿网格边缘排列的单行或单列像素，定义一维模式后扩展为二维。解题者需要推断如何从一维模式生成二维放大结果"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "对角线标记对作为图例"
        description: "图例由对角线位置的像素对构成（类似9385bd28的对角标记），每对标记定义一个矩形的两个对角，颜色由标记色决定。解题者需要识别对角线配对关系"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 35

  - id: D3
    name: "目标位置：色块放置区域"
    tag: dst
    current: "网格中通过缩放因子计算出的对应位置，每个图例像素映射为一个 NxN 的实心色块，色块之间以背景色分隔"
    alternatives:
      - name: "放置到框架内部的洞中"
        description: "网格中预设若干空心框架（洞），图例中的色块需要放入对应框架的空洞中。目标从坐标计算变为框架内部填充，需要匹配图例位置与框架位置"
        source: hole_fill
        source_task: 67e490f4
        delta_lines: 40
      - name: "铺贴到周期性网格的指定单元"
        description: "网格被分为 NxN 的重复瓦片，图例定义每个瓦片中哪些位置需要填色。目标是在所有瓦片的对应位置放置色块，形成周期性图案"
        source: tiling
        source_task: 65b59efc
        delta_lines: 35
      - name: "仅填充空缺位置（不覆盖已有色块）"
        description: "与当前逻辑一致但显式约束：只在网格中为背景色的位置放置新色块，已有的色块不被修改。当前任务已隐含此行为，但可以设计冲突场景来测试理解"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "以重力方向堆叠放置"
        description: "色块不放在精确的缩放坐标位置，而是从图例列对应的网格列顶部落下，堆叠在已有色块或底部边缘之上。解题者需要模拟重力下落过程"
        source: gravity
        source_task: 62593bfd
        delta_lines: 40

  - id: D4
    name: "变换：色块的颜色与形状"
    tag: transform
    current: "图例像素的颜色直接保留，放大为 NxN 的同色实心方块，无颜色变换"
    alternatives:
      - name: "颜色映射变换"
        description: "图例像素的颜色在放大时通过一个可推断的映射表变换为另一种颜色（如已有色块暗示映射关系：图例红色对应网格蓝色）。解题者需要先推断颜色映射再放置"
        source: recolor
        source_task: 20270e3b
        delta_lines: 25
      - name: "放大为空心框架而非实心方块"
        description: "每个图例像素放大后不是 NxN 的实心色块，而是 NxN 的空心方框（仅边缘像素着色，内部为背景色）。改变了视觉输出特征，解题者需要发现空心规律"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "根据图例位置调整色块大小"
        description: "不同图例像素根据其在图例中的行或列位置，放大为不同尺寸的色块（如第1行放大2倍，第2行放大3倍）。解题者需要发现尺寸与位置的关系"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "颜色交换变换"
        description: "放置时发生成对的颜色交换——例如图例中红色和蓝色互换后放置。已有色块显示交换后的结果，解题者需要反推交换规则以确定缺失色块的正确颜色"
        source: color_swap
        source_task: a25697e4
        delta_lines: 20
      - name: "分形自相似放大"
        description: "每个图例像素放大时不是填充为纯色，而是递归地将整个图例模式缩小后嵌入该色块中（用该像素的颜色替换非背景色）。形成分形式的自相似图案"
        source: fractal_tiling
        source_task: a32d8b75
        delta_lines: 35

  - id: D5
    name: "轨迹：源图例的保留方式"
    tag: trajectory
    current: "图例精灵在输出中保持原样不变（keep source）"
    alternatives:
      - name: "图例消失"
        description: "放大完成后图例区域被擦除为背景色，输出中不保留原始图例。解题者需要理解图例是临时的指令而非输出的一部分，改变了对源对象的处理预期"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "图例移动到网格中心"
        description: "图例精灵从左上角移动到输出网格的中心位置（放大色块围绕其排列），原始位置变为背景色。解题者需要追踪图例的位移"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "图例放大后叠加"
        description: "图例本身也被同比例放大后叠加在输出中（类似watermark），与放置的色块共存。解题者需要区分图例放大后的影子与实际放置的色块"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D6
    name: "输出网格形状"
    tag: grid_shape
    current: "输出网格尺寸与输入相同（same），在原网格上原位添加缺失色块"
    alternatives:
      - name: "紧凑裁剪到色块区域"
        description: "输出仅包含所有放大色块（包括已有和新增的）的外接矩形区域，去除周围空白。减小输出尺寸，解题者需要确定正确的裁剪边界"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 15
      - name: "仅输出新增色块区域"
        description: "输出只包含新放置的色块（排除已有的和图例），作为紧凑的子网格。解题者需要区分新增与已有色块，输出尺寸与缺失部分的范围相关"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "输出为分离的帧"
        description: "将图例区域和放大后的完整模式分别作为两个帧并排输出，用分隔线隔开。解题者需要理解双帧输出的含义"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 25

  - id: D7
    name: "缩放因子的确定方式"
    tag: symbol_instructions
    current: "缩放因子通过已有色块的大小隐式推断（色块边长即为缩放因子），色块间距与图例像素间距成比例"
    alternatives:
      - name: "缩放因子由图例中的特殊标记像素编码"
        description: "图例中包含一个特殊颜色的标记像素，其在图例中的位置（如第N行）直接编码缩放因子N。解题者需要识别标记像素并解码其含义"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "缩放因子由网格边缘色条长度决定"
        description: "网格边缘有一个单色条，其长度等于缩放因子。解题者需要找到色条并读取其长度作为缩放参数，增加了符号解码步骤"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "缩放因子由图例与已有色块的颜色数量关系决定"
        description: "图例中不同颜色的数量或已有色块的数量本身编码缩放因子（如3种颜色对应3倍缩放）。解题者需要建立计数与缩放的对应关系"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "多级缩放：不同颜色使用不同缩放因子"
        description: "图例中不同颜色的像素使用不同的缩放因子放大（如红色放大2倍，蓝色放大4倍），缩放因子可从已有色块的不同尺寸推断。解题者需要分别推断每种颜色的缩放规则"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D8
    name: "多步处理顺序"
    tag: multi_step
    current: "Step 1: 识别左上角图例精灵; Step 2: 定位网格中已有的同色色块; Step 3: 计算缩放因子和偏移; Step 4: 在缺失位置放置放大后的色块"
    alternatives:
      - name: "迭代放大：多轮缩放"
        description: "第一轮放大产生中间结果，中间结果中又出现新的图例与色块对，需要再次放大。解题者需要识别何时停止迭代。增加了多步推理的深度"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "先放大再删除干扰项"
        description: "网格中除了正确的已有色块外还有干扰色块（位置不符合缩放规律），解题者需要先识别并忽略干扰项，再进行正确的缩放映射和放置"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "逆向过程：从放大结果推断图例"
        description: "输入包含完整的放大色块矩阵但图例区域为空（或部分缺失），解题者需要从色块模式反推图例内容。将放大过程反转为缩小/采样推理"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "从示例对中学习规则后应用"
        description: "输入包含一个完整的图例-放大示例对和一个新的图例，解题者需要从示例对中推断缩放规则，然后应用到新图例上。增加了规则学习的元推理层"
        source: rule_learning
        source_task: 4c7dc4dd
        delta_lines: 35

