task_id: 13e47133
task_type: move_along_path
summary: "网格被墙壁分割为多个区域，每个区域内的标记像素按其到区域边界的切比雪夫距离排序构建调色板，然后用调色板循环填充区域，产生同心矩形框架图案"

dimensions:
  - id: D1
    name: "路径机制：同心框架填充方式"
    tag: path
    current: "从区域边界向内计算切比雪夫距离，以 palette[dist % len] 产生同心矩形框架"
    alternatives:
      - name: "螺旋路径填充"
        description: "从区域某角开始顺时针或逆时针螺旋向内填充，每圈使用调色板中的下一个颜色。与同心框架不同，螺旋路径是连续单像素宽度的路径，解题者需要识别螺旋方向和起点。视觉上产生漩涡状图案，推理难度更高"
        source: spiral_path
        source_task: da515329
        delta_lines: 40
      - name: "从中心向外扩展的同心框架"
        description: "取反当前从边界向内的逻辑：改为从区域中心向外扩展。标记像素放在区域中心附近，距离从中心计算。视觉效果相似但推理过程相反——解题者需要先找到区域中心再向外构建"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "BFS 激活式扩散填充"
        description: "标记像素作为种子，以 BFS 方式向四邻域扩散填充。多个标记同时扩散时，各颜色区域按扩散速度竞争空间，产生 Voronoi 式分区。解题者需要理解多源 BFS 的竞争机制"
        source: BFS_activation
        source_task: 5961cc34
        delta_lines: 35
      - name: "曼哈顿距离框架"
        description: "将切比雪夫距离替换为曼哈顿距离，产生菱形（钻石形）同心框架而非矩形框架。视觉效果显著不同，解题者需要识别菱形几何结构"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D2
    name: "轨迹：颜色交替模式"
    tag: trajectory
    current: "调色板按距离循环：palette[dist % len]，标记颜色与背景色交替"
    alternatives:
      - name: "周期性重复图案"
        description: "使用固定的颜色重复模式如 AABBAABB（每种颜色连续两层），而非简单的 ABABAB 交替。解题者需要从示例中推断周期长度和重复规则"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 15
      - name: "渐变式颜色循环"
        description: "调色板不再循环重复，而是从外向内依次使用每种颜色一次，最内层用最后一种颜色填满剩余空间。解题者需要理解非循环的颜色分配规则"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "距离约束式间断轨迹"
        description: "只在偶数距离层涂标记色，奇数距离层保持背景色，产生间隔的同心框架效果。调色板不循环而是逐个使用，每个标记色只出现一次。视觉上更稀疏，推理需理解跳跃规则"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 15
      - name: "颜色配对填充"
        description: "每个标记颜色控制两层框架：一层是标记色本身，下一层是该标记色的互补色（通过某种规则确定，如同一区域内距离最近的另一标记色）。解题者需要推断颜色配对规则"
        source: color_pairing
        source_task: 16de56c4
        delta_lines: 25

  - id: D3
    name: "源对象：标记像素的定义与放置"
    tag: src
    current: "每个区域内 0-3 个孤立彩色像素，位于区域角落对角线上，按切比雪夫距离递增放置"
    alternatives:
      - name: "标记像素放置在区域边缘上"
        description: "标记像素不在角落对角线上，而是放置在区域边界（距离=0）的不同位置。调色板排序改为按标记像素沿边界的顺时针顺序。解题者需要识别边界遍历方向而非距离排序"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "标记像素为 2x2 色块而非单像素"
        description: "每个标记改为 2x2 的小色块，颜色仍各不相同。距离计算基于色块中心到边界的距离。视觉上更显眼，但占据空间更大，对区域尺寸有更高要求"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "标记像素按行优先顺序确定调色板"
        description: "标记像素可以散布在区域内任意位置（不限于角落对角线），调色板的排列顺序由标记像素的行优先扫描顺序决定，而非按到边界的距离。解题者需要推断排序规则的变化"
        source: sorting_by_distance
        source_task: dd6b8c4b
        delta_lines: 15
      - name: "控制像素放置在网格边缘"
        description: "标记像素不在区域内部，而是放在对应区域所在的网格边缘行/列上。解题者需要先将边缘标记与对应区域关联，再执行填充。增加了空间推理的复杂度"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 30

  - id: D4
    name: "终止条件：填充的终点"
    tag: dst
    current: "填充直到整个区域被完全覆盖（无显式终止条件）"
    alternatives:
      - name: "填充到指定深度后停止"
        description: "通过标记像素的数量编码填充深度上限：若区域有 N 个标记，则只填充到距离 N 处停止，内部剩余区域保持背景色。解题者需要推断数量与深度的对应关系"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 10
      - name: "遇到其他颜色像素时停止"
        description: "在区域内额外放置一些阻挡色块，同心框架扩展到碰到阻挡物时在该方向停止（类似碰撞停止）。产生不规则的局部框架图案，推理需要理解碰撞机制"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 25
      - name: "填充到两个区域的标记颜色层交汇处"
        description: "相邻区域的同心框架同时向外扩展，在墙壁位置交汇时各自停止。去掉墙壁后让区域间的填充竞争空间。解题者需要理解多区域竞争逻辑"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D5
    name: "变换：标记像素在输出中的处理"
    tag: transform
    current: "标记像素被同心框架的调色板颜色覆盖，不在输出中单独保留"
    alternatives:
      - name: "保留标记像素不被覆盖"
        description: "输出中标记像素保持原样，同心框架在标记位置断开。解题者需要注意标记像素作为'锚点'被保留的规则，增加了识别难度"
        source: keep_source
        source_task: 53fb4810
        delta_lines: 5
      - name: "标记像素颜色变换后保留"
        description: "标记像素在输出中不被覆盖，但其颜色改变为所在距离层的调色板颜色的互补色或另一种指定颜色。解题者需要同时理解框架填充和标记变换两条规则"
        source: recolor
        source_task: 271d71e2
        delta_lines: 15
      - name: "标记像素消失且擦除所在框架层"
        description: "标记像素所在的那一层框架不涂色（保持背景色），相当于标记'擦除'了自己所在的层。产生有缺口的同心框架图案，视觉上更独特"
        source: erase
        source_task: 3dc255db
        delta_lines: 10

  - id: D6
    name: "网格形状：输出的裁剪方式"
    tag: grid_shape
    current: "输出与输入网格尺寸完全相同"
    alternatives:
      - name: "裁剪到单个区域"
        description: "输出只保留某个特定区域（如包含最多标记的区域）的紧凑裁剪，去掉墙壁和其他区域。解题者需要先判断选哪个区域，再执行填充"
        source: crop
        source_task: a6f40cea
        delta_lines: 15
      - name: "每个区域单独输出并拼接"
        description: "将所有区域分别填充后，按从左到右从上到下的顺序紧密拼接为一个新网格，用分隔线分开。输出布局与输入完全不同，解题者需要理解拆分重组逻辑"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 30
      - name: "紧凑裁剪去除纯背景边缘"
        description: "填充完成后，裁剪掉输出网格四周的纯背景行/列。如果外侧区域没有标记则会被去掉。解题者需要推断裁剪规则"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 10

  - id: D7
    name: "区域分割方式"
    tag: obstacle
    current: "单一颜色的轴对齐墙壁线段将网格分割为 3-6 个矩形或 L/T 形区域，墙壁像素不变"
    alternatives:
      - name: "墙壁形成封闭矩形框架"
        description: "墙壁不是简单的直线分割，而是形成嵌套的封闭矩形框架，区域是框架之间的环形空间。同心填充在环形区域中进行，产生更复杂的视觉效果"
        source: frame_completion
        source_task: a6f40cea
        delta_lines: 40
      - name: "多色墙壁分割"
        description: "使用两种以上颜色的墙壁，不同颜色墙壁分割出的区域使用不同的填充规则（如颜色A墙壁分出的区域顺时针排列调色板，颜色B墙壁分出的区域逆时针排列）。解题者需要推断墙壁颜色与填充规则的对应关系"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "不规则色块作为区域分隔"
        description: "用不规则形状的色块（而非直线墙壁）分隔网格，产生不规则形状的区域。同心框架的切比雪夫距离计算在不规则区域上仍然有效，但视觉效果更复杂"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "无墙壁分割，区域由背景色变化界定"
        description: "去掉显式墙壁，改为不同区域使用不同背景色来区分。标记像素仍然存在，填充时每个区域的'背景色'就是各自的主色。解题者需要先通过颜色差异识别区域边界"
        source: inversion
        source_task: null
        delta_lines: 25

  - id: D8
    name: "调色板构建规则"
    tag: meta
    current: "按标记到边界的切比雪夫距离排序，距离>0时在前面补背景色；调色板循环使用"
    alternatives:
      - name: "按颜色值排序构建调色板"
        description: "忽略标记的空间位置，改为按标记颜色的某种可视属性排序（如从暖色到冷色，或按颜色在 ARC 调色板中的索引排序）构建调色板。解题者需要推断排序标准不再是距离而是颜色属性"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "反转调色板顺序"
        description: "将当前调色板的顺序反转：最深处的标记色放在最外层框架。视觉上框架颜色排列完全相反，解题者需要识别距离到颜色的反向映射"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "多区域共享全局调色板"
        description: "所有区域的标记颜色汇总为一个全局调色板（按在网格中出现的行优先顺序排列），每个区域都用同一调色板填充。解题者需要先收集全局信息再逐区域应用"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "调色板长度由区域面积决定"
        description: "调色板不再简单循环，而是将区域的最大深度均分为 len(palette) 段，每段涂一种颜色。小区域和大区域即使标记相同，框架宽度也不同。解题者需要推断面积与框架宽度的关系"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D9
    name: "多步处理与顺序"
    tag: multi_step
    current: "单步处理：独立地对每个区域执行填充，区域间无交互"
    alternatives:
      - name: "按区域面积从小到大依次处理"
        description: "区域处理顺序有意义：先处理小区域，其填充结果影响后续区域的调色板（如已使用的颜色不能再用）。解题者需要推断处理顺序和颜色排除规则"
        source: multi_step
        source_task: 271d71e2
        delta_lines: 20
      - name: "两步处理：先填充再传播"
        description: "第一步：正常对每个区域做同心框架填充。第二步：每个区域最内层的颜色'溢出'到相邻区域的最外层，覆盖一层框架。解题者需要理解两步变换的先后依赖"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "迭代式扩展直到稳定"
        description: "每一轮只向内扩展一层框架，多轮迭代直到所有区域填满。每轮结束后重新检查标记状态（如被覆盖的标记不再贡献颜色）。解题者需要理解迭代过程"
        source: multi_step
        source_task: 28a6681f
        delta_lines: 30

  - id: D10
    name: "距离度量方式"
    tag: meta
    current: "使用切比雪夫距离（8-邻域）计算到区域边界的距离"
    alternatives:
      - name: "使用曼哈顿距离（4-邻域）"
        description: "改用曼哈顿距离计算到边界的距离，同心框架变为菱形轮廓而非矩形。在不规则区域中差异尤其明显，解题者需要识别距离度量的改变"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "使用欧几里得距离（取整）"
        description: "用欧几里得距离的整数部分作为框架层编号，产生近似圆形的同心框架。视觉效果在大区域中显著不同于矩形框架"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "使用到标记像素的距离而非到边界的距离"
        description: "距离不再从边界计算，而是从标记像素本身开始计算（标记像素距离为0，向外递增）。产生以标记为中心向外扩散的同心图案，而非以边界为起点向内收缩"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D11
    name: "标记数量与区域关系"
    tag: meta
    current: "每个区域独立拥有 0-3 个标记，标记颜色在区域内不重复"
    alternatives:
      - name: "所有区域必须恰好有相同数量的标记"
        description: "约束所有区域的标记数量相同（如都是2个），消除0标记区域的特殊情况。解题者可以利用这个全局一致性来验证推理"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "标记颜色在不同区域间可以重复"
        description: "允许不同区域使用相同的标记颜色，但每个区域的调色板仍独立构建。解题者不能仅凭颜色区分区域，需要关注空间位置"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "区域间标记颜色互斥"
        description: "严格要求不同区域的标记颜色完全不同（当前已近似如此但非严格约束）。某个颜色只出现在一个区域内，解题者可以通过颜色直接判断归属"
        source: creative
        source_task: null
        delta_lines: 5

