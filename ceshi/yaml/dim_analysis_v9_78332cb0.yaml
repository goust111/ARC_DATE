task_id: 78332cb0
task_type: move_to_match
summary: "将打散的5x5精灵块通过边缘前景像素匹配，按唯一有效方向链接成有序条带"

dimensions:
  - id: D1
    name: "边缘匹配条件"
    tag: match_cond
    current: "相邻块的facing边缘在相同偏移处共享前景像素（交集大小=1），形成唯一链"
    alternatives:
      - name: "形状嵌合匹配"
        description: "将边缘匹配改为形状嵌合：一个块的凸出部分恰好填入相邻块的凹陷部分（如拼图齿），解题者需要识别互补轮廓而非单点重合，空间推理难度显著提升"
        source: shape_match
        source_task: 16b78196
        delta_lines: 40
      - name: "边缘颜色匹配"
        description: "每个块的边缘像素可以有不同颜色，匹配条件改为相邻边缘的颜色序列完全一致（不仅位置对齐，颜色也要相同），增加了颜色维度的推理"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 25
      - name: "旋转/翻转后边缘匹配"
        description: "允许块在放置前进行旋转或翻转，使边缘像素对齐。解题者需要同时考虑方向变换和位置匹配，组合爆炸使推理更具挑战性"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 35
      - name: "边缘像素数量匹配"
        description: "匹配条件不是位置重合，而是相邻边缘的前景像素数量相等。解题者需要计数而非空间对齐，改变了核心推理模式"
        source: count_match
        source_task: 6e4f6532
        delta_lines: 20
      - name: "边缘互补匹配"
        description: "取反当前匹配：相邻边缘的前景像素位置互补（一边有像素的偏移另一边没有，反之亦然），形成齿轮般的咬合关系，视觉上更直观"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D2
    name: "链方向唯一性约束"
    tag: match_cond
    current: "恰好一个方向（水平或垂直）存在有效链，另一个方向不存在"
    alternatives:
      - name: "双方向均有效但选较长链"
        description: "允许两个方向都存在有效链，但输出选择包含更多块的那个方向（需要设计不同数量的块在不同方向有效），解题者需要比较两条链的长度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "方向由特殊标记指示"
        description: "两个方向都可能有效链，但输入网格中有一个特殊标记像素指示应使用哪个方向（如红色像素在顶部表示垂直，在左侧表示水平），增加了符号解码环节"
        source: marker_pixels
        source_task: 9aaea919
        delta_lines: 30
      - name: "双方向均有效需分别输出"
        description: "两个方向都存在有效链，输出为两条strip拼接（水平链在上，垂直链在下，用分隔线隔开），解题者需要同时找到两条链"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D3
    name: "源对象结构"
    tag: src
    current: "5x5的单色精灵块，每块一个连通分量，4-10个前景像素，由品红分隔线分开"
    alternatives:
      - name: "可变尺寸精灵块"
        description: "块的尺寸不固定为5x5，而是在3x3到7x7之间变化。匹配时需要处理不同大小的块的边缘对齐，解题者需要先识别块尺寸再进行边缘匹配"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "多色精灵块"
        description: "每个块包含两种不同颜色的前景像素，边缘匹配仅考虑特定颜色的像素位置。解题者需要区分哪种颜色参与匹配，增加了颜色选择的推理层"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 30
      - name: "含干扰像素的精灵块"
        description: "每个块除了有效前景像素外，还有少量干扰色像素。边缘匹配仅考虑主色像素，解题者需要先过滤干扰再进行匹配"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "空心框架精灵"
        description: "精灵从实心连通分量改为空心框架结构（如只有边框的矩形），边缘匹配基于框架的边缘像素位置。视觉上与实心精灵完全不同，推理过程类似"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 30

  - id: D4
    name: "目标排列方式"
