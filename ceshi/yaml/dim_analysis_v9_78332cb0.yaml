    current: "1xN条带（水平或垂直），块按链序排列，用品红分隔线分开"
    alternatives:
      - name: "2D网格排列"
        description: "输出不是一维条带而是二维网格（如2x2或2x3），链顺序按蛇形或Z形展开到网格中。解题者需要推断展开规则，增加空间布局推理"
        source: jigsaw_assembly
        source_task: 8698868d
        delta_lines: 30
      - name: "紧密拼接无分隔线"
        description: "输出条带中去掉品红分隔线，块直接相邻放置。边缘匹配像素在拼接处重叠合并，形成连续的图案。视觉效果更整体，解题者需要理解拼合逻辑"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "环形排列"
        description: "输出为环形条带：最后一个块的尾边也必须与第一个块的首边匹配，形成闭合链。解题者需要找到闭合环的唯一排列"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "嵌套排列"
        description: "输出不是并排排列，而是块按链序从外到内嵌套（大块包裹小块），每层偏移固定量。解题者需要理解嵌套规则而非线性排列"
        source: stacking
        source_task: 3dc255db
        delta_lines: 40

  - id: D5
    name: "变换操作"
    tag: transform
    current: "仅平移（将块从打散位置移到链序位置），不旋转不变色"
    alternatives:
      - name: "匹配后重新着色"
        description: "块在链接后，颜色按链序位置变化（如第一个块变为颜色1，第二个变为颜色2），解题者需要先推断链序再确定颜色映射"
        source: recolor
        source_task: 20270e3b
        delta_lines: 15
      - name: "匹配边缘擦除"
