    tag: meta
    current: "网格中恰好两个蓝色像素，天然配对"
    alternatives:
      - name: "多蓝色像素按颜色深浅配对"
        description: "网格中存在4个或更多蓝色像素，分为深蓝和浅蓝两种色调，同色调的像素配对连接对角线。解题者需要先按色调分组再分别处理，增加了分类推理步骤。"
