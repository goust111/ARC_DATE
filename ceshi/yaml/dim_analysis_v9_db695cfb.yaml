task_id: db695cfb
task_type: move_along_path
summary: "连接一对蓝色像素的对角线，并在对角线经过的品红像素处沿垂直对角方向延伸品红射线至网格边界"

dimensions:
  - id: D1
    name: "主路径类型"
    tag: path
    current: "对角线连接（diagonal_line）——在两个蓝色像素之间绘制严格45度对角线"
    alternatives:
      - name: "直线连接（水平/垂直）"
        description: "两个蓝色像素之间用水平或垂直直线连接，而非对角线。品红像素在直线上触发的延伸也变为正交方向。这改变了基本的几何思维模式，从对角线推理转为正交推理，降低了路径确定的难度但改变了整体视觉结构。"
        source: straight_ray
        source_task: 221dfab4
        delta_lines: 20
      - name: "最短路径连接（含拐弯）"
        description: "两个蓝色像素之间通过L形折线（先水平再垂直，或先垂直再水平）连接，而非严格对角线。需要从示例中推断折线方向的选择规则（如优先水平还是垂直）。这增加了路径不唯一带来的推理难度。"
        source: pathfinding
        source_task: cb2d8a2c
        delta_lines: 25
      - name: "阶梯形对角路径"
        description: "两个蓝色像素之间用阶梯形锯齿线连接（每步交替走水平和垂直各一格），而非严格的45度对角像素。阶梯路径在视觉上更宽，品红像素的触发判定也需要适应阶梯形状，增加了空间判断的复杂度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "曲线路径（抛物线近似）"
        description: "两个蓝色像素之间用离散化的弧线连接，如在对角线基础上加入正弦偏移。路径不再是直线而是弯曲的，解题者需要识别弯曲规律并判断品红像素是否在路径上。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D2
    name: "延伸路径方向规则"
    tag: path
    current: "垂直对角延伸（perpendicular_extension）——从品红像素出发，沿原对角线旋转90度的两个方向延伸至网格边界"
    alternatives:
      - name: "同向延伸（平行于主对角线）"
        description: "品红像素触发的延伸不是垂直方向而是平行于主对角线方向。延伸线与主对角线平行，形成类似铁轨的平行线图案。解题者需要区分'垂直'与'平行'的关系，推理方向完全相反。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "正交延伸（水平+垂直）"
        description: "品红像素触发的延伸改为水平和垂直两个正交方向（十字形），而非对角方向。这创造了对角主线与正交分支的视觉对比，解题者需要理解主路径和分支使用不同的方向体系。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "反射式延伸"
        description: "品红像素作为反射墙，主对角线在品红像素处发生反射并继续延伸，同时保留原方向的穿透线。类似光线遇到半透明镜面，一半反射一半穿透。视觉上形成分叉的光路图案。"
        source: reflection
        source_task: 142ca369
        delta_lines: 25
      - name: "单侧延伸（基于品红像素位置）"
        description: "品红像素只向一个垂直对角方向延伸，具体方向由品红像素相对于主对角线的位置决定（如在对角线上方则向上延伸，下方则向下延伸）。解题者需要推断位置与延伸方向的对应规则。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D3
    name: "延伸终止条件"
    tag: dst
    current: "延伸至网格边界——射线从品红像素出发一直画到网格边缘才停止"
    alternatives:
      - name: "遇到已有像素停止"
        description: "延伸射线在遇到任何非背景像素时停止，而非一直延伸到网格边界。这意味着蓝色主对角线或其他品红延伸线可以充当障碍物，创造了线条之间的相互遮挡关系，增加了空间推理的复杂度。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 10
      - name: "固定长度延伸"
        description: "延伸射线的长度不由网格边界决定，而由品红像素到最近蓝色像素的距离决定（如等长延伸）。解题者需要测量距离并将其作为延伸长度参数，增加了数值推理维度。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 15
      - name: "延伸至遇到另一条线"
        description: "延伸射线在遇到其他品红延伸线或蓝色对角线时停止。这创造了网格状的交叉图案，线条之间相互限制长度。解题者需要考虑多条线的交互顺序。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "延伸到对称位置停止"
        description: "品红延伸线的长度等于品红像素在主对角线上的对称距离（到主对角线两端的较短距离）。越靠近中心的品红像素延伸越长，形成菱形或纺锤形视觉效果。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D4
    name: "主路径轨迹涂色"
    tag: trajectory
    current: "蓝色连续涂色——沿对角线路径每个像素都涂蓝色，形成连续的蓝色对角线"
    alternatives:
      - name: "周期性颜色图案"
        description: "主对角线采用周期性颜色交替涂色，如蓝-黄-蓝-黄或蓝-蓝-黄-蓝-蓝-黄。解题者需要从示例中识别颜色周期规律，增加了模式识别的难度。视觉上比纯色线条更丰富。"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 15
      - name: "间歇涂色（虚线）"
        description: "主对角线每隔一格涂色，形成虚线状轨迹。品红像素的触发条件变为'位于虚线路径上'（包括未涂色的间隔位置），增加了判断品红像素是否在路径上的推理难度。"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 15
      - name: "渐变涂色（靠近品红像素时变色）"
        description: "主对角线在接近品红像素时颜色发生渐变（如蓝色逐渐变深或变为另一种颜色），品红像素本身保持不变。视觉上形成了品红像素周围的'场效应'，解题者需要理解距离与颜色的关系。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "不涂色（仅标记端点和交叉点）"
        description: "主对角线路径不实际涂色，只保留蓝色端点和品红交叉点可见。品红延伸线照常绘制。解题者需要推断出一条不可见的对角线连接并理解品红像素在其上的作用。这大幅增加了推理抽象度。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D5
    name: "延伸轨迹涂色"
    tag: trajectory
    current: "品红色连续涂色——垂直对角延伸线全部涂品红色"
    alternatives:
      - name: "继承触发点颜色但加以区分"
        description: "每条品红延伸线使用与主对角线不同但有规律的颜色——如第一个品红像素的延伸用红色，第二个用绿色，按顺序分配不同颜色。解题者需要推断颜色分配的顺序规则。"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 20
      - name: "延伸线长度编码涂色"
        description: "延伸线的颜色由其长度决定：较短的延伸线用一种颜色，较长的用另一种颜色，根据长度阈值分组。这增加了颜色与几何属性之间的对应关系推理。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "交替颜色涂色"
        description: "品红延伸线采用品红与背景色交替的虚线模式，间隔大小由品红像素在主对角线上的位置序号决定（第一个品红像素间隔1，第二个间隔2，以此类推）。解题者需要关联位置序号与涂色模式。"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 15
      - name: "从品红渐变到蓝色"
        description: "延伸线从品红像素出发时为品红色，逐渐变为蓝色（使用ARC调色板中的中间色），形成从品红到蓝的颜色渐变。视觉上更美观，解题者需要识别渐变规则和可用颜色序列。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D6
    name: "源对象类型"
    tag: src
    current: "一对蓝色像素——两个孤立的蓝色像素定义对角线的起点和终点"
    alternatives:
      - name: "多对蓝色像素"
        description: "网格中存在多对蓝色像素（可通过颜色深浅或空间邻近性配对），每对各自连接形成独立的对角线。品红像素可能同时位于多条对角线上，创造了多线条交互的复杂场景。解题者需要先正确配对再分别处理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "蓝色线段（多像素）"
        description: "源不是两个孤立像素，而是两段短蓝色线段（如2-3个像素的水平或垂直线段）。对角线连接两条线段的某个特定点（如中心点或端点）。解题者需要从线段中推断出连接点的选取规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "箭头形状指示方向"
        description: "源是L形或箭头形的蓝色精灵，箭头的朝向决定对角线的方向（如向右上方、向左下方）。对角线从箭头尖端出发延伸至网格边界或指定终点。解题者需要识别箭头朝向。"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 25
      - name: "网格边缘上的控制像素"
        description: "蓝色像素位于网格边缘而非网格内部，对角线从边缘向网格内部延伸。两个边缘像素的行列差决定对角线的跨度。这改变了空间布局，解题者需要从边缘坐标推断内部路径。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 15

  - id: D7
    name: "交互触发对象"
    tag: obstacle
    current: "品红像素——位于主对角线路径上的品红像素触发垂直对角延伸"
    alternatives:
      - name: "多色触发像素（不同颜色不同行为）"
        description: "路径上存在多种颜色的像素（如品红和红色），不同颜色触发不同方向的延伸——品红触发垂直对角延伸，红色触发水平/垂直正交延伸。解题者需要从示例中推断颜色与延伸规则的映射关系，大幅增加推理维度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "色块触发（非单像素）"
        description: "触发延伸的不是单个品红像素而是小型品红色块（2x2或特定形状）。色块的大小或形状决定延伸线的属性（如长度或方向数量）。解题者需要识别色块特征与延伸参数的关系。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "障碍物像素（阻断+延伸）"
        description: "品红像素既触发垂直对角延伸又阻断主对角线——主对角线在品红像素处中断，不继续穿过。这改变了主对角线的连续性，解题者需要理解品红像素的双重功能（阻断+分支）。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "不在路径上的邻近像素触发"
        description: "触发延伸的品红像素不在主对角线上，而是与主对角线相邻（如距离1像素）。延伸方向从品红像素出发而非从对角线上的点出发。解题者需要判断邻近关系而非精确的线上判定。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D8
    name: "触发像素数量与排列"
    tag: obstacle
    current: "对角线上可能有多个品红像素，每个独立触发延伸"
    alternatives:
      - name: "仅第一个/最后一个品红像素触发"
        description: "即使对角线上有多个品红像素，只有特定位置的一个（如最靠近起点或终点的）触发延伸。解题者需要从示例中推断'哪个品红像素被激活'的选取规则，增加了筛选条件的推理。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "品红像素之间相互影响"
        description: "多个品红像素的延伸线相互作用——如果两条延伸线会交叉，则在交叉点生成新的触发事件（连锁反应）。这创造了级联效果，解题者需要模拟多步传播过程。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 30
      - name: "品红像素成对触发"
        description: "品红像素必须成对出现在对角线上，每对品红像素之间的线段决定延伸的属性（如两者间距决定延伸长度）。落单的品红像素不触发任何延伸。解题者需要正确配对品红像素。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D9
    name: "多步处理顺序"
    tag: multi_step
    current: "两步处理——先画蓝色对角线，再从对角线上的品红像素延伸垂直对角线"
    alternatives:
      - name: "迭代传播（延伸线上的品红也触发）"
        description: "延伸线如果经过其他品红像素，这些品红像素也会触发新的延伸（再次旋转90度，回到原对角线方向）。过程迭代直到没有新的品红像素被激活。这创造了树状或网状的线条传播图案，大幅增加了复杂度。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 25
      - name: "先延伸后连接"
        description: "处理顺序颠倒——先从所有品红像素出发画垂直对角延伸线，然后再画连接蓝色像素的主对角线。当主对角线与延伸线交叉时，交叉点的颜色优先级不同（蓝色覆盖品红或反之）。解题者需要推断正确的图层顺序。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "从两端同时生长"
        description: "对角线从两个蓝色像素同时向中间生长，每前进一步就检查当前位置是否有品红像素并立即触发延伸。两端的生长线在中间相遇时停止。处理顺序变为交替进行而非先完成主线再处理分支。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "三步处理：连接-延伸-变换"
        description: "增加第三步——在画完主对角线和品红延伸线后，对所有线条交叉点执行额外变换（如涂特殊颜色或扩大为十字形标记）。解题者需要识别交叉点的特殊处理规则。"
        source: creative
        source_task: null
        delta_lines: 20

