task_id: e8686506
task_type: move_to_match
summary: "将散落在背景上的彩色像素碎片（拼图块）通过边缘对齐拼装成一个完整的矩形复合图案，输出具有严格的左右镜像对称性，同色碎片不可4-连通相邻"

dimensions:
  - id: D1
    name: "匹配条件：边缘对齐拼合 vs 其他匹配逻辑"
    tag: match_cond
    current: "s.edge.position aligns with d.adjacent_piece.edge — 碎片的边缘位置与相邻碎片对齐，形成连续矩形"
    alternatives:
      - name: "颜色匹配决定相邻关系"
        description: "碎片边缘带有提示色像素，只有边缘颜色互相对应的碎片才能相邻放置。将纯几何推理转化为颜色对应推理，解题者需先建立颜色配对映射再组装"
        source: color_match
        source_task: 2c181942
        delta_lines: 35
      - name: "连接器标记匹配"
        description: "每个碎片的某条边上有一个特殊颜色的突出像素（连接器），只有连接器颜色和位置匹配的碎片边才能相邻。增加了局部特征识别的推理层"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 40
      - name: "允许旋转后边缘匹配"
        description: "碎片可以旋转90/180/270度后再进行边缘对齐，大幅增加搜索空间。解题者需在旋转和平移的联合空间中寻找正确拼合方式，类似真实拼图"
        source: rotation
        source_task: fc7cae8d
        delta_lines: 50
      - name: "允许翻转后边缘匹配"
        description: "碎片可以水平或垂直翻转后再拼合。与旋转不同，翻转改变了碎片的手性，解题者需判断是否需要镜像变换"
        source: flip
        source_task: fc7cae8d
        delta_lines: 45
      - name: "碎片排列由尺寸排序决定"
        description: "碎片在拼合后的矩形中按面积从大到小（或从小到大）排列，面积最大的在中心。匹配逻辑从几何边缘变为尺寸序关系"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 30
      - name: "形状嵌合匹配"
        description: "碎片不是通过边缘齐平拼合，而是凹凸互补嵌合——一个碎片的突出部分恰好嵌入另一个碎片的凹陷中。推理从边对齐变为凹凸互补分析"
        source: shape_match
        source_task: 16b78196
        delta_lines: 45

  - id: D2
    name: "源对象：碎片的类型与结构"
    tag: src
    current: "散落的单色非背景像素碎片和精灵片段，每个碎片为单一颜色的连通区域"
    alternatives:
      - name: "多色复合碎片"
        description: "每个碎片包含两种颜色——外框色和内填色。拼合时用外框形状对齐，内填色保留。解题者需区分两层颜色信息，增加视觉分析复杂度"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "碎片带锚点标记"
        description: "每个碎片有一个特殊颜色的锚点像素，拼合时锚点必须对齐到目标位置的对应标记。增加了点对点的精确对位要求"
        source: anchor_points
        source_task: 4c416de3
        delta_lines: 30
      - name: "碎片为中空框架形"
        description: "源碎片不是实心色块而是带洞的中空框架，洞内为背景色。拼合后框架叠加形成复杂的镂空图案，视觉识别难度更大"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 30
      - name: "碎片含干扰像素"
        description: "输入中混杂少量不属于任何碎片的孤立干扰像素，解题者需区分有效碎片和干扰像素后再进行拼合"
        source: creative
        source_task: null
        delta_lines: 20

