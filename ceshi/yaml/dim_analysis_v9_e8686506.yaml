        source: creative
        source_task: null
        delta_lines: 40
      - name: "拼合后填入已有框架的洞中"
        description: "输入中存在一个带洞的大框架，碎片拼合后的形状恰好填满框架的洞。增加了洞的形状识别和碎片-洞匹配的双重推理"
        source: hole_fill
        source_task: 67e490f4
        delta_lines: 45
