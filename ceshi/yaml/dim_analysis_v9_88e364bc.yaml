task_id: 88e364bc
task_type: move_along_path
summary: "黄色像素在被彩色墙壁围成的封闭区域内，根据网格角落图例中红色指示像素编码的方向滑动，堆叠到区域远端墙壁"

dimensions:
  - id: D1
    name: "图例方向编码方式"
    tag: symbol_instructions
    current: "图例为5x5或6x7实心矩形，包含三种颜色：填充色C（最多）、中心色（4像素，靠近中心）、指示色/红色（2像素，更外围）；方向 = sign(centroid(指示色) - centroid(中心色))"
    alternatives:
      - name: "箭头形状编码方向"
        description: "图例不再使用双色质心偏移计算方向，而是用一个由填充色C构成的小型箭头形状（如L形或三角形），箭头的朝向直接指示滑动方向。解题者需要识别箭头形状而非计算质心偏移，从数学推理变为形状识别，降低了抽象度但增加了形状解读的变化性。"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 30
      - name: "单像素偏移编码方向"
        description: "图例简化为3x3小方块，填充色C占8像素，中间1像素为指示色，指示色相对于3x3中心的偏移方向即为滑动方向（8个方向）。更紧凑的图例设计释放更多网格空间给区域，同时保持方向编码的清晰性。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "颜色序列编码方向"
        description: "图例为1xN或Nx1条状结构，颜色序列的排列顺序编码方向——例如从左到右排列表示向右，从上到下排列表示向下。对角线方向通过L形排列编码。解题者需要从线性序列推断二维方向。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "图例中指示色像素数量编码步长"
        description: "保留当前方向编码方式，但增加额外信息：图例中指示色像素的数量（2、3或4个）编码每次滑动的最大步数，而非滑到墙壁为止。解题者需要同时解读方向和步长两个参数。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D2
    name: "图例与区域的匹配机制"
    tag: symbol_instructions
    current: "legend_lookup——图例填充色C与区域边界墙壁的多数颜色匹配，每种墙壁颜色恰好对应一个图例"
    alternatives:
      - name: "按区域面积排序匹配"
        description: "图例不再通过颜色匹配区域，而是按位置排序（如从左上到右下）与按面积排序的区域一一对应——最大区域匹配第一个图例，次大匹配第二个。解题者需要同时计算区域面积并排序，增加了数值推理维度。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "图例位置编码匹配象限"
        description: "图例放置在四个角落之一，匹配同象限内的所有区域——左上角图例控制左上象限的区域，右下角图例控制右下象限。解题者需要判断每个区域所在的象限而非颜色匹配。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "多图例颜色混合匹配"
        description: "当存在两个图例时，某些区域的墙壁同时包含两种图例颜色——此时滑动方向为两个图例方向的向量叠加。解题者需要分析墙壁颜色的混合比例来确定合成方向。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "墙壁厚度编码匹配"
        description: "所有墙壁使用同一颜色，但墙壁的局部厚度（1像素或2像素）编码该区域对应哪个图例。解题者需要检测墙壁厚度的微妙变化来确定方向映射。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D3
    name: "滑动路径类型"
    tag: path
    current: "directional_movement——黄色像素沿图例指定的固定方向（基数或对角线）直线滑动，遇到区域边界或已占据位置停止"
    alternatives:
      - name: "重力流动（向下+侧向扩散）"
        description: "黄色像素不沿固定方向滑动，而是像水一样受重力影响——优先向下，下方被挡时向左右扩散。图例编码'重力方向'而非固定矢量方向。路径不再是直线而是流体行为，解题者需要模拟流体动力学。"
        source: gravity
        source_task: 28a6681f
        delta_lines: 35
      - name: "沿墙壁边界滑动"
        description: "黄色像素不沿固定方向穿越区域，而是沿区域内壁（墙壁内侧边界）顺时针或逆时针滑动。图例编码旋转方向（顺/逆时针）。解题者需要理解边界追踪的概念。"
        source: boundary_trace
        source_task: 88bcf3b4
        delta_lines: 40
      - name: "最短路径到目标点"
        description: "区域内除了黄色像素外还有一个目标标记像素，黄色像素沿BFS最短路径移动到目标位置（而非沿固定方向滑动到墙壁）。图例被替换为目标标记，完全改变了推理模式。"
        source: shortest_path
        source_task: 7b0280bc
        delta_lines: 40
      - name: "反射路径（遇墙反弹）"
        description: "黄色像素沿图例方向出发，遇到墙壁时像光线一样反射继续运动，直到能量耗尽（固定步数）或无法继续。最终位置为停下的地方。解题者需要追踪多次反射的路径。"
        source: reflection
        source_task: 142ca369
        delta_lines: 30

  - id: D4
    name: "滑动终止条件"
    tag: dst
    current: "boundary_collision——黄色像素滑到区域边界（墙壁或区域外）时停止；多个黄色像素在同区域内会堆叠"
    alternatives:
      - name: "滑动固定步数后停止"
        description: "黄色像素不滑到墙壁，而是滑动由图例编码的固定步数后停止（即使前方仍有空间）。步数可通过图例中某类像素的数量来编码。解题者需要同时解读方向和距离两个参数。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 20
      - name: "遇到特定颜色标记停止"
        description: "区域内放置额外的彩色标记像素（非黄色、非墙壁色），黄色像素滑到标记位置时停止而非滑到墙壁。这将终止条件从被动碰壁变为主动寻的，解题者需要识别标记的存在。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 15
      - name: "遇到另一个黄色像素时不堆叠而是停在前一格"
        description: "反转当前的堆叠行为：当一个黄色像素滑动遇到另一个已停止的黄色像素时，它停在前一格位置而非紧贴堆叠，两者之间保持1格间隙。这改变了多像素的空间排布规则。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "滑到区域中心最近位置停止"
        description: "黄色像素不滑到远端墙壁，而是滑到距离区域几何中心最近的位置停止。方向仍由图例决定，但终点是中心而非墙壁。解题者需要估计区域中心并理解'最近'的含义。"
        source: centering
        source_task: 58f5dbd5
        delta_lines: 20

  - id: D5
    name: "移动对象（源）类型"
    tag: src
    current: "control_pixels——黄色单像素（颜色4），每个区域1-2个，作为被移动的对象"
    alternatives:
      - name: "多像素精灵（2x2色块）"
        description: "移动对象不是单像素而是2x2的黄色小方块，整体沿方向滑动。这增加了碰撞检测的复杂度——方块的四个角都不能越界，且方块间的堆叠需要更大空间。解题者需要从单像素思维扩展到面积思维。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "不同颜色的移动像素"
        description: "区域内的移动像素不全是黄色，而是有多种颜色（如黄色、橙色、粉色），每种颜色的像素响应不同的图例方向。同一区域内的不同颜色像素可能沿不同方向滑动，大幅增加了推理复杂度。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 30
      - name: "墙壁上的标记像素作为源"
        description: "反转src/dst角色：移动对象不是区域内部的像素，而是墙壁上的标记像素。它们从墙壁出发向区域内部滑动（方向与当前相反）。解题者需要理解'从外向内'的运动模式。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "线段形源（1xN或Nx1）"
        description: "移动对象为短线段（2-3像素长的水平或垂直线），整条线段沿图例方向平移。线段的朝向与移动方向可能正交，在区域边界处产生部分碰撞（线段一端触墙但另一端未到），创造了更复杂的停止判定。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D6
    name: "区域边界形状"
    tag: obstacle
    current: "不规则闭合边界——1像素厚的彩色墙壁形成有台阶/凹槽的不规则封闭区域（填充率0.47-0.75），区域内部12-97格"
    alternatives:
      - name: "规则矩形区域"
        description: "墙壁围成严格的轴对齐矩形区域（无凹槽和台阶），简化了区域的几何形状。这降低了区域识别的难度，让解题者更专注于滑动方向和图例解读，但减少了空间推理的挑战。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "L形或T形区域"
        description: "墙壁围成非凸的L形或T形区域，区域内部有凹角。黄色像素在这种区域中滑动时可能被凹角卡住而非滑到远端墙壁，创造了更复杂的路径终点判断。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "嵌套区域（区域内有子区域）"
        description: "大区域内包含一个由不同颜色墙壁围成的子区域，子区域有自己的图例方向。黄色像素在子区域中按子区域图例方向滑动，在外层区域中按外层图例方向滑动。增加了层次化的空间推理。"
        source: concentric_frames
        source_task: 13e47133
        delta_lines: 35
      - name: "开放区域（墙壁有缺口）"
        description: "墙壁不完全封闭，有1-2格宽的缺口。黄色像素如果滑向缺口方向，会穿过缺口进入相邻区域或外部空间。解题者需要识别缺口位置并判断像素是否会'逃逸'。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D7
    name: "区域数量与墙壁颜色数"
    tag: obstacle
    current: "1-2种墙壁颜色，每种形成1-3个封闭区域，总计不超过4个区域；不同颜色墙壁可4-邻接形成迷宫结构"
    alternatives:
      - name: "单一墙壁颜色多区域"
        description: "所有墙壁使用同一颜色，但有多个独立的封闭区域（3-5个）。所有区域内的黄色像素沿同一方向滑动（因为只有一个图例）。这简化了颜色匹配推理但增加了区域识别的工作量。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "3-4种墙壁颜色"
        description: "增加墙壁颜色数到3-4种，对应3-4个图例，每种颜色可能指向不同方向。需要更大的网格（25x25）或更小的区域来容纳更多图例和区域。大幅增加了颜色-方向映射的推理量。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "共享墙壁（两个区域共用一面墙）"
        description: "强制两个不同颜色的区域共享一段墙壁——共享段的颜色交替出现两种颜色。解题者需要理解共享墙壁的归属判定规则（多数色），增加了边界分析的复杂度。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D8
    name: "黄色像素数量与分布"
    tag: src
    current: "每个区域1-2个黄色像素，总计2-6个；部分区域可能无黄色像素（空区域）"
    alternatives:
      - name: "每个区域恰好1个黄色像素（无堆叠）"
        description: "限制每个区域只有1个黄色像素，消除堆叠行为。这简化了物理模拟但仍保留方向推理，降低了难度适合作为基础变体。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "密集黄色像素（每区域3-5个）"
        description: "每个区域放置3-5个黄色像素，滑动后形成密集的堆叠墙。由于堆叠顺序依赖于处理序（从远到近），解题者需要精确追踪每个像素的滑动路径和最终位置。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "黄色像素初始位置紧贴墙壁（反向滑动）"
        description: "反转当前设计：输入中黄色像素紧贴远端墙壁（堆叠状态），输出中它们被'弹开'到反方向的位置。解题者需要理解方向取反的规则，从视觉上看是'分散'而非'聚集'。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D9
    name: "滑动方向类型"
    tag: path
    current: "支持基数方向（上下左右）和对角线方向（4个45度方向），共8个可能方向；基数方向用5x5图例，对角线用6x7图例"
    alternatives:
      - name: "仅基数方向（4方向）"
        description: "限制仅支持上下左右4个基数方向，移除对角线方向。简化了路径计算（无需考虑对角线的角切割限制），图例统一为5x5格式。降低了方向推理的复杂度。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "仅对角线方向（4方向）"
        description: "限制仅支持4个对角线方向，移除基数方向。所有滑动都是斜向的，需要处理角切割（diagonal步两侧的正交格子必须在区域内），增加了碰撞检测的几何难度。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "骑士步方向（L形移动）"
        description: "黄色像素按象棋骑士的L形步伐移动（每步走2行1列或1行2列），图例编码8种骑士步方向之一。路径不再是直线而是跳跃式移动，解题者需要理解非标准的运动模式。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "方向由区域形状决定（非图例编码）"
        description: "移除图例，滑动方向由区域自身形状属性决定——例如沿区域最长轴方向滑动，或从区域重心指向面积最小的角方向。解题者需要分析区域几何而非读取图例。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D10
    name: "堆叠行为"
    tag: path
    current: "多个黄色像素在同一区域内按从远到近的顺序处理，先到的像素停在墙壁旁，后到的堆叠在先到的后面"
    alternatives:
      - name: "无堆叠——所有像素独立滑到墙壁"
        description: "移除像素间的碰撞检测，所有黄色像素独立滑到各自方向上的远端墙壁。如果多个像素目标位置重叠，后到的覆盖先到的。这简化了物理模型但可能导致像素'丢失'。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "按颜色分组堆叠"
        description: "将移动像素扩展为多种颜色，同色像素互相堆叠（碰撞），异色像素可以穿过彼此。这引入了颜色分组的碰撞规则，解题者需要理解哪些像素会互相阻挡。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 20
      - name: "反向处理顺序（从近到远）"
        description: "堆叠处理顺序取反：先处理离墙壁最近的像素，再处理较远的。由于近端像素先占位，远端像素可能被更早地阻挡，产生不同的最终排布。解题者需要推断正确的处理顺序。"
        source: inversion
        source_task: null
        delta_lines: 5

  - id: D11
    name: "轨迹涂色（滑动路径可见性）"
    tag: trajectory
    current: "无轨迹——黄色像素从起点消失、在终点出现，中间路径不涂色"
    alternatives:
      - name: "连续轨迹涂色"
        description: "黄色像素滑动时在经过的每个格子留下彩色痕迹（如用浅黄色或其他颜色涂色），最终位置仍为黄色。输出中可以同时看到起点轨迹和终点位置。解题者需要理解哪些是轨迹、哪些是终点。"
        source: continuous_trail
        source_task: 142ca369
        delta_lines: 10
      - name: "起点标记保留"
        description: "黄色像素滑动后，原始起点位置被涂为特定颜色（如灰色）标记，终点为黄色。输出中可以看到每个像素的起始位置和终止位置，形成'运动前后对比'的视觉效果。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "间歇轨迹（每隔一格涂色）"
        description: "滑动路径上每隔一格涂一个标记色，形成虚线轨迹。解题者可以从轨迹推断移动方向和距离，同时轨迹的间歇模式增加了视觉复杂度。"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 12

  - id: D12
    name: "图例放置位置"
    tag: symbol_instructions
    current: "图例放置在网格四角之一（TL/TR/BL/BR），1-2个图例占据不同角落"
    alternatives:
      - name: "图例放置在网格边缘中部"
        description: "图例不在角落而在四条边的中间位置。这释放了角落空间用于放置区域，同时图例可能与区域墙壁更近，增加了辨别图例与区域边界的视觉挑战。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "图例嵌入区域内部"
        description: "图例不在网格边缘，而是放在某个区域的内部。该区域的黄色像素需要避开图例占据的空间。解题者需要先识别区域内哪部分是图例、哪部分是可通行空间。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "图例作为独立分隔面板"
        description: "网格被分隔线分为两部分：左侧为图例面板（包含所有图例），右侧为主区域。解题者需要理解面板结构并将图例信息应用到主区域。类似双面板布局的谜题。"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 20

  - id: D13
    name: "输出网格形状"
    tag: grid_shape
    current: "same——输出与输入尺寸相同，墙壁和图例不变，仅黄色像素位置改变"
    alternatives:
      - name: "裁剪到仅包含区域的范围"
        description: "输出仅保留包含所有区域和黄色像素的最小外接矩形，裁掉图例和空白边缘。解题者需要确定裁剪边界，增加了对输出尺寸的推理。"
