        source_task: null
        delta_lines: 15
      - name: "滑动距离编码为墙壁旁色块大小"
        description: "黄色像素滑动后消失，但在终止位置旁的墙壁上绘制一个与滑动距离等长的彩色标记线段。解题者需要计算滑动距离来确定标记长度，引入了计数与空间结合的推理。"
        source: counting
        source_task: 8f215267
        delta_lines: 20

  - id: D15
    name: "多步处理与操作顺序"
    tag: multi_step
    current: "单步处理——所有区域的黄色像素独立滑动一次即完成"
    alternatives:
      - name: "迭代滑动直到稳定"
        description: "每轮所有区域的黄色像素同时滑动一步（非滑到底），然后进入下一轮，重复直到所有像素不再移动。中间状态中某个像素的移动可能为另一个像素让出通道。解题者需要模拟多轮迭代。"
        source: multi_step
        source_task: 28a6681f
        delta_lines: 25
      - name: "两阶段处理：先水平后垂直"
        description: "第一阶段所有像素沿水平分量方向滑动，第二阶段沿垂直分量方向滑动。对角线方向被分解为两个正交步骤。解题者需要理解分解后的两步过程及中间状态。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "链式触发：先滑动后合并"
        description: "第一步黄色像素正常滑动。第二步检查是否有黄色像素与墙壁同色的标记像素相邻——如果是，则标记像素也被'激活'并沿同方向滑动。类似链式反应的传播机制。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 30
      - name: "按区域面积从小到大处理"
        description: "不同区域的黄色像素不是同时处理，而是按区域面积从小到大依次处理。先处理的区域的结果可能影响后续区域（如共享墙壁的结构变化）。解题者需要推断处理顺序。"
        source: multi_step
        source_task: 1ae2feb7
        delta_lines: 15

  - id: D16
    name: "对角线滑动的角切割规则"
    tag: path
    current: "禁止角切割——对角线移动时，两个正交中间格子都必须在区域内，否则无法通过"
    alternatives:
      - name: "允许角切割"
        description: "反转当前规则：对角线滑动时不检查正交中间格子，只要目标格在区域内就可以移动。这允许黄色像素从墙壁的角落'滑过'，使路径更自由，可能到达当前规则下无法到达的位置。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "单侧通行规则"
        description: "对角线移动时，只需一个正交中间格子在区域内即可通过（而非当前要求的两个都在）。这是当前规则和完全允许的中间方案，创造了更微妙的通行判断。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "宽度约束（需要2格宽通道）"
        description: "不仅对角线方向有限制，基数方向也要求通道至少2格宽才能通过。1格宽的窄通道会阻挡黄色像素，即使方向上有空间。这引入了通道宽度的空间推理。"
        source: width_constraint
        source_task: 332f06d7
        delta_lines: 15

  - id: D17
    name: "区域边界颜色判定方式"
    tag: obstacle
    current: "region_membership——区域边界颜色由相邻墙壁像素的多数颜色决定（border_counts取max）"
    alternatives:
      - name: "最近墙壁像素颜色决定"
