  - id: D14
    name: "滑动后变换效果"
    tag: transform
    current: "无额外变换——黄色像素仅移动位置，不改变颜色或产生其他效果"
    alternatives:
      - name: "滑动后变色为墙壁颜色"
        description: "黄色像素滑动到墙壁后变为该区域墙壁的颜色。输出中不再有黄色像素，取而代之的是与墙壁同色但在区域内部的像素。解题者需要通过位置变化（而非颜色）推断哪些是滑动后的像素。"
        source: recolor
        source_task: 271d71e2
        delta_lines: 5
      - name: "碰撞墙壁时墙壁局部擦除"
        description: "黄色像素撞到墙壁时，紧邻的1个墙壁像素被擦除为背景色。如果多个黄色像素撞到同一面墙，墙壁会出现多个缺口。这创造了'穿墙'的视觉效果。"
        source: erase
        source_task: 3dc255db
        delta_lines: 15
      - name: "黄色像素消失、墙壁标记碰撞点"
        description: "反转src/dst的视觉呈现：黄色像素在输出中消失，但它碰撞到的墙壁位置被涂为特殊颜色（如红色标记）。输出展示的是'碰撞发生在哪里'而非'像素去了哪里'。"
