        delta_lines: 15
      - name: "每个黄色像素独立判定最近墙壁颜色"
        description: "不是按区域统一判定方向，而是每个黄色像素独立查找其最近的墙壁像素颜色来确定自己的滑动方向。同一区域内不同位置的黄色像素可能沿不同方向滑动，大幅增加复杂度。"
        source: creative
