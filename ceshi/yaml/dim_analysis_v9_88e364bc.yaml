      - name: "黄色像素所在行/列的墙壁颜色决定"
        description: "方向不由区域整体的墙壁多数色决定，而由黄色像素所在行（水平移动时）或列（垂直移动时）上最近的墙壁颜色决定。这使方向判定更局部化。"
