task_id: 80a900e0
task_type: move_along_path
summary: "棋盘格背景上的菱形轮廓外侧有短对角线段（外边框），从每条外边框线段的两个端点沿垂直于线段的对角方向向外发射射线，用线段颜色涂色直到网格边界"

dimensions:
  - id: D1
    name: "射线方向类型"
    tag: path
    current: "对角线射线（diagonal_ray）：从外边框线段端点沿45度对角方向向外发射"
    alternatives:
      - name: "直线射线（水平/垂直方向）"
        description: "将射线方向从对角线改为水平或垂直方向（与菱形边最近的正交方向）。解题者需从对角坐标系切换到正交坐标系推理，且射线轨迹与棋盘格的交互模式完全不同，增加视觉辨别难度"
        source: straight_ray
        source_task: "221dfab4"
        delta_lines: 20
      - name: "反射射线（遇障碍物反弹）"
        description: "射线遇到其他菱形或外边框时不停止而是以镜像角度反射继续传播。类似 142ca369 的反射机制，解题者需追踪多次反弹的完整路径，推理难度大幅提升"
        source: reflection
        source_task: "142ca369"
        delta_lines: 40
      - name: "螺旋射线（到达边界后转向）"
        description: "射线到达网格边界后不停止，而是转90度继续沿新对角方向传播，形成螺旋状轨迹。类似 da515329 的螺旋路径，产生回旋式涂色模式，需要推断转向规则和终止条件"
        source: spiral_path
        source_task: "da515329"
        delta_lines: 35
      - name: "BFS 链式激活"
        description: "射线遇到其他菱形的外边框时不停止，而是激活被击中的菱形使其也开始发射射线，形成链式反应。类似 5961cc34 的链式激活机制，解题者需推断传播顺序和激活条件"
        source: chain_reaction
        source_task: "5961cc34"
        delta_lines: 45

  - id: D2
    name: "射线发射点"
    tag: path
    current: "从外边框线段的两个端点发射，每条线段恰好发射2条射线"
    alternatives:
      - name: "从线段每个像素发射"
        description: "反转'仅端点'策略：线段上每个像素都发射一条射线，3像素线段发射3条射线。产生更密集的涂色区域，视觉效果更饱满，解题者需识别发射源从端点扩展到全段"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "仅从距菱形最远的端点发射"
        description: "每条线段仅从离菱形中心最远的1个端点发射1条射线，而非2个端点各发1条。射线数量减半，解题者需推断端点选择规则（最远点优先），增加条件判断推理"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "从菱形顶点直接发射"
        description: "不使用外边框线段的端点，而是直接从菱形轮廓的4个顶点向外发射射线。外边框线段仅用于指示哪些顶点激活以及射线颜色，改变了源与发射的拓扑关系"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D3
    name: "射线终止条件"
    tag: dst
    current: "射线遇到非背景像素或网格边界时停止"
    alternatives:
      - name: "仅网格边界终止（穿透障碍物）"
        description: "反转'遇障碍物停止'规则：射线穿过所有非背景像素（保持原色不变），仅在网格边界终止。解题者需注意射线不被其他对象阻挡，跳过障碍物的涂色逻辑更复杂"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "固定长度终止（由线段长度编码）"
        description: "射线不延伸到网格边界，而是固定延伸 N 步（N = 外边框线段可见像素数 x 某倍数）。类似 271d71e2 的距离编码机制，解题者需先测量线段长度再推算射线长度"
        source: distance_encoding
        source_task: "271d71e2"
        delta_lines: 15
      - name: "遇到同色像素时停止"
        description: "射线不遇到任意非背景像素停止，而是仅在遇到与射线同色的像素时停止，遇到其他颜色则跳过继续前进。增加了颜色匹配判断，解题者需分辨哪些像素会真正阻挡射线"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "堆叠/累积（射线颜色覆盖被击中对象）"
        description: "射线不在遇到非背景像素时停止，而是将被击中像素重着色为射线颜色后继续前进。类似 3dc255db 的堆叠机制，产生颜色覆盖效应，解题者需推断覆盖优先级"
        source: stacking
        source_task: "3dc255db"
        delta_lines: 10

  - id: D4
    name: "轨迹涂色模式"
    tag: trajectory
    current: "连续涂色：射线路径上每个背景像素都涂上外边框颜色（每个都涂，无跳过）"
    alternatives:
      - name: "间歇跳格涂色（每隔一个像素涂色）"
        description: "射线路径上每隔一个像素涂色，产生虚线效果。原标注中提到'hollow pattern: every other pixel'，若当前 solver 为连续涂色则此变体增加空间节奏感，解题者需识别涂色间距"
        source: intermittent_skip
        source_task: null
        delta_lines: 5
      - name: "周期性多色模式"
        description: "射线路径上颜色按固定周期循环变化，例如使用菱形颜色与外边框颜色交替（A-B-A-B...）。类似 221dfab4 的周期模式，解题者需推断颜色循环规则及周期长度"
        source: periodic_pattern
        source_task: "221dfab4"
        delta_lines: 15
      - name: "渐变涂色（距离编码颜色）"
        description: "射线颜色不固定，而是按距离切换：前 N 格用外边框颜色，后续用菱形颜色。将距离信息编码到颜色中，解题者需发现颜色切换点与距离的关系"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "保留源像素的图案平铺"
        description: "不涂纯色，而是将外边框线段的像素模式周期性平铺到射线路径上。类似 53fb4810 的周期平铺机制，射线上重复出现线段的'印章'图案"
        source: periodic_tiling
        source_task: "53fb4810"
        delta_lines: 20

