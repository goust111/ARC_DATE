    current: "矩形可能有2-3个少数色像素（<=25%面积），直接保持原样参与堆叠"
    alternatives:
      - name: "去除少数色像素（统一为主色）"
        description: "反转当前规则：堆叠前将每个矩形的少数色像素替换为主色，输出全部是纯色矩形。简化输出但增加'颜色清洗'的推理需求"
