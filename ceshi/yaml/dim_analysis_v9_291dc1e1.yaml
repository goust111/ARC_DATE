        source: creative
        source_task: "7b3084d4"
        delta_lines: 30
      - name: "先按蓝线距离分组，组内按红线距离排序后水平拼接，再将各组垂直堆叠"
        description: "两层堆叠逻辑：同一band内的矩形先水平拼接成一行，然后各band的行垂直堆叠。产生网格状的输出布局，融合水平和垂直排列"
