        source_task: null
        delta_lines: 20

  - id: D9
    name: "边缘线的角色与识别"
    tag: src
    current: "蓝线(色1)和红线(色2)分别沿水平和垂直方向贯穿整行/列，在角落相交处有标记色(0)像素"
    alternatives:
      - name: "无标记像素——由线长度判断蓝/红"
        description: "移除角落标记像素，蓝线和红线直接在角落相交。解题者需通过线长度或其他属性判断哪条是蓝线。增加线识别的不确定性"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "十字交叉线（不在角落而在网格中部）"
        description: "蓝线和红线不在网格边缘而是穿过网格中部形成十字。矩形分布在四个象限中，距离计算变为到中部线的距离，排序逻辑相同但空间布局完全不同"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "三条边缘线（增加绿色线）"
        description: "增加第三条颜色线（如绿色），矩形到三条线的距离构成三维排序键。解题者需处理三重排序逻辑，大幅增加推理维度"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D10
    name: "堆叠顺序与多步处理"
