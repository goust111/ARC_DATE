task_id: 291dc1e1
task_type: move_in_order
summary: "将输入网格中分布于两条边缘线（蓝线和红线）附近的矩形，按到蓝线和红线的距离排序后依次堆叠输出；若蓝线为垂直方向则对每个矩形做90度逆时针旋转"

dimensions:
  - id: D1
    name: "排序主键——距离度量方式"
    tag: match_cond
    current: "按 (到蓝线的距离, 到红线的距离) 升序排序，距离为矩形边缘到边线的像素间隔"
    alternatives:
      - name: "按面积大小排序"
        description: "矩形按面积从小到大（或从大到小）排序后堆叠。解题者需要计算每个矩形的面积而非测量距离，将空间推理转变为计数推理，改变了核心推理模式"
        source: area_grouping
        source_task: "62593bfd"
        delta_lines: 10
      - name: "按矩形主色颜色值排序"
        description: "矩形按其主体颜色在一个固定色序（如色谱顺序：3,4,5,6,7,9）中的位置排列。解题者需从示例中推断色序映射规则，属于符号推理而非空间推理，但需注意人类看到的是颜色视觉而非数字，故色序需通过示例可推断"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "按矩形位置行列坐标直接排序"
        description: "不计算到边线的距离，而是直接按矩形左上角的 (行, 列) 坐标排序。类似 2ba387bc 的 position_ordering，简化了距离计算但保留了空间排序的核心"
        source: position_ordering
        source_task: "2ba387bc"
        delta_lines: 8
      - name: "距离降序排序（远→近）"
        description: "反转当前升序规则：距离蓝线最远的矩形排在最前面。解题者需要识别出排序方向的反转，容易与默认直觉冲突，增加推理难度"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "按矩形长边长度排序"
        description: "矩形按沿蓝线方向的长度（thick_dim）从短到长排序。解题者需要测量矩形尺寸而非位置距离，将空间定位推理变为尺寸比较推理"
        source: creative
        source_task: null
        delta_lines: 8

  - id: D2
    name: "排序消歧规则"
    tag: match_cond
    current: "主键为到蓝线距离，次键为到红线距离，再次键为沿蓝线方向坐标和沿红线方向坐标"
    alternatives:
      - name: "次键使用沿蓝线方向的坐标（忽略红线距离）"
        description: "去掉红线距离作为次键，直接用沿蓝线方向的位置消歧。简化了排序逻辑，但同一band内矩形的排列完全由其沿蓝线的偏移决定"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "次键为矩形面积"
        description: "主键仍为到蓝线距离，但次键改为矩形面积。同一band内的矩形按大小排列而非位置，融合了 area_grouping 机制与距离排序"
        source: area_grouping
        source_task: "62593bfd"
        delta_lines: 8
      - name: "次键反转（到红线距离降序）"
        description: "主键不变，次键从红线距离升序改为降序。同一band内的矩形排列顺序反转，解题者需从示例中精确推断升降序组合"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "次键为矩形主体颜色在色谱中的位置"
        description: "同一band内矩形按颜色排序。解题者需从多个示例中推断颜色排序的优先级，增加颜色语义推理层次"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D3
    name: "源对象形状与识别"
    tag: src
    current: "实心矩形（thin_dim=2, thick_dim 为偶数 2/4/6/8），分布在两条平行band中"
    alternatives:
      - name: "L形或T形精灵替代矩形"
        description: "源对象不是矩形而是 L 形或 T 形多连通块。堆叠时的对齐方式需要更复杂的外接矩形计算和中心对齐处理，增加空间推理复杂度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "空心矩形框架"
        description: "矩形内部有背景色空洞，形成空心框架。类似 4c416de3 的 hollow_frames，解题者需识别框架结构并在堆叠时保留空洞"
        source: hollow_frames
        source_task: "4c416de3"
        delta_lines: 15
      - name: "带颜色分组的矩形（同色矩形为一组）"
        description: "类似 b5ca7ac4 的 color_grouping，同颜色的矩形形成一组，每组内部先排序再整组堆叠。增加了分组识别和双层排序的推理需求"
        source: color_grouping
        source_task: "b5ca7ac4"
        delta_lines: 20
      - name: "单像素宽的线段替代矩形"
        description: "源对象从2像素宽的矩形变为1像素宽的彩色线段。视觉更简洁，但旋转后线段方向改变更显著，测试解题者对旋转的理解"
        source: creative
        source_task: null
        delta_lines: 8

  - id: D4
    name: "源对象的band分布结构"
    tag: src
    current: "矩形分布在两条平行band中（距蓝线1和4的位置），每band 2-5个矩形"
    alternatives:
      - name: "三条band分布"
        description: "增加第三条band（如距蓝线7的位置），需要扩展short_dim。解题者需识别三层排序结构，距离判断更精细"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "单band分布（所有矩形在同一行带）"
        description: "反转双band结构：所有矩形在同一band上，排序完全依赖红线距离。简化了距离计算层次但降低了变化性"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "不规则分布（无固定band）"
        description: "矩形散布在网格各处而非固定band位置。解题者需要逐个计算每个矩形到蓝线和红线的真实距离，不能依赖band作为捷径"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D5
    name: "条件旋转规则"
    tag: transform
    current: "若蓝线为垂直方向，所有矩形做90度逆时针旋转；蓝线水平时不旋转"
    alternatives:
      - name: "不旋转（无论蓝线方向如何）"
        description: "反转当前规则：移除条件旋转，矩形始终保持原始方向堆叠。简化变换逻辑但可能产生宽窄交替的堆叠结果"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "始终旋转90度（无论蓝线方向）"
        description: "反转条件：无论蓝线方向如何都旋转90度。蓝线水平时也旋转，使矩形从横向变为纵向堆叠，视觉效果完全不同"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "按band分组旋转——近蓝线的不旋转，远蓝线的旋转90度"
        description: "旋转条件不再由蓝线方向决定，而由矩形所在band决定。近band的矩形保持原样，远band的矩形旋转90度。解题者需推断距离与旋转的关联"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "旋转角度由矩形尺寸编码"
        description: "类似 6ffbe589 的 size_encoded_parameter，矩形的 thick_dim 决定旋转角度：2→0度, 4→90度, 6→180度, 8→270度。将尺寸信息映射为旋转参数，增加编码推理"
        source: size_encoded_parameter
        source_task: "6ffbe589"
        delta_lines: 15
      - name: "镜像翻转替代旋转"
        description: "蓝线垂直时不做旋转而做水平镜像翻转。类似 7ed72f31 的 reflection 变换。多色矩形中少数像素的位置会因翻转方式不同而产生不同结果，解题者需区分旋转与翻转"
        source: reflection
        source_task: "7ed72f31"
        delta_lines: 8

  - id: D6
    name: "堆叠方式与对齐"
    tag: dst
    current: "矩形从上到下紧密堆叠，水平方向居中对齐，无间隙"
    alternatives:
      - name: "左对齐堆叠"
        description: "矩形堆叠时左边缘对齐而非居中。视觉上产生左侧齐平的阶梯状输出，改变对齐推理但保持堆叠逻辑"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "右对齐堆叠"
        description: "矩形堆叠时右边缘对齐。与左对齐形成对偶变体，解题者需从示例推断是居中、左对齐还是右对齐"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "堆叠间留1像素间隙"
        description: "矩形之间插入1行背景色间隙。输出更松散，解题者需推断间隙规则，输出高度计算也需调整"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "水平排列（从左到右）替代垂直堆叠"
        description: "反转堆叠方向：矩形从左到右水平排列而非从上到下垂直堆叠，垂直方向居中。类似 b5ca7ac4 的水平堆叠模式，完全改变输出布局"
        source: creative
        source_task: "b5ca7ac4"
        delta_lines: 12
      - name: "重力堆叠到底部"
        description: "类似 62593bfd 的 gravity 机制，矩形按排序顺序从底部向上堆叠。反转上下方向，解题者需推断堆叠的起始端"
        source: gravity
        source_task: "62593bfd"
        delta_lines: 5

  - id: D7
    name: "输出网格尺寸与裁剪"
    tag: grid_shape
    current: "输出尺寸紧密适配：高度=所有旋转后矩形高度之和，宽度=最大旋转后矩形宽度"
