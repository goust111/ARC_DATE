      - name: "交替band堆叠"
        description: "类似 b5ca7ac4 的双向堆叠：近band矩形从上到下堆叠，远band矩形从下到上堆叠，两组在中间相遇。解题者需推断双向交替的规则"
        source: creative
        source_task: "b5ca7ac4"
        delta_lines: 20
      - name: "迭代合并——每次取距离最近的两个矩形合并"
