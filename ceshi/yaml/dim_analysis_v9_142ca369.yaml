        delta_lines: 20
      - name: "碰撞时产生环绕涂色"
        description: "射线反射时，不仅反射点变色，墙壁周围所有相邻的背景像素也被涂为射线当前颜色（surround效果）。这产生了围绕墙壁的彩色光晕，视觉上更丰富。"
        source: surround
        source_task: 71e489b6
        delta_lines: 15
      - name: "碰撞检测与射线覆盖"
        description: "当两条不同射线的轨迹在某个格子相交时，该格子被涂为特殊颜色（如两种颜色的混合映射结果），而非简单覆盖。这引入了射线间碰撞检测的逻辑。"
        source: collision_detection
        source_task: 409aa875
        delta_lines: 25

