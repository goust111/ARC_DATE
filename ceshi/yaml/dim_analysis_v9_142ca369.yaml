  - id: D13
    name: "墙壁与射线的空间关系"
    tag: obstacle
    current: "墙壁放置在射线对角线路径旁偏移1格处（侧面接触），不直接在射线路径上"
    alternatives:
      - name: "墙壁直接在射线路径上（正面阻挡）"
        description: "墙壁放置在射线的对角线路径上，射线正面撞击墙壁时反转两个方向分量（180度折返）。这比侧面接触更直观，但路径几何完全不同——射线会来回折返而非锯齿前进。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "墙壁距离可变（1-3格偏移）"
        description: "墙壁不一定偏移1格，而是可以偏移1-3格。反射只在射线经过特定格子时触发（需要射线与墙壁在某轴上对齐）。偏移距离不同导致反射触发时机不同，增加了空间判断难度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "墙壁有吸引/排斥场"
        description: "墙壁在2格范围内对射线产生引力偏转——射线经过墙壁附近时方向被轻微改变（如对角线变为向墙壁弯曲的曲线）。而非硬反射，这是一种'软'方向改变，创造曲线路径。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D14
    name: "网格尺寸范围"
    tag: grid_shape
    current: "18-20行 x 18-20列的较大网格"
    alternatives:
      - name: "小网格（8-12格）"
        description: "使用8-12行/列的小网格，箭头和墙壁数量相应减少（1-3个箭头，0-2面墙）。这让谜题在视觉上更紧凑，解题者可以更快理解规则，适合作为入门级难度变体。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "非正方形极端比例网格"
        description: "使用极端长宽比的网格（如30x10或10x30），射线在窄方向上快速反射多次而在宽方向上长距离移动。这创造了特殊的几何模式，解题者需要适应非正方形空间的推理。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "可变尺寸（按示例递增）"
        description: "训练示例使用递增的网格尺寸（如10x10、14x14、18x18），测试用例为更大的尺寸。解题者需要理解规则与网格大小无关，并能泛化到未见过的尺寸。"
        source: creative
        source_task: null
        delta_lines: 5

  - id: D15
    name: "墙壁功能分化"
    tag: obstacle
    current: "所有墙壁功能相同——都触发侧面反射并传递颜色"
    alternatives:
      - name: "反射墙与穿透墙"
        description: "引入两类墙壁：一类正常反射（如当前规则），另一类允许射线穿透但改变射线颜色。通过墙壁的像素数量（1像素 vs 3像素）或形状来区分类型。解题者需要识别墙壁类型并应用不同规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "加速墙与减速墙"
        description: "某些墙壁反射后射线步长变为2（跳一格涂色），另一些墙壁反射后恢复正常步长1。通过墙壁颜色区分功能。这在涂色模式上创造了有趣的变化。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "干扰墙壁（不触发反射的装饰物）"
        description: "网格中存在一些与功能墙壁颜色不同的装饰性像素，它们不触发反射——射线直接穿过或忽略它们。解题者需要区分功能性墙壁和干扰项，增加了信息筛选的难度。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D16
    name: "颜色使用策略"
    tag: meta
    current: "2-7种非背景色，箭头和墙壁各自单色，射线颜色随反射继承墙壁色"
    alternatives:
      - name: "箭头颜色编码反射规则"
        description: "不同颜色的箭头应用不同的反射规则——如红色箭头只做水平反射、蓝色箭头只做垂直反射。颜色不仅是视觉标识还是规则参数。解题者需要推断颜色到规则的映射。"
        source: symbol_instructions
        source_task: e87109e9
        delta_lines: 25
      - name: "颜色配对决定反射行为"
        description: "射线颜色和墙壁颜色的组合决定反射类型——同色组合导致穿透，异色组合导致正常反射。这引入了颜色对之间的逻辑关系，增加了推理层次。"
        source: color_pairing
        source_task: 16de56c4
        delta_lines: 20
      - name: "全局统一射线颜色"
        description: "所有射线统一使用一种特定颜色（如灰色），不随反射改变。箭头和墙壁保持各自颜色。这简化了颜色推理，让解题者更专注于路径几何。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D17
    name: "射线段长度约束"
    tag: meta
    current: "反射之间的射线段长度为2-16格（由网格空间自然决定）"
    alternatives:
      - name: "固定段长度"
        description: "每段射线在反射之间走固定步数（如恰好5步），无论墙壁位置如何。墙壁仅改变方向不影响步数。到达步数后如果没有墙壁也自动转向。这从几何约束变为计数约束。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "段长度由GCD/模运算决定"
        description: "射线段长度由网格中某种全局参数（如箭头像素的行号GCD）决定。这引入了数论推理——解题者需要计算数值关系来确定射线行为。"
        source: gcd_spacing
        source_task: 16de56c4
        delta_lines: 25
      - name: "段长度递增（斐波那契式）"
        description: "第一段长度为2，第二段为3，第三段为5，依次递增（斐波那契或等差数列）。解题者需要识别数列规律来预测后续段的长度。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D18
    name: "箭头方向编码方式"
    tag: src
    current: "L形缺角方向编码——2x2中缺失的角决定射线的对角线发射方向（远离缺角方向）"
    alternatives:
      - name: "箭头朝向由像素排列隐含"
        description: "使用3像素直线或阶梯形排列，射线方向由像素的空间排列推断（如从端点到端点的延长方向）。解题者需要识别像素排列中隐含的方向信息而非缺角。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "颜色编码方向"
        description: "箭头为固定形状（如2x2正方形），但其中一个像素为不同颜色，该像素的相对位置编码发射方向。解题者需要识别颜色差异来确定方向。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "网格边缘位置编码方向"
        description: "箭头始终放在网格边缘，射线方向由边缘位置自然确定（如左边缘的箭头向右上或右下发射）。这限制了箭头位置但使方向推断更直觉化。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D19
    name: "符号/图例编码"
    tag: symbol_instructions
    current: "无显式图例——规则完全从输入输出对中推断"
    alternatives:
      - name: "网格边缘放置图例"
        description: "在网格边缘放置一个小型图例区域，用颜色对或小形状来编码反射规则（如哪种颜色墙壁导致顺时针转向）。解题者需要先读取图例再应用规则。"
        source: symbol_instructions
        source_task: e87109e9
        delta_lines: 30
      - name: "墙壁形状编码反射类型"
        description: "1像素墙壁表示一种反射类型（如翻转行方向），3像素墙壁表示另一种（如翻转列方向）。墙壁的尺寸本身就是符号化的指令。解题者需要从示例中推断形状-功能的对应关系。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "颜色频率编码优先级"
        description: "当射线同时可被多面墙壁反射时（歧义情况），通过墙壁颜色在网格中出现的频率来决定优先级——频率更高的颜色优先。这引入了全局统计推理。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D20
    name: "射线与射线的交互"
    tag: multi_step
    current: "射线之间无交互——各自独立涂色，后处理的射线可以覆盖先前射线的轨迹"
    alternatives:
      - name: "射线碰撞产生45度偏转"
        description: "当两条射线轨迹在同一格子交叉时，两条射线都偏转45度。这引入了射线间的动态交互，路径变得难以预测且高度依赖射线发射顺序。"
        source: collision_detection
        source_task: e12f9a14
        delta_lines: 30
      - name: "射线合流：同色合并，异色阻断"
        description: "同色射线在交叉点合并为更粗的射线（涂色范围扩大到3像素宽），异色射线在交叉点互相阻断停止。颜色成为射线交互的关键参数。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "先到先得规则"
        description: "射线严格按顺序处理，已涂色的格子不会被后续射线覆盖——后续射线到达已涂色格子时视为碰撞并终止。处理顺序由箭头的空间位置（如从左上到右下）决定。"
        source: creative
        source_task: null
        delta_lines: 15
