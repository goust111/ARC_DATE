task_id: 142ca369
task_type: move_along_path
summary: "L形箭头沿对角线发射射线，遇到墙壁像素时发生侧面反射并继承墙壁颜色，射线持续延伸直至离开网格"

dimensions:
  - id: D1
    name: "射线路径方向"
    tag: path
    current: "对角线射线（diagonal_ray）——箭头沿45度对角线方向发射射线，每步同时移动一行一列"
    alternatives:
      - name: "直线射线（水平/垂直）"
        description: "箭头沿水平或垂直方向发射直线射线，而非对角线。反射时变为另一轴向的直线。这改变了解题者需要追踪的路径几何，从对角线思维转为正交思维，降低了视觉追踪难度但改变了反射逻辑。"
        source: straight_ray
        source_task: 221dfab4
        delta_lines: 25
      - name: "骑士步射线"
        description: "射线按国际象棋骑士的L形步伐移动（每步走2行1列或1行2列），而非标准对角线。反射规则类似但步长不同。这大幅增加了推理难度，因为路径不再是简单的45度直线，解题者需要理解非标准的移动模式。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "先直后弯路径"
        description: "射线从箭头出发先沿直线走，遇到墙壁后变为对角线方向（或反过来）。每次反射在直线和对角线模式之间切换。这创造了锯齿形但非对称的路径，增加了推理的层次性。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "螺旋路径"
        description: "射线从箭头出发后沿螺旋方向移动，每遇到边界或障碍物就顺时针/逆时针转90度。路径不再是反射而是转弯，创造了完全不同的空间推理要求。"
        source: spiral_path
        source_task: da515329
        delta_lines: 35

  - id: D2
    name: "反射机制"
    tag: path
    current: "侧面接触反射（side-touch reflection）——射线在前进方向的邻近轴上检测到墙壁时，翻转对应轴的方向分量；正面碰撞反转两个轴"
    alternatives:
      - name: "镜面反射（入射角等于反射角）"
        description: "墙壁具有明确的朝向（水平或垂直线段），射线按物理光学规则反射——入射角等于反射角。这比当前的侧面接触检测更直观但需要解题者理解墙壁的朝向，增加了几何推理的成分。"
        source: reflection
        source_task: null
        delta_lines: 25
      - name: "逆时针/顺时针转向反射"
        description: "遇到墙壁时射线不做镜面反射，而是根据墙壁颜色决定转向方向——某些颜色表示顺时针转90度，另一些表示逆时针转90度。解题者需要从示例中推断颜色与转向方向的对应关系。"
        source: turning_rules
        source_task: e87109e9
        delta_lines: 30
      - name: "穿透后偏转"
        description: "射线遇到墙壁时不立即反射，而是穿过墙壁后方向偏转45度（对角线变为水平/垂直，或反过来）。这创造了更难预测的路径，因为射线不会在墙壁处停留而是继续前进。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "分裂反射"
        description: "射线遇到墙壁时分裂为两条射线——一条反射、一条穿透。两条射线各自继续传播并可能再次分裂。这创造了指数增长的路径树，大幅增加了复杂度和视觉丰富度。"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D3
    name: "轨迹涂色模式"
    tag: trajectory
    current: "连续轨迹（continuous_trail）——射线经过的每个背景格子都被涂色，形成连续的彩色线条"
    alternatives:
      - name: "周期性图案轨迹"
        description: "射线轨迹按固定的颜色周期涂色，如AABB或ABAB交替模式，而非纯色连续线。解题者需要识别周期规律并预测正确的涂色模式。视觉上更丰富，推理上增加了模式识别的维度。"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 15
      - name: "间歇跳跃轨迹"
        description: "射线每隔一格涂色（跳跃前进），形成虚线状轨迹而非实线。可以是每隔1格、2格等不同间隔。这改变了视觉外观，且解题者需要注意射线仍在未涂色的格子上穿过（可能与其他对象交互）。"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 10
      - name: "渐变轨迹（段长递减/递增）"
        description: "每段射线的涂色长度按递增或递减规律变化——第一段涂3格，第二段涂2格，第三段涂1格，以此类推。或者涂色与留白交替的比例随段数变化。解题者需要发现长度变化的数学规律。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "仅在反射点周围涂色"
        description: "射线在自由飞行段不涂色（保持背景色），只在反射点前后各涂若干格。这让轨迹变成围绕墙壁的短标记段，视觉上完全不同，解题者需要理解射线的存在但只关注反射区域。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D4
    name: "反射时颜色继承规则"
    tag: trajectory
    current: "color_change_on_bounce——射线在每次反射时采用墙壁的颜色，反射点也被重新涂为墙壁颜色"
    alternatives:
      - name: "颜色混合规则"
        description: "反射时射线颜色不是直接采用墙壁颜色，而是按照某种映射规则混合——例如射线当前颜色和墙壁颜色在调色板中的'加法'结果。解题者需要从示例中推断颜色映射表。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "保持初始颜色不变"
        description: "射线始终保持箭头的初始颜色，不因反射而改变。墙壁颜色仅作为反射触发条件，不影响射线涂色。这简化了颜色推理，但增加了其他维度（如方向判断）的重要性。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "颜色循环列表"
        description: "射线在每次反射时按预定义的颜色循环切换——例如按照箭头附近的颜色提示序列依次使用。墙壁颜色不影响射线颜色，但解题者需要识别颜色循环的来源和顺序。"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 20
      - name: "射线颜色传递给墙壁"
        description: "反转当前的颜色继承方向：反射时墙壁被重新涂为射线的当前颜色，而射线保持不变。这创造了完全相反的视觉效果——墙壁在输出中变色而射线保持单色。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D5
    name: "射线源对象形状"
    tag: src
    current: "L形三角箭头——2x2外接矩形中缺少一个角的3像素L形，缺失角的方向决定射线发射的对角线方向"
    alternatives:
      - name: "单像素控制点+方向编码"
        description: "用网格边缘的单个彩色像素作为射线源，射线发射方向由像素在边缘的位置编码（如角落像素发射对角线，边缘中点像素发射垂直/水平线）。简化了源对象但增加了方向推断的抽象性。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 25
      - name: "Y形或十字形箭头"
        description: "用更大的形状（如Y形3x3或十字形5像素）作为射线源，通过形状的不对称性（如Y形的尾部方向）编码发射方向。更大的形状在视觉上更醒目，且方向编码更多样化。"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 20
      - name: "双像素对角线标记"
        description: "用两个对角线相邻的同色像素作为射线源，射线沿两像素连线的延长方向发射。这比L形更简洁，但方向编码同样明确，且在视觉上更容易与墙壁区分。"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 20
      - name: "箭头形状编码额外信息"
        description: "箭头仍为L形但增加为4像素或5像素的变体，额外像素的位置编码射线的附加属性（如最大反射次数、是否穿透等）。这让源对象承载更多信息，增加解题者需要提取的参数数量。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D6
    name: "射线终止条件"
    tag: dst
    current: "射线离开网格边界时终止（out of grid）"
    alternatives:
      - name: "到达目标像素时终止"
        description: "网格中放置特殊颜色的目标像素，射线到达目标时终止而非飞出网格。这增加了一个隐含约束——射线路径必须恰好经过目标点，解题者需要验证路径的正确性。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 15
      - name: "固定步数终止"
        description: "射线发射固定步数后终止，步数由箭头颜色或附近像素数量编码。这将终止条件从空间位置转为数值约束，解题者需要计数来确定射线长度。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 20
      - name: "遇到另一条射线轨迹终止"
        description: "多条射线按顺序发射，后发射的射线遇到先前射线的轨迹时终止。这引入了射线之间的顺序依赖关系，解题者需要推断发射顺序并考虑路径交互。"
        source: collision_detection
        source_task: e12f9a14
        delta_lines: 25
      - name: "反射次数耗尽时终止"
        description: "每个箭头编码了允许的最大反射次数（如通过箭头像素的某种属性），达到该次数后射线继续沿当前方向飞行直至离开网格。这限制了反射使用，增加了资源管理的推理。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D7
    name: "墙壁/障碍物形状"
    tag: obstacle
    current: "单像素或3像素轴对齐线段墙壁，放置在射线对角线路径旁偏移1格的位置"
    alternatives:
      - name: "L形或T形墙壁"
        description: "墙壁不再是简单的点或线段，而是L形或T形的小型结构。不同的边会导致不同的反射方向，解题者需要分析墙壁的具体形状来预测反射行为。这大幅增加了几何推理的复杂度。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "连续长墙壁（5+像素）"
        description: "墙壁为较长的轴对齐线段（5-10像素），可能同时影响多条射线或导致一条射线在同一面墙上多次反射。这改变了空间布局的复杂度，解题者需要考虑墙壁的覆盖范围。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "对角线方向的墙壁"
        description: "墙壁本身也沿对角线放置（而非轴对齐），反射规则变为类似光学镜面的45度反射。这在视觉上与射线方向一致，增加了识别墙壁与射线轨迹的区分难度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "移动墙壁（墙壁在反射后消失或移动）"
        description: "墙壁在被射线反射一次后消失（变为背景色），后续射线不再被该位置阻挡。或者墙壁在反射后向某个方向移动一格。这引入了状态变化，使得处理顺序变得关键。"
        source: erase
        source_task: 3dc255db
        delta_lines: 20

  - id: D8
    name: "多步处理与射线顺序"
    tag: multi_step
    current: "multi_bounce——每条射线独立地通过所有可达墙壁逐个反射，多条射线之间无顺序依赖"
    alternatives:
      - name: "射线按距离排序处理"
        description: "多条射线不是独立处理，而是按照箭头到某参考点（如网格中心）的距离排序依次发射。先发射的射线轨迹成为后续射线的障碍物，引入了处理顺序的推理需求。"
        source: multi_step
        source_task: 1ae2feb7
        delta_lines: 20
      - name: "链式反应传播"
        description: "只有一个初始箭头发射射线，但射线击中墙壁时，墙壁本身变为新的射线源，向新方向发射子射线。这创造了树状传播路径，解题者需要追踪整个连锁反应。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 35
      - name: "交替发射（回合制）"
        description: "多条射线交替前进——每条射线每回合只走一步，然后切换到下一条射线。当射线相遇时产生特殊交互（如碰撞停止或颜色混合）。这引入了时序推理和射线间的动态交互。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "两阶段处理：先射线后变换"
        description: "第一阶段：所有射线按当前规则发射并涂色。第二阶段：根据射线交叉点的颜色重叠关系，对交叉区域应用额外变换（如颜色混合或擦除）。这增加了后处理推理层。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D9
    name: "输出网格形状"
    tag: grid_shape
    current: "输出与输入尺寸相同（same size）——在原网格上叠加射线轨迹"
    alternatives:
      - name: "裁剪到射线覆盖区域"
        description: "输出仅保留包含所有射线轨迹的最小外接矩形区域，移除无射线的空白边缘。这要求解题者不仅理解射线逻辑，还需要确定正确的裁剪边界。"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 10
      - name: "仅输出射线轨迹（移除箭头和墙壁）"
        description: "输出网格仅保留射线绘制的轨迹像素，将箭头和墙壁也擦除为背景色。这测试解题者是否理解哪些像素是'新生成的'而非'原始存在的'。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "输入输出并排拼接"
        description: "输出为输入网格和结果网格的水平拼接，中间用分隔线隔开。解题者需要理解输出的双面板结构并正确填充右侧面板。"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 15

  - id: D10
    name: "反射后变换效果"
    tag: transform
    current: "反射点重新涂色为墙壁颜色（recolor），射线继承墙壁颜色"
    alternatives:
