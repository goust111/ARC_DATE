task_id: 269e22fb
task_type: symmetry/pattern
summary: "给定一个20x20二值图案某个二面体变体的双色矩形裁剪窗口，识别其旋转/翻转方向和偏移位置，输出完整的20x20图案并用裁剪窗口的两种颜色重绘"

dimensions:
  - id: D1
    name: "匹配条件：裁剪窗口唯一性匹配方式"
    tag: match_cond
    current: "通过穷举8个二面体变体x2种前景/背景极性x所有偏移位置，找到唯一匹配裁剪窗口的(变体, 偏移, 极性)组合"
    alternatives:
      - name: "多窗口联合匹配"
        description: "输入包含同一变体的两个不重叠的小裁剪窗口（可能尺寸更小），单个窗口可能有多个匹配，但两个窗口联合后唯一确定变体和偏移。解题者需要理解两个视口的空间关系并进行联合推理，增加了组合推理难度"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "带噪声的容错匹配"
        description: "裁剪窗口中有1-3个像素被翻转（前景变背景或反之），解题者需要找到与窗口汉明距离最小的匹配，而非精确匹配。这引入了近似匹配的推理，增加了搜索和容错判断"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "颜色编码极性提示"
        description: "输入中不直接显示双色裁剪，而是用三种颜色：第一种标记前景、第二种标记背景、第三种标记'未知'区域（窗口内部分像素被遮挡）。解题者需要根据已知像素匹配变体，再填充未知区域。这将匹配问题变为部分信息推理"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "边缘轮廓匹配代替全像素匹配"
        description: "输入不是完整裁剪窗口，而是只保留前景/背景的边缘轮廓像素（即仅显示颜色交界处的像素，内部统一为第三色）。解题者需要通过轮廓形状匹配图案变体。这将匹配从面匹配变为线匹配，推理方式截然不同"
        source: creative
        source_task: null
        delta_lines: 45

  - id: D2
    name: "源对象：裁剪窗口的形状"
    tag: src
    current: "矩形裁剪窗口，行数8-16，列数8-12，面积80-156"
    alternatives:
      - name: "L形裁剪窗口"
        description: "裁剪区域为两个矩形组成的L形，而非单个矩形。L形由两个重叠或相邻的矩形区域组成，展示图案的非矩形视口。解题者需要从L形视口推断完整图案，增加了空间推理的复杂度"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "条形裁剪窗口（极端纵横比）"
        description: "裁剪窗口为极端纵横比的长条形（如3x18或18x3），展示图案的一条窄带。这限制了可见信息的空间分布，使匹配更具挑战性——长条形提供的二维结构信息较少"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "多个不连通的小裁剪块"
        description: "输入包含2-3个分离的小矩形裁剪块（用背景色分隔），每个块展示图案不同位置的小窗口。解题者需要理解各块在完整图案中的相对位置关系，综合推断变体和偏移"
        source: creative
        source_task: null
        delta_lines: 55
      - name: "带遮挡的裁剪窗口"
        description: "矩形裁剪窗口中，部分像素被第三种颜色覆盖（形成遮挡区域），剩余像素仍保持原始双色。解题者需要忽略遮挡区域，仅用可见像素匹配图案。这结合了遮挡处理和图案匹配两种推理"
        source: boundary_detection
        source_task: 71e489b6
        delta_lines: 30

  - id: D3
    name: "目标输出：完整图案的展示方式"
    tag: dst
    current: "输出完整的20x20图案，前景/背景用输入的两种颜色绘制"
    alternatives:
      - name: "输出仅补全缺失部分"
        description: "输出网格仍为20x20，但裁剪窗口区域保留原色不变，仅填充窗口外的部分。这改变了输出的视觉结构——解题者需要理解'补全'而非'重绘'的语义，输出中可以清晰看到原始窗口和补全区域的边界"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "输出裁剪窗口的互补区域"
        description: "输出不是完整图案，而是图案中裁剪窗口之外的U形/框形区域（紧裁剪），即去掉已知部分后的剩余。解题者需要理解输入是已知部分、输出是未知部分的补集关系"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 30
      - name: "输出缩小的完整图案缩略图"
        description: "输出不是20x20完整图案，而是将完整图案缩小为10x10（每2x2块取多数色），解题者需要在匹配后进行下采样。这增加了输出变换步骤，且要求理解尺度变换规则"
        source: scaling
        source_task: b10624e5
        delta_lines: 35
      - name: "输出图案的特定象限"
        description: "输出仅为完整20x20图案四个10x10象限中的一个，具体象限由裁剪窗口位置决定（如窗口中心所在象限的对角象限）。解题者需要先匹配图案，再根据规则选择输出象限"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "变换：颜色重绘规则"
    tag: transform
    current: "用裁剪窗口中的前景色和背景色直接重绘完整图案（前景->color_a, 背景->color_b）"
    alternatives:
      - name: "前景/背景极性反转输出"
        description: "输出中前景色和背景色互换——即如果输入中color_a是前景、color_b是背景，输出中color_a变为背景、color_b变为前景。解题者需要发现这个隐含的极性反转规则，而非简单的颜色对应"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "使用第三色标记窗口位置"
        description: "输出为完整20x20图案，但裁剪窗口在原图案中的位置用第三种颜色（如红色）的前景色标记，其余部分用输入的两种颜色绘制。这要求解题者理解输出中三种颜色各自的含义"
        source: recolor
        source_task: 20270e3b
        delta_lines: 15
      - name: "颜色映射由裁剪窗口中前景密度决定"
        description: "如果裁剪窗口中前景色像素多于背景色像素，则输出正常绘制；如果背景色像素更多，则输出中前景/背景互换。解题者需要统计裁剪窗口中两种颜色的比例来决定输出配色"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "输出使用四色编码象限"
        description: "完整20x20图案被分为四个10x10象限，每个象限使用不同的颜色对（从4种颜色中分配）。输入裁剪窗口的两种颜色指示其所属象限，其余象限使用新颜色对。解题者需要推断颜色-象限对应关系"
        source: color_swap
        source_task: a25697e4
        delta_lines: 40

  - id: D5
    name: "图案结构：基础图案类型"
    tag: meta
    current: "硬编码的20x20固定二值图案，前景密度42.2%，8个二面体变体均不同且无互补关系"
    alternatives:
      - name: "程序化生成的对称二值图案"
        description: "不使用固定硬编码图案，而是使用具有特定对称性（如四重旋转对称C4）的程序化生成图案。图案通过在5x5象限中随机生成后旋转/镜像拼接成20x20。这使得二面体变体数减少（因自身对称性），匹配难度改变"
        source: symmetry_repair
        source_task: 8e5c0c38
        delta_lines: 50
      - name: "基于分形规则的二值图案"
        description: "图案不是随意的二值矩阵，而是通过分形规则生成（如迭代函数系统或元胞自动机），视觉上具有自相似结构。这使图案更有规律性，解题者可能在局部就能推测全局结构"
        source: fractal_tiling
        source_task: a32d8b75
        delta_lines: 45
      - name: "图案尺寸可变（非固定20x20）"
        description: "每个示例的基础图案尺寸不同（如15x15、20x20、25x25），图案尺寸从示例的输出中推断。解题者需要先确定图案尺寸，再进行匹配。这增加了一个需要推断的隐变量"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "多层叠加二值图案"
        description: "使用两个独立的20x20二值图案叠加：图案A和图案B的交集为颜色1、仅图案A为颜色2、仅图案B为颜色3、都不是为颜色4。裁剪窗口展示四色视图，解题者需要分别匹配两个图案的变体"
        source: creative
        source_task: null
        delta_lines: 60

  - id: D6
    name: "二面体群变体：变换集合"
    tag: meta
