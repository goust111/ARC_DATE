task_id: f560132c
task_type: move_to_match
summary: "将散落的单色精灵根据形状匹配拼装为矩形复合体，并按2x2彩色图例中对应位置的颜色重新着色，输出紧凑裁剪"

dimensions:
  - id: D1
    name: "匹配条件：形状匹配 vs 其他匹配逻辑"
    tag: match_cond
    current: "s.shape matches d.region.shape — 每个单色精灵的形状恰好对应复合矩形中某个象限区域的形状轮廓"
    alternatives:
      - name: "允许旋转/翻转后匹配"
        description: "精灵需旋转90/180/270度或翻转后才能与目标象限形状对齐。解题者不仅要识别哪个精灵属于哪个象限，还需推断正确的旋转/翻转方式，搜索空间从4种映射增加到4x8=32种可能组合，显著提升推理难度"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 35
      - name: "基于精灵面积大小排序匹配"
        description: "不再通过形状轮廓匹配，而是按精灵面积从大到小排序，依次对应图例中从左上、右上、左下、右下的位置。推理逻辑从几何匹配变为数值排序，解题者需比较面积并建立排序映射"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 30
      - name: "边缘轮廓互补匹配"
        description: "每个精灵的某条边缘轮廓必须与相邻精灵的边缘互补对齐（凸凹齿合），类似真正的拼图。不再要求精灵独立匹配象限形状，而是相邻精灵边缘必须完美拼合，测试解题者对局部边缘关系的推理"
        source: edge_matching
        source_task: 7b3084d4
        delta_lines: 40
      - name: "连接器颜色匹配"
        description: "图例的每个象限边缘带有一个独特颜色的连接像素，每个精灵也带有同色的连接像素标记。匹配条件从形状对应变为连接器颜色对应，解题者需先识别连接器再建立映射"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 30
      - name: "洞数计数匹配"
        description: "每个精灵内部有不同数量的洞（背景连通区域），图例各象限也编码了对应的洞数（如用内部像素数量表示）。精灵根据洞数与图例位置匹配，将几何匹配转化为计数推理"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 35

  - id: D2
    name: "源对象：散落精灵的类型与结构"
    tag: src
    current: "4个单色不规则精灵散布在网格中，每个精灵使用不同的单一颜色，形状各异但共同组装后恰好形成矩形"
    alternatives:
      - name: "精灵为中空框架而非实心"
        description: "每个精灵不再是实心区域而是空心框架（只有外轮廓），拼装后的矩形也是分区域的框架。视觉上更复杂，解题者需从框架轮廓推断形状归属，同时理解框架内部为背景色而非填充色"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 30
      - name: "精灵带锚点像素标记"
        description: "每个精灵内部有一个特殊颜色的锚点像素，图例对应象限也有同色锚点。匹配基于锚点颜色对应而非形状，精灵拼装时以锚点对齐为基准。引入了双层信息——形状用于拼装，锚点用于定位"
        source: anchor_points
        source_task: 4c416de3
        delta_lines: 25
      - name: "精灵为对角线标记对（非连通区域）"
        description: "源对象从连通区域变为两个对角线像素对，每对的颜色标识属于哪个象限，像素对围成的矩形区域即为该精灵的形状。解题者需先从像素对推断矩形区域，再进行拼装，增加了一层空间推理"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 40
      - name: "精灵间共享颜色（同色不同形）"
        description: "4个精灵中有两个使用相同颜色但形状不同，解题者不能仅靠颜色区分精灵，必须结合形状分析来建立与图例象限的对应关系。增加了视觉歧义和推理负担"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D3
    name: "目标结构：拼装目标的形状与组织"
    tag: dst
    current: "4个精灵拼装为一个矩形复合体，图例精灵的轮廓定义了该矩形的大小和各象限的分割方式"
    alternatives:
      - name: "拼装为非矩形轮廓"
        description: "目标不再是矩形而是L形、T形或十字形等非矩形复合轮廓，图例精灵的外形定义了这个不规则轮廓。解题者需推断非矩形目标的分区方式，空间推理难度显著增加"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "分层叠加而非平面拼合"
        description: "精灵不是平铺拼装而是部分重叠叠加，后放置的精灵覆盖先放置的精灵。输出中可见的颜色取决于叠放顺序，解题者需推断正确的叠放序列和遮挡关系"
        source: stacking
        source_task: 3dc255db
        delta_lines: 35
      - name: "拼装为3x3网格（9个象限）"
        description: "将2x2的四象限拼装扩展为3x3的九宫格拼装，图例变为3x3彩色模式，需要9个精灵。大幅增加匹配搜索空间和拼装复杂度"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "多个独立矩形分别拼装"
        description: "输入中有两个图例和两组精灵，需分别拼装为两个独立矩形。解题者需先识别分组关系再独立完成拼装，从单任务变为多任务并行处理"
        source: creative
        source_task: null
        delta_lines: 45

  - id: D4
    name: "变换：拼装后的颜色重映射规则"
    tag: transform
    current: "s.color = legend[s.position_in_composite].color — 每个精灵在拼装后被重新着色为图例中对应象限位置的颜色"
    alternatives:
      - name: "保留原色不重着色"
        description: "精灵拼装后保持各自原有颜色不变，图例仅用于确定位置映射而不改变颜色。输出的颜色信息直接来自输入精灵，简化了颜色变换但要求解题者意识到图例的角色变化"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "颜色交换：两两对角互换"
        description: "图例中对角位置（左上-右下、右上-左下）的颜色互换后作为重着色依据。解题者需发现交换规则而非直接读取图例颜色，增加了一层逻辑推理"
        source: color_swap
        source_task: a25697e4
        delta_lines: 20
      - name: "颜色混合：重叠区域取两色之一"
        description: "精灵重着色时，不是整个区域统一着色，而是精灵原始像素着一种颜色，拼装后新扩展的区域（填充空腔）着另一种颜色。输出中每个象限呈现双色效果，视觉更丰富"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "基于图例行列分别着色"
        description: "不使用图例的2x2位置，而是将图例的行颜色和列颜色分别解码——行颜色决定精灵的主色调，列颜色决定精灵的边缘色。每个象限变为双色（主体+边缘），推理逻辑从位置映射变为行列分解"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D5
    name: "符号指令：图例的编码方式与结构"
    tag: symbol_instructions
    current: "图例精灵包含2x2彩色像素嵌入在单色框架中，每个像素的位置（左上、右上、左下、右下）映射到复合体中对应象限的重着色颜色"
    alternatives:
      - name: "图例为线性色带而非2x2矩阵"
        description: "图例从2x2矩阵变为1x4水平或4x1垂直色带，按从左到右或从上到下的顺序依次对应左上、右上、左下、右下象限。解题者需推断线性到二维的展开映射规则"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "图例为嵌套框架编码"
        description: "图例不是2x2平面排列，而是嵌套的方框：最外层框色对应最大面积象限，内层框色对应较小象限，核心色对应最小象限。解题者需理解面积-层级的对应关系"
        source: nested_frames
        source_task: 45a5af55
        delta_lines: 35
      - name: "图例分散在网格边缘"
        description: "4个图例颜色不集中在一个精灵中，而是分散为4个独立的单色标记像素放置在网格四个边缘。每个标记的位置（上边、下边、左边、右边）暗示对应的象限。解题者需先从分散标记重建图例映射"
        source: marker_pixels
        source_task: 9aaea919
        delta_lines: 30
      - name: "图例颜色通过洞数编码位置"
        description: "图例中的4个颜色区域各自包含不同数量的洞（0-3个），洞数编码了该颜色在复合体中的象限位置。解题者需计数洞数并建立位置映射，增加了数值推理环节"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 35

