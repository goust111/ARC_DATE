  - id: D7
    name: "多步处理：拼装的步骤与顺序"
    tag: multi_step
    current: "Step 1: 识别图例精灵（含2x2多色模式）; Step 2: 识别其他单色精灵; Step 3: 按形状匹配拼装为矩形复合体; Step 4: 按图例位置映射重着色"
    alternatives:
      - name: "迭代拼装：每次只拼入一个精灵"
        description: "精灵不是一次性拼装，而是按面积从大到小逐个拼入。每拼入一个精灵后形成中间结果，下一个精灵基于当前部分组装体的空腔来定位。解题者需追踪逐步构建过程"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "先拼装再查找图例"
        description: "颠倒步骤顺序——先根据形状匹配将精灵拼装为矩形（此时不知颜色映射），拼装完成后在其中寻找隐藏的图例模式来确定重着色规则。增加了推理的非线性"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "两轮处理：先粗拼再精调"
        description: "第一轮：将精灵粗略放置到近似位置（允许1-2像素偏移）; 第二轮：根据边缘对齐约束微调到精确位置。模拟真实拼图的粗-精两阶段过程"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "图例指示拼装顺序"
        description: "图例中2x2像素的读取顺序（如按行从左到右、从上到下）决定精灵的拼装顺序，后拼装的精灵覆盖先拼装的精灵在重叠区域的颜色。顺序影响最终颜色输出"
        source: creative
        source_task: null
        delta_lines: 25

