task_id: cbebaa4b
task_type: move_to_match
summary: "散布的彩色精灵通过红色连接器像素与中央黄色方块对齐连接，逐步拼装成完整的连通结构"

dimensions:
  - id: D1
    name: "连接器匹配条件"
    tag: match_cond
    current: "精灵的红色像素与目标（中央黄色方块或已连接精灵）的红色像素对齐，形成连接"
    alternatives:
      - name: "形状轮廓匹配（凹凸互补）"
        description: "取消红色连接器机制，改为精灵边缘带有凸出和凹入的锯齿轮廓，匹配条件变为凸出部分恰好嵌入相邻精灵的凹入部分。将推理从颜色对齐转向几何互补，视觉上更直观但空间推理更复杂"
        source: shape_match
        source_task: 16b78196
        delta_lines: 55
      - name: "边缘颜色序列匹配"
        description: "精灵接触边上所有像素的颜色序列必须与目标接触边的颜色序列完全一致（不只是红色像素位置）。解题者需要逐像素比对整条边的颜色，增加了精确匹配的推理负担"
        source: edge_match
        source_task: 78332cb0
        delta_lines: 35
      - name: "旋转/翻转后连接器匹配"
        description: "精灵可以旋转90/180/270度或翻转后再对齐红色连接器。解题者不仅需要找到正确的位置，还需要推断每个精灵的正确朝向，搜索空间扩大数倍"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 40
      - name: "多色连接器匹配"
        description: "连接器不再统一为红色，而是使用多种颜色（如红、蓝、绿），同色连接器才能对齐连接。解题者需要同时跟踪多种颜色的匹配关系，增加了分类推理的复杂度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "连接器互补色匹配"
        description: "连接条件改为连接器颜色互补而非相同——例如红色连接器必须与蓝色连接器对齐。解题者需要从示例中推断颜色配对规则（哪种色连哪种色），增加了规则发现的难度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "连接器数量匹配"
        description: "精灵的某条边上红色像素的数量必须与目标对应边上红色像素的数量相等才能连接。不要求逐像素对齐，只要求数量一致，改变了匹配从位置精确到数量统计的推理方式"
        source: count_match
        source_task: 6e4f6532
        delta_lines: 30

  - id: D2
    name: "源对象的结构与属性"
    tag: src
    current: "散布在背景上的彩色精灵，每个精灵包含主体颜色像素和红色连接器像素，形状不规则"
    alternatives:
      - name: "精灵为规则矩形带连接器突出"
        description: "精灵主体统一为矩形（如3x2、4x3），红色连接器作为额外像素突出在矩形边缘。规则化的主体使空间推理更可预测，但连接器位置的变化仍保持挑战性。视觉上更整齐"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "精灵含多种功能像素（连接器+方向指示）"
        description: "除红色连接器外，精灵还包含另一种颜色（如绿色）的方向指示像素，表示该精灵应从哪个方向接近目标。解题者需要同时解读两种功能像素，增加了信息解码层次"
        source: marker_axis
        source_task: 7ed72f31
        delta_lines: 35
      - name: "精灵分为两类（主精灵和辅助精灵）"
        description: "精灵按颜色分为两类：主精灵直接连接到锚点，辅助精灵只能连接到主精灵上。形成两级组装层次，解题者需要先识别分类再按层级顺序组装"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 30
      - name: "精灵带有洞（内部空缺）"
        description: "某些精灵内部含有背景色的空缺区域，组装后这些洞需要被相邻精灵的凸出部分填充。引入负空间匹配概念，类似真实拼图的嵌合关系"
        source: cavity_fill
        source_task: 5dbc8537
        delta_lines: 40

  - id: D3
    name: "目标锚点的结构"
    tag: dst
    current: "中央黄色方块作为初始锚点，已连接的精灵作为后续连接的扩展锚点"
    alternatives:
      - name: "多个独立锚点"
        description: "网格上有2-3个黄色方块作为独立锚点，精灵需要分组后分别连接到各自的锚点，形成多个独立的连通结构。解题者需要推断哪些精灵属于哪个锚点，增加了分组推理"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "无固定锚点——从精灵中推断起始点"
        description: "去掉中央黄色方块，所有精灵地位平等。起始精灵由某种属性决定（如面积最大的精灵或连接器最多的精灵），其余精灵逐步连接到它。解题者需要先发现选择起始点的规则"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "锚点为线段而非方块"
        description: "中央锚点从方块变为水平或垂直的线段（如1x5黄色条），精灵沿线段的两侧连接。线段形状改变了组装的拓扑结构——从中心辐射变为沿轴线展开"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "锚点为十字形或L形"
        description: "锚点不是实心方块而是十字形或L形结构，精灵需要连接到锚点的各个分支末端。非凸形锚点增加了连接方向的多样性和空间推理的复杂度"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "连接后的变换操作"
    tag: transform
    current: "纯平移连接，连接器像素保留红色，不做任何后处理变换"
    alternatives:
      - name: "连接后红色连接器重新上色为主体色"
        description: "精灵连接完成后，所有红色连接器像素被重新上色为相邻主体像素的颜色，使最终输出中不再有红色。解题者需要推断重上色规则，视觉上输出更'干净'"
        source: recolor
        source_task: 20270e3b
        delta_lines: 15
      - name: "连接后擦除锚点方块"
        description: "组装完成后，中央黄色方块被擦除为背景色，只保留由精灵组成的环形结构。解题者需要意识到锚点仅作为组装辅助，最终输出不包含它"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 10
      - name: "连接后按连接顺序渐变上色"
        description: "组装完成后，各精灵根据其连接到锚点的步骤顺序重新上色为渐变色（如第1步连接的精灵最深，最后连接的最浅）。输出中颜色编码了组装历史，增加了时序推理"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "连接后合并重叠区域颜色"
        description: "当两个精灵的连接器像素重叠在同一位置时，该位置颜色变为两个精灵主体颜色的混合色（预定义混合规则）。解题者需要推断颜色混合逻辑"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D5
    name: "轨迹/源精灵去留"
    tag: trajectory
    current: "精灵移动后从原位消失，输出中只有组装后的连通结构和背景"
    alternatives:
      - name: "保留源精灵在原位"
        description: "精灵在原位保留不变，同时在锚点处放置组装好的结构。输出同时显示散布状态和组装结果，解题者需要理解这是'复制并组装'而非'移动并组装'的模式"
        source: keep_source
        source_task: 3e6067c3
        delta_lines: 8
      - name: "精灵沿移动路径留下轨迹线"
        description: "每个精灵从原位到目标位的移动路径上留下单色轨迹线（使用该精灵的主体色）。视觉上可以看到精灵的移动方向，形成从散布位置到组装中心的辐射状线条"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 30
      - name: "原位留下精灵轮廓（空心框）"
        description: "精灵离开后，在原位用灰色绘制其外接矩形的空心边框，标记精灵曾经的位置。视觉上帮助验证所有碎片已被使用，增加输出信息密度"
        source: creative
        source_task: null
        delta_lines: 15

