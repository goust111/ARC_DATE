  - id: D7
    name: "多步迭代组装策略"
    tag: multi_step
    current: "步骤1:识别中央黄色方块为锚点；步骤2:找到红色像素可与锚点红色像素对齐的精灵；步骤3:连接精灵；步骤4:重复直到所有精灵连接完成"
    alternatives:
      - name: "由外向内组装（最远的精灵先连接）"
        description: "组装顺序反转——离锚点最远的精灵先移动到位，较近的后连接，最终合拢。解题者需要推断距离排序规则，空间推理方向从'扩展'变为'收缩'"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "按精灵颜色分组批量连接"
        description: "同色精灵作为一批同时连接，不同颜色组按特定顺序（如颜色值从小到大）依次批量处理。解题者需要推断分组规则和批次顺序，增加了分类推理"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "链式传递组装（精灵接力连接）"
        description: "第一个精灵连接到锚点后，第二个精灵只能连接到第一个精灵（不能连锚点），第三个只能连第二个——形成链式结构而非辐射结构。改变了拓扑推理从星形到线形"
        source: chaining
        source_task: 78332cb0
        delta_lines: 25
      - name: "双向同步组装"
        description: "锚点两侧同时各有一条组装链在延伸，每步两侧各连接一个精灵。解题者需要同时跟踪两条组装路径的匹配关系，增加了并行推理的负担"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "回溯验证——连接后检查全局约束"
        description: "每连接一个精灵后检查当前结构是否满足全局约束（如对称性、连通性），不满足则撤回该步。解题者需要在局部连接正确的前提下考虑全局一致性"
        source: creative
        source_task: null
        delta_lines: 30

