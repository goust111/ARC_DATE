  - id: D13
    name: "步数计算的数学关系"
    tag: meta
    current: "steps = min(head_dest_distance, grey_count)，其中 head_dest_distance = gap + 1"
    alternatives:
      - name: "steps = max(distance, grey_count)"
        description: "取最大值而非最小值。容器可能移动到超过目标线的位置（如果灰色数更大），或者即使灰色不够也强制移动到目标线。取反当前的min操作"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "steps = grey_count - distance（差值）"
        description: "步数等于灰色数与距离的差（取正值）。若灰色数小于距离则不移动。解题者需计算差值，推理难度增加"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "steps = distance mod grey_count（取模）"
        description: "步数为距离对灰色数取模的结果。产生周期性的移动距离，小灰色数的容器移动距离更不可预测。解题者需发现取模关系"
        source: modular_indexing
        source_task: "16de56c4"
        delta_lines: 10
      - name: "steps = grey_count / inner_width（整除）"
        description: "步数等于灰色像素数除以内部宽度（向下取整），即'满行数'。只有完整的灰色行/列才计入步数。解题者需理解行数而非像素数决定移动"
        source: creative
        source_task: null
        delta_lines: 15

