        source: creative
        source_task: null
        delta_lines: 8
      - name: "随机但可推断的顺序（按距离排序）"
        description: "灰色像素按到某个参考点（如目标线中点）的曼哈顿距离排序来决定着色顺序。不再是简单的行列顺序，解题者需推断距离排序规则"
        source: sorting_by_distance
        source_task: "dd6b8c4b"
        delta_lines: 15
      - name: "螺旋顺序填充"
        description: "灰色像素按照顺时针螺旋顺序从外圈向内圈变为橙色。视觉上形成螺旋形的橙色区域，解题者需识别螺旋模式"
