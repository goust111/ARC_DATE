task_id: 271d71e2
task_type: move_along_path
summary: "黑色边框容器沿头部方向朝同色目标线平移，步数 = min(头到目标距离, 灰色像素数)，灰色像素按从头侧向内的顺序逐个变橙色"

dimensions:
  - id: D1
    name: "路径方向类型"
    tag: path
    current: "straight_ray — 容器沿头部指示的四个基本方向（上/下/左/右）直线平移"
    alternatives:
      - name: "对角线移动"
        description: "容器沿45度对角线方向移动到目标线。头部放在容器的角落位置，目标线也沿对角线放置。解题者需要识别对角线方向并计算斜向距离，推理难度显著增加"
        source: diagonal_ray
        source_task: "142ca369"
        delta_lines: 40
      - name: "L形两段路径"
        description: "容器先沿水平方向移动到中间转折点，再沿垂直方向移动到目标线（或反之）。需要两条目标线分别指示两段路径，灰色像素分配给两段总距离。解题者需推断两段路径的先后顺序和距离分配"
        source: turning_rules
        source_task: "e87109e9"
        delta_lines: 50
      - name: "方向由内部图案决定"
        description: "不再通过头部位置确定方向，而是通过容器内部橙色区域的形状（如箭头形状或L形）暗示移动方向。解题者需要从内部图案中解读方向信息，增加了模式识别的维度"
        source: direction_from_shape
        source_task: "3dc255db"
        delta_lines: 35
      - name: "沿预设路径像素移动"
        description: "网格中有一条由特定颜色像素铺设的路径连接容器和目标，容器沿该路径滑动而非直线移动。路径可以是弯曲的，步数仍受灰色像素数限制。解题者需先识别路径再推断移动规则"
        source: path_following
        source_task: "7b0280bc"
        delta_lines: 45

  - id: D2
    name: "移动距离编码方式"
    tag: dst
    current: "distance_encoding — 步数 = min(头到目标距离, 灰色像素数)，两个约束取较小值"
    alternatives:
      - name: "纯距离驱动（忽略灰色数量）"
        description: "容器始终移动到目标线位置，不受灰色像素数量限制。所有灰色像素都变成橙色，剩余距离不再着色。这简化了规则但仍需识别头-目标关系。取反当前的min约束"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "纯灰色数量驱动"
        description: "容器移动距离恰好等于灰色像素数，不受目标线距离限制。目标线仅指示方向，不限制距离。容器可能越过目标线或停在目标线之前。取反当前的距离约束"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "碰撞停止"
        description: "容器向目标方向移动直到碰到目标线或另一个容器（而非按固定步数）。灰色像素逐步变橙但不决定步数。解题者需推断碰撞检测规则"
        source: collision_stop
        source_task: "195c6913"
        delta_lines: 25
      - name: "内部橙色像素数决定距离"
        description: "步数 = 已有的橙色像素数（而非灰色像素数）。取反了灰色/橙色的角色——橙色越多移动越远。同时灰色像素变橙的规则不变，这创造了一个有趣的'燃料已用量=推进力'悖论"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D3
    name: "轨迹着色模式"
    tag: trajectory
    current: "recolor — 灰色像素从头侧向内逐个变为橙色(7)，连续着色"
    alternatives:
      - name: "间隔着色"
        description: "灰色像素每隔一个变为橙色，形成灰橙交替的棋盘格或条纹图案。步数仍为min(距离,灰色数)，但只有奇数位置的灰色变橙。解题者需发现间隔规律"
        source: periodic_pattern
        source_task: "221dfab4"
        delta_lines: 15
      - name: "颜色渐变循环"
        description: "灰色像素变色时不全变橙色，而是按循环顺序使用多种颜色（如红-黄-橙-红-黄-橙...）。不同步骤使用不同颜色。解题者需从训练样例中推断颜色循环顺序"
        source: color_cycle
        source_task: "195c6913"
        delta_lines: 20
      - name: "从远侧向头侧着色（反向填充）"
        description: "灰色像素从远离头部的一侧开始变橙，而非从头侧开始。取反了当前的填充方向。视觉上橙色区域从容器深处向头部生长，而非从头部向内渗透"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "着色后灰色消失（擦除）"
        description: "变色的像素不是变为橙色，而是变为背景色（消失）。容器内部逐步缩小，视觉效果像'燃烧'。解题者需注意消失的像素数等于移动距离"
        source: erase
        source_task: "3dc255db"
        delta_lines: 8

  - id: D4
    name: "源对象结构"
    tag: src
    current: "黑色边框矩形容器，内部为灰色/橙色填充，附带同色头部线段指示方向"
    alternatives:
      - name: "无边框容器"
        description: "取消黑色边框，容器仅由灰色和橙色像素区域本身构成。解题者需要从灰/橙色块的分布中推断容器范围和移动方向，增加了对象识别的难度"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "多层嵌套容器"
        description: "容器有两层边框（外层黑色、内层另一颜色），内部仍为灰/橙。外层边框随容器移动，但内层边框颜色指示特定行为（如内层颜色匹配目标线颜色时才移动）。增加颜色匹配的推理层"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "头部为箭头形状而非线段"
        description: "头部不再是一条直线，而是一个箭头形精灵（如三角形），箭头方向指示移动方向。解题者需从箭头形状推断方向而非从头部相对位置推断。视觉上更直观但增加了形状解析"
        source: direction_from_shape
        source_task: "3dc255db"
        delta_lines: 30
      - name: "容器内有多种非灰色填充"
        description: "容器内部除灰色外还有第三种颜色（如蓝色），蓝色像素既不计入步数也不变色，作为'障碍'占据空间。灰色像素数更少，实际可移动距离被压缩。解题者需区分三种内部像素的角色"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D5
    name: "灰色像素着色顺序"
    tag: multi_step
    current: "ordered_processing — 灰色像素按从头侧向内的行/列顺序逐个变为橙色"
    alternatives:
      - name: "从中心向外扩散"
        description: "灰色像素从容器内部中心开始变橙，向四周扩散（类似BFS洪填充）。步数规则不变，但变色顺序改为从核心向外。解题者需推断扩散的起点和顺序"
        source: creative
