task_id: 581f7754
task_type: move_to_match
summary: "将内部多色精灵沿特定轴滑动，使其标记像素（少数色）与边界上颜色相同的孤立锚点像素对齐；锚点位于上/下边→水平滑动对齐列，锚点位于左/右边→垂直滑动对齐行；超出边界的像素被裁剪"

dimensions:
  - id: D1
    name: "匹配条件：标记色与锚点色匹配"
    tag: match_cond
    current: "精灵内部的少数色（marker）与边界锚点颜色相同即配对：s.marker.color == d.color"
    alternatives:
      - name: "形状匹配替代颜色匹配"
        description: "锚点不再是单像素而是小型2-3像素形状（如L形、I形），精灵内部也包含相同形状的标记区域。配对条件为标记子区域的形状与锚点形状一致。解题者需从几何形状而非颜色推断配对关系，推理从颜色识别转变为形状比较。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 35
      - name: "体色与边框颜色匹配"
        description: "锚点不再与标记色匹配，而是与精灵的主体色（多数色）匹配。配对条件变为s.body.color == d.color。解题者需要从最初关注少数像素转为关注多数像素来确定配对，颠覆了'少数即关键'的直觉。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "连接器颜色+方向匹配"
        description: "精灵有一个特殊颜色的连接像素（类似原marker），锚点处也有一个同色像素加上一个相邻方向像素指示滑动方向。配对条件为连接器颜色相同且方向一致。增加了方向推理维度。"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 30
      - name: "面积排序匹配"
        description: "精灵按总面积排序，锚点按在边界上的位置排序（如顺时针），第k大精灵匹配第k个锚点。不依赖颜色匹配，而是通过序数关系建立对应。解题者需同时排序两组对象并建立序数映射。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 25

  - id: D2
    name: "匹配条件：滑动轴决定规则"
    tag: match_cond
    current: "锚点在上/下边缘（非角落）→水平滑动对齐列；锚点在左/右边缘（或角落）→垂直滑动对齐行"
    alternatives:
      - name: "轴规则取反"
        description: "规则反转：上/下边缘锚点→垂直滑动对齐行，左/右边缘锚点→水平滑动对齐列。精灵不再沿锚点所在边的平行方向滑动，而是垂直于该边滑动。解题者需要发现这种反直觉的轴关系。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "标记位置决定轴"
        description: "不由锚点位置决定滑动轴，而由标记像素在精灵体内的相对位置决定：标记在精灵上/下边缘→垂直滑动，标记在精灵左/右边缘→水平滑动。解题者需同时分析精灵内部结构和锚点位置。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "颜色编码决定轴"
        description: "锚点颜色本身编码了滑动方向：暖色系（红、橙、黄）→水平滑动，冷色系（蓝、绿、紫）→垂直滑动，而不依赖锚点在哪条边上。解题者需识别颜色到方向的映射规律。注意这在可视化图像上体现为颜色差异，人类可直观区分暖冷色系。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "双轴对齐（对角滑动）"
        description: "精灵同时在行和列两个方向滑动，使标记像素的行和列都与锚点完全对齐（即标记最终位于锚点正旁边的内部位置）。这是当前单轴滑动的推广，解题者需理解双轴对齐的概念。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D3
    name: "源对象：精灵结构"
    tag: src
    current: "多色精灵（8-连通分量），包含1个主体色（4-13像素）和1个标记色（1像素，最少数色），标记与主体4-相邻"
    alternatives:
      - name: "多标记像素精灵"
        description: "每个精灵包含2-3个标记像素（仍为少数色），所有标记像素在同一行或同一列。对齐时以标记像素的质心或中位数位置与锚点对齐。解题者需识别多个标记并计算有效对齐点。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "三色精灵（双标记）"
        description: "精灵包含3种颜色：主体色、标记色A和标记色B。标记色A用于匹配锚点确定配对，标记色B的位置决定对齐点。解题者需区分两种标记各自的功能角色。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "空心精灵（背景色洞）"
        description: "精灵主体为空心结构（环形/框形），标记像素位于空心内部。当前spec中body已可能含空心，但此变体强制所有精灵为空心且标记严格在洞内。解题者需要识别封闭的内部结构来找到标记。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "对角标记（8-相邻但非4-相邻）"
        description: "标记像素仅与主体8-相邻（对角接触）而非4-相邻。精灵仍为8-连通整体，但标记与主体之间存在微妙的对角连接。解题者需注意4-连通与8-连通的区别来正确识别标记归属。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D4
    name: "目标位置：锚点类型与位置"
    tag: dst
    current: "边界上的孤立单像素（非角落），4-邻域均为背景色，1-3个不同颜色锚点"
    alternatives:
      - name: "角落锚点"
        description: "锚点可以放在网格角落位置。当前规则排除角落（角落默认使用垂直轴）。变体允许角落锚点，并为角落定义特殊规则（如取精灵距角落最近的方向作为滑动轴）。增加了边界条件推理。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "内部锚点（十字线交叉点）"
        description: "锚点不在边界而在网格内部，以一条穿过整行/列的彩色线标记（类似十字准星）。精灵沿该线滑动，使标记像素与锚点对齐在线上。解题者需识别长线作为轨道参考。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "成对锚点（同色双锚点）"
        description: "每种颜色有两个锚点分别在对边（如上下边各一个），精灵需滑向距离更近的那个锚点。当前spec中已允许双锚点出现在test中，此变体将其系统化。解题者需比较距离做出选择。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "锚点为短线段而非单像素"
        description: "锚点是边界上的2-3像素水平或垂直线段（同色），精灵需将标记对齐到线段的中点位置。线段方向还暗示了滑动轴（线段平行于边→正常轴规则）。解题者需从线段推断中点和方向。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D5
    name: "变换：裁剪规则"
    tag: transform
    current: "滑动后超出网格边界的像素直接丢弃（裁剪）；目标位置的背景像素被覆盖，非背景像素不被覆盖"
    alternatives:
      - name: "环绕而非裁剪"
        description: "超出边界的像素不被丢弃，而是环绕到网格对侧出现（toroidal wrapping）。精灵滑出右边界后从左边界重新进入。解题者需理解环面拓扑的概念，增加空间推理复杂度。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "碰撞停止"
        description: "精灵滑动过程中若遇到非背景像素则立即停止（不到达锚点列/行位置）。解题者需判断路径上是否有障碍物以及最终停止位置，增加路径规划推理。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 25
      - name: "覆盖而非保留非背景"
        description: "当前规则中非背景像素不被覆盖。变体改为精灵像素优先，覆盖任何已有像素（包括其他精灵的残留）。多个精灵重叠时，后移动的精灵覆盖先到达的。解题者需推断处理顺序。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "精灵到达后重新着色"
        description: "精灵滑到目标位置后，主体色变为锚点色（或反之），标记像素变为背景色消失。解题者需识别颜色变换规则，从输出中反推原始精灵身份。"
        source: recolor
        source_task: 20270e3b
        delta_lines: 20

  - id: D6
    name: "变换：原始位置处理"
    tag: trajectory
    current: "精灵的原始位置像素全部变为背景色（清除），锚点保持不变"
    alternatives:
      - name: "保留源精灵（复制而非移动）"
        description: "精灵滑动后原始位置的像素保留不变，结果为输出中出现两个副本（原位置+对齐位置）。解题者需发现'复制'而非'移动'的规则。"
        source: keep_source
        source_task: 247ef758
        delta_lines: 5
      - name: "滑动轨迹留痕"
        description: "精灵滑动路径上用标记色（或专用颜色）绘制一条连续轨迹线，标记像素沿滑动方向涂色。解题者需推断滑动方向和距离来理解轨迹来源。"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 20
      - name: "锚点消失"
        description: "精灵到达后锚点像素也变为背景色消失（当前锚点保留）。解题者在输出中无法直接看到锚点，需要从精灵最终位置和边界对齐关系反推锚点曾经的位置。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "原位留下标记色轮廓"
        description: "精灵移走后，原位置不完全清除，而是留下精灵的标记色轮廓（标记像素保留，主体变为背景）。解题者可通过残留的标记色推断精灵的原始位置。"
        source: creative
        source_task: null
        delta_lines: 12

  - id: D7
    name: "网格形状：输出裁切方式"
    tag: grid_shape
    current: "输出网格与输入网格尺寸完全一致，不进行裁切或扩展"
    alternatives:
      - name: "紧凑裁切输出"
        description: "输出仅保留包含所有非背景像素的最小外接矩形区域。解题者需推断裁切逻辑以及最终网格尺寸会缩小。"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 10
      - name: "扩展网格以容纳完整精灵"
        description: "当前规则裁剪超出边界的像素。变体改为扩展网格使所有精灵像素完整保留，输出可能比输入更大。解题者需理解网格尺寸会动态变化。"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 20
      - name: "仅输出锚点所在边的条带"
        description: "输出裁切为仅包含锚点所在行/列附近的窄条带（如锚点行±精灵最大高度范围）。输出显著小于输入，解题者需理解空间聚焦规则。"
        source: crop
        source_task: a251c730
        delta_lines: 15

  - id: D8
    name: "多步处理：精灵移动顺序"
    tag: multi_step
    current: "所有精灵同时移动（先统一清除原位置，再统一粘贴到新位置），无先后顺序依赖"
    alternatives:
      - name: "按距离排序逐个移动"
        description: "精灵按标记像素到目标锚点的距离从近到远（或从远到近）逐个移动。每个精灵移动后才处理下一个，先移动的精灵可能阻挡后续精灵的路径。解题者需推断移动顺序和潜在的路径冲突。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "分轮次移动（水平先/垂直先）"
        description: "第一轮移动所有水平滑动的精灵，第二轮移动所有垂直滑动的精灵（或反之）。两轮之间第一轮的结果成为第二轮的初始状态。解题者需识别两阶段处理逻辑。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "迭代对齐直到稳定"
        description: "精灵移动后可能使新的匹配关系生效（如精灵A到达后成为精灵B的新锚点）。反复执行匹配-移动直到无精灵需要移动。解题者需推断迭代过程和终止条件。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "按颜色分组依次处理"
        description: "相同标记色的精灵作为一组同时处理，不同标记色的组按颜色值从小到大（或按锚点在边界上的顺时针顺序）依次处理。解题者需发现分组规则和处理顺序。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D9
    name: "精灵内部标记识别规则"
    tag: meta
    current: "标记色为精灵内部出现次数最少的颜色（少数色），仅1个像素"
    alternatives:
      - name: "标记色为最多色（多数即标记）"
        description: "取反当前规则：精灵中面积最大的颜色作为标记色，面积最小的作为主体色。解题者需颠覆'少数即特殊'的直觉，改为关注多数色来确定匹配。注意这在视觉上可见，因为多数色区域面积更大更醒目。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "标记由空间位置决定（非频率）"
        description: "精灵中位于最上方/最左方的单独像素为标记（不看颜色频率）。双色精灵中处于极端位置的像素用于匹配。解题者需关注空间位置而非颜色统计。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "标记为唯一不与其他精灵共享的颜色"
        description: "每个精灵包含多种颜色，标记色是该精灵独有的、其他精灵都不包含的颜色。解题者需跨精灵比较颜色集合来确定标记。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "标记为精灵内部被背景色包围的孤立像素"
        description: "标记像素不看颜色频率，而是在精灵的4-邻域中被背景色或精灵外部包围最多的像素。标记是精灵结构中最'边缘'或最'突出'的那个像素。解题者需分析局部拓扑结构。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D10
    name: "锚点-精灵基数关系"
    tag: meta
    current: "多对多：1-3个锚点颜色，3-5个精灵，多个精灵可共享同一标记色（因此共享同一锚点）"
    alternatives:
      - name: "严格一对一：每个锚点恰好一个精灵"
        description: "锚点数等于精灵数，每个锚点颜色独特且恰好一个精灵与之匹配。配对关系为双射。解题者不需处理多精灵竞争同一锚点的情况，推理更直接但视觉模式更丰富（更多锚点颜色）。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "一对多：一个锚点、多个精灵"
        description: "网格中只有1个锚点，所有精灵都滑向该锚点。多个精灵沿同一轴对齐到同一列/行。解题者需理解所有精灵共享目标但各自独立滑动，可能产生重叠。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "多锚点竞争：精灵选择最近锚点"
        description: "多个同色锚点在不同边界位置，精灵滑向距离最近的那个同色锚点。解题者需计算距离并做出选择，增加空间推理。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D11
    name: "干扰项：单例像素"
