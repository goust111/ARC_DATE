        delta_lines: 10
      - name: "精灵体为单行或单列线段"
        description: "精灵主体为1像素宽的水平或垂直线段（2-7像素长），标记在端点旁。视觉上精灵极为细长，与当前的块状形状完全不同，增加识别难度。"
