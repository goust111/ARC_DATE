      - name: "精灵形状编码信息（形状决定滑动距离）"
        description: "精灵的面积或宽度编码了额外的滑动偏移量（如面积为N则额外偏移N行/列）。解题者需从形状属性推断数值参数，增加抽象推理层次。"
        source: creative
