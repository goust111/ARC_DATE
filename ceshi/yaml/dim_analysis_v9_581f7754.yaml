  - id: D13
    name: "背景色选择规则"
    tag: meta
    current: "背景色为网格中出现最多的颜色，生成时从1-8中随机选择"
    alternatives:
      - name: "背景色固定为黑色(0)"
        description: "背景始终为黑色，所有精灵和锚点使用非黑色。视觉上更接近经典ARC题目风格，但减少了一层推理（无需识别背景色）。"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "双背景色（分区背景）"
        description: "网格分为左右（或上下）两个区域，各自有不同的背景色。精灵需滑向对应区域的锚点。解题者需先识别分区再确定精灵属于哪个区域。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "背景色与某锚点色相同"
        description: "背景色恰好等于某个锚点的颜色，导致该锚点在视觉上'隐形'——只能通过其边界位置和精灵标记色推断其存在。解题者需发现隐藏的锚点，增加感知难度。注意该锚点作为边界像素其4-邻域仍有部分在网格外或为背景色，但视觉上不可见，因此此方案不可行。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D14
    name: "滑动方向：单向vs双向"
    tag: meta
    current: "精灵只能沿一个轴的一个方向滑动，方向由标记到锚点的相对位置决定"
    alternatives:
      - name: "精灵向锚点的反方向滑动"
        description: "精灵不滑向锚点，而是沿锚点的反方向滑动相同距离（即远离锚点）。输出中精灵在锚点的对侧。解题者需发现这种反直觉的方向规则。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "精灵滑到边界停止（不看锚点列/行）"
        description: "精灵沿锚点决定的轴滑动，但不对齐到锚点的列/行，而是滑到网格边界才停止（gravity效果）。锚点仅决定滑动方向。解题者需区分锚点的两种功能（方向指示vs位置对齐）。"
        source: gravity
        source_task: 62593bfd
        delta_lines: 15
      - name: "滑动距离为标记到锚点行/列差的一半"
        description: "精灵不完全对齐到锚点位置，而是移动到标记与锚点之间的中点。解题者需计算距离并取半，增加数值推理。"
        source: creative
        source_task: null
        delta_lines: 12

  - id: D15
    name: "锚点边缘约束"
    tag: meta
    current: "锚点必须位于边界行/列上，且不在角落；4-邻域全部为背景色（孤立）"
    alternatives:
      - name: "锚点可在角落"
        description: "允许锚点位于网格四个角落。角落锚点同时属于两条边，需要定义特殊规则（如按标记像素相对位置选择主轴）。增加边界情况推理。"
        source: inversion
        source_task: null
        delta_lines: 12
      - name: "锚点不需要孤立（可相邻其他非背景像素）"
        description: "锚点在边界上但可以与其他非背景像素相邻（如靠近精灵边缘或其他锚点）。解题者需通过位置（边界上）而非孤立性来识别锚点，增加锚点检测难度。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "锚点在次边界（距边界1像素的行/列）"
        description: "锚点不在最外层边界，而在倒数第二行/列。精灵仍需将标记对齐到锚点位置。解题者需识别'几乎在边界'的像素作为锚点，改变了搜索策略。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D16
    name: "非背景像素碰撞处理"
    tag: transform
    current: "滑动目标位置的非背景像素不被覆盖（精灵像素跳过这些位置）"
    alternatives:
      - name: "颜色混合（两色取较大值/较小值）"
        description: "当精灵像素与已有非背景像素重叠时，取两个颜色值中较大（或较小）的值。输出中重叠区域呈现混合结果。解题者需推断混合规则。注意颜色值大小对人类不直接可见，可改为固定的第三颜色标记重叠区域。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "重叠区域变为特殊标记色"
        description: "当两个精灵像素重叠时，重叠位置变为一种预定义的标记颜色（如红色），标记出冲突区域。解题者需理解重叠检测规则。"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "禁止重叠（精灵互不干涉）"
        description: "如果精灵滑动后会与任何已有非背景像素重叠，则该精灵不移动（保持原位）。解题者需判断哪些精灵能成功移动、哪些被阻挡。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 15

  - id: D17
    name: "符号编码：锚点颜色附加信息"
    tag: symbol_instructions
    current: "锚点颜色仅用于配对匹配，不编码其他信息"
    alternatives:
      - name: "锚点颜色编码旋转角度"
        description: "锚点颜色不仅用于匹配，还编码精灵到达后需要旋转的角度（如color1→0°, color2→90°, color3→180°）。精灵在滑动后还需旋转。解题者需同时推断配对规则和旋转映射。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "锚点旁边的额外像素编码偏移量"
        description: "锚点像素旁（沿边界方向）有0-2个同色像素，形成长度1-3的短线段。线段长度编码精灵到达后的额外偏移行/列数。解题者需读取线段长度并计算最终位置。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "图例区域定义颜色配对规则"
        description: "网格一角有一个小型图例区域，显示颜色对应关系（如2x2块：左列为锚点色，右列为标记色）。精灵的标记色通过查图例间接匹配锚点色（而非直接相等）。解题者需先解码图例。"
        source: legend_lookup
        source_task: 58490d8a
        delta_lines: 30
