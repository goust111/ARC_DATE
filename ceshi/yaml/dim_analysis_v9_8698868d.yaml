task_id: 8698868d
task_type: move_to_match
summary: "将散落的精灵按连通洞数量与框架网格中的框架配对，嵌套放入后将精灵洞像素重着色为框架色，输出紧密的框架网格"

dimensions:
  - id: D1
    name: "匹配条件：连通洞计数"
    tag: match_cond
    current: "hole_counting — 精灵与框架各自内部的 4-连通背景色洞分量数目相等即配对"
    alternatives:
      - name: "颜色匹配替代洞计数"
        description: "每个精灵和框架各带一个特殊标记像素（如在角落或边缘中点），标记像素颜色相同即配对。解题者的推理从'数洞'转为'找颜色标记并配对'，推理方式从计数变为属性比较，视觉线索也更直观。"
        source: color_match
        source_task: 2c181942
        delta_lines: 35
      - name: "形状匹配替代洞计数"
        description: "精灵的整体内部图案形状与框架内部洞的形状（连通区域轮廓）吻合才能配对。解题者需要在心中旋转和比较形状轮廓，推理从数值计数转为几何匹配，复杂度显著提升。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 50
      - name: "精灵洞总面积匹配框架洞数"
        description: "精灵内部洞的总像素面积（而非连通分量数）等于框架内部的洞数。例如精灵有一个3像素的洞分量对应框架有3个单像素洞。解题者需要区分'面积'与'数量'两种计数方式，推理更加精细。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "连接器颜色/形状匹配"
        description: "精灵和框架之间通过画布上的彩色连接线段连接，连接线的颜色或形状指示配对关系。解题者需要追踪连接路径来确定配对，引入路径追踪推理。"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 55
      - name: "边缘颜色匹配"
        description: "框架的边框在四条边上各用不同颜色分段标记，精灵的边框也有对应的颜色分段。通过边缘颜色分布的一致性来配对。解题者需要关注边框细节而非内部结构。"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 40
      - name: "洞的空间排列匹配"
        description: "不按洞的数量配对，而是按洞在内部的相对位置排列（质心的行列秩序）进行匹配。例如精灵的洞分布在'左上+右下'与框架的洞在'左上+右下'才配对。推理从纯计数转为空间布局比较。"
        source: arrangement_match
        source_task: 3a25b0d8
        delta_lines: 40

  - id: D2
    name: "源对象：精灵的结构"
    tag: src
    current: "正方形精灵（frame_size-2 边长），实心边框为精灵色，内部含若干 4-连通背景色洞分量，散落在框架网格之外的背景区域"
    alternatives:
      - name: "非方形精灵（矩形）"
        description: "精灵不再是正方形而是各种矩形（如 4x6、5x3），框架内部也相应变为矩形空腔。解题者需要同时考虑宽和高来定位精灵在框架中的嵌套位置，空间推理复杂度增加。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "精灵无边框（纯图案块）"
        description: "精灵取消实心边框，只有内部的颜色图案（包含洞）。解题者需要通过颜色连通分量而非边框来识别精灵，对象识别难度增加。嵌套时直接将图案放入框架内部。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "精灵内含多色图案"
        description: "精灵内部的非洞像素不全是同一颜色，而是由 2-3 种颜色组成的图案（如条纹或棋盘格）。嵌套后多色图案保留，洞仍重着色为框架色。解题者需要理解多色保留规则。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "精灵部分重叠放置"
        description: "精灵在背景中的放置允许部分重叠（重叠部分一种颜色覆盖另一种），解题者需要先从重叠区域分离出各个独立精灵。增加了对象分割的预处理步骤。"
        source: creative
        source_task: null
        delta_lines: 45

  - id: D3
    name: "目标对象：框架网格的结构"
    tag: dst
    current: "jigsaw_assembly — 多个正方形框架紧密排列成网格（无间隙），每个框架为 1 像素实心边框，内部散布若干单像素背景色洞（各洞 4-隔离）"
    alternatives:
      - name: "框架间有间隙分隔"
        description: "框架网格中相邻框架之间有 1-2 像素的背景色间隙，而非完全紧贴。输出时同样保留间隙。解题者需要识别间隙模式来确定网格布局，而非依赖紧密排列。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "框架为非正方形矩形"
        description: "框架为非正方形的矩形（如 6x8），精灵尺寸相应调整。这增加了空间推理中对长宽比的考量，输出网格形状也更加多样。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "框架网格散布在画布任意位置"
        description: "框架不再排成紧密网格，而是散落在画布各处（但仍保持不重叠）。解题者需要先识别所有框架位置，再推断输出网格的排列规则（如按行列坐标排序）。组装推理复杂度大增。"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "框架带有颜色渐变边框"
        description: "框架的四条边各使用不同颜色（如上红、下蓝、左绿、右黄），形成多色边框。嵌套后精灵洞应重着色为哪种框架色成为新的推理点——例如按洞所在象限决定用哪个边的颜色。"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D4
    name: "变换方式：嵌套后的重着色"
    tag: transform
    current: "recolor — 精灵嵌套入框架后，精灵内部的洞（背景色像素）重着色为框架的边框颜色"
    alternatives:
      - name: "洞保留背景色，精灵色变为框架色"
        description: "与当前逻辑取反：嵌套后精灵的实心像素变为框架色，而洞保持背景色不变。输出中能看到框架内部的洞图案，而精灵与框架融为一体。解题者需要理解'取反'的重着色逻辑。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "洞重着色为精灵自身颜色（自填充）"
        description: "嵌套后洞不是变为框架色，而是变为精灵自身的颜色——即精灵变成完全实心块放入框架。输出中每个框架内部是完全单色的精灵色方块。推理焦点变为'哪种颜色填入哪个框架'。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "颜色互换：精灵色与框架色交换"
        description: "嵌套后精灵的实心像素变为框架色，框架的边框变为精灵色。形成精灵-框架颜色互换。解题者需要理解双向颜色交换规则，视觉效果强烈。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 20
      - name: "洞重着色为第三种颜色（基于图例）"
        description: "画布上有一个小型图例将每种框架色映射到一种不同的填充色。嵌套后洞变为图例指定的颜色而非框架色。解题者需要先解读图例映射表，增加了符号解码步骤。"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 40
      - name: "框架内部全部填充为精灵图案（含洞的完整复制）"
        description: "嵌套后不对洞做重着色处理，精灵的完整图案（包括洞的背景色）直接放入框架内部。输出中背景色仍然出现。解题者需要注意输出中是否保留背景色来推断变换规则。"
        source: inversion
        source_task: null
        delta_lines: 5

