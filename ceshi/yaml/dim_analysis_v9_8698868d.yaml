  - id: D17
    name: "多步处理逻辑"
    tag: multi_step
    current: "单步处理 — 一次性完成所有精灵的匹配和嵌套"
    alternatives:
      - name: "按洞计数从少到多依次处理"
        description: "精灵按洞计数从小到大依次嵌套，每步嵌套一个精灵。如果后续精灵与已嵌套的精灵在框架中有空间冲突则需调整。引入了顺序依赖性，解题者需要发现处理顺序。"
        source: multi_step
        source_task: 247ef758
        delta_lines: 30
      - name: "嵌套后触发二次变换"
        description: "第一步将精灵嵌套入框架；第二步对嵌套结果执行额外变换（如将所有洞位置的颜色传播到相邻像素）。解题者需要理解两步变换的组合效果。"
        source: multi_step
        source_task: 16b78196
        delta_lines: 40
      - name: "迭代消除：每轮只处理洞计数最少的配对"
        description: "每轮只处理当前洞计数最少的精灵-框架配对，处理后从候选集中移除。解题者需要理解迭代消除策略，虽然结果与一次性处理相同，但推理过程更加结构化。"
        source: creative
        source_task: null
        delta_lines: 25

