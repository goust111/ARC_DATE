    name: "符号编码与图例"
    tag: symbol_instructions
    current: "无符号编码 — 配对规则完全从对象的结构属性（洞计数）中推断"
    alternatives:
      - name: "颜色映射图例"
        description: "画布边缘有一个小型色带图例，定义精灵色到框架色的颜色映射。解题者需要先解读图例来确定配对关系（而非通过洞计数），推理路径从结构分析转为符号解码。"
