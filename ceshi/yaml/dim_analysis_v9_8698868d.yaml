      - name: "精灵按特定顺序排列"
        description: "精灵不随机散布，而是按洞计数顺序从左到右（或从上到下）排列。解题者如果发现了排列规律可以利用它辅助匹配，形成位置与数量的冗余线索。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 20

  - id: D15
    name: "src-dst 基数关系"
    tag: multi_step
    current: "1:1 双射 — 每个精灵恰好匹配一个框架，反之亦然"
    alternatives:
      - name: "精灵多于框架（many:1 筛选）"
        description: "画布上有 N+K 个精灵但只有 N 个框架，多余的 K 个精灵是干扰项（洞计数不与任何框架匹配）。解题者需要先筛选出有效精灵再执行配对，增加了排除推理步骤。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "框架多于精灵（部分框架空置）"
        description: "画布上有 N+K 个框架但只有 N 个精灵，无法匹配的框架在输出中保持原样（仅边框）。解题者需要理解'部分填充'的规则并正确处理空置框架。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "一个精灵匹配多个框架（1:many）"
        description: "某些洞计数在多个框架中出现（框架洞计数可重复），同一个精灵图案被复制到所有匹配的框架中。解题者需要发现'广播'语义——一个精灵可以服务多个框架。"
        source: creative
        source_task: null
        delta_lines: 25

