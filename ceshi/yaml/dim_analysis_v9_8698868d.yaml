    alternatives:
      - name: "精灵放置在框架网格内的空隙中"
        description: "如果框架网格不占满整行/列，精灵可以放置在网格'内部'的空白区域。解题者需要更仔细地分辨框架和精灵的空间关系，不能简单地按区域分类。"
