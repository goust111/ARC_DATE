        source: creative
        source_task: null
        delta_lines: 15
      - name: "双背景色"
        description: "画布有两种背景色交替排列（如棋盘格式的双色背景），框架和精灵的洞仍为较常见的背景色。解题者需要区分两种背景色并正确识别洞。视觉复杂度增加。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "背景色可作为框架/精灵颜色使用"
        description: "允许某些框架或精灵使用当前背景色作为其颜色（即隐形对象），同时选择另一种颜色作为这些对象内部洞的颜色。解题者需要识别'双层隐形'——隐形框架中含有非背景色洞。"
        source: invisible_frames
        source_task: null
        delta_lines: 20

  - id: D14
