      - name: "精灵紧贴框架网格边缘"
        description: "精灵必须紧贴框架网格的某条外边缘放置（间距为 0），形成类似'停靠'的视觉效果。解题者可能将精灵误认为框架的延伸部分，增加了对象分割的难度。"
