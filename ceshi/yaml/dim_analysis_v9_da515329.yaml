        source: reflection
        source_task: "142ca369"
        delta_lines: 30

  - id: D7
    name: "终止条件"
    tag: dst
    current: "螺旋一直展开直到网格空间被完全占据（无空白可继续画）"
    alternatives:
      - name: "固定圈数终止"
        description: "螺旋只展开固定圈数后停止（如展开3圈），留下网格外围区域为空白。圈数可由十字臂长编码。解题者需推断'臂长→圈数'映射"
