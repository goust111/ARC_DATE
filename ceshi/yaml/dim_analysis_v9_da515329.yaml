task_id: da515329
task_type: move_along_path
summary: "青色(8)十字的四个端点各发射顺时针螺旋轨迹，以1像素间距填满整个网格，形成万花筒式的同心矩形螺旋图案"

dimensions:
  - id: D1
    name: "螺旋方向"
    tag: path
    current: "四个端点统一按顺时针方向螺旋展开"
    alternatives:
      - name: "逆时针螺旋"
        description: "所有端点改为逆时针方向螺旋展开，产生的同心矩形图案是当前图案的镜像版本。解题者需准确判断旋转方向，看似简单但螺旋方向的细微差异会导致输出完全不同"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "方向由端点位置决定（上下顺时针、左右逆时针）"
        description: "不同端点使用不同螺旋方向：上/下端点顺时针，左/右端点逆时针（或反之）。解题者需从多个示例中分辨出方向分配规则，大幅增加推理复杂度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "交替方向螺旋"
        description: "第一层螺旋顺时针展开，第二层逆时针，第三层再顺时针，以此交替。打破了单一旋转方向的对称性，解题者需发现方向交替的规律"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "由图例符号编码方向"
        description: "在网格边缘放置一个小标记（如L形或反L形像素组），指示螺旋应顺时针还是逆时针展开。类似 e87109e9 的图例编码转向规则，解题者必须先解读图例再执行螺旋"
        source: symbol_instructions
        source_task: "e87109e9"
        delta_lines: 25

  - id: D2
    name: "螺旋臂间距"
    tag: trajectory
    current: "相邻螺旋臂之间保持1像素的背景间隙（spacing_constraint）"
    alternatives:
      - name: "无间距（连续填充）"
        description: "取消间距约束，螺旋臂紧密相邻无间隙，最终将整个网格完全填满为青色。解题者需推断填充终止条件（即整个网格被填满），产生视觉上截然不同的'全填充'效果"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "2像素间距"
        description: "将间距从1像素增大到2像素，螺旋臂之间留出更宽的空白走廊。产生更稀疏的螺旋图案，解题者需精确判断间距参数"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "间距由十字臂长编码"
        description: "间距不固定为1，而是等于十字臂的长度（如臂长3则间距3）。解题者需先测量臂长再推断间距参数，融合计数推理与路径推理"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "GCD间距（由十字中心位置决定）"
        description: "间距由十字中心到网格边缘的最小距离与最大距离的GCD决定。类似 16de56c4 的 GCD 间距机制，将数值推理引入螺旋间距参数"
        source: gcd_spacing
        source_task: "16de56c4"
        delta_lines: 20

  - id: D3
    name: "轨迹涂色模式"
    tag: trajectory
    current: "螺旋轨迹全程使用单一青色(8)连续涂色"
    alternatives:
      - name: "周期性颜色循环"
        description: "螺旋轨迹按周期循环使用多种颜色（如青-红-青-红），每一圈或每一段切换颜色。类似 195c6913 的 color_cycle 机制，增加颜色序列推理"
        source: color_cycle
        source_task: "195c6913"
        delta_lines: 15
      - name: "每圈递增颜色编号"
        description: "第一圈用颜色1，第二圈用颜色2，第三圈用颜色3，以此类推。不同圈层用不同颜色，解题者需发现'圈层→颜色'的映射关系，使输出具有彩虹般的层次感"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "间歇涂色（每隔N像素留空）"
        description: "螺旋轨迹不连续涂色，而是每涂2像素留1像素空白，产生虚线效果。类似 4a21e3da 的 intermittent_skip 机制，增加轨迹模式识别难度"
        source: intermittent_skip
        source_task: "4a21e3da"
        delta_lines: 12
      - name: "反射变色（每次转弯时改变颜色）"
        description: "每次螺旋转90度弯时，轨迹颜色在两种颜色间切换。类似 142ca369 的 color_change_on_bounce 机制，转弯事件成为颜色切换信号"
        source: color_change_on_bounce
        source_task: "142ca369"
        delta_lines: 12

  - id: D4
    name: "源对象形状"
    tag: src
    current: "青色十字形（中心点 + 四个方向各延伸等长臂），四个端点作为螺旋发射源"
    alternatives:
      - name: "单像素点源"
        description: "源简化为单个青色像素点，从该点向四个方向发射螺旋。十字的臂长信息不再由形状给出，可能由其他方式编码或默认为1。降低源识别复杂度但可能引入新的参数推理"
        source: control_pixels
        source_task: "4a21e3da"
        delta_lines: 15
      - name: "非对称十字（不同臂长）"
        description: "十字的四条臂长度不相等（如上臂2、下臂3、左臂1、右臂4），每个端点发射的螺旋根据各自臂长有不同的初始偏移或行为。打破四重对称性，解题者需分别推断每个方向的参数"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "X形对角源（对角线十字）"
        description: "用X形（45度对角线十字）替代正交十字，四个端点位于对角方向。螺旋沿对角线方向展开，产生菱形而非矩形的螺旋图案，空间推理从正交转为对角"
        source: diagonal_ray
        source_task: "142ca369"
        delta_lines: 35
      - name: "T形或L形源（部分端点缺失）"
        description: "源是T形（3个端点）或L形（2个端点），只有存在端点的方向发射螺旋。解题者需先识别源形状再确定哪些方向有螺旋，产生非对称的输出图案"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D5
    name: "螺旋发射源数量与基数关系"
    tag: src
    current: "四个端点（十字的上、下、左、右顶点），每个端点发射一条螺旋"
    alternatives:
      - name: "仅对向两端点发射（2源）"
        description: "只有上下或左右两个对向端点发射螺旋，另外两个端点保持不变。产生半填充效果，解题者需判断哪两个端点是活跃的（可能由臂长差异暗示）"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "八方向发射（加入对角端点）"
        description: "在十字的四个正交端点基础上，增加四个对角方向的虚拟端点（十字臂交叉点的45度方向），共8条螺旋。更密集的填充模式，解题者需发现8方向规则"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "单一端点源（选择最近边缘的端点）"
        description: "仅由距网格边缘最近的那个端点发射一条螺旋。解题者需先判断源选择规则（距离最近），再推断单螺旋的展开方式。从4源缩减为1源，显著改变输出复杂度"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D6
    name: "路径类型"
    tag: path
    current: "矩形螺旋路径（沿网格正交方向转90度弯的螺旋）"
    alternatives:
      - name: "直线射线（非螺旋）"
        description: "每个端点沿其方向发射直线射线到边缘，不做螺旋转弯。类似 221dfab4 的 straight_ray，从复杂的螺旋简化为简单的十字射线，完全改变输出图案"
