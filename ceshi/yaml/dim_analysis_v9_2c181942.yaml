task_id: 2c181942
task_type: move_to_match
summary: "将散落的单色精灵通过颜色和边缘长度匹配旋转并贴附到中央空心方块（hub）的对应边上，hub四条边各有不同颜色，精灵头部颜色与边缘颜色一致即配对"

dimensions:
  - id: D1
    name: "匹配条件：颜色配对机制"
    tag: match_cond
    current: "s.head.color == d.edge.color — 精灵颜色与hub边缘颜色相同即配对，颜色唯一决定精灵应贴附到哪条边"
    alternatives:
      - name: "形状轮廓匹配替代颜色匹配"
        description: "所有精灵和hub边缘都使用同一颜色，匹配条件改为精灵接触边的轮廓形状与hub边缘的凹凸互补。解题者无法依赖颜色快速配对，必须逐一比对几何形状，大幅增加空间推理难度"
        source: shape_match
        source_task: 16b78196
        delta_lines: 50
      - name: "行列对齐匹配"
        description: "精灵按其在网格中的行/列位置与hub边缘对齐：位于hub上方的精灵贴上边，左侧的贴左边，以此类推。颜色仅用于重着色，空间位置决定配对。解题者需推断位置→边的映射规则"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 35
      - name: "连接器标记匹配"
        description: "每个精灵带一个特殊颜色的标记像素（连接器），hub每条边旁也有一个同色标记像素。配对条件为连接器颜色一致且方向对齐。解题者需同时识别标记颜色和空间方向关系"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 40
      - name: "精灵像素数量编码匹配"
        description: "hub四条边用相同颜色但长度不同（通过hub大小N变化或非对称hub实现），精灵的总像素数量等于目标边的长度值。解题者需计数像素并建立数量对应关系"
        source: count_match
        source_task: 6e4f6532
        delta_lines: 35
      - name: "边缘颜色渐变顺序匹配"
        description: "hub四条边的颜色不再均匀单色，而是渐变色序列。精灵接触边的颜色序列必须与hub边缘的颜色序列完全一致。解题者需比对颜色序列而非单一颜色值"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 40

  - id: D2
    name: "匹配条件：尺寸约束"
    tag: match_cond
    current: "s.head.length == d.edge.length — 精灵接触边的连续填充像素数必须等于hub边缘长度(N-2)"
    alternatives:
      - name: "接触边长度为hub边缘的倍数"
        description: "精灵接触边长度为hub边缘长度的整数倍（如2倍、3倍），精灵贴附后沿边缘方向延伸覆盖。hub可设计为更大尺寸以容纳长接触边，增加空间规划难度"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "接触边长度按大小排序匹配"
        description: "多个精灵的接触边长度各不相同，hub四条边的长度也不同（非正方形hub，如矩形）。按长度从大到小排序后对应匹配。解题者需建立排序对应关系"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 40
      - name: "取消尺寸约束，仅靠颜色配对"
        description: "移除接触边长度必须等于hub边缘长度的限制，所有精灵的接触边长度可以不同于hub边缘。精灵贴附时居中对齐，多余部分超出hub范围。简化了匹配条件但增加了放置逻辑的理解难度"
        source: inversion
        source_task: null
        delta_lines: 25

  - id: D3
    name: "变换操作：旋转规则"
    tag: transform
    current: "尝试rot90 x 0-3，选择满足对称性和接触边约束的唯一旋转角度，将精灵对齐到hub对应边"
    alternatives:
      - name: "旋转+翻转组合变换"
        description: "精灵不仅可旋转还可翻转（8种变换），但对称性约束保证仍只有一种有效变换。增加了变换空间的搜索范围，解题者需考虑镜像可能性"
