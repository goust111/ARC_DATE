        source_task: a25697e4
        delta_lines: 25
      - name: "条件旋转：由标记像素决定旋转方向"
        description: "精灵上有一个特殊标记像素（如不同颜色的角点），标记位置决定旋转方向——标记在左上则顺时针旋转90度贴附，标记在右上则逆时针。解题者需发现标记位置与旋转方向的编码规则"
        source: conditional_rotation
        source_task: 291dc1e1
        delta_lines: 35
      - name: "无旋转，精灵以原始方向直接平移"
        description: "精灵在输入中已处于正确朝向，只需平移到hub对应边。这是当前旋转规则的反转——降低变换复杂度但增加空间推理（需从输入朝向直接推断目标位置）"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "缩放变换替代旋转"
        description: "精灵不旋转但需按比例缩放以适应hub边缘长度。精灵设计为不同大小的相似形状，缩放因子由hub边缘与精灵原始接触边的比值决定。引入新的数值推理维度"
        source: scaling
        source_task: b10624e5
        delta_lines: 45

