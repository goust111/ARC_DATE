task_id: abc82100
task_type: move_to_match
summary: "输入网格中包含若干局部规则示例（相邻的源色-目标色像素对旁带一个teal模板图案）和散落的彩色源像素；对每个源像素，根据其颜色找到匹配的规则示例，将该规则的teal模板平移到源像素位置并重着色为目标色，最后移除所有规则示例和teal模板像素。"

dimensions:
  - id: D1
    name: "源像素与规则的匹配条件"
    tag: match_cond
    current: "s.color == d.source_color：源像素的颜色必须等于规则示例中源色像素的颜色"
    alternatives:
      - name: "形状匹配而非颜色匹配"
        description: "源对象不再是单像素而是小型精灵，规则示例中也包含小精灵模板；通过精灵形状（而非颜色）匹配规则。解题者需要从形状相似性推断对应关系，增加了几何推理难度。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 35
      - name: "空间位置匹配（行/列对齐）"
        description: "源像素通过其所在行或列与规则示例对齐来匹配：同一行的源像素使用该行的规则。解题者需要关注空间位置关系而非颜色属性，改变推理策略。"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 25
      - name: "多属性联合匹配（颜色+邻域特征）"
        description: "每个源像素不仅需要颜色匹配，还需要其4邻域中非背景像素的数量与规则示例中的编码一致。增加了局部上下文分析的要求，仅看颜色无法完成匹配。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "规则示例的方向编码匹配"
        description: "规则示例中源色和目标色的相对方向（上下左右）编码额外信息：源像素需要根据其周围最近teal像素的方位来选择对应方向的规则。增加方向推理。"
        source: direction_matching
        source_task: 5545f144
        delta_lines: 30
      - name: "频率优先消歧匹配"
        description: "当多个规则的源色相同时，通过源像素颜色在网格中出现的频率进行消歧——出现最多的颜色匹配最大的teal模板。增加了全局统计推理。"
        source: frequency_tiebreak
        source_task: 67e490f4
        delta_lines: 25

  - id: D2
    name: "规则示例的编码格式"
    tag: symbol_instructions
    current: "规则示例由相邻的源色-目标色像素对加上附近的teal模板图案构成，颜色对直接编码映射关系"
    alternatives:
      - name: "图例区域集中编码"
        description: "所有规则不再散布于网格中，而是集中在网格边缘的图例区域（如左上角2xN区域），每行包含源色、目标色和缩小版模板。解题者需要先识别图例区域再解码规则，更接近'查表'式推理。"
        source: legend_lookup
        source_task: 58490d8a
        delta_lines: 35
      - name: "规则示例使用训练对方式编码"
        description: "规则不是颜色对+模板，而是两个小网格组成的训练对（输入模式→输出模式），解题者需要从训练对中推断变换规则并泛化到其他源像素。增加归纳推理难度。"
        source: rule_learning
        source_task: 4c7dc4dd
        delta_lines: 40
      - name: "模板颜色非teal而是与目标色相同"
        description: "模板不使用固定的teal色，而是直接用目标色绘制。解题者需要区分'模板中的目标色像素'和'真正的源像素'，增加对象分割难度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "规则示例按堆叠层次编码优先级"
        description: "多个规则示例在空间上有层次关系（如一个包含另一个），内层规则优先于外层规则应用。解题者需要理解嵌套结构和优先级。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D3
    name: "源对象类型"
    tag: src
    current: "散落的单个彩色像素（不属于任何规则示例的非背景像素）"
    alternatives:
      - name: "多像素连通色块作为源"
        description: "源不再是单像素，而是由相同颜色的多个相邻像素构成的色块。每个色块作为整体匹配规则，模板以色块的质心或特定锚点对齐。增加了连通分量识别和锚点计算的推理。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "对角标记像素对作为源"
        description: "源由成对的同色对角像素构成（形成矩形的对角），模板放置在该矩形范围内。解题者需要识别对角配对关系，增加空间推理。"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 30
      - name: "边缘像素作为源"
        description: "源像素仅出现在网格边缘（第0行/列或最后行/列），类似控制像素。解题者需要关注边缘区域来定位源，与规则区域在网格内部形成空间分离。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 20
      - name: "带方向标记的源像素"
        description: "每个源像素旁边有一个额外的标记像素指示模板放置方向（上下左右），同一规则的不同源像素可能有不同的方向标记。增加了方向推断环节。"
        source: marker_axis
        source_task: 7ed72f31
        delta_lines: 25

  - id: D4
    name: "teal模板的形状类型"
    tag: dst
    current: "teal模板是由teal像素构成的任意连通图案（菱形、线段等），定义了要复制的形状"
    alternatives:
      - name: "模板为规则矩形/正方形"
        description: "teal模板限制为填充的矩形或正方形区域，不允许任意不规则形状。简化了模板识别但限制了图案多样性，解题者只需识别矩形边界。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "模板为空心框架"
        description: "teal模板不是实心图案而是空心框架（仅包含边缘teal像素），复制时也只绘制框架。输出呈现嵌套框架效果，视觉上更有层次感。"
        source: hollow_frames
        source_task: 4c416de3
        delta_lines: 20
      - name: "模板需旋转/翻转后使用"
        description: "teal模板在规则示例中以一种朝向呈现，但对某些源像素需要旋转90度或镜像翻转后再放置。旋转条件由源像素周围的上下文决定，增加空间变换推理。"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 30
      - name: "模板需按比例缩放"
        description: "teal模板是小尺寸的原型，对不同源像素需要按不同缩放因子放大后放置（缩放因子由某种属性编码）。增加了比例推理，输出中同一模板以不同大小出现。"
        source: scaling
        source_task: b10624e5
        delta_lines: 35

  - id: D5
    name: "模板放置的对齐方式"
