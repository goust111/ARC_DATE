task_id: 4c416de3
task_type: move_to_match
summary: "在黑色空心方框的角点处，将源角点的对角对称图案复制到目标角点，图案按角点方位旋转并使用目标标记像素的颜色"

dimensions:
  - id: D1
    name: "匹配条件：对角对称映射"
    tag: match_cond
    current: "源图案关于角点的对角线轴（dr==dc）对称，通过旋转/翻转映射到四种角点方位（TL/TR/BL/BR）"
    alternatives:
      - name: "基于颜色匹配的配对"
        description: "源角点和目标角点通过颜色匹配配对（如源图案颜色与目标标记颜色相同才配对），而非所有目标都复制同一图案。解题者需要先识别颜色对应关系再绘制，增加推理步骤。"
        source: color_match
        source_task: 2c181942
        delta_lines: 25
      - name: "基于形状匹配的配对"
        description: "每个框架内有不同形状的源图案，目标角点的凹槽形状决定应使用哪个源图案。解题者需要同时进行形状识别和空间推理。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 35
      - name: "仅水平/垂直镜像对称（取消对角对称约束）"
        description: "图案不再要求对角对称，而是仅使用水平或垂直镜像变换映射到不同角点。这打破了当前dr==dc轴对称的核心约束，使不同角点处的图案看起来差异更大，解题者需要识别具体的镜像轴。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "旋转90度映射而非反射映射"
        description: "从TL到其他角点使用90度旋转（而非按轴翻转），如TL->TR是顺时针90度，TL->BR是180度。改变了空间变换逻辑，解题者需要识别旋转而非翻转。"
        source: rotation
        source_task: fc7cae8d
        delta_lines: 15
      - name: "行/列对齐匹配"
        description: "不通过角点方位匹配，而是根据源和目标所在的行或列对齐关系来决定配对。同一行的源配对同一行的目标，同一列类似。增加空间位置推理。"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 30

  - id: D2
    name: "源对象：角点图案结构"
    tag: src
    current: "框架角点处的彩色图案，包含外向像素（dr<0或dc<0）和对角内向像素（k,k），整体关于dr==dc轴对称，4-6个像素"
    alternatives:
      - name: "非对角对称的任意小型精灵"
        description: "源图案不再限制为对角对称，可以是任意形状的小型精灵。解题者需要通过源角点识别完整形状，然后正确地旋转/翻转到目标角点。取消对称约束增加了解题难度。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "对角标记像素对作为源"
        description: "源不再是完整图案，而是一对对角方向的标记像素，目标需要通过这对像素推断出完整图案。参考9385bd28的对角标记机制。"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 30
      - name: "框架边缘上的精灵而非角点处"
        description: "源图案位于框架边缘的中点位置而非角点，目标同样在边缘中点。这改变了空间定位方式——从角点检测变为边缘中点检测，旋转映射也从四种角变为四种边。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "多种不同的源图案"
        description: "网格中存在多个不同的源图案（不同形状），每个目标角点的标记颜色或位置指示应使用哪个源图案。解题者需要同时进行图案分类和匹配。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D3
    name: "目标对象：标记像素定义"
    tag: dst
    current: "目标角点仅有一个彩色标记像素，位于图案最深对角偏移(k_max, k_max)处，其颜色决定输出颜色"
    alternatives:
      - name: "多个标记像素形成部分图案"
        description: "目标角点保留图案的多个像素（如2-3个）而非仅1个，解题者需要从部分线索推断完整图案。增加了模式补全的推理维度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "标记像素在角点正中心(0,0)"
        description: "标记像素不在最深对角位置，而在角点本身(0,0)处。这改变了定位逻辑——当前依赖对角偏移识别目标，新方案直接在角点处标色。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "框架边框颜色编码目标色"
        description: "目标角点不用标记像素，而是通过框架边框的部分着色来指示目标颜色。例如角点相邻的边框段被涂成目标颜色。解题者需要从边框颜色推断。"
        source: border_color_match
        source_task: d35bdbdc
        delta_lines: 25
      - name: "框架内部填充图案作为目标模板"
        description: "目标不是单个标记像素，而是框架内已有一个小型彩色填充区域，源图案需要对接到该区域。类似拼图式嵌合。"
        source: cavity_fill
        source_task: 5dbc8537
        delta_lines: 30

  - id: D4
    name: "变换：颜色传递规则"
    tag: transform
    current: "目标角点图案使用标记像素的颜色绘制（每个目标独立着色），源角点保持原色不变"
    alternatives:
      - name: "源颜色覆盖目标（统一色）"
        description: "所有目标角点使用源图案的颜色而非各自标记色，取消颜色传递。简化了颜色推理但改变了核心规则——解题者只需关注形状复制。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "颜色交换"
        description: "源和目标的颜色互换——目标图案使用源的颜色，同时源图案变为目标标记色。解题者需要理解双向颜色交换规则。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 20
      - name: "基于图例的颜色映射"
        description: "网格边缘有一个颜色映射图例（如2x2色块），源颜色通过图例查找对应的目标颜色。解题者需要先解码图例再应用变换。"
        source: template_stamping
        source_task: 65b59efc
        delta_lines: 30
      - name: "渐变色/多色图案"
        description: "目标图案不是单色而是多色——每个像素根据其与角点的距离或位置使用不同颜色。颜色从标记色到源色渐变，增加颜色推理复杂度。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D5
    name: "轨迹：源角点保留策略"
    tag: trajectory
    current: "源角点的完整图案在输出中保留不变（keep source）"
    alternatives:
      - name: "擦除源图案"
        description: "复制完成后，源角点的图案被擦除（恢复为背景/框架色）。输出中只有目标角点有图案。解题者需要理解'移动'而非'复制'的语义。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "源图案变色为背景色的变体"
        description: "源图案在输出中被重新着色为一种特殊颜色（如与背景色不同的淡色），形成'已使用'的视觉标记。解题者需要识别源的变色规则。"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 15
      - name: "源图案缩小为标记像素"
        description: "源角点图案在输出中也被简化为单个标记像素（与目标输入状态对称），形成源-目标角色互换的效果。极具视觉对称性。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D6
    name: "网格形状：输出裁剪"
    tag: grid_shape
    current: "输出网格与输入大小完全相同（same）"
    alternatives:
      - name: "紧凑裁剪到框架区域"
        description: "输出仅保留包含所有框架的最小外接矩形区域，去除多余背景。改变了输出尺寸推理，解题者需要确定裁剪边界。"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 15
      - name: "仅裁剪目标框架"
        description: "输出仅包含目标框架所在的区域，完全去除源框架。解题者需要先识别哪些是目标框架再确定裁剪范围。"
        source: crop
        source_task: a251c730
        delta_lines: 20
      - name: "每个框架独立输出为网格"
        description: "输出是多个独立小网格拼接（如packed grid格式），每个框架单独裁剪后排列。改变了输出结构的推理方式。"
        source: packed_grid
        source_task: 58f5dbd5
        delta_lines: 25

  - id: D7
    name: "框架结构：形状与数量"
    tag: meta
    current: "2-3个空心方形0框架，边长5-8，轴对齐矩形，可能有部分截断（L形）"
    alternatives:
      - name: "圆形或多边形框架"
        description: "框架不是矩形而是近似圆形（八边形像素近似）。角点概念需要重新定义为特定方位的边界点，增加空间推理的复杂度。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "嵌套框架（框中框）"
        description: "框架嵌套放置——大框架内包含小框架。图案在内外框架的角点间复制。解题者需要理解多层嵌套的角点关系。"
        source: nested_frames
        source_task: 45a5af55
        delta_lines: 35
      - name: "单个大框架（所有角点在同一框架）"
        description: "只有一个大框架，所有源和目标角点都在同一框架的四个角。简化了空间布局但保留核心图案复制逻辑，聚焦于角点变换推理。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "非方形矩形框架（长宽比大）"
        description: "框架为明显非方形的矩形（如3x7），不同角点的图案映射更具挑战性——因为框架不对称使得角点周围的可用空间不同。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D8
    name: "图案复杂度与结构"
    tag: meta
    current: "4-6个像素的对角对称图案，偏移范围|dr|,|dc|<=3，含外向像素和对角内向像素"
    alternatives:
      - name: "更大更复杂的图案（7-10像素）"
        description: "图案像素数增加到7-10个，偏移范围扩大到|dr|,|dc|<=4。需要更大的框架来容纳，识别完整图案更具挑战性。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "极简图案（2-3像素）"
        description: "图案缩减为仅2-3个像素（最小化），使得源和目标视觉差异微小。解题者需要从极少线索中推断规则，增加观察难度。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "L形或T形等特殊结构图案"
        description: "图案不要求对角对称，而是采用L形、T形等具有明确方向性的形状。不同角点的旋转产生视觉上更明显的差异，便于验证推理正确性。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "图案包含空洞（非连通）"
        description: "图案中间有空缺像素，形成非连通的形状。解题者需要准确识别哪些像素属于图案、哪些是空白，增加模式识别难度。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D9
    name: "源与目标的基数关系"
    tag: multi_step
    current: "1-2个源角点对多个目标角点（1:many），所有源共享同一规范图案"
    alternatives:
      - name: "多源多目标一对一配对"
        description: "每个源角点对应一个特定的目标角点（1:1配对），通过颜色或位置关系确定配对。解题者需要先推断配对规则再执行复制。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "链式传播（多步序列）"
        description: "源图案先复制到最近的目标，然后该目标变为新的源继续向下一个目标传播。类似多米诺效应的迭代处理。解题者需要推断处理顺序。"
        source: multi_step
        source_task: 16b78196
        delta_lines: 30
      - name: "所有角点互为源和目标"
        description: "每个角点同时是源和目标——它既提供自己的图案也接收其他角点的图案。图案叠加时需要处理冲突（如覆盖或混合规则）。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "按距离排序的逐步处理"
        description: "目标角点按与源角点的距离从近到远依次处理，每步的结果影响下一步（如已绘制的图案可能遮挡后续绘制）。处理顺序成为推理要素。"
        source: multi_step
        source_task: 247ef758
        delta_lines: 25

  - id: D10
    name: "符号编码：图例或控制像素"
    tag: symbol_instructions
    current: "无符号编码——目标标记像素直接编码颜色信息，没有独立的图例区域"
    alternatives:
      - name: "网格边缘的颜色图例"
        description: "在网格边缘放置颜色映射图例（如左列的颜色对），指示源颜色到目标颜色的转换规则。标记像素不再直接给出目标颜色，需要通过图例查表。"
        source: legend_lookup
        source_task: 58490d8a
        delta_lines: 30
      - name: "红绿标记像素指示源和目标"
        description: "使用红色像素标记源角点、绿色像素标记目标角点，而非通过图案完整性区分源目标。解题者需要先理解标记颜色的语义。"
        source: marker_pixels
        source_task: 9aaea919
        delta_lines: 20
      - name: "控制像素指示变换类型"
        description: "在框架附近放置控制像素，其颜色或位置编码该角点应使用的变换类型（如旋转vs翻转，顺时针vs逆时针）。每个目标的变换不再由角点方位唯一确定。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D11
    name: "框架边框颜色"
    tag: meta
    current: "框架边框统一使用颜色0（黑色）"
    alternatives:
      - name: "每个框架使用不同边框颜色"
        description: "不同框架使用不同的非背景色作为边框。边框颜色可作为额外的匹配条件（源只复制到同色框架的角点），增加匹配复杂度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "边框颜色编码变换参数"
        description: "框架的边框颜色指示该框架内角点应使用的变换方式（如颜色1=不旋转，颜色2=旋转90度等）。将边框色与变换规则绑定。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "框架边框部分缺失（开口框架）"
        description: "某些框架的边框有意缺失一段（形成开口），解题者需要从不完整的边框推断角点位置。增加角点检测的推理难度。"
        source: inversion
        source_task: null
        delta_lines: 20

  - id: D12
    name: "背景颜色与干扰"
    tag: meta
    current: "背景为单一纯色（1-9中随机选取），无干扰元素"
    alternatives:
      - name: "添加干扰像素/精灵"
        description: "背景中散布少量彩色干扰像素或小型精灵，不属于任何框架或图案。解题者需要区分有意义的图案和干扰项，增加视觉噪声过滤难度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "条纹/棋盘格背景"
        description: "背景不是纯色，而是由两种颜色交替形成的条纹或棋盘格。图案绘制时需要正确覆盖背景图案，解题者需要区分背景规律和任务图案。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "框架间有连接线"
        description: "框架之间用彩色线段连接，连接线的颜色或方向可能编码额外信息（如配对关系）。视觉上更复杂，解题者需要判断连接线的语义。"
        source: connector_draw
        source_task: 3e6067c3
        delta_lines: 25

  - id: D13
    name: "角点检测逻辑"
    tag: meta
    current: "通过检测两条相邻框架边（>=3非背景像素且含0像素）的交汇点来定位角点，外向方向不能有0像素"
    alternatives:
      - name: "所有四个角点均可为任意方位"
        description: "取消角点方位的固定推断，改为在角点处放置小型方向标记（如单像素偏移）指示该角点的'虚拟方位'。同一个物理TL角可以被标记为逻辑BR角。增加方位推理层次。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "锚点基于框架中心而非角点"
        description: "图案的参考点从角点改为框架的中心像素。变换从角点旋转变为以中心为基准的四象限映射。完全改变空间推理的基准点。"
        source: anchor_matching
        source_task: b10624e5
        delta_lines: 35
      - name: "边缘中点作为锚定位置"
        description: "图案不在角点而在框架四条边的中点处。角点不再有特殊意义，中点检测和图案方位映射成为新的挑战。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D14
    name: "图案绘制冲突处理"
    tag: meta
    current: "绘制目标图案时，仅覆盖背景色、框架色（0）或已有的同色像素，遇到其他颜色则断言失败"
    alternatives:
      - name: "允许图案重叠并使用覆盖规则"
        description: "当两个目标图案有像素重叠时，使用特定规则（如后绘制覆盖先绘制，或混合颜色取较大/较小值）。解题者需要推断覆盖优先级。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "图案避让框架边框"
        description: "图案绘制时跳过已有0像素（框架边框），仅在背景色上绘制。这会使靠近框架的图案出现缺口，解题者需要理解避让规则。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "图案可延伸到框架外部"
        description: "图案不限于框架角点附近，可以跨越框架边框延伸到框架外部或内部。解题者需要理解图案无边界限制的绘制规则。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D15
    name: "源角点选择约束"
    tag: meta
    current: "源角点仅从边长>=6的框架中选取，1-2个源角点，所有源共享同一规范图案"
    alternatives:
      - name: "每个框架恰好一个源角点"
        description: "约束改为每个框架恰好有一个角点是源，其余是目标。这使得源的分布更均匀，且每个框架都同时包含源和目标角色。"
        source: creative
