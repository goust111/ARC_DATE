task_id: 67e490f4
task_type: move_to_match
summary: "框架内的洞按形状与外部精灵配对（允许旋转/翻转），用出现频率最高的精灵颜色填充对应洞，输出裁剪到框架外接矩形"

dimensions:
  - id: D1
    name: "匹配条件：形状匹配方式"
    tag: match_cond
    current: "shape_match — 精灵的布尔掩码与洞的布尔掩码相同（允许旋转和翻转），即 s.mask == d.mask"
    alternatives:
      - name: "颜色匹配替代形状匹配"
        description: "每个洞的边缘框架像素中嵌入一个特殊颜色标记像素，精灵的颜色与该标记颜色相同即配对。解题者的推理从几何形状比较转为颜色属性匹配，降低了空间推理难度但增加了细节观察要求。"
        source: color_match
        source_task: 2c181942
        delta_lines: 40
      - name: "边缘轮廓匹配"
        description: "不比较完整掩码，而是比较精灵和洞的外轮廓边缘像素序列（如顺时针方向的凸凹编码）。即使面积和内部结构不同，只要外轮廓相同就配对。推理从'整体形状一致'变为'边界轮廓一致'，需要更精细的几何分析。"
        source: edge_matching
        source_task: 7b3084d4
        delta_lines: 45
      - name: "面积匹配替代形状匹配"
        description: "精灵的像素面积等于洞的像素面积即配对，不考虑形状。多个不同形状的洞可能面积相同，此时都用同一颜色填充。解题者需要数像素而非比较形状，推理方式从几何变为计数。"
        source: size_match
        source_task: 2c181942
        delta_lines: 30
      - name: "子图案排列匹配"
        description: "精灵由多个分离的小块组成（如2-3个不相连的像素团），洞内部也有对应的多个分离区域。匹配条件为小块之间的相对空间排列一致（质心间距和方向相同）。解题者需要分析空间布局而非单一形状，推理复杂度显著提升。"
        source: arrangement_match
        source_task: 3a25b0d8
        delta_lines: 55
      - name: "连接器匹配"
        description: "每个洞和对应精灵之间有一条彩色连接线段（在背景上绘制），连接线的颜色或方向编码配对关系。解题者需要追踪线段路径来确定配对，引入路径追踪推理，改变了整个解题策略。"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 55

  - id: D2
    name: "匹配条件：旋转/翻转的允许范围"
    tag: match_cond
    current: "rotation — 匹配时允许 8 种旋转/翻转变体（0/90/180/270度旋转 x 是否垂直翻转）"
    alternatives:
      - name: "禁止旋转和翻转（严格形状匹配）"
        description: "精灵必须与洞的形状完全一致，不允许任何旋转或翻转。解题者不再需要心中旋转形状，但需要更精确地辨识方向，辨别看似相似但方向不同的形状。生成时每个洞形状需要保证有至少一个外部精灵与之方向完全一致。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "仅允许旋转不允许翻转"
        description: "匹配时只允许 4 种旋转（0/90/180/270度），禁止翻转。L形、S形等手性形状的镜像版本不再等价，解题者需要区分手性，增加了几何推理的精细度。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "仅允许翻转不允许旋转"
        description: "只允许水平或垂直翻转，不允许旋转。只有轴对称等价的形状才能匹配，旋转90度后不同的形状被视为不同。推理重点从全方位变换缩小到对称轴判断。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "仅允许180度旋转"
        description: "只允许180度旋转（点对称），不允许90度旋转和翻转。许多形状在180度旋转下不等价（如L形），解题者需要判断点对称性，这是一种特殊且不常见的几何约束。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D3
    name: "匹配条件：颜色消歧规则"
    tag: match_cond
    current: "frequency_tiebreak — 当多个不同颜色的精灵匹配同一个洞形状时，选择出现频率最高的颜色填充；频率相同时选数值较小的颜色ID"
    alternatives:
      - name: "最少频率颜色填充（取反）"
        description: "选择匹配精灵中出现频率最低的颜色（而非最高）。解题者需要找到最稀少的颜色，反转了常规的'多数决'直觉，推理时需要注意计数后取最小值。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "唯一颜色填充（无需消歧）"
        description: "每种洞形状只有一种颜色的精灵与之匹配，不存在多颜色竞争。移除消歧步骤使任务更聚焦于纯形状匹配，降低了需要同时关注形状和频率两个维度的认知负担。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "距离优先消歧"
        description: "当多色精灵匹配同一洞形状时，选择离框架最近的精灵颜色（欧氏距离到框架边界最短）。解题者需要估算空间距离来决定颜色，引入了空间推理维度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "尺寸排序消歧"
        description: "当多色精灵匹配同一洞形状时，按精灵所在色组的总面积（该颜色所有匹配精灵的像素总和）排序，取总面积最大的颜色。解题者需要累加面积而非计数个数，计算方式更复杂。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 20

  - id: D4
    name: "源对象：精灵的颜色特征"
    tag: src
    current: "精灵为单色连通分量（每个精灵所有像素同色），6-7种不同精灵颜色，均不等于背景色和框架色"
    alternatives:
      - name: "多色精灵（内部含多种颜色）"
        description: "每个精灵由2-3种颜色组成（如内部有条纹或棋盘格图案），匹配时仅看形状掩码。填充洞时用精灵的主色（面积最大的颜色）。解题者需要从多色对象中提取主色，增加了颜色分析步骤。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "精灵颜色编码方向信息"
        description: "精灵的颜色不仅决定填充色，还编码旋转方向：不同颜色对应不同的旋转角度（如红=0度、蓝=90度、绿=180度、黄=270度）。填充洞时需要按颜色指定的旋转角度放置。推理从纯匹配扩展为颜色-旋转的双重解码。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "精灵含背景色内洞"
        description: "精灵不再是实心块，而是带有背景色内洞的中空形状（如环形、U形）。匹配时比较的是精灵的外轮廓形状与洞的形状。解题者需要从中空精灵中提取外轮廓再与洞比较，增加了抽象步骤。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D5
    name: "源对象：精灵的连通性定义"
    tag: src
    current: "精灵为 8-连通分量提取（包含对角相邻像素），在框架外接矩形之外的区域查找"
    alternatives:
      - name: "4-连通精灵提取"
        description: "精灵改用 4-连通（仅上下左右）提取。对角相邻的像素被视为不同精灵，一些 8-连通下是一个精灵的形状可能分裂为多个。解题者需要用更严格的连通规则分析精灵，对角接触的形状会被误判为多个小精灵。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "按颜色分组后再提取连通分量"
        description: "先按颜色分组，每种颜色内分别提取连通分量。不同颜色的像素即使8-连通也不合并。当前实现已经是 monochromatic=True 类似效果，但改为 monochromatic=False + 后处理主色可以允许混色精灵场景，配合D4的多色精灵方案使用。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 15
      - name: "精灵分布在框架内部而非外部"
        description: "精灵不放在框架外，而是放在框架内部的洞中（每个洞里有一个小精灵作为样本）。外部没有精灵，解题者需要从洞中提取样本精灵并确定填充规则。这是src位置的根本反转。"
        source: inversion
        source_task: null
        delta_lines: 40

  - id: D6
    name: "目标结构：框架的形态"
    tag: dst
    current: "hole_fill — 单个大型单色矩形区域作为框架，bbox 为 7-13行 x 7-20列，框架色密度 0.55-0.92，内含 5-15 个洞"
    alternatives:
      - name: "多个独立框架"
        description: "画布上有 2-3 个独立的小型框架，每个框架内有自己的洞集合。精灵同时服务于所有框架——同一形状的精灵可以填充不同框架中形状相同的洞。输出为多个框架各自裁剪后拼接。解题者需要处理多目标分配问题。"
        source: jigsaw_assembly
        source_task: 8698868d
        delta_lines: 60
      - name: "非矩形框架（L形/T形外轮廓）"
        description: "框架的外接矩形内部不完全被框架色填充，框架整体呈 L形、T形或十字形等非矩形轮廓。洞分布在框架实体部分内。输出仍裁剪为外接矩形但保留框架的不规则轮廓。增加了框架识别的复杂度。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "框架边界不为实心（有缺口）"
        description: "框架的外接矩形边界上有若干缺口（背景色像素），而非完全封闭的实心边框。解题者需要正确识别哪些边界缺口是框架的设计特征（不需要填充），哪些内部空缺是需要填充的洞。增加了洞与边界缺口的辨识难度。"
        source: notch_docking
        source_task: a25697e4
        delta_lines: 35
      - name: "嵌套框架（框中框）"
        description: "框架内部有一个更小的子框架，子框架又有自己的洞。外层洞和内层洞需要分别匹配不同的精灵。解题者需要识别嵌套层级结构并分别处理，引入了层次推理。"
        source: creative
        source_task: null
        delta_lines: 50

  - id: D7
    name: "目标结构：洞的形态与连通性"
    tag: dst
    current: "洞为 4-连通背景色区域，形状 bbox 1x1 到 5x6，面积 1-8 像素，3-6 种不同形状，每种 1-5 个实例"
    alternatives:
      - name: "洞使用 8-连通定义"
        description: "洞从 4-连通改为 8-连通定义。对角相邻的背景色像素也被视为同一个洞，某些 4-连通下独立的小洞合并为一个大的不规则洞。精灵形状也相应变大变复杂，形状匹配的难度增加。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "大型矩形洞（cavity风格）"
        description: "洞不再是小型不规则形状，而是 3x3 到 5x5 的大型矩形空腔。精灵也相应为大型矩形块。匹配条件从复杂形状比较简化为尺寸比较，但每个洞需要更多精灵像素来填充。"
        source: cavity_fill
        source_task: 5dbc8537
        delta_lines: 25
      - name: "洞的形状具有旋转对称性"
        description: "所有洞的形状都被约束为具有旋转对称性（如十字、菱形、正方形），不存在手性区分问题。这使得旋转/翻转匹配变得更简单，但增加了同形状不同尺寸的区分需求。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "洞内含部分框架色像素（分区洞）"
        description: "某些洞内部包含一些框架色像素形成的分隔条，将洞分成多个视觉子区域。匹配时使用整个洞的外形（含分隔条），但填充时只替换背景色像素不替换分隔条。解题者需要理解分隔条是框架的一部分而非需要匹配的形状特征。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D8
    name: "目标结构：框架的对称性"
    tag: dst
    current: "框架内洞的布局具有 LR+UD+rot180 对称性（四重对称），通过在左上象限放置后镜像到其他象限实现"
    alternatives:
      - name: "无对称性约束（自由布局）"
        description: "取消框架内洞的对称性约束，洞可以自由分布在框架内任意位置。这使谜题的视觉规律性降低，解题者不能利用对称性来推断缺失信息，但任务本身的核心逻辑（形状匹配填色）不变。"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "仅左右对称（单轴对称）"
        description: "洞的布局仅具有左右镜像对称性，不要求上下对称。上半部分和下半部分的洞分布可以不同，但左右对称。输出的视觉效果更类似于面部或蝴蝶图案，仍具有规律性但比四重对称更自由。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "旋转对称（仅 rot90）"
        description: "洞的布局具有 90 度旋转对称性而非镜像对称。框架必须是正方形才能实现。洞的排列呈现旋转花纹，视觉上更像万花筒图案，解题者可利用旋转对称推断模式。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D9
    name: "变换：填充操作方式"
    tag: transform
    current: "hole_fill — 每个洞的所有像素统一填充为匹配精灵的最高频颜色，生成纯色填充"
    alternatives:
      - name: "保留精灵内部图案填充"
        description: "不用纯色填充洞，而是将匹配精灵的完整像素图案（经过旋转/翻转对齐后）直接复制到洞的位置。如果精灵是多色的则保留多色。解题者需要理解图案搬运而非颜色提取，推理更具体和直观。"
        source: pattern_stamping
        source_task: a395ee82
        delta_lines: 30
      - name: "渐变填充（多色梯度）"
        description: "每个洞按匹配精灵中各颜色的频率比例进行分区填充：面积最大的颜色占洞中最多像素，第二多的占次多，依此类推。填充顺序从洞的左上角到右下角按行扫描。解题者需要理解频率→面积的映射关系。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "填充色为精灵色与框架色的交换"
        description: "填充时不使用精灵原色，而是将精灵色映射到另一种颜色（如通过画布上的颜色映射表/图例定义）。解题者需要先解读颜色映射表，再应用映射后的颜色填充洞，增加了间接推理步骤。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 30
      - name: "条件性填充（仅填充部分洞）"
        description: "只填充有精灵匹配的洞，没有任何精灵匹配的洞保持背景色不变（而非填充框架色）。在输出中可以看到哪些洞被成功匹配、哪些没有。解题者需要判断哪些洞有匹配哪些没有。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D10
    name: "输出裁剪方式"
    tag: grid_shape
    current: "tight_crop — 输出裁剪到框架的外接矩形大小（th x tw），从纯框架色开始，填充各洞"
    alternatives:
      - name: "保留完整网格输出"
        description: "输出与输入同尺寸（30x30），精灵从画布上消失，框架内的洞被填充，其余区域保持背景色。解题者需要理解'精灵消失+洞被填充'的整体变换，而非仅关注框架区域。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "仅输出洞的区域（去除框架色）"
        description: "输出中去除所有框架色像素，仅保留洞的填充结果。可以用背景色替代框架色位置，或紧密裁剪到所有洞的最小外接矩形。解题者需要理解输出只展示'结果'而非完整框架。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "扩展输出（框架外扩一圈边框）"
        description: "输出在框架外接矩形的基础上向四周各扩展1-2像素的框架色边框。输出尺寸略大于框架 bbox。解题者需要推断扩展量，增加了对边界处理规则的理解。"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 10

  - id: D11
    name: "精灵数量与洞的对应关系"
    tag: meta
    current: "many:1 — 每种洞形状对应多个精灵（2-13个，多种颜色），通过频率消歧选择填充色"
    alternatives:
      - name: "1:1 精确对应"
        description: "每种洞形状恰好对应一个精灵，无需消歧。颜色直接确定。任务简化为纯形状匹配问题，适合作为较简单的变体。每种洞形状仅出现一次，精灵颜色唯一。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "1:many — 一个精灵填充多个洞"
        description: "画布上每种形状只有一个精灵，但框架内有多个相同形状的洞。该精灵的颜色同时填充所有匹配的洞。解题者需要理解'一对多'的广播关系，而非当前的'多对一'聚合关系。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "many:many — 多精灵分别填充多洞（位置对应）"
        description: "同形状的多个精灵和多个洞之间存在位置对应关系：如精灵按从左到右排序对应洞从左到右排序，每个精灵填充对应位置的洞。不同精灵可以是不同颜色，因此同形状的洞可能填充不同颜色。解题者需要推断排序-对应规则。"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D12
    name: "干扰项设计"
    tag: meta
    current: "存在 0-1 个干扰精灵（形状不匹配任何洞的精灵），以及同形状不同颜色的'输'精灵作为颜色干扰"
    alternatives:
      - name: "大量干扰精灵"
        description: "增加 3-5 个形状不匹配任何洞的干扰精灵，且干扰精灵的形状与真实精灵相似但不完全相同（如多一个像素或少一个像素）。解题者需要更精确地比较形状，增加了形状辨识的难度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "无干扰项（纯净匹配）"
        description: "移除所有干扰精灵，画布上每个精灵都恰好匹配某个洞。简化了精灵筛选过程，使解题者可以直接进行匹配而无需排除无关精灵。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "框架内含干扰洞"
        description: "框架内部存在一些'假洞'——由非背景色的特殊颜色像素构成的区域，视觉上类似洞但不应被填充。解题者需要区分真正的背景色洞和伪装的假洞，增加了目标辨识难度。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D13
    name: "精灵与框架的空间关系"
    tag: meta
    current: "精灵完全位于框架 bbox 外部，与框架和其他精灵之间保持至少 1 像素的切比雪夫距离间隔"
    alternatives:
      - name: "精灵可紧贴框架边界"
        description: "取消精灵与框架之间的间隔约束，精灵可以直接紧贴框架边缘放置（但不重叠）。解题者需要仔细区分框架边缘像素和紧贴的精灵像素，对象分割更具挑战性。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "精灵分布在网格的固定区域"
        description: "精灵只能出现在网格的特定区域（如左侧列、上方行，或四个角落），而非随机散布在框架周围。解题者需要识别精灵的分布模式，这也为后续变体中的位置编码信息创造了可能。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "精灵按颜色分区排列"
        description: "同颜色的精灵聚集在网格的同一区域（如所有红色精灵在左上角，蓝色在右下角），不同颜色区域间有明显的空间分隔。这不改变匹配逻辑，但使视觉模式更有规律，解题者可利用空间分区辅助颜色识别。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D14
    name: "框架色的角色"
    tag: meta
    current: "框架色为单一非背景色，在输出中填充所有非洞区域，构成实心模板"
    alternatives:
      - name: "框架色为多色渐变"
        description: "框架不是单色而是由 2 种颜色交替组成（如棋盘格或条纹图案）。洞的识别从'非框架色=背景色'变为'非框架两色之一=背景色'。输出中保留框架的多色图案。解题者需要识别两色框架模式。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "框架色与背景色在输出中交换"
        description: "输出中框架色的位置变为背景色，洞的填充色不变。视觉上输出呈现'反色'效果。解题者需要理解这个颜色反转规则，增加了变换理解的难度。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "框架色由精灵总数编码"
        description: "框架色不是预设的，而是由画布上精灵的总数量决定（例如精灵总数对应颜色编号）。输出中使用该推导出的颜色填充框架区域。解题者需要先计数再确定框架色，增加了间接推理。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D15
    name: "网格尺寸与框架占比"
    tag: meta
    current: "固定 30x30 网格，框架 bbox 7-13行 x 7-20列，框架色密度 0.55-0.92"
    alternatives:
      - name: "小网格紧凑布局"
        description: "缩小为 15x15 或 20x20 网格，框架相应缩小，精灵数量减少。每个精灵和洞更小（1-3像素），匹配更快但辨识更难。测试解题者在低分辨率下的形状辨识能力。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "非正方形网格"
        description: "网格从正方形改为矩形（如 20x30 或 15x25）。框架和精灵的分布需要适应不对称的空间，长边方向有更多精灵放置空间。视觉比例变化影响解题者的空间感知。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "框架占据大部分网格"
        description: "框架 bbox 增大到几乎填满网格（如 25x25 在 30x30 中），仅留很小的边缘空间放置精灵。精灵必须非常紧凑地排列在窄边上。解题者面临极端的空间约束，对象分割更具挑战性。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D16
    name: "多步处理：填充顺序"
    tag: multi_step
    current: "单步处理——所有洞独立并行填充，填充顺序不影响结果"
    alternatives:
      - name: "迭代填充（先填大洞再填小洞）"
        description: "洞按面积从大到小排序依次填充。每次填充后重新计算剩余精灵的频率（已用于填充的精灵从计数中移除）。解题者需要理解迭代消耗机制——先填的洞'消费'了精灵，影响后续洞的颜色选择。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "链式填充（洞的填充结果影响下一个洞）"
        description: "洞按某种空间顺序（如从左上到右下的扫描顺序）依次处理。前一个洞的填充颜色会被加入下一个洞的精灵候选池（相当于'传递'颜色）。解题者需要追踪颜色在洞之间的传递链。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "两阶段处理：先匹配形状再查表填色"
        description: "第一阶段在框架外有一个颜色映射图例（如 2xN 的色块对，左列为精灵色右列为填充色）。精灵的颜色确定后，通过查表映射为最终的填充色。解题者需要先做形状匹配确定精灵色，再做颜色映射确定填充色，两步推理。"
        source: legend_lookup
        source_task: 58490d8a
        delta_lines: 35

  - id: D17
    name: "符号编码：颜色图例系统"
    tag: symbol_instructions
    current: "无显式图例——精灵颜色直接作为填充色使用，频率即为隐式编码"
    alternatives:
      - name: "显式颜色图例（legend）"
        description: "在网格边缘放置一个颜色图例区域（如角落的 2xN 色块矩阵），每行定义一个'精灵色→填充色'映射。精灵原色不直接填充洞，而是通过图例查表得到最终填充色。解题者需要先解读图例再执行填充。"
        source: legend_lookup
        source_task: 58490d8a
        delta_lines: 35
      - name: "形状-颜色编码表"
        description: "在网格一侧放置若干小型'样本块'，每个样本块展示一种洞形状及其对应的填充色（形状用颜色A绘制在颜色B的背景上，B即为填充色）。解题者从样本块中学习形状→颜色的映射规则，而非从频率推断。"
        source: rule_learning
        source_task: 4c7dc4dd
        delta_lines: 45
      - name: "精灵数量编码洞的填充色"
        description: "每种形状对应的精灵数量（而非最频繁颜色）编码填充色：如3个精灵=颜色3，5个精灵=颜色5。精灵可以是任意颜色，只有数量有意义。解题者需要计数精灵而非比较颜色，推理方式从颜色识别转为数值计数。"
        source: hole_counting
        source_task: 8698868d
        delta_lines: 25

  - id: D18
    name: "洞形状库的多样性"
    tag: meta
    current: "使用预定义的形状库（矩形、L形、T形、十字形等 16 种基础形状），3-6 种被选入每道题"
    alternatives:
      - name: "仅使用凸形状"
        description: "限制洞形状只能是凸形（矩形、菱形等，外轮廓无凹入），排除 L形、T形等凹形。凸形状的旋转/翻转变体较少，降低了匹配的歧义性，但也减少了形状多样性。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "仅使用多联骨牌形状"
        description: "所有洞形状必须是标准多联骨牌（polyomino），从三联到五联，每个都是由正方形单元格组成的连通形状。使用经典数学对象增加了教育价值和规范性。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "随机生成洞形状（非预定义库）"
        description: "不使用预定义形状库，而是随机生成连通的布尔掩码作为洞形状（在 bbox 约束内随机标记像素并确保连通性）。每道题的形状完全唯一，解题者无法预期可能出现哪些形状。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "所有洞相同形状但不同大小"
        description: "只有一种基础形状（如 L形），但以不同的缩放比例出现（1x、2x、3x）。匹配条件从形状等价变为'缩放后形状等价'。精灵也有对应的缩放变体。解题者需要识别跨尺度的形状一致性。"
        source: scaling
        source_task: b10624e5
        delta_lines: 40
