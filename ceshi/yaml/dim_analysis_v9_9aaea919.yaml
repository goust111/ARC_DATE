task_id: 9aaea919
task_type: move_to_match
summary: "红色标记条标识源车道，绿色标记条标识目标车道；将源车道的十字精灵移至目标车道底部向上堆叠，重新着色为目标车道颜色，原位精灵变灰，标记条消除"

dimensions:
  - id: D1
    name: "匹配条件机制"
    tag: match_cond
    current: "marker_pixels — 红色(2)标记条标识源车道，绿色(3)标记条标识目标车道，通过标记颜色直接指定源和目标"
    alternatives:
      - name: "颜色匹配替代标记"
        description: "取消红/绿标记条，改为在网格边缘放置一个与某车道精灵同色的小色块作为'选中指示'。源车道由边缘色块的位置(左侧=源)标识，目标车道由另一侧(右侧)色块标识。解题者需要从边缘色块与车道精灵的颜色对应关系推断源/目标，推理链更长"
        source: color_match
        source_task: 2c181942
        delta_lines: 35
      - name: "精灵数量匹配决定角色"
        description: "无标记条。精灵数量最多的车道为目标，精灵数量最少的车道为源。若存在并列则按车道从左到右消歧。解题者需要先统计每条车道的精灵数量再推断源/目标角色，引入了计数推理"
        source: count_match
        source_task: 6e4f6532
        delta_lines: 30
      - name: "车道位置关系决定角色"
        description: "无标记条。最左侧车道始终为源，最右侧车道始终为目标(或反之)。解题者需从示例中归纳出位置-角色映射规则。简单但容易过度拟合"
        source: column_row_alignment
        source_task: 8b9c3697
        delta_lines: 20
      - name: "精灵颜色大小关系决定角色"
        description: "无标记条。颜色数值最小的车道精灵为源，颜色数值最大的为目标——但因为人类看到的是可视化颜色而非数字，改为: 精灵所在车道中存在一个额外的'指示像素'(不同于精灵色的单像素)，指示像素色为红则该车道为源，为绿则为目标。指示像素嵌入在精灵间的空隙行中"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "连接线匹配"
        description: "取消标记条，改为在源车道和目标车道之间画一条细连接线(使用第三种颜色)，连线从源车道底部精灵延伸到目标车道底部。解题者需要识别连接线并推断转移方向(从线的起始端到终止端)"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 40

  - id: D2
    name: "源对象类型"
    tag: src
    current: "十字/菱形精灵(3x5外接矩形，11像素)，每车道单色，均匀垂直排列"
    alternatives:
      - name: "矩形色块精灵"
        description: "精灵形状从十字改为实心矩形(如3x3或2x4)。形状更简单但减少了形状识别的挑战性，解题者需要适应不同的空间占用模式"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "T形精灵"
        description: "精灵形状改为T形(如3x3外接矩形中的T型排列，7像素)。非对称形状增加了形状匹配的难度，且堆叠时方向一致性需要关注"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "每车道不同形状精灵"
        description: "四条车道使用四种不同形状的精灵(十字、T形、L形、方块)。转移时精灵保持原始形状但改变颜色。解题者需要同时追踪形状保持和颜色变换两个规则"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "多色精灵"
        description: "每个精灵由两种颜色组成(如十字的中心行一种色，上下行另一种色)。转移后两种颜色都改为目标车道的对应双色方案。增加了颜色映射的复杂度"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D3
    name: "目标位置与堆叠规则"
    tag: dst
    current: "stacking — 新精灵在目标车道底部已有精灵之上，按周期4(3精灵行+1间隙行)向上堆叠空槽位"
    alternatives:
      - name: "顶部向下堆叠"
        description: "新精灵不是从底部向上堆叠，而是从目标车道顶部向下填充空槽位。解题者需要注意填充方向的反转，推理从'底部优先'变为'顶部优先'"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "交错插入"
        description: "新精灵不堆叠在已有精灵的上方/下方，而是插入到已有精灵之间的空槽位中。如果已有精灵分布不连续(中间有空槽)，优先填补中间空缺。解题者需要识别'填空'逻辑而非简单堆叠"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "重力堆叠到指定行"
        description: "目标车道中存在一条水平分界线(用背景色以外的颜色画出)，新精灵堆叠到分界线上方而非车道底部。解题者需要先识别分界线位置再确定堆叠起点"
        source: gravity
        source_task: 62593bfd
        delta_lines: 30
      - name: "均匀分散放置"
        description: "新精灵不紧密堆叠，而是均匀分散在目标车道的所有可用槽位中(如果有6个空槽需放3个精灵，则每隔一个槽放一个)。解题者需要计算间距规则"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "颜色变换规则"
    tag: transform
    current: "color_transfer — 转移的精灵重新着色为目标车道的原有精灵颜色；源车道精灵变灰(5)"
    alternatives:
      - name: "保持源颜色不变"
        description: "转移的精灵保持源车道的原始颜色(不重着色为目标车道色)，但源车道精灵仍变灰。输出中目标车道会出现两种颜色的精灵，解题者需要注意'颜色保持'而非'颜色转换'"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "源精灵消失而非变灰"
        description: "源车道的精灵被完全擦除(变为背景色)而非变灰。解题者需要理解'消失'而非'变灰'的语义，且输出中缺少灰色线索使得反向推理更难"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 10
      - name: "双向颜色交换"
        description: "源车道精灵变为目标车道颜色，同时目标车道已有精灵变为源车道颜色(颜色互换)。解题者需要同时追踪两个方向的颜色变换"
        source: color_swap
        source_task: a25697e4
        delta_lines: 20
      - name: "源精灵变为目标车道色"
        description: "源车道的原有精灵不变灰，而是变为目标车道的颜色。这样源车道和目标车道最终都显示目标车道色的精灵。解题者需要理解'统一着色'的变换逻辑"
        source: creative
        source_task: null
        delta_lines: 15

