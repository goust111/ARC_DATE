task_id: 9385bd28
task_type: move_to_match
summary: "根据左下角颜色图例查找同色对角标记对，用图例映射的填充色填充标记对之间的矩形区域"

dimensions:
  - id: D1
    name: "匹配条件：标记对角线的配对方式"
    tag: match_cond
    current: "diagonal_markers — 同色 L 形角标记位于外接矩形的对角，通过 L 形朝向判定哪条对角线是标记对角线、哪条是填充对角线"
    alternatives:
      - name: "颜色+形状联合匹配"
        description: "标记不再是固定的 L 形角，而是不同形状（如 T 形、十字形），每对标记需同色且同形才配对。解题者需要同时比对颜色和形状两个属性，推理复杂度提升。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 40
      - name: "连接器匹配替代对角匹配"
        description: "标记对之间通过一条同色线段（连接器）相连，配对关系由连接器直接指示而非对角位置推断。解题者需要追踪连接线路径来确认配对，从空间推理转为路径追踪。"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 45
      - name: "大小编码匹配"
        description: "同色标记有大小变体（如 2 像素 vs 3 像素的 L 角），大标记与小标记配对形成矩形。解题者需要先按颜色分组，再按大小配对，增加了数值比较步骤。"
        source: size_match
        source_task: 2c181942
        delta_lines: 30
      - name: "行列对齐匹配"
        description: "配对不再要求对角关系，而是同色标记通过共享行或共享列来配对（如一个标记在某行、另一个在某列，交叉点定义填充区域）。解题者需要发现行列交叉逻辑。"
        source: column_row_alignment
        source_task: 8b9c3697
        delta_lines: 35
      - name: "镜像对称匹配"
        description: "标记对不是对角配对，而是关于某条对称轴（如网格中心线）镜像放置。填充区域由两个镜像标记共同确定的对称区域定义。解题者需要先发现对称轴再推断填充规则。"
        source: mirror_symmetry
        source_task: 4c416de3
        delta_lines: 45

  - id: D2
    name: "源对象：标记的形状结构"
    tag: src
    current: "L 形 3 像素角标记，位于外接矩形的对角两端（共 6 像素）；另有 2x2 实心方块变体"
    alternatives:
      - name: "单像素标记替代 L 形角"
        description: "标记简化为单个像素而非 L 形角。对角线判定需要用其他方式（如标记在外接矩形角的精确位置）。大幅简化视觉复杂度，但解题者需在更稀疏的线索中识别配对关系。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "十字形标记"
        description: "标记改为 5 像素十字形（中心+上下左右），两个十字形标记定义矩形的对角。视觉上更显眼但占用更多空间，解题者需适应不同的标记形态。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "线段标记（水平/垂直短线）"
        description: "标记改为 3-4 像素的水平或垂直线段，放置在外接矩形的边缘中点或端点。解题者需要从线段方向和位置推断矩形的范围，推理路径从角检测转为边检测。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "边框标记（矩形边的一段）"
        description: "标记不再是角标记，而是矩形某条边上的一段连续像素（如顶边的左半段和底边的右半段）。解题者需要从部分边信息推断完整矩形，增加了空间推断难度。"
        source: boundary_detection
        source_task: 71e489b6
        delta_lines: 40

  - id: D3
    name: "目标对象：填充区域的形状"
    tag: dst
    current: "标记对角线的对边对角线上所有最短路径像素（菱形/矩形填充区域）"
    alternatives:
      - name: "完整矩形填充（含标记区域）"
        description: "填充整个外接矩形而非仅对角线上的菱形区域，标记像素也被覆盖。简化了填充逻辑但改变了保留标记的语义，解题者需理解'标记被吞没'。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "仅填充矩形边框"
        description: "不填充矩形内部，仅沿矩形四条边画线。与当前的区域填充相反，解题者需要理解从'填充'到'描边'的变化。视觉效果截然不同——产生空心矩形而非实心区域。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "填充扩展到标记外一圈"
        description: "填充区域在原矩形基础上向外扩展一个像素的边距。解题者需要发现填充范围超出标记对定义的矩形，推断扩展规则。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "填充区域为标记之间的对角带状"
        description: "仅填充从一个标记到另一个标记的对角线路径（1-2像素宽的斜线），而非整个矩形区域。从区域填充变为路径绘制，视觉和推理模式完全不同。"
        source: line_fill
        source_task: 16de56c4
        delta_lines: 30

  - id: D4
    name: "图例查找与颜色映射"
    tag: symbol_instructions
    current: "左下角垂直排列的颜色对图例：左列为标记色，右列为填充色；从下到上读取处理顺序"
    alternatives:
      - name: "图例放置在网格边缘任意位置"
        description: "图例不固定在左下角，而可能在任意一个角落或边缘（右下、左上、右上均可能）。解题者需要先定位图例位置，增加了搜索和识别步骤。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "图例为水平排列"
        description: "图例改为水平排列（上行标记色、下行填充色）而非垂直堆叠。读取方向从下到上改为从左到右或从右到左。视觉布局和解析逻辑均需调整。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "三列图例增加变换参数"
        description: "图例扩展为三列：标记色、填充色、变换类型色（如第三列颜色编码填充模式——实心填充 vs 条纹填充 vs 棋盘格填充）。解题者需要解读更复杂的图例结构，增加了符号解码的深度。"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "隐式颜色映射（无图例）"
        description: "移除显式图例，填充颜色通过标记色在 palette 中的位置关系推断（如填充色 = 标记色 + 1 mod 10，或为标记色对应的互补位置）。解题者需要发现隐含的数学映射规则。"
        source: inversion
        source_task: null
        delta_lines: 35

  - id: D5
    name: "填充变换方式"
    tag: transform
    current: "rectangle_fill — 用图例对应的填充色填充标记对之间的菱形区域；2x2 方块直接重新上色"
    alternatives:
      - name: "渐变填充（多色过渡）"
        description: "填充区域不是单一颜色，而是从一个标记处的颜色渐变到另一个标记处的颜色（使用图例中相邻条目的颜色）。解题者需要理解颜色过渡规则，从简单填充升级为渐变逻辑。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "条纹填充替代实心填充"
        description: "填充区域使用填充色和背景色交替的条纹图案（水平或垂直方向）而非纯色填充。解题者需要发现条纹规律，视觉上更复杂但规则是确定性的。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "棋盘格填充"
        description: "填充区域使用填充色和另一种颜色（如背景色或标记色）形成棋盘格图案。解题者需要识别棋盘格模式并推断使用的两种颜色，增加了模式识别维度。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "标记色与填充色互换"
        description: "填充后标记像素变为填充色，同时原填充区域内已有的非背景像素变为标记色——实现颜色互换。解题者需理解双向变换语义。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 25
      - name: "填充后擦除标记"
        description: "填充完成后，标记像素被擦除为背景色（当前是保留标记像素）。解题者需理解'标记是临时的构造辅助'语义，视觉上填充区域更干净。"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 15

  - id: D6
    name: "处理顺序与重叠规则"
    tag: multi_step
    current: "ordered_processing — 图例条目从下到上顺序处理，后处理的条目覆盖先处理的；保护后续条目的标记像素和图例区域"
    alternatives:
      - name: "从上到下处理（反转顺序）"
        description: "图例仍从下到上读取，但处理顺序反转为从上到下。这改变了重叠冲突的解决方式，解题者需要发现处理优先级与图例阅读方向不一致的规则。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "按标记对面积排序处理"
        description: "不按图例位置顺序，而是按标记对定义的矩形面积从小到大（或从大到小）处理。解题者需要先计算每个矩形面积再确定处理顺序，增加了数值计算步骤。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 25
      - name: "无重叠保证（所有矩形互不相交）"
        description: "生成时保证所有标记对的矩形互不重叠，消除处理顺序的影响。简化了规则但减少了推理深度。适合作为入门级变体。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "重叠区域使用混合色"
        description: "当两个填充矩形重叠时，重叠区域不由处理顺序决定，而是使用两种填充色的'混合'——用第三种颜色（图例中额外指定）表示。解题者需要理解颜色叠加规则。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "迭代处理（填充结果触发新标记识别）"
        description: "第一轮填充后，新产生的颜色区域可能形成新的标记对（因为填充色恰好是另一个图例条目的标记色），触发第二轮处理。解题者需要理解迭代链式效应。"
        source: chaining
        source_task: 78332cb0
        delta_lines: 50

