task_id: b99e7126
task_type: move_to_match
summary: "在由重复3x3单元格铺成的网格中找到唯一异常单元格，提取其内部颜色图案并分形放大（每个像素映射为一个单元格大小），定位后叠加覆盖到原始网格上"

dimensions:
  - id: D1
    name: "匹配条件：异常单元格的识别方式"
    tag: match_cond
    current: "通过比较所有单元格的内部颜色图案，找到与多数单元格图案不同的那个唯一异常单元格"
    alternatives:
      - name: "频率最低的图案类型作为源"
        description: "网格中存在3种以上不同的单元格图案，选取出现频率最低的那种作为需要放大的图案。解题者需统计所有图案的出现次数并排序，推理难度从简单异常检测升级为频率排序"
        source: frequency_tiebreak
        source_task: 67e490f4
        delta_lines: 20
      - name: "颜色匹配：异常单元格的特定颜色标记"
        description: "不再依赖图案差异检测，而是通过单元格中包含某个特定标记颜色（如红色像素）来识别源单元格。解题者需发现标记颜色的含义而非进行图案对比"
        source: color_match
        source_task: 2c181942
        delta_lines: 15
      - name: "位置规则选择：选取特定位置的单元格"
        description: "源单元格不是唯一异常的那个，而是位于网格中特定位置（如中心、角落、或满足对称性条件的位置）的单元格。解题者需推断位置选择规则而非图案差异"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "对称性破缺检测：找打破对称性的单元格"
        description: "网格整体具有某种对称性（如镜像对称或旋转对称），异常单元格是唯一打破该对称性的那个。解题者需先识别全局对称性模式再找到破缺点"
        source: mirror_symmetry
        source_task: 4c416de3
        delta_lines: 25
      - name: "形状匹配：单元格内部图案的几何形状特征"
        description: "不是通过像素级别的图案差异来识别异常，而是根据单元格内部图案形成的几何形状（如L形、T形等连通结构）来分类，形状类别唯一的那个为源。解题者需进行形状识别而非像素比较"
        source: shape_match
        source_task: 16b78196
        delta_lines: 20

  - id: D2
    name: "源对象：异常单元格的内部图案结构"
    tag: src
    current: "唯一异常的3x3单元格的内部颜色像素图案，包含两种颜色（前景色和背景色）"
    alternatives:
      - name: "多个异常单元格共同构成源图案"
        description: "网格中存在2-3个异常单元格，它们的内部图案需要组合（如叠加或拼接）形成完整的源图案再进行放大。解题者需发现多个异常单元格并理解组合规则"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "异常单元格内图案使用三种颜色"
        description: "单元格内部图案不限于两种颜色，而是使用三种不同颜色。放大后每种颜色对应不同的覆盖行为，增加颜色映射复杂度"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "非正方形单元格（如4x3或2x5矩形）"
        description: "铺贴单元格不再是正方形而是矩形，放大时行列缩放因子不同。解题者需分别推断两个方向的铺贴周期和缩放比"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "源图案需要旋转/翻转后才能使用"
        description: "异常单元格的图案在放大叠加前需要经过特定的旋转或翻转变换（由其在网格中的位置决定，如左上角区域翻转、右下角旋转180度）。解题者需推断位置与变换的对应关系"
        source: rotation_flip
        source_task: a25697e4
        delta_lines: 25

  - id: D3
    name: "目标位置：放大图案的叠加定位方式"
    tag: dst
    current: "放大后的图案定位使得源单元格位置与放大图案中对应的单元格重合，即以异常单元格为锚点对齐"
    alternatives:
      - name: "放大图案居中放置在整个网格上"
        description: "放大图案不以异常单元格为锚点，而是居中对齐到整个网格的中心。解题者需理解全局居中而非局部锚定的定位逻辑"
        source: centering
        source_task: 58f5dbd5
        delta_lines: 15
      - name: "放大图案铺满整个网格（完全覆盖）"
        description: "放大后的图案缩放至与整个网格同样大小并完全覆盖，源图案的每个像素对应网格中的一整行/列的单元格。解题者需理解不同比例的缩放映射"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "锚点由另一个特殊标记单元格确定"
        description: "除异常单元格外，网格中还有另一个用不同方式标记的单元格（如包含特定颜色的单个像素），该标记单元格的位置决定放大图案的放置锚点。解题者需识别两种不同类型的特殊单元格"
        source: marker_alignment
        source_task: 581f7754
        delta_lines: 25
      - name: "多次叠加：图案在多个位置重复放置"
        description: "放大图案不止叠加一次，而是在多个位置（如所有角落，或所有满足特定条件的位置）重复放置。多次叠加可能产生重叠区域，需要处理覆盖优先级"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "变换：分形缩放的方式"
    tag: transform
    current: "将异常单元格的NxN内部图案放大，使每个像素对应原网格中一个NxN单元格大小的区域"
    alternatives:
      - name: "递归分形缩放：放大后的图案中再嵌套原始图案"
        description: "进行两级分形放大——先将图案放大一次，然后在放大图案中每个活跃单元格内再嵌入原始微缩图案。形成更深层次的自相似结构，视觉上极具分形美感，推理复杂度显著提高"
        source: fractal_tiling
        source_task: a32d8b75
        delta_lines: 35
      - name: "反向分形：将多数单元格的图案缩小嵌入异常单元格位置"
        description: "不是放大异常图案，而是将多数单元格的'正常'图案缩放后嵌入异常单元格所在位置，使其与周围一致。取反了放大逻辑的方向，解题者需理解'修复异常'而非'放大异常'"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "非均匀缩放：行和列使用不同的放大倍数"
        description: "放大时行方向使用M倍而列方向使用N倍（M不等于N），产生拉伸效果。缩放比可以由单元格的行列尺寸比决定，解题者需分别推断两个方向的缩放因子"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "像素级放大而非单元格级放大"
        description: "每个像素不是映射为一个单元格大小的区域，而是映射为单个像素或2x2像素块。放大倍数更小，输出网格尺寸变化不大，但空间推理需要更精确"
        source: pixel_enlargement
        source_task: bf45cf4b
        delta_lines: 15

  - id: D5
    name: "变换：叠加时的覆盖规则"
    tag: transform
    current: "放大图案中非背景色的单元格覆写原始网格中对应位置的单元格内容"
    alternatives:
      - name: "仅覆盖与原图案不同的区域"
        description: "放大图案只在与原始网格不同的位置进行覆写，相同的位置保持不变。解题者需理解差异检测和选择性覆盖的逻辑"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "颜色混合叠加：叠加区域使用新颜色"
        description: "叠加时不是简单覆写，而是根据原始颜色和叠加颜色的组合映射到第三种颜色（如蓝+红=紫）。解题者需推断颜色混合映射表"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "擦除式叠加：放大图案的活跃区域变为背景色"
        description: "取反覆盖逻辑——放大图案中前景色对应的位置在原网格中被擦除为背景色，而非写入新颜色。效果是在网格上'挖出'分形形状的洞"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 10
      - name: "颜色交换叠加：叠加区域内的颜色进行对换"
        description: "叠加时不引入新颜色，而是将叠加区域内原始单元格的两种颜色互相交换。视觉上产生图案反转效果，解题者需发现颜色对换规则"
        source: color_swap
        source_task: a25697e4
        delta_lines: 15

  - id: D6
    name: "网格铺贴结构：单元格的重复模式"
    tag: tiling
    current: "整个网格由完全相同的NxN单元格无缝平铺，只有一个单元格图案不同"
    alternatives:
      - name: "棋盘式双图案铺贴"
        description: "网格使用两种不同的单元格图案交替铺贴（如棋盘格排列），异常单元格是第三种图案。解题者需先识别两种基本图案的交替规则，再找出不属于任何一种的异常单元格"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "行列交替的条带式铺贴"
        description: "相邻行（或列）使用不同的单元格图案交替排列，形成水平/垂直条带。异常单元格打破了行级别的重复规律。解题者需识别条带方向和行间变化规则"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "渐变铺贴：单元格图案沿某方向逐渐变化"
        description: "单元格图案不完全相同，而是沿行或列方向发生规律性的渐变（如逐行旋转90度），异常单元格是不符合渐变规律的那个。解题者需发现全局变化趋势"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "带边框的单元格铺贴"
        description: "每个单元格之间有1像素宽的分隔线（类似网格线），单元格有效内容区缩小为(N-1)x(N-1)。解题者需先识别边框结构再提取单元格内容"
        source: creative
        source_task: null
        delta_lines: 15

