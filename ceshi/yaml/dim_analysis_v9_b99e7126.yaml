        description: "网格中有多个异常单元格，按照特定顺序（如从左上到右下）依次对每个异常进行分形放大和叠加，后续叠加可能覆盖先前结果。解题者需推断处理顺序和覆盖优先级"
        source: creative
        source_task: null
        delta_lines: 25

