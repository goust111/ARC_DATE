      - name: "嵌套层级的单元格：大单元格内包含小单元格"
        description: "网格有两级铺贴结构——大单元格（如6x6）由更小的子单元格（如3x3）组成。异常可能发生在任一层级，解题者需理解层级结构"
        source: creative
        source_task: null
        delta_lines: 35

