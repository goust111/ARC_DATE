    alternatives:
      - name: "多个异常单元格：每个包含不同图案"
        description: "网格中有2-3个异常单元格，每个有不同的内部图案，需要将它们的图案分别放大并叠加。解题者需找出所有异常并理解每个的独立变换"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "多个相同异常单元格：图案相同但位置不同"
