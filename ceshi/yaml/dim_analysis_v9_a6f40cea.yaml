task_id: a6f40cea
task_type: move_along_path
summary: "在封闭矩形框架外部的开放矩形框架触点之间，于框架内部绘制曼哈顿L形路径（单色或双色交替），最终裁剪输出框架内部区域"

dimensions:
  - id: D1
    name: "路径形态"
    tag: path
    current: "两端点间的曼哈顿L形路径（一个拐角，由水平段+垂直段组成），拐角选择使其严格位于内部而非边缘"
    alternatives:
      - name: "对角线路径连接"
        description: "将L形曼哈顿路径替换为45度对角线路径直连两端点。解题者需要推断对角连接规则而非直角转弯规则，视觉上产生斜线而非水平垂直组合，推理模式完全不同"
        source: diagonal_path
        source_task: 35ab12c3
        delta_lines: 30
      - name: "最短路径绕障"
        description: "在内部区域放置障碍色块，路径需要绕过障碍找最短曼哈顿路径连接两端点。增加了路径规划的推理难度，解题者需同时考虑障碍避让和路径连接"
        source: shortest_path
        source_task: 7b0280bc
        delta_lines: 45
      - name: "螺旋路径"
        description: "路径从一个端点出发沿螺旋形（每次碰到边界或已有路径就转90度）前进直到到达另一端点。大幅增加推理复杂度，视觉上产生有趣的螺旋图案"
        source: spiral_path
        source_task: da515329
        delta_lines: 50
      - name: "直线路径（仅水平或垂直）"
        description: "限制两端点必须共行或共列，路径为直线段而非L形。简化了路径形状但要求解题者识别这一约束，端点布局成为关键线索"
        source: straight_ray
        source_task: 221dfab4
        delta_lines: 20
      - name: "双拐角Z形路径"
        description: "路径使用两个拐角形成Z形或S形（三段折线），两个拐角位置由端点坐标的对称关系确定。增加路径复杂度，形成更有趣的视觉图案"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D2
    name: "轨迹着色模式"
    tag: trajectory
    current: "单色组件用纯色填充路径；双色组件用两色交替填充，相位由端点颜色锚定"
    alternatives:
      - name: "周期性图案铺设"
        description: "将开放框架外部的颜色图案作为周期性tile沿路径重复铺设，周期长度由开放框的某个属性（如边长）编码。解题者需同时推断周期规则和长度来源"
        source: periodic_tiling
        source_task: 53fb4810
        delta_lines: 30
      - name: "颜色循环（多于2色）"
        description: "允许开放框架使用3种或更多颜色循环排列，内部路径也使用相同的多色循环。增加了颜色序列推理的复杂度"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 25
      - name: "间歇跳跃轨迹"
        description: "路径不再连续填充，而是每隔N个像素填充一次（N由外部框架的某种属性决定），产生虚线效果。解题者需推断间距规则"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 20
      - name: "反射变色"
        description: "路径在拐角处颜色发生变化——拐角前用一种颜色，拐角后用另一种颜色。将拐点作为颜色分界的触发条件，推理逻辑更清晰但规则不同"
        source: color_change_on_bounce
        source_task: 142ca369
        delta_lines: 15
      - name: "长度保持轨迹"
        description: "内部路径的涂色像素总数必须等于外部开放框架的像素数，多余路径留空、不足则截断。解题者需计数外部像素并匹配"
        source: length_preservation
        source_task: 88bcf3b4
        delta_lines: 25

  - id: D3
    name: "源对象类型"
    tag: src
    current: "外部开放矩形框架（L形：2条完整边+2条截断stub；或U形：3条完整边），通过触碰闭合框边来标记端点位置"
    alternatives:
      - name: "箭头形状指示方向"
        description: "用箭头形精灵替代开放矩形框，箭头指向方向表示路径的第一段方向（水平或垂直），箭头位置标记起点。解题者需要同时解读方向和位置信息"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 40
      - name: "边缘控制像素对"
        description: "用网格边缘上的成对单像素替代开放矩形框，像素颜色指定路径颜色，像素的行/列坐标投影到内部作为端点。极简输入编码，推理难度在于理解投影规则"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 35
      - name: "对角像素对暗示端点"
        description: "用对角方向上的同色像素对指定路径的两个端点，端点坐标为对角像素对定义的矩形的两个角。将空间推理从线性投影改为矩形角推断"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 35
      - name: "单边条形源"
        description: "源对象简化为贴在框架边上的单条直线段（bar），两端分别是触点。简化了外部形状但保持了核心连接逻辑"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "终点/停止条件"
    tag: dst
    current: "路径连接同一开放矩形框的两个触碰点（即补全开放框的缺失部分）"
    alternatives:
      - name: "跨组件连接"
        description: "路径不再在同一组件的两个触点间连接，而是从一个组件的触点连接到另一个同色组件的触点。解题者需推断跨组件配对规则（如颜色配对）"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "路径延伸固定长度"
        description: "路径从触碰点出发，延伸的长度等于开放框外部可见部分的像素数。将长度编码为外部结构的可数属性，解题者需要计数来确定路径终点"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 25
      - name: "碰撞停止"
        description: "路径从触点出发后沿特定方向延伸，遇到内部已有的其他路径或障碍时停止。增加了路径间交互的推理"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 30
      - name: "填充到对边"
        description: "路径从触点出发沿指定方向一直延伸到内部区域的对边，而非连接到另一个触点。简化了终点判断但改变了整体逻辑"
        source: line_fill
        source_task: 16de56c4
        delta_lines: 20

  - id: D5
    name: "输出裁剪方式"
    tag: grid_shape
    current: "裁剪为封闭矩形框架的内部区域尺寸（去掉边框本身）"
    alternatives:
      - name: "保持原始网格尺寸"
        description: "输出与输入同尺寸，仅在框内部绘制路径，外部保持不变。解题者需要理解变换只发生在框内，增加了定位变换区域的推理步骤"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "裁剪为路径的紧凑外接矩形"
        description: "输出裁剪为所有路径的最小外接矩形（tight crop），而非整个框内部。解题者需要推断裁剪边界由路径范围决定而非框的尺寸"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 15
      - name: "包含边框的裁剪"
        description: "输出包含闭合框的边框像素（不仅是内部），路径绘制在内部。视觉上框边充当输出的边界装饰，解题者需要理解边框保留但外部丢弃"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 10

  - id: D6
