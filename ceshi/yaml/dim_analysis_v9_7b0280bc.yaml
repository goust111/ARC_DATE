        source_task: e87109e9
        delta_lines: 15
      - name: "仅保留路径子图"
        description: "输出中只保留路径相关的方块和轨道，其余全部变为背景色，但网格尺寸不变。与擦除变换配合，产生稀疏的输出"
        source: crop
        source_task: a6f40cea
        delta_lines: 10
      - name: "路径展开为线性序列"
        description: "将路径上的节点按顺序从左到右排列成一行（紧凑排列），输出为一个扁平的长条形网格。解题者需要理解空间到序列的映射"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D8
    name: "多步处理序列"
    tag: multi_step
    current: "单步处理：找最短路径并一次性涂色"
    alternatives:
      - name: "逐步扩展涂色"
        description: "路径涂色分多步进行：第1步只涂离起点1步的轨道和节点，第2步涂2步的，依此类推。每步使用略有不同的颜色深度。增加了渐进式推理的维度"
        source: multi_step
        source_task: 271d71e2
        delta_lines: 25
      - name: "先删除再路径"
        description: "第一步根据某种规则删除部分轨道段（如最长的轨道段），第二步在剩余图上找最短路径。两步推理，需要理解删除规则和路径规划的先后关系"
        source: multi_step
        source_task: 4a21e3da
        delta_lines: 30
      - name: "双终端独立路径合并"
        description: "有3个终端方块（A, B, C），需要分别找A到B和A到C的最短路径，两条路径的并集上的节点和轨道都进行涂色。解题者需要处理多条路径的合并逻辑"
        source: creative
        source_task: null
        delta_lines: 25

