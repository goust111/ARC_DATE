task_id: 7b0280bc
task_type: move_along_path
summary: "在由方块节点和轨道边组成的图中，找到两个终端方块之间的最短路径，将路径上的中间站方块染绿、轨道段染灰"

dimensions:
  - id: D1
    name: "路径选择策略"
    tag: path
    current: "BFS最短路径（边数最少），且最短路径唯一"
    alternatives:
      - name: "最长简单路径"
        description: "将最短路径改为最长简单路径（不经过重复节点的最长路径）。解题者需要从最短路径思维切换到最长路径思维，推理难度显著提升，因为最长路径问题需要更复杂的搜索策略"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "加权最短路径"
        description: "将轨道段的像素数作为边权重，找加权最短路径（Dijkstra）。视觉上解题者需要估算每条轨道的长度来判断路径，增加空间推理难度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "避障路径"
        description: "引入障碍色标记某些轨道段为不可通行，需在剩余边中找最短路径。解题者需先识别哪些轨道被阻断，再进行路径规划，增加多步推理"
        source: pathfinding
        source_task: cb2d8a2c
        delta_lines: 30
      - name: "第二短路径"
        description: "图中存在多条路径，要求找第二短的路径（非最短但次优）。解题者需同时追踪多条路径并比较，认知负荷更高"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D2
    name: "路径导航方式"
    tag: path
    current: "沿轨道像素通过8-邻接连接的方块节点间行进"
    alternatives:
      - name: "走廊宽度约束导航"
        description: "轨道有不同宽度，只有宽度足够（大于等于某阈值）的轨道段才可通行，过窄的通道视为阻断。解题者需判断每条轨道的宽度来决定可达性"
        source: width_constraint
        source_task: 332f06d7
        delta_lines: 30
      - name: "方向约束导航"
        description: "每个节点方块上有一个特殊颜色像素指示允许的出发方向（上/下/左/右），路径必须遵循方向约束。增加了逻辑推理层，需要同时考虑方向和连通性"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 35
      - name: "对角线优先路径"
        description: "路径优先选择对角线方向的轨道段，只有无对角线选择时才走水平/垂直方向。改变了最短路径的计算逻辑，需要理解方向优先级"
        source: diagonal_path
        source_task: 35ab12c3
        delta_lines: 20

  - id: D3
    name: "轨迹涂色规则"
    tag: trajectory
    current: "路径上的轨道段统一染灰(5)，中间站方块统一染绿(3)"
    alternatives:
      - name: "渐变色轨迹"
        description: "轨道段根据距起点的边数使用不同颜色（如第1段灰、第2段绿、第3段蓝），形成渐变效果。解题者可通过颜色顺序验证路径方向，增加视觉丰富性和方向性推理"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 20
      - name: "保留原色不涂轨道"
        description: "轨道段保持原色不变，只将路径上的中间站方块染绿。解题者仅需识别节点变化，轨道信息从输出中隐藏，需要更强的图结构推理能力"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "间歇涂色轨迹"
        description: "轨道段每隔一个像素涂灰，形成虚线效果（间隔模式）。视觉上产生独特的虚线路径标记，区别于非路径轨道"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 15
      - name: "双色配对轨迹"
        description: "轨道段染色取决于其连接的两个节点：如果连接的是终端节点则染一种颜色，连接的是中间站则染另一种颜色。解题者需要理解边的端点属性与轨迹颜色的对应关系"
        source: color_pairing
        source_task: 16de56c4
        delta_lines: 25

  - id: D4
    name: "源对象定义"
    tag: src
    current: "数量为2的少数色NxN实心方块作为终端节点对"
    alternatives:
      - name: "边缘控制像素指定起点"
        description: "起点不再是少数色方块，而是网格边缘的单个控制像素，该像素与某个方块8-邻接表示其为起点。解题者需要先在网格边缘找到控制像素，再关联到对应的方块节点"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 25
      - name: "形状差异标识终端"
        description: "终端方块不通过颜色区分，而是通过尺寸差异（如终端为3x3，中间站为2x2）。解题者需通过几何尺寸而非颜色来识别终端，改变了识别策略"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "方块内嵌标记"
        description: "所有方块同色，但终端方块内部有一个不同颜色的像素标记（如中心点为特殊色）。解题者需要细粒度观察每个方块的内部结构来识别终端"
        source: anchor_points
        source_task: 4c416de3
        delta_lines: 25

  - id: D5
    name: "终点/停止条件"
    tag: dst
    current: "另一个少数色终端方块为终点，最短路径到达即停止"
    alternatives:
      - name: "距离编码终点"
        description: "终端方块内灰色像素的数量编码了路径应经过的边数，到达该边数时停止（可能在某个中间站停下）。增加了数值编码的推理层"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 30
      - name: "多终端选择最近"
        description: "存在3个或更多终端候选方块（同色），需要从起点找到到所有终端的最短路径，选择最近的那个作为实际终点。解题者需要比较多条路径长度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "颜色匹配终点"
        description: "起点方块有特殊内嵌颜色像素，终点必须是拥有相同内嵌颜色像素的方块（而非简单的同色配对）。增加了颜色匹配逻辑"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 25

  - id: D6
    name: "变换操作"
    tag: transform
    current: "路径上中间站染绿(3)，轨道染灰(5)，其他不变"
    alternatives:
      - name: "路径外节点擦除"
        description: "除了路径上节点染绿和轨道染灰外，将不在最短路径上的所有中间站方块和轨道段擦除为背景色。输出只保留路径结构，视觉效果更清晰但推理时需要理解删除规则"
        source: erase
        source_task: 3dc255db
        delta_lines: 15
      - name: "路径上节点计数标记"
        description: "路径上的每个中间站方块不是简单染绿，而是在其内部绘制点阵标记来表示该节点在路径中的位次（第1站1个点，第2站2个点等）。增加了序号编码的视觉维度"
        source: counting
        source_task: 8f215267
        delta_lines: 30
      - name: "非路径节点变色"
        description: "路径上的中间站染绿，而不在路径上的中间站染红（或其他指定色），形成路径/非路径的二元对比。解题者需要同时判断哪些在路径上、哪些不在"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "源和终端也参与变换"
        description: "终端方块也参与颜色变换（如起点染蓝、终点染红），而非保持原色不变。解题者需要理解方向性——起点和终点有不同的变换规则"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D7
    name: "输出网格形状"
    tag: grid_shape
    current: "输出与输入相同尺寸，仅改变颜色"
    alternatives:
      - name: "紧凑裁剪"
        description: "输出裁剪为仅包含最短路径上所有节点和轨道段的外接矩形区域。输出尺寸变小，解题者需要理解裁剪规则"
