task_id: fc7cae8d
task_type: move_to_match
summary: "将内部矩形的引导边颜色与框架控制边颜色对齐（通过二面体变换），然后裁掉引导边，输出核心区域"

dimensions:
  - id: D1
    name: "匹配条件：边颜色对齐"
    tag: match_cond
    current: "引导边颜色 == 框架控制边颜色（edge_color_match），通过旋转/翻转实现对齐"
    alternatives:
      - name: "形状嵌合匹配"
        description: "引导边不再是纯色条带，而是带有锯齿/凹口的轮廓；框架控制边也有对应凸起。解题者需找到形状互补的对齐方向，而非仅靠颜色。推理难度显著提升，因为需要同时判断几何互补和方向。"
        source: shape_match
        source_task: "16b78196"
        delta_lines: 35
      - name: "颜色+长度双重匹配"
        description: "引导边颜色匹配控制边颜色的同时，引导边长度也需匹配控制边上某个特征长度（如连续同色段长度）。增加一重数值约束，使暴力枚举不够，需要精确测量。"
        source: color_match
        source_task: "2c181942"
        delta_lines: 20
      - name: "连接器匹配"
        description: "矩形不再用整边颜色做引导，而是在两个相邻边的中间位置各放一个小型连接器图案（如2x1色块）。框架对应位置也有同色同形的连接器。解题者需定位连接器而非读取整边。"
        source: connector_match
        source_task: "20270e3b"
        delta_lines: 30
      - name: "取消翻转，仅允许旋转"
        description: "当前允许全部8个二面体变换。限制为仅4个旋转（不含翻转），生成时确保正确对齐只需旋转。降低搜索空间但改变推理：解题者需排除镜像可能性。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "频率消歧"
        description: "当多个变换都能让引导边颜色匹配时（如两边同色），用核心图案中出现频率最高的颜色作为消歧规则选择唯一正确变换。增加二阶推理层。"
        source: frequency_tiebreak
        source_task: "67e490f4"
        delta_lines: 20
      - name: "对角对称匹配"
        description: "引导边不在矩形的相邻边，而是沿对角线放置对角标记像素。框架控制也变成对角线方向的标记。解题者需识别对角对称关系而非轴对齐关系。"
        source: diagonal_symmetry
        source_task: "4c416de3"
        delta_lines: 30

  - id: D2
    name: "源对象结构"
    tag: src
    current: "单个填充矩形，两相邻边有1px纯色引导条带，引导角（两引导边交汇处）为背景色"
    alternatives:
      - name: "引导边宽度可变"
        description: "引导条带从固定1px变为2-3px宽。解题者需先确定引导边宽度再裁剪正确行数，增加参数推断步骤。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "引导角非背景色"
        description: "取反当前 guide_corner==bg 的规则：引导角填充为第三种颜色或其中一个引导色。解题者需新规则判断哪两条边是引导边（不能靠角落背景色排除）。"
        source: inversion
        source_task: null
        delta_lines: 12
      - name: "非矩形源对象"
        description: "核心区域不再是矩形，而是L形或T形等非凸多边形，外围仍有引导色边缘。裁剪和变换逻辑更复杂，因为需处理不规则边界。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "多个源对象"
        description: "网格内放置2-3个不同的带引导边矩形，每个需独立对齐到框架的不同角落。增加对象分离和多重匹配的推理负担。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "空心矩形框架作为源"
        description: "源对象是空心矩形框（内部为背景色），引导边仍在外侧。输出是裁剪后的空心框核心。视觉上与实心矩形差异明显，需要解题者正确识别框架而非实心块。"
        source: hollow_frames
        source_task: "4c416de3"
        delta_lines: 15

  - id: D3
    name: "目标位置与框架结构"
    tag: dst
    current: "网格边框的两个相邻边为纯色控制边，另两个边为稀疏噪声（color 5），对象对齐到控制边所在角"
    alternatives:
      - name: "控制边为对边而非相邻边"
        description: "取反当前的'相邻两边'规则：两个控制边分别在对面（如上和下）。引导边也对应地在对面。变换逻辑完全不同——不再是角落对齐而是轴对齐。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "控制边非实心"
        description: "控制边不再是100%填充，而是80-90%填充（带少量间断）。解题者需通过统计主导色来识别控制边（与噪声边区分），增加感知难度。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "三条控制边"
        description: "框架三条边为纯色控制边（三种不同颜色），只有一条边为噪声边。矩形相应地有三条引导边。匹配约束更强但搜索空间也更受限，推理思路不同。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "框架为内部十字分割线"
        description: "控制信号不在网格边缘，而是以十字线形式在网格内部将其分为四象限，每个象限边缘有不同颜色。矩形需对齐到正确象限。改变了空间推理模式。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "噪声边颜色可变"
        description: "噪声边不固定使用 color 5，而是随机选择另一种非控制色。解题者不能靠'5就是噪声'的硬编码假设，需要通过密度判断控制/噪声。"
        source: inversion
        source_task: null
        delta_lines: 8

  - id: D4
    name: "变换类型"
    tag: transform
    current: "对齐后裁掉引导边（crop），输出纯核心矩形"
    alternatives:
      - name: "保留引导边并重着色"
        description: "取反裁剪：对齐后不裁引导边，而是将引导边重着色为核心填充色，融入矩形。输出尺寸比当前大2px。测试解题者是否理解'不裁'的规则反转。"
        source: recolor
        source_task: "20270e3b"
        delta_lines: 10
      - name: "裁剪后颜色互换"
        description: "裁剪后，将核心中出现的两种图案色互换。解题者需同时推断对齐方向和色彩变换规则，两层推理叠加。"
        source: color_swap
        source_task: "a25697e4"
        delta_lines: 15
      - name: "裁剪后水平/垂直翻转"
        description: "对齐并裁剪后，对核心再做一次额外的反射（如水平翻转）。解题者需注意输出不是简单的对齐裁剪，还有附加变换。"
        source: reflection
        source_task: "b10624e5"
        delta_lines: 12
      - name: "裁剪后擦除填充色"
        description: "裁剪引导边后，将核心的主填充色替换为背景色(0)，只保留图案部分。输出变成稀疏图案，视觉差异极大。"
        source: erase
        source_task: "58f5dbd5"
        delta_lines: 8
      - name: "条件性旋转附加"
        description: "根据控制边的颜色值大小关系（如 ctrl_h > ctrl_v 时额外旋转90度），在对齐基础上叠加条件变换。解题者需从示例中推断这个隐含的二阶规则。"
        source: conditional_rotation
        source_task: "291dc1e1"
        delta_lines: 15

  - id: D5
    name: "轨迹/源对象保留"
    tag: trajectory
    current: "默认行为——源对象在输入中存在，输出中被裁剪变换后替代，无轨迹"
    alternatives:
      - name: "保留源对象原位"
        description: "输出网格保持原始尺寸，源对象留在原位不变，对齐后的核心额外绘制到控制角位置。解题者需识别'复制+变换'而非'移动+裁剪'的模式。"
        source: keep_source
        source_task: "247ef758"
        delta_lines: 25
      - name: "移动轨迹涂色"
        description: "对象从原位移动到控制角的路径上，经过的像素用特定颜色涂色，形成连续轨迹。输出保持全网格尺寸。增加路径推理维度。"
        source: continuous_trail
        source_task: "8b9c3697"
        delta_lines: 30

  - id: D6
    name: "输出框架/裁剪方式"
    tag: grid_shape
    current: "输出仅为裁剪后的核心矩形（紧凑裁剪），尺寸小于输入"
    alternatives:
      - name: "输出保持原始网格尺寸"
        description: "取反紧凑裁剪：输出与输入同尺寸，核心矩形放置在控制角位置，其余区域为背景。测试解题者对输出尺寸规则的理解。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "紧凑裁剪含控制边"
        description: "输出不仅包含核心，还保留对齐后控制边对应的网格边框（相当于比当前多裁一圈上下文）。解题者需判断裁剪范围。"
        source: tight_crop
        source_task: "20270e3b"
        delta_lines: 12
      - name: "打包网格输出"
        description: "如果有多个源对象，将所有裁剪后的核心按行/列排列在紧凑网格中，用1px分隔。需要结合 D2 多对象变体。"
        source: packed_grid
        source_task: "58f5dbd5"
        delta_lines: 25

  - id: D7
    name: "源-目标基数关系"
    tag: meta
    current: "1:1——单个源对象对应单个目标角，一次对齐操作"
    alternatives:
      - name: "多对象多角 (many:many)"
        description: "网格中有2-4个不同矩形，每个带引导边；框架有2-4组控制边。每个矩形需独立匹配到正确的控制角。解题者需进行多重分配推理，组合爆炸使蛮力失效。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "多对象同角 (many:1)"
        description: "多个矩形的引导边颜色相同，都指向同一个控制角。输出需叠加/合并多个核心（如取并集或按层叠放）。引入对象优先级和重叠冲突解决的推理。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "单对象多输出 (1:many)"
        description: "一个矩形带4条引导边（覆盖所有边），但框架只有2条控制边。解题者需选择正确的2条引导边进行匹配，忽略其余引导边。增加选择性注意力要求。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D8
    name: "多步序列处理"
    tag: meta
    current: "单步——一次对齐+裁剪完成全部逻辑"
    alternatives:
      - name: "两步变换：先对齐后图案替换"
        description: "第一步按引导边对齐并裁剪；第二步根据控制边颜色查找图例（legend），将核心中的特定图案色替换为图例指定色。解题者需分两个阶段理解变换。"
        source: multi_step
        source_task: "d35bdbdc"
        delta_lines: 30
      - name: "迭代裁剪：多层嵌套引导边"
        description: "矩形有两层引导边（外层和内层各1px，颜色不同）。第一步按外层引导边与框架对齐并裁掉外层；第二步按内层引导边做第二次微调旋转并裁掉内层。迭代深度增加推理难度。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "先排序再对齐"
        description: "多个矩形按其核心面积从小到大依次处理，每次处理后更新网格状态。引入处理顺序推理。"
        source: multi_step
        source_task: "291dc1e1"
        delta_lines: 25

  - id: D9
    name: "符号编码参数"
    tag: meta
    current: "无符号编码——引导边颜色直接匹配控制边颜色，无间接查表"
    alternatives:
      - name: "颜色映射图例"
        description: "网格角落有一个小型图例区域（如2x2色块），定义引导色到控制色的映射关系（引导色A映射到控制色X）。引导边不直接等于控制边颜色，需要查表间接映射。增加符号解码层。"
        source: legend_lookup
        source_task: "58490d8a"
        delta_lines: 25
      - name: "引导边编码旋转次数"
        description: "引导边不用于颜色匹配，而是其长度编码旋转次数（如长度5=旋转1次，长度7=旋转2次）。解题者需发现长度-变换的数值对应关系。"
        source: size_encoded_parameter
        source_task: "6ffbe589"
        delta_lines: 20
      - name: "控制像素指令"
        description: "框架边上不是纯色控制边，而是在边上特定位置放置单个控制像素。控制像素的颜色和位置共同编码目标对齐方式。更稀疏的信号使解码更具挑战。"
        source: control_pixels
        source_task: "4a21e3da"
        delta_lines: 25

  - id: D10
    name: "干扰项与噪声"
    tag: meta
    current: "噪声边有35-60%密度的 color 5 随机像素，无其他干扰"
    alternatives:
      - name: "内部干扰矩形"
        description: "网格内部除了正确的源矩形外，还放置1-2个不带引导边的干扰矩形。解题者需区分有引导边的真正目标和无引导边的干扰项。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "噪声边包含多种颜色"
        description: "噪声边不仅有 color 5，还混入与控制色或引导色相同的散布像素。解题者不能仅靠颜色唯一性区分控制边和噪声边，需要靠密度/连续性判断。"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "无噪声边（完全干净背景边框）"
        description: "取反噪声：非控制边完全为背景色，无任何噪声。简化感知但可能使任务过于容易——适合作为简单变体测试是否去噪不是核心难点。"
        source: inversion
        source_task: null
        delta_lines: 5

  - id: D11
    name: "网格形状与尺寸"
    tag: meta
    current: "正方形网格 22-29，核心矩形 5x5 到 20x20"
    alternatives:
      - name: "非正方形网格"
        description: "网格改为长宽不等的矩形（如 20x28）。控制边在长边和短边上表现不同，增加尺寸感知的推理要求。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "小网格变体"
        description: "网格缩小到 10-15，核心矩形缩至 3x3 到 7x7。紧凑空间中对象与边框的相对关系更明显，但变换的视觉确认更困难。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "核心为正方形约束"
        description: "限制核心矩形必须为正方形（h==w）。旋转后形状不变，使得仅靠形状无法区分旋转次数，解题者必须完全依赖颜色匹配。"
        source: creative
        source_task: null
        delta_lines: 5
