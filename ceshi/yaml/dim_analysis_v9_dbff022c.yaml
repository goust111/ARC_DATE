      - name: "精灵嵌套——小精灵在大精灵内部"
        description: "小精灵位于大精灵的内部区域中。填充大精灵时需避开小精灵的边框区域，或者需按嵌套层次决定填充优先级。空间关系从并列变为包含"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "精灵排列在规则网格上（如棋盘格布局）"
        description: "精灵按规则行列排列（如3x3网格），位置可预测。解题者的重点从空间搜索转向颜色映射推理，降低了定位难度但增加了精灵数量"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D12
    name: "调色板的视觉编码结构"
    tag: symbol_instructions
    current: "调色板为简单的2行或2列色条，每列/每行为一对(边框色,填充色)，紧凑排列无间隔"
