task_id: dbff022c
task_type: transform_in_place
summary: "利用网格边缘的2xN或Nx2调色板图例，根据空心精灵的边框颜色查找对应的填充颜色，将精灵内部区域填充为该颜色"

dimensions:
  - id: D1
    name: "颜色映射规则——边框颜色到填充颜色的对应方式"
    tag: match_cond
    current: "调色板直接给出边框颜色→填充颜色的一一对应关系，精灵的边框颜色在调色板中查找得到唯一填充颜色"
    alternatives:
      - name: "反向映射——填充颜色→边框颜色"
        description: "反转映射方向：调色板的第一行/列变为填充颜色，第二行/列变为边框颜色。精灵需要根据其内部已有的少量彩色像素来查找应使用的边框颜色进行补全。解题者需识别出映射方向与直觉相反"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "边框颜色→填充颜色由色值大小关系决定"
        description: "不使用显式调色板，而是根据边框颜色在所有出现颜色中的排名来确定填充颜色（如边框色值最大的精灵用最小的非背景色填充，依次对应）。解题者需发现隐含的色值排序对应规则"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "多对一映射——多种边框颜色映射到同一填充颜色"
        description: "调色板中允许多种边框颜色映射到相同的填充颜色，打破一一对应关系。解题者需注意不同精灵可能被填充为相同颜色，增加了映射推理的复杂度"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "条件映射——精灵面积决定使用哪组映射"
        description: "调色板包含两组映射（如上下两排），面积较大的精灵使用第一组，面积较小的使用第二组。解题者需同时推断分组规则和颜色映射，增加了推理层次"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "精灵边框颜色在调色板中的位置索引决定填充色"
        description: "类似 97d7923e 的 rank-count 对应，填充颜色不由调色板直接给出，而是由边框颜色在调色板中的位置（第几个）对应到另一个独立色序中。解题者需分别读取两个序列并建立索引对应"
        source: creative
        source_task: "97d7923e"
        delta_lines: 15

  - id: D2
    name: "调色板图例的位置与朝向"
    tag: symbol_instructions
    current: "调色板为2xN或Nx2色块，位于网格边缘（上/下/左），根据所在边缘确定阅读方向：上边缘从上到下读，下边缘从下到上读，左边缘从左到右读；第一行/列为边框颜色，第二行/列为填充颜色"
    alternatives:
      - name: "调色板位于网格角落而非边缘中部"
        description: "调色板固定在四个角落之一（如右上角），阅读方向需根据角落位置推断（如右上角可能按列从右到左或按行从上到下）。角落位置增加了方向判断的歧义性"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "调色板为分散的颜色对而非连续色块"
        description: "不再是紧凑的2xN矩阵，而是将每对颜色（边框色,填充色）作为独立的2x1色块分散在网格边缘的不同位置。解题者需先找到所有散落的颜色对再组装映射表"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "调色板使用嵌套方框编码——外框色为边框色，内部色为填充色"
        description: "类似 e3721c99 的 legend shapes，调色板不是简单的色条，而是一组小型嵌套方框图案：每个方框的外边框颜色代表精灵边框颜色，内部填充颜色代表目标填充色。视觉上更直观但结构更复杂"
        source: legend_lookup
        source_task: "e3721c99"
        delta_lines: 30
      - name: "调色板位于网格右边缘"
        description: "将调色板移到右边缘（当前任务未出现右边缘调色板），阅读方向为从右到左。解题者需处理四个边缘方向的完整规则集，不能仅靠部分示例推断"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "调色板为对角线排列的颜色对"
        description: "颜色对沿网格的对角线排列（如从左上到右下），每对占据相邻的两个对角像素。解题者需从对角线方向读取调色板，打破了水平/垂直的常规阅读方式"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D3
    name: "调色板阅读方向的推断规则"
    tag: symbol_instructions
    current: "阅读方向由调色板所在边缘决定：上边缘→从上到下，下边缘→从下到上，左边缘→从左到右；第一行/列始终是边框颜色"
    alternatives:
      - name: "所有调色板统一固定方向（如始终第一行为边框色）"
        description: "取消方向随位置变化的规则，所有调色板无论在哪条边缘都按相同方向阅读。降低了方向推理难度，使核心挑战集中在颜色映射本身"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "阅读方向由调色板内的特殊标记像素指示"
        description: "调色板内包含一个背景色像素或特殊颜色像素作为方向标记（如标记在第一行/列表示从标记方向开始读）。解题者需先识别标记再确定方向，增加了元推理步骤"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "阅读方向与当前规则相反（上边缘从下到上读）"
        description: "完全反转所有方向规则：上边缘从下到上，左边缘从右到左。解题者如果依赖位置直觉会得到错误结果，需从示例中重新推断反直觉的方向规则"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "同一网格中多个调色板使用不同阅读方向"
        description: "网格中存在两个调色板分别位于不同边缘，各自使用不同的阅读方向，分别对应不同分组的精灵。解题者需同时处理两套方向规则并正确分配精灵"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D4
    name: "源对象——空心精灵的形状与结构"
    tag: src
    current: "空心精灵具有单色边框，内部为背景色（0），形状不规则（非严格矩形），边框可能有缺口或突出部分"
    alternatives:
      - name: "实心精灵替代空心精灵——需要替换内部颜色"
        description: "精灵不是空心的，而是内部已有某种颜色（如灰色），需要将内部颜色替换为调色板指定的颜色。解题者需识别'替换'而非'填充'的操作语义"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "多层嵌套精灵——外框色查调色板填充中间层"
        description: "精灵具有两层边框（如外框红色、内框蓝色、最内部空白），只填充外框与内框之间的区域。解题者需识别嵌套结构并确定填充的目标层"
        source: nested_frames
        source_task: "45a5af55"
        delta_lines: 25
      - name: "精灵边框由多种颜色组成——使用出现最多的颜色查表"
        description: "精灵的边框不再是单一颜色，而是由两种或更多颜色交替组成。需使用边框中出现频率最高的颜色作为查找键。类似 800d221b 的 majority_color 机制"
        source: majority_color
        source_task: "800d221b"
        delta_lines: 20
      - name: "矩形框架精灵替代不规则形状精灵"
        description: "所有精灵严格为矩形框架（无突出或缺口），简化了边框检测但需要处理不同大小的矩形。视觉上更规整，核心挑战聚焦于颜色映射"
        source: hollow_frames
        source_task: "4c416de3"
        delta_lines: 15

  - id: D5
    name: "变换操作——内部区域的填充方式"
    tag: transform
    current: "使用 flood_fill 将精灵内部所有背景色像素填充为调色板查找到的单一颜色"
    alternatives:
      - name: "条纹填充——水平或垂直交替条纹"
        description: "内部不用单一颜色填充，而是用调色板颜色和背景色交替形成条纹图案（如水平条纹：奇数行填充色、偶数行背景色）。视觉效果更丰富，解题者需识别条纹模式"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "棋盘格填充"
        description: "内部区域使用棋盘格图案填充：坐标(r+c)为偶数的像素填充调色板颜色，奇数保持背景色。视觉上形成交错图案，增加了图案识别的复杂度"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "仅填充内部边缘——留出中心空白"
        description: "只填充精灵内部紧邻边框的一圈像素，更内部的区域保持背景色。类似 surround 的 71e489b6 机制，解题者需区分内部的边缘层和核心层"
        source: surround
        source_task: "71e489b6"
        delta_lines: 20
      - name: "渐进填充——从边框向内逐层使用不同颜色"
        description: "内部填充按到边框的距离分层：最外层用调色板第一映射色，次外层用第二映射色（需调色板提供多个映射）。产生洋葱式层次效果，解题者需推断距离到颜色的对应关系"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "精灵边框颜色与内部颜色互换"
        description: "类似 a25697e4 的 color_swap，不是填充内部，而是将边框颜色替换为调色板颜色，内部填充为原边框颜色。解题者需理解'互换'而非单向'填充'"
        source: color_swap
        source_task: "a25697e4"
        delta_lines: 15

  - id: D6
    name: "网格输出形状"
    tag: grid_shape
    current: "输出网格与输入网格完全相同大小，调色板区域保持不变，仅精灵内部被修改"
    alternatives:
      - name: "裁剪移除调色板区域"
        description: "类似 fc7cae8d 的 crop 机制，输出时裁剪掉调色板所在的行/列，只保留精灵区域。解题者需理解调色板仅作为输入指令，不出现在输出中"
        source: crop
        source_task: "fc7cae8d"
        delta_lines: 15
      - name: "紧凑裁剪为所有精灵的最小外接矩形"
        description: "类似 bf45cf4b 的 tight_crop，输出紧凑裁剪到包含所有精灵的最小区域。解题者需预判精灵的空间范围"
        source: tight_crop
        source_task: "bf45cf4b"
        delta_lines: 15
      - name: "仅输出被填充的精灵（每个精灵单独裁剪并排列）"
        description: "类似 58f5dbd5 的 packed_grid，将每个被填充的精灵单独裁剪并按顺序排列在输出网格中。从原位修改变为提取+排列，改变了输出的空间语义"
        source: packed_grid
        source_task: "58f5dbd5"
        delta_lines: 25

  - id: D7
    name: "未在调色板中出现的精灵的处理方式"
    tag: transform
    current: "边框颜色不在调色板中的精灵保持原样不做任何修改"
    alternatives:
      - name: "未匹配精灵被删除（用背景色覆盖）"
        description: "类似 conditional_deletion 的 8b9c3697，边框颜色不在调色板中的精灵在输出中被完全删除。解题者需识别调色板不仅指定填充色，还隐含了'存活'条件"
        source: conditional_deletion
        source_task: "8b9c3697"
        delta_lines: 15
      - name: "未匹配精灵使用默认填充颜色"
        description: "边框颜色不在调色板中的精灵使用一个默认颜色（如灰色5）填充。解题者需推断默认颜色规则，区分'有映射的填充'和'默认填充'"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "未匹配精灵用其边框颜色自填充"
        description: "没有调色板映射的精灵用自身边框颜色填充内部，成为实心色块。解题者需识别'自映射'作为默认行为的规则"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "所有精灵都必须在调色板中有映射"
        description: "取消未匹配精灵的情况，确保每个精灵的边框颜色都在调色板中。简化了推理但减少了干扰项的存在，降低了排除干扰的推理需求"
        source: inversion
        source_task: null
        delta_lines: 5

  - id: D8
    name: "精灵内部区域的识别方式"
    tag: border_detection
    current: "通过 flood_fill 从精灵外接矩形内的背景色像素出发识别内部区域；精灵边框形成封闭或近似封闭的边界"
    alternatives:
      - name: "基于连通分量的内外判定"
        description: "使用连通分量分析：与网格边缘背景相连的背景像素为外部，不相连的为内部。对于有缺口的精灵，缺口导致内部与外部连通则不填充。增加了拓扑推理"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "仅填充精灵边框的凸包内部"
        description: "不按实际边框形状填充，而是计算边框像素的凸包区域并填充。对于凹形精灵，凸包区域大于实际内部，解题者需理解凸包的几何概念"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "填充边框外接矩形内所有非边框像素"
        description: "不做连通性分析，直接将精灵外接矩形内所有背景色像素填充为目标颜色（包括边框缺口处）。简化了内部判定但改变了填充范围"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D9
    name: "多步处理顺序——精灵的处理优先级"
    tag: multi_step
    current: "所有精灵独立处理，顺序无关（填充结果互不影响），调色板先定位再逐个精灵查表填充"
    alternatives:
      - name: "精灵按面积从小到大处理，后处理覆盖先处理"
        description: "处理顺序按精灵面积排序，后处理的精灵可以覆盖先处理的结果。当精灵有重叠时处理顺序影响最终结果，解题者需推断排序规则并预判覆盖效果"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "链式填充——前一个精灵的填充颜色作为下一个精灵的查找键"
        description: "精灵按空间位置排序依次处理，每个精灵填充完后，其填充颜色被用作下一个精灵的查找键（而非下一个精灵自身的边框颜色）。形成链式传递，解题者需追踪颜色的传递链"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "先定位所有精灵和调色板，再按到调色板的距离排序处理"
        description: "类似 1ae2feb7 的 distance-based processing，精灵按其中心到调色板区域的距离从近到远处理。处理顺序变得与空间布局相关，解题者需计算距离"
        source: creative
        source_task: "1ae2feb7"
        delta_lines: 15
      - name: "两遍处理——第一遍填充匹配精灵，第二遍删除调色板"
        description: "分两步：第一步填充所有匹配精灵，第二步将调色板区域用背景色覆盖。最终输出中调色板消失，解题者需理解两步操作的顺序语义"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D10
    name: "调色板的条目数量与精灵数量的关系"
    tag: meta
    current: "调色板条目数量大于等于有映射的精灵数量，存在冗余条目（未被使用的颜色对）和未被映射的精灵"
