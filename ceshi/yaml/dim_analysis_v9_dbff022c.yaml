      - name: "调色板包含干扰条目——颜色对不对应任何精灵"
        description: "调色板中混入不对应任何精灵的虚假颜色对作为干扰项。类似 d59b0160 的 distractor 机制，解题者需从调色板中筛选有效映射"
        source: creative
        source_task: "d59b0160"
        delta_lines: 8

