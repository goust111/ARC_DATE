    name: "精灵的空间分布与间距"
    tag: meta
    current: "精灵散布在网格中，彼此不重叠不相邻，与调色板区域有明显间隔"
    alternatives:
      - name: "精灵紧密排列或共享边框像素"
        description: "两个精灵可以共享部分边框像素（如相邻边重合），共享像素的颜色可能产生歧义。解题者需处理边框归属问题，增加了对象分割的推理难度"
        source: creative
