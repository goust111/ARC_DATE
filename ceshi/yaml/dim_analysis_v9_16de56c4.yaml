task_id: 16de56c4
task_type: move_along_path
summary: "从唯一射击边发射周期性射线，标记点间距定义步长，伴随点限定范围并覆盖颜色，旁观者点保持不变"

dimensions:
  - id: D1
    name: "路径步长计算方式"
    tag: path
    current: "step = 两个标记点之间的间距（即差值），offset = 第一个标记点位置 mod step"
    alternatives:
      - name: "GCD多点间距"
        description: "允许标记点有3个或更多点，step = 所有相邻点间距的GCD。这增加了推理难度，因为解题者需要从多个间距中提取最大公约数，而非简单读取两点差值。"
        source: gcd_spacing
        source_task: null
        delta_lines: 20
      - name: "LCM间距"
        description: "当一行上有多组不同颜色的标记时，每组定义各自的step，最终填充的节拍位置是各组step的LCM周期。解题者需要理解多个周期的叠加效果。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "递增步长"
        description: "步长不是常数而是等差递增：第一步为gap，第二步为gap+1，第三步为gap+2...。产生的填充模式不再是等间距的，解题者需要识别加速扩展的规律。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "斐波那契步长"
        description: "标记点定义前两步的间距(a,b)，后续步长按斐波那契规则(a,b,a+b,a+2b,...)递推。产生非线性的填充模式，需要识别递推关系。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D2
    name: "路径方向确定方式"
    tag: path
    current: "射击边由四条边上非背景点计数最多的边决定，left/right边对应行方向，top/bottom边对应列方向"
    alternatives:
      - name: "每行独立方向"
        description: "不再有全局射击边。每行/列的射击方向由标记点中靠近边缘的那个点所在的边决定。不同行可能从不同边射出。解题者需要逐行推理方向，增加局部分析的需求。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "形状暗示方向"
        description: "射击方向不由边缘点数决定，而由标记点的凸出方向暗示（类似 3dc255db 的Y形方向判断）。解题者需从标记点的局部几何形状推断射线方向。"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 35
      - name: "对角线射击"
        description: "标记点不在行/列上对齐，而是沿45度对角线排列。射线沿对角线方向填充，步长定义对角距离。增加了二维空间推理的复杂性。"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 40
      - name: "双向射击"
        description: "射线从两对相对的边同时射出（如左和右都有标记），需要处理射线在中间相遇的情况（颜色覆盖优先级）。引入冲突解决推理。"
        source: inversion
        source_task: null
        delta_lines: 30

  - id: D3
    name: "轨迹填充模式"
    tag: trajectory
    current: "等间距连续填充：在beat位置(pos % step == offset)全部填充相同颜色"
    alternatives:
      - name: "交替颜色填充"
        description: "beat位置按标记色和伴随色交替填充(ABABAB...)。解题者需要识别交替模式，而非简单的单色填充。产生视觉上明显不同的条纹效果。"
        source: alternating_pattern
        source_task: 13e47133
        delta_lines: 15
      - name: "周期性图案重复"
        description: "使用标记点定义一个小pattern（如标记色-伴随色-背景），然后沿射线方向周期性重复这个pattern。解题者需要提取并推广重复单元。"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 20
      - name: "颜色循环"
        description: "当一行有多种颜色的点时，按点在行上的出现顺序排列成颜色循环，填充时依次循环使用。解题者需要推理颜色序列的来源和循环规则。"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 25
      - name: "间歇性跳过"
        description: "在beat位置上不全部填充，而是跳过已有前景像素的位置（类似4a21e3da的间歇性跳过）。保留原有结构的同时补充射线，增加了对现有像素的判断需求。"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 15

  - id: D4
    name: "源对象结构"
    tag: src
    current: "每行恰好2个同色标记点（一个在射击边，一个在内部），定义步长和偏移"
    alternatives:
      - name: "单点+边缘颜色编码"
        description: "每行只有1个标记点在内部，射击边上的一排控制像素通过颜色编码标记步长（如颜色值对应步长大小）。解题者需要先解码边缘的颜色映射，再应用到各行。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 35
      - name: "三点标记"
        description: "每行有3个同色标记点，步长 = 三个点间距的GCD，射线方向由三点的排列顺序决定。增加了信息提取的维度，解题者需处理更多约束。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "模板查找"
        description: "网格中有一个小区域作为模板，显示颜色与步长的对应关系。各行的标记点通过颜色查找模板来确定步长，而非直接从间距推导。引入间接推理层。"
        source: template_lookup
        source_task: 195c6913
        delta_lines: 40
      - name: "色块分组"
        description: "标记不再是单个像素点，而是小的连通色块（如2x1或1x2）。色块的尺寸编码步长信息（如色块宽度=步长）。视觉上更突出，但需要从形状中提取参数。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 30

  - id: D5
    name: "终止条件"
    tag: dst
    current: "无伴随点时填满整行；有伴随点时填充标记点与伴随点的span范围内"
    alternatives:
      - name: "碰撞停止"
        description: "射线从射击边出发，遇到任意非背景像素时停止（不区分伴随/旁观），类似物理碰撞。解题者需要推理射线的阻挡逻辑，而非span范围计算。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 20
      - name: "距离编码停止"
        description: "射线行进的距离由标记点的某个属性编码（如标记色的数值，或标记点到边缘的距离）。解题者需要发现距离与属性之间的映射关系。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 25
      - name: "堆叠停止"
        description: "射线不是填充空位，而是将颜色像素堆叠到已有障碍物上。当遇到非背景像素时，射线从对侧继续（绕过障碍），产生分段填充效果。"
        source: stacking
        source_task: 3dc255db
        delta_lines: 30
      - name: "对称填充"
        description: "射线从标记点向两个方向同时扩展，直到在两端都碰到边缘或障碍物。取消射击边的概念，改为标记点作为中心向两侧对称填充。"
        source: inversion
        source_task: null
        delta_lines: 25

  - id: D6
    name: "颜色配对规则"
    tag: trajectory
    current: "伴随点与标记点在同一模(mod step)类中，伴随点颜色覆盖标记色成为填充色"
    alternatives:
      - name: "颜色混合"
        description: "填充色不是简单替换为伴随色，而是根据标记色和伴随色的某种组合规则确定（如ARC调色板中两色之间的映射关系，通过示例推导）。增加颜色推理复杂度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "反色填充"
        description: "伴随点不提供填充色，而是指示标记色的互补色（在ARC调色板中预定义的互补对）。解题者需要先推导出颜色互补规则。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "距离渐变"
        description: "填充色在标记点和伴随点之间线性变化：靠近标记点用标记色，靠近伴随点用伴随色，中间位置根据位置比例选择。产生渐变效果，增加空间推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "碰撞变色"
        description: "射线颜色在碰到伴随点后发生变化（类似142ca369的反射变色）。碰到伴随点之前用标记色，之后用伴随色继续行进。增加了分段颜色推理。"
        source: color_change_on_bounce
        source_task: 142ca369
        delta_lines: 20

  - id: D7
    name: "变换规则"
    tag: transform
    current: "背景和标记色单元格被填充为轨迹颜色，旁观者点保持不变"
    alternatives:
      - name: "标记点擦除"
        description: "输出中标记点本身被擦除为背景色，只保留它们定义的射线轨迹。解题者需要理解标记点是'指令'而非'保留内容'，产生输入消失、输出生长的视觉效果。"
        source: erase
        source_task: 3dc255db
        delta_lines: 10
      - name: "保留源+填充"
        description: "标记点保持原色不变，只有空白beat位置被填充。这与当前行为（标记点也被覆盖为填充色）相反，需要区分'源'和'产物'。"
        source: keep_source
        source_task: 53fb4810
        delta_lines: 10
      - name: "伴随点变色"
        description: "伴随点在输出中变为标记色（颜色互换），同时射线用伴随色填充。产生双向颜色转移的效果，增加变换规则的复杂性。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 15
      - name: "旁观者条件变换"
        description: "旁观者点不再总是保持不变：如果旁观者点被射线经过（即射线路径覆盖了旁观者位置），则旁观者被覆盖或变色。解题者需要推理覆盖优先级。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D8
    name: "网格形状"
    tag: grid_shape
    current: "输出与输入尺寸相同(7-12行 x 9-21列)"
    alternatives:
      - name: "紧凑裁剪"
        description: "输出裁剪为仅包含非背景内容的最小外接矩形。解题者需要在理解填充规则的基础上，额外推理裁剪逻辑。"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 10
      - name: "仅保留活跃区域"
        description: "输出只包含有射线经过的行/列，删除全背景的行/列。与当前保留空行的行为相反，增加了输出尺寸预测的难度。"
        source: crop
        source_task: a6f40cea
        delta_lines: 15
      - name: "网格扩展"
        description: "当射线需要超出网格边界时，网格自动扩展以容纳完整射线。输出尺寸可能比输入更大，解题者需要推理扩展量。"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 20

  - id: D9
    name: "射击边识别方式"
    tag: meta
    current: "射击边 = 四条边中非背景点数严格最多的那条边"
    alternatives:
      - name: "颜色标记边"
        description: "射击边不由点数决定，而由边上存在特定颜色的标记像素（如红色控制点）来标识。解题者需要先识别特殊颜色的含义，再确定射击方向。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 20
      - name: "对角标记"
        description: "射击边由网格角落的对角标记像素指示（如左上角有标记→从top或left射击，具体由颜色决定）。引入角落解读的推理步骤。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "无固定边"
        description: "取消全局射击边的概念，每行的两个标记点中靠近边缘的那个自动成为该行的'射击起点'。不同行可能从不同边射出，增加逐行分析的需求。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "多数颜色边"
        description: "射击边由边上最常见的非背景颜色所在的边决定（而非总点数最多的边）。当不同颜色分布在不同边上时，需要额外统计推理。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D10
    name: "伴随点与旁观者的判定"
    tag: meta
    current: "同一行上与标记点同模(pos % step == offset)的异色点为伴随点；不同模的异色点为旁观者"
    alternatives:
      - name: "距离判定"
        description: "不按模运算判定，而是按到标记点的距离判定：距离为step整数倍的为伴随点，否则为旁观者。在step能整除距离时两者等价，但当标记点不在边缘时产生差异。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "颜色判定"
        description: "伴随/旁观者身份由颜色决定而非位置：特定颜色（如与标记色相邻的调色板颜色）为伴随，其余为旁观者。解题者需要推导颜色规则而非位置规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "全部为伴随"
        description: "取消旁观者概念，行上所有异色点都作为伴随点参与。多个伴随点时，射线在每对相邻点之间分段填充不同颜色。增加了多段处理的复杂性。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "方向判定"
        description: "伴随点必须位于标记点的射击方向前方，旁观者位于后方（无论是否对齐beat）。引入方向性判断，与位置的模运算形成互补。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D11
    name: "活跃行数量与间距"
    tag: meta
    current: "4-9条活跃行/列，相邻活跃行索引间距>=1"
    alternatives:
      - name: "等间距活跃行"
        description: "活跃行之间的间距恒定（如每隔2行一条），形成均匀分布。解题者需要注意行间的等间距规律，可能影响视觉上的对称性判断。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "密集排列"
        description: "活跃行之间间距为0（相邻行都有射线），形成密集的填充带。视觉效果从分散射线变为连续区域，增加了整体性vs逐行性的推理需求。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "分组排列"
        description: "活跃行分为2-3个组，组内行紧密排列（间距0-1），组间留有较大间隔（3-5行）。产生分区填充效果，解题者需要识别分组结构。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D12
    name: "多步处理"
    tag: multi_step
    current: "单步处理——所有活跃行独立并行计算，无依赖关系"
    alternatives:
      - name: "链式反应"
        description: "射线碰到伴随点后，伴随点变成新的射源，以伴随色为标记色从碰撞位置发射新射线（方向可能改变）。类似5961cc34的BFS激活，产生级联填充效果。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 35
      - name: "顺序处理"
        description: "活跃行按从射击边到对边的顺序依次处理。前一行的填充结果会影响后续行的点计数和射击边判断。引入处理顺序的敏感性。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "反射传播"
        description: "射线到达行末或碰到伴随点后发生反射，改变方向继续行进。类似142ca369的墙壁反射机制。解题者需要追踪多次反射的路径。"
        source: reflection
        source_task: 142ca369
        delta_lines: 30
      - name: "迭代填充"
        description: "先执行一轮标准填充，然后检查新产生的点是否构成新的标记对（可能跨行），如果是则进行第二轮填充，直到收敛。类似28a6681f的迭代移动。"
        source: BFS_activation
        source_task: 28a6681f
        delta_lines: 35

  - id: D13
    name: "行列交互"
    tag: meta
    current: "行和列独立处理——射线只沿射击方向（行或列）填充，不存在行列交叉"
    alternatives:
      - name: "行列同时填充"
        description: "标记点同时定义行方向和列方向的射线，产生十字形填充。当行射线和列射线交叉时，交叉点用特殊规则决定颜色。增加二维推理的复杂性。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "行列交替处理"
        description: "第一步处理行方向射线，第二步将新产生的点作为列方向射线的源，交替迭代直到收敛。产生复杂的交叉网格效果。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "L形路径"
        description: "射线先沿行方向行进，碰到伴随点后转弯沿列方向继续（或反过来），产生L形轨迹。类似cb2d8a2c的直角转弯导航。"
        source: turning_rules
        source_task: e87109e9
        delta_lines: 35

  - id: D14
    name: "标记点数量约束"
    tag: meta
    current: "每行每种重复色恰好2个标记点"
    alternatives:
      - name: "多标记色共存"
        description: "一行上可以有多种重复色，每种颜色独立定义射线。多条射线在同一行上叠加，颜色覆盖按出现位置的先后顺序决定。解题者需要分离和处理多组规则。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "不等数量标记"
        description: "标记色可以有2-4个点（而非恰好2个），step = 相邻点间距的GCD。增加了从多个点中提取步长的推理步骤。"
        source: gcd_spacing
        source_task: null
        delta_lines: 15
      - name: "单标记+编码步长"
        description: "标记色只有1个点，步长由该点的颜色值本身编码（如颜色3=步长3）。简化了空间信息，但引入了颜色到数值的解码推理。但需注意人类看到的是颜色而非数字，因此需要通过示例让人可推导出映射关系。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D15
    name: "伴随点数量"
    tag: meta
    current: "每行0或1个伴随点"
    alternatives:
      - name: "多伴随点"
        description: "每行可以有2-3个不同颜色的伴随点，每个伴随点定义一个区间，射线在不同区间用不同伴随色填充。产生彩色分段效果，增加区间划分推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "伴随点对"
