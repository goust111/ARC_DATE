        description: "最底层色条的颜色仅作为最内层框架而非实心填充，中心留空为背景色。解题者需区分'实心中心'与'空心中心'的规则差异"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "中心为棋盘格图案"
        description: "最底层色条的颜色与背景色交替形成棋盘格填充中心方块。增加了图案生成的维度，解题者需发现中心区域的特殊填充规则"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "中心用最底层和次底层色条颜色交替条纹填充"
        description: "中心方块内部用最底层和次底层色条的颜色交替填充水平条纹，而次底层色条仍然作为第一层框架。解题者需理解颜色复用逻辑"
        source: creative
        source_task: null
        delta_lines: 15

