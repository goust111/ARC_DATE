task_id: 45a5af55
task_type: transform_in_place
summary: "将输入中自底向上排列的全宽水平色条转化为嵌套方形框架：最底层色条变为中心实心方块，每层后续色条以其高度为厚度向外包裹一圈同色方形框架"

dimensions:
  - id: D1
    name: "嵌套构建方向"
    tag: transform
    current: "自底向上读取色条，最底层色条作为中心实心方块，逐层向外包裹框架"
    alternatives:
      - name: "自顶向下读取色条构建嵌套框架"
        description: "反转读取顺序，最顶层色条成为中心方块，向外依次包裹。解题者需要发现读取方向的反转，推理难度提升，且输出在视觉上颜色层次完全不同"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "自左向右读取竖直色条构建嵌套框架"
        description: "输入改为竖直色条（全高列），从左到右读取，最左色条为中心方块，逐层向外包裹。解题者需要识别方向从水平变为竖直，增加维度转换的推理难度"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "交替内外层构建：奇数层从底部取、偶数层从顶部取"
        description: "色条交替从底部和顶部读取，奇数层（中心、第3层...）来自底部色条，偶数层来自顶部色条。解题者必须识别这种交替模式，大幅提升推理复杂度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "按色条高度排序决定嵌套层级"
        description: "不按空间位置读取色条，而是按高度从小到大排序：最矮色条为中心方块，最高色条为最外层框架。解题者需发现排序规则而非空间顺序，推理模式完全不同"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D2
    name: "框架形状"
    tag: transform
    current: "构建正方形嵌套框架（每层为等厚方形环）"
    alternatives:
      - name: "构建同心圆形/菱形嵌套框架"
        description: "将方形框架替换为菱形（45度旋转的正方形）框架，中心为菱形实心区域，每层向外扩展菱形环。视觉效果显著不同，解题者需理解从方形到菱形的几何变换"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "构建十字形嵌套框架"
        description: "每层框架为十字形而非方形环，中心为实心方块，每层向外扩展十字形臂。解题者需要识别十字形的生长规则，包括臂宽等于色条高度"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "构建矩形嵌套框架（宽高比由输入宽度编码）"
        description: "输出不是正方形而是矩形，宽高比由输入网格的宽高比决定。例如输入宽度为高度的2倍，则输出框架也是宽为高2倍的矩形环。增加了额外的比例推理维度"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D3
    name: "色条高度到框架厚度的映射"
    tag: transform
    current: "框架厚度 = 色条高度（直接等值映射）"
    alternatives:
      - name: "框架厚度 = 色条数量 - 色条序号（反向递减）"
        description: "最内层框架最厚，最外层最薄。解题者需推导出厚度与层级的反向关系，而非直接读取色条高度，增加抽象推理难度"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "框架厚度统一为1，色条高度编码重复次数"
        description: "每层框架厚度固定为1像素，但色条高度表示该颜色在嵌套中重复包裹的次数（如高度3表示包裹3层同色单像素框架）。解题者必须理解高度的新语义"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "框架厚度 = 色条高度 × 2"
        description: "厚度为色条高度的两倍，解题者需发现乘法关系。视觉上输出更大，层次更明显，但需要额外的数学推理"
        source: creative
        source_task: null
        delta_lines: 5

  - id: D4
