task_id: 1ae2feb7
task_type: move_along_path
summary: "垂直分隔条左侧的水平单色色条向右侧以间隔=像素数的周期性模式涂点，最近的色条优先处理且不覆盖已有颜色"

dimensions:
  - id: D1
    name: "射线路径方向"
    tag: path
    current: "straight_ray——从分隔条出发，沿水平方向向对侧网格边缘延伸（垂直于分隔条方向的直线射线）"
    alternatives:
      - name: "对角线射线"
        description: "色条的周期性延伸不再沿水平方向，而是沿45度对角线方向扩展——每步同时移动一行一列。间隔仍等于色条像素数，但涂色位置分布在对角线上。这大幅改变了空间推理模式，解题者需要同时追踪行列变化。"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 25
      - name: "双向射线"
        description: "色条不仅向ext_side延伸，同时也向bar_side内部（远离分隔条方向）延伸周期性涂点。这让整个网格都成为涂色区域，增加了视觉复杂度和推理范围，解题者需要注意两侧的对称延伸。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "垂直方向射线"
        description: "色条的延伸方向从水平变为垂直——每个色条在其所在列上以间隔=像素数的方式向上和/或向下涂点。分隔条变为水平条，色条变为垂直条，整个任务旋转90度。这测试解题者能否识别方向变换后的同构关系。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "L形路径（先水平后垂直）"
        description: "射线先水平延伸到网格边缘，然后转90度沿垂直方向继续延伸，形成L形路径。周期性涂点沿整个L形路径持续，间隔仍等于色条像素数。解题者需要理解路径的转折逻辑。"
        source: turning_rules
        source_task: e87109e9
        delta_lines: 30

  - id: D2
    name: "轨迹涂色模式"
    tag: trajectory
    current: "periodic_pattern——以间隔=色条像素数在ext_side上涂单色点（位置0, length, 2*length, ...），每次仅涂一个像素"
    alternatives:
      - name: "连续轨迹填充"
        description: "将周期性单点涂色变为连续段填充——每隔interval个位置涂一段长度为floor(interval/2)的连续色条，而非单个像素。这让输出从稀疏点阵变为密集条纹，视觉效果截然不同，解题者需要推断段长与间隔的关系。"
        source: continuous_trail
        source_task: 142ca369
        delta_lines: 15
      - name: "颜色循环轨迹"
        description: "当同一行有多个色条时，ext_side的周期性涂点不是按距离优先级分别涂色，而是将所有色条的颜色组成一个循环序列，依次在每个涂点位置轮换颜色。解题者需要推断颜色循环的顺序和来源。"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 20
      - name: "间歇跳跃（涂一跳一）"
        description: "在周期性位置上不是每个都涂色，而是采用'涂一跳一'的间歇模式——只在偶数次周期位置涂色（位置0, 2*length, 4*length, ...），奇数次位置留白。这增加了第二层周期性，推理难度显著提高。"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 10
      - name: "周期性平铺（重复整个色条图案）"
        description: "不是在每个周期位置涂单个像素，而是将整个色条图案（包括多色条的完整排列）周期性地平铺到ext_side。间隔等于色条的总长度，每次复制完整的色条模式。这创造了更丰富的视觉图案。"
        source: periodic_tiling
        source_task: 53fb4810
        delta_lines: 20
      - name: "递减间隔模式"
        description: "涂点的间隔不是固定的，而是递减的——第一个点在位置length处，第二个在位置length+(length-1)处，第三个在位置length+(length-1)+(length-2)处，以此类推。解题者需要发现等差递减的间隔规律。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D3
    name: "射线源对象类型"
    tag: src
    current: "水平单色色条——分隔条一侧的水平连续同色像素段，每行1-2个色条，紧邻分隔条排列"
    alternatives:
      - name: "单像素控制点"
        description: "将色条替换为紧邻分隔条的单个彩色像素，像素的颜色决定涂色颜色，而间隔信息改为由像素距离网格边缘的行数来编码（如第3行的像素表示间隔3）。这从'看长度'变为'看位置'的推理方式。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 25
      - name: "垂直色条"
        description: "源对象从水平色条变为垂直色条——在分隔条的一侧纵向排列，色条的高度（而非宽度）决定周期间隔。分隔条变为水平方向，整体布局转置。解题者需要在垂直方向上计数像素。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "矩形色块"
        description: "源对象从一维色条变为二维矩形色块。周期间隔可以用色块的面积、宽度、高度或者边长来编码（如面积=6的色块表示间隔6）。解题者需要推断是哪个几何属性在控制间隔，增加了推理维度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "离散像素组"
        description: "源对象不再是连续色条，而是同色的离散像素分布在bar_side区域中。像素的总数决定周期间隔，但像素之间不需要相邻。解题者需要先计数连通分量中的总像素数，再应用周期规则。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "终止条件/目标"
    tag: dst
    current: "null（网格边缘）——射线延伸直到到达网格的对侧边缘，没有其他终止条件"
    alternatives:
      - name: "遇到障碍物停止"
        description: "在ext_side中放置若干障碍物像素（特定颜色），射线在遇到障碍物时停止延伸。不同行的障碍物位置不同，解题者需要识别障碍物并理解其终止作用。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 20
      - name: "到达目标线停止"
        description: "在ext_side设置一条垂直的目标线（类似第二条分隔条），射线延伸到该目标线时停止。目标线的位置由某种规则决定（如与分隔条的距离编码在输入中）。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 20
      - name: "涂满指定数量后停止"
        description: "每个色条不是延伸到边缘，而是只涂满与色条像素数相等数量的点后停止（如3像素的色条只涂3个周期点）。这为射线增加了'弹药'概念，间隔和总量均由像素数决定，推理有趣的双重约束。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "射线相互阻挡停止"
        description: "不同行的射线可以在垂直方向上相互阻挡——当某行的涂点位置正下方或正上方已有另一行的涂点时，该射线停止。这引入了行间交互，解题者需要全局规划处理顺序。"
        source: creative
        source_task: null
        delta_lines: 25

