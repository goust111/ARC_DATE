  - id: D7
    name: "多步处理顺序"
    tag: multi_step
    current: "ordered_processing——按色条距分隔条的距离从近到远排序处理，先涂的不被后涂的覆盖（no-overwrite规则）"
    alternatives:
      - name: "从远到近处理（反转顺序）"
        description: "反转处理顺序：先处理距分隔条最远的色条，后处理最近的。由于no-overwrite规则，最近的色条反而被远处色条的涂点遮挡。这完全反转了优先级逻辑，解题者需要注意远优先的非直觉规则。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "按颜色值排序处理"
        description: "处理顺序不由距离决定，而由色条的颜色值（对人类来说是颜色的深浅或色相顺序）决定——例如按照训练样例中可推断的颜色优先级表。注意需要使用人类可识别的颜色属性而非数字值。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "按色条长度排序处理（长优先或短优先）"
        description: "处理顺序由色条长度决定——最长的色条优先涂色，或者最短的优先。这让间隔最大/最小的射线获得优先权，在冲突位置产生不同的结果。解题者需要推断排序依据。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "允许覆盖（后到先得）"
        description: "取消no-overwrite规则，改为后处理的色条覆盖先处理的涂点。处理顺序仍为从近到远，但最远的色条涂点最终保留。这反转了覆盖语义，视觉结果显著不同。"
        source: inversion
        source_task: null
        delta_lines: 5

  - id: D8
    name: "间隔计算规则"
    tag: meta
    current: "interval = 色条像素数（bar_length）——直接以色条的水平长度作为周期性涂点的步长"
    alternatives:
      - name: "间隔 = 色条距分隔条的距离"
        description: "周期间隔不由色条长度决定，而由色条离分隔条的距离（gap）决定。紧邻分隔条的色条间隔为0或1（连续涂），较远的色条间隔较大。解题者需要推断距离编码而非长度编码。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "间隔 = 同行色条数量"
        description: "周期间隔由该行上色条的数量决定（1个色条间隔1，2个色条间隔2）。所有色条共享相同的间隔值。这简化了间隔逻辑但增加了计数推理。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "间隔 = 色条所在行的行号（或某种行相关属性）"
        description: "周期间隔由色条所在的行号决定——第r行的色条间隔为r（或r+1）。这让每行的周期密度不同，顶部行涂点密集、底部行涂点稀疏。解题者需要发现行号与间隔的关系。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "间隔 = 各色条长度的GCD"
        description: "当同一行有多个色条时，间隔不是分别取各自长度，而是取所有色条长度的最大公约数。所有色条使用相同的间隔进行涂色。解题者需要识别GCD运算的模式。"
        source: gcd_spacing
        source_task: 16de56c4
        delta_lines: 15

