  - id: D14
    name: "涂色粒度（每次涂色面积）"
    tag: trajectory
    current: "每个周期位置涂1个像素——涂点是单个格子"
    alternatives:
      - name: "涂色宽度等于色条长度"
        description: "每个周期位置不是涂1个像素，而是涂一段与色条等长的连续段。即在位置p处涂[p, p+length-1]的连续像素。这将ext_side填满连续色带而非离散点，视觉效果从稀疏变为密集。"
        source: creative
        source_task: null
        delta_lines: 10
