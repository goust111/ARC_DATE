        description: "每个周期涂点不仅涂自身行的格子，还同时涂上下相邻行的格子（形成垂直的短竖线或十字形标记）。这让不同行的涂色产生空间重叠，增加了行间交互的复杂度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "涂色面积递增"
        description: "第一个涂点涂1个像素，第二个涂2个像素，第三个涂3个像素……涂色面积随距离增长。这创造了近疏远密的视觉梯度效果，解题者需要发现递增的数值规律。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D15
    name: "no-overwrite规则的精确行为"
    tag: multi_step
    current: "不覆盖已有的非背景像素——先涂的点永远保留，后涂的射线遇到已涂位置直接跳过"
    alternatives:
      - name: "覆盖规则按颜色决定"
        description: "不是简单的先到先得，而是根据颜色优先级决定覆盖关系——某些颜色可以覆盖另一些颜色。优先级从训练样例中可推断（例如较长色条的颜色优先级更高）。这增加了一层颜色间竞争逻辑。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "冲突位置合并为第三种颜色"
        description: "当两个不同颜色的涂点落在同一位置时，不是一个覆盖另一个，而是合并为一种由两者共同决定的颜色（如通过隐含的颜色加法表）。解题者需要推断合并规则。"
        source: collision_detection
        source_task: e12f9a14
        delta_lines: 25
      - name: "冲突位置留白"
        description: "当两个射线试图在同一位置涂色时，该位置保持为背景色（都不涂）。这是no-overwrite的极端版本——不是先到先得，而是冲突即取消。视觉上会出现有规律的'空洞'，解题者需要推断空洞的成因。"
        source: inversion
        source_task: null
        delta_lines: 15

