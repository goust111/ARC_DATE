      - name: "水碰到斜面后改变方向"
        description: "阶梯形壁面被视为斜面，水碰到斜面后沿斜面方向滑动（类似球在斜坡上滚动）。斜面方向由壁面像素的阶梯朝向决定。这增加了壁面形状对水路径的方向性影响。"
