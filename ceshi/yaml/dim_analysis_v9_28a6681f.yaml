task_id: 28a6681f
task_type: move_along_path
summary: "蓝色水像素在重力作用下沿背景格流动，通过垂直下落、对角线滑动和水平滑动沉入底部锚定的盆地结构中，支持盆地间溢流"

dimensions:
  - id: D1
    name: "流动路径规则"
    tag: path
    current: "gravity + flow——水像素优先垂直下落，被阻挡时通过唯一开放侧的对角线滑动，支撑后沿水平方向滑向最近可落点"
    alternatives:
      - name: "纯垂直下落（无对角线滑动）"
        description: "移除对角线滑动机制，水像素只能垂直下落，遇到阻挡就停在当前位置。这大幅简化了流动逻辑，盆地形状需要更直接地对准水源才能接住水，解题者只需追踪垂直列即可。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "通道跟随式流动"
        description: "水像素沿由非背景像素围成的通道流动，类似在管道中行进，直到通道变窄无法通过时停止。这从开放空间的重力模拟变为受限通道的路径跟随，解题者需要识别通道的宽度和走向。"
        source: corridor_following
        source_task: 332f06d7
        delta_lines: 35
      - name: "反向重力（水向上流）"
        description: "水像素从底部向上流动而非向下，寻找顶部锚定的容器。盆地结构倒置放在网格上方，水从底部水源上升填充。视觉上完全翻转，但核心物理规则相同，考验解题者对方向反转的适应能力。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "BFS洪水填充式扩散"
        description: "水不按逐像素模拟移动，而是从源位置开始BFS扩散——每一步所有水的边界同时向所有相邻背景格扩展，直到水的总量用完。这改变了水的最终分布（更均匀扩散而非沉到底部），解题者需要理解广度优先的扩散逻辑。"
        source: flood_fill
        source_task: b9e38dc0
        delta_lines: 30

  - id: D2
    name: "对角线滑动条件"
    tag: path
    current: "对角线移动要求侧向格和对角格都为背景——即侧面必须开放才能斜向通过"
    alternatives:
      - name: "允许穿越侧面阻挡的对角线移动"
        description: "即使侧面有阻挡物，水仍可对角线向下移动（只要对角目标格为背景）。这扩大了水的可达范围，水可以'穿过'窄缝到达更远的盆地，增加了路径预测的复杂度。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "双侧开放时选择较深的一侧"
        description: "当左下和右下对角线都可移动时，不再要求唯一解，而是选择能到达更深位置的那一侧。解题者需要前瞻性地评估两条路径的最终深度来预测水的去向。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "对角线移动方向优先级（左优先或右优先）"
        description: "当两侧都可对角线移动时，统一选择左侧优先（或右侧优先），而非要求唯一解。优先级由某个全局线索决定（如网格中guide的入口方向）。这引入了一个需要推断的隐含偏好。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D3
    name: "水平滑动与寻找落点机制"
    tag: path
    current: "水像素在支撑面上沿水平方向滑向同一连续背景段中最近的落点（下方为背景的列），且落点必须唯一"
    alternatives:
      - name: "滑向最远落点而非最近"
        description: "水像素在水平滑动时选择距离最远的落点而非最近的。这完全改变了水的分布策略——水会尽可能远地移动后再下落，创造出与直觉相反的填充模式，大幅增加推理难度。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "无水平滑动（仅垂直和对角线）"
        description: "移除水平滑动机制，水像素只能垂直下落和对角线移动。被完全阻挡时就停在当前位置，不再沿表面寻找落点。这简化了物理模型，但水可能停在非直觉的位置。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "水平滑动距离由水量决定"
        description: "水像素的水平滑动距离受限于一个与当前水柱高度成正比的值——水柱越高（压力越大），水平滑动距离越远。解题者需要理解'水压'这一隐含的物理规则来预测水的最终位置。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "水像素的颜色"
    tag: trajectory
    current: "所有水像素统一为蓝色（color 1），流动过程中颜色不变"
    alternatives:
      - name: "水在流经不同颜色结构时变色"
        description: "水像素在接触不同颜色的盆壁时继承该壁的颜色（类似染色）。最终输出中盆地里的水呈现出与接触壁面对应的颜色条纹。解题者需要追踪水与壁面的接触历史来确定输出颜色。"
        source: color_change_on_bounce
        source_task: 142ca369
        delta_lines: 25
      - name: "多色水源"
        description: "输入中有多种颜色的水（如蓝色和红色），不同颜色的水各自独立模拟但共享盆地空间。当两种颜色的水相遇时，后到的被先到的阻挡。解题者需要分别追踪每种颜色水的路径和填充顺序。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "水的透明度/层叠效果"
        description: "水的颜色根据堆叠深度变化——表层水为浅蓝、深层水为深蓝（使用不同色号表示）。输出中盆地内的水呈现出深浅分层效果。解题者需要理解颜色与深度的对应关系。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D5
    name: "水源对象形态"
    tag: src
    current: "蓝色像素——guide样本使用guide旁的小水柱（3-10像素），无guide样本使用边缘侧的大水库或不规则片状水体（10-25像素）"
    alternatives:
      - name: "单个大型矩形水块"
        description: "水源为一个紧凑的矩形块（如3x4），从网格顶部某位置整体下落。解题者需要预测整块水在盆地中如何拆分和重新分布，而非追踪分散的单个像素。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "网格顶部边缘的一排水像素"
        description: "水源为网格最顶行的一排连续水像素（横跨多列），模拟从天空降下的雨水。每列的水独立下落但最终在盆地中汇聚。这创造了更均匀的初始分布，溢流模式更可预测。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "控制像素标记的水源量"
        description: "网格边缘放置彩色控制像素，每个控制像素表示从该列释放若干水像素（数量由控制像素的颜色或位置编码）。水不在输入中直接显示，解题者需要先解读控制像素再模拟水流。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 35

  - id: D6
    name: "终止条件/稳定判据"
    tag: dst
    current: "水沉入盆地最低可达位置——输出中每个水像素的左、下、右都为非背景或网格边缘"
    alternatives:
      - name: "水位高度限制"
        description: "盆地有一个可见的'水位线'标记（用特殊颜色像素标注），水只填充到该标记高度就停止，即使盆地更深也不继续。解题者需要识别水位标记并理解其对填充量的约束。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "填充固定比例后停止"
        description: "水像素恰好填满盆地容积的特定比例（如50%或恰好填到某个壁面高度），多余的水消失或留在原位。解题者需要计算盆地容积并确定填充量。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "堆叠到指定高度"
        description: "水不寻找最深位置，而是按照src对象的像素行数（高度）来确定在盆地中堆叠的层数。水源高3行则盆地中水也恰好填3层。这引入了src属性对dst行为的编码关系。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 20

  - id: D7
    name: "盆地结构形状"
    tag: obstacle
    current: "2-3个底部锚定的结构：U形、L形、阶梯形或单竖壁，相邻盆地壁高不等且可相互连通允许溢流"
    alternatives:
      - name: "对称U形盆地（两壁等高）"
        description: "所有盆地都是严格对称的U形，两侧壁高相同。溢流只能从壁顶均匀溢出。这简化了盆地结构的多样性，但让溢流逻辑更规律可预测，降低了视觉复杂度但保持物理推理。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "嵌套盆地（盆中盆）"
        description: "大盆地内部包含小盆地结构，水先填满内层小盆后溢出到外层大盆。多层嵌套创造了阶梯式填充模式。解题者需要理解嵌套的空间关系和多级溢流逻辑。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "带有孔洞的盆壁"
        description: "盆壁不是实心的，中间有1像素宽的孔洞（缺口），水可以从孔洞流向相邻盆地而非只能从壁顶溢流。孔洞的高度决定了水需要填到多高才会从该处流出。解题者需要同时考虑顶部溢流和侧面渗漏两种机制。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "悬浮平台式障碍"
        description: "取消底部锚定限制，障碍物可以悬浮在网格中间（如水平横梁），水在下落过程中被横梁接住并在横梁上积聚，再从横梁边缘继续下落。这创造了多层级联的水流路径。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D8
    name: "盆地数量与排列"
    tag: obstacle
    current: "2-3个相邻盆地，底部基座覆盖大部分列但留有边缘背景，盆地间可互通"
    alternatives:
      - name: "单个大盆地"
        description: "只有一个大型盆地占据网格底部，水全部汇入同一个容器。没有溢流机制，简化为纯粹的路径到达问题。降低了推理层次但让路径追踪更成为焦点。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "4-5个小盆地"
        description: "增加盆地数量到4-5个，每个盆地容积较小，溢流路径更长更复杂——水可能需要经过多次溢流才能到达最终位置。这创造了级联溢流链条，大幅增加推理步骤。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "盆地分离排列（互不相邻）"
        description: "盆地之间有背景列间隔，水无法从一个盆地溢流到另一个——每个盆地独立接收从上方直接落入的水。解题者需要追踪每滴水的垂直路径来确定它属于哪个盆地。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D9
    name: "溢流机制"
    tag: path
    current: "水填满一个盆地后从较低壁顶溢出流入相邻盆地，约50%样本展示可见溢流"
    alternatives:
      - name: "无溢流（每个盆地独立）"
        description: "完全禁止溢流，水填满盆地后多余的水留在壁顶或消失。每个盆地的水量仅取决于直接落入的水像素数。这大幅简化了任务，移除了盆地间交互这一核心推理维度。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "连通器原理（水位趋于平衡）"
        description: "所有相连的盆地像连通器一样，水在其间自由流动直到所有相连盆地的水位高度完全相同。解题者需要计算总水量和总容积来确定最终的统一水位线。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "单向溢流（只能向左或向右）"
        description: "水只能向一个方向溢流（如只能从左向右），即使右侧壁更高左侧壁更低也不能反向流。溢流方向由某个全局线索（如guide入口方向）决定。解题者需要推断溢流方向规则。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D10
    name: "guide/引导结构"
    tag: obstacle
    current: "可选的上部guide/斜坡，从网格左或右边缘进入，单斜臂或双臂漏斗形，4-连通，引导小量水进入目标盆地"
    alternatives:
      - name: "无guide（强制）"
        description: "完全移除guide选项，所有样本都只使用侧面水库作为水源。这简化了结构多样性，让所有样本具有统一的输入模式，但减少了构型变化。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "多个guide（从不同方向引入水流）"
        description: "允许2-3个guide同时存在，分别从网格的不同边缘引入水流。多个水流在盆地中汇合或分流到不同盆地。这增加了空间布局的复杂度和水的来源追踪难度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "内部管道式guide"
        description: "guide不从网格边缘进入，而是作为网格内部的封闭管道结构（上方有盖的通道），水在管道内部流动并从管道出口释放到盆地上方。解题者需要理解封闭通道内的水流方向。"
        source: pipeline_trace
        source_task: a47bf94d
        delta_lines: 30

  - id: D11
    name: "迭代模拟方式"
    tag: multi_step
    current: "iterative_simulation——按行从下往上逐个处理水像素（sorted reverse），每个像素settle到最终位置，重复多轮直到无水移动"
    alternatives:
      - name: "单步全局模拟（所有水同时移动）"
        description: "不逐个像素处理，而是每步所有水像素同时向下移动一格（如果可以），然后同时处理对角线和水平移动。这创造了不同的最终分布——水之间会互相阻挡，先到达底部的像素会影响后面的路径。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "按颜色分批处理"
        description: "如果有多色水源（见D4变体），不同颜色的水按特定顺序分批模拟——先模拟所有蓝色水完成后再模拟红色水。已沉降的蓝色水成为红色水的障碍。处理顺序决定最终分布。"
        source: multi_step
        source_task: 271d71e2
        delta_lines: 25
      - name: "从上到下逐行灌注"
        description: "不逐像素settle，而是逐行处理——先处理最高行的所有水像素，让它们各下落一步，然后处理下一行。这改变了水像素之间的优先级关系，可能导致不同的最终分布。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D12
    name: "水量守恒规则"
    tag: transform
    current: "结构像素不变，水总量严格守恒——输入中有N个水像素，输出中恰好也有N个水像素"
    alternatives:
      - name: "水蒸发（部分水消失）"
        description: "水在每次对角线或水平滑动时'蒸发'掉一个像素——只有垂直下落不消耗水。最终输出的水量少于输入，减少量等于非垂直移动步数。解题者需要理解蒸发规则来预测最终水量。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "水在特定颜色壁面处增殖"
        description: "水接触到特定颜色的壁面时复制一个水像素（在相邻空位生成新水）。解题者需要追踪水与壁面的接触事件来计算最终水量。水量不守恒增加了数量推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "壁面被水侵蚀消失"
        description: "当水像素堆积到一定高度接触壁面像素时，壁面像素被'侵蚀'变为背景，水可以从该处流出。这引入了结构变化——盆壁在水的作用下逐渐被破坏，创造新的流动路径。"
        source: erase
        source_task: 3dc255db
        delta_lines: 30

  - id: D13
    name: "网格尺寸"
    tag: grid_shape
    current: "10x10固定网格"
    alternatives:
      - name: "更大网格（15x15或20x20）"
        description: "使用更大的网格容纳更多盆地和更复杂的结构，水的路径更长、溢流链条更多。增加了空间规模但核心逻辑不变，主要考验解题者在更大空间中追踪水流的能力。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "非正方形网格（如15x8）"
        description: "使用宽而矮或窄而高的网格。宽矮网格有更多并排盆地但水下落距离短；窄高网格盆地少但水的垂直路径更长。网格形状本身成为任务特征的一部分。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "输出裁剪到盆地区域"
        description: "输入为10x10但输出只保留包含水和盆壁的最小矩形区域，移除空白行/列。解题者不仅需要模拟水流还需要确定正确的裁剪范围。"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 10

  - id: D14
    name: "输入中水的约束条件"
    tag: src
    current: "每个水像素必须被下方支撑（不悬空），且不能两侧都是背景"
    alternatives:
      - name: "允许悬空水像素（自由下落）"
        description: "移除支撑约束，水像素可以出现在空中的任意位置，在模拟开始时自由下落。这简化了输入生成但改变了初始状态的视觉特征——水看起来像漂浮的雨滴而非贴壁的水体。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "水像素必须连通成一个整体"
        description: "所有输入水像素必须4-连通形成一个连通分量，而非可以分散在多处。这约束了水源的空间分布，解题者可以从水的整体形状推断更多信息。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "水像素由结构顶部释放"
        description: "水不预先放置在输入中，而是由特殊'水龙头'标记（结构顶部的彩色像素）表示——每个水龙头在模拟时释放指定数量的水。解题者需要先识别水龙头和水量，再模拟流动。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 30

  - id: D15
    name: "已稳定水的保留"
    tag: transform
    current: "输入可选保留少量已稳定的盆地水，其余水源水全部参与模拟"
    alternatives:
      - name: "无已稳定水（所有水都需要移动）"
        description: "输入中不保留任何已在盆地中的水，所有水像素都处于不稳定位置需要模拟。这简化了输入的视觉复杂度（不需要区分'已稳定'和'待移动'的水），让任务更纯粹。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "大量预填充水+少量新水"
        description: "盆地中已有大量稳定的水（填充到一定高度），输入只添加少量新水。新水需要在已有水位基础上继续填充或触发溢流。解题者需要理解新旧水的区分以及新水如何影响已有水位。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "已有水和新水用不同颜色区分"
        description: "已稳定的水用深蓝色（color 1），新加入的水用浅蓝色（另一个color），模拟后新水也变为深蓝色。解题者可以通过颜色差异追踪哪些水是新移动的。输出中所有水统一为深蓝色。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D16
    name: "盆壁颜色的功能意义"
    tag: obstacle
    current: "使用2-3种非水、非背景颜色构成盆壁结构，颜色仅用于视觉区分，不影响水流行为"
    alternatives:
      - name: "不同颜色壁面具有不同摩擦力"
        description: "某种颜色的壁面阻止水的水平滑动（高摩擦，水碰到就停），另一种颜色允许滑动（低摩擦）。解题者需要从示例中推断颜色与摩擦力的对应关系，这为盆壁颜色赋予了物理意义。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "壁面颜色编码渗透性"
        description: "某种颜色的壁面是实心不可穿透的，另一种颜色的壁面是半透明的——水可以穿过半透明壁面但速度减半（每穿过一像素壁，水消耗一个额外移动步）。解题者需要识别哪些壁是可穿透的。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "单一颜色盆壁"
        description: "所有结构统一使用一种颜色，移除颜色多样性。这降低了视觉信息量但让解题者更专注于形状和空间关系的推理。盆地间的区分只依靠几何结构而非颜色。"
        source: inversion
        source_task: null
        delta_lines: 5

  - id: D17
    name: "水像素处理顺序"
    tag: multi_step
    current: "每轮按行列坐标降序（从下往上、从右往左）处理水像素，下方水优先settle"
    alternatives:
      - name: "从上往下处理"
        description: "每轮按行列坐标升序处理——先处理最高位置的水像素。上方的水先settle可能占据下方的位置，导致后处理的下方水被迫寻找其他路径。这改变了最终分布。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "随机顺序处理（但结果确定性）"
        description: "处理顺序不固定（generator随机化），但任务设计保证无论处理顺序如何最终结果都相同。这要求盆地设计避免任何顺序敏感的配置，实质上约束了合法的输入结构。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "按水像素与最近壁面距离排序"
        description: "离壁面最近的水像素优先处理——它们最先settle到壁面旁边的位置。这创造了'从壁面向外填充'的模式，解题者需要理解距离优先级规则。"
        source: sorting_by_distance
        source_task: dd6b8c4b
        delta_lines: 20

  - id: D18
    name: "歧义解消规则"
    tag: path
    current: "对角线移动和水平滑动都要求唯一解（双向可行时assert失败），通过盆地设计保证无歧义"
    alternatives:
      - name: "允许歧义并使用消歧规则"
        description: "放松唯一解约束，当存在多个等距落点时使用明确的消歧规则（如左优先/右优先，由guide方向编码）。这允许更多样的盆地结构，但解题者需要从示例中推断消歧偏好。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "歧义时水分裂"
        description: "当水像素面临两个等价选择（如左下和右下都可对角线移动）时，水像素分裂为两个各走一边。这引入了水量的分裂和倍增，创造了分支式的流动树。解题者需要追踪所有分支。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D19
    name: "盆壁的高度变化模式"
    tag: obstacle
    current: "相邻盆地的壁臂高度可以不等，允许有机变化（organic variation）"
    alternatives:
      - name: "严格递增高度（阶梯式）"
        description: "盆壁高度从左到右严格递增（或递减），形成阶梯状结构。水总是从高壁溢向低壁方向。这创造了可预测的单向溢流模式，解题者只需关注高度序来确定溢流方向。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "对称高度（中间高两侧低或反之）"
        description: "盆壁高度呈现对称图案——如中间最高两侧最低（山形）或中间最低两侧最高（谷形）。对称性本身成为一个可推断的规律，帮助解题者预测水的流向。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "高度由底部图案编码"
        description: "盆壁的高度由底部行中的某种图案（如底部连续非背景像素的数量）编码。解题者需要先从底部读取编码信息再推断壁面高度。这增加了符号解读的步骤。"
        source: symbol_instructions
        source_task: null
        delta_lines: 20

  - id: D20
    name: "输出中结构的保留/变换"
    tag: transform
    current: "所有盆壁结构在输出中完全保留不变（invariant: structure pixels unchanged）"
    alternatives:
      - name: "水接触的壁面变色"
        description: "输出中与水直接接触的壁面像素被重新着色为特殊颜色（如灰色），标记'湿润'区域。解题者不仅需要模拟水流，还需要确定哪些壁面被水浸湿。"
        source: recolor
        source_task: 271d71e2
        delta_lines: 15
      - name: "未使用的结构被移除"
        description: "输出中没有接触到水的盆壁结构被擦除为背景色，只保留实际被水'使用'的结构。解题者需要完整模拟水流后才能确定哪些结构应该保留。"
        source: conditional_deletion
        source_task: 8b9c3697
        delta_lines: 15
      - name: "guide在输出中消失"
        description: "guide结构在水被成功引导后从输出中移除（变为背景），只保留盆壁和水。这测试解题者是否理解guide是临时引导结构而非永久存在。"
        source: erase
        source_task: 3dc255db
        delta_lines: 10

  - id: D21
    name: "输出网格格式"
    tag: grid_shape
    current: "输出与输入尺寸完全相同（same size），水移动到新位置、结构保留"
    alternatives:
      - name: "输出仅显示水的最终位置"
        description: "输出网格只包含水像素的最终位置（背景+水），移除所有结构。解题者需要想象结构的存在来模拟水流，但输出验证只看水的位置。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "输出为水位高度的编码图"
        description: "输出不显示具体的水像素位置，而是用每列底部的一个数字编码（用不同颜色表示1-9的高度值）来表示该列的水位高度。这将空间问题转化为数值编码问题。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D22
    name: "水源与盆地的空间关系"
    tag: meta
    current: "水源位于盆地上方或侧面，通过guide或直接的路径连接到盆地区域"
    alternatives:
      - name: "水源位于盆地内部（需排出）"
        description: "反转任务方向：水已在盆地中，需要从盆壁中的出口流出到指定位置。这是当前任务的逆问题——从'填充'变为'排空'。解题者需要理解反向的流动逻辑。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "多个水源对应多个盆地（映射关系）"
        description: "有N个水源和N个盆地，每个水源通过路径恰好到达一个特定盆地（1:1映射）。水源颜色或位置编码了目标盆地。解题者需要先确定映射关系再模拟各自的水流。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "水源在盆地间共享（many:few）"
        description: "多个分散的水源（3-5个）最终汇入1-2个盆地。不同水源的水在同一盆地中混合。解题者需要追踪多个水源的路径并确定它们各自汇入哪个盆地。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D23
    name: "反弹/弹跳机制"
    tag: path
    current: "无反弹——水碰到阻挡后尝试对角线或水平滑动，最终停在支撑位置"
    alternatives:
      - name: "水碰到壁面后弹起"
        description: "水像素在垂直下落撞击水平壁面时弹起1-2格，然后继续下落。在弹跳过程中可以越过低矮壁面到达原本不可达的区域。这引入了弹性碰撞的物理直觉。"
