        source_task: 20270e3b
        delta_lines: 20
      - name: "紧凑裁剪到包含所有轮廓的最小矩形"
        description: "输出不保持原始网格大小，而是裁剪到包含所有着色像素（对象+轮廓+洞）的最小外接矩形。解题者需额外确定裁剪边界，任务从纯变换扩展为变换+裁剪。"
        source: tight_crop
        source_task: bf45cf4b
        delta_lines: 15
      - name: "每个对象独立输出为分离的子网格"
        description: "输出不是一个完整网格，而是将每个对象（含其轮廓）裁剪为独立的子网格，按从左到右、从上到下的顺序水平拼接，子网格间用分隔线隔开。解题者需理解空间分解和重组规则。"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 35

  - id: D7
    name: "多步处理序列"
    tag: multi_step
    current: "两步序列：第一步检测洞并条件性重着色（对象变青色、洞变品红）；第二步对所有对象统一绘制红色轮廓"
    alternatives:
      - name: "按对象面积从大到小依次处理"
        description: "不是同时处理所有对象，而是按面积降序逐个处理：先绘制最大对象的轮廓，再绘制次大对象的轮廓。后绘制的轮廓覆盖先绘制的。解题者需推断处理顺序规则，且当对象轮廓重叠时，结果取决于绘制顺序。"
        source: multi_step
        source_task: 247ef758
        delta_lines: 20
      - name: "迭代轮廓绘制"
        description: "轮廓绘制分多轮进行：第一轮绘制紧邻对象的1像素轮廓，第二轮在第一轮轮廓外再绘制1像素轮廓（颜色可能不同），以此类推直到达到某个层数。解题者需发现迭代层数规则和每层的颜色模式。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "先绘制轮廓再检测洞"
        description: "反转处理顺序：先对所有蓝色对象绘制红色轮廓，然后在已绘制轮廓的网格上检测哪些对象内部有洞并执行重着色。由于轮廓绘制可能改变像素分布，洞检测的结果可能与先检测再绘制不同。解题者需推断'先画后检测'的非直觉顺序。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "三步序列：检测洞、重着色、按类别分别绘制不同样式轮廓"
        description: "增加一步：有洞对象和无洞对象使用不同的轮廓绘制方式（如有洞对象用实线轮廓，无洞对象用间断点轮廓）。解题者需推断洞检测结果如何影响后续的轮廓样式选择，链式推理层次增加。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D8
