        source: creative
        source_task: null
        delta_lines: 10
      - name: "部分封闭也算洞"
        description: "放宽封闭条件：背景区域只要有>=75%的边界被对象像素包围就算洞，允许有小开口。解题者需要估算包围程度而非做严格的封闭性判断，引入了模糊/近似推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "凹陷也视为洞"
        description: "不仅完全封闭的区域算洞，对象轮廓上的深凹陷（凹进去的背景区域宽度<=2，深度>=3）也被视为洞。解题者需要区分浅凹陷和深凹陷，引入了形态学深度推理。"
        source: creative
        source_task: null
        delta_lines: 30

