  - id: D9
    name: "轮廓与对象/洞的叠加优先级"
    tag: transform
    current: "红色轮廓绘制在对象8邻域的背景像素上；轮廓不覆盖对象本身的像素（包括重着色后的青色/品红像素）"
    alternatives:
      - name: "轮廓覆盖一切（最高优先级）"
        description: "红色轮廓不仅覆盖背景像素，也覆盖相邻对象的边缘像素。当两个对象距离<=2像素时，轮廓会侵入对方的像素区域。解题者需理解轮廓是全局最高优先级的覆写操作，对象会被部分'侵蚀'。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "相邻对象共享轮廓"
        description: "当两个对象的8邻域轮廓区域重叠时，重叠像素仅画一次红色（而非互相覆盖）。此外如果两个对象的边缘像素直接相邻（距离=1），则它们之间不画轮廓——视为一个'连接'的整体。解题者需推断'合并轮廓'规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "轮廓避让洞的区域"
        description: "红色轮廓不绘制在洞的8邻域范围内——即如果轮廓像素也属于洞的8邻域则跳过。这在有洞对象周围产生不完整的轮廓（洞附近缺口），解题者需同时考虑对象边界和洞的影响范围。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D10
    name: "洞的封闭性定义"
    tag: meta
    current: "洞定义为被蓝色对象像素完全4连通封闭的背景色区域（即该背景区域不与网格外部背景相连）"
    alternatives:
      - name: "8连通封闭定义"
