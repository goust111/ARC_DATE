task_id: aa4ec2a5
task_type: transform_in_place
summary: "对网格中每个蓝色4连通对象绘制1像素宽的8邻域红色轮廓；若对象内部包含背景色洞，则先将对象重着色为青色、洞重着色为品红色，再绘制红色轮廓"

dimensions:
  - id: D1
    name: "轮廓绘制方式"
    tag: transform
    current: "在每个蓝色对象周围绘制1像素宽的8邻域（Chebyshev距离=1）红色轮廓"
    alternatives:
      - name: "仅4邻域正交轮廓"
        description: "轮廓仅沿上下左右四个正交方向绘制，不包含对角线位置。轮廓形状从方形变为十字形/菱形，解题者需区分8邻域和4邻域两种不同的邻域定义对轮廓形状的影响，推理更精细。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "可变半径轮廓"
        description: "轮廓宽度不固定为1像素，而是由对象面积决定：面积<=5的对象用1像素轮廓，面积6-15用2像素轮廓，面积>15用3像素轮廓。解题者需发现对象大小与轮廓宽度的对应关系，结合计数与空间推理。"
        source: size_encoded_parameter
        source_task: 6ffbe589
        delta_lines: 25
      - name: "内轮廓而非外轮廓"
        description: "反转轮廓方向：不在对象外部绘制轮廓，而是在对象边缘内部像素上涂红色（即对象中与背景相邻的像素变为红色）。对象变小而非周围背景被覆盖，视觉效果和推理方向完全相反。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "轮廓仅绘制在背景侧"
        description: "红色轮廓像素只绘制在原本为背景色的位置上，如果8邻域位置已是其他对象的像素则跳过不画。解题者需理解轮廓的条件性绘制规则——相邻对象之间不会产生轮廓，只有对象与背景的边界才有轮廓。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "方向性射线轮廓"
        description: "从对象边缘像素向外发射红色射线，沿4个正交方向延伸直到碰到其他对象或网格边界。轮廓不再是固定宽度的环，而是动态长度的射线。解题者需推断射线的方向和终止条件，推理复杂度显著提升。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D2
    name: "洞检测条件与分类规则"
    tag: transform
    current: "若蓝色对象内部包含被完全封闭的背景色区域（洞），则将该对象重着色为青色，洞重着色为品红色；无洞的对象保持蓝色"
    alternatives:
      - name: "按洞的数量分级着色"
        description: "不是简单的有洞/无洞二分类，而是按洞的数量分级：1个洞着色为青色/品红，2个洞着色为绿色/黄色，3个以上着色为橙色/灰色。解题者需要准确计数每个对象内的洞数量并映射到对应的颜色方案，增加了计数与映射推理。"
        source: counting
        source_task: 8f215267
        delta_lines: 25
      - name: "按洞的面积大小决定着色"
        description: "着色规则不取决于是否有洞，而取决于洞的总面积：小洞（面积<=3）对象着色为青色/品红，大洞（面积>3）对象着色为绿色/黄色。解题者需同时识别洞的存在和估算洞的大小，增加了空间感知维度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "反转着色条件：无洞对象变色"
        description: "反转逻辑：没有洞的对象被重着色（如变为青色），有洞的对象保持蓝色不变。洞仍被着色为品红色。解题者需推断的是'缺少某种特征的对象被标记'，这是一种否定条件推理，与直觉相悖。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "所有对象统一着色，洞用不同颜色区分"
        description: "移除有洞/无洞的区分：所有蓝色对象都变为青色，但有洞对象的洞着色为品红，无洞对象无额外操作。解题者仍需检测洞的存在，但对象本身不再是区分信号，只有洞的颜色变化揭示分类结果。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D3
    name: "源对象的连通性与形态"
    tag: src
    current: "蓝色4连通对象（可能有多个），部分对象内部封闭了背景色洞"
    alternatives:
      - name: "8连通对象替代4连通"
        description: "将对象连通性从4连通改为8连通（包含对角线邻接）。这会合并一些在4连通下独立的对象，改变洞的检测结果（4连通的洞在8连通下可能不再封闭）。解题者需推断使用的连通性模型，推理门槛提高。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "多种颜色的独立对象"
        description: "对象不全是蓝色，而是使用多种不同颜色（如蓝色、绿色、橙色），每种颜色的对象独立检测洞并执行着色。有洞对象的重着色颜色由原始颜色通过固定映射决定。解题者需要发现颜色映射规则。"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 25
      - name: "对象附带标记像素指示类别"
        description: "每个蓝色对象旁边有一个特殊颜色的单像素标记（如红色或绿色），标记颜色指示该对象是否应被视为'有洞'处理，而非通过实际检测洞来确定。解题者需解码标记的语义而非分析对象拓扑结构，任务本质从拓扑推理变为符号解读。"
        source: marker_axis
        source_task: 7ed72f31
        delta_lines: 30
      - name: "嵌套对象（对象内部包含另一个颜色的对象而非洞）"
        description: "背景色洞被替换为另一种颜色的小型内嵌对象。洞检测条件变为'对象内部是否包含其他颜色的像素'。外层对象和内层对象可能有不同的着色规则，解题者需要理解多层嵌套的空间关系。"
        source: nested_frames
        source_task: 45a5af55
        delta_lines: 30

  - id: D4
    name: "轮廓颜色规则"
    tag: transform
    current: "所有对象（无论是否有洞）统一使用红色轮廓"
    alternatives:
      - name: "轮廓颜色由对象类别决定"
        description: "有洞对象（青色）用红色轮廓，无洞对象（蓝色）用橙色轮廓。解题者需同时推断两种不同颜色轮廓的分配规则及其与洞检测的关联，增加了分类-颜色映射的推理层。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "轮廓颜色由对象面积编码"
        description: "轮廓颜色取决于对象面积的大小排名：最大对象用红色，次大用橙色，第三大用黄色，以此类推。解题者需对所有对象排序并建立排名-颜色对应关系，引入了全局比较推理。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "轮廓颜色与对象内部洞的颜色互补"
        description: "有洞对象的轮廓颜色由洞的重着色颜色决定（如洞为品红则轮廓为绿色，形成颜色互补关系），无洞对象仍用红色。解题者需要发现颜色之间的互补/配对规则。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D5
    name: "洞的处理方式"
    tag: transform
    current: "被封闭的背景色洞重着色为品红色"
    alternatives:
      - name: "洞保持背景色不变"
        description: "反转洞的着色操作：洞不被重着色，保持原始背景色。有洞对象仍被重着色为青色，但洞作为背景色'空洞'保留。解题者需注意青色对象内部的背景色区域不受影响，视觉上形成'镂空'效果。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "洞被填充为与外轮廓相同的红色"
        description: "洞不着色为品红，而是填充为红色（与轮廓同色）。视觉上洞与轮廓融合，解题者需推断'洞被红色填充'的规则，且需区分红色像素是轮廓还是洞填充。增加了颜色语义的歧义性。"
        source: hole_fill
        source_task: 3a25b0d8
        delta_lines: 10
      - name: "洞按面积大小用不同颜色填充"
        description: "小洞（1-2像素）填充品红色，中洞（3-5像素）填充黄色，大洞（>5像素）填充绿色。同一对象内可能有多种颜色的洞。解题者需要同时检测洞的存在和估计洞的面积来确定填充颜色。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "洞的轮廓也独立绘制"
        description: "每个洞不仅被着色为品红，洞的内边缘也绘制一圈额外的轮廓（如黄色），形成洞的独立边框。输出中有两层轮廓结构——对象外轮廓（红色）和洞内轮廓（黄色），解题者需理解双层边框的嵌套逻辑。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D6
    name: "网格尺寸与输出形状"
    tag: grid_shape
    current: "输出网格与输入尺寸相同（same），轮廓绘制在原始网格上"
    alternatives:
      - name: "输出扩展以容纳外轮廓"
        description: "输出网格在四周各扩展1像素（或更多），确保靠近边界的对象的轮廓不会被裁剪。解题者需推断输出比输入大且尺寸增量与轮廓宽度相关，增加了尺寸推理的维度。"
