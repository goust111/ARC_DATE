task_id: 88bcf3b4
task_type: move_along_path
summary: "垂直于网格边缘的直线 bar 末端连接的不规则线段像绳索一样绕过附近的障碍物精灵重新定位，总像素数保持不变。"

dimensions:
  - id: D1
    name: "路径绕行模式"
    tag: path
    current: "线段从 bar 末端出发，沿曼哈顿最短路接近障碍物，沿障碍物边界行走，最后以 45 度对角方向延伸退出；三段单调相（approach-alongside-exit）。"
    alternatives:
      - name: "螺旋缠绕"
        description: "线段不只绕行障碍物外边界一次，而是像螺旋一样围绕障碍物旋转多圈（圈数由线段长度决定），每圈向外扩展一格；解题者必须从像素长度推断圈数，路径拓扑从简单弧变为多层螺旋。"
        source: "spiral_path"
        source_task: "da515329"
        delta_lines: 55
      - name: "反射折线绕行"
        description: "线段向障碍物接近后，不沿边界滑行而是以 45 度角反弹离开，遇到网格边界再反弹回来继续绕行；路径推理从单调弧变为多段折线，每段反射角需要推断。"
        source: "reflection"
        source_task: "142ca369"
        delta_lines: 60
      - name: "最短路绕行"
        description: "线段从 bar 末端出发，沿障碍物外侧的 BFS 最短路径到达障碍物对侧的指定出口点（曼哈顿距离最远的皮肤格），不要求三段单调相；路径可以包含任意转向，推理难度在于寻路而非模式匹配。"
        source: "shortest_path"
        source_task: "7b0280bc"
        delta_lines: 40
      - name: "管道跟随绕行"
        description: "障碍物周围预先存在一条用特定颜色标记的管道路径，线段必须沿管道行走而非自由绕行；解题者需要先识别管道再沿管道重绘线段。"
        source: "pipeline_trace"
        source_task: "a47bf94d"
        delta_lines: 50

  - id: D2
    name: "边界遍历方向"
    tag: path
    current: "沿障碍物边界的遍历方向由 bar 末端到障碍物最近点的位置关系隐式决定（根据 root side 选择 FL 或 FR 入场），可能是顺时针或逆时针。"
    alternatives:
      - name: "始终顺时针遍历"
        description: "不论 bar 和障碍物的相对位置如何，边界遍历始终顺时针进行；解题者需要识别固定方向规则而非推断位置关系，改变了推理焦点。"
        source: "inversion"
        source_task: null
        delta_lines: 15
      - name: "障碍物颜色决定方向"
        description: "障碍物使用两种可能颜色之一，颜色 A 代表顺时针遍历，颜色 B 代表逆时针遍历；解题者需要从样例中发现颜色与方向的映射关系。"
        source: "creative"
        source_task: null
        delta_lines: 25
      - name: "图例指示遍历方向"
        description: "网格角落放置一个小型方向指示图例（如 L 形标记指示旋转方向），所有障碍物统一按图例指示的方向遍历；把隐式规则变为显式符号编码。"
        source: "symbol_instructions"
        source_task: "e87109e9"
        delta_lines: 45

  - id: D3
    name: "轨迹涂色与长度保持"
    tag: trajectory
    current: "沿新路径涂上线段原色，总涂色像素数严格等于原始线段长度（length_preservation）；如果路径到达网格边界则截断。"
    alternatives:
      - name: "长度加倍涂色"
        description: "输出线段长度变为原始长度的两倍，多出部分继续沿退出方向延伸；长度保持规则的倍率变化，解题者需要从样例推断倍率关系。"
        source: "inversion"
        source_task: null
        delta_lines: 12
      - name: "隔格涂色"
        description: "沿绕行路径每隔一格涂色一格（第 1、3、5...格涂色），总涂色像素数为原始长度的一半（向上取整）；视觉上形成虚线轨迹，推理需要同时掌握路径和间隔规则。"
        source: "intermittent_skip"
        source_task: "4a21e3da"
        delta_lines: 20
      - name: "周期颜色轨迹"
        description: "路径上的像素按 bar 色和线段色的交替周期涂色（如 AABB...），保持总像素数不变；解题者需要发现颜色序列的周期模式。"
        source: "periodic_pattern"
        source_task: "221dfab4"
        delta_lines: 25
      - name: "接触障碍物变色"
        description: "线段在接近和退出阶段保持原色，但沿障碍物边界行走的部分（phase 2）使用障碍物颜色涂色；总像素数不变但出现双色轨迹。"
        source: "color_change_on_bounce"
        source_task: "142ca369"
        delta_lines: 18

  - id: D4
    name: "源对象结构"
    tag: src
    current: "源对象是 8-连通的不规则线段（5-9 像素），一端通过 4-邻接连接到 bar 末端，沿远离边界方向延伸，包含 2-5 个转弯。"
    alternatives:
      - name: "源为直线段"
        description: "线段不再不规则而是一条直线（水平或垂直），连接在 bar 末端；移除了不规则形状的复杂性，但保留长度保持和绕行逻辑。"
        source: "inversion"
        source_task: null
        delta_lines: 30
      - name: "源为控制像素序列"
        description: "线段被替换为散布在 bar 附近的离散控制像素（不一定连通），每个像素代表一个路径步长和方向；解题者需要先收集控制像素再按顺序构建输出路径。"
        source: "control_pixels"
        source_task: "4a21e3da"
        delta_lines: 55
      - name: "源为小型精灵块"
        description: "源不是线段而是一个紧凑的小型精灵（如 2x3 块），其像素数决定输出路径长度，其形状暗示绕行方向；从线状变为块状源，改变了形态识别。"
        source: "creative"
        source_task: null
        delta_lines: 45
      - name: "源为双端线段"
        description: "线段两端都连接到 bar（形成 U 形），输出时只有远离障碍物的一端脱离并绕行，另一端保持连接；解题者需要判断哪一端移动。"
        source: "creative"
        source_task: null
        delta_lines: 35

  - id: D5
    name: "目标/停止条件"
    tag: dst
    current: "线段绕过离 bar 末端曼哈顿距离最近的障碍物精灵，到达对侧后沿 45 度对角延伸直到像素数耗尽或到达网格边界。"
    alternatives:
      - name: "绕行至第二近障碍物"
        description: "线段绕过最近障碍物后继续行进到第二近障碍物并再次绕行，最终沿对角退出；多障碍物串联绕行增加了路径复杂性。"
        source: "chain_reaction"
        source_task: "5961cc34"
        delta_lines: 55
      - name: "到达网格边缘停止"
        description: "线段不保持固定长度，而是绕过障碍物后继续延伸直到触及网格边缘；长度不再保持，停止条件变为几何边界。"
        source: "inversion"
        source_task: null
        delta_lines: 20
      - name: "堆叠到目标精灵上"
        description: "输出路径的终点不是对角延伸，而是在障碍物对侧紧贴障碍物停下，像堆叠一样附着在障碍物表面；路径终止行为从发散变为收敛。"
        source: "stacking"
        source_task: "3dc255db"
        delta_lines: 25
      - name: "到达同色标记像素停止"
        description: "网格中另有一个与线段同色的孤立标记像素，线段绕过障碍物后朝标记像素方向延伸并在到达时停止；增加了目标识别环节。"
        source: "marker_alignment"
        source_task: "581f7754"
        delta_lines: 40

  - id: D6
    name: "障碍物形态与数量"
    tag: obstacle
    current: "每个 triple 有一个小型 4-连通不规则精灵（1-9 像素），紧贴在输出线段 V 形拐点的内侧，距 bar 末端曼哈顿距离 2-6。"
    alternatives:
      - name: "矩形障碍物"
        description: "障碍物从不规则精灵改为严格矩形（如 2x3、3x3），边界遍历变为沿矩形边走；路径变得更规则，但矩形尺寸仍需从样例推断。"
        source: "inversion"
        source_task: null
        delta_lines: 20
      - name: "多障碍物散布"
        description: "每个 triple 不止一个障碍物，而是 2-3 个小障碍物排列在 bar 前方，线段需要依次绕过所有障碍物（蛇形穿行）；路径规划从单障碍变为多障碍串联。"
        source: "creative"
        source_task: null
        delta_lines: 60
      - name: "空心障碍物"
        description: "障碍物是空心矩形框而非实心精灵，线段绕行空心框的外边界；视觉上需要区分框的内外边界来确定绕行方向。"
        source: "hollow_frames"
        source_task: "4c416de3"
        delta_lines: 35
      - name: "大型障碍物"
        description: "障碍物尺寸增大到 10-20 像素，占据更多网格空间，线段需要更长的边界遍历段；测试解题者在大尺度下的边界追踪能力。"
        source: "creative"
        source_task: null
        delta_lines: 15

  - id: D7
    name: "变换语义"
    tag: transform
    current: "输入中的原始线段消失（涂为背景色），新路径沿绕行轨迹重新绘制线段色；线段 detach-reattach 但 bar 和障碍物不变。"
    alternatives:
      - name: "保留原始线段"
        description: "输出中原始线段保持不动，绕行路径作为额外的新线段画出（使用第四种颜色）；从移动变为复制，解题者需要理解新增而非替换。"
        source: "keep_source"
        source_task: "53fb4810"
        delta_lines: 20
      - name: "线段颜色变化"
        description: "绕行后的线段使用障碍物颜色而非原始线段颜色，原始线段位置消失；颜色转移增加了对颜色映射关系的推理。"
        source: "color_transfer"
        source_task: "4c416de3"
        delta_lines: 15
      - name: "障碍物随之消失"
        description: "线段绕行完成后，被绕过的障碍物也从输出中消失（涂为背景色），只留下 bar 和重绘的线段；这是对障碍物固定不变的取反。"
        source: "erase"
        source_task: "3dc255db"
        delta_lines: 10
      - name: "障碍物被包围涂色"
        description: "线段绕行后，线段与障碍物之间的空隙区域被填充为线段颜色，形成围合效果；变换从线性路径变为区域填充。"
        source: "surround"
        source_task: "71e489b6"
        delta_lines: 40

  - id: D8
    name: "匹配条件（障碍物选择）"
    tag: match_cond
    current: "选择离 bar 末端曼哈顿距离最近的障碍物精灵作为绕行目标；当存在多个 triple 时，每个 bar 选择自己最近的障碍物。"
    alternatives:
      - name: "按颜色配对"
        description: "每个 bar 选择与自身同色或有特定颜色对应关系的障碍物进行绕行，而非最近的障碍物；解题者需要从样例推断颜色配对规则。"
        source: "creative"
        source_task: null
        delta_lines: 30
      - name: "选择最远障碍物"
        description: "每个 bar 选择距离自己曼哈顿距离最远的障碍物绕行；这是最近匹配的直接取反，路径更长、更容易跨越其他 triple 区域。"
        source: "inversion"
        source_task: null
        delta_lines: 15
      - name: "按尺寸匹配"
        description: "线段长度最长的 bar 配对像素数最多的障碍物，次长配次多，以此类推；匹配基于排序而非距离。"
        source: "sorting_by_distance"
        source_task: "dd6b8c4b"
        delta_lines: 25
      - name: "按线段方向匹配"
        description: "线段的初始延伸方向指向哪个障碍物，就绕行哪个障碍物，而非按距离选择；方向成为匹配条件。"
        source: "direction_from_shape"
        source_task: "3dc255db"
        delta_lines: 30

  - id: D9
    name: "对角延伸退出规则"
    tag: path
    current: "从障碍物边界退出后，沿最后一步的方向（通常为 45 度对角）继续延伸直到像素数耗尽或到达网格边界。"
    alternatives:
      - name: "正交退出"
        description: "退出方向改为沿 bar 的前进方向正交延伸（纯水平或纯垂直），而非对角；路径形状从 V 形变为 L 形，改变了退出段的几何推理。"
        source: "inversion"
        source_task: null
        delta_lines: 15
      - name: "按 bar 前进方向退出"
        description: "退出方向固定为 bar 从边界指向内部的方向（fwd），线段绕过障碍物后继续向网格深处直行；退出方向由 bar 而非边界遍历决定。"
        source: "directional_movement"
        source_task: "88e364bc"
        delta_lines: 18
      - name: "无退出延伸"
        description: "线段绕过障碍物边界后立即停止，不做任何延伸；输出路径只包含 approach 和 alongside 两段，长度不一定等于原始长度（取较短值），简化了退出推理。"
        source: "inversion"
        source_task: null
        delta_lines: 12

  - id: D10
    name: "网格与输出框架"
    tag: grid_shape
    current: "输出与输入保持相同尺寸的方形网格（7-27），不裁剪不扩展。"
    alternatives:
      - name: "裁剪到活跃区域"
        description: "输出只保留包含 bar、障碍物和输出线段的最小外接矩形；解题者需要先完成绕行再确定裁剪边界。"
        source: "tight_crop"
        source_task: "e87109e9"
        delta_lines: 25
      - name: "矩形网格"
        description: "网格从正方形改为长方形（行列数不同），bar 仍垂直于边缘但网格不对称改变了空间约束。"
        source: "creative"
        source_task: null
        delta_lines: 12
      - name: "只输出变化区域"
        description: "输出一个小网格，只包含输出线段（不含 bar 和障碍物），相当于提取绕行结果的局部裁剪；解题者先推断完整变换再提取差异。"
        source: "crop"
        source_task: "a6f40cea"
        delta_lines: 30

  - id: D11
    name: "多步处理顺序"
    tag: multi_step
    current: "当存在多个 triple 时，所有绕行独立并行计算，互不影响。"
    alternatives:
      - name: "按距离边缘排序处理"
        description: "多个 triple 按 bar 末端离最近网格边缘的距离从近到远依次处理，前一个 triple 的输出线段成为后续 triple 的障碍物；引入顺序依赖和级联效果。"
        source: "multi_step"
        source_task: "1ae2feb7"
        delta_lines: 45
      - name: "迭代绕行直到稳定"
        description: "每次绕行后检查是否有线段与其他障碍物产生新的邻接关系，如果有则触发二次绕行，直到所有线段都不与障碍物邻接为止；从单次变为迭代收敛。"
        source: "chain_reaction"
        source_task: "5961cc34"
        delta_lines: 55
      - name: "先移除后绕行"
        description: "第一步先将所有原始线段移除（涂为背景色），第二步在清理后的网格上重新计算每个线段的绕行路径；两步之间的网格状态不同可能改变路径选择。"
        source: "creative"
        source_task: null
        delta_lines: 20

  - id: D12
    name: "Bar 结构"
    tag: meta
    current: "Bar 是 3-7 像素的直线，垂直于它所接触的网格边缘，一端在边界上一端在内部。"
    alternatives:
      - name: "L 形 bar"
        description: "Bar 从直线变为 L 形（垂直于边缘的主干加水平延伸的短臂），线段连接在 L 的拐点或短臂末端；bar 形状的变化改变了末端位置和线段连接方式的推理。"
        source: "creative"
        source_task: null
        delta_lines: 40
      - name: "双端 bar"
        description: "Bar 两端都在不同的网格边缘（横跨整个网格），中间某处有一个标记点作为线段连接的末端；解题者需要找到 bar 上的标记而非简单取内部端点。"
        source: "creative"
        source_task: null
        delta_lines: 35
      - name: "不接触边缘的 bar"
        description: "Bar 改为网格内部的浮动直线（不接触任何边缘），线段连接规则不变但源点识别需要改变——通过识别直线形状的连通分量而非边缘接触来定位 bar。"
        source: "inversion"
        source_task: null
        delta_lines: 30

  - id: D13
    name: "三元组基数关系"
    tag: meta
    current: "每个 triple 是严格的 1:1:1 关系：一个 bar 对应一个线段对应一个障碍物。"
    alternatives:
      - name: "一个 bar 多个线段"
        description: "每个 bar 的末端可以连接 2-3 个不同颜色的线段，每个线段独立绕过同一个障碍物（可能从不同侧）；解题者需要为每个线段分别计算路径。"
        source: "creative"
        source_task: null
        delta_lines: 50
      - name: "多个 bar 共享一个障碍物"
        description: "两个不同边缘的 bar 的线段绕行同一个障碍物，一个从左侧绕行一个从右侧绕行；共享目标增加了空间冲突的处理。"
        source: "creative"
        source_task: null
        delta_lines: 40
      - name: "一个线段绕行多个障碍物"
        description: "每个 triple 包含一个 bar、一个长线段和 2-3 个依次排列的小障碍物，线段蛇形依次绕过所有障碍物；1:1:N 关系增加了路径复杂性。"
        source: "creative"
        source_task: null
        delta_lines: 55

  - id: D14
    name: "颜色使用规则"
    tag: meta
    current: "每个 triple 使用 3 种不同颜色（bar 色、线段色、障碍物色），背景色为最频繁色；多个 triple 之间可共享颜色。"
    alternatives:
      - name: "bar 与线段同色"
        description: "bar 和线段使用相同颜色，只有障碍物用不同色；解题者需要通过形状（直线 vs 不规则）而非颜色区分 bar 和线段。"
        source: "inversion"
        source_task: null
        delta_lines: 25
      - name: "每个 triple 独占颜色组"
        description: "多个 triple 必须使用完全不同的颜色组，不能共享；这使得 triple 之间的对应关系可以通过颜色直接识别。"
        source: "creative"
        source_task: null
        delta_lines: 15
      - name: "颜色编码绕行方向"
        description: "线段颜色从两种预设色中选择，颜色 A 代表顺时针绕行，颜色 B 代表逆时针绕行；颜色从纯标识变为承载语义信息。"
        source: "color_pairing"
        source_task: "16de56c4"
