        delta_lines: 35
      - name: "尺寸与端点距离关联"
        description: "token中心到管道端点的距离不再固定为2格，而是由token的颜色或通道位置决定。大距离可能意味着更重要的通道。解题者需推断距离规则。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "最小化token（1x1像素）"
        description: "源token缩小为单个像素，不进行分解——直接沿管道传输并在远端生成特定形状。简化了形状变换但保留了管道追踪核心。"
        source: inversion
        source_task: null
        delta_lines: 20

  - id: D18
    name: "管道网络中的干扰元素"
    tag: obstacle
    current: "无干扰——管道网络中只有功能性元素（8号管道、5号交叉标记、9号矩形块），没有非功能性对象"
    alternatives:
      - name: "伪管道干扰"
        description: "网格中存在不连接到任何token端点的8号色管道片段（死胡同或孤立环路），解题者需区分功能管道和干扰管道。只有连接到token的管道才参与传输。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "伪token干扰"
        description: "网格中存在与管道不连接的多余3x3色块或X形token，它们不参与任何传输但在视觉上与真实token相同。解题者需通过管道连接关系辨别真伪。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "噪声标记干扰"
        description: "管道网络沿线放置少量非功能性的彩色像素（使用token颜色但不形成完整形状），作为视觉干扰。解题者需忽略噪声只关注完整的token形状。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D19
    name: "5号交叉标记的排列方式"
    tag: obstacle
    current: "成对标记——每个垂直/水平管道交叉处恰好有一对5号标记像素，分别位于直行管道的交叉点前后各一格"
    alternatives:
      - name: "多标记交叉（数量编码信息）"
        description: "交叉处的5号标记数量不固定——1个标记表示直行，3个标记表示转弯，0个标记表示默认直行。标记数量编码了交叉行为信息，解题者需发现数量-行为对应规则。"
        source: creative
        source_task: null
