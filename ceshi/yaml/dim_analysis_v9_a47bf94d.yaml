  - id: D16
    name: "源-目标基数关系"
    tag: meta
    current: "1:1映射——每个源token恰好对应一个目标端点，通过管道的置换关系确定"
    alternatives:
      - name: "一对多映射（分支传输）"
        description: "一个源token的管道分叉到多个目标端点，互补形状被复制到所有目标位置。解题者需识别分叉点并理解复制规则。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "多对一映射（汇聚合并）"
        description: "多个源token的管道汇聚到同一个目标端点，互补形状在目标处叠加或合并。最终目标形状由多个源贡献共同决定。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "条件映射（部分token不传输）"
        description: "只有满足特定条件的token执行传输（如只有连接到9号矩形块的通道才传输），其他token仅做原地分解不传输互补形状。解题者需推断传输条件。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D17
    name: "token尺寸与端点距离"
    tag: meta
    current: "固定3x3——所有token基于3x3外接矩形，token中心距管道端点恰好2格"
    alternatives:
      - name: "可变尺寸token"
        description: "不同通道的token尺寸不同（如3x3和5x5混合），分解规则按比例缩放。token尺寸编码了某个可推断信息（如通道排列顺序）。"
        source: creative
