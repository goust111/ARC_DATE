  - id: D14
    name: "管道颜色体系"
    tag: symbol_instructions
    current: "三色管道系统——主管道用8号色（青色），交叉标记用5号色（灰色），矩形连接块用9号色（栗色），三种结构色固定且不与token色冲突"
    alternatives:
      - name: "管道颜色与通道对应"
        description: "每条管道使用其运输token的颜色着色（而非统一色），解题者可从管道颜色直接看出路由关系。降低路由追踪难度但增加视觉丰富度。"
        source: color_pairing
        source_task: 16de56c4
        delta_lines: 35
      - name: "管道使用单一颜色无区分"
        description: "去掉5号和9号的区分，所有管道元素统一使用8号色。解题者需纯靠拓扑结构区分交叉和矩形块，难度提升。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "管道段颜色交替编码"
        description: "管道按段交替使用两种颜色（如每经过一个交叉就切换颜色），形成可视化的段计数。增加颜色模式推理维度。"
        source: alternating_pattern
        source_task: 13e47133
        delta_lines: 30
      - name: "管道宽度编码传输内容"
        description: "管道有粗细之分——细管道（1像素宽）传输十字形，粗管道（2像素宽）传输四角星形。管道宽度编码了传输的互补形状类型，解题者需注意管道粗细。"
        source: width_constraint
        source_task: 332f06d7
        delta_lines: 25

  - id: D15
    name: "输出网格尺寸"
    tag: grid_shape
    current: "尺寸不变（same）——输出网格与输入网格尺寸完全相同"
    alternatives:
      - name: "裁剪到管道区域"
        description: "输出裁剪掉token行之外的空白区域，只保留包含管道和变换结果的最小矩形。减少无信息像素，考验解题者对裁剪规则的理解。"
