task_id: a47bf94d
task_type: move_along_path
summary: "实心3x3色块连接到青色管道网络，被分解为十字形（留在原位）和四角星形（沿管道传输到另一端）；管道另一端的不完整形状用互补部分补全"

dimensions:
  - id: D1
    name: "管道路径追踪方式"
    tag: path
    current: "管道追踪（pipeline_trace）——沿青色(color 8)正交管道线段从一个端点追踪到另一个端点，遇到color-9矩形块时穿过（从入口面到对面出口面）"
    alternatives:
      - name: "最短路径搜索"
        description: "去掉预建管道结构，改为在背景网格中用BFS搜索从源到目标的最短路径；推理从管道追踪变为空间搜索，解题者需判断哪条路径最优。"
        source: shortest_path
        source_task: 7b0280bc
        delta_lines: 50
      - name: "对角线混合管道"
        description: "管道不仅有正交线段，还包含45度对角线段连接端点。解题者需在正交和对角混合路径中追踪连接关系，视觉上更复杂，管道弯折规则也需扩展。"
        source: diagonal_path
        source_task: 35ab12c3
        delta_lines: 40
      - name: "BFS链式激活扩散"
        description: "从源token发射信号，碰到管道交叉点时向所有连通分支传播，每到达一个端点就放置互补形状。从单一路径变为树形扩散，将1对1传输变为1对多扩散。"
        source: BFS_activation
        source_task: 5961cc34
        delta_lines: 60
      - name: "方向标记引导路径"
        description: "管道交叉处不用5号标记表示直行，而是使用不同颜色的箭头形像素指示转向方向。解题者需要先读懂方向标记的含义，再据此决定在交叉口的行进方向。"
        source: turning_rules
        source_task: e87109e9
        delta_lines: 30

  - id: D2
    name: "管道交叉处理规则"
    tag: obstacle
    current: "交叉标记（crossing markers）——垂直管道通过水平管道的交叉处，用一对5号像素标记穿行管道的交叉点前后，表示'直行不转弯'；9号矩形块作为宽接合体直穿对面"
    alternatives:
      - name: "反射镜代替直穿"
        description: "color-9矩形块不再直穿，而是将管道信号反射90度（从北进则从东或西出）。解题者需推断反射方向规则，增加空间推理难度。"
        source: reflection
        source_task: 142ca369
        delta_lines: 35
      - name: "无标记交叉——优先级规则"
        description: "移除5号交叉标记，交叉处信号始终沿当前方向直行（需从连通性推断）。视觉线索减少，推理更依赖全局管道结构。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "颜色编码交叉行为"
        description: "交叉标记改用不同颜色（如red/blue），不同颜色决定信号在交叉处直行还是转弯。解题者需从样例学习颜色-行为映射关系。"
        source: turning_rules
        source_task: e87109e9
        delta_lines: 40
      - name: "单侧标记转向"
        description: "交叉处只在一侧放置标记像素，标记在左侧表示左转，在右侧表示右转，无标记表示直行。比当前双侧对称标记更精细，解题者需注意标记位置而非仅存在性。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D3
    name: "传输轨迹可视化"
    tag: trajectory
    current: "无轨迹涂色——管道网络在输入和输出中保持不变，不因token传输而涂色或改变"
    alternatives:
      - name: "连续轨迹涂色"
        description: "token沿管道传送时，路径上的管道像素被重新着色为token的颜色，最终管道变成彩色显示路由路径。增加视觉信息和验证手段，解题者可以从轨迹反推传输关系。"
        source: continuous_trail
        source_task: 142ca369
        delta_lines: 20
      - name: "间歇轨迹涂色"
        description: "管道路径上每隔N格涂一个token色像素，形成虚线状轨迹。间距从示例中推断，增加了模式识别的维度。"
        source: periodic_pattern
        source_task: 221dfab4
        delta_lines: 25
      - name: "管道擦除轨迹"
        description: "token传送经过的管道段被擦除为背景色，只保留未使用的管道段。取反当前的保留策略，解题者需在心里追踪已消失的管道路径。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "颜色渐变轨迹"
        description: "管道上的轨迹从源端颜色逐段变化到目的端颜色（经过预定义调色板中的中间色），体现传输距离和方向。解题者需发现颜色渐变规律。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D4
    name: "token形状分解方式"
    tag: transform
    current: "分解（decomposition）——实心3x3块被分解为十字形（中心+4个正交邻居，留在原位）和四角星形（4个对角角，沿管道移动）"
    alternatives:
      - name: "反向分解（对角留、正交走）"
        description: "将分解规则反转：四角星形（对角像素）留在原位，十字形（正交像素+中心）沿管道传输到另一端。直接的逻辑取反，解题者需发现与原始任务相反的分解-传输对应关系。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "环形与核心分解"
        description: "3x3块分解为外环（8个边缘像素）和核心（1个中心像素）。外环留在原位，核心像素扩展为十字或菱形传输到远端。分解方式更直观但传输形状与源形状差异更大。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "镜像对称分解"
        description: "3x3块不按十字/四角星分解，而是按水平或垂直中线分成两半（如上半+下半或左半+右半），一半留原位一半传送。分解逻辑从旋转对称变为镜像对称。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "L形分解"
        description: "3x3块分解为两个互补的L形部分（如左上L和右下L），一个留原位一个传输。两个L形各包含5和4个像素。创造非对称分解，增加形状识别的复杂性。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D5
    name: "形状补全规则"
    tag: transform
    current: "形状补全（shape_completion）——如果管道一端已存在十字形或四角星形，则在另一端放置互补形状（四角星对应十字，十字对应四角星），颜色与已有形状相同"
    alternatives:
      - name: "叠加合并补全"
        description: "互补形状不是放置在空位，而是叠加到远端已有的形状上合并为完整3x3块。解题者需要理解形状合并的逻辑——最终形成完整的复合图案。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "颜色变换补全"
        description: "互补形状传输到远端时，颜色按照管道经过的9号矩形数量决定偏移（如经过1个rect则颜色+1、经过2个则+2）。解题者需推断颜色变换规则。"
        source: recolor
        source_task: 271d71e2
        delta_lines: 20
      - name: "镜像翻转补全"
        description: "互补形状传输到远端时根据管道的整体走向做水平或垂直镜像翻转后放置。对于非对称形状（如L形分解），这会显著改变结果。"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 25
      - name: "擦除源+完整传送"
        description: "源token完全消失（不留十字形），全部9格以完整块形状出现在目的端。取反当前的'留一半'规则，从分解变为整体传送。"
        source: erase
        source_task: 3dc255db
        delta_lines: 15

  - id: D6
    name: "源token形状类型"
    tag: src
    current: "三种token形状——实心3x3块（输入中主要形式）、X形（对角+中心，5像素）、菱形（4正交邻居，4像素）；每种颜色最多出现一个实心或X形"
    alternatives:
      - name: "L形/T形token"
        description: "源token不再是3x3正方形，而是L形或T形（占5-6格），拆分规则变为旋转对称分解。形状识别和分解规则更复杂，解题者需先识别token形状再确定分解方式。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "5x5实心块"
        description: "源token放大为5x5实心块，拆分为更大的互补形状对（如大十字+大四角星），需要更大网格空间和更复杂的形状识别。视觉更醒目但分解逻辑保持一致。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "多色复合源块"
        description: "源是3x3块但内部有两种颜色（如边缘一色、中心另一色），分解后两部分各保留自己的颜色传送到不同目的地。增加颜色追踪维度，从单色追踪变为双色追踪。"
        source: color_grouping
        source_task: b5ca7ac4
        delta_lines: 50
      - name: "单像素标记源"
        description: "源不再是形状而是单个彩色像素，传送后在目标端生成预定义的固定形状（如十字）。从形状分解变为颜色到形状的映射问题。"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 35

  - id: D7
    name: "传输目标与停止条件"
    tag: dst
    current: "管道对端端点（pipeline far endpoint）——token的互补形状传输到同一管道的另一端点，距端点2格处放置"
    alternatives:
      - name: "距离编码停止"
        description: "互补形状不总是传到管道最远端，而是传输距离等于某个可推断参数（如源token中特定像素的数量或管道经过的交叉数）。解题者需推断距离的编码方式。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 25
      - name: "碰撞停止"
        description: "互补形状沿管道传输时，如果遇到另一个已有的token或互补形状则停止，而非总是到达最远端。创造先后顺序依赖——先处理的token可能阻挡后续传输。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 30
      - name: "堆叠式放置"
        description: "目的端已有形状时，新传送的形状不覆盖而是堆叠在其旁边（上/下/左/右偏移）。引入空间冲突解决逻辑，解题者需推断堆叠方向和顺序。"
        source: stacking
        source_task: 3dc255db
        delta_lines: 30
      - name: "颜色匹配对接"
        description: "目的端不由管道拓扑决定，而是形状传送到颜色匹配的目标框架处对接（如同色边框的空格）。从路由追踪变为颜色匹配+路由双重逻辑。"
        source: docking
        source_task: 7c66cb00
        delta_lines: 45

  - id: D8
    name: "9号矩形块的角色"
    tag: obstacle
    current: "直通连接节点——9号颜色的矩形块（2x2到5x4）嵌入管道中，管道从入口面直线穿过到对面出口面（仅当单入单出在相邻面时才转弯）"
    alternatives:
      - name: "信号变换节点"
        description: "9号矩形块不只是直通，而是对经过的token信号进行变换——如改变传输的互补形状类型（十字变四角星、四角星变十字）或改变颜色。解题者需理解矩形块的变换效果。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "阻断/过滤节点"
        description: "9号矩形块根据其内部尺寸（面积奇偶性）决定是否允许token通过——偶数面积允许通过，奇数面积阻断。被阻断的token不产生互补形状。解题者需推断通过条件。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "延迟旋转节点"
        description: "9号矩形块使经过的token互补形状发生90度旋转。矩形块的宽高比决定旋转方向（宽>高顺时针、高>宽逆时针）。对于非对称互补形状会改变最终放置方向。"
        source: conditional_rotation
        source_task: 291dc1e1
        delta_lines: 25
      - name: "分裂复制节点"
        description: "经过9号矩形块时一条管道分裂为多条出口管道，互补形状被复制到所有出口。矩形块的大小决定分裂数量，将1对1变为1对多传输。"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D9
    name: "形状循环关系"
    tag: transform
    current: "三形状循环: solid → (留十字, 发X) ; X → (留X, 发diamond) ; diamond → (已完成)。每种形状有确定的分解/互补规则。"
    alternatives:
      - name: "双形状系统"
        description: "简化为只有两种形状（如solid和hollow），传送后形状取反（solid变hollow，hollow变solid）。循环长度从3减为2，规则更简洁但推理逻辑改变。"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "四形状循环"
        description: "增加第四种形状（如3x3中只填4个十字臂端像素的thin-cross），形成四阶循环: solid→X→diamond→thin-cross→solid。每步拆分更精细，解题者需发现更长的循环关系。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "形状由颜色决定分解方式"
        description: "分解规则不固定——不同颜色的token有不同的分解模式（如红色solid分解为X+diamond，蓝色分解为L+反L）。解题者需从多样例推断颜色到分解的映射。"
        source: creative
        source_task: null
        delta_lines: 55
      - name: "可逆合并（反向操作）"
        description: "取反当前的分解操作——管道两端各有一个不完整形状，它们沿管道向中间传送后合并为完整的3x3实心块出现在管道中点。从分裂变为聚合。"
        source: inversion
        source_task: null
        delta_lines: 40

  - id: D10
    name: "通道排列逻辑（置换结构）"
    tag: meta
    current: "管道实现通道的非恒等置换（permutation），每个源端恰好连接一个目的端（1:1映射），置换至少包含一个交叉"
    alternatives:
      - name: "循环置换限制"
        description: "置换限制为单一循环（如1→2→3→4→1），而非任意置换。解题者可从管道拓扑推断循环结构，推理更具规律性。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "条件置换（基于token属性）"
        description: "置换不固定，而是由token的属性决定——实心块和X形token使用不同的置换规则。解题者需先分辨token类型，再确定适用的路由规则。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "恒等置换（无交叉）"
        description: "取反当前必须交叉的约束——管道可以不交叉，即每个通道token传送到正对面。使推理重点转向形状变换而非路由追踪。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "多对一汇聚置换"
        description: "多条管道汇聚到同一目的端（如2个源token都传送到同一位置），汇聚处形状需合并。从排列变为多对一函数，解题者需处理合并逻辑。"
        source: creative
        source_task: null
        delta_lines: 45

  - id: D11
    name: "通道数量与空间布局"
    tag: meta
    current: "4-5个通道，均匀列间距4-5，顶部和底部放置token行，管道竖直为主加横向交叉段"
    alternatives:
      - name: "左右布局"
        description: "token改为分布在网格左右两侧（而非上下），管道以横向为主线连接。改变空间结构方向，推理从上下追踪变为左右追踪。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "四边环形布局"
        description: "token分布在网格四条边上（上下左右各有token），管道从各边出发在中心区域交会和路由。拓扑复杂度大幅提升但网格利用率更高。"
        source: creative
        source_task: null
        delta_lines: 60
      - name: "不等间距通道"
        description: "通道间的水平间距不再统一，而是根据某种规则变化（如递增或按通道颜色值排序）。解题者需理解间距模式才能正确定位token。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "大量通道（6-8个）"
        description: "将通道数增加到6-8个，管道交叉更密集，推理复杂度显著提升。需要更大网格（可能超过26列限制，需适当调整间距）。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D12
    name: "输入中token的初始状态"
    tag: src
    current: "混合输入——大部分通道以实心3x3块作为输入token，0-2个通道以X形作为输入token；X形通道的远端约67%留空、33%预放菱形"
    alternatives:
      - name: "全部实心输入"
        description: "所有通道输入端都是实心3x3块，没有X形或菱形的输入变体。简化输入多样性，但解题者仍需理解分解和传输规则。适合作为难度降低的变体。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "全部X形输入"
        description: "所有通道输入端都是X形token，没有实心块。解题者需理解X形token只生成菱形互补形状的规则，且X形本身保持不变。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "双端部分形状输入"
        description: "每个通道两端各有一个不完整形状（如一端有十字、另一端有部分四角星），解题者需将两端都补全为完整互补对。比当前单端token更复杂，需双向推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "不完整token（残缺3x3块）"
        description: "输入中的solid块可能缺少1-2个像素，解题者需先识别意图形状再进行分解传送。增加形状修复的前置步骤。"
        source: shape_completion
        source_task: null
        delta_lines: 40

  - id: D13
    name: "多步处理顺序"
    tag: multi_step
    current: "单步变换——每个token独立执行一次分解和传输操作，各通道之间没有顺序依赖"
    alternatives:
      - name: "链式反应传播"
        description: "token的互补形状到达远端后，如果该端点连接另一条管道则继续向下一条管道传输（链式反应）。形状在每次传输后进一步变换。解题者需追踪多级传输。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 35
      - name: "按管道长度排序处理"
        description: "token按其管道路径长度从短到长依次处理，先到达的token可能占据位置影响后续token的放置。引入冲突逻辑和顺序依赖。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "先拆分后路由两步"
