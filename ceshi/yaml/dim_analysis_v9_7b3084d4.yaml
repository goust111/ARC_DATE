task_id: 7b3084d4
task_type: move_to_match
summary: "将散落在网格上的4块彩色矩形拼图块（含一块带灰色角标的锚定块）拼装成一个完整矩形，灰色标记像素固定在输出的左上角"

dimensions:
  - id: D1
    name: "匹配条件：边缘对齐拼合"
    tag: match_cond
    current: "各块边缘对齐，使拼合后的并集形成一个无缝连续矩形（jigsaw tab/slot 互锁）"
    alternatives:
      - name: "颜色边缘匹配"
        description: "在每块拼图的边缘涂上彩色像素条，只有边缘颜色相同的两块才能拼在一起。解题者需要先通过边缘颜色确定哪两块相邻，再确定旋转方向。这增加了匹配的信息维度，从纯几何变为几何+颜色双重约束。"
        source: edge_color_match
        source_task: "247ef758"
        delta_lines: 40
      - name: "形状凹凸互锁匹配"
        description: "每块拼图的边缘不再是简单的单列/行tab，而是具有不规则凹凸轮廓（如L形或T形缺口），必须找到形状互补的边缘进行拼合。类似真正的拼图块，需要形状匹配而非仅长度对齐，显著提高空间推理难度。"
        source: shape_match
        source_task: "16b78196"
        delta_lines: 55
      - name: "连接器标记匹配"
        description: "在每块拼图的边缘放置特定颜色的小连接器标记（如1-2个像素），只有连接器颜色和位置匹配的边才能对接。解题者需要先识别连接器，再推断拼接关系，引入了符号配对的推理层。"
        source: connector_match
        source_task: "20270e3b"
        delta_lines: 45
      - name: "面积排序匹配"
        description: "不通过几何互锁确定拼接位置，而是按块的面积大小排序确定它们在输出中的象限位置（如最大块放左上、次大放右上等）。将空间推理转换为数值排序推理，完全改变解题策略。"
        source: size_ordering
        source_task: "31f7f899"
        delta_lines: 35

  - id: D2
    name: "源对象：拼图块的构成"
    tag: src
    current: "4块单色实心矩形拼图块（每块一种颜色），外加1个单像素标记"
    alternatives:
      - name: "多色拼图块"
        description: "每块拼图不再是单色的，而是包含内部图案（如条纹、棋盘格或随机着色）。拼装后的输出是一个有复杂图案的矩形。解题者需要在拼图块本身有多种颜色的情况下识别块的边界和旋转方向，难度显著提升。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "非矩形拼图块"
        description: "拼图块不限于矩形形状，可以是L形、T形等多连方块（polyomino），但仍需无缝拼合成完整矩形。类似于俄罗斯方块拼图，需要更复杂的空间旋转和位置推理。"
        source: creative
        source_task: null
        delta_lines: 60
      - name: "数量可变的拼图块"
        description: "拼图块数量不固定为4块，可能是3块、5块或6块，拼合成不同划分方式的矩形。解题者需要先确定块的数量和拼合方式，增加了问题的开放性。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "含空洞的拼图块"
        description: "某些拼图块内部有空洞（背景色像素），拼合后空洞被相邻块填充。解题者需要识别哪些像素属于空洞而非块的一部分，增加了分割难度。"
        source: cavity_fill
        source_task: "5dbc8537"
        delta_lines: 45

  - id: D3
    name: "目标结构：拼合后的输出形状"
    tag: dst
    current: "紧密裁剪的2N x 2N正方形，4个象限通过tab互锁"
    alternatives:
      - name: "非正方形矩形输出"
        description: "输出不限于正方形，可以是任意比例的矩形（如3:2、4:1等）。解题者需要同时推断输出的宽高比和拼接方式，增加了一个未知维度。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "L形或U形输出"
        description: "拼合后的输出不是完整矩形，而是L形或U形（即有一个角落缺失）。解题者需要推断最终形状不是矩形，这打破了常见假设，增加意外性。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "嵌套框架输出"
        description: "拼合后形成嵌套的同心矩形框架（类似俄罗斯套娃），外层框架由一种颜色、内层由另一种颜色组成。解题者需要按层拼装而非按象限拼装。"
        source: nested_frames
        source_task: "45a5af55"
        delta_lines: 50
      - name: "带边框的输出"
        description: "拼合后的矩形外围有一圈额外的单色边框（来自第五块拼图或由变换生成），输出尺寸变为(2N+2)x(2N+2)。解题者需要区分边框和内容块。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "变换：锚定块旋转规则"
    tag: transform
    current: "旋转锚定块使灰色标记像素落在左上角(0,0)位置"
    alternatives:
      - name: "标记指定其他角落"
        description: "灰色标记不总是落在左上角，而是根据标记像素在锚定块上的相对位置（左上/右上/左下/右下）决定标记在输出中的最终位置（如标记在锚定块右上→输出中标记也在右上）。解题者需要推断标记的目标位置而非假设固定在(0,0)。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "标记颜色编码旋转次数"
        description: "使用不同颜色的标记像素来编码旋转次数（如红色=不旋转，蓝色=90度，绿色=180度，黄色=270度）。解题者需要建立颜色-旋转的映射关系，增加了符号解码维度。"
        source: size_encoded_parameter
        source_task: "6ffbe589"
        delta_lines: 25
      - name: "双标记定向"
        description: "锚定块上有两个不同颜色的标记像素（如灰色和红色），分别固定在输出的左上角和右上角。这唯一确定了锚定块的旋转和翻转状态，同时引入翻转操作的可能性。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "镜像翻转替代旋转"
        description: "锚定块不是通过旋转对齐，而是通过水平或垂直镜像翻转对齐（标记像素的位置决定翻转轴）。这改变了空间变换的类型，需要不同的心理旋转策略。"
        source: reflection
        source_task: "b10624e5"
        delta_lines: 25

  - id: D5
    name: "网格形状：输出裁剪方式"
    tag: grid_shape
    current: "紧密裁剪(tight crop)，输出恰好是拼合后的矩形大小"
    alternatives:
      - name: "保留输入网格尺寸"
        description: "输出保持与输入相同的20x20网格尺寸，拼合后的矩形放置在网格的特定位置（如左上角或中心）。解题者需要推断放置位置和保留背景的规则。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "带背景边距的输出"
        description: "输出在拼合矩形周围留有固定宽度（如1像素）的背景色边距。输出尺寸为(2N+2)x(2N+2)而非2Nx2N。解题者需要推断边距规则。"
        source: grid_expand
        source_task: "20270e3b"
        delta_lines: 10
      - name: "按块分隔排列输出"
        description: "输出不是将块拼合，而是将各块按特定顺序排列在网格中，块之间有1像素间隔（packed grid布局）。解题者需要推断排列顺序规则（如按颜色、大小或原始位置排序）。"
        source: packed_grid
        source_task: "58f5dbd5"
        delta_lines: 35

  - id: D6
    name: "多步骤：拼装顺序"
    tag: multi_step
    current: "重复合并直到所有拼图块组装成单个矩形（隐式顺序，solver 使用回溯搜索）"
    alternatives:
      - name: "逐步附加拼装"
        description: "拼图块必须按特定顺序逐步附加到锚定块上（如按面积从大到小、按颜色值从小到大）。每步只能附加一块，且必须与已有结构的暴露边缘匹配。输出展示最终状态，但解题者需要推断正确的附加顺序。"
        source: multi_step
        source_task: "446ef5d2"
        delta_lines: 30
      - name: "两阶段拼装：先分组再合并"
        description: "4块拼图先两两拼成2个子矩形，然后2个子矩形再拼合成最终矩形。解题者需要推断分组方式和两阶段的拼合逻辑。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "含干扰块的过滤拼装"
        description: "输入中有5-6块拼图，但只有4块能拼合成完整矩形，其余是干扰块。解题者需要先通过形状匹配筛选出正确的块，再进行拼装。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D7
    name: "标记像素机制"
    tag: symbol_instructions
    current: "单个灰色(5)像素作为锚定标记，确定锚定块身份和输出朝向"
    alternatives:
      - name: "多块标记定序"
        description: "每块拼图上都有一个不同颜色的标记像素，标记颜色编码了该块在输出中的位置（如象限分配）。解题者需要建立标记颜色到位置的映射关系，而非仅靠几何匹配。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "标记像素指示拼接边"
        description: "标记像素不在角落而在拼图块的边缘中点，指示该边是与锚定块对接的边。解题者需要根据标记位置推断对接方向，增加空间推理步骤。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "标记像素编码输出尺寸"
        description: "标记不是单个像素而是由2-3个像素组成的小图案，图案的形状（水平线=宽矩形、垂直线=高矩形、L形=正方形等）编码了输出矩形的宽高比例信息。解题者需要先解码标记图案再进行拼装。"
        source: symbol_instructions
        source_task: "a32d8b75"
        delta_lines: 40

  - id: D8
    name: "拼图块分割方式（tab结构）"
    tag: meta
    current: "2Nx2N正方形分为4个NxN象限，通过单列/行的tab（深度1到N-1）跨越象限边界实现互锁"
    alternatives:
      - name: "不规则分割线"
        description: "象限之间的分割线不是直线加tab，而是沿锯齿形或阶梯形路径，使每块的边缘呈不规则轮廓。拼图更接近真实拼图，几何匹配更困难，需要精确的形状对比推理。"
        source: creative
        source_task: null
        delta_lines: 50
      - name: "无tab简单分割"
        description: "取消tab机制，4块就是4个纯矩形（可以不等分），通过颜色和尺寸推断各块在输出中的位置。去掉互锁使得匹配条件从几何约束变为逻辑推理（如最宽的块在左侧）。"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "交叉分割（十字形）"
        description: "矩形不按象限分割，而是按十字形切割为5块（中心正方形+上下左右4个矩形）。中心块作为锚定块，其余4块环绕拼合。改变了拼接的拓扑关系——每块只与中心块相邻。"
        source: creative
        source_task: null
        delta_lines: 45

  - id: D9
    name: "锚定块识别机制"
    tag: meta
    current: "通过唯一的单像素标记（颜色5）的8邻接关系识别锚定块（颜色7）"
    alternatives:
      - name: "最大面积块为锚定"
        description: "取消标记像素，改为面积最大的块自动成为锚定块，其左上角固定在输出(0,0)。解题者需要先比较所有块的面积来确定锚定块，推理过程不同。"
        source: inversion
