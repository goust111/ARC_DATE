        delta_lines: 20
      - name: "固定颜色为锚定"
        description: "取消标记像素，改为特定颜色（如红色）的块始终是锚定块。但不再有标记指示旋转方向，需要通过其他线索（如块的宽高比或不对称特征）推断正确朝向。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "唯一非矩形块为锚定"
        description: "锚定块是唯一一个不是纯矩形的块（带有缺角或凸出），其不对称形状唯一确定旋转方向（缺角必须在左上）。其余块仍是矩形。解题者需要通过形状异常性识别锚定块。"
