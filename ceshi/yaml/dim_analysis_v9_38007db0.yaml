    alternatives:
      - name: "多精灵颜色"
        description: "精灵使用2种颜色绘制（如红和蓝混合），唯一项的差异可能是颜色替换而非像素翻转。增加颜色维度的推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "每行不同精灵颜色"
        description: "不同行的精灵使用不同颜色（第一行红，第二行蓝等），但同行内颜色一致。唯一项仍通过形状差异识别。增加视觉复杂度但不影响核心逻辑。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "唯一项颜色标记"
        description: "唯一项除了形状差异外，还使用了不同于多数派的精灵颜色。提供双重线索（形状+颜色），降低难度但增加规则推理层。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D10
    name: "多步处理与排序"
    tag: multi_step
    current: "单步处理 — 直接识别并提取每行唯一项"
    alternatives:
      - name: "两阶段处理：先识别基础精灵再找差异"
        description: "输出分两部分：顶部显示识别出的基础精灵（共享模式），底部显示各行唯一项。需要推理出共享模式是什么。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "迭代消除"
        description: "多轮消除：第一轮找出并移除最明显的唯一项（差异最大的），第二轮在剩余中继续。输出按消除顺序排列。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "分层检测：先行后列"
        description: "先在行方向检测唯一项，再在列方向检测唯一项，取交集（行列都唯一的单元格）。增加二维推理复杂度。"
        source: creative
        source_task: null
        delta_lines: 35

