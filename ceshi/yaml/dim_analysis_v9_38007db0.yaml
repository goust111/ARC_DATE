        delta_lines: 10
      - name: "唯一项沿对角线排列"
        description: "唯一项位置固定在主对角线上（第i行的唯一项在第i列）。有明显的视觉规律但核心提取逻辑不变。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "唯一项位置编码在输出中"
        description: "输出中不仅包含唯一项精灵，还用格子线颜色的深浅或额外像素编码唯一项在输入中的列位置。增加信息编码层。"
        source: symbol_instructions
        source_task: null
        delta_lines: 25

