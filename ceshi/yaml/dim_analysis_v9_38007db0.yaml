task_id: 38007db0
task_type: move_to_match
summary: "从格子网格的每一行中找出唯一不同的单元格（奇异项），提取到单列格子输出中"

dimensions:
  - id: D1
    name: "匹配条件：行对齐选取唯一项"
    tag: match_cond
    current: "s.pos.row == d.pos.row — 每行中出现一次的奇异单元格被提取到输出对应行"
    alternatives:
      - name: "列对齐选取唯一项"
        description: "改为按列寻找唯一单元格（每列中有一个与其他不同的），提取到单行输出。解题者需要切换从行扫描到列扫描的思维方向，增加空间推理难度。"
        source: column_row_alignment
        source_task: 8b9c3697
        delta_lines: 20
      - name: "频率最少项选取（而非唯一项）"
        description: "每行不限只有一个奇异项，而是选取出现次数最少的模式（可能有2个相同的少数派vs多个多数派）。解题者需从简单唯一性判断升级为计数比较推理。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "多数派选取（取反：选最常见的）"
        description: "取反当前逻辑：不选唯一不同的，而是选每行中出现最多次的模式（多数派）。输出包含多数派单元格，逻辑完全反转。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "形状匹配：按精灵像素数匹配"
        description: "每行单元格按精灵填充密度排序，选取密度最高（或最低）的。解题者需计算每个单元格的填充率而非简单比较模式是否相同。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "对角线对齐选取"
        description: "不按行/列对齐，而是按主对角线或副对角线上的位置匹配。比如行号==列号的对角线单元格被提取。需要理解二维坐标关系。"
        source: diagonal_symmetry
        source_task: 4c416de3
        delta_lines: 30

  - id: D2
    name: "源对象：行内唯一精灵单元格"
    tag: src
    current: "每行中模式只出现一次的方形单元格（内含独特精灵变体）"
    alternatives:
      - name: "异常检测：颜色异常项"
        description: "不再通过模式唯一性检测，改为每行中有一个单元格使用了不同的精灵颜色（其他用颜色A，唯一项用颜色B）。解题者需关注颜色而非形状差异。"
        source: anomaly_detection
        source_task: b99e7126
        delta_lines: 20
      - name: "镜像异常项"
        description: "多数单元格有相同精灵，唯一项是该精灵的水平/垂直镜像。解题者需要识别镜像变换而非像素级差异。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "旋转异常项"
        description: "唯一项是基础精灵的90度/180度旋转版本。需要心理旋转能力来辨别哪个不一样。"
        source: rotation
        source_task: fc7cae8d
        delta_lines: 25
      - name: "对称性缺失检测"
        description: "基础精灵具有某种对称性（如水平对称），唯一项是破坏了该对称性的变体。解题者需识别对称性属性的破坏。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D3
    name: "目标位置：单列格子输出"
    tag: dst
    current: "输出为单列格子，保留原始行高，每行放置该行的唯一单元格"
    alternatives:
      - name: "单行格子输出"
        description: "如果改为列方向检测，输出变为单行格子（水平排列）。改变输出的空间布局方向。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "紧凑堆叠输出（无格线分隔）"
        description: "输出中去掉格子线分隔，将提取的单元格紧密堆叠。解题者需注意输出格式的变化。"
        source: packed_grid
        source_task: 58f5dbd5
        delta_lines: 15
      - name: "按唯一项列位置排序输出"
        description: "输出中单元格不按原始行顺序排列，而是按唯一项在输入中的列位置从左到右排序。增加排序推理环节。"
        source: size_ordering
        source_task: 31f7f899
        delta_lines: 20
      - name: "原位标记（保留输入网格）"
        description: "不提取到新网格，而是在原输入网格上将非唯一单元格清空（填充背景色），只保留唯一项在原位。输出尺寸与输入相同。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "变换：直接复制无变换"
    tag: transform
    current: "唯一单元格原样复制到输出，无颜色或形状变换"
    alternatives:
      - name: "重新着色为统一颜色"
        description: "提取的唯一项精灵颜色统一变为某个新颜色（如格子线颜色）。增加变换规则的推理。"
        source: recolor
        source_task: 20270e3b
        delta_lines: 10
      - name: "取反精灵（精灵色与背景色互换）"
        description: "提取的唯一项在输出中进行颜色反转（精灵像素变背景，背景像素变精灵色）。类似底片效果，增加变换识别难度。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 10
      - name: "只保留差异像素"
        description: "输出中不显示完整唯一项精灵，而只显示唯一项与基础精灵不同的那几个像素（差异部分高亮）。解题者需理解差分操作。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "旋转后输出"
        description: "每个提取的唯一项在输出中旋转90度。增加空间变换推理层。"
        source: rotation
        source_task: 2c181942
        delta_lines: 15

  - id: D5
    name: "网格输出形状"
    tag: grid_shape
    current: "tight crop — 输出为紧凑的单列格子（宽度=cell_size+2）"
    alternatives:
      - name: "保持原始网格尺寸"
        description: "输出保持与输入相同的网格尺寸，非唯一单元格位置填充背景色。解题者需要判断哪些位置被清空。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "扩展输出含元信息行"
        description: "输出底部增加一行额外信息，如用颜色编码每行唯一项的原始列位置。增加信息编码维度。"
        source: grid_expand
        source_task: 20270e3b
        delta_lines: 25
      - name: "自适应裁剪到精灵外接矩形"
        description: "输出不保留单元格边界padding，而是裁剪到每个精灵的最小外接矩形并堆叠。更紧凑但需要理解裁剪规则。"
        source: crop
        source_task: a251c730
        delta_lines: 20

  - id: D6
    name: "格子结构参数：单元格尺寸"
    tag: meta
    current: "所有单元格为统一的5x5或6x6正方形"
    alternatives:
      - name: "混合尺寸行"
        description: "不同行的单元格高度不同（如第一行5x5，第二行6x6），但同一行内所有单元格尺寸相同。增加多尺度处理的复杂性。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "矩形单元格（非正方形）"
        description: "单元格为长方形（如5x7），精灵区域相应变为非正方形。需要调整比较逻辑以适应非对称形状。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "更大单元格（8x8或更大）"
        description: "增大单元格尺寸，使精灵更复杂，差异更细微难以察觉。增加视觉辨识难度。"
        source: creative
        source_task: null
        delta_lines: 5

  - id: D7
    name: "异常项差异程度"
    tag: meta
    current: "唯一项与基础精灵有1-3个像素翻转差异"
    alternatives:
      - name: "极小差异（仅1像素）"
        description: "强制唯一项只有1个像素不同，增加视觉搜索难度。解题者必须非常仔细地逐像素比较。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "大差异（50%以上像素不同）"
        description: "唯一项与基础精灵有大量差异（翻转一半以上像素），使得唯一项看起来完全不同。降低搜索难度但保持逻辑不变。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "渐变差异（每行差异递增）"
        description: "第一行唯一项差1像素，第二行差2像素，第三行差3像素。解题者可能注意到递增模式，但核心逻辑不变。"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D8
    name: "行内唯一项位置约束"
    tag: meta
    current: "每行中唯一项的列位置随机选取，可跨行重复"
    alternatives:
      - name: "唯一项列位置不重复"
        description: "每行的唯一项必须在不同列（类似N皇后约束）。增加生成约束，解题者可能利用此规律辅助判断。"
        source: creative
