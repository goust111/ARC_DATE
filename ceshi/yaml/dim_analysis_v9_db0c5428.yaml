task_id: db0c5428
task_type: symmetry/pattern
summary: "输入为一个9x9图案（3x3块阵列，中心块缺失），输出将每个非中心块复制到点对称的外部槽位形成5x5块网格，同时根据周围块的朝向像素重建中心块"

dimensions:
  - id: D1
    name: "块到外部槽位的映射规则"
    tag: match_cond
    current: "每个非中心3x3块被复制到以中心为对称点的对侧外部槽位，即block(r,c)映射到5x5网格的(4-2r, 4-2c)位置"
    alternatives:
      - name: "旋转90度映射而非点对称映射"
        description: "将每个非中心块按顺时针90度旋转映射到外部槽位，例如左上块映射到右上外侧而非右下外侧。解题者需要识别旋转方向而非简单点对称，改变空间推理模式"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "镜像映射（仅沿一个轴）"
        description: "块仅沿水平或垂直轴镜像到外侧，而非点对称。例如左上块只映射到左下外侧（垂直镜像）。解题者需要判断镜像轴方向，且外部槽位布局不再具有完全对称性"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "按距离中心远近映射到不同层级"
        description: "角落块（距中心最远）映射到最外层槽位，边缘块（距中心较近）映射到较近的外层。引入距离概念作为映射依据，解题者需要计算每个块到中心的距离来确定目标位置"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "颜色匹配决定映射目标"
        description: "外部槽位中预放置单个颜色标记像素，块需要根据自身主色与标记颜色的匹配关系确定映射到哪个槽位。将空间规则转化为颜色匹配规则，推理路径完全改变"
        source: catalog_tag_name
        source_task: 4c416de3
        delta_lines: 35

  - id: D2
    name: "源图案的块阵列结构"
    tag: src
    current: "9x9图案由3x3个3x3块组成，中心块缺失（填充背景色），块间无间隔"
    alternatives:
      - name: "4x4块阵列（16个块，中心2x2缺失）"
        description: "扩展为4x4个3x3块的12x12图案，中心4个块缺失。外扩后形成6x6块网格，中心需要重建4个块而非1个。增加了规模和中心重建的复杂度"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "块间带1像素分隔线"
        description: "3x3块之间用1像素宽的分隔线（特定颜色）隔开，图案总尺寸变为11x11。解题者需要识别分隔线并理解外扩时分隔线的延续规则"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "块大小可变（2x2或4x4）"
        description: "块的尺寸不固定为3x3，在不同示例中可能是2x2或4x4，解题者需要先推断块的大小再执行后续操作。增加了参数推断的步骤"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "十字形阵列（仅保留中心行和中心列的块）"
        description: "不是完整的3x3阵列，而是十字形排列的5个块（中心缺失，四角也缺失）。外扩时仅有4个非中心块参与映射，输出形态为十字形扩展"
        source: inversion
        source_task: null
        delta_lines: 30

  - id: D3
    name: "外部槽位的网格布局"
    tag: dst
    current: "5x5块网格中原始3x3占据(1,1)-(3,3)，新块填充到对称外侧的8个位置，其余12个外部位置保持背景色"
    alternatives:
      - name: "完全填充的5x5网格（所有25个位置都有内容）"
        description: "外部槽位全部填充，缺失位置通过插值或复制相邻块生成。解题者需要推断缺失位置的生成规则（如取相邻两个块的混合），难度大幅增加"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "仅扩展一个方向（3x5或5x3网格）"
        description: "块仅向上下或左右扩展，形成3行5列或5行3列的网格而非完整5x5。解题者需要判断扩展方向，可能由图案中某个视觉线索决定"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "环形排列外部块"
        description: "外部块不放置在矩形网格的外层，而是环形排列在原始图案周围，角落块放在对角线方向，边缘块放在正方向。视觉上形成环绕效果而非网格扩展"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "堆叠到独立的输出区域"
        description: "外部块不在原始图案周围放置，而是在网格的另一个区域按顺序排列成一行或一列。解题者需要理解空间上的分离映射关系"
        source: stacking
        source_task: 3dc255db
        delta_lines: 25

  - id: D4
    name: "块复制时的几何变换"
    tag: transform
    current: "复制到对侧外部槽位时不旋转不翻转，保持原始方向"
    alternatives:
      - name: "复制时做180度旋转"
        description: "每个块复制到对侧时同时做180度旋转（等价于上下+左右翻转）。由于原始图案具有双轴对称性，需要精心设计打破对称的图案才能让旋转效果可见，增加视觉辨别难度"
        source: rotation
        source_task: 2c181942
        delta_lines: 15
      - name: "复制时沿水平轴翻转"
        description: "块在复制到外侧时做上下翻转。解题者需要识别翻转方向（水平轴还是垂直轴），与纯复制形成对比"
        source: reflection
        source_task: 7ed72f31
        delta_lines: 15
      - name: "复制时颜色取反（使用颜色映射表）"
        description: "块在复制到外侧时，像素颜色通过图案中可推断的映射关系进行替换（如颜色A与颜色B互换）。解题者需要同时理解空间映射和颜色映射两层规则"
        source: color_swap
        source_task: a25697e4
        delta_lines: 25
      - name: "角落块旋转、边缘块不旋转"
        description: "对角线方向的块（角落块）在复制时做90度旋转，正方向的块（边缘块）保持不变。引入基于位置的条件变换，解题者需要区分不同类型的块并应用不同规则"
        source: conditional_rotation
        source_task: 291dc1e1
        delta_lines: 30

  - id: D5
    name: "中心块的重建机制"
    tag: transform
    current: "中心块的8个非中心像素取自8个相邻块的朝向像素（facing pixel），中心像素取图案的多数前景色"
    alternatives:
      - name: "中心块全部使用多数前景色填充"
        description: "不从相邻块提取朝向像素，而是将中心块完全填充为图案的多数前景色（单色块）。简化了中心重建逻辑，但解题者仍需确定多数色"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "中心块通过双轴对称性从自身推断"
        description: "利用图案的LR和UD对称性，将中心块的每个像素通过与其对称位置的已知块像素恢复。例如中心块(0,0)对应右下块(2,2)的对称位置。推理基于全局对称而非局部朝向"
        source: symmetry_repair
        source_task: 8e5c0c38
        delta_lines: 25
      - name: "中心块取8个朝向像素的少数色而非多数色作为中心"
        description: "中心像素不使用多数前景色，而使用朝向像素中出现次数最少的颜色。解题者需要做计数并取反，形成max->min的逻辑反转"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "中心块模式由角落块的对角像素编码决定"
        description: "四个角落块的对角像素（朝向中心的角像素）编码了中心块的某种填充模式，例如四个角像素颜色组成2x2核心，再扩展为3x3。引入符号解码步骤"
        source: symbol_instructions
        source_task: null
        delta_lines: 30

  - id: D6
    name: "图案的整体对称性"
    tag: match_cond
    current: "输入的9x9图案具有完全的双轴对称性（LR和UD），相对块互为镜像翻转"
    alternatives:
