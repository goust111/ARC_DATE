task_id: 332f06d7
task_type: move_along_path
summary: "黑色方块沿蓝色水道通道滑行至同尺寸红色方块位置，若通道过窄无法通过则停在最远可达处"

dimensions:
  - id: D1
    name: "通道导航方式"
    tag: path
    current: "沿蓝色水道走廊（corridor_following），方块在宽度>=n的通道内BFS搜索可行放置位置"
    alternatives:
      - name: "重力流动导航"
        description: "方块不再自由BFS导航，而是受重力影响只能向下或向两侧流动（类似水流）。解题者需要理解重力约束下的运动规则，推理方块在重力场中的可达位置，增加物理直觉推理"
        source: gravity
        source_task: 28a6681f
        delta_lines: 30
      - name: "直线射线导航"
        description: "方块沿直线方向滑行直到撞墙或到达边界，然后停下或改变方向。将自由路径搜索简化为直线运动，但需要判断碰撞后的行为"
        source: straight_ray
        source_task: 221dfab4
        delta_lines: 25
      - name: "反射导航"
        description: "方块沿某方向移动，碰到通道壁时反射（入射角=反射角）继续前进。解题者需要追踪反射路径，推理难度显著提升"
        source: reflection
        source_task: 142ca369
        delta_lines: 35
      - name: "螺旋路径导航"
        description: "方块从起点出发沿螺旋路径向内或向外移动，每次碰壁顺时针转90度。解题者需识别螺旋模式并推断终点位置"
        source: spiral_path
        source_task: da515329
        delta_lines: 35
      - name: "管道跟踪导航"
        description: "通道有明确的入口和出口，方块沿管道的拓扑结构移动而非BFS最短路径。当通道有分叉时需选择特定分支（如总是左转或右转），增加规则推理层"
        source: pipeline_trace
        source_task: a47bf94d
        delta_lines: 30

  - id: D2
    name: "通道宽度约束"
    tag: path
    current: "通道宽度>=n时可通过，<n时形成阻塞点（chokepoint），方块被卡住"
    alternatives:
      - name: "无宽度约束（始终可达）"
        description: "取消宽度约束，方块只要有单像素连通路径即可到达终点（n=1等效行为）。简化了阻塞判断，解题者只需关注连通性，但可能降低推理难度"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "渐变宽度约束"
        description: "方块在移动过程中尺寸逐渐缩小（如每移动k步缩小1像素），因此更窄的通道在方块缩小后可能变得可通过。解题者需推断方块在各位置的当前尺寸"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "双向宽度检测"
        description: "通道宽度的判定不仅看水平/垂直截面，还要检测对角线方向的截面宽度。通道可能在正交方向足够宽但对角线方向过窄，增加空间推理复杂度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "阻塞点可破坏"
        description: "方块碰到阻塞点时不是停下，而是破坏部分墙壁（将背景色像素变为通道色）来拓宽通道继续前进，但破坏有次数限制。解题者需判断破坏的最优策略"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D3
    name: "轨迹涂色"
    tag: trajectory
    current: "无轨迹涂色——方块移走后原位置填充河流色（蓝色），不留下行进痕迹"
    alternatives:
      - name: "连续轨迹"
        description: "方块沿路径移动时，在经过的所有位置留下特殊颜色的轨迹（如灰色），形成从起点到终点的完整路径可视化。解题者可以通过轨迹验证路径正确性，增加输出的视觉信息量"
        source: continuous_trail
        source_task: 142ca369
        delta_lines: 20
      - name: "周期性轨迹"
        description: "轨迹颜色按周期循环变化（如每移动3步换一种颜色），形成彩色条纹路径。解题者可通过颜色周期判断移动步数和方向"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 25
      - name: "间歇性轨迹"
        description: "轨迹不连续，每隔一个位置留下标记形成虚线效果。解题者需理解间隔规则来追踪路径"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 15
      - name: "方块颜色渐变轨迹"
        description: "方块在移动过程中颜色逐步变化（从黑色渐变到红色），最终到达终点时变为目标色。解题者需从颜色渐变中推断运动距离和方向"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "源对象形态"
    tag: src
    current: "黑色实心n*n正方形，尺寸n=1~4，位于通道内部但不接触网格边缘"
    alternatives:
      - name: "矩形移动体"
        description: "将正方形改为矩形（如2*3），通道宽度约束根据矩形的宽和高分别判定水平和垂直方向的可通过性。解题者需考虑方向性的宽度匹配，增加空间推理维度"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "L形移动体"
        description: "移动体不是实心方块而是L形（如3*3方块去掉一个角），通道可通过性取决于L形的外接矩形或实际像素分布。解题者需理解非规则形状的碰撞检测逻辑"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "粒子像素移动体"
        description: "移动体是单个像素而非方块，通道宽度约束由通道中的标记（如特殊颜色的门控像素）来实现。改变了阻塞机制的视觉表达方式"
        source: particle_movement
        source_task: 9bbf930d
        delta_lines: 25
      - name: "多色方块移动体"
        description: "移动体是带有内部图案的n*n方块（如边框一种色、内部另一种色），移动后需保持图案完整。解题者需追踪整个图案的位移"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D5
    name: "终点条件"
    tag: dst
    current: "同尺寸红色实心方块位于通道末端（接触网格边缘），可达时方块覆盖目标位置"
    alternatives:
      - name: "多个候选终点"
        description: "通道中存在多个不同颜色的同尺寸目标方块，移动体需到达颜色值最小（或最大）的那个。解题者需识别正确的目标并判断可达性"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "距离编码终点"
        description: "移动体不以到达目标方块为终止条件，而是移动固定步数（步数由某个编码信号指定，如目标方块内部的特殊像素数量）。解题者需解码移动距离"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 30
      - name: "堆叠终点"
        description: "移动体到达目标后不是覆盖而是堆叠在目标旁边（如紧贴目标上方/下方放置），两者在输出中同时可见。解题者需判断堆叠方向"
        source: stacking
        source_task: 3dc255db
        delta_lines: 20
      - name: "网格边缘终点"
        description: "取消目标方块，移动体沿通道滑行直到到达网格边缘为止。简化了终点判断但改变了停止条件的视觉线索"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 15

  - id: D6
    name: "碰撞/覆盖变换"
    tag: transform
    current: "可达时移动体覆盖目标方块位置（目标消失），不可达时停在最远处（目标保留），原位置填充河流色"
    alternatives:
      - name: "颜色交换变换"
        description: "移动体到达目标时，两者的颜色互换——移动体变红、目标变黑。解题者需理解交换而非覆盖的逻辑"
        source: color_swap
        source_task: a25697e4
        delta_lines: 15
      - name: "移动体消失变换"
        description: "取反当前逻辑：移动体到达目标后自身消失（被河流色填充），而目标保持不变。解题者需理解'送达即消失'的规则"
        source: erase
        source_task: 3dc255db
        delta_lines: 10
      - name: "合并变换"
        description: "移动体到达目标时，两者合并成更大的方块（如两个2*2合并为2*4矩形），颜色使用移动体的颜色。解题者需推断合并方向和结果形状"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "重新着色变换"
        description: "移动体到达目标时，目标位置保留但变色为第三种颜色（如橙色），移动体也变为该颜色。通过引入新颜色来标记'已碰撞'状态"
        source: recolor
        source_task: 271d71e2
        delta_lines: 15

  - id: D7
    name: "输出网格形状"
    tag: grid_shape
    current: "输出与输入尺寸相同（same size），正方形网格 H=W"
    alternatives:
      - name: "紧凑裁剪输出"
        description: "输出仅保留通道区域的外接矩形，裁剪掉周围的纯背景行/列。解题者需判断裁剪边界"
        source: tight_crop
