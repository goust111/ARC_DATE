        delta_lines: 20
      - name: "按尺寸差异配对"
        description: "移动体和目标尺寸不同（如移动体3*3，目标2*2），移动体需到达目标位置但只覆盖与目标同尺寸的区域。解题者需处理尺寸不匹配的情况"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "颜色降序排序"
        description: "取反当前排序规则：颜色值较大的为移动体，较小的为目标。视觉上改变了黑/红的角色分配，解题者需发现反向排序规则"
        source: inversion
