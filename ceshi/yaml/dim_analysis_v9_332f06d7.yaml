        description: "取消 H=W 的约束，允许矩形网格。通道形态更加多样，增加生成多样性但不改变核心推理逻辑"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D8
    name: "移动体与目标的配对规则"
    tag: meta
    current: "按颜色值升序排序，颜色最小的为移动体（黑色0），次小的为目标（红色2），通过相同尺寸n配对"
    alternatives:
      - name: "按位置配对"
        description: "不按颜色排序而按位置关系配对：距离网格中心更近的为移动体，更远的为目标。解题者需计算位置而非依赖颜色编码来确定角色"
