        source_task: null
        delta_lines: 15

  - id: D9
    name: "多方块移动（基数关系）"
    tag: multi_step
    current: "1:1单一移动体到单一目标"
    alternatives:
      - name: "多对一移动"
        description: "多个不同颜色的移动方块沿各自路径向同一个目标移动，每个方块独立判断可达性。解题者需分别追踪多条路径的阻塞情况"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "一对多移动"
        description: "一个移动方块需要依次访问多个目标方块（按颜色值或距离排序），每到达一个目标后继续移向下一个。解题者需推断访问顺序和累积路径"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "多对多独立移动"
        description: "多对移动体-目标配对（按颜色匹配），各对独立在同一通道网络中移动。可能出现路径交叉但互不影响。解题者需同时追踪多条独立路径"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "链式顺序移动"
        description: "多个方块按颜色值顺序依次移动，前一个方块的最终位置会影响后续方块的可达空间（如占据通道位置形成新的阻塞）。解题者需理解顺序依赖性"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 40

  - id: D10
    name: "阻塞场景处理"
    tag: meta
    current: "不可达时（stuck）方块停在BFS可达的最远位置（距起点最远的可行放置点），目标方块保持不变"
    alternatives:
      - name: "停在最近阻塞点前"
