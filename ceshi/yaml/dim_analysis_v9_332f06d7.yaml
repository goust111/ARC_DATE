    name: "可达性判定逻辑"
    tag: meta
    current: "通过BFS在可行放置位置空间上搜索，判断目标位置是否在起点的连通分量内"
    alternatives:
      - name: "限步可达性"
        description: "方块有最大移动步数限制（如最多移动15步），即使路径连通但步数超限也视为不可达。解题者需计算路径长度与步数限制的关系"
