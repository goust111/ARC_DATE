        source: inversion
        source_task: null
        delta_lines: 15
      - name: "阻塞时标记通道"
        description: "不可达时方块不移动，但阻塞点处的通道像素被标记为特殊颜色（如橙色），帮助可视化瓶颈位置。解题者需识别哪里是瓶颈并进行标记"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "阻塞时方块缩小"
        description: "方块碰到阻塞点后尺寸缩小1（如3*3变2*2），以更小的尺寸继续尝试通过更窄的通道。解题者需判断方块在每个阻塞点的尺寸变化"
