  - id: D14
    name: "多步处理与射线顺序"
    tag: multi_step
    current: "所有射线同时发射并独立延伸，碰撞在轨迹交叉时自然发生（无显式顺序）"
    alternatives:
      - name: "按框架距离排序处理"
        description: "射线按框架到网格中心的距离从近到远依次发射，先发射的射线轨迹成为后续射线的障碍物。处理顺序影响碰撞结果，解题者需推断排序规则"
        source: multi_step
        source_task: "1ae2feb7"
        delta_lines: 20
      - name: "两步流程：先检测碰撞点再绘制"
        description: "第一步：计算所有射线的完整对角线路径并确定碰撞点位置；第二步：根据碰撞点信息绘制变向后的轨迹。显式分离检测和绘制阶段，使规则更清晰"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "迭代碰撞——碰撞后的新方向射线可再次碰撞"
        description: "射线碰撞变向后继续前进，如果遇到第三条射线可以再次碰撞变向。当前任务中碰撞后射线直接延伸到边界，此变体允许多级级联碰撞，复杂度大幅提升"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "按射线颜色值排序处理"
        description: "射线按颜色的数值大小排序依次处理（如颜色1先于颜色4）。先处理的射线轨迹阻挡后续射线，颜色值成为优先级编码。解题者需理解数值排序语义"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D15
    name: "背景色与网格环境"
    tag: meta
    current: "背景色为天蓝色(8)或黑色(0)，网格中除框架外无其他前景对象"
    alternatives:
      - name: "网格中存在额外障碍物像素"
        description: "网格中散布独立的非背景色像素作为障碍物，射线碰到障碍物时改变行为（如停止、反弹或绕过）。增加路径规划的复杂度，射线不再仅与其他射线交互"
