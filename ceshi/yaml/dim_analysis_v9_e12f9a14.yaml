task_id: e12f9a14
task_type: move_along_path
summary: "绿色框架内的彩色像素通过框架边框的缺口沿对角线向外发射射线，射线持续延伸直到到达网格边界或与另一条射线碰撞，碰撞时根据交角执行不同的轨迹变化规则"

dimensions:
  - id: D1
    name: "射线发射方向"
    tag: path
    current: "对角线射线（diagonal_ray）——彩色像素通过绿色框架缺口沿45度对角线方向向外发射，方向由缺口相对于内部像素的位置决定"
    alternatives:
      - name: "直线射线（水平/垂直）"
        description: "射线从缺口出发沿水平或垂直方向发射，而非对角线。解题者需判断缺口朝向对应的正交方向，空间推理从对角思维转为正交思维，路径与碰撞的几何关系完全不同"
        source: straight_ray
        source_task: "221dfab4"
        delta_lines: 25
      - name: "反射弹跳路径"
        description: "射线沿对角线发射后遇到网格边界时不终止而是反弹继续前进，类似光线在镜面间弹跳。解题者需追踪多次反射后的复杂路径，增加空间推理深度"
        source: reflection
        source_task: "142ca369"
        delta_lines: 30
      - name: "重力流动路径"
        description: "彩色像素不沿对角线直线前进，而是像水流一样向下流动并向缺口方向扩散（沿重力方向优先、水平方向次之）。路径不再是直线而是流体形态，需要模拟流动规则"
        source: gravity
        source_task: "28a6681f"
        delta_lines: 40
      - name: "螺旋路径"
        description: "射线从缺口出发后沿顺时针或逆时针螺旋向外扩展，每到达一定距离后转90度继续前进。产生完全不同的空间填充模式，解题者需推断螺旋方向和转向条件"
        source: spiral_path
        source_task: "da515329"
        delta_lines: 35

  - id: D2
    name: "碰撞检测与轨迹变化规则"
    tag: trajectory
    current: "collision_detection——90度交角碰撞时两条射线各转45度并在交叉点留1像素间隙、以单像素绘制；45度交角碰撞时无间隙、以2x2像素块绘制"
    alternatives:
      - name: "碰撞即停止"
        description: "射线碰到另一条射线时直接停止而非变向。取消复杂的角度判断和变向规则，简化为简单的终止条件，但解题者需推断射线处理顺序以确定哪条先画"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "碰撞时颜色混合"
        description: "两条射线碰撞时不改变方向，而是在交叉点区域使用第三种颜色（由两条射线颜色的某种映射决定）标记碰撞位置。解题者需推断颜色映射规则而非轨迹变化规则"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "碰撞时相互穿过并交换颜色"
        description: "两条射线在交叉点穿过彼此并交换颜色——A色射线变为B色，B色射线变为A色。方向不变但颜色互换，产生有趣的视觉交叉效果，解题者需追踪颜色转移"
        source: color_swap
        source_task: "a25697e4"
        delta_lines: 20
      - name: "统一碰撞规则（无角度区分）"
        description: "取消90度和45度的区分，所有碰撞统一执行同一种变向规则（如均转45度无间隙）。减少规则分支数量但仍保留碰撞交互，降低推理复杂度"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D3
    name: "轨迹涂色模式"
    tag: trajectory
    current: "continuous_trail——射线沿对角线连续涂色，使用源像素的颜色绘制整条路径"
    alternatives:
      - name: "周期性颜色图案"
        description: "射线轨迹按固定的颜色周期涂色（如 AABB 或 ABA 模式），而非纯色连续线。解题者需识别周期规律并在碰撞后仍维持正确的周期相位"
        source: periodic_pattern
        source_task: "221dfab4"
        delta_lines: 15
      - name: "间歇跳跃轨迹"
        description: "射线每隔一格涂色，形成虚线状对角线而非实线。射线仍在未涂色的格子上穿过并参与碰撞检测，但视觉上是断续的。解题者需理解'不可见移动'的概念"
        source: intermittent_skip
        source_task: "4a21e3da"
        delta_lines: 10
      - name: "碰撞后颜色改变"
        description: "射线在碰撞前使用自身颜色涂色，碰撞后使用对方射线的颜色继续涂色。类似 142ca369 的颜色继承机制但应用于射线间碰撞而非墙壁反射，增加颜色追踪的复杂度"
        source: color_change_on_bounce
        source_task: "142ca369"
        delta_lines: 15
      - name: "距离递减涂色"
        description: "射线离开框架后的前几格连续涂色，随后每隔一格涂色，再后每隔两格涂色，距离越远涂色越稀疏。解题者需发现距离与密度的递减关系"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D4
    name: "源对象类型"
    tag: src
    current: "绿色框架内的非绿色彩色2x2像素块，每个框架包含一种内部颜色"
    alternatives:
      - name: "单像素控制点"
        description: "框架内部仅有一个彩色像素而非2x2块。射线仍从缺口发射但宽度为1像素。简化了源对象的识别但射线更细，碰撞区域更小，碰撞判断更精确"
        source: control_pixels
        source_task: "4a21e3da"
        delta_lines: 15
      - name: "多色内部像素"
        description: "框架内部的2x2像素块不再单色，而是包含两种颜色（如对角分布）。射线颜色由缺口方向对应的那个像素颜色决定。解题者需额外判断'哪个颜色对应哪个缺口'"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "可变大小的内部色块"
        description: "框架大小不固定，内部色块可以是1x1、2x2、3x3等不同大小。色块大小编码射线的某种属性（如宽度或长度限制）。引入大小到属性的映射推理"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "边缘单像素标记作为源"
        description: "取消框架结构，改用网格边缘的单像素标记作为射线源，射线向网格内部沿对角线发射。类似 4a21e3da 的控制像素概念，完全改变源的识别方式"
        source: control_pixels
        source_task: "4a21e3da"
        delta_lines: 30

  - id: D5
    name: "框架结构与缺口检测"
    tag: src
    current: "frame_gap_detection——绿色框架为4x4或4x3的矩形边框，恰好有一个像素位置缺失形成缺口，缺口位置决定射线发射方向"
    alternatives:
      - name: "多缺口框架"
        description: "每个绿色框架有2个缺口，内部颜色同时从两个缺口向外发射两条射线。解题者需识别所有缺口并同时追踪多条射线，碰撞的可能性大幅增加"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "非矩形框架（L形或T形）"
        description: "框架不再是简单的矩形边框而是L形或T形等不规则形状，缺口仍在边框上。解题者需先正确识别框架形状和缺口位置，增加了源识别的几何推理难度"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "缺口大小可变"
        description: "缺口不再是单个像素的缺失，而是连续2-3个像素的缺失，产生更宽的缺口。宽缺口可能发射更宽的射线（如2像素宽的对角带），增加轨迹宽度推理"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "开放式框架（半封闭结构）"
        description: "框架只有三面封闭（如缺少整条底边），开放方向决定射线发射方向。开口更大使方向判断更直觉化，但可能需要从开口的整条边发射一排平行射线"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D6
    name: "射线终止条件"
    tag: dst
    current: "射线延伸到网格边界或碰到另一条射线的路径时终止"
    alternatives:
      - name: "固定步数终止"
        description: "射线从缺口出发后只走固定步数（如等于框架边长），到达后停止而不一定到达网格边界。步数可能由框架大小或内部色块属性编码。引入'距离编码'的推理维度"
        source: distance_encoding
        source_task: "271d71e2"
        delta_lines: 15
      - name: "碰到任意前景像素即停止"
        description: "射线在碰到任何非背景色像素时停止（包括其他框架的绿色边框、其他射线轨迹、甚至其他框架的内部色块）。这扩大了障碍物的范围，使路径更短且更受限"
        source: collision_stop
        source_task: "195c6913"
        delta_lines: 10
      - name: "到达目标标记像素终止"
        description: "网格中放置特殊颜色的目标标记像素，射线到达目标时终止。每条射线有对应的目标（通过颜色匹配），解题者需先配对源和目标再追踪路径"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "射线填充整条对角线直到两侧边界"
        description: "反转当前的单向发射：射线从缺口向两个相反的对角方向同时延伸，填满整条穿过缺口的对角线。解题者需理解双向扩展而非单向发射"
        source: inversion
        source_task: null
        delta_lines: 15

