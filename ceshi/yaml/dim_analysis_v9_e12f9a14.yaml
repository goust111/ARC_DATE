        source_task: null
        delta_lines: 25
      - name: "网格分区（不同区域使用不同背景色）"
        description: "网格被分为若干区域，各区域有不同背景色。射线进入不同区域时行为改变（如改变颜色或方向）。区域边界成为隐含的规则切换条件"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "存在干扰项框架"
        description: "网格中存在与源框架类似但不发射射线的'干扰项框架'（如无缺口的完整框架或内部为空的框架）。解题者需区分真正的射线源和干扰项，增加信息筛选需求"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D16
    name: "缺口位置的约束"
    tag: meta
    current: "缺口可以出现在框架的任意一条边的任意位置（角落或边的中间），方向从输入中推断"
    alternatives:
      - name: "缺口仅在角落"
        description: "限制缺口只能在框架的四个角落位置，射线方向固定为四个标准对角方向之一。简化缺口检测但减少方向多样性，更容易形成对称碰撞模式"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "缺口位置由内部色块的偏移编码"
        description: "缺口不再是显式的像素缺失，框架完全封闭。射线发射方向由内部2x2色块在框架内的偏移位置决定（如色块偏左上则向左上发射并在对应边穿透框架）。解题者需从色块位置推断方向"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "缺口大小编码射线速度"
        description: "缺口可以是1-3像素大小，缺口像素数编码射线'速度'——1像素缺口射线每步走1格，2像素缺口射线每步走2格（跳格涂色）。融合空间特征与数值参数"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D17
    name: "碰撞角度判定"
    tag: meta
    current: "根据两条射线的方向向量计算交角：90度交角和45度交角分别触发不同的碰撞规则"
    alternatives:
      - name: "根据颜色而非角度区分碰撞类型"
        description: "取消角度区分，改为按射线颜色关系区分：同类色系碰撞执行一种规则，不同色系碰撞执行另一种。解题者需推断颜色分类规则而非几何角度"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "碰撞类型由源框架大小决定"
        description: "碰撞规则不取决于交角，而取决于两个源框架中较小/较大框架的大小关系。大框架射线优先级高于小框架射线。引入框架属性到碰撞规则的映射"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "三种碰撞角度区分"
        description: "增加第三种碰撞类型：180度（正面对撞），此时两条射线都停止。与90度和45度碰撞形成三级规则体系，推理分支更多"
        source: creative
        source_task: null
        delta_lines: 15

