      - name: "框架作为射线障碍物"
        description: "其他框架的绿色边框成为射线的障碍物——射线碰到另一个框架的边框时停止或反弹。框架从'射线源'变为同时兼有'源和障碍物'双重角色，增加空间交互复杂度"
