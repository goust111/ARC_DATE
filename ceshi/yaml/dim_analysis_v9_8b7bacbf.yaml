        source: creative
        source_task: null
        delta_lines: 15
      - name: "干扰路径（同色线路不连通到种子）"
        description: "干扰项不仅是孤立的框架环，还包含与种子同色的线路像素，但这些线路没有连接到任何种子。解题者需要严格追踪连通性而不是简单的颜色匹配。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D12
    name: "种子数量与基数关系"
    tag: meta
    current: "1-2个种子，每个种子独立处理，多个种子之间不交互（多:多的独立映射）"
    alternatives:
      - name: "单种子多线路"
        description: "只有一个种子，但种子连接到多条不同颜色的线路（从种子向不同方向延伸）。每条线路上连接的腔体用对应线路的颜色（而非种子颜色）填充。解题者需要推断1:多的映射关系和颜色来源。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "多种子共享线路"
        description: "多个种子共享同一条线路——线路的两个端点各有一个种子。腔体按照与哪个种子更近来决定填充颜色（距离消歧）。解题者需要处理多:1的路径共享和距离判定。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "种子数量由某种视觉编码决定"
        description: "种子的数量或位置由网格中的某个符号指令编码（如角落区域的色块数量表示活跃种子数）。解题者需要先解码符号指令，再执行路径追踪和填充。增加了符号解读的预处理步骤。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D13
    name: "线路颜色与种子颜色的关系"
    tag: meta
    current: "每个种子有独立的线路颜色，种子色唯一出现且与线路颜色不同"
    alternatives:
      - name: "线路颜色与种子颜色相同"
        description: "种子和其线路使用同一种颜色。种子的唯一性通过位置（边缘）而非颜色出现次数来判定。解题者不能再用'颜色只出现一次'来识别种子，需要通过位置和连通结构来推断。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "多条线路共享同一颜色"
        description: "所有种子的线路使用同一种颜色，但种子颜色各不相同。解题者不能通过线路颜色区分不同种子的路径，必须通过连通性追踪来判断。增加了连通性推理的重要性。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "线路颜色沿路径渐变"
        description: "线路不是单一颜色，而是沿路径使用多种颜色交替或渐变。种子的线路起始段用颜色A，中间用颜色B，末端用颜色C。解题者需要理解渐变规则来追踪完整路径。"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 25

  - id: D14
    name: "腔体与路径的连接判定"
    tag: meta
    current: "腔体的边界像素必须与追踪到的路径连通分量有交集，且交集部分8邻域内必须有线路颜色像素"
    alternatives:
      - name: "仅要求边界与路径4连通"
        description: "将腔体与路径的连接判定从8连通改为4连通——框架环必须与路径有正交方向的直接相邻。这更严格地过滤连接关系，减少被填充的腔体数量，解题者需要更精确地判断邻接关系。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "距离阈值连接"
        description: "不要求框架环直接接触路径，而是允许框架环与路径在一定距离内（如2-3像素间隔）即视为连接。这松弛了连接条件，可能导致更多腔体被填充。解题者需要推断距离阈值。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "方向性连接——腔体必须在路径的特定侧"
        description: "腔体不仅要与路径相邻，还必须位于路径的特定侧（如左侧或下方）。方向可以由种子位置或路径行进方向决定。解题者需要推断方向性规则，增加了空间方位推理。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D15
    name: "背景色确定规则"
    tag: meta
    current: "背景色为网格中最常见的颜色（训练集中为0/黑色，测试集中为5/灰色）"
    alternatives:
      - name: "多背景色"
        description: "网格中存在两种背景色（如黑色和灰色交替成棋盘格），腔体只有被正确背景色填充的区域才是有效的。解题者需要先理解双背景模式，再判断腔体有效性。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "背景色由角落像素指定"
        description: "背景色不是最常见颜色，而是由特定角落的像素颜色决定。当某个角落被种子占据时，需要从其他角落推断背景色。增加了背景色识别的间接推理步骤。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "非零背景色（高频）"
        description: "强制使用非黑色的背景色（如红色、蓝色等鲜艳颜色），使得'背景'在视觉上非常显眼。解题者不能假设背景是黑色/暗色，需要通过频率分析确定背景色。"
        source: creative
        source_task: null
        delta_lines: 5

  - id: D16
    name: "外部区域排除规则"
    tag: meta
    current: "通过角落像素判定外部区域——包含背景色角落的4连通背景分量被视为外部，不作为填充目标"
    alternatives:
      - name: "通过接触网格边缘判定外部"
        description: "不用角落像素判定，而是任何接触网格边缘的背景连通分量都被视为外部区域。这是一种更常见的内外判定方式，可能改变某些边缘情况的行为。解题者需要理解'接触边缘即为外部'的规则。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "不排除任何区域"
        description: "去除外部/内部的区分，所有封闭的背景连通分量都可能被填充（只要连接到种子路径）。这可能导致大面积的背景区域被意外填充，解题者需要更仔细地追踪连通性。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "面积阈值排除"
        description: "不用位置判定外部，而是面积超过某个阈值的背景连通分量被视为外部。阈值可以由某种视觉线索编码。解题者需要推断面积阈值，增加了数值判定维度。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D17
    name: "框架环形状"
    tag: obstacle
    current: "圆角矩形环——矩形边框去除四个角像素，腔体为内部矩形区域"
    alternatives:
      - name: "完整矩形环（含角像素）"
        description: "框架环保留四个角像素，形成标准矩形环。这改变了8连通下的邻接关系（角像素增加了对角线连接），可能影响线路与框架的连接判定。视觉差异微小但逻辑影响明显。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "菱形/旋转45度的框架环"
        description: "框架环不是矩形而是菱形（45度旋转的正方形），腔体也是菱形区域。这创造了完全不同的视觉外观，解题者需要识别对角方向排列的封闭区域。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "圆形/近似圆形框架环"
        description: "框架环为离散化的圆形（在像素网格上近似圆），腔体为圆形内部。比矩形更有机的视觉外观，增加了形状识别的多样性。"
        source: creative
        source_task: null
        delta_lines: 30

  - id: D18
    name: "种子位置编码信息"
    tag: src
    current: "种子位置在网格边缘的角落附近，位置本身不编码额外信息"
    alternatives:
      - name: "种子在边缘中点附近"
        description: "种子从角落移到边缘中点位置（上下左右四个边的中间）。路径从边缘中部向内延伸，改变了路径的几何分布。解题者需要从边缘中点而非角落寻找种子。"
        source: creative
