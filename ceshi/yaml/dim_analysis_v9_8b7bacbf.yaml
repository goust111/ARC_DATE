task_id: 8b7bacbf
task_type: move_along_path
summary: "在网格边缘找到唯一色单像素种子，沿8连通线追踪到闭合框架环，将环内腔体用种子颜色flood-fill"

dimensions:
  - id: D1
    name: "路径追踪连通性"
    tag: path
    current: "8连通追踪（path_tracing）——从边缘种子像素出发，沿8连通（含对角线）的非背景像素追踪出完整线路组件"
    alternatives:
      - name: "4连通追踪"
        description: "将路径追踪限制为4连通（仅上下左右），不允许对角线连接。这要求线路本身是4连通的蜿蜒路径，解题者需要区分4连通和8连通的差异，增加了对连通性概念的推理要求。同时线路形态从对角线蜿蜒变为正交折线，视觉上更规整。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "混合连通追踪（线用8连通，腔体判定用8连通）"
        description: "当前腔体通过4连通判定背景区域。改为腔体也用8连通判定背景连通分量，则原本被对角线隔开的背景区域可能合并为一个更大的区域，从而改变哪些区域被视为封闭腔体。解题者需要理解8连通背景区域的形成规则，推理难度增加。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "有限步数追踪"
        description: "追踪不是无限延伸到整个连通分量，而是从种子出发最多追踪N步（N由某种视觉线索编码，如种子旁边的色块大小）。只有在N步可达范围内的框架腔体才会被填充。这增加了距离计算的推理维度，解题者需要同时理解步数限制和路径连通性。"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 30
      - name: "最短路径追踪"
        description: "不是简单的连通性判定，而是计算种子到每个腔体的最短路径距离。只有最短路径距离小于某个阈值的腔体才被填充，或者按距离远近使用不同颜色。增加了路径长度推理的维度。"
        source: shortest_path
        source_task: 7b0280bc
        delta_lines: 25

  - id: D2
    name: "路径结构形态"
    tag: path
    current: "蜿蜒线路（meandering path）——8连通的1像素宽蜿蜒路径，使用对角线和正交步混合，从边缘种子向网格内部延伸"
    alternatives:
      - name: "直线射线路径"
        description: "种子发出的路径不是蜿蜒的，而是沿一个固定方向（水平、垂直或对角线）的直线射线。框架环分布在射线两侧。视觉上更简洁规整，但解题者需要判断射线方向和识别沿线的框架。"
        source: straight_ray
        source_task: 221dfab4
        delta_lines: 30
      - name: "分支路径（树形结构）"
        description: "线路从种子出发后可以在某些点分叉为多条分支，形成树形结构。所有分支上连接的腔体都应被填充。解题者需要追踪多条分支路径，推理复杂度随分支数量增加。"
        source: chain_reaction
        source_task: 5961cc34
        delta_lines: 35
      - name: "管道跟随路径"
        description: "路径不是1像素宽的线，而是2像素或更宽的管道/走廊。腔体必须与管道壁8连通才会被填充。这改变了路径的视觉宽度和连接判定方式，解题者需要理解管道宽度的概念。"
        source: corridor_following
        source_task: 332f06d7
        delta_lines: 25

  - id: D3
    name: "腔体填充方式"
    tag: trajectory
    current: "flood-fill——将连通腔体内部所有背景像素用种子颜色完全填满"
    alternatives:
      - name: "仅填充腔体边界内层"
        description: "不完全填满腔体，只将腔体内部与框架环相邻的一圈像素涂色（内边界描边）。这创造了'套环'视觉效果，解题者需要理解填充规则是边界层而非全部。对于更大的腔体效果更明显。"
        source: inner_border
        source_task: 8f3a5a89
        delta_lines: 20
      - name: "交替色填充"
        description: "腔体内部不用单一种子颜色填充，而是用种子颜色和另一种颜色（如框架环颜色）交替填充，形成棋盘格或条纹图案。解题者需要推断填充的图案规则以及颜色来源。"
        source: alternating_pattern
        source_task: 13e47133
        delta_lines: 20
      - name: "按距离渐变填充"
        description: "腔体内像素的颜色取决于其到腔体边界的距离——距离为1用颜色A，距离为2用颜色B，以此类推形成同心环。颜色映射规则需从示例推断。增加了距离计算和颜色映射的双重推理维度。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "填充为框架环颜色而非种子颜色"
        description: "反转颜色来源：腔体用自身框架环的颜色（而非种子颜色）填充。当不同框架环有不同颜色时，每个腔体的填充色不同。解题者需要理解颜色来自环而非种子的推理反转。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D4
    name: "种子源对象定义"
    tag: src
    current: "网格边缘的唯一色单像素——在网格最外圈、颜色在整个网格中只出现一次的像素作为种子"
    alternatives:
      - name: "非边缘唯一色像素"
        description: "种子不限于网格边缘，而是网格内部任意位置的唯一色像素。解题者不能再简单扫描边缘找种子，需要全局搜索唯一色像素，增加了种子识别的难度。同时路径可以从网格中央向外延伸。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "边缘色块（非单像素）"
        description: "种子不是单像素，而是边缘上的小色块（如2-3个相邻像素组成的短线段），颜色在网格中唯一。色块的形状或方向可能编码额外信息（如指示路径延伸方向）。视觉上种子更显眼，但识别条件从'单像素'变为'小色块'。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "角落特定位置种子"
        description: "种子严格限定在网格四角像素位置（当前实现中种子'通常在角落附近'但不强制）。改为强制角落后，解题者可以利用角落位置快速定位种子，但需要推断不同角落种子的路径延伸方向。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "模板查找型种子"
        description: "种子不是单像素，而是一个小型2x2单色方块，其颜色决定填充色。解题者需要在边缘识别这些小方块而非单像素，且方块的位置和形状与路径的连接方式不同。"
        source: template_lookup
        source_task: 195c6913
        delta_lines: 25

  - id: D5
    name: "终点/停止条件"
    tag: dst
    current: "闭合框架腔体（cavity_fill）——封闭的单色框架环所围成的背景区域作为填充目标"
    alternatives:
      - name: "开放区域端点"
        description: "目标不是封闭的框架腔体，而是路径末端的开放区域——路径到达某个位置后停止，以停止点为中心向四周扩展填充直到遇到非背景像素或网格边缘。解题者需要判断路径在何处停止以及填充的扩展范围。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "多色边界腔体"
        description: "当前只填充单色边界的腔体。改为允许多色边界腔体（由两种或更多颜色的像素围成），填充色由边界颜色和种子颜色共同决定。解题者需要处理更复杂的腔体识别和颜色映射规则。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "嵌套腔体（多层填充）"
        description: "框架环内部可以包含更小的框架环，形成嵌套结构。外层腔体用种子颜色填充，内层腔体保持不变（或用不同规则处理）。解题者需要理解嵌套层次和分层填充逻辑。"
        source: concentric_frames
        source_task: 13e47133
        delta_lines: 30
      - name: "线路末端的特定色像素"
        description: "目标不是腔体而是线路末端的特定颜色像素。找到路径上与种子颜色相关（如互补色、调色板中相邻色）的像素，对其执行特定变换。改变了'填充区域'到'变换目标像素'的推理模式。"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 25

  - id: D6
    name: "变换操作类型"
    tag: transform
    current: "腔体内部flood-fill为种子颜色——cavity.interior.color = seed.color"
    alternatives:
      - name: "框架环重涂色"
        description: "不填充腔体内部，而是将与路径相连的框架环本身重涂为种子颜色。腔体保持空白，但框架颜色改变。解题者需要理解变换目标是环而非内部，这是一个完全不同的视觉效果。"
        source: recolor
        source_task: 271d71e2
        delta_lines: 15
      - name: "腔体填充 + 框架环擦除"
        description: "在填充腔体的同时，将框架环像素擦除为背景色。最终效果是原来的空白腔体被种子色填满，而原来的框架环消失。解题者需要理解这种'交换'式的变换。"
        source: erase
        source_task: 3dc255db
        delta_lines: 15
      - name: "腔体内标记点而非全填充"
        description: "不完全填充腔体，而是在腔体中心放置一个种子色像素（或根据腔体大小放置N个点）。类似计数变换——解题者需要理解腔体被'标记'而非'填满'。"
        source: dot_placement
        source_task: 8f215267
        delta_lines: 20
      - name: "颜色传递——种子色传给腔体，腔体框架色传给种子位置"
        description: "双向颜色交换：腔体用种子色填充，同时种子像素变为对应框架环的颜色。解题者需要追踪双向的颜色传递关系，增加了推理的对称性和复杂度。"
        source: color_transfer
        source_task: 4c416de3
        delta_lines: 15

  - id: D7
    name: "输出网格形状"
    tag: grid_shape
    current: "same——输出网格与输入尺寸完全相同"
    alternatives:
      - name: "裁剪到填充区域"
        description: "输出网格裁剪到仅包含所有被填充腔体的最小外接矩形。去除未参与变换的区域。解题者需要额外推断输出的裁剪规则。"
        source: tight_crop
        source_task: e87109e9
        delta_lines: 20
      - name: "裁剪到路径连通分量"
        description: "输出网格裁剪到种子所在连通分量的外接矩形。保留路径和腔体，去除无关区域。当有多个种子时，每个种子产生一个独立的裁剪输出，需要定义组合方式。"
        source: crop
        source_task: a6f40cea
        delta_lines: 25
      - name: "仅输出腔体内容（去除框架和路径）"
        description: "输出仅包含填充后的腔体区域，所有路径和框架像素被擦除为背景色。视觉上只剩下彩色填充块浮在背景上。解题者需要理解输出是'过滤后的结果'。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D8
    name: "多步处理顺序"
    tag: multi_step
    current: "三步流程：(1)识别边缘种子像素→(2)追踪每个种子连接的线路→(3)填充沿线的闭合腔体"
    alternatives:
      - name: "迭代传播填充"
        description: "填充不是一次性完成，而是迭代进行：第一轮只填充直接与种子路径相邻的腔体，被填充的腔体变成新的'路径扩展'，第二轮填充与新扩展部分相邻的腔体，以此类推。这创造了传播/扩散的动态效果，解题者需要推断迭代终止条件。"
        source: BFS_activation
        source_task: 5961cc34
        delta_lines: 30
      - name: "按距离排序的顺序填充"
        description: "腔体不是同时填充，而是按照到种子的路径距离从近到远依次填充，且每个腔体的填充颜色随序号变化（如颜色逐渐变深或按预定义序列变化）。解题者需要推断距离度量和颜色序列。"
        source: sorting_by_distance
        source_task: dd6b8c4b
        delta_lines: 25
      - name: "先填充后擦除路径"
        description: "增加第四步：在填充所有腔体后，将连接路径（线路颜色像素）擦除为背景色。最终输出中只有种子像素、框架环和填充后的腔体，路径消失。解题者需要理解路径是临时的'指导线'。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "多种子交互——重叠区域混色"
        description: "当两个种子的路径连接到同一个腔体时，该腔体不是只用其中一个种子色填充，而是用两种颜色按某种规则混合填充（如棋盘交替、上下分割等）。解题者需要处理路径重叠的冲突解决策略。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D9
    name: "腔体边界颜色约束"
    tag: obstacle
    current: "单色边界约束——只有边界完全由一种颜色组成的封闭区域才被视为有效腔体"
    alternatives:
      - name: "允许多色边界腔体"
        description: "放宽约束，允许边界由多种颜色组成的封闭区域也作为有效腔体。填充颜色仍由种子决定。这增加了腔体数量，解题者需要识别更复杂的封闭区域。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "边界颜色必须与线路颜色匹配"
        description: "增加约束：腔体的边界颜色必须与连接种子的线路颜色相同。不同线路颜色的框架只有对应种子的路径才能触发填充。这增加了颜色匹配的推理层次。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "边界颜色决定填充色"
        description: "种子颜色不再决定填充色，改为由框架环的边界颜色通过某种映射关系决定填充色（如颜色互补、调色板索引+1等）。解题者需要从示例中推断边界色到填充色的映射规则。"
        source: color_pairing
        source_task: 16de56c4
        delta_lines: 20
      - name: "部分开口的框架环"
        description: "框架环不是完全封闭的，而是有1-2个像素的开口。腔体仍被视为有效（需要推断封闭性的容忍度）。解题者需要判断哪些近似封闭的区域应被填充，增加了空间推理的模糊性。"
        source: frame_completion
        source_task: a6f40cea
        delta_lines: 25

  - id: D10
    name: "腔体形状与大小"
    tag: obstacle
    current: "主要为2x2矩形腔体（占27/36观察），偶尔更大；框架环为无角的圆角矩形"
    alternatives:
      - name: "不规则形状腔体"
        description: "腔体不限于矩形，可以是L形、T形或其他不规则形状。框架环随之变为不规则的封闭环。解题者需要识别任意形状的封闭区域，增加了空间推理难度。flood-fill逻辑不变但视觉更复杂。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "大腔体（至少4x4）"
        description: "反转当前以小腔体为主的模式，所有腔体至少为4x4。更大的腔体视觉上更显眼，但需要更大的网格空间。这改变了任务的视觉密度和空间利用效率。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "腔体大小编码信息"
        description: "腔体的大小（面积）决定了填充行为——如只填充面积为偶数的腔体，或面积越大的腔体颜色越深。解题者需要观察腔体大小与填充之间的关系，增加了数值推理维度。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D11
    name: "干扰项策略"
    tag: obstacle
    current: "0-5个未连接到种子路径的干扰框架环，可能包含独立的线路+框架网络"
