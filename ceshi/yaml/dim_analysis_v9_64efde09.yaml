task_id: 64efde09
task_type: move_along_path
summary: "标记像素通过直线射线标记精灵模板的活跃边端口，然后将标记颜色的射线从所有同构精灵的对应端口向外发射"

dimensions:
  - id: D1
    name: "匹配条件：精灵间的对应关系"
    tag: match_cond
    current: "stripe_signature_match — 精灵通过二面体变换（旋转/翻转）与同一模板匹配，活跃边由最大同色计数严格最高的长边决定"
    alternatives:
      - name: "颜色直方图匹配"
        description: "不再通过精确的像素排列匹配模板变换，而是通过颜色直方图（各颜色出现次数向量）匹配。这使得解题者需要统计颜色频率而非识别几何变换，改变了推理方式"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "活跃边由最小同色计数决定（取反）"
        description: "取反当前的活跃边规则：活跃边变为最大同色计数最低的长边（即颜色最分散的边）。这使解题者需要逆向思考哪条边更'杂乱'，增加了认知反转难度"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "按行/列颜色序列哈希匹配"
        description: "精灵间通过将活跃边颜色序列排序后的签名匹配，而非精确位置匹配。两个精灵只要活跃边包含相同的颜色多重集即算匹配。这允许同一模板的不同排列方式，增加匹配的模糊性"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "仅通过形状尺寸匹配（忽略颜色）"
        description: "精灵间仅通过矩形尺寸（NxM）匹配为同一模板的变体，不检查内部颜色。这简化了匹配条件但使端口对应关系更依赖几何推理"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D2
    name: "路径类型：射线的传播方式"
    tag: path
    current: "straight_ray — 从活跃边端口沿法线方向发射直线射线，遇到非背景色或网格边界停止"
    alternatives:
      - name: "对角线射线"
        description: "射线不再沿水平/垂直方向，而是沿45度对角线方向发射。这完全改变了空间推理，解题者需要追踪斜向路径"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 15
      - name: "反射射线"
        description: "射线遇到精灵或网格边界时不停止而是反射（如镜面反射），继续传播直到射线离开网格或反射次数用尽。这创造了更复杂的路径追踪问题"
        source: reflection
        source_task: 142ca369
        delta_lines: 30
      - name: "双向射线"
        description: "射线从活跃边端口同时向活跃方向和反方向（穿过精灵内部到达非活跃边后继续）发射。解题者需要理解双向传播逻辑"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "射线从精灵中心发射而非边缘"
        description: "射线不再从活跃边端口出发，而是从精灵质心向四个基本方向发射，标记颜色仍由端口映射决定。改变了空间起点推理"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D3
    name: "轨迹样式：射线的涂色模式"
    tag: trajectory
    current: "keep_source — 射线以标记像素的颜色连续涂色，从端口到停止点全部填充"
    alternatives:
      - name: "间歇涂色"
        description: "射线每隔一个像素涂一次色（涂-空-涂-空...），形成虚线效果。解题者需要识别这种间歇模式并在所有精灵上一致应用"
        source: intermittent_skip
        source_task: 4a21e3da
        delta_lines: 10
      - name: "周期性颜色循环"
        description: "射线按标记颜色序列循环涂色（如颜色A-B-C-A-B-C...），三个标记的颜色形成一个循环。这增加了颜色模式的复杂度"
        source: color_cycle
        source_task: 195c6913
        delta_lines: 15
      - name: "渐变长度轨迹"
        description: "每条射线的涂色长度等于该标记到其标记精灵的距离（即标记像素到精灵活跃边的像素数），不再涂满到边界。解题者需要度量距离来确定射线长度"
        source: length_preservation
        source_task: 88bcf3b4
        delta_lines: 20
      - name: "仅涂色端点（不涂中间路径）"
        description: "射线不涂中间像素，只在射线终点（遇到障碍或边界前最后一个背景像素）涂上标记颜色。这是对'连续涂色'的极端取反"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D4
    name: "源对象：标记像素的类型与位置"
    tag: src
    current: "单像素标记，放置在网格边界上，颜色与模板颜色不同且互不重复，通过射线对齐到精灵活跃边端口"
    alternatives:
      - name: "标记为2x1或1x2的小条"
        description: "标记不再是单像素而是两像素的小条，小条的方向编码额外信息（如射线应在端口的哪一侧偏移）。增加了信息密度和几何推理"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "标记放置在网格内部而非边界"
        description: "标记像素不再限于网格边界，而是放置在精灵附近的网格内部位置。这要求解题者首先找到标记，然后通过射线追踪确定它们对应哪个端口，增加了搜索难度"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "标记颜色与模板颜色重叠"
        description: "标记使用模板中已有的颜色（通过位置而非颜色区分标记和精灵），解题者需要通过空间关系（孤立单像素在边界上）识别标记。增加了视觉区分难度"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "标记放在精灵的非活跃边一侧"
        description: "标记不再在活跃边方向上对齐精灵，而是放在精灵的非活跃边（短边或非主导边）的射线方向上。解题者需要先识别非活跃边再找标记"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D5
    name: "目标/停止条件：射线在何处终止"
    tag: dst
    current: "射线遇到任何非背景像素或到达网格边界时停止"
    alternatives:
      - name: "射线穿透其他精灵继续传播"
        description: "射线不再被其他精灵阻挡，而是穿过它们继续传播直到网格边界。这使得射线可能覆盖更长的距离，且精灵本身不再是障碍"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "射线停在固定距离处"
        description: "射线长度由模板尺寸N决定（例如射线长度 = N），不论是否遇到障碍。解题者需要推断这个数值关系"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 15
      - name: "射线仅涂色到最近同色标记射线相遇处"
        description: "来自不同精灵的同色射线在网格中传播，当两条同色射线相遇时双方都停止。这创造了一种竞争/碰撞动态"
        source: collision_stop
        source_task: 195c6913
        delta_lines: 25
      - name: "射线停在距离边界N个像素处"
        description: "射线不涂到网格边界，而是在距边界N像素处停止（N为模板长边长度）。解题者需要推理这个偏移关系"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D6
    name: "变换：输出中对对象的处理"
    tag: transform
    current: "keep_source — 原始精灵和标记保持不变，仅添加射线"
    alternatives:
      - name: "擦除标记像素"
        description: "输出中删除原始标记像素（仅保留射线）。解题者需要推断标记的存在及其作用，即使它们在输出中消失了"
        source: erase
        source_task: 3dc255db
        delta_lines: 5
      - name: "射线涂色后将精灵重新着色"
        description: "在发射射线后，将每个精灵的活跃边颜色替换为该端口的标记颜色。这增加了精灵本身的变换，解题者需要追踪双重变化"
        source: recolor
        source_task: 271d71e2
        delta_lines: 15
      - name: "射线碰撞时混合颜色"
        description: "当不同颜色的射线相遇时（理论上当前规则禁止冲突），用第三种颜色标记交汇点。这需要放宽无冲突约束并引入碰撞规则"
        source: collision_detection
        source_task: 409aa875
        delta_lines: 25
      - name: "擦除被射线命中的精灵"
        description: "如果一个精灵被另一个精灵发出的射线命中，该精灵从输出中消失。解题者需要理解射线的'攻击'语义"
        source: creative
        source_task: null
        delta_lines: 20

