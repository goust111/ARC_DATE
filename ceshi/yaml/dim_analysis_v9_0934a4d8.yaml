        source: creative
        source_task: null
        delta_lines: 25

  - id: D13
    name: "多步处理序列"
    tag: multi_step
    current: "单步处理：识别标记 -> 确定 lo -> 反射恢复 -> 裁剪输出"
    alternatives:
      - name: "两层标记嵌套恢复"
