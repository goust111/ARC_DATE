        delta_lines: 25
      - name: "网格尺寸可变"
        description: "不同训练示例使用不同尺寸的正方形网格（如15-30），解题者需要适应变化的网格规模而非依赖固定尺寸"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "小网格（10-15）"
        description: "使用更小的网格（10-15），标记占比更大，可见像素更少，恢复难度增加。对称模式更容易被人眼识别但冗余信息更少"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D8
    name: "标记颜色的确定方式"
    tag: match_cond
    current: "标记是唯一一个外接矩形被完全填满且面积大于1的颜色（实心矩形检测）"
    alternatives:
      - name: "标记为网格中出现频率最高的颜色"
        description: "不通过形状检测而通过频率统计确定标记色。解题者需要计数而非形状识别，推理路径完全不同"
