task_id: 0934a4d8
task_type: symmetry/pattern
summary: "在具有双轴对称性的方形网格中，找到唯一的实心矩形标记色块，利用水平/垂直反射轨道（以及转置回退）恢复被遮挡的图案，输出标记区域的原始内容"

dimensions:
  - id: D1
    name: "对称类型"
    tag: match_cond
    current: "双轴对称（LR + UD），反射轴位于 [lo..N-1] 区间的中心"
    alternatives:
      - name: "仅单轴对称（LR 或 UD）"
        description: "网格仅具有一个方向的反射对称性，解题者需要判断是水平还是垂直对称，并仅通过单方向镜像恢复被遮挡像素。减少冗余信息使恢复更具挑战性，某些标记位置可能无法完全恢复，需要引入额外约束"
        source: inversion
        source_task: null
        delta_lines: 25
      - name: "四重旋转对称（C4）"
        description: "网格具有90度旋转对称性而非镜像对称，解题者需要识别旋转中心并通过0/90/180/270度旋转轨道恢复像素。旋转对称在视觉上与镜像对称有明显区别，推理过程完全不同"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "对角线反射对称"
        description: "网格沿主对角线或反对角线对称（即 g[r,c] == g[c,r]），标记像素通过对角线镜像恢复。这改变了反射轨道的几何结构，解题者需要识别对角而非水平/垂直的对称轴"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "平移对称（周期性铺贴）"
        description: "网格由一个小瓦片周期性平铺生成，标记区域通过相邻瓦片的对应位置恢复。解题者需要发现周期长度而非对称轴，推理模式从镜像变为周期匹配"
        source: creative
        source_task: null
        delta_lines: 40

  - id: D2
    name: "标记物（遮挡区域）的形状"
    tag: src
    current: "实心填充矩形，颜色为8（azure），面积16-36，边长3-9"
    alternatives:
      - name: "L 形或 T 形标记"
        description: "标记不是矩形而是 L 形或 T 形等非凸多联骨牌，解题者需要先识别非矩形的遮挡区域轮廓再恢复。输出也变为非矩形裁剪，增加形状识别难度"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "多个分离的小矩形标记"
        description: "网格中有2-3个独立的小矩形标记（同色），解题者需要分别恢复每个被遮挡区域并拼合输出。从1:1变为多个src，增加空间推理复杂度"
        source: inversion
        source_task: null
        delta_lines: 30
      - name: "十字形标记"
        description: "标记为十字形（中心方块加四个臂），形成非矩形遮挡。解题者需要识别十字轮廓并仅恢复十字区域内的像素，输出为十字形裁剪"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "标记为空心矩形框"
        description: "标记是矩形环（外圈填充标记色，内部保留原始图案），解题者需要恢复的是环形区域而非实心块。这要求识别空心结构并只恢复边框部分的像素"
        source: inversion
        source_task: null
        delta_lines: 25

  - id: D3
    name: "被遮挡区域（恢复目标）的定义"
    tag: dst
    current: "标记矩形的外接矩形区域，输出为该矩形的原始像素值"
    alternatives:
      - name: "输出整个网格的修复版本"
        description: "不是裁剪标记区域，而是输出完整的修复后网格（标记替换为正确值）。解题者需要理解整体对称并原地修复，输出尺寸与输入相同"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "输出标记区域的外扩边框"
        description: "输出范围扩大到标记外接矩形各方向外扩k个像素（如k=1），包含标记区域及其周围上下文。解题者需要确定正确的裁剪边界"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "输出对称轴交叉处的核心区域"
        description: "输出区域不是标记位置，而是以对称中心为中心的固定大小矩形。解题者需要先找到对称中心，再提取该区域的完整图案"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "恢复变换机制"
    tag: transform
    current: "通过 LR/UD 反射轨道找到非标记值恢复；若轨道全被遮挡，使用转置回退 g[c,r]"
    alternatives:
      - name: "仅使用反射恢复，禁止转置回退"
        description: "去除转置回退机制，标记必须放置在所有像素都可通过反射轨道恢复的位置。简化了恢复逻辑但约束了标记放置，解题者不需要考虑边界特殊情况"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "恢复后颜色取反（互补映射）"
        description: "恢复出的像素值不直接使用，而是通过一个可从可见区域推断的颜色映射表进行变换（如网格边缘的色条定义映射关系）。增加一层解码步骤"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "多层级回退恢复"
        description: "回退机制扩展为多层：先尝试 LR 反射，再 UD 反射，再对角线反射，最后转置。解题者需要理解完整的优先级链，每一层都可能在不同像素处被使用"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "旋转180度恢复"
        description: "标记像素通过点对称（180度旋转）而非轴对称恢复，即 g[r,c] 的恢复值来自 g[lo+hi-r, lo+hi-c]。改变反射轨道的几何意义，解题者需要识别旋转中心"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D5
    name: "输出裁剪方式"
    tag: grid_shape
    current: "裁剪到标记的外接矩形（crop to marker bbox）"
    alternatives:
      - name: "输出固定尺寸方形"
        description: "输出始终为固定的 k x k 方形（如 5x5），标记区域居中放置，周围用背景色填充。解题者需要理解固定尺寸约定而非从标记推断输出大小"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "输出为标记区域的转置"
        description: "输出的行列互换（h x w 变为 w x h），恢复内容也做转置。解题者需要发现输出方向与标记方向的关系"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "紧凑打包多个恢复区域"
        description: "当存在多个标记时，将各恢复区域按顺序紧凑排列成一行或一列输出，用分隔色隔开。解题者需要理解多区域的拼合规则"
        source: packed_grid
        source_task: 58f5dbd5
        delta_lines: 25

  - id: D6
    name: "对称轴偏移量（lo 参数）"
    tag: meta
    current: "lo=2，固定值；前2行/列为自由边界，不参与主体对称约束"
    alternatives:
      - name: "lo 值可变（每个示例不同）"
        description: "lo 在不同训练示例中取不同值（如1-4），解题者需要从可见像素中推断 lo 的值。增加了参数推断的维度，使得对称轴的定位成为解题关键步骤"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "lo=0（无自由边界）"
        description: "整个网格完全对称，没有外围自由区域，也不需要转置回退。简化了恢复逻辑，但标记放置的约束更严格"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "行列 lo 值不同"
        description: "行方向和列方向有不同的 lo 值（如 lo_row=2, lo_col=3），形成非对称的自由边界。解题者需要分别推断两个方向的偏移量"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D7
    name: "网格形状"
    tag: meta
