        source: creative
        source_task: null
        delta_lines: 20

  - id: D12
    name: "精灵与目标的基数关系"
    tag: meta
    current: "一对一映射：每个精灵颜色对应框架内一个或多个同色目标像素，每个目标像素只匹配一个精灵"
    alternatives:
      - name: "多对一：多个精灵匹配同一目标"
        description: "框架内一个目标位置可能同时被多个精灵匹配（如多个精灵有相同颜色）。需要叠加规则（如形状合并、颜色混合）来处理冲突。增加冲突解决推理。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "一对多但有选择：精灵只放置到最近的匹配目标"
        description: "当一个精灵颜色对应多个框架内目标像素时，精灵只放置到距离最近的那个（而非所有匹配位置）。引入距离计算和最优选择推理。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "一对一严格匹配（精灵数 == 目标数）"
        description: "取反当前可能的一对多关系：严格保证每个精灵恰好对应一个目标像素，每个目标像素恰好对应一个精灵。简化匹配但需要生成约束更严格。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D13
    name: "图例条目与精灵形状的覆盖关系"
    tag: meta
    current: "图例中的每种形状模式对应一种输出颜色，所有放置的精灵都能在图例中找到匹配的形状条目"
    alternatives:
      - name: "图例包含干扰条目"
        description: "图例中有多余的形状-颜色条目，这些形状不会被任何精灵匹配。解题者需判断哪些图例条目是有效的，哪些是干扰项。增加图例解析的筛选推理。"
