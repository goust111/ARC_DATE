task_id: edb79dae
task_type: move_to_match
summary: "将灰色框架外的彩色精灵按颜色匹配到框架内的同色像素位置，替换为精灵形状，最后根据左上角形状-颜色图例对所有放置的精灵进行重着色"

dimensions:
  - id: D1
    name: "第一步匹配条件：颜色匹配"
    tag: match_cond
    current: "精灵颜色 == 框架内目标像素颜色（s.color == d.color），通过颜色一致性将外部精灵与内部单色像素配对"
    alternatives:
      - name: "形状匹配替代颜色匹配"
        description: "框架内的目标不再是单色像素，而是小型形状标记（如2-3像素组成的微型图案）。精灵需匹配形状而非颜色来确定目标位置。推理从简单的颜色比较变为几何形状识别，增加感知复杂度。"
        source: shape_match
        source_task: "16b78196"
        delta_lines: 30
      - name: "边缘颜色匹配"
        description: "精灵不直接与框架内像素匹配，而是与框架边缘上的颜色标记匹配。框架边缘标记的行/列位置指示精灵应放置的内部坐标。从直接匹配变为间接坐标推理。"
        source: edge_color_match
        source_task: "247ef758"
        delta_lines: 35
      - name: "尺寸匹配"
        description: "框架内有不同大小的空洞区域，精灵按自身外接矩形尺寸匹配对应大小的空洞。颜色不作为匹配依据，改为几何尺寸比较。解题者需测量和比较尺寸而非识别颜色。"
        source: size_match
        source_task: "2c181942"
        delta_lines: 30
      - name: "连接器匹配"
        description: "框架内目标位置旁有小型连接器图案（如L形、T形），精灵边缘也有对应连接器。匹配需同时满足连接器颜色和形状一致。从单属性匹配升级为多属性复合匹配。"
        source: connector_match
        source_task: "20270e3b"
        delta_lines: 35
      - name: "互补色匹配"
        description: "取反直接颜色匹配：精灵颜色与框架内像素颜色互补（如红配蓝、绿配黄，通过示例中的颜色对应推断互补映射）。解题者需从示例中发现颜色映射规律而非简单比对。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D2
    name: "第二步匹配条件：形状-颜色图例查找"
    tag: match_cond
    current: "放置后的精灵形状与左上角图例中的形状模式匹配（s2.shape == d2.shape），确定重着色的目标颜色"
    alternatives:
      - name: "按面积/像素数量查找图例"
        description: "图例不按形状匹配而是按精灵的像素数量匹配。图例中每个条目显示一个数字编码（如用不同数量的点表示）和对应颜色。解题者需计数像素而非识别形状。"
        source: hole_counting
        source_task: "8698868d"
        delta_lines: 25
      - name: "旋转/翻转后形状匹配"
        description: "图例中的形状模式可能是精灵形状的旋转或翻转版本，匹配时需考虑所有变换。增加空间推理复杂度，解题者需要心理旋转能力。"
        source: rotation_flip
        source_task: "a25697e4"
        delta_lines: 20
      - name: "颜色-颜色映射替代形状查找"
        description: "取反形状匹配：图例改为颜色映射表（左列为输入色，右列为输出色），精灵按原始颜色直接查找映射。取消形状推理环节，但引入颜色映射查表。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "位置编码图例"
        description: "图例中的形状按特定空间排列（如从左到右、从上到下），精灵根据其在框架内的相对位置（如所在象限或行列区域）查找对应图例条目。匹配从形状属性变为空间属性。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D3
    name: "源对象：框架外精灵的属性"
    tag: src
    current: "灰色框架外的小型彩色精灵，每个精灵有独特的颜色和形状，是可移动的源对象"
    alternatives:
      - name: "多色精灵"
        description: "精灵不再是单色的，而是由两种颜色组成。匹配时使用主色（面积较大的颜色）与框架内像素配对，放置时保留完整的多色图案。增加颜色分析和主色判断的推理步骤。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "空心精灵（带内部洞的形状）"
        description: "精灵包含内部空洞（背景色像素被精灵像素包围），形成环形或框形图案。放置时需正确保留洞的结构，图例匹配也需处理空心形状。视觉和逻辑复杂度提升。"
        source: hollow_frames
        source_task: "4c416de3"
        delta_lines: 15
      - name: "精灵分布在框架四周而非集中一侧"
        description: "取反精灵的空间聚集约束：精灵散布在框架的上方、下方、左侧、右侧等多个位置。解题者需在整个网格中搜索和识别所有精灵，增加空间扫描负担。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "对角标记像素对作为源"
        description: "源不是完整精灵而是对角像素对（两个同色像素位于矩形对角），放置时将其展开为完整矩形填充。从形状识别变为几何位置关系推理。"
        source: diagonal_markers
        source_task: "9385bd28"
        delta_lines: 30

  - id: D4
    name: "目标位置：框架内的匹配点"
    tag: dst
    current: "灰色框架内部的单色像素点，每个点的颜色指示应匹配哪个外部精灵"
    alternatives:
      - name: "目标为框架内的小型空洞区域"
        description: "框架内不是单像素标记而是与精灵外接矩形大小匹配的矩形空洞。精灵需精确嵌入空洞中（类似拼图）。从点标记变为区域匹配，增加尺寸验证的推理。"
        source: cavity_fill
        source_task: "5dbc8537"
        delta_lines: 25
      - name: "目标为框架边缘的对齐标记"
        description: "框架内部初始为空，目标位置由框架边缘上的彩色标记投影到内部确定（行标记×列标记的交点）。类似坐标系定位，解题者需理解投影规则。"
        source: marker_alignment
        source_task: "581f7754"
        delta_lines: 30
      - name: "目标为色块簇而非单像素"
        description: "框架内每个目标不是单个像素，而是由同色多像素组成的小色块。精灵的放置中心为色块的重心位置。解题者需识别色块并计算重心，增加处理步骤。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "目标像素颜色不直接对应精灵颜色"
        description: "框架内目标像素的颜色不等于精灵颜色，而是通过图例中的间接映射关系对应。需先解码映射再执行配对，增加符号推理层。"
        source: legend_lookup
        source_task: "97d7923e"
        delta_lines: 20

  - id: D5
    name: "第一步变换：精灵放置方式"
    tag: transform
    current: "用精灵的完整形状替换框架内的单色目标像素（replace d with s.shape），精灵图案居中覆盖目标位置"
    alternatives:
      - name: "旋转后放置"
        description: "精灵放置到目标位置时需根据特定规则旋转（如根据目标像素在框架内的象限决定旋转角度：左上0°、右上90°、右下180°、左下270°）。同一精灵在不同位置有不同朝向，增加空间变换推理。"
        source: rotation
        source_task: "2c181942"
        delta_lines: 25
      - name: "缩放后放置"
        description: "精灵根据某种参数（如目标像素周围的空间大小或图例中的缩放因子）进行放大/缩小后放置。引入尺寸变换推理，解题者需推断缩放规则。"
        source: scaling
        source_task: "b10624e5"
        delta_lines: 30
      - name: "镜像翻转后放置"
        description: "精灵放置时根据目标像素相对于框架中心的位置进行水平/垂直镜像翻转。左半区的精灵正常放置，右半区水平翻转，增加对称性推理。"
        source: reflection
        source_task: "b10624e5"
        delta_lines: 20
      - name: "仅放置精灵轮廓（空心化）"
        description: "取反完整放置：精灵不以实心形状放置，而是仅保留外轮廓像素（内部像素改为背景色）。从实心图案变为空心边框，视觉差异明显且需要轮廓提取逻辑。"
        source: inversion
        source_task: null
        delta_lines: 15

  - id: D6
    name: "第二步变换：重着色规则"
    tag: transform
    current: "放置后的所有精灵根据图例中的形状-颜色映射进行统一重着色（s2.color = d2.color），同形状精灵获得相同输出颜色"
    alternatives:
      - name: "部分重着色（仅改变特定像素）"
        description: "重着色不应用于精灵的全部像素，而是仅改变精灵中符合特定条件的像素（如仅边缘像素或仅内部像素重着色）。增加重着色规则的精细度和推理难度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "多色重着色（图例指定颜色图案）"
        description: "图例不仅指定单一输出颜色，而是指定一个多色图案（如条纹或棋盘格式）。精灵重着色后呈现图案而非纯色。增加图例编码复杂度。"
        source: pattern_stamping
        source_task: "a395ee82"
        delta_lines: 25
      - name: "不重着色（保留原始精灵颜色）"
        description: "取反重着色步骤：精灵放置后保留匹配时使用的原始颜色，图例仅作为干扰项存在或用于其他目的。解题者需判断图例是否真正参与变换。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "颜色交换而非覆盖"
        description: "重着色时不是将精灵颜色替换为图例颜色，而是精灵颜色与图例颜色进行交换——即图例条目自身的颜色也会被修改。引入双向变换逻辑。"
        source: color_swap
        source_task: "a25697e4"
        delta_lines: 15

  - id: D7
    name: "符号编码：图例的结构与位置"
    tag: symbol_instructions
    current: "左上角图例由多个条目组成，每个条目展示一个形状模式及其对应的输出颜色，形成形状到颜色的查找表"
    alternatives:
      - name: "图例位于右下角"
        description: "取反图例位置：图例从左上角移至右下角。解题者需在非惯常位置发现图例，改变视觉搜索策略。其他逻辑不变。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "图例分散在网格边缘"
        description: "图例条目不集中在一个角落，而是分散在网格的各条边缘上。解题者需先收集所有边缘上的图例碎片，再组装成完整映射表。增加信息聚合推理。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "图例为嵌套编码（颜色数量编码而非形状）"
        description: "图例中不展示形状而是展示不同数量的彩色像素（如1个点、2个点、3个点），精灵按像素数量匹配图例条目。从形状识别变为计数推理。"
        source: endpoint_matching
        source_task: "97d7923e"
        delta_lines: 20
      - name: "图例为2x2颜色矩阵"
        description: "图例不使用形状而是2x2的颜色矩阵，每个位置的颜色编码代表一种映射规则（如左上色=输入色，右上色=输出色）。需要理解空间位置编码。"
        source: f560132c
        source_task: "f560132c"
        delta_lines: 20

  - id: D8
    name: "轨迹/源保留行为"
    tag: trajectory
    current: "外部精灵被搬移后原始位置消失（隐含disappear），仅在框架内出现重着色后的版本"
    alternatives:
      - name: "保留原始精灵（复制而非移动）"
        description: "框架外的精灵保留在原位不变，框架内放置的是精灵副本。输出中同时显示原始精灵和框架内变换后的精灵。解题者需识别'复制+变换'模式而非'移动+变换'。"
        source: keep_source
        source_task: "3e6067c3"
        delta_lines: 8
      - name: "原始位置填充为框架颜色"
        description: "精灵被移走后，原位置不是恢复为背景色，而是填充为灰色（框架色）。视觉上暗示精灵'来自'框架区域的扩展。改变背景清理逻辑。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "移动路径上留下彩色轨迹"
        description: "从精灵原始位置到框架内目标位置画一条同色虚线或实线轨迹。输出中可视化移动路径，增加路径推理维度。解题者需理解运动方向。"
        source: continuous_trail
        source_task: "8b9c3697"
        delta_lines: 25

  - id: D9
    name: "输出网格形状"
    tag: grid_shape
    current: "输出为灰色框架区域（grey frame region），可能裁剪到框架范围"
    alternatives:
      - name: "输出为整个输入网格"
        description: "取反裁剪：输出保留整个网格包括框架外区域和图例。解题者需理解框架内外都可能有变化，增加全局观察需求。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "紧凑裁剪至框架内部（不含边框）"
        description: "输出仅保留框架内部的有效区域，去除灰色边框本身。输出尺寸更小，解题者需精确推断裁剪边界。"
        source: tight_crop
        source_task: "20270e3b"
        delta_lines: 10
      - name: "按图例条目数分割输出"
        description: "输出不是单一网格而是按重着色颜色分组，每种颜色的精灵占据独立子网格。类似框架分离，解题者需理解分组规则。"
        source: frame_separation
        source_task: "5545f144"
        delta_lines: 30

  - id: D10
    name: "多步处理顺序"
    tag: multi_step
    current: "三步流程：(1)识别框架和图例→(2)按颜色匹配精灵到框架内像素并放置形状→(3)按图例重着色所有放置的精灵"
    alternatives:
      - name: "先重着色再放置"
        description: "取反步骤顺序：先根据精灵形状在图例中查找目标颜色并重着色精灵，再将重着色后的精灵放置到框架内匹配位置。匹配条件可能也需相应调整（如用重着色后的颜色匹配）。改变推理链的因果顺序。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "逐步迭代放置（每次放一个精灵，后续精灵的匹配受前一步影响）"
        description: "精灵不是并行放置而是按特定顺序逐个放置。每个精灵放置后可能改变框架内状态，影响后续精灵的匹配目标。引入顺序依赖推理，类似链式处理。"
        source: chaining
        source_task: "78332cb0"
        delta_lines: 25
      - name: "增加验证步骤（放置后检查冲突）"
        description: "在放置和重着色之间增加冲突检查步骤：如果两个精灵的放置区域重叠，按某种优先级规则（如面积大的优先）决定保留哪个。增加冲突解决推理。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "两步合一（匹配条件同时包含颜色和形状）"
        description: "取消独立的重着色步骤：精灵同时按颜色匹配目标位置和按形状匹配图例颜色，一步完成放置+重着色。简化流程但要求同时处理双重匹配条件。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D11
    name: "灰色框架的结构"
