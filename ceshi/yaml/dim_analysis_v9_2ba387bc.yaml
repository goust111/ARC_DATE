task_id: 2ba387bc
task_type: move_in_order
summary: "将散布在背景上的4x4方块按类型分类（空心框架放左列、实心方块放右列），每组按输入中的行位置从上到下排序后堆叠输出"

dimensions:
  - id: D1
    name: "分类标准——框架 vs 实心的判定方式"
    tag: match_cond
    current: "通过检测4x4方块的2x2内部是否全为背景色来判断：内部为背景色则为框架(frame)，否则为实心(solid)"
    alternatives:
      - name: "按边框颜色一致性分类"
        description: "不看内部，而是看外边框：如果外边框所有像素为同一颜色则归为A类，如果外边框含有多种颜色则归为B类。解题者需关注边框而非内部的属性，反转了当前的观察焦点"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "按颜色数量分类"
        description: "统计每个4x4方块中出现的不同颜色数量：只含1种颜色的为实心组，含2种颜色（边框色+背景色）的为框架组。逻辑等价但推理路径不同，解题者需要从颜色计数角度思考"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "按面积大小分组"
        description: "类似62593bfd的area_grouping：计算每个方块中非背景色像素的面积，面积=12（框架的边框像素数）的为一组，面积=16（实心）的为另一组。解题者需要计数非背景像素来推断分组"
        source: area_grouping
        source_task: "62593bfd"
        delta_lines: 12
      - name: "按是否存在对称轴分类"
        description: "框架天然具有四重对称性，而实心方块也有四重对称性——可改为：一组方块内部有十字形图案（部分内部填充），另一组为纯色。解题者需要识别内部图案的对称属性来分类"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D2
    name: "排序规则——组内排列顺序"
    tag: match_cond
    current: "每组（框架组和实心组）内部按输入中的行位置(row)从上到下排序，行相同时按列位置(col)排序"
    alternatives:
      - name: "按列位置排序（左到右）"
        description: "反转排序主键：不按行从上到下排，而按列从左到右排。解题者需从示例中判断排序是基于行还是列，增加了空间推理的不确定性"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "按行位置降序排列（从下到上）"
        description: "反转当前升序规则：行位置最大的方块排在最前面。解题者需识别排序方向的反转，容易与从上到下的默认直觉冲突"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "按到网格中心的距离排序"
        description: "类似291dc1e1的distance_ordering：计算每个方块中心到网格中心的欧几里得距离，由近到远排序。将简单的行列排序变为距离计算推理"
        source: distance_ordering
        source_task: "291dc1e1"
        delta_lines: 10
      - name: "按方块的颜色值排序"
        description: "不按位置排序，而按方块的主体颜色在色谱中的顺序排列。需要从示例中推断颜色排序规则，将空间排序转变为颜色序列推理。需通过多个示例让人类可推断色序"
        source: creative
        source_task: null
        delta_lines: 10

  - id: D3
    name: "源对象的形状与尺寸"
    tag: src
    current: "所有对象均为固定的4x4正方形，框架为1像素宽边框+2x2背景内部，实心为全色填充"
    alternatives:
      - name: "可变尺寸的方块（3x3到5x5）"
        description: "方块尺寸不再固定为4x4，而是在3x3到5x5之间随机变化。分类逻辑不变，但输出列宽需适应最大方块宽度，堆叠时需处理不同高度的行，显著增加空间推理难度"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "矩形替代正方形（如4x6或3x4）"
        description: "对象从正方形变为长方形，框架的边框仍为1像素宽。解题者需处理非正方形对象的分类和堆叠对齐，输出布局更复杂"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "三种类型的方块（框架、实心、十字形）"
        description: "增加第三种类型：内部为十字形图案的方块（如中间2x2中只有对角线位置填色）。输出增加到三列，解题者需识别三种不同的内部结构"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "空心框架的边框宽度可变"
        description: "框架不再固定1像素宽边框——在更大方块（如6x6）中可能有2像素宽边框。解题者需判断边框宽度是否影响分类，增加了对'框架'定义的推理深度"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D4
    name: "源对象的类型标识物"
    tag: src
    current: "框架(frame)通过1像素彩色边框+背景色内部识别；实心(solid)通过全部同色填充识别"
    alternatives:
      - name: "带颜色分组的框架——框架内部填充非背景色"
        description: "类似b5ca7ac4的color_grouping：框架内部不再是背景色而是另一种颜色，分类依据变为'内部颜色是否与边框颜色不同'。解题者需分析颜色关系而非简单的背景检测"
        source: color_grouping
        source_task: "b5ca7ac4"
        delta_lines: 15
      - name: "实心方块可含少量噪声像素"
        description: "实心方块中允许1-2个像素为不同颜色（噪声），分类时需判断'绝大部分像素同色'而非'全部像素同色'。增加了鲁棒分类的推理需求"
        source: anomaly_detection
        source_task: "b99e7126"
        delta_lines: 10
      - name: "方块带有单像素颜色标记"
        description: "每个方块内部有一个特殊颜色的像素作为标记点，标记的位置（角落 vs 中心）决定分类。类似4c416de3的anchor_points，解题者需定位标记点并根据位置分类"
        source: anchor_points
        source_task: "4c416de3"
        delta_lines: 18

  - id: D5
    name: "目标布局——两列排列方式"
    tag: dst
    current: "框架放入左列（cols 0-3），实心放入右列（cols 4-7），两列紧邻无间隙"
    alternatives:
      - name: "左右互换——实心放左列，框架放右列"
        description: "反转当前列分配规则。解题者需从示例中推断哪种类型对应哪一列，不能依赖默认假设"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "两列之间加1像素分隔列"
        description: "左列和右列之间插入1列背景色分隔，输出宽度变为9。视觉上两组更清晰分开，解题者需推断分隔列的存在"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "上下排列替代左右排列"
        description: "框架组堆叠在上方，实心组堆叠在下方，各组内部仍按行排序。输出从双列变为单列双段，完全改变空间布局"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "重力堆叠——框架从底部向上堆叠，实心从顶部向下堆叠"
        description: "类似62593bfd的gravity机制：左列的框架从输出底部向上堆叠，右列的实心从顶部向下堆叠。解题者需推断两列的堆叠方向相反"
        source: gravity
        source_task: "62593bfd"
        delta_lines: 8
      - name: "交错排列——框架和实心在同一列中交替放置"
        description: "不分左右列，而是按排序顺序将框架和实心交替放入同一列。输出宽度只有4，高度为所有方块数量x4。解题者需推断交替规则"
        source: creative
        source_task: null
        delta_lines: 15

