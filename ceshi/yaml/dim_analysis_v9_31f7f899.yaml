task_id: 31f7f899
task_type: move_to_match
summary: "将垂直条按高度排序后重新分配到固定颜色槽位中——按高度升序排列的条形放入从左到右排列的槽位，每个槽位保持原色"

dimensions:
  - id: D1
    name: "匹配条件：按高度排序映射槽位"
    tag: match_cond
    current: "size_ordering — 将条形按高度升序排序，槽位按列位置从左到右排序，第i短的条形放入第i个槽位"
    alternatives:
      - name: "按颜色匹配对应槽位"
        description: "条形的颜色与目标槽位边缘/标记颜色匹配（如 s.head.color == d.edge.color），而非依赖高度排序。解题者需识别颜色对应关系而非排序规则，推理模式从排列问题变为匹配问题。"
        source: color_match
        source_task: 2c181942
        delta_lines: 20
      - name: "按形状匹配凹槽"
        description: "每个条形有独特的轮廓形状（非简单矩形），目标位置有对应形状的凹槽，需形状契合才能放入。从数值排序变为几何拼合，推理难度显著提升。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 30
      - name: "按高度降序排序（取反）"
        description: "将排序方向反转为降序——最高的条放到最左槽位。看似简单的取反，但解题者必须准确判断排序方向，不能依赖'自然'的升序假设。"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "按宽度排序映射"
        description: "条形具有不同宽度（1/3/5），按宽度而非高度排序分配到槽位。解题者需从水平维度而非垂直维度提取排序键，改变了注意力焦点。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "按面积排序映射"
        description: "条形有不同的宽度和高度组合，按总像素面积排序。面积无法直接目测，需要同时考虑两个维度，增加心理计算负担。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "行对齐匹配"
        description: "每个条形上有一个特殊标记像素，目标槽位旁也有相同行位置的标记，条形需移动到标记行对齐的槽位。从全局排序变为逐对的空间对齐。"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 25
      - name: "连接器形状匹配"
        description: "每个条形底部附加一个小型连接器图案（如L形、T形），槽位顶部有对应的反向连接器凹口。匹配条件从数值属性变为局部形状对齐，需要精确的空间推理。"
        source: connector_match
        source_task: 20270e3b
        delta_lines: 30
      - name: "按条与基线交叉宽度排序"
        description: "条形在基线上的宽度（footprint）各不相同，按此宽度排序分配槽位。条形本身高度相同但底部宽度不同，解题者需关注底部接触区域而非整体高度。"
        source: creative
        source_task: null
        delta_lines: 12

  - id: D2
    name: "排序消歧规则"
    tag: match_cond
    current: "高度相同时依次按像素数、列位置、颜色消歧"
    alternatives:
      - name: "高度相同时按颜色顺序消歧"
        description: "当两个条形高度相同时，按其颜色在调色板中的顺序（如红<蓝<绿）决定先后。增加隐含规则层级，解题者需推断两层排序逻辑。但注意颜色顺序需通过样例中的实际排列推断，保持人类可视性。"
        source: creative
        source_task: null
        delta_lines: 5
      - name: "频率消歧：出现更多的颜色优先"
        description: "同高度时，网格中该颜色像素总数更多的条形排在前面。引入全局统计量作为消歧依据，类似 frequency_tiebreak 机制。"
        source: frequency_tiebreak
        source_task: 67e490f4
        delta_lines: 10
      - name: "反转消歧方向（右优先）"
        description: "同高度时按列位置从右到左排序，而非从左到右。主排序保持升序不变，仅消歧方向取反，增加隐含规则的微妙性。"
        source: inversion
        source_task: null
        delta_lines: 3

  - id: D3
    name: "源对象：条形结构"
    tag: src
    current: "3-5个矩形单色垂直条，宽度1或3（奇数），高度1-11（奇数），关于基线上下对称"
    alternatives:
      - name: "非对称条形（仅基线上方延伸）"
        description: "条形只向基线上方延伸（不向下），取消上下对称约束。视觉上更简洁但破坏了对称美感，条形高度直接可读为上方像素行数。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "十字形精灵替代矩形条"
        description: "每个源对象不是简单矩形条，而是十字形（+形），大小由臂长决定。形状更复杂但仍有明确的尺寸度量（臂长），排序逻辑不变但视觉模式完全不同。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "T形条（带水平臂）"
        description: "条形顶部有水平臂形成T形，尺寸由垂直高度+水平宽度共同决定。增加了形状复杂度，解题者需确定以哪个维度作为排序键。"
        source: creative
        source_task: null
        delta_lines: 18
      - name: "高度可变的多段条"
        description: "条形不是实心矩形，而是中间有间隔的多段结构（如两段分开的矩形在同一列范围内）。排序键变为总高度还是最高段高度成为推理重点。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "对角线条形精灵"
        description: "条形以45度对角线方式排列而非垂直方向，长度由对角像素数决定。从轴对齐矩形变为对角线段，空间推理显著不同。"
        source: diagonal_markers
        source_task: 9385bd28
        delta_lines: 25

  - id: D4
    name: "目标槽位：原地替换"
    tag: dst
    current: "条形的原始列位置即为槽位，保持位置不变，只替换条形形状"
    alternatives:
      - name: "停靠到独立的水平条框架"
        description: "网格中有独立的目标框架（如水平条形容器），条形需移动到框架内部而非替换原位。从原地排序变为跨区域移动+嵌入，空间变换更大。"
        source: docking
        source_task: 7c66cb00
        delta_lines: 30
      - name: "填入框架洞中"
        description: "网格中有一个大框架，框架内有与条形匹配的洞（hole），条形需放入对应的洞中。引入容器概念和空间嵌套关系。"
        source: hole_fill
        source_task: 67e490f4
        delta_lines: 25
      - name: "输出为紧凑裁剪"
        description: "排序后的条形不保留在原始网格中，而是紧凑裁剪为最小外接矩形。解题者需同时完成排序和输出格式推断，增加了grid_shape维度的挑战。"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 15
      - name: "槽位从右到左排列（取反）"
        description: "槽位按列位置从右到左排序而非从左到右。与排序方向形成交叉——最矮条放最右侧。解题者需同时推断排序方向和槽位方向。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "槽位由标记像素指定顺序"
        description: "每个槽位旁边有一个小数字标记（用像素点数编码1,2,3...），指定该槽位是第几个接收位置。从空间位置排序变为标记编码排序，引入 symbol_instructions 层级。"
        source: marker_alignment
        source_task: 581f7754
        delta_lines: 20

  - id: D5
    name: "变换：重新着色"
    tag: transform
    current: "recolor — 条形形状放入新槽位后，颜色变为该槽位的原始颜色"
    alternatives:
      - name: "保持源颜色不变"
        description: "条形移动后保持自身原始颜色，不采用槽位颜色。取消重着色使得解题者可以直观追踪每个条的移动路径，但也失去了颜色作为槽位标识的信息。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "颜色交换（双向）"
        description: "条形与槽位进行双向颜色交换——条形获得槽位色，同时基线上对应位置的颜色变为条形原始色。增加视觉追踪复杂度。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 12
      - name: "条形形状旋转后放入"
        description: "条形被旋转90度后水平放入槽位（垂直条变水平条），同时重着色。解题者需同时处理几何变换和颜色变换，推理链更长。"
        source: rotation
        source_task: 2c181942
        delta_lines: 20
      - name: "擦除源位置留下轮廓"
        description: "排序后，原始位置的条形不完全消失，而是留下一个边框轮廓（1像素宽轮廓），新位置放入实心条。解题者需推断哪些是原始位置（轮廓）、哪些是目标位置（实心）。"
        source: erase
        source_task: 58f5dbd5
        delta_lines: 15
      - name: "条形高度归一化后放入"
        description: "所有条形放入槽位后被缩放到统一高度（如基线到网格边缘），仅颜色和位置保留排序信息。解题者需注意输出中高度信息消失、排序结果隐含在颜色-位置映射中。"
        source: creative
        source_task: null
        delta_lines: 18

  - id: D6
    name: "基线结构"
    tag: src
    current: "单条水平基线跨越网格全宽，位于网格中间行（H//2），颜色固定为6"
    alternatives:
      - name: "垂直基线"
        description: "基线改为垂直方向（跨越全高，位于W//2列），条形变为水平条向左右两侧延伸。整个任务的空间方向旋转90度，解题者需适应水平排列的条形。"
        source: inversion
        source_task: null
        delta_lines: 20
      - name: "非居中基线"
        description: "基线不在网格正中，而是随机偏移（如在上三分之一或下三分之一位置）。条形上下延伸不对称，高度计算方式可能改变，增加空间推理的不确定性。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "双基线（上下两条）"
        description: "网格有两条水平基线，条形悬挂在上基线和生长在下基线之间，排序可能基于从上基线到下基线之间的条形长度。引入双参考线概念。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "基线颜色随机化"
        description: "基线颜色不固定为6，而是从非背景色中随机选择。解题者需先识别基线（通过其跨越全宽且为单色的结构特征），而非依赖固定颜色值。增加前置识别步骤。"
        source: creative
        source_task: null
        delta_lines: 5

  - id: D7
    name: "网格形状与尺寸"
    tag: grid_shape
    current: "正方形网格，7-17行列，奇数边长"
    alternatives:
      - name: "非正方形矩形网格"
        description: "允许宽度和高度不同（如宽>高或高>宽），条形高度受限于较短的垂直空间。打破正方形假设，解题者不能用边长推断基线位置。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "输出裁剪为条形区域"
        description: "输出网格紧密裁剪到只包含条形和基线的最小矩形，去掉周围的背景空白。输入和输出尺寸不同，增加grid_shape推理维度。"
        source: tight_crop
        source_task: 20270e3b
        delta_lines: 12
      - name: "输入输出分离为两个区域"
        description: "输入网格水平分为两半——左半包含未排序的条形，右半为空（或有槽位标记）。输出填充右半区域。引入 frame_separation 结构，解题者需理解空间分区。"
        source: frame_separation
        source_task: 5545f144
        delta_lines: 20
      - name: "偶数边长网格"
        description: "网格边长允许偶数值，基线位置需要新的定义规则（如 H//2 或 H//2-1）。取消奇数约束使基线不再严格居中，增加了边界条件的细微推理。"
        source: inversion
        source_task: null
        delta_lines: 5

  - id: D8
    name: "轨迹：源条形处理"
    tag: trajectory
    current: "默认消失——排序后原始位置的条形被移除（背景填充），条形形状出现在新位置"
    alternatives:
      - name: "保留源条形（keep_source）"
        description: "原始位置的条形保留不变，排序后的条形同时出现在新位置。输出同时显示'排序前'和'排序后'两套条形，解题者需理解重叠和叠加逻辑。"
        source: keep_source
        source_task: 247ef758
        delta_lines: 10
      - name: "源位置留下轨迹标记"
        description: "条形移动后，原始位置用特殊颜色（如灰色）的标记点表示曾经的位置。解题者可通过轨迹验证排序前后的对应关系。"
        source: continuous_trail
        source_task: 8b9c3697
        delta_lines: 12
      - name: "源位置填充为基线颜色"
        description: "条形离开后，原始位置的像素变为基线颜色而非背景色，形成基线的'扩展'效果。视觉上基线局部加宽，增加输出的信息密度。"
        source: flood_fill
        source_task: 7666fa5d
        delta_lines: 8

  - id: D9
    name: "条形数量与颜色约束"
    tag: src
    current: "3-5个条形，每个使用不同的非背景非基线色，从 {1,2,3,4,5,7,9} 中无放回选取"
    alternatives:
      - name: "允许条形共享颜色"
        description: "多个条形可以有相同颜色，通过位置区分身份。颜色不再是条形唯一标识符，解题者需依赖空间位置追踪条形的移动和排序。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "更多条形（6-8个）"
        description: "条形数量增加到6-8个，需要更大的网格容纳。排序任务规模增大，视觉上更密集，解题者需处理更复杂的排列。需配合网格尺寸扩大。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "仅2个条形"
        description: "最少化为2个条形的交换问题。虽然排序逻辑简化，但作为最小实例更容易暴露规则，可能使解题者更快推断。适合简单变体。"
        source: inversion
        source_task: null
        delta_lines: 5
      - name: "包含干扰色块"
        description: "网格中添加不参与排序的干扰色块（与条形颜色不同），解题者需先区分哪些是参与排序的条形、哪些是干扰项。增加前置过滤步骤。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D10
    name: "多步骤序列化处理"
    tag: meta
    current: "单步全局排序——一次性将所有条形按高度排序分配到所有槽位"
    alternatives:
      - name: "逐步冒泡排序"
        description: "每个训练样例只展示一次相邻交换（冒泡排序的一步），测试时给出中间状态，要求输出下一步交换结果。解题者需识别排序算法的单步操作，而非最终结果。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "分组排序：先按颜色族分组再组内排序"
        description: "条形先按颜色属性分为两组（如暖色/冷色），组内按高度排序，组间保持原始左右关系。引入二级排序逻辑，解题者需推断分组规则和组内排序规则。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "先排序再施加额外变换"
        description: "第一步按高度排序，第二步对排序结果施加额外操作（如每个条形向上平移1行，或基线颜色改变）。引入链式多步操作，每步变换都需独立推断。"
        source: multi_step
        source_task: 247ef758
        delta_lines: 15
      - name: "交替排序方向"
        description: "奇数位槽位按升序填充，偶数位槽位按降序填充（或反之）。交错的排序方向使最终排列呈现'锯齿'式高度分布，解题者需发现交替模式。"
        source: creative
        source_task: null
        delta_lines: 12

  - id: D11
    name: "符号编码参数"
    tag: meta
    current: "无符号编码——排序规则（升序、左到右）是隐含的固定规则"
    alternatives:
      - name: "图例指定排序方向"
        description: "网格角落有一个小型图例（如一个从小到大或从大到小的箭头形状），指示排序应为升序还是降序。不同样例可能有不同方向，解题者需先解读图例再执行排序。"
        source: symbol_instructions
        source_task: 97d7923e
        delta_lines: 20
      - name: "标记像素指定目标槽位映射"
        description: "每个条形旁有一个小型标记（如不同数量的点），直接编码该条形应该去第几个槽位。从推断排序规则变为解读位置编码，引入 symbol_instructions 维度。"
        source: symbol_instructions
        source_task: 9385bd28
        delta_lines: 22
      - name: "基线上的颜色段编码目标顺序"
        description: "基线不再是单色，而是分段着色——每段颜色对应一个条形的目标颜色，段的顺序即为目标排列顺序。解题者需从基线颜色序列推断映射关系。"
        source: symbol_instructions
        source_task: e3721c99
        delta_lines: 18

  - id: D12
    name: "src-dst 基数关系"
    tag: meta
    current: "1:1 — 每个条形形状恰好对应一个槽位，条形数等于槽位数"
    alternatives:
      - name: "many:1 — 多条合并到一个槽位"
        description: "多个短条形合并叠加到同一个槽位中（如按颜色分组后，同组条形垂直堆叠）。从排列问题变为分组+堆叠问题，空间推理更复杂。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "1:many — 一条分裂到多个槽位"
        description: "某些条形需要复制后放入多个槽位（如最高的条形同时出现在两个位置），其余条形正常分配。引入复制语义，打破一一映射的假设。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "N:M — 条形和槽位数量不等"
        description: "条形数量多于槽位（需选择性放置，某些条形被丢弃）或槽位多于条形（某些槽位保持空白）。引入过滤/选择逻辑，解题者需推断哪些被保留。"
        source: creative
        source_task: null
        delta_lines: 18

  - id: D13
    name: "条形对称性约束"
    tag: src
    current: "条形关于基线行上下对称（上方延伸 = 下方延伸）"
    alternatives:
      - name: "条形非对称（上下延伸不等）"
        description: "条形上方和下方延伸可以不同（如上方3像素，下方5像素）。排序键可用总高度、上方高度或下方高度，解题者需确定哪个维度决定排序。"
        source: inversion
        source_task: null
        delta_lines: 12
      - name: "条形仅向一侧延伸"
