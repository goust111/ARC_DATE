      - name: "极稀疏精灵"
        description: "精灵仅有 2-4 个非零像素，模式极其简约。规则必须在极少信息下可辨识，如两像素的旋转或端点提取。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "固定密度精灵"
        description: "所有精灵（训练对和测试）的非零像素数完全相同。消除像素数作为配对线索，强迫解题者依赖颜色集匹配。"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D18
    name: "框架边框颜色方案"
