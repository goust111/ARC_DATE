        source_task: b10624e5
        delta_lines: 30
      - name: "更大的框架"
        description: "框架尺寸范围扩大到 10-14（内部 8-12），精灵图案更复杂。需要在更大的画布上观察和推理规则。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "更小的框架"
        description: "框架尺寸限制为 4-5（内部 2-3），精灵极其简约。规则必须在极少像素中可辨识，增加精确推理的压力。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D11
    name: "训练对方向性"
    tag: match_cond
    current: "solver 尝试两个方向（A→B 和 B→A），选择得分更高的方向作为变换方向"
    alternatives:
      - name: "显式方向标记"
        description: "通过箭头形状的额外像素或框架边缘的标记色明确指示训练对的源→目标方向。解题者无需双向猜测，但需理解方向标记的含义。"
        source: marker_pixels
        source_task: 9aaea919
        delta_lines: 25
      - name: "空间顺序决定方向"
        description: "训练对中左上方/先出现的为源，右下方/后出现的为目标。方向由空间位置隐式编码。"
        source: column_row_alignment
        source_task: 8b9c3697
        delta_lines: 15
      - name: "双向变换（可逆规则）"
        description: "只选择可逆变换规则（如旋转、翻转、invert0），使得A→B和B→A用同一操作，方向不影响结果。简化了方向推理但限制了规则种类。"
        source: inversion
        source_task: null
        delta_lines: 10

  - id: D12
    name: "稳定色与变量色的区分"
    tag: transform
    current: "精灵内部有稳定色（变换前后位置不变）和变量色（参与变换的主色），通过比较训练对自动识别"
    alternatives:
      - name: "全色参与变换"
        description: "精灵内所有非零颜色都参与变换，没有稳定色。简化了颜色角色分析，但变换规则需更明确。取反：从部分色稳定到全部色变化。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "多变量色独立变换"
        description: "精灵包含两种变量色，每种执行不同但相关的子变换（如一种取端点、另一种填充）。需分别推断每种颜色的变换。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "颜色角色交换"
        description: "变换中稳定色和变量色的角色交换：原来不变的颜色在变换中发生改变，原来参与变换的颜色保持不变。与 color_swap 机制类似。"
        source: color_swap
        source_task: a25697e4
        delta_lines: 20

