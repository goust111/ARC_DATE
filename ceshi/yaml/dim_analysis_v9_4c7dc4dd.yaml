task_id: 4c7dc4dd
task_type: move_to_match
summary: "从框架内的训练精灵对（s1.s, s1.d）中推断变换规则，将该规则应用于测试精灵 s2 以生成输出"

dimensions:
  - id: D1
    name: "变换规则类型"
    tag: match_cond
    current: "从 {endpoints, fill, sym_fill, comp_checker, invert0, sym} 中选择一种规则，训练对展示该规则，测试精灵应用同一规则"
    alternatives:
      - name: "组合变换规则"
        description: "训练对展示两步串联变换（如先旋转再取端点），解题者需推断并组合两个操作。这大幅提高推理难度，因为解题者必须分解出两个独立变换步骤。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "条件变换规则"
        description: "根据精灵的某种属性（如非零像素数量的奇偶性、颜色数量）选择不同的变换规则。例如像素数为奇数时做 endpoints，偶数时做 fill。需要解题者同时推断条件和对应规则。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "颜色映射规则学习"
        description: "变换不再是几何操作，而是颜色重映射：训练对展示颜色A变为颜色B、颜色C变为颜色D的映射规则，测试精灵需应用相同的映射逻辑（如奇数色变偶数色对应颜色）。"
        source: color_match
        source_task: 2c181942
        delta_lines: 30
      - name: "形状匹配驱动的规则选择"
        description: "提供多个训练对，每对使用不同规则。测试精灵的形状特征（如连通分量数量）决定应用哪个训练对的规则。解题者需同时理解多种规则并学会选择条件。"
        source: shape_match
        source_task: 16b78196
        delta_lines: 50
      - name: "参数化变换规则"
        description: "规则本身带有从训练对中提取的数值参数，例如旋转角度由训练对中某种像素排列暗示（如L形暗示90度，一字形暗示180度），测试精灵需应用相同参数化旋转。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D2
    name: "训练对的配对识别方式"
    tag: match_cond
    current: "通过内部颜色集合相同来识别哪两个框架构成训练对"
    alternatives:
      - name: "框架边框颜色配对"
        description: "训练对的两个框架使用相同的边框颜色（与其他框架不同），而非内部颜色集匹配。解题者需从外观线索（边框颜色）而非内容线索（精灵颜色）来配对。"
        source: border_color_match
        source_task: d35bdbdc
        delta_lines: 20
      - name: "空间邻近性配对"
        description: "训练对是距离最近的两个非空框架（如同一行或同一列的两个框架）。解题者需利用空间位置关系来推断配对。"
        source: row_alignment
        source_task: 38007db0
        delta_lines: 15
      - name: "像素数量对称配对"
        description: "训练对中 s1.s 和 s1.d 的非零像素数之和等于某个特定值（如内部面积），或两者像素数量呈互补关系，以此区别于测试精灵。"
        source: count_match
        source_task: 6e4f6532
        delta_lines: 20
      - name: "框架大小差异配对"
        description: "四个框架不再同一大小，训练对使用相同大小但与测试框架大小不同。解题者需通过框架尺寸来识别训练对。"
        source: size_match
        source_task: 2c181942
        delta_lines: 25

  - id: D3
    name: "源对象结构"
    tag: src
    current: "两个训练精灵（s1.s, s1.d）位于框架内部，各使用 1-2 种非背景色，像素数 3-32"
    alternatives:
      - name: "多层训练对"
        description: "每个训练精灵由两个独立的颜色层组成，每层有不同的变换规则（如一层旋转、另一层取反）。解题者需分别推断每层的变换并合成结果。"
        source: creative
        source_task: null
        delta_lines: 40
      - name: "带锚点标记的精灵"
        description: "训练精灵内含一个特殊颜色的锚点像素，该锚点在变换中保持位置不变，其余像素围绕锚点变换。锚点提供了变换的参考基准。"
        source: anchor_points
        source_task: 4c416de3
        delta_lines: 25
      - name: "连通分量作为独立子精灵"
        description: "训练精灵内包含多个不相连的连通分量，每个分量独立进行相同变换。解题者需识别出分量边界并分别处理。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "异常检测式源识别"
        description: "多个框架内的精灵遵循同一模式，仅一个精灵与众不同（异常精灵）。异常精灵作为测试输入，规则从一致性精灵中提取。"
        source: anomaly_detection
        source_task: b99e7126
        delta_lines: 35

  - id: D4
    name: "目标输出形式"
    tag: dst
    current: "输出为测试框架内部 (S-2)x(S-2) 的紧凑裁剪区域"
    alternatives:
      - name: "填充空白框架"
        description: "输出不是紧凑裁剪，而是将变换结果写入空白框架的内部，输出整个网格。解题者需定位空白框架并理解结果应放在那里。"
        source: hole_fill
        source_task: 67e490f4
        delta_lines: 15
      - name: "替换测试精灵原位"
        description: "输出是完整的输入网格副本，但测试框架内的精灵被变换后的结果替换。保持背景和其他框架不变。"
        source: cavity_fill
        source_task: 5dbc8537
        delta_lines: 20
      - name: "输出到独立画布"
        description: "输出是一个新的小画布，仅包含变换结果，大小等于精灵内部区域。但与当前裁剪不同的是，画布带有边框标记指示来源框架。"
        source: tight_crop
        source_task: null
        delta_lines: 10
      - name: "拼接输出"
        description: "输出将训练对的目标和测试结果并排拼接成一行或一列，解题者需同时输出训练对验证和测试答案。"
        source: slot_filling
        source_task: 78332cb0
        delta_lines: 25

  - id: D5
    name: "精灵变换操作集"
    tag: transform
    current: "六种规则之一: endpoints（取端点）、fill（填充间隙）、sym_fill（对称填充）、comp_checker（棋盘互补）、invert0（零与变量色互换）、sym（旋转/翻转）"
    alternatives:
      - name: "膨胀/腐蚀形态学变换"
        description: "训练对展示形态学膨胀（每个非零像素向四邻域扩展一格）或腐蚀（去除只有一个邻居的像素）。这是一种经典的图像处理操作，作为 ARC 谜题直观易懂。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "凸包填充"
        description: "变换将精灵的非零像素区域填充为其凸包（最小凸多边形覆盖区域）。解题者需理解凸包的几何概念。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "边界描绘"
        description: "变换保留精灵非零区域的边界像素（4-连通外边界），去除内部像素。与 endpoints 不同的是这里保留的是2D边界而非1D端点。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "重心对称翻转"
        description: "以精灵非零像素的重心为中心进行点对称翻转（180度旋转），结果像素位置四舍五入到整数格。与 sym 规则中的简单旋转不同，这里的旋转中心由内容决定。"
        source: point_reflection
        source_task: 7ed72f31
        delta_lines: 30
      - name: "连接线绘制"
        description: "变换在同色像素之间绘制直线连接（水平或垂直最短路径），类似 fill 但仅连接同色的离散像素对而非填充整个范围。"
        source: connector_draw
        source_task: 3e6067c3
        delta_lines: 25

  - id: D6
    name: "框架检测方式"
    tag: symbol_instructions
    current: "通过搜索单色空心正方形来检测框架，优先选择更大的框架，框架不重叠"
    alternatives:
      - name: "非正方形矩形框架"
        description: "框架为长方形而非正方形（宽高比非1:1）。解题者需适应非对称的框架形状，精灵内部区域也变为长方形。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "双层嵌套框架"
        description: "框架由两层同心方框组成（外层和内层颜色不同），精灵位于最内层。增加框架识别的复杂性。"
        source: nested_frames
        source_task: 45a5af55
        delta_lines: 30
      - name: "不完整框架（缺口框架）"
        description: "框架的一条边有一个缺口（1-2像素宽），解题者仍需识别这是一个框架。缺口位置可能编码额外信息（如指示变换方向）。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "彩色多边框架"
        description: "框架四条边分别使用不同颜色，颜色组合编码了框架角色（如训练源/目标/测试/空白）。解题者需从边颜色推断框架功能。"
        source: edge_color_match
        source_task: 247ef758
        delta_lines: 30

  - id: D7
    name: "背景噪声类型"
    tag: meta
    current: "对角条纹背景（周期4-5），30-50%的单元格被随机扰动"
    alternatives:
      - name: "纯色背景"
        description: "使用单一纯色背景（如全黑），去除噪声干扰。降低框架检测难度，让解题者更专注于规则推断。取反方向：从有噪声到无噪声。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "棋盘格背景"
        description: "背景为标准棋盘格图案（两色交替），仍然有部分扰动。不同于对角条纹，棋盘格的规则性更强，但容易与 comp_checker 规则混淆，增加推理干扰。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "渐变背景"
        description: "背景颜色沿某个方向渐变（从一种颜色逐渐过渡到另一种），提供了方向性线索。解题者需分离背景渐变和框架/精灵内容。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D8
    name: "框架数量与角色分配"
    tag: meta
    current: "恰好4个框架：2个训练对 + 1个测试精灵 + 1个空白"
    alternatives:
      - name: "无空白框架"
        description: "去掉空白框架，只保留3个框架（训练对2个 + 测试1个）。解题者无需排除空白框架，但需要从3个非空精灵中识别配对。取反：从4框到3框。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "多测试精灵"
        description: "包含5-6个框架：2个训练对 + 2-3个测试精灵 + 0-1个空白。输出为多个变换结果的拼接。解题者需处理多个测试用例。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "两组训练对"
        description: "6个框架：2组训练对（各展示不同规则）+ 2个测试精灵（颜色决定应用哪组规则）。解题者需同时学习两种规则并正确分配。"
        source: creative
        source_task: null
        delta_lines: 45
      - name: "带干扰框架"
        description: "5个框架：正常的4个加一个干扰框架（内含随机图案但不属于任何训练对）。解题者需排除干扰项。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D9
    name: "框架空间布局"
    tag: meta
    current: "四个框架大致分布在网格四个象限，位置有轻微抖动"
    alternatives:
      - name: "线性排列"
        description: "框架沿一行或一列线性排列，顺序隐含训练源→训练目标→测试的语义。解题者需从排列顺序推断角色。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "随机散布"
        description: "框架在网格中完全随机放置（不限于象限），只要不重叠即可。增加框架定位的难度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "嵌套/同心布局"
        description: "大框架包含小框架（如外层大框架内有两个小框架作为训练对）。利用空间包含关系暗示语义角色。"
        source: creative
        source_task: null
        delta_lines: 35

  - id: D10
    name: "框架尺寸一致性"
    tag: meta
    current: "所有4个框架使用相同的外部尺寸 S（6-8），内部尺寸 n = S-2（4-6）"
    alternatives:
      - name: "混合框架尺寸"
        description: "训练对使用一种尺寸，测试精灵使用不同尺寸。变换规则需跨尺寸泛化（如 fill 操作在不同大小网格上的行为）。增加了规则泛化的推理挑战。"
