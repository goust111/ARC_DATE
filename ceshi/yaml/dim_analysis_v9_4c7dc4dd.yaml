    name: "精灵颜色数量约束"
    tag: meta
    current: "每个精灵使用 1-2 种非背景色，训练对和测试精灵的颜色集不相交"
    alternatives:
      - name: "三色精灵"
        description: "精灵使用 3 种非背景色，其中一种为稳定色、一种为主变量色、一种为次变量色。增加颜色角色推理的复杂度。"
