        source: creative
        source_task: null
        delta_lines: 25

  - id: D20
    name: "规则推断的歧义控制"
    tag: match_cond
    current: "solver 按优先级尝试六种规则，选择第一个匹配的；某些规则有额外得分偏好（如 fill 偏好像素增加的方向）"
    alternatives:
      - name: "需消歧的多规则匹配"
        description: "训练对被刻意设计为同时匹配多种规则（如旋转90度的结果恰好也是水平翻转），但仅一种规则在测试精灵上产生正确结果。解题者必须在测试精灵上验证所有候选规则。"
        source: frequency_tiebreak
        source_task: 67e490f4
        delta_lines: 30
      - name: "唯一规则保证"
        description: "生成器确保训练对仅匹配恰好一种变换规则，消除所有歧义。降低推理难度，但更干净。取反：从可能歧义到保证唯一。"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "基于颜色频率消歧"
        description: "当多种规则匹配时，测试精灵中出现频率最高的颜色决定采用哪种规则。增加了颜色统计作为额外推理维度。"
        source: frequency_tiebreak
        source_task: 67e490f4
        delta_lines: 25
