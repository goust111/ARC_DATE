task_id: 7b5033c1
task_type: transform_in_place
summary: "将蛇形多色路径拉直为单列色带，按从左上端点开始的遍历顺序保留像素颜色"

dimensions:
  - id: D1
    name: "变换方式：线性化拉直"
    tag: transform
    current: "将蛇形4-连通路径拉直为 Nx1 单列，按遍历顺序输出每个像素的颜色"
    alternatives:
      - name: "折叠为多列矩阵"
        description: "将路径像素按遍历顺序蛇形排列为 NxM 矩阵（如宽度=路径中不同颜色数），而非单列。解题者需推断折叠宽度规则，增加推理维度。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "反转遍历为 1xN 行"
        description: "输出为单行而非单列（stretch horizontally），且从右下端点开始遍历，是当前'左上起点+垂直列'的双重取反。视觉上输出方向完全不同，解题者需同时推断方向和布局。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "按颜色分段统计替代逐像素输出"
        description: "不输出逐像素颜色序列，而是输出每个颜色段的 (颜色, 长度) 编码——如用颜色列+对应数量列。类似 run-length encoding，解题者需从路径中同时提取颜色和计数。"
        source: counting
        source_task: 8f215267
        delta_lines: 25
      - name: "重新着色路径而非提取"
        description: "保留蛇形路径位置不变，但根据遍历顺序用新的颜色规则重新着色（如按段长度映射到调色板）。输出仍是完整网格而非裁剪列，变换从'提取'变为'原地重着色'。"
        source: recolor
        source_task: 2b83f449
        delta_lines: 20
      - name: "仅提取颜色去重序列"
        description: "输出路径上按遍历顺序出现的不同颜色序列（去除连续重复），而非逐像素。路径中相邻同色段合并为一个像素。解题者需识别颜色变化边界。"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "路径分解为独立色段"
        description: "将路径按颜色段拆分，每段保持原始形状独立输出到网格的不同位置（类似 decomposition）。解题者需同时理解路径分割和空间布局规则。"
        source: decomposition
        source_task: a47bf94d
        delta_lines: 30

  - id: D2
    name: "遍历起点选择规则"
    tag: transform
    current: "从两个端点中选择左上角优先的端点（min(row, col)）开始遍历"
    alternatives:
      - name: "从右下角端点开始"
        description: "取反当前的 top-left-most 规则，改为从 bottom-right-most 端点开始遍历。输出颜色顺序完全反转，解题者需识别这一隐含方向规则。"
        source: inversion
        source_task: null
        delta_lines: 3
      - name: "从颜色较少的端点开始"
        description: "比较两个端点所在颜色段的长度，从段更短的端点开始。解题者需同时识别路径结构和颜色分段信息来确定起点。"
        source: creative
        source_task: null
        delta_lines: 10
      - name: "由标记像素指定起点"
        description: "在网格中放置一个特殊颜色的标记像素（不在路径上）靠近其中一个端点，指示从该端点开始遍历。引入 symbol_instructions 维度，解题者需先识别标记再决定方向。"
        source: marker_axis
        source_task: 7ed72f31
        delta_lines: 15
      - name: "从颜色值更大的端点开始"
        description: "比较两个端点的颜色数值，从颜色值更大的端点开始遍历。解题者需检查端点颜色属性，打破纯空间位置的起点选择惯性。但注意颜色值对人类不直接可见，需要通过颜色本身（如深/浅）间接推断，增加挑战性。"
        source: creative
        source_task: null
        delta_lines: 5

  - id: D3
    name: "源对象：蛇形路径结构"
    tag: src
    current: "单条4-连通无分支蛇形路径，20-30像素，阶梯形交替水平/垂直走向，7-11个转弯"
    alternatives:
      - name: "树形分支路径"
        description: "路径包含一个中心枢纽（hub）和多条分支，每条分支有不同颜色。输出按分支排列，需确定分支遍历顺序（如顺时针）。引入 hub_and_branch 结构，显著增加拓扑推理难度。"
        source: hub_and_branch
        source_task: 800d221b
        delta_lines: 35
      - name: "螺旋形路径"
        description: "路径不再是阶梯形，而是从外向内的矩形螺旋。遍历方向隐含在螺旋旋转方向中。视觉形态完全不同但线性化逻辑相似，增加模式识别的多样性。"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "对角线阶梯路径"
        description: "路径由45度对角线段组成（8-连通而非4-连通），交替对角方向形成锯齿形。改变连通性定义，解题者需适应对角邻接的遍历规则。"
        source: diagonal_hint
        source_task: 7b80bb43
        delta_lines: 20
      - name: "多条独立短路径"
        description: "网格中有3-5条独立的短蛇形路径（各5-8像素），需按特定顺序（如从上到下、从左到右）将所有路径串联输出为一列。引入多源对象排序问题。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "路径颜色结构"
    tag: src
    current: "路径分为3-6个连续同色段，每段2-9像素，使用3-5种不同非背景色，相邻段颜色不同"
    alternatives:
      - name: "逐像素随机着色"
        description: "每个像素独立随机选色，无连续段结构。取消分段概念，路径变为纯粹的颜色序列记忆任务。视觉上更嘈杂，但线性化逻辑不变。"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "渐变颜色序列"
        description: "路径颜色按遍历顺序形成有规律的渐变或重复模式（如 ABCABC...），解题者可利用颜色模式验证遍历方向是否正确。增加颜色与方向的关联推理。"
        source: creative
        source_task: null
        delta_lines: 12
      - name: "对称颜色段"
        description: "路径颜色段形成回文结构（如 红蓝绿蓝红），输出应为回文色列。解题者需注意从任一端遍历结果相同，但需通过对称性验证。"
        source: creative
        source_task: null
        delta_lines: 8
      - name: "仅双色交替"
        description: "路径只使用两种颜色交替出现（段长度不等），大幅减少颜色数但增加段边界识别的视觉难度。简化版本适合作为更易的变体。"
        source: inversion
        source_task: null
        delta_lines: 5

  - id: D5
    name: "输出网格形状"
    tag: grid_shape
    current: "tight crop 为 Nx1 单列（N = 路径像素数）"
    alternatives:
      - name: "保持原始网格尺寸输出"
        description: "输出与输入同尺寸的网格，拉直后的颜色列放置在网格左列或特定位置，其余为背景色。解题者需推断输出位置规则，而非仅提取序列。"
        source: inversion
        source_task: null
        delta_lines: 8
      - name: "输出为路径外接矩形区域"
        description: "输出裁剪为原始蛇形路径的外接矩形，路径保留原位但背景色改变（或非路径区域用特殊色填充），突出路径形状。结合 crop 思路但保留二维结构。"
        source: crop
        source_task: a251c730
        delta_lines: 10
      - name: "按颜色段分行输出"
        description: "输出为 KxM 网格，每行对应一个颜色段，行长为段长度，短行用背景填充。将一维序列重组为有结构的二维表，解题者需同时理解分段和布局。"
        source: packed_grid
        source_task: 58f5dbd5
        delta_lines: 18
      - name: "输出为环形排列"
        description: "将颜色序列排列成一个方形框架的边缘像素（顺时针），框架内部为背景。紧凑裁剪到最小方框。解题者需将线性序列映射到环形空间布局。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D6
    name: "路径遍历连通性"
    tag: transform
    current: "严格4-连通（上下左右），路径中无2x2色块"
    alternatives:
      - name: "8-连通遍历"
        description: "允许对角线邻接作为合法路径连接，路径可以有对角线段。遍历时需在8个方向中选择下一个像素，优先级规则更复杂，显著增加推理难度。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "混合连通性（主路径4-连通，分支8-连通）"
        description: "主干路径为4-连通，但在特定标记点处允许8-连通跳转到附近像素。解题者需区分两种连通规则的切换条件。"
        source: creative
        source_task: null
        delta_lines: 25
      - name: "跳跃式连通"
        description: "路径中包含间隔跳跃——某些像素之间相隔一格（中间为背景），但仍视为连续路径。解题者需识别'骑士跳'或'隔一格'的非标准邻接规则。"
        source: gap_filling
        source_task: 7b80bb43
        delta_lines: 20

  - id: D7
    name: "背景与干扰"
    tag: src
    current: "纯净背景，无干扰元素，所有非背景像素均属于蛇形路径"
    alternatives:
      - name: "添加孤立干扰像素"
        description: "网格中散布若干孤立的非背景像素（不与路径4-连通），解题者需先过滤掉这些干扰项再提取路径。增加预处理步骤的推理需求。"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "添加噪声色块"
        description: "网格中有小型（2-3像素）非路径连通色块作为干扰。解题者需基于连通分量大小或形状区分路径与噪声，类似 anomaly_detection 思路。"
        source: anomaly_detection
        source_task: b99e7126
        delta_lines: 18
      - name: "多条路径选择最长"
        description: "网格中有2-3条蛇形路径，仅最长的那条需要被线性化输出。解题者需先识别所有路径并比较长度，增加选择判断步骤。"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D8
    name: "多步处理与序列化"
    tag: meta
    current: "单步处理：直接找到路径并线性化输出"
    alternatives:
      - name: "先去噪再线性化"
        description: "第一步删除对角线方向的噪声像素（类似 7b80bb43 的 hint deletion），第二步对清理后的路径做线性化。引入多步流水线，每步有独立的规则。"
        source: multi_step
        source_task: 7b80bb43
        delta_lines: 20
      - name: "线性化后再重排序"
        description: "第一步线性化提取颜色序列，第二步按颜色值或段长度重新排序颜色段。最终输出是经过排序的色列，而非原始遍历顺序。解题者需理解两层变换的叠加。"
        source: multi_step
        source_task: null
        delta_lines: 18
      - name: "迭代收缩至线性"
        description: "输出不是一步到位的线性化，而是展示路径逐步'收缩'的过程——每一步将路径的一个弯角拉直，经过多轮迭代后变为直线。输出为最终收缩结果或中间某步。增加迭代推理的深度。"
        source: creative
        source_task: null
        delta_lines: 35
      - name: "路径分割后分别处理"
        description: "路径在特定颜色的像素处被切断，分成多段子路径。每段独立线性化后按规则（如切割点颜色的数值顺序）拼接输出。引入分段和排序的多步逻辑。"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D9
    name: "源-输出基数关系"
    tag: meta
    current: "1:1 — 一条路径产生一个色列输出"
    alternatives:
      - name: "many:1 — 多路径合并输出"
        description: "网格中有多条蛇形路径，将所有路径按特定顺序（如从上到下排列的端点顺序）串联后输出为一个色列。解题者需处理多对象发现和排序。"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "1:many — 一条路径拆分多个输出"
        description: "一条路径根据颜色段被拆分为多个独立色列，按列并排输出为一个多列矩阵。每列对应一个颜色段，短列用背景色填充。解题者需理解分段与空间映射的对应。"
        source: creative
        source_task: null
        delta_lines: 22
      - name: "1:1 但含条件过滤"
        description: "一条路径线性化后，仅保留满足特定条件的像素（如只保留出现次数最多的颜色，或只保留段长度>=3的段），其余用背景色替代或直接删除。引入过滤条件推理。"
        source: conditional_deletion
        source_task: 8b9c3697
        delta_lines: 15

  - id: D10
    name: "符号编码参数"
    tag: meta
    current: "无符号编码——路径结构和颜色直接可见，无需查表或解码"
    alternatives:
      - name: "图例指定遍历方向"
        description: "网格角落放置一个小型图例（如2x1色块），图例中两种颜色的排列方向（左右=水平遍历，上下=垂直遍历）指示输出应为行还是列。引入符号解码前置步骤。"
        source: symbol_instructions
        source_task: dbff022c
        delta_lines: 15
      - name: "颜色映射表重新着色输出"
        description: "网格边缘放置颜色对照表（如 2xK 的映射条），线性化后的颜色需通过查表转换为新颜色再输出。类似 palette legend 解码。"
        source: symbol_instructions
        source_task: 9385bd28
        delta_lines: 20
      - name: "标记像素编码段分割点"
        description: "路径上某些像素用特殊颜色标记为分割点，这些标记在输出中被移除但指示了分段边界。解题者需识别标记颜色的特殊语义。"
        source: symbol_instructions
        source_task: null
        delta_lines: 18
