task_id: 5961cc34
task_type: move_along_path
summary: "从底部起始标记向上发射射线，命中蓝色色块后激活并沿其绿色端口方向发射粗射线，BFS 级联直到无新命中，所有激活色块和射线涂为红色"

dimensions:
  - id: D1
    name: "射线传播方向"
    tag: path
    current: "起始射线固定向上（垂直），后续射线沿色块端口方向（上/下/左/右四个基本方向）直线传播"
    alternatives:
      - name: "对角线射线传播"
        description: "射线沿45度对角线方向传播而非仅限基本方向，端口方向扩展为8方向。解题者需要识别对角线传播规则并追踪斜向路径，推理难度显著增加"
        source: diagonal_ray
        source_task: 142ca369
        delta_lines: 40
      - name: "反射射线"
        description: "射线遇到网格边界时发生反射继续传播（如光线反射），直到命中色块或能量耗尽。解题者需推理反射路径，增加空间推理复杂度"
        source: reflection
        source_task: 142ca369
        delta_lines: 35
      - name: "螺旋射线"
        description: "射线遇到边界时顺时针转90度继续前进，形成螺旋路径。解题者需追踪多次转弯的复杂路径"
        source: spiral_path
        source_task: da515329
        delta_lines: 30
      - name: "最短路径传播"
        description: "射线不再直线传播，而是沿最短曼哈顿路径绕过障碍到达下一个色块。路径涂红。解题者需要推断寻路逻辑"
        source: shortest_path
        source_task: 7b0280bc
        delta_lines: 50

  - id: D2
    name: "级联激活机制"
    tag: path
    current: "BFS 级联：命中色块后立即激活并发射新射线，所有被间接命中的色块也被激活，直到无新命中"
    alternatives:
      - name: "DFS 深度优先激活"
        description: "改为 DFS 激活：每次只沿最新激活的色块继续传播，直到链路终止后回溯。与 BFS 在多端口色块场景下产生不同激活顺序，若有重叠区域会导致不同结果"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "单步无级联"
        description: "射线只能激活直接命中的第一个色块，不产生后续级联。解题者需判断哪些色块被直接射线覆盖，推理更直接但需精确空间判断"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "距离衰减激活"
        description: "射线传播有最大距离限制（由起始段高度编码），超出距离后射线消失。解题者需从起始标记推断传播距离约束"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 25
      - name: "条件激活"
        description: "色块只有在射线从特定方向命中时才激活（如必须从端口对面进入）。其他方向的射线穿过色块但不激活它。增加方向判断的推理"
        source: creative
        source_task: null
        delta_lines: 20

  - id: D3
    name: "射线宽度规则"
    tag: path
    current: "起始射线宽度为1像素；后续射线宽度等于端口绿色像素数（1或2像素），即端口条的长度决定射线粗细"
    alternatives:
      - name: "宽度累加"
        description: "每经过一次级联，射线宽度+1。第一次发射宽度1，第二次宽度2，依此类推。解题者需发现宽度递增模式"
        source: creative
        source_task: null
        delta_lines: 20
      - name: "统一单像素射线"
        description: "所有射线宽度固定为1像素，端口绿色像素数仅指示方向不影响宽度。简化视觉模式但改变匹配逻辑"
        source: inversion
        source_task: null
        delta_lines: 10
      - name: "宽度由色块大小决定"
        description: "射线宽度等于色块在垂直于射线方向上的边缘像素行数（如3x4色块向右发射宽度3的射线）。解题者需从色块形状推断射线粗细"
        source: creative
        source_task: null
        delta_lines: 25

  - id: D4
    name: "起始标记结构"
    tag: src
    current: "网格底部有一根高度2-3的红色垂直段，顶部有一个黄色像素作为帽盖，从黄色像素向上发射起始射线"
    alternatives:
      - name: "边缘控制像素"
        description: "起始标记改为网格边缘上的单个彩色控制像素（如红色像素在左边缘），射线从该像素沿垂直于边缘的方向发射。起始位置不再固定在底部"
        source: control_pixels
        source_task: 4a21e3da
        delta_lines: 25
      - name: "多起始点"
        description: "网格中有多个起始标记（2-3个），每个独立发射射线并产生各自的级联。激活区域可能重叠。解题者需处理多源并行传播"
        source: creative
        source_task: null
        delta_lines: 30
      - name: "形状指示方向的起始标记"
        description: "起始标记改为箭头形或楔形小精灵，其凸出部分指示初始射线方向（不限于向上）。解题者需从形状推断方向"
        source: direction_from_shape
        source_task: 3dc255db
        delta_lines: 30
      - name: "起始段高度编码参数"
        description: "起始红色段的高度不仅是视觉装饰，还编码级联的最大深度（高度2=最多激活2个色块，高度3=最多3个）。解题者需发现高度与激活数的对应关系"
        source: creative
        source_task: null
        delta_lines: 15

  - id: D5
    name: "色块端口结构"
    tag: src
    current: "每个色块恰好一条边有1-2个相邻绿色像素作为端口，端口方向决定射线发射方向"
    alternatives:
      - name: "多端口色块"
        description: "色块可以有2-3个不同方向的端口，每个端口都发射射线。级联网络变为树状而非线性链。解题者需处理分支传播"
        source: creative
        source_task: null
        delta_lines: 15
      - name: "端口颜色编码射线颜色"
        description: "端口像素使用不同颜色（绿、黄、橙等），射线颜色与端口颜色对应而非统一红色。解题者需识别颜色映射关系"
        source: color_pairing
        source_task: 16de56c4
        delta_lines: 20
      - name: "隐式端口"
        description: "去掉显式绿色端口标记，射线从色块的最窄边（钻石尖端）发射。解题者需从色块形状推断发射方向，增加几何推理"
        source: inversion
        source_task: null
        delta_lines: 30

  - id: D6
    name: "色块停止条件与终点"
    tag: dst
    current: "射线遇到色块时停止并激活该色块；若未遇到色块则延伸到网格边界"
    alternatives:
      - name: "穿透激活"
        description: "射线穿过色块后继续传播（不停止），可以在一条射线上激活多个色块。改变了链式逻辑为线性扫描"
        source: inversion
        source_task: null
        delta_lines: 15
      - name: "碰撞停止并标记"
        description: "射线遇到色块边缘时停止，但不完全激活色块——只将命中的那一面边缘像素变红。完整激活需要色块被两条不同射线命中"
        source: collision_detection
        source_task: 409aa875
        delta_lines: 30
      - name: "距离编码停止"
        description: "射线传播固定距离后停止（距离由起始段高度或色块大小编码），无论是否命中色块。解题者需推断距离参数"
        source: distance_encoding
        source_task: 271d71e2
        delta_lines: 20
      - name: "射线到达目标线停止"
        description: "网格中有一条特殊颜色的横线或竖线作为终止线，射线到达终止线即停止。解题者需识别终止线的角色"
        source: line_fill
        source_task: 16de56c4
        delta_lines: 20

