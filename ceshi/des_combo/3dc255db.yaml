    description: "弹射路径改为45度对角线，且路径上存在障碍像素（其他颜色），射线遇障碍即停止。solver需沿对角方向逐格检测障碍物，未放完的内容像素被丢弃。"
    existing_code:
      - "D1/0"
      - "D4/0"
    reason: "对角路径判断和障碍检测协同增加了空间推理复杂度，solver必须同时处理非正交方向和碰撞检测。"

