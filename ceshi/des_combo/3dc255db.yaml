combos:
  - index: 1
    combo_spec: "D1/0+D2/0"
    name: "对角弹射+颜色编码方向"
    description: "杯形框架的弹射方向不再由形状推断，而由杯内内容像素的颜色决定（如红=左上、蓝=右下等），且弹射路径改为45度对角线而非正交方向。solver需先从示例推断颜色->对角方向映射，再沿对角线绘制弹射线，同时擦除杯内内容。"
    existing_code:
      - "D1/0"
      - "D2/0"
    reason: "方向判断机制（颜色解码）和路径类型（对角线）协同改变了推理链的两个核心步骤，且两者在视觉上可清晰区分。"

  - index: 2
