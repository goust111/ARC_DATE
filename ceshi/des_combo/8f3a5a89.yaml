task_id: "8f3a5a89"
combos:
  - index: 1
    combo_spec: "D1/1+D2/0"
    name: "重力水流+外边界涂色"
    description: "标记像素作为水源，水受重力影响只向下和左右流动（不向上），被墙壁阻挡。可达区域为水能到达的所有位置。然后在不可达区域中紧邻可达区域的像素上涂橙色，形成外边界环（而非内边界）。解题者需要先推理重力约束下的可达区域形状，再在可达区域的外侧（不可达侧）涂色。两个维度交互改变了推理链的两个关键步骤：洪填方式和涂色方向。"
    existing_code:
      - "D2/0"
    reason: "重力流改变可达区域形状（上方区域不可达），外边界涂色改变涂色侧。两者结合使得解题者既要理解方向性洪填又要理解反向涂色，推理链与原始任务有本质差异。视觉效果上，重力产生的不对称可达区域+外侧涂色，与原始任务完全不同。"

  - index: 2
    combo_spec: "D3/2+D14/2"
    name: "多源洪填+标记同色边界"
    description: "网格中放置2-3个不同颜色的标记像素，分别在不同角落或边缘。每个标记独立进行洪填，各自的可达区域独立计算内边界。每个标记的边界使用该标记自身的颜色（而非统一的橙色）。重叠的可达区域按首达优先处理。解题者需要识别多个源点、分别洪填、并用对应颜色涂各自的边界。"
    existing_code:
      - "D3/2"
    reason: "多源+颜色关联形成强交互：解题者必须同时跟踪多个洪填区域并正确关联颜色，这是原始任务（单源、单色）不具备的推理维度。视觉上呈现多色边界环的效果。"

  - index: 3
    combo_spec: "D5/2+D6/1+D14/1"
    name: "多色墙壁识别+装饰变色+按墙色涂边界"
    description: "结构墙使用多种颜色（如蓝色和红色），装饰墙使用另一种颜色。结构墙/装饰墙按颜色直接区分。不可达侧的装饰墙变色为灰色（而非擦除）。边界涂色取决于最近的结构墙颜色——蓝墙旁涂橙色，红墙旁涂绿色。解题者需要建立颜色映射链：墙壁颜色->结构/装饰分类->装饰变色+对应颜色的边界涂色。"
    existing_code:
      - "D5/2"
      - "D6/1"
      - "D14/1"
    reason: "三个维度围绕'颜色'形成统一的交互主题：墙壁颜色决定身份（D5/2）、装饰颜色变化（D6/1）、边界颜色由墙壁颜色决定（D14/1）。整条推理链从'位置判断'转变为'颜色链判断'，根本性地改变了解题策略。"

  - index: 4
    combo_spec: "D4/2+D10/1"
    name: "距离限制洪填+迭代渐变"
    description: "洪填不是无限扩展，而是限制在距标记像素曼哈顿距离N以内（N由网格中某种特征编码，如某颜色像素的数量）。同时洪填分多步迭代——每步扩展1像素距离，每步新增像素涂不同颜色，形成从标记向外的彩色等高线。距离N之外的区域即使无墙壁阻挡也不涂色。输出呈现有限半径内的彩色距离场效果。"
    existing_code:
      - "D10/1"
    reason: "距离限制（D4/2）和迭代渐变（D10/1）围绕'距离'概念形成强交互：距离既是洪填的终止条件又是涂色的依据。解题者需要同时推断距离上限N和距离-颜色映射，两步推理紧密耦合。"

  - index: 5
    combo_spec: "D1/0+D4/1"
    name: "射线扫描+目标像素碰撞"
    description: "从标记像素向四个方向发射射线，射线被墙壁阻挡。同时网格中存在特定颜色的目标像素，射线到达目标像素时标记该位置但不穿过，目标像素在输出中保留原色。可达区域为射线扫过的所有像素的并集。在可达区域的内边界涂橙色。解题者需要理解射线-墙壁和射线-目标两种不同的阻挡机制。"
    existing_code:
      - "D1/0"
      - "D4/1"
    reason: "射线扫描（方向性传播）与目标像素碰撞（异类障碍）形成交互：射线可能在到达墙壁之前被目标像素截停，产生与纯射线或纯洪填都不同的可达区域形状。两种阻挡源的区分增加了推理层次。"

  - index: 6
    combo_spec: "D7/3+D9/0+D11/0"
    name: "单个闭合框架+裁剪输出"
    description: "整个网格只有一个结构墙连通分量，且该墙壁形成一个近乎闭合的矩形框架（仅有一个开口供洪填从标记处进入）。可达区域为框架内部。输出仅保留包含可达区域的最小外接矩形，去掉完全不可达的行/列。解题者需要识别框架和开口、确定内部区域、涂内边界、然后裁剪到正确尺寸。"
    existing_code:
      - "D9/0"
    reason: "闭合框架（D7/3）定义了清晰的'房间'概念，单个结构墙（D11/0）简化了识别，裁剪输出（D9/0）增加了输出维度的推理。三者形成'进入房间->涂边界->裁剪'的连贯推理链，与原始任务的'开放区域->识别多墙->同尺寸输出'完全不同。"

  - index: 7
    combo_spec: "D2/2+D13/2"
    name: "双层边界+浮动内环"
    description: "在可达区域的内边界涂橙色（距边界恰好2像素的那一圈，而非紧邻边界的那圈），同时在不可达区域的外边界涂绿色（紧邻可达区域的那圈）。输出呈现'绿色外环-1像素间隔-橙色浮动内环'的双层效果。解题者需要计算距离并区分两种涂色逻辑。"
    existing_code:
      - "D2/2"
      - "D13/2"
    reason: "双层边界和距离>=2涂色交互产生独特的'分离双环'效果：外环紧贴边界，内环与边界间隔1像素，视觉上完全不同于任何单维度变体。解题者需要同时掌握方向（内/外）和距离（0/2）两个维度。"

  - index: 8
    combo_spec: "D3/0+D5/3+D8/0"
    name: "任意角落标记+反向结构墙+8-连通洪填"
    description: "标记像素可在四个角落中的任意一个。洪填使用8-连通（包括对角线渗透）。结构墙的定义反转：不触碰网格边缘的墙色连通分量才是真正的障碍物，触碰边缘的是装饰。8-连通洪填意味着墙壁对角线缝隙可被穿透，且浮动墙壁（不触碰边缘）作为障碍，解题者需要从示例中推断出反直觉的墙壁分类规则+对角线渗透行为。"
    existing_code:
      - "D3/0"
      - "D8/0"
    reason: "三个维度形成强三方交互：标记位置不确定（D3/0）增加定位难度；反向墙壁定义（D5/3）颠覆识别逻辑；8-连通（D8/0）改变渗透规则。特别是D5/3+D8/0的交互——浮动墙壁在8-连通下更难完全封堵，解题者必须理解对角线封堵需求。"

  - index: 9
    combo_spec: "D1/2+D11/2"
    name: "通道宽度约束洪填+迷宫墙壁"
    description: "结构墙互相连接形成简单迷宫。洪填时只能通过宽度>=2像素的通道——迷宫中窄于2像素的缝隙视为不可通行。可达区域为从标记出发通过所有宽度>=2的通道能到达的区域，涂内边界。解题者需要评估迷宫中每条通道的宽度来确定可达性，再沿可达区域内壁涂色。"
    existing_code:
      - "D1/2"
    reason: "通道宽度约束（D1/2）与迷宫布局（D11/2）产生强交互：迷宫中天然存在不同宽度的通道，宽度约束使得某些在普通洪填下可达的迷宫分支变为不可达。这种'有条件的连通性'判断在单一维度下不会出现，是纯组合层的创新。"

  - index: 10
