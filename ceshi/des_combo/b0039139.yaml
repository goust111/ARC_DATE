task_id: "b0039139"
combos:
  - index: 1
    combo_spec: "D1/2+D4/1"
    name: "交替着色棋盘网格"
    description: "将副本排列从一维线性改为二维网格(D4/1)，同时奇偶副本交替使用前景/背景色板(D1/2)。在二维布局中交替着色会形成棋盘格状的颜色分布模式，解题者需要同时推断二维因数分解规则和二维位置相关的交替着色规则，这比一维交替或单纯二维平铺都更复杂。"
    existing_code:
      - "D1/2"
      - "D4/0"
    reason: "强交互：一维交替仅产生ABAB序列，但二维网格中行列位置共同决定奇偶性，形成棋盘式着色，推理模式质变。"

  - index: 2
    combo_spec: "D2/2+D4/2"
    name: "旋转模板决定平铺方向"
    description: "模板先旋转90度(D2/2)再平铺，而平铺方向不再由分隔线决定，而是由旋转后模板的宽高比决定(D4/2)。旋转改变了模板的宽高比，从而直接影响平铺方向的判定。解题者需要先识别旋转变换，再根据旋转后的几何属性推断平铺方向。"
    existing_code:
      - "D2/2"
      - "D4/2"
    reason: "强交互：旋转直接改变宽高比，而宽高比又决定平铺方向。两个变换之间存在因果链条，不能独立推理。"

  - index: 3
    combo_spec: "D1/0+D2/0"
    name: "双重反转：负空间加颜色互换"
    description: "模板形状由负空间(背景像素)定义(D2/0)，同时前景/背景色板映射互换(D1/0)。两次反转可能部分抵消也可能叠加——负空间反转了形状定义，颜色互换反转了着色映射。解题者需要追踪两层反转的净效果。"
    existing_code:
      - "D1/0"
      - "D2/0"
    reason: "强交互：两层反转叠加，解题者必须同时追踪形状和颜色两条反转链，理解最终输出是否与原始任务等价或产生不同结果。"

  - index: 4
    combo_spec: "D1/1+D2/2"
    name: "旋转模板的三色边缘着色"
    description: "模板先旋转90度(D2/2)，再用三色方案着色(D1/1)：边缘像素(与背景相邻的模板像素)用区段3颜色，内部像素用区段4颜色，背景保持黑色。旋转改变了哪些像素处于边缘位置，因此边缘检测结果随旋转变化。"
    existing_code:
      - "D1/1"
      - "D2/2"
    reason: "强交互：旋转改变像素的邻接关系，直接影响边缘/内部像素的分类结果，同一模板旋转前后边缘图案不同。"

  - index: 5
    combo_spec: "D3/1+D7/2"
    name: "多色计数板：颜色种类数决定副本数且各色决定副本前景"
    description: "计数板中使用多种非背景颜色(D7/2前提)，副本数等于不同颜色的种类数(D3/1)，每个副本的前景色由对应连通分量的颜色决定(D7/2)。解题者需要识别颜色种类计数规则并建立颜色到副本的映射。"
    existing_code:
      - "D3/1"
      - "D7/2"
    reason: "强交互：D3/1改变计数规则为颜色种类数，D7/2让每种颜色决定对应副本的前景色。两者共同构成完整的颜色-副本映射管线。"

  - index: 6
    combo_spec: "D4/1+D7/0"
