    description: "模板由负空间(背景像素)定义形状(D2/0)，然后对该负空间形状执行凸包填充(D8/2)。负空间形状通常是非凸的(因为前景像素在其中形成'洞')，凸包填充会填满这些洞，产生与原始形状截然不同的结果。"
