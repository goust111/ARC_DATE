    description: "副本排列为二维网格(D4/1)，且计数板中连通分量的空间位置(从左到右、从上到下排序)决定副本在网格中的对应位置(D7/0)。解题者需要将计数板的二维分量布局映射到输出的二维副本布局。"
    existing_code:
      - "D4/0"
    reason: "强交互：一维平铺时分量顺序只是线性排列，但二维网格中分量的行列位置直接映射到输出布局的行列，产生空间对应关系。"

  - index: 7
