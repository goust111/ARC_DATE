    description: "副本以镜像交替方式排列(D4/3)，且无分隔带(D5/0)。相邻副本左右(或上下)镜像后紧密拼接，边缘像素直接对齐，可能形成视觉上连续的对称图案。解题者需识别镜像+拼接的复合规律。"
    existing_code:
