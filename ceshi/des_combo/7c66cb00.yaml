task_id: "7c66cb00"
combos:
  - index: 1
    combo_spec: "D2/0+D3/0+D6/2"
    name: "三色精灵少数色匹配与外层消失"
    description: "精灵有三种颜色（外/中/内层）。少数色（最内层）用于匹配条的填充色。变换时外层色消失（变为bg），中层色变为条边框色，内层色变为条填充色。三色结构使得颜色映射链条变长，推理者需要发现最少色匹配+逐层剥离规则。"
    existing_code:
      - "D3/0"
      - "D6/2"
    reason: "D2/0(少数色匹配)与D3/0(三色精灵)和D6/2(外层变换内层消失)形成完整的三层颜色处理链路。三色精灵使少数色匹配变得非平凡，外层消失让变换输出仅保留两色。"

  - index: 2
    combo_spec: "D1/0+D3/4+D11/1"
    name: "分离双组件形状匹配与双组件独立对接"
    description: "精灵由两个空间分离的色块组成（组件A+组件B）。配对时不看颜色，而是看组件A的形状是否能嵌入条的某个缺口区域（形状匹配）。两个组件各自独立对接到不同的条：外层色组件到其匹配条，内层色组件到内层色对应条。"
    existing_code:
      - "D1/0"
      - "D3/4"
    reason: "分离双组件+形状匹配+双组件独立对接三者耦合产生新推理模式：推理者需(1)识别分离组件属于同一精灵，(2)用形状而非颜色配对，(3)理解两组件分别去不同目标。"

  - index: 3
    combo_spec: "D4/0+D7/0+D16/0"
    name: "垂直条顶部对齐与水平滑动"
    description: "条从水平变为垂直（沿左侧或右侧排列），精灵从右侧区域检测。精灵顶部对齐到条的顶部，x方向水平滑动到条的右边框旁。整个空间布局从上精灵下条旋转为右精灵左条，对齐和滑动语义随之旋转90度。"
    existing_code:
      - "D4/0"
      - "D16/0"
    reason: "垂直条从根本上改变空间语义，顶部对齐变为左侧对齐，水平滑动变为垂直滑动。三个维度单独看各自简单，但组合后需要推理者理解整个坐标系的旋转。"

  - index: 4
    combo_spec: "D1/3+D8/2+D9/2"
    name: "含干扰精灵的选择性擦除与面积排序匹配"
    description: "顶部区域有比条数更多的精灵，其中部分是干扰项（不匹配任何条）。配对规则改为按面积从大到小排序精灵，按条从上到下排序条，序号对应即匹配。变换后仅擦除已成功匹配的精灵，干扰精灵保留在原位。"
    existing_code:
      - "D1/3"
      - "D9/2"
    reason: "干扰精灵+面积排序+选择性擦除三者创造新推理链：推理者需(1)发现不是所有精灵都被使用，(2)发现面积排序而非颜色匹配，(3)注意到未匹配的精灵保留。"

  - index: 5
    combo_spec: "D1/2+D2/2+D13/0"
    name: "双颜色联合匹配与填充色重复消歧"
    description: "多个条可能有相同填充色，此时精灵仅靠外层色无法唯一匹配。改用双颜色联合匹配：精灵的(外层色,内层色)对必须同时匹配条的(填充色,边框色)对。边缘颜色匹配用于验证：精灵边缘像素色须与条填充色一致。"
    existing_code:
      - "D1/2"
      - "D13/0"
    reason: "填充色重复迫使匹配从单色升级为双色元组，D13与D2/D1的核心交互。组合后才产生必须用双色联合匹配才能消歧的推理需求。"

  - index: 6
