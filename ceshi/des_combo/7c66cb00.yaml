    description: "条的高度（行数）编码变换模式：偶数高度的条执行颜色交换，奇数高度的条保持颜色不变。精灵按从上到下顺序处理，每次处理一个。推理者需先解码高度→交换规则映射，再按序应用。"
    existing_code:
