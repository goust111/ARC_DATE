    existing_code:
      - "D2/1"
      - "D4/2"
    reason: "强交互——异常检测方式（镜像识别）与输出变换（差异提取）深度耦合，推理链从'找不同→复制'变为'找镜像→比较→差异提取'，显著增加推理步骤数。镜像差异在视觉上有对称结构，人类可从样例推断。"

