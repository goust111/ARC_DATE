    description: "框架凹槽为T形或十字形(有2-4个分支)。工具上有标记像素(小色点)，标记数量等于凹槽分支数。配对规则：工具标记数=凹槽分支数决定匹配。对接方式不变：plug填凹槽，handle突出。"
    existing_code:
      - "D1/2"
      - "D5/2"
    reason: "T形凹槽的分支数成为匹配信号(而非面积)，凹槽形状变化直接影响匹配策略，两个维度缺一不可——矩形凹槽无分支数可数，洞数匹配无T形凹槽无意义。"

  - index: 6
