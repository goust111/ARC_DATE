    description: "工具到其匹配框架的Manhattan距离编码旋转信息：距离d mod 4 = 旋转的90度倍数。旋转次数奇偶性决定颜色交换。solver需：(1)测量距离→(2)计算旋转角度→(3)按角度旋转匹配凹槽→(4)按奇偶决定颜色。"
