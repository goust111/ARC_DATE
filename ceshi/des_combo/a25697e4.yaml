task_id: "a25697e4"
combos:
  - index: 1
    combo_spec: "D1/0+D13/0"
    name: "颜色配对角色互换"
    description: "工具有两色(plug+handle)，框架有凹槽。配对规则：plug颜色与框架颜色匹配决定配对关系(而非形状匹配)。对接规则：handle区域(而非plug)填充凹槽，plug区域向外突出。即角色互换——颜色决定谁配谁，handle面积等于凹槽面积。翻转+不等面积时仍交换两色。原位工具移除。"
    existing_code:
      - "D1/0"
      - "D13/0"
    reason: "同时改变匹配策略(形状→颜色)和角色分配(plug→handle填凹槽)，推理链发生质变：solver需先按颜色找配对，再用handle而非plug做形状匹配，两个变化深度耦合。"

  - index: 2
    combo_spec: "D1/0+D3/0"
    name: "颜色匹配三色工具"
    description: "工具由三种颜色组成(plug色、handle色、铰链色)。框架有凹槽。配对规则：plug颜色与框架颜色相同的工具匹配该框架。三色中哪个是plug需通过颜色匹配判断——与框架同色的区域即为plug。plug填凹槽，handle突出，铰链色像素保留原色。翻转+不等面积时交换plug和handle颜色(铰链色不变)。"
    existing_code:
      - "D1/0"
      - "D3/0"
    reason: "三色工具中角色不再由拓扑唯一确定(三块都可能是plug)，必须通过颜色匹配框架来确定角色，两个维度形成必要的信息闭环。"

  - index: 3
    combo_spec: "D2/0+D6/2"
    name: "纯旋转奇偶变色"
    description: "禁止翻转，仅允许0/90/180/270度旋转。旋转次数(0-3)的奇偶性决定是否交换两色：奇数次旋转(90/270)交换plug和handle颜色，偶数次(0/180)保持原色。配对和形状匹配仍按原规则。solver需同时搜索旋转角度使形状匹配凹槽，并根据最终旋转次数确定颜色。"
    existing_code:
      - "D2/0"
      - "D6/2"
    reason: "旋转范围限制与颜色变换条件深度耦合——旋转次数既影响几何匹配又影响颜色输出，solver必须同时考虑两者而非独立求解。"

  - index: 4
    combo_spec: "D2/3+D6/2"
    name: "标记编码旋转奇偶变色"
    description: "框架角落有1-3个彩色标记像素，数值表示所需旋转的90度倍数。旋转次数的奇偶性决定颜色交换：奇数次交换两色，偶数次不交换。solver需先读取标记像素计数确定旋转角度，再按该角度旋转工具匹配凹槽，最后根据奇偶性决定颜色。"
    existing_code:
      - "D2/3"
      - "D6/2"
    reason: "标记→旋转→颜色形成三级推导链：标记编码旋转量(D2/3)，旋转量的奇偶性编码颜色变换(D6/2)，两条规则串联产生一次不可分解的推理。"

