task_id: "78332cb0"
combos:
  - index: 1
    combo_spec: "D1/0+D3/1"
    name: "多色精灵形状嵌合匹配"
    description: "每个块包含两种前景色，块的边缘形状为凸凹互补（拼图齿式嵌合）。匹配时只考虑特定颜色的像素轮廓是否互补嵌合。解题者需先识别每块中哪种颜色参与嵌合匹配，再判断凸凹互补关系确定链序。"
    existing_code:
      - "D1/0"
      - "D3/1"
    reason: "颜色筛选与空间嵌合深度交互，产生新推理模式。D1从点重合改为形状嵌合，D3从单色改为双色，组合后必须同时进行颜色筛选和空间嵌合推理。"

  - index: 2
    combo_spec: "D1/2+D5/2"
    name: "旋转匹配与累积旋转输出"
    description: "块需要旋转或翻转后才能使边缘对齐匹配。同时，输出中第k个块额外顺时针旋转90*k度。解题者必须分两层推理：先找出匹配所需的预旋转，再叠加链序位置的累积旋转。"
    existing_code:
      - "D1/2"
      - "D5/2"
    reason: "两层旋转深度交互——匹配旋转决定链序，链序决定累积旋转。推理链变为"尝试旋转匹配→确定位置→叠加位置旋转"，与任何单变体完全不同。"

  - index: 3
    combo_spec: "D3/2+D12/1"
    name: "视觉伪装与噪声干扰"
    description: "每个块含少量干扰色像素（不参与匹配），同时背景色故意与某个块的前景色相同使该块难以辨认。解题者需要先透过背景伪装定位所有块，再过滤干扰像素后进行边缘匹配。"
    existing_code:
      - "D3/2"
    reason: "干扰像素增加匹配层面的噪声，背景伪装增加块提取层面的难度，两者组合后形成"提取困难+匹配困难"的双层挑战。"

  - index: 4
    combo_spec: "D4/1+D5/1"
    name: "无缝拼接边缘消融"
    description: "输出中去掉分隔线，块直接相邻放置。同时，相邻块共享的边缘像素被擦除变为背景色。输出呈现为连续图案，只保留外露边缘的前景。解题者需要预判拼接后哪些像素消失。"
    existing_code:
      - "D4/1"
      - "D5/1"
    reason: "无分隔线使拼接处视觉连续，边缘擦除使拼接处产生"断裂"效果。组合后输出的视觉形态与原始任何单变体截然不同。"

  - index: 5
    combo_spec: "D6/0+D7/0"
    name: "大网格散布五块拼链"
    description: "5个5x5块随机散布在较大背景网格中（无分隔线），解题者需要先在大网格中定位5个块，提取后进行边缘匹配构建5块链。搜索空间从24/6增至120种排列。"
    existing_code:
      - "D6/0"
    reason: "散布布局让块提取变难，5块让排列搜索空间暴增（5!=120），两者交互使任务在提取和排列两个阶段都显著增难。"

  - index: 6
    combo_spec: "D5/0+D14/1"
    name: "颜色重映射与位置编码"
    description: "块的颜色按链序递增（颜色值小→大对应链首→链尾），输出时每个块按链序位置重新着色为预定义颜色序列。解题者需利用输入颜色大小关系推断链序，再映射到输出颜色。"
    existing_code:
      - "D5/0"
    reason: "D14/1提供颜色→链序的线索，D5/0定义链序→输出颜色的映射。组合后颜色既是排序线索又是变换目标，形成"读取颜色序→推链序→重新着色"的复合推理链。"

  - index: 7
    combo_spec: "D2/1+D10/0"
    name: "双标记符号解码"
    description: "输入网格中有两种标记像素：一种指示链方向（水平或垂直），另一种标记链首和链尾块。解题者需要先解码方向标记确定链方向，再通过端点标记识别起终点，最后用边缘匹配填充中间顺序。"
    existing_code:
      - "D2/1"
      - "D10/1"
    reason: "两种标记形成符号解码层，推理流程从"纯空间匹配"变为"符号解读→定向→端点锚定→中间匹配"，推理链显著延长且类型改变。"

  - index: 8
    combo_spec: "D1/3+D18/2"
    name: "计数匹配与渐进偏移"
    description: "匹配条件改为相邻边缘的前景像素数量相等（而非位置重合）。同时，链中从前到后的接触偏移位置必须单调递增（如偏移1→2→3）。解题者需要同时用计数匹配确定哪些块可相邻，用递增偏移确定唯一链序。"
    existing_code: []
    reason: "计数匹配本身可能产生多个合法排列，渐进偏移提供额外排序约束来保证唯一性。从空间对齐变为"计数+排序"的全新推理模式。"

  - index: 9
    combo_spec: "D3/1+D5/0+D14/0"
    name: "多色独色精灵链序重染"
    description: "每个块含两种前景色且每块颜色组合唯一。按边缘匹配排成链后，每块的两种颜色都按链序位置重新映射（如第k块的主色→颜色k，副色→颜色k+N）。解题者需区分主副色、推断链序、理解颜色映射三步推理。"
    existing_code:
      - "D3/1"
      - "D5/0"
    reason: "三维组合创造了"颜色识别→匹配→重映射"的三步推理链，每步都比原始任务更复杂。多色增加视觉复杂度，唯一颜色增加标识信息，重着色增加输出变换。"

  - index: 10
    combo_spec: "D6/0+D8/2"
    name: "无标记散布块提取"
    description: "块散布在大背景网格中，且没有任何分隔线标记。解题者需要纯粹通过前景像素的空间聚类来识别和提取各个5x5块，然后进行边缘匹配排链。"
    existing_code:
      - "D6/0"
    reason: "D6/0已经移除了规则布局，D8/2进一步移除了分隔线标记。组合后块提取从"按分隔线切割"变为"无监督空间聚类"，本质改变了任务的第一步推理。"

  - index: 11
    combo_spec: "D7/0+D10/0+D11/1"
    name: "多线索五块排序"
    description: "5个块需要排成链。垂直边缘的像素数量编码了块在链中的序号（第k块有k个垂直边缘像素），端点块有特殊标记色标识。解题者可以利用垂直边缘计数和端点标记两种冗余线索辅助排序，但5块的搜索空间增大了基础难度。"
    existing_code:
      - "D10/1"
    reason: "垂直边缘编码和端点标记提供了互补的排序线索，5块增大搜索空间使这些线索从"冗余"变为"必要"。三者交互创造了"多线索融合推理"的新模式。"

  - index: 12
    combo_spec: "D4/1+D13/0"
    name: "迭代无缝拼接"
    description: "块不一次性排列，而是迭代拼接：每步找到能连接的一对块无缝合并（不加分隔线），合并结果作为新块继续匹配，直到所有块连成一体。输出展示最终无缝拼接结果。"
    existing_code:
      - "D4/1"
    reason: "迭代过程中每次合并都改变块的尺寸和边缘，紧密拼接使合并结果的边缘信息发生实质变化，两者交互产生"动态边缘匹配"的新推理模式。"

  - index: 13
    combo_spec: "D1/1+D17/1"
    name: "图例驱动颜色边缘匹配"
    description: "每个块的边缘像素有不同颜色，匹配条件由输入角落的图例定义（如图例中红-蓝对表示红色边缘像素与蓝色边缘像素匹配）。解题者需先解读图例获取颜色匹配规则，再按规则检查边缘颜色序列。"
    existing_code:
      - "D17/1"
    reason: "D1/1改变匹配为颜色序列匹配，D17/1用图例定义匹配规则。组合后匹配规则不再固定而是由图例动态指定，每道题的匹配规则不同，解题者必须先解码图例。这是"元规则推理"的创新模式。"

  - index: 14
    combo_spec: "D5/3+D9/0"
    name: "双点连接颜色互换"
    description: "连接边缘要求恰好2个前景像素在相同偏移处重合（更严格的匹配）。同时链中每对相邻块交换各自的前景色。解题者需要先用双点匹配确定邻接关系，再推断颜色互换模式。"
    existing_code:
      - "D5/3"
    reason: "双点连接使匹配更精确但搜索更难，颜色互换使输出颜色依赖于邻接关系。两者交互：必须先确定精确邻接才能确定颜色变换，颜色变换反过来验证邻接正确性。"

  - index: 15
    combo_spec: "D1/2+D4/2+D16/0"
    name: "旋转环形反向输出"
    description: "块允许旋转/翻转后进行边缘匹配，且必须形成闭合环（首尾块也要匹配）。输出方向与链方向相反，块排成环形展开的条带。解题者需要找到旋转方案使所有块（含首尾）边缘对齐，再反向输出。"
    existing_code:
      - "D1/2"
      - "D16/0"
    reason: "环形闭合要求首尾也匹配，大幅增加约束；旋转自由度增加搜索空间；方向取反增加输出层推理。三者交互创造高难度但仍可解的变体。"

  - index: 16
    combo_spec: "D1/4+D15/2"
    name: "互补齿合含洞精灵"
    description: "精灵内部可含空心洞（环形、U形），边缘匹配改为互补模式（一边有像素的位置另一边必须没有）。洞的存在改变了边缘像素分布，互补匹配需要精确判断每个边缘位置的有无。"
    existing_code: []
    reason: "含洞精灵的边缘像素分布更不规则，互补匹配要求精确判断每个位置，两者交互使空间推理更具挑战。每个维度单独时较简单，但组合后需要同时处理复杂形状和互补逻辑。"
