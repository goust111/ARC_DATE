      - "D1/1"
      - "D8/0"
    reason: "分割线形状直接决定匹配条件，两维度在拼合步骤深度耦合。凹凸匹配是经典拼图核心机制，人类可从样例直观推断。"

  - index: 2
    combo_spec: "D4/1+D7/0"
    name: "多标记定序旋转编码拼图"
