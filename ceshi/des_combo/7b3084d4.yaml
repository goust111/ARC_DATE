combos:
  - index: 1
    combo_spec: "D1/1+D8/0"
    name: "凹凸互锁不规则分割拼图"
    description: "拼图块沿不规则分割线切开（非直线tab），每块边缘有凹凸齿形。solver需识别凹凸互补的边缘对进行匹配拼合，而非简单矩形对齐。锚定块标记仍在(0,0)，但拼合时必须凹凸咬合。"
