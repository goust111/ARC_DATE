    description: "网格最外圈像素用作控制区域。边缘上的红色像素指示反射轴所在的行/列号（如顶部边缘第5列有红像素→第5列为垂直反射轴）。同时，边缘的某个角落区域包含图例块，用小型示例展示'标记→反射'的映射关系。solver需先读取图例理解规则，再从边缘标记中读取轴位置。"
