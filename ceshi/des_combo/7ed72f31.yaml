task_id: "7ed72f31"
combos:
  - index: 1
    combo_spec: "D1/0+D8/0"
    name: "旋转变换+L形双轴标记"
    description: "红色标记形成L形结构，定义两条正交轴。精灵不再做镜像反射，而是围绕L形拐角进行90度旋转变换。L形的两臂方向决定旋转方向（顺时针/逆时针）。输入中每个L形标记附近的精灵被旋转90度后绘制到背景上。"
    existing_code:
      - "D1/0"
      - "D8/0"
    reason: "旋转变换天然需要'中心点+方向'信息，L形标记恰好同时提供旋转中心（拐角）和旋转方向（两臂朝向），两个维度产生紧密耦合的推理需求。"

  - index: 2
    combo_spec: "D1/4+D5/1"
    name: "颜色驱动变换类型+多色标记编码"
    description: "标记颜色不再固定为红色，而是使用多种颜色（红/蓝/绿），每种颜色同时编码两层信息：（1）该像素是标记而非精灵；（2）该标记触发的变换类型——红色标记→水平镜像，蓝色标记→垂直镜像，绿色标记→90度旋转。solver需先从示例中推断颜色-变换映射，再对每个标记应用对应变换。"
    existing_code:
      - "D1/4"
      - "D5/1"
    reason: "D1/4单独时颜色决定反射类型但标记仍为红色（矛盾），D5/1单独时多色标记仅编码轴方向但变换仍为反射。组合后颜色成为统一的'变换指令编码'，推理链变为：识别多色标记→推断颜色映射→分别执行不同变换。"

  - index: 3
    combo_spec: "D2/0+D3/1"
    name: "边界检测轴+分离平行标记"
    description: "精灵的反射轴不再由红色像素直接标注，而是由精灵贴近其外接矩形的哪条边决定。同时，红色标记线与精灵分离（间隔1-3像素）且平行，标记线的存在仅'激活'最近的精灵进行反射，但实际反射轴由精灵自身的边界贴合方向决定。红线间距编码反射距离偏移量。"
    existing_code:
      - "D2/0"
      - "D3/1"
    reason: "两个维度都修改'轴从哪来'的推理，组合后solver需要两步推断：（1）红线激活哪个精灵（空间邻近性），（2）精灵自身边界决定反射方向。单独D2/0不需要红线，单独D3/1红线直接定义轴——组合产生'激活信号+自推断轴'的新推理模式。"

  - index: 4
