      - "D2/3"
      - "D15/0"
    reason: "两者都利用网格边缘空间但功能不同——D2/3用边缘编码轴位置，D15/0用边缘编码规则图例。组合后边缘同时承载两类信息，solver需区分'哪些边缘像素是轴标记、哪些是图例'，增加了解码复杂度。"

  - index: 5
