    name: "边框匹配+终点色桥梁"
    description: "方块用不同边框颜色标识（内部填充为统一公共色），控制像素匹配边框颜色确定访问顺序。桥梁使用终点方块的边框颜色绘制而非起点方块。解题者需同时理解：(1) 匹配目标从内部色转为边框色；(2) 桥梁着色归属从源端翻转为终端。两个变化叠加后，颜色推理链完全重构——控制像素找到的是边框色对应的方块，画出的桥梁却是下一个方块的边框色。"
    existing_code:
      - "D1/0"
      - "D5/0"
    reason: "匹配条件和桥梁着色是推理链中紧密耦合的两个环节。单独改匹配或单独改桥梁色各自只改变一步推理，但组合后解题者必须同时在'找方块'和'涂桥梁'两个阶段都使用边框色，且边框色的语义角色在两步中不同（匹配=当前方块边框 vs 绘制=下一个方块边框），产生显著的推理交互。"

